# main への push と、pull request のたびに、手元と同じ検査を流す (docs/rules/common.md の「完了の前に確かめること」のうち、自動でできるもの)。
# pytest は見本の集計と Chromium での画面操作も検査する。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.12" # Dockerfile の Python に合わせる
          enable-cache: true
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: ブラウザテスト用の Chromium を準備
        run: uv run --locked playwright install --with-deps --only-shell chromium
      - name: Pull request の機械チェック
        if: github.event_name == 'pull_request'
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check pr
      - name: main の全量チェック
        if: github.event_name == 'push'
        run: scripts/check main
