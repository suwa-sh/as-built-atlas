# 版のタグ (v1.2.3 の形) を push したら、配布物のイメージを作って ghcr.io に出す。
# 出すタグは、版 (1.2.3) と latest の 2 つ。分析リポジトリは、既定で latest を使う (abatlas/templates/compose.yaml)。
# 手順は docs/rules/release.md。
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.12" # Dockerfile の Python に合わせる
          enable-cache: false
      - name: タグの版が、pyproject.toml の版と同じか
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(uv version --short)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::タグ $TAG が、pyproject.toml の版 ($want) と違います"
            exit 1
          fi
      - name: 依存を入れる
        run: uv sync --locked --dev
      - name: ブラウザテスト用の Chromium を準備
        run: uv run --locked playwright install --with-deps --only-shell chromium
      - name: テスト
        run: scripts/check main test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: 版を決める
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache-filters: os-updates
          outputs: type=oci,dest=${{ runner.temp }}/release,tar=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: 検査対象の OCI イメージを保存する
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0

  scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: gitleaks git --log-opts="--all --diff-merges=first-parent" --redact --no-banner .
      - run: uv run --isolated --locked --only-group security python scripts/scan.py lock
      - name: 検査対象の OCI イメージを受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # 空の ID を渡すと全 artifact を取得するので、ID が無ければ入力エラーで止める。
          artifact-ids: ${{ needs.image.outputs.artifact-id || 'missing-artifact-id' }}
          path: ${{ runner.temp }}/release
      - name: 配布する両アーキテクチャを検査する
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          for arch in amd64 arm64; do
            archive="$RUNNER_TEMP/$arch.tar"
            skopeo --override-os linux --override-arch "$arch" copy \
              "oci:$RUNNER_TEMP/release" "docker-archive:$archive"
            uv run --isolated --locked --only-group security python scripts/scan.py archive "$archive" --arch "$arch"
            rm "$archive"
          done

  publish:
    needs: [image, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - name: 検査済みの OCI イメージを受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # 空の ID を渡すと全 artifact を取得するので、ID が無ければ入力エラーで止める。
          artifact-ids: ${{ needs.image.outputs.artifact-id || 'missing-artifact-id' }}
          path: ${{ runner.temp }}/release
      - name: 公開するイメージの digest をビルド結果と照合する
        env:
          EXPECTED_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo inspect --raw "oci:$RUNNER_TEMP/release" > "$RUNNER_TEMP/manifest.json"
          test "$(skopeo manifest-digest "$RUNNER_TEMP/manifest.json")" = "$EXPECTED_DIGEST"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 検査したイメージに配布タグを付ける
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for tag in "${TAG#v}" latest; do
            skopeo copy --all --preserve-digests "oci:$RUNNER_TEMP/release" "docker://$IMAGE:$tag"
          done
