# Plugin selection generated by qlty init. Gitleaks and Trivy run in scripts/check.
config_version = "0"

exclude_patterns = [
  ".agents/agents/**",
  ".vscode/**",
  ".claude/**",
  ".codex/**",
  ".cursor/**",
  ".grok/**",
  ".github/agents/**",
  "examples/*-atlas/**",
  "examples/kotori-books/**",
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/tests/**",
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
  "format",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "markdownlint"
drivers = ["lint", "format"]

[[plugin]]
name = "sqlfluff"
drivers = ["lint", "fix"]

# The bundled drivers pass --dialect ansi, overriding the project's DuckDB dialect.
[plugins.definitions.sqlfluff.drivers.lint]
# SQLFluff の構文エラー (PRS) には、Qlty の JSON パーサーが要求する fixes がない。
script = "sqlfluff lint ${target} --format github-annotation-native --nofail --dialect duckdb"
output_format = "regex"
output_regex = '(?m)^::(?:warning|error|notice) title=SQLFluff,file=(?P<path>.*?),line=(?P<line>[0-9]+),col=(?P<col>[0-9]+)(?:,[^\r\n]*?)?::(?P<code>[^: ]+): (?P<message>[^\r\n]+)'

[plugins.definitions.sqlfluff.drivers.fix]
script = "sqlfluff fix --disable-progress-bar --quiet --dialect duckdb ${target}"

# Assertions are the test oracle in pytest and in the browser regression tests.
[[ignore]]
file_patterns = ["tests/**"]
rules = ["bandit:B101"]

[[plugin]]
name = "prettier"
drivers = ["format"]

[plugins.definitions.prettier]
file_types = ["javascript", "css", "html", "json", "yaml"]

[[plugin]]
name = "biome"
drivers = ["lint"]

[plugins.definitions.biome]
file_types = ["javascript", "css", "html", "json"]

[[plugin]]
name = "yamllint"

[[plugin]]
name = "shfmt"

[[plugin]]
name = "dockerfmt"

# This fixture deliberately contains invalid JSON to exercise the hook's fallback.
[[exclude]]
file_patterns = [".agents/skills/mid-harness/scripts/hook-fixtures/allow-unparseable-passthrough.json"]
plugins = ["prettier", "biome"]

[file_types.check_shell]
globs = ["scripts/check", ".githooks/pre-commit"]

[plugins.definitions.shellcheck]
file_types = ["shell", "check_shell"]

[plugins.definitions.shfmt]
file_types = ["shell", "check_shell"]
