# プロファイル: Vue Router の画面を持つシステム (画面 → 画面の部品 → 状態の置き場 → API の呼び出し → バックエンド)
# 画面の定義 (ルーティング) をコードの中に書く作り。バックエンドは別のリポジトリか、分析の範囲の外にある前提。
# ツールが読む構造化データ。エージェント向けの説明は context.md。
format_version: 1
id: ui-vue-router
version: "0.4.0"
label: "Vue Router (screen / shell → component → store → API client → backend API)"

# label / tier / hierarchy.notes の text は画面に出る。"{id}" は用語集 (schema/vocab/terms.yaml) の呼び名に置き換わる
layers:
  - id: screen
    tier: frontend
    label: screen (Vue Router の route 1 つ)
    role: entry
    stack: [Vue, Vue Router]
    invokes_next: "route の `component` (と `components`) に書いたコンポーネント。入れ子の route (`children`) のコンポーネントも、この画面の中で描かれるので、ここから辿る。アプリ全体の枠 (App.vue、共通のレイアウト、ルーターの共通の guard) は別の入口 (shell) なので、ここからは辿らない"
    io: [external_api]
  - id: shell
    tier: frontend
    label: shell (アプリ全体の枠。App.vue、共通のレイアウト、枠が描く共通の component、ルーターの共通の guard)
    role: entry
    stack: [Vue, Vue Router]
    invokes_next: "枠のファイル自身が呼ぶ store と、その先。枠が描く共通の部品 (上のバー、メニュー、通知、再ログインの小窓など) は、部品ごとに別の入口 (shell) なので、根のコンポーネントやレイアウトの入口からは辿らない。部品の入口では、その部品が描くコンポーネントと、呼ぶ store を辿る。`<router-view>` の中身は、包まれる側の入口 (screen) なので辿らない"
    io: [external_api]
  - id: part
    tier: frontend
    label: part (registry から選ばれて描かれる component)
    role: entry
    stack: [Vue]
    invokes_next: "部品の component が描画する子の component と、呼ぶ composable と store。部品を描く側 (screen や、登録表を引く component) は辿らない"
    io: [external_api]
  - id: component
    tier: frontend
    label: component (Vue component、composable、画面側の補助の関数)
    stack: [Vue, Composition API]
    invokes_next: "子のコンポーネントと composable (`useXxx`) の呼び出し。store の関数 (`useXxxStore().load(...)`) の呼び出し。store を通さずに、API を呼ぶ関数を直接呼ぶこともある"
    io: [external_api]
  - id: store
    tier: frontend
    label: store (Pinia / Vuex。状態と、API を呼ぶ action)
    stack: [Pinia, Vuex]
    invokes_next: "API を呼ぶ関数 (生成された SDK の関数、axios や fetch を包んだ自前の関数) の呼び出し。別の store の呼び出し"
    io: [external_api]
  - id: api_client
    tier: frontend
    label: API client (HTTP や外部のライブラリを包む自前の関数)
    stack: [axios, fetch]
    invokes_next: "HTTP のライブラリ (axios、fetch) や、生成された SDK の呼び出し (ここから先は boundary)"
    io: [external_api]
  - id: external
    tier: frontend
    label: external library / SDK (boundary)
    role: boundary
    stack: [axios, fetch, generated API SDK]
    io: [external_api]

hierarchy:
  level_labels: [section+, screen]   # URL の区切りがそのまま段。最後の段だけが screen、それより前は section
  derivation: "route の `path` を '/' で区切って段にする。実行時に値が入る段 (`:id`) はそのまま残す。全部の画面に付く共通の段 (例: 省ける先頭の `:tenant?`) は落としてよい。URL が / だけの route は `(root)` という 1 段にする。入れ子の route (`children`) は、親の画面に含める (別の入口にしない)。枠 (shell) は `/(shell)` で始める (`/(shell)/app`、`/(shell)/layout/<名前>`、`/(shell)/part/<名前>`、`/(shell)/guard`)"
  entry_labels:   # 枠の入口は、詳細のページで screen ではなく shell と呼ぶ
    - { contains: "(shell)", label: shell }
    - { contains: "(part)", label: part }
  notes:   # 段の名前に残る Vue Router の書き方を、画面で説明する
    - { contains: ":", text: "コロンで始まる段 (例: :id) は、実行時に値が入る場所。後ろの ? は省ける段、かっこは値の形 (正規表現)。対象のソースの書き方をそのまま出している" }
    - { contains: "(shell)", text: "(shell) で始まる {entry} は、アプリ全体の枠。どの画面を開いても動く" }
    - { contains: "(part)", text: "(part) で始まる {entry} は、登録表から選ばれて描かれる component。後ろの段は、登録表の名前と、選ぶときの名前" }

extractors:
  - name: vue-routes
    run: abatlas-extract ast
    layer: screen
    hint: "画面の定義 (routes の配列) があるファイルを探して、files に書く (`createRouter` に渡す `routes` を辿る。`routes.ts`、`router/index.ts` など)。JavaScript なら language を javascript にする。既定の規則は「変数に入れた配列の直下にある、name と path を文字で書いたオブジェクト」を 1 画面にする。配列を `createRouter({routes: [...]})` や `export default [...]` に直接書くシステムでは、rule と unresolved の `inside` を書き換える。name を書かないシステムでは、rule から name の条件を外し、fields.name を \"{PATH}\" にする。全部の画面に付く共通の段は segments.drop で落とす。unresolved に出た場所 (別のファイルの定義、定数で書いた name、関数が作る定義、children) は、定義を読んで、入口を `abatlas-extract listed` で足す"
    params:
      files: ["src/routes/**/*.ts", "src/router/**/*.ts"]
      language: typescript
      rule:   # 変数に入れた配列の直下にある、name と path を文字で書いたオブジェクト。入れ子 (children) の中は拾わない
        kind: object
        inside: { kind: array, inside: { kind: variable_declarator } }
        all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: "^name$" }
                - has: { field: value, kind: string, pattern: $NAME }
          - has:
              kind: pair
              all:
                - has: { field: key, regex: "^path$" }
                - has: { field: value, kind: string, pattern: $PATH }
      fields:
        path: "{PATH}"
        name: "{NAME}"
        attributes: { route_name: "{NAME}", route_path: "{PATH}" }
      segments:
        empty: "(root)"
      id:
        # id は結果のファイル名になるので記号を持てない。段の種類を「_ + 1 文字」の印で表し、名前の中の _ は 2 つ重ねる (ui-nextjs と同じ考え方)
        #   /flows/id → flows.id      /flows/:id → flows.id_d      /flows/:tab? → flows.tab_o      /docs/:path(.*)? → docs.path_o      / → root_r
        replace:
          - { pattern: "_", with: "__" }                                              # 名前の中の _ を重ねる (最初に行う)
          - { pattern: "^:([A-Za-z0-9_]+)(\\(.*\\))?[?*]$", with: "\\1_o" }       # :tab? / :path(.*)? / :rest* → 省ける段
          - { pattern: "^:([A-Za-z0-9_]+)(\\(.*\\))?\\+?$", with: "\\1_d" }       # :id / :id(\\d+) / :rest+   → 値が入る段
          - { pattern: "^\\(root\\)$", with: "root_r" }                              # URL が / だけの route (segments.empty)
          - { pattern: "[^A-Za-z0-9_-]", with: "" }                                  # 残りの記号を除く
      unresolved:   # 静的に読めない定義。入口にはせず、場所を知らせる
        any:
          - kind: identifier        # 別のファイルで定義して、名前で並べた route
            inside: { kind: array, inside: { kind: variable_declarator } }
          - kind: spread_element    # 展開した配列 (...otherRoutes)
            inside: { kind: array, inside: { kind: variable_declarator } }
          - kind: call_expression   # 関数が作る route
            inside: { kind: array, inside: { kind: variable_declarator } }
          - kind: pair              # name / path を文字で書いていない route と、入れ子の route
            all:
              - has: { field: key, regex: "^(name|path|children)$" }
              - not: { has: { field: value, kind: string } }

# 登録表から選ばれて描かれる component (層 part) は、抽出器では取れない。分けるときは、入口を見つける agent が、
# `abatlas-extract listed` (名前は agent-listed-part、layer: part) で足す。決まりは context.md の「登録表から選ばれて描かれる部品」

marts: []
