version: 2

# プロファイル (batch-kestra) が足す mart。build が分析リポジトリの analysis/data/dbt/models/profile/ に合成する (OSS 所有)
models:
  - name: mart_namespace_summary
    description: "Kestra の namespace ごとの Flow の数・{analyzed} の数・{data_access} の内訳 (rdb / filesystem / external_api)"
    meta:
      abatlas:
        origin: profile
        view: table
        level: path
        subject: entry
        title: "namespace {summary}"
        hint: "1 行が namespace。Flow の数と {analyzed} の数、{kind} 別の {data_access} の件数"
        attach: level1
        keys: { id: namespace, label: namespace }
        labels:
          {
            namespace: namespace,
            flows: Flow,
            analyzed_flows: "{analyzed}",
            rdb_io: "RDB {data_access}",
            filesystem_io: "filesystem {data_access}",
            external_api_io: "{external} {call}",
          }
