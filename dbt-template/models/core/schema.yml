version: 2

# コア mart (OSS 所有。build が分析リポジトリの analysis/data/dbt/models/core/ に合成する)

# mart の宣言。`meta.abatlas` が webapp / MCP への契約。webapp は宣言しか読まない (mart の名前を知らない)。
#   origin:  core | profile | repo   (3 層のどれか)
#   view:    table | matrix | graph | layers | sequence | tree | stat   (表示の種類。コアで固定した 7 つ)
#   level:   entry | path  (入口ごとの表か、階層パスで畳める表か)
#   subject: 任意。この表が「何について」の表か。webapp のナビの区分になる (その区分の表が 1 つも無ければ区分は出ない)
#              entry = 入口 / data = データ (読み書き) / external = 外部接続 / frame = 共有処理 (部品) / analysis = 分析の状態
#   title:   任意。人向けの論理名 (見出しに出る。無ければ物理名)
#   hint:    任意。「この図の読み方」の 1 行 (無ければ表示の種類ごとの既定文)
#   show:    任意。表に出す列とその順 (無ければ全部の列)。左から概念を絞り込む順に並べる (layer → kind → 個々のもの → その中身と数)
#   attach:  階層ページのどの段に貼るか (any = どの段でも、root = 最上位だけ、level1〜level5 = その段だけ)
#   tags:    任意。monitor を付けると分析の状態の画面にも載る。
#            within は「入口を包む入口」の表の印 (table で keys.path / keys.members / keys.order を持つ。1 行 = 包まれる入口 × 包む入口。
#            path は包まれる入口のパス、members は包む入口のパス 1 つ (連ねない)、order は外側からの順の列)。
#            入口の詳細の画面が「この入口を包む入口」「この入口の中で動く入口」のカードに使う。subject は付けない (入口の一覧の表と取り違えないため)
#   keys:    表示の種類ごとに決まる列の対応 (abatlas build が manifest と実際の列を突き合わせて検査する)
#
#   全 view:  path は任意。入口の階層パスの列。入口の画面はこの列 (無ければ matrix の row、stat / tree の group) で節に絞る。
#             列の名前が level1〜level5 ならその段の名前で一致。段を名指しした attach の mart は id / group をその段の名前で引く
#   table:    id            (label / summary / members は任意。order は任意: 行の並び順の列。画面が行を順に並べたいときに使う。
#             source は任意: 定義場所 (ファイル) の列。共有処理の表が持つと、経路の画面は名前に加えて定義場所でも処理を照合する)
#   matrix:   row col value (flag は任意: 真なら不明を含む印。kind は任意: データの種類の列。画面は種類ごとに表を分け、
#             畳んだ節の値は API の pivot が集計する: 操作の 1 文字だけの文字列は和集合 (語彙の並び順)、数値は和、それ以外は値を並べる)
#   graph:    from to       (label / status は任意。status が unknown の辺は点線)
#   layers:   from to       (層のつながりの図。構成のページと同じ図を出す。from = 層の id、to = 層の id か "/" + データの種類。label は任意: 箇所の数。status は任意。
#             箱の並びと枠はプロファイルの layers から取る。層どうしのつながりの表だけが使い、構成のページはこの view の表を引く)
#   sequence: group seq from to (label / status は任意。group ごとに 1 図。node は任意: そのメッセージを起こした処理の id で、tree の id と対応する列。
#             evidence は任意: 根拠の場所 (file:line) の列。画面は node と evidence で「入口から終点までの経路」を引く)
#   tree:     id parent label (group / detail は任意。source は任意: 定義場所 (file:line) の列。tag は任意: 処理の種類の短い札の列)
#   stat:     value         (group / total は任意。total があれば value / total の割合を出す)

#   文字 (description / title / hint / labels / filters の label) の中の "{id}" は、用語集 (schema/vocab/terms.yaml) の呼び名に置き換わる (文字どおりの {id} は \{id} と書く)。
#   core の title と labels は "{id}" と記号・単位だけで組む (呼び名を直接書かない。tests/test_terms.py が検査する)

models:
  - name: mart_entry_overview
    description: "{entry} ごとの {overview}。{analyzed} か、{summary}、{frame} の数、{data_access} の数、{fact} / {interpretation} / {unknown} の件数"
    meta:
      abatlas:
        origin: core
        view: table
        level: entry
        subject: entry
        title: "{entry} {overview}"
        hint: "1 行が {entry} 1 件。{analyzed} なら {summary} と件数が入る"
        attach: any
        keys: { id: entry_id, path: path, label: name, summary: summary }
        show: [layer, path, name, summary, analyzed, io_count, unknown_count, status]
        labels: { path: "{entry}", name: "{name}", summary: "{summary}", analyzed: "{analyzed}", io_count: "{data_access}", unknown_count: "{unknown}", layer: "{entry_layer}", status: "{approval}", frame_count: "{frame}",
                  claim_count: "{claim}", fact_count: "{fact}", interpretation_count: "{interpretation}", run_cost_usd: "{cost} (USD)", run_duration_s: "{duration} (s)",
                  analyzed_at: "{analyzed_at}", target_commit: "{target_commit}", reviewed_findings_open: "{open_findings}",
                  profile_version: "{profile_version}", profile_stale: "{stale}" }
        filters:
          - { label: "{analyzed}", where: { analyzed: "true" } }
          - { label: "{not_analyzed}", where: { analyzed: "false" } }
          - { label: "{has_unknown}", where: { unknown_count__min: 1 } }
          - { label: "{stale}", where: { profile_stale: "true" } }
    columns:
      - name: entry_id
        tests: [not_null, unique]

  - name: mart_entry_complexity
    description: "{entry} ごとの {complexity}。1 つの点数にまとめず、数を並べる: {frame} の数、{call_depth}、{layer_crossing}、{datastore} の数 (うち {write} するもの)、{external} の数、{shared_frame} の数と {sharing_entry} の数、{unknown} の数。{analyzed} の {entry} だけ"
    meta:
      abatlas:
        origin: core
        view: table
        level: entry
        subject: analysis
        title: "{complexity}"
        hint: "1 行が {analyzed} の {entry} 1 件。直すときに一緒に確かめるものが多い順 ({sharing_entry} → {write} する {datastore} → {frame})。同じものは 1 回だけ数える"
        attach: any
        tags: [monitor]
        keys: { id: entry_id, path: path, label: name }
        show: [path, sharing_entry_count, shared_frame_count, written_datastore_count, datastore_count, external_count, frame_count, max_depth, layer_crossings]   # unknown_count は出さない (すぐ下の {unknown} の表にある。列は API で読める)
        labels: { path: "{entry}", name: "{name}", layer: "{entry_layer}", frame_count: "{frame}", max_depth: "{call_depth}", layer_crossings: "{layer_crossing}",
                  datastore_count: "{datastore}", written_datastore_count: "{datastore} ({write})", external_count: "{external}",
                  shared_frame_count: "{shared_frame}", sharing_entry_count: "{sharing_entry}", unknown_count: "{unknown}" }
    columns:
      - name: entry_id
        tests: [not_null, unique]

  - name: mart_progress
    description: "{progress}。{approved} の {entry} に対する {analyzed} の数 (階層の {level} 1 ごと)。run の記録があれば実績の {cost} と残りの見積もり"
    meta:
      abatlas:
        origin: core
        view: stat
        level: path
        subject: analysis
        title: "{progress}"
        hint: "{approved} の {entry} のうち {analyzed} の数。棒は割合"
        attach: any
        tags: [monitor]
        keys: { group: level1, value: analyzed, total: approved }
        labels: { level1: "{level} 1", entries: "{entry}", approved: "{approved}", analyzed: "{analyzed}", candidate: "{candidate}", rejected: "{rejected}", runs_with_cost: "{runs_with_cost}",
                  cost_usd: "{cost} (USD)", duration_s: "{duration} (s)", estimated_remaining_cost_usd: "{remaining} {cost} (USD)", estimated_remaining_duration_s: "{remaining} {duration} (s)" }

  - name: mart_quality_unknowns
    description: "{unknown} の {claim} を {reason} 別に数える ({entry} ごと)"
    meta:
      abatlas:
        origin: core
        view: table
        level: entry
        subject: analysis
        title: "{unknown}"
        hint: "分析で確かめられなかった {claim} を、{reason} ごとに数えたもの。wheres は分析結果の中のその位置"
        attach: any
        tags: [monitor]
        keys: { id: entry_id, path: path }
        show: [path, reason, unknown_count, wheres]
        labels: { path: "{entry}", reason: "{reason}", unknown_count: "{unknown}", wheres: "{claim}" }

  - name: mart_data_access
    description: "{data_access}。{entry} の階層 × {datastore} の階層。ops は {kind} ごとの操作の 1 文字 (RDB なら C/R/U/D、ファイルなら R/W/A/D/L)"
    meta:
      abatlas:
        origin: core
        view: matrix
        level: path
        subject: data
        title: "{data_access}"
        hint: "行が {entry}、列が {datastore}。▸ を押すと配下を開く。畳んだ行・列の値は配下の和。点線のセルは {unknown} を含む"
        attach: any
        keys: { row: path, col: resource_path, value: ops, flag: has_unknown, kind: kind }
        labels: { path: "{entry}", resource_path: "{datastore}", ops: "{ops}", has_unknown: "{has_unknown}", kind: "{kind}", io_count: "{call_sites}" }

  - name: mart_dataflow
    description: "{data_flow} (graph)。{read} する {datastore} → {entry} → {write} する {datastore}"
    meta:
      abatlas:
        origin: core
        view: graph
        level: entry
        subject: entry
        title: "{data_flow}"
        hint: 左から右へ流れる。色の意味は図の下の凡例。箱が多いときは絞り込み・拡大縮小・全画面。箱や矢印に触れるとつながりだけ濃く残る
        attach: any
        keys: { from: from_node, to: to_node, label: op, status: status, path: path }

  - name: mart_layer_flow
    description: "{layer_deps} (layers)。分析結果にある {call} と {data_access} を、{layer} の単位に集めたもの。to_node が / で始まる行は、{datastore} の {kind} への {data_access}"
    meta:
      abatlas:
        origin: core
        view: layers
        level: path
        title: "{layer_deps}"
        hint: "{architecture} のページの図の線。1 行 = {layer} から {layer} への {call}、または {layer} から {datastore} の {kind} への {data_access}。unknowns はそのうち {unknown} の {call_sites} で、1 つでもあれば status が unknown (図は点線)"
        attach: root
        keys: { from: from_node, to: to_node, label: calls, status: status }
        labels: { from_node: "{caller} {layer}", to_node: "{callee} {layer} / {kind}", edge_kind: "{edge_kind}", calls: "{call_sites}", entries: "{entry}", unknowns: "{unknown}", status: "{status}" }

  - name: mart_callstack
    description: "{call_tree} (tree)。{entry} ごとの {frame} (callstack のフレーム) と親子関係"
    meta:
      abatlas:
        origin: core
        view: tree
        level: entry
        subject: entry
        title: "{call_tree}"
        hint: "{entry} から {call} を辿ったツリー。名前の横のタグは {layer} と {kind}"
        attach: any
        keys: { id: frame_id, parent: caller_id, label: name, group: path, detail: summary, path: path, source: source, tag: layer }
        labels: { name: "{frame}", layer: "{layer}", kind: "{kind}", source: "{source}", summary: "{summary}", io_count: "{data_access}", call_status: "{call} {status}", summary_status: "{summary} {status}" }

  - name: mart_sequence
    description: "{sequence} ({entry} ごと)。{caller} → {frame}、{frame} → {datastore} の {message} を callstack の順に並べる"
    meta:
      abatlas:
        origin: core
        view: sequence
        level: entry
        subject: entry
        title: "{sequence}"
        hint: 上から下へ時系列。色の意味は図の下の凡例。参加者が多いときは絞り込み・拡大縮小・全画面。箱や矢印に触れるとつながりだけ濃く残る
        attach: any
        keys: { group: path, seq: seq, from: from_node, to: to_node, label: message, status: status, path: path, node: frame_id, evidence: evidence }
        labels: { from_node: "{caller}", to_node: "{callee}", message: "{message}", status: "{status}", reason: "{reason}", evidence: "{evidence}" }

  - name: mart_external_if
    description: "{external}。{host} ごとに、それを呼ぶ {entry}"
    meta:
      abatlas:
        origin: core
        view: table
        level: path
        subject: external
        title: "{external}"
        hint: "1 行が {external} の {host} (と {api_path})。entries はそれを呼ぶ {entry}"
        attach: any
        keys: { id: host, label: host, members: entries }
        show: [host, api_path, entry_count, has_unknown]
        labels: { host: "{host}", api_path: "{api_path}", entry_count: "{referenced_by}", entries: "{entry}", has_unknown: "{has_unknown}" }
        filters:
          - { label: "{has_unknown}", where: { has_unknown: "true" } }

  - name: mart_entry_within
    description: "{entry} を表示するときに、その外側で一緒に動く {entry} ({enclosing})。例: page を表示すると、それを包む layout も動く。1 行が、内側と外側の組 1 つ。外側と内側は別々に分析し、{frame} と {data_access} は足し合わせない"
    meta:
      abatlas:
        origin: core
        view: table
        level: entry
        title: "{enclosing}"
        hint: "1 行が、{entry} と、その外側で一緒に動く {entry} ({enclosing}) 1 つ。例: page と、それを包む layout"
        attach: any
        tags: [within]
        keys: { id: entry_id, path: path, label: name, members: within_path, order: ord }
        show: [layer, path, ord, within_path, within_status]
        labels: { path: "{entry}", name: "{name}", layer: "{entry_layer}", ord: "{order}", within_path: "{enclosing}", within_name: "{enclosing} {name}", within_status: "{enclosing} {approval}" }
    columns:
      - name: entry_id
        tests: [not_null]
      - name: within_path
        tests: [not_null]

  - name: mart_shared_frames
    description: "{shared_frame}。2 件以上の {entry} から呼ばれる同じ {frame} (スクリプト・skill)"
    meta:
      abatlas:
        origin: core
        view: table
        level: path
        subject: frame
        title: "{shared_frame}"
        hint: "1 行が {shared_frame} 1 つ。entries はそれを呼ぶ {entry}。直すと全部に影響する"
        attach: any
        keys: { id: name, label: name, members: entries, source: source_file }
        show: [layer, name, source_file, entry_count]
        labels: { name: "{shared_frame}", layer: "{layer}", source_file: "{source}", entry_count: "{referenced_by}", entries: "{entry}" }
