version: 2

models:
  - name: stg_entries
    description: 入口一覧 (entry-list の entries)。階層パスを段に分解した列を持つ
    columns:
      - name: entry_id
        tests: [not_null, unique]
  - name: stg_results
    description: 分析結果 1 件 = 1 行 (entry_id で一意。ETL も検査する)
    columns:
      - name: entry_id
        tests: [not_null, unique]
  - name: stg_frames
    columns:
      - name: entry_id
        tests: [not_null]
  - name: stg_entry_within
    description: 入口を包む入口 (entry-list の entries[].within)。包まれる入口 × 包む入口 で 1 行
    columns:
      - name: entry_id
        tests: [not_null]
  - name: stg_io
  - name: stg_claims
  - name: stg_evidence
    description: 主張ごとの根拠の場所 (file と line)。claim_path は分析結果の中の主張の位置
