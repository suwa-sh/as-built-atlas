version: 2

models:
  - name: stg_entries
    description: 入口一覧 (entry-list の entries)。階層パスを段に分解した列を持つ
    columns:
      - name: entry_id
        tests: [not_null, unique]
  - name: stg_results
    description: 分析結果 1 件 = 1 行 (entry_id で一意。ETL も検査する)
    columns:
      - name: entry_id
        tests: [not_null, unique]
  - name: stg_frames
    columns:
      - name: entry_id
        tests: [not_null]
  - name: stg_entry_within
    description: 入口を包む入口 (entry-list の entries[].within)。包まれる入口 × 包む入口 で 1 行
    columns:
      - name: entry_id
        tests: [not_null]
  - name: stg_io
    description: 読み書き (分析結果の io)。is_repeat は、同じ入口の中で、同じ処理をもう一度書いたフレームの読み書き (箇所の数を数えるときに、除く)
  - name: stg_claims
  - name: stg_evidence
    description: 主張ごとの根拠の場所 (file と line)。claim_path は分析結果の中の主張の位置
  - name: stg_io_fields
    description: I/O が触る列 (分析結果の io[].fields)。使い方ごとに use_read / use_write / use_filter。is_repeat は、stg_io と同じ
  - name: stg_links
    description: フレームから、ほかの入口へのつながり。target_entry_id は、入口の一覧と突き合わせた結果 (無ければ空)
  - name: stg_guards
    description: フレームで行う権限の確認
  - name: stg_settings
    description: フレームの動きを変える設定
  - name: stg_rules
    description: フレームにある業務のルール
  - name: stg_tests
    description: フレームを通るテスト
  - name: stg_data_dictionary
    description: データの辞書 (列ごとの区分)。集計に使うのは status が approved の行
  - name: stg_target_files
    description: 対象の範囲にあるファイル。対象の clone が読めないときは空
