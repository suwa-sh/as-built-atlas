# core の dbt テンプレート (配布物の中にある。build が analysis/data/dbt/ に合成する)。列の型は abatlas/etl.py の COLUMNS から全列を明示する (空列が integer に推論されるのを防ぐ)
name: abatlas
version: 0.0.0
config-version: 2
profile: abatlas
model-paths:
- models
seed-paths:
- seeds
macro-paths:
- macros
target-path: target
clean-targets:
- target
- dbt_packages
seeds:
  abatlas:
    +schema: seed
    +quote_columns: false
    entries:
      +column_types:
        entry_id: text
        path: text
        name: text
        layer: text
        status: text
        extractor: text
        source_file: text
        source_line: integer
        depth: integer
    results:
      +column_types:
        entry_id: text
        path: text
        layer: text
        target_repo: text
        target_commit: text
        target_scope: text
        profile_id: text
        profile_version: text
        profile_stale: boolean
        skill_version: text
        model: text
        analyzed_at: text
        analyst: text
        reviewed_findings_open: integer
        run_cost_usd: double
        run_duration_s: double
        run_by: text
        summary_status: text
        summary: text
        frame_count: integer
        tests_analyzed: boolean
        aspects_analyzed: boolean
    frames:
      +column_types:
        entry_id: text
        frame_id: text
        seq: integer
        layer: text
        kind: text
        name: text
        source_file: text
        source_line: integer
        caller_id: text
        call_status: text
        call_reason: text
        summary_status: text
        summary: text
        summary_reason: text
        call_when: text
        call_condition: text
        boundary: boolean
    io:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        op: text
        op_letter: text
        op_rank: integer
        op_direction: text
        kind: text
        kind_label: text
        lv_host: text
        lv_dbms: text
        lv_database: text
        lv_schema: text
        lv_table: text
        lv_instance: text
        lv_namespace: text
        lv_key_pattern: text
        lv_broker: text
        lv_topic: text
        lv_directory: text
        lv_file: text
        lv_account: text
        lv_bucket: text
        lv_prefix: text
        lv_object: text
        lv_path: text
        resource_path: text
        detail: text
        status: text
        reason: text
        note: text
    parameters:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        name: text
        value: text
        status: text
        reason: text
    claims:
      +column_types:
        entry_id: text
        claim_path: text
        status: text
        reason: text
        evidence_count: integer
        note: text
    evidence:
      +column_types:
        entry_id: text
        claim_path: text
        file: text
        line: integer
    entry_within:
      +column_types:
        entry_id: text
        ord: integer
        within_entry_id: text
    io_fields:
      +column_types:
        entry_id: text
        frame_id: text
        io_idx: integer
        idx: integer
        name: text
        use_read: boolean
        use_write: boolean
        use_filter: boolean
        set_to: text
        resource_path: text
        kind: text
        io_status: text
    links:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        kind: text
        target: text
        target_entry_id: text
        status: text
        reason: text
        note: text
    guards:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        kind: text
        value: text
        status: text
        reason: text
        note: text
    settings:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        name: text
        kind: text
        effect: text
        status: text
        reason: text
        note: text
    rules:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        kind: text
        value: text
        status: text
        reason: text
        note: text
    tests:
      +column_types:
        entry_id: text
        frame_id: text
        idx: integer
        name: text
        kind: text
        status: text
        reason: text
        note: text
    data_dictionary:
      +column_types:
        resource_path: text
        field: text
        category: text
        category_label: text
        sensitive: boolean
        status: text
        note: text
models:
  abatlas:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: mart
    profile:
      +materialized: table
      +schema: mart
    repo:
      +materialized: table
      +schema: mart
