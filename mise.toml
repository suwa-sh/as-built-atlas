[tools]
"github:qltysh/qlty" = "0.672.0"
gitleaks = "8.30.1"
trivy = "0.76.2"

[tasks.complexity]
description = "List source functions by descending cyclomatic complexity"
run = "uv run --script scripts/complexity.py"

[tasks.complexity-dbt]
description = "List compiled dbt models by JOIN, CTE and dependency counts"
run = "uv run --locked python scripts/dbt_complexity.py"
