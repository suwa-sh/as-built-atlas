# データの区分 (列ごと)。コアで固定。データの辞書 (analysis/data-dictionary.yaml) の category は、この key に限る。
#   label:       表示名
#   sensitive:   true なら、個人情報の流れの集計表に出す。false は「確かめた結果、当てはまらない」の印 (集計に出さない)
#   description: 当てはめ方
format_version: 1
categories:
  personal:
    label: personal
    sensitive: true
    description: 個人を特定できる情報、または特定の個人にひも付く情報 (氏名、メールアドレス、住所、電話番号、IP アドレス、利用者ごとの行動の記録)
  special:
    label: special category
    sensitive: true
    description: 取り扱いに特に配慮が要る個人の情報 (健康、信条、人種、犯罪の経歴、生体の情報など)
  credential:
    label: credential
    sensitive: true
    description: 認証に使う情報 (パスワードのハッシュ、API キー、トークン、秘密の質問の答え)
  financial:
    label: financial
    sensitive: true
    description: 個人の支払いの情報 (カード番号、口座、請求先)
  none:
    label: none
    sensitive: false
    description: 上のどれにも当てはまらない (確かめた結果)
