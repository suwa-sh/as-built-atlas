# 「不明」の理由 (コアで固定)。分析結果の項目が status: unknown のとき、必ずこのどれかを reason に書く。
# 自由文は note に書く。理由の種類を固定するのは、品質 mart で理由別の件数を決定的に出すため。
format_version: 1
reasons:
  not_traceable_in_repo:
    label: リポジトリから辿れない
    description: 接続先・ホスト・パスなどが、分析対象のリポジトリの中に書かれていない (環境変数・外部の設定・秘密情報)
  dynamic_dispatch:
    label: 実行時に決まる
    description: 呼び出し先やパスが実行時の値で組み立てられ、静的には 1 つに決まらない
  generated_at_runtime:
    label: 実行時に生成される
    description: 処理内容がテンプレートや LLM などで実行時に生成され、コードからは読めない
  binary_or_vendored:
    label: 読めない成果物
    description: バイナリ・難読化・外部から持ち込んだ成果物で、中身を読めない
  out_of_scope:
    label: 分析範囲の外
    description: 呼び出し先が分析対象の範囲 (作業定義の scope) の外にある
  ambiguous:
    label: 候補が複数ある
    description: 根拠を読んでも候補が複数あり、1 つに絞れない
  not_analyzed:
    label: 未分析
    description: 分析の手順がそこまで到達していない (時間切れ・打ち切り)
