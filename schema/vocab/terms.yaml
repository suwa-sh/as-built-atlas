# 画面に出す呼び名の用語集 (正本)。概念 1 つに呼び名 1 つ。
#   読み手は、分析した対象を保守するエンジニア。技術用語は英語のまま書き、分析結果や API に出てくる値と同じ綴りに揃える
#   (画面で見た語を、そのままコードや API の検索に使える)。説明の文と操作の言葉 (開く、畳む、コピー) は日本語のまま。
#   使い方:
#     - 画面のコード (abatlas/webapp) は呼び名を直接書かず、term("<id>") で引く (/meta の terms 経由)
#     - mart の宣言 (meta.abatlas の title / hint / labels / filters の label) は "{<id>}" と書く。build が呼び名に置き換えて配る
#       文字どおりの {<id>} を出したいときは \{<id>} と書く。データの種類の語彙 (resource-kinds.yaml の label) も同じ書き方で引く
#     - core の mart の title と labels は、"{<id>}" と記号・単位だけで組む (自由な言葉を書かない)
#   retired は使わなくなった呼び名 (正規表現)。画面のコードの文字列・core の宣言・プロファイルの表示項目に残っていたら、テストが落とす
#   検査は tests/test_terms.py
format_version: 1
terms:
  # ---- 構成
  architecture: { label: architecture }
  entry: { label: entry point }            # 画面、API、バッチの起点
  layer: { label: layer }                  # page、component、API route など (プロファイルの layers の 1 つ)
  tier: { label: tier }                    # frontend、backend など (プロファイルの layers[].tier)
  frame: { label: function }               # 呼び出しの 1 段 (callstack のフレーム)
  shared_frame: { label: shared function } # 2 つ以上の entry point から呼ばれる function
  datastore: { label: datastore }          # RDB、KVS、ファイルなど
  external: { label: external API }
  external_group: { label: external }       # architecture の図で、external API を入れる枠の名前
  kind: { label: kind }
  level: { label: level }                  # 階層の段
  # ---- つながり
  call_path: { label: call path }          # entry point から datastore までの道筋
  hop: { label: hop }                      # call path の上の function 1 つ
  target: { label: target }                # call path の着く先
  call: { label: call }
  caller: { label: caller }
  callee: { label: callee }
  call_sites: { label: occurrences }       # 呼び出し・読み書きがコードに書かれている箇所 (の数)。call sites は呼び出しだけを指すので使わない
  call_tree: { label: call tree }
  sequence: { label: sequence }
  message: { label: message }
  data_flow: { label: data flow }
  layer_deps: { label: layer dependencies }
  edge_kind: { label: edge kind }
  data_access: { label: data access }
  access_matrix: { label: access matrix }
  ops: { label: ops }
  read: { label: read }
  write: { label: write }
  referenced_by: { label: referenced by }  # それを使う entry point
  dependencies: { label: dependencies }    # entry point が使う datastore と external API
  enclosing: { label: outer entry point }      # ある entry point を表示するときに、外側で一緒に動く entry point (例: page を包む layout)
  nested: { label: inner entry point }         # その内側で動く entry point
  entry_layer: { label: entry layer }      # entry point が属する layer
  order: { label: order }
  host: { label: host }
  api_path: { label: path }
  # ---- 分析結果
  name: { label: name }
  title: { label: title }
  overview: { label: overview }
  summary: { label: summary }
  source: { label: source }                # 定義のあるファイルと行
  evidence: { label: evidence }            # 根拠のファイルと行
  claim: { label: claim }
  fact: { label: fact }
  interpretation: { label: interpretation }
  unknown: { label: unknown }
  has_unknown: { label: has unknown }
  status: { label: status }                # fact / interpretation / unknown のどれか
  reason: { label: reason }
  complexity: { label: complexity }
  call_depth: { label: call depth }        # entry point から、いちばん深い function までの段の数
  layer_crossing: { label: layer crossings }   # caller と layer が違う call の数
  sharing_entry: { label: shared with }   # 同じ shared function を通る、ほかの entry point の数
  # ---- 分析の進み
  analysis_status: { label: analysis status }
  progress: { label: progress }
  approval: { label: approval }            # approved / candidate / rejected のどれか
  approved: { label: approved }
  candidate: { label: candidate }
  rejected: { label: rejected }
  analyzed: { label: analyzed }
  not_analyzed: { label: not analyzed }
  analyzed_at: { label: analyzed at }
  target_commit: { label: target commit }
  open_findings: { label: open findings }
  profile: { label: profile }
  profile_version: { label: profile version }
  stale: { label: stale }                  # 古い profile で分析した結果
  cost: { label: cost }
  duration: { label: duration }
  remaining: { label: estimated remaining }
  runs_with_cost: { label: runs with cost }
  # ---- 集計表
  mart: { label: mart }
  rebuild: { label: rebuild }
  subject: { label: subject }
  view: { label: view }
  columns: { label: columns }
  description: { label: description }
retired:
  - 入口
  - (?<!階)層
  - ティア
  - 区分
  - 処理
  - 部品
  - データ
  - 外部接続
  - 外部との接続
  - 経路
  - 駅
  - 終点
  - 読み書き
  - 触る
  - 集計表
  - 作り直
  - 進み具合
  - 分析済み
  - 未分析
  - 分析の型
  - 論理名
  - 物理名
  - 定義場所
  - 根拠の場所
  - 箇所
  - 要約
  - 概要
  - 主張
  - 解釈
  - 不明
  - 確かさ
  - 起動元
  - 承認
  - 構成
  - 種類
