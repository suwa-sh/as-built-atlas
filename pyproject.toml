[project]
name = "abatlas"
version = "0.4.3"
description = "as-built-atlas core tools: schema validation, entry enumeration, generic extractors, ETL, dbt marts, API and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "jmespath>=1.0",
  "dbt-duckdb>=1.9",
  "duckdb>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=1.2",
  "ast-grep-py==0.51.0",
]

[project.scripts]
abatlas = "abatlas.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abatlas"]

[tool.pytest.ini_options]
# examples/ の下にある見本のテスト (対象のコードの一部) を、このリポジトリのテストとして集めない
testpaths = ["tests"]
