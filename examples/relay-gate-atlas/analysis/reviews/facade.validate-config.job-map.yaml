notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。根拠の行は、presentation/validate-config.sh、bin/validate-config.sh、usecase/validate_job_map.sh、repository/job_map_repo.sh (343〜589 行目)、domain/job_map.sh (55〜239 行目、319〜365 行目、643〜889 行目)、domain/cli_field.sh (77〜219 行目、435〜497 行目) を開いて確かめ、上の 1 件のほかは主張を支えていた。層・種類・when・データの当てはめ (job_map_path、TMPDIR、relay-gate-{random}.part / relay-gate-{random}、確かめるだけの read を interpretation)・外部のコマンドのフレームの選び方 (tr はリダイレクトで複製を読むのでフレーム、パイプの 2 つ目の sed と、printf を受ける sort / sed / tr はフレームにしない) は、analysis-conventions.md と、ほかの 2 つの入口の結果に合っている。指摘にしなかった点。(1) job_id の重複の検査は、job_id が空の行を対象にしない (domain/job_map.sh の 780 行目)。空の job_id は列の検証で違反になるので、ルールの結果は変わらない。また、列の検証に違反した行も、重複の検査の対象に入る (validate_job_map.sh の 192 行目が if の外にある)。ルールの文は、この点に触れていないが、誤りではない。(2) snapshot_rm の when: always は、mktemp が失敗したときだけ動かない、という理由が note に書いてあり、失敗による打ち切りの裏返しとして妥当。(3) 入口のフレームの note の「検証の種類の関数が無いときの終了コード 6 は、この入口では閉じている」は、140 行目の declare -F と、75 行目の定義で確かめた。(4) bin と presentation の dirname / cd / pwd は、自分の置き場所を求めるだけで、データに届かないので、フレームが無いことを漏れにしていない。"
