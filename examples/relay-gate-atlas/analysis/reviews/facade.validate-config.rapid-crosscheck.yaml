notes: "指摘にしなかったこと。(1) 根拠の行は、summary とすべてのフレームについて開いて確かめ、主張を支えていた。(2) RAPID_LEASE_SEC と RAPID_POLL_INTERVAL_SEC は、名前を既知のキーの表 (validate_rapid_crosscheck.sh 25 行目) と比べるだけで値を読まないので、fields に無いのは妥当と見た。(3) RELAY_GATE_HOME と RELAY_GATE_CONFIG_DIR は、この入口では結果を変えないので、settings に無いのは妥当。(4) tr を external のフレームにし、パイプの 2 つ目の sed をフレームにしない扱い、[ -e ] [ -f ] [ -r ] [ -x ] [ -s ] を op: read (interpretation) にした扱い、複製の名前の綴りは、analysis-conventions.md と job-map の入口の結果に合う。(5) feature-flag の入口の結果 (job_map_repo.sh 403 行目の rm) も、まだ when: conditional のままなので、2 つ目の指摘と同じ理由で、そろえる対象になる (このレビューの範囲外なので、指摘にはしていない)。"
