notes: "根拠の行は、全フレームの主張を対象のコード (target.commit の版) で開いて確かめた。上の 3 件のほかに、主張と合わない所は無かった。ほかの 2 つの入口 (job-map / rapid-crosscheck) との書き方の比べ: (1) 検証の種類の関数が無いときの終了コード 6 (validate-config.sh 140〜142 行目) は、この結果と job-map の結果が、入口のフレームの summary の note に書き、rules から外している。rapid-crosscheck の結果だけが、入口の rule (decision) に「検証の種類の関数が無いときも 6」と残し、根拠に 142 行目を持っている。この結果の側はそろっているので指摘にしていない (rapid-crosscheck のレビューで扱う)。(2) 複製の削除の rm の when は、job-map が always、この結果と rapid-crosscheck が conditional。この結果への指摘は上の 1 件目。(3) シグナル (HUP / INT / TERM) の trap で動く複製の削除は、3 つとも remove_snapshot の call の note に書いている。この結果だけが、repo_load の rules にも decision として書いている (終了コード 129 / 130 / 143 を持つ決まりなので、誤りではなく、指摘にしていない)。(4) create_snapshot / mktemp / cat / mv / scan / scan_output / tr / remove_snapshot の when と、TMPDIR、一時ファイルと検証するファイルの levels の綴りは、3 つの結果でそろっていた。指摘にしなかった点: (a) probe_rm の note の「どの経路でも 1 回呼ぶ」は、括弧の中の 3 つの経路については正しいが、mktemp が失敗した経路 (runner_probe.sh 90〜92 行目) では呼ばない。(b) entry の parameters の --feature-flag の「終了コード 2」は、根拠の 99 行目の 2 行後 (101 行目) にあり、前後 5 行に入るので指摘にしていない。(c) cli_field.sh の関数が起動する sed / tr と、bin や presentation の dirname は、文字列を加工するだけなので、フレームが無いのは analysis-conventions.md のとおり。(d) 前のレビューの 5 件は、いまの結果ではどれも直っている。"
