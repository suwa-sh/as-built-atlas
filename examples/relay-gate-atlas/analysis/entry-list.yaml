format_version: 1
target:
  repo: github.com/suwa-sh/relay-gate
  name: RelayGate
  clone_path: ../relay-gate
  scope: .
  commit: aa6993823306a84935b99824059fa544779bc212
profile:
  id: cli
  version: 0.1.0
extractors:
- name: executables
  run: abatlas-extract glob
  layer: command
  rationale: 実行ファイルの置き場は <部品>/bin/ (いまは facade/bin/ だけ)。facade/bin/validate-config.sh
    は、検証の種類のオプションで別々の操作に分かれるので、ここでは外し、操作ごとに agent-listed で足す (allow_empty は、そのために付けた)。コマンドの契約
    docs/specs/latest/_cross-cutting/api/cli-command-contract.yaml の commands には 17
    件あるが、実装があるのは validate-config.sh だけ。残りの 16 件 (facade.sh など) は、定義にあって実装が無いので入口にしない。
  params:
    files:
    - bin/*
    - '*/bin/*'
    exclude:
    - facade/bin/validate-config.sh
    allow_empty: true
    segments:
      drop_last: false
      drop:
      - bin
      replace:
      - pattern: \.(sh|bash|py|js|ts|rb|pl)$
        with: ''
    line_match: ^[^#\s]
- name: agent-listed
  run: abatlas-extract listed
  layer: command
  rationale: validate-config.sh の検証の種類は、実行ファイルの中の case 文と、名前で選ぶ関数 (validate_config_<種類>)
    で決まる。ファイル名からは取れないので、読んで足す。
  params:
    entries:
    - id: facade.validate-config.feature-flag
      path: /facade/validate-config/feature-flag
      name: validate-config.sh --feature-flag
      source:
        file: facade/src/presentation/validate-config.sh
        line: 69
      reason: 'validate-config.sh は、検証の種類のオプションをちょうど 1 つ受け取り (98 行目の case、122〜137
        行目)、139〜144 行目で validate_config_<種類> の関数を選んで呼ぶ。--feature-flag の関数は 69 行目にあり、feature
        flag の設定ファイルの検証 (usecase/validate_feature_flag.sh) を呼ぶ。種類ごとに、読むファイルも処理も別なので、利用者が起動できる操作
        1 つと判断した。迷った点: サブコマンドではなく、排他のオプションである。プロファイルの「サブコマンド」に当たるかは、1 通りに読めなかった。実行ファイル
        1 つを入口 1 件にする読み方もできる。'
      attributes:
        executable: facade/bin/validate-config.sh
        option: --feature-flag
    - id: facade.validate-config.job-map
      path: /facade/validate-config/job-map
      name: validate-config.sh --job-map
      source:
        file: facade/src/presentation/validate-config.sh
        line: 75
      reason: 同じ実行ファイルの --job-map の操作。関数は 75 行目にあり、slot のジョブマップ CSV の検証 (usecase/validate_job_map.sh)
        を呼ぶ。迷った点は feature-flag と同じ (排他のオプションを、サブコマンドと同じに扱った)。
      attributes:
        executable: facade/bin/validate-config.sh
        option: --job-map
    - id: facade.validate-config.rapid-crosscheck
      path: /facade/validate-config/rapid-crosscheck
      name: validate-config.sh --rapid-crosscheck
      source:
        file: facade/src/presentation/validate-config.sh
        line: 81
      reason: 同じ実行ファイルの --rapid-crosscheck の操作。関数は 81 行目にあり、速報クロスチェックの設定ファイルの検証 (usecase/validate_rapid_crosscheck.sh)
        を呼ぶ。迷った点は feature-flag と同じ (排他のオプションを、サブコマンドと同じに扱った)。
      attributes:
        executable: facade/bin/validate-config.sh
        option: --rapid-crosscheck
