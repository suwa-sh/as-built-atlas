notes: "迷った点と選んだ扱い。(1) 入口は、実行ファイルではなく、検証の種類のオプションごとに分けた (analysis-conventions.md)。入口のフレームには、起動用の facade/bin/validate-config.sh と、本体の引数の解釈 (validate_config_main) をまとめた。(2) 対象の公開の版では、usecase の手順が validate_feature_flag_load_input (入力の確認・複製と読み込み・バイトの点検・行の形) と validate_feature_flag_collect_key_errors (パスとジョブマップの場所の解決・キーの分類・検証表) の 2 つの関数に分かれている。どちらも処理の手順の 1 段なので、logic のフレームにし、ルールと設定を、その段へ移した。(3) 検証する設定ファイルのキーは、settings ではなく fields に書いた。(4) ファイルがあるか・読めるか・実行できるかの確認は op: read、状態は interpretation で書いた (analysis-conventions.md)。(5) runner の起動は、相手が設定ファイルの値で決まるので、external のフレームの summary を unknown (dynamic_dispatch) にした。読み書きの種類には当てはめていない (同じ機械のプロセスの起動で、external_api の「別の機械やサービス」に当たらない)。(6) 読み書きも、その先の呼び出しも無い関数 (domain のパスの解決、キーの分類、運用モードの導出、標準出力の組み立て、表示用の可視表記の作成) は、フレームにせず、ルールを呼び出し元の段に書いた。可視表記をまとめて作る sed / tr は、パイプで文字列を加工するだけなので、フレームにしていない (失敗したときの終了コード 6 だけを、ルールに書いた)。(7) シグナル (HUP / INT / TERM) の trap で動く複製の削除は、別のフレームにせず、repo_load の rules と remove_snapshot の call の note に書いた。(8) validate_config_main の、検証の種類の関数が無いときに終了コード 6 で終わる枝 (validate-config.sh 140〜142 行目) は、この入口では、関数 validate_config_feature_flag が同じファイルの 69 行目に必ずあるため閉じている。入口のフレームの rules に書かず、summary の note に書いた。(9) レビューの指摘 3 件 (すべて low) は、対象のコードで確かめて正しかったので、すべて直した (複製の削除の rm を always に、ジョブマップの所在の確認に mode の条件と 587 行目を、green の検証の根拠に 532〜534 行目を足した)。指摘にならなかった probe_rm の note (mktemp が失敗した経路では呼ばない) も、あわせて直した。"
