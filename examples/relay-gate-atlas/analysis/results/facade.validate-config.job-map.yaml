  status: interpretation
  value: "slot のジョブマップ (CSV) を検証するコマンド。ファイルを一時ファイルへ複製して読み、バイトの点検、ヘッダーの列、行ごとの列の値、job_id の重複を確かめ、map_version を集計する。違反と警告は、検証を終えてから標準エラーに出す (ヘッダーの列と行ごとの検証の報告の行は、まとめて制御文字を見える表記にしてから出す。バイトの点検とヘッダーの引用符の不正で止まるときは、見える表記にしたパスと行番号だけの行を、そのまま出す)。検証 OK のときだけ、標準出力に 3 行 (map_path、rows、map_version) を出す。終了コードは 0 (OK) / 2 (違反) / 6 (実行エラー)"
