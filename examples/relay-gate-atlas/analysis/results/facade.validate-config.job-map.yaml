notes: "迷った点と選んだ扱い。(1) 入口は、実行ファイルではなく、検証の種類のオプションごとに分けた (analysis-conventions.md)。入口のフレームには、起動用の facade/bin/validate-config.sh と、本体の引数の解釈 (validate_config_main) をまとめた。(2) CSV の列は、settings ではなく fields に書いた。(3) 読み書きも、その先の呼び出しも無い関数 (validate_job_map_rows、validate_job_map_header、validate_job_map_row、job_map_row_resolved_line、validate_job_map_unique_job_ids、job_map_version_summary、validate_job_map_report_byte_errors) は、フレームにせず、ルールを呼び出し元 (validate_job_map_run) に書いた。(4) job_id の重複の検査の sort と、報告の行と map_version を見える表記にする sed / tr (domain/cli_field.sh の cli_field_safe_text_list / cli_field_safe_text_prepare から起動する) は、printf の出力をパイプで受けて加工するだけで、ファイルを読まないので、フレームにしていない。失敗したときの終了コード 6 だけを、ルールに書いた。(5) シグナル (HUP / INT / TERM) の trap で動く複製の削除は、別のフレームにせず、remove_snapshot の call の note に書いた。(6) 複製の削除の rm は、複製の名前が決まっていないとき (mktemp が失敗したとき) だけ動かない。失敗による打ち切りの裏返しなので、always にした (前の結果は conditional だった)。(7) 検証の種類の関数が無いときの終了コード 6 は、この入口では閉じている (validate_config_job_map は同じファイルに定義されている) ので、ルールから外し、入口のフレームの summary の note に書いた。"
