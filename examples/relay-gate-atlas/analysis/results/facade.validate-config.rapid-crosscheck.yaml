summary:
  status: interpretation
  value: "速報クロスチェックの設定ファイル (KEY=VALUE) を検証するコマンド。ファイルがあり読めることを確かめ、一時ファイルへ複製して読み、バイトの点検、行の形 (invalid line、同じキーの重複)、RAPID_COMPARE_COMMAND (比較ツールを起動するコマンド) の検証表を確かめる。標準出力に、決まった順の行 (config、path、command_path、has_job_id_placeholder、status、違反があれば violations) を出す。違反と警告は標準エラーに出す。終了コードは 0 (OK) / 2 (違反) / 6 (実行エラー)"
  evidence:
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 53 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 62 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 77 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 94 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 146 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 151 }
    - { file: facade/src/usecase/validate_rapid_crosscheck.sh, line: 157 }
    - { file: facade/src/presentation/validate-config.sh, line: 61 }
notes: "迷った点と選んだ扱い。(1) 入口は、実行ファイルではなく、検証の種類のオプションごとに分けた (analysis-conventions.md)。入口のフレームには、起動用の facade/bin/validate-config.sh と、本体の引数の解釈 (validate_config_main) をまとめた。(2) 検証する設定ファイルのキーは、settings ではなく fields に書いた。(3) 比較ツールのコマンドがあるか・実行できるかの確認は、op: read で書いた (起動はしない)。(4) 読み書きも、その先の呼び出しも無い関数 (validate_job_map_report_byte_errors、validate_rapid_crosscheck_is_known_key、launch_command_split、launch_command_params_is_whole_argument、rapid_crosscheck_env_trim / unquote) は、フレームにせず、ルールを呼び出し元に書いた。(5) シグナル (HUP / INT / TERM) の trap で動く複製の削除は、別のフレームにせず、remove_snapshot の call の note に書いた (同じ関数を、同じ呼び出し元 env_read の下に 1 回だけ書く)。(6) validate_config_main の「検証の種類の関数が無ければ終了コード 6」(140〜142 行目) は、この入口では閉じている (validate_config_rapid_crosscheck は 81 行目に定義されている) ので、ルールから外し、入口のフレームの summary の note に書いた (job-map の入口と同じ書き方。レビューの指摘で直した)。(7) 複製の削除の rm は、複製の名前が決まっていないとき (mktemp が失敗したとき) だけ動かない。失敗による打ち切りの裏返しなので、always にした (レビューの指摘で直した。job-map の入口と同じ)。前の結果 (公開されていない版を分析したもの) から変わった点: (a) 入力を読み込む段 validate_rapid_crosscheck_load_input (49 行目) が足されていたので、logic のフレームにし、ファイルの有無の確認、バイトの点検、行の形の検査、終了コード 6 の判定を、uc_command から移した。(b) 読み取りの段が RAPID_DB_CONN_REF の値も取り込むようになったので、fields に足した。(c) 行番号を、公開の版に合わせて付け直した。レビュー (analysis/reviews/) と analyzer.reviewed は、別の担当に残した。"
