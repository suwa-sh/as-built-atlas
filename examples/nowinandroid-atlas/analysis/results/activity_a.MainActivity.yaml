summary:
  status: interpretation
  value: "アプリで唯一の Activity で、アプリ全体の枠。起動すると splash を出し、利用者の設定 (テーマ、色、ダークモード) を Proto DataStore から読み終えるまで splash を残し、読んだ設定でテーマを決める。起動の intent が ForYou のディープリンクなら、For you の画面を、リンクのニュースの id つきで最初に開く。setContent で root の composable NiaApp を描き、NiaApp は、通信が切れていれば snackbar で知らせ、フォロー中の話題とブックマークのニュースを Room から読んで、未読があれば下のバーに印を付ける。端末の時刻帯の変化も見て、画面に渡す。下のバー (For you、Saved、Interests) と上のバーの検索で画面を移り、上のバーの設定のボタンで設定の dialog (別の入口 SettingsDialog) を重ねて開く。NavDisplay の host には ForYou、Bookmarks、Interests、Topic、Search の destination を並べる (別の入口なので辿らない)。戻る操作は navigator.goBack() で、行き先は履歴で決まる"
