notes: "(1) 入口のフレームの source は Activity の class の定義の行 (MainActivity.kt の 66 行) にし、entry.source は入口の一覧のとおり AndroidManifest.xml の 44 行にした。(2) rememberNiaAppState が作る NiaAppState の 3 つの state (isOffline、topLevelNavKeysWithUnreadResources、currentTimeZone) は、ViewModel の state の決まり (analysis-conventions.md) に合わせ、state holder を作る行 (MainActivity.kt の 154 行) を根拠に、入口の真下に 1 つずつ置いた。購読する行 (NiaApp.kt の 109・150 行、MainActivity.kt の 161 行) も call の根拠に入れた。rememberNiaAppState そのものと、ナビゲーションの state (NavigationState、Navigator) は、メモリの中の状態だけなのでフレームにしなかった。(3) ConnectivityManagerNetworkMonitor と TimeZoneBroadcastMonitor は、analysis-conventions.md の対応表のとおり datasource (I/O なし) にし、framework の呼び出し (ConnectivityManager.registerNetworkCallback、Context.registerReceiver) を external のフレーム (kind: library) で閉じた。TimeZoneBroadcastMonitor はコードで BroadcastReceiver を登録するが、context.md の「コードで登録する receiver は listed で background の入口に足す」には当てていない (入口の一覧は変えない。足すかは人が決める)。(4) 同じ処理の書き直し: CompositeUserNewsResourceRepository.observeAll から NewsResourceDao.getNewsResources までは、フォロー中の話題の経路 (repo_observe_all) と、ブックマークの経路 (repo_observe_all_bookmarked) の 2 回書いた。observeAllBookmarked の子は observeAll だけで、書かないと observeAllBookmarked が終端の決まりを満たせない (空の集合で早く返すのは、入力が空でないことだけの確認なので rules に書けない) ため、context.md の決まりどおり、I/O を持つ DAO まで書き直した。書き直したフレームには業務のルールを繰り返さず、DAO の引数 (useFilterNewsIds = true、useFilterTopicIds = false) と、効く WHERE の枝だけを変えた。(5) OfflineFirstUserDataRepository.userData は、onCreate の行の順で最初に着く MainActivityViewModel.uiState の下に 1 回だけ書き、observeAllForFollowedTopics、observeAll、observeAllBookmarked からの呼び出しは summary に書いた。DataStore の読み込みは message をまるごと読むので、fields は Topic の結果と同じ 7 項目にした。(6) テーマの決め方 (MainActivityUiState の shouldUseDarkTheme など) は、段になっていない補助の関数で、onCreate が呼ぶので、入口のフレームの rules に書いた。(7) 設定の dialog は、context.md のとおり辿らず summary に名前を書き、加えて links に overlay (entry_id: shell_s.SettingsDialog) で書いた (いまの画面に重ねて開く画面なので、embed ではなく overlay にした)。この入口の一覧の status は candidate のまま。(8) 下のバーの行き先は TOP_LEVEL_NAV_ITEMS の繰り返しで決まるので、値が読める 3 つ (ForYouNavKey、BookmarksNavKey、InterestsNavKey) を 1 件ずつ links に書いた。移る処理を書いたラムダを design system の部品 (下のバーの item、上のバーのボタン) に渡し、部品が押されたときに呼ぶので、レビューの指摘に従って interpretation にし、部品が呼ぶ行も根拠に入れた (設定の dialog の overlay も同じ)。ディープリンクは、intent を解釈する入口のフレームに navigate で書いた。(9) フレームにしなかったもの: splash、edge-to-edge、端末のダークモードの監視 (isSystemInDarkTheme)、NiaTheme、JankStats (onResume / onPause と NavigationTrackingSideEffect)、背景のグラデーション、snackbar の部品。どれも読み書きもほかの入口へのつながりも持たない。AnalyticsHelper は CompositionLocal で destination に渡すだけで、この入口からは event を送らないので、Firebase Analytics のフレームは書かなかった。(10) offline の snackbar の rule は、閉じるボタンが無く、通信の状態が変わると LaunchedEffect が作り直されることまでを書いた。通信が戻ったときに snackbar が消えるかは Material3 の SnackbarHostState の振る舞いで、このリポジトリのコードからは確かめていないので書かなかった"
