  value: "話題 1 つの詳細の画面 (list と detail を並べるときの detail の側)。開くと、話題の情報を Room の topics 表から読み、利用者の設定 (フォロー中の話題、ブックマーク、既読) を Proto DataStore から読み、その話題に付いたニュースを news_resources 表 (話題との対応の表と、ニュースの話題も一緒に) から新しい順に読む。画面が表示されたとき (composition に入ったとき) に一度、画面の表示を Firebase Analytics に送る。利用者がフォローのチップを押すとフォロー中の話題を DataStore に書いて Firebase Analytics に送り、ニュースのブックマークのボタンを押すとブックマークを DataStore に書いて送り、ニュースのカードを押すと、開いたことを Firebase Analytics に送り、記事の URL を Custom Tab で開き、既読を DataStore に書く。ニュースのカードの話題のタグを押すと、別の話題の詳細の画面 (同じ入口) へ移る"
