notes: "(1) DataStore の項目の名前は、proto の message の項目名 (followed_topic_ids など、user_preferences.proto の 40〜50 行) で書いた。context.md の例は、コードの accessor (it.followedTopicIdsMap) だが、skill の「データの側の名前」に合わせた。(2) Firebase Analytics は、datasource のフレーム (FirebaseAnalyticsHelper.logEvent) から external のフレーム (FirebaseAnalytics.logEvent) で閉じ、external_api の読み書きを external のフレームに書いた。fields には、この入口から送る event の引数の key をまとめて書いた。(3) 4 か所から呼ぶ FirebaseAnalyticsHelper.logEvent は、入口から行の順に深さ優先で最初に着く TrackScreenViewEvent の下に 1 回だけ書き、ほかは呼び出し元の summary に書いた。OfflineFirstUserDataRepository.userData も、話題の state の下に 1 回だけ書いた。(4) ViewModel の state (topicUiState、newsUiState) は、入口の hiltViewModel を呼び出しの根拠にして、入口のフレームの下に置いた。利用者の操作で動く ViewModel の method は、操作が起きる段 (フォローは TopicScreen、ブックマークと既読はカードの一覧) の下に置いた。TopicScreen の中の private の部品 (内側の TopicScreen、TopicToolbar、topicBody、userNewsResourceCards) と、core/ui の NewsResourceCardExpanded・NewsResourceTopics はフレームにせず、呼び出しの根拠の行にまとめた。(5) 固定の値: 入口は showBackButton = true を渡すので、TopicToolbar の else (幅 1dp の Spacer) は描かれない。TopicScreen は setNewsResourceViewed に true を渡すので、NiaPreferencesDataSource の既読を外す枝は動かない。どちらも呼び出しのフレームを消すものではないので、notes と summary にだけ書いた。(6) 戻るボタンの navigator.goBack() は、行き先が戻り先の履歴で決まり、入口を特定できないので、links に書かず、入口の summary に書いた。(7) 記事を開く Chrome Custom Tab は、アプリの外の画面で、ほかの入口でも保存先でもないので、external のフレーム (CustomTabsIntent.launchUrl) で閉じた。(8) 話題の見出しの画像 (DynamicAsyncImage) とカードの画像は Coil が読むので、読み書きに書かない。TrackScrollJank (JankStats) は、読み書きを持たないので辿らない"
