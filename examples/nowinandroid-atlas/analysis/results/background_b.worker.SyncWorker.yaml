summary:
  status: interpretation
  value: "サーバーの内容を、端末の Room と Proto DataStore に取り込む WorkManager の Worker。doWork は、同期の開始を Firebase Analytics に送り、FCM の sync の topic を購読してから、話題とニュースの同期を並べて動かす。それぞれ、DataStore に保存した前回の版より後の変更の一覧をサーバーから取り、消されたものを Room から消し、変わったものをサーバーから取り直して Room に書き、版を DataStore に書く。ニュースの同期は、初めての同期なら取ったニュースをすべて既読にし、オンボーディングを終えた利用者には、フォロー中の話題に新しく加わったニュースを通知する (押すと MainActivity が開く)。同期の成否を Firebase Analytics に送り、両方成功なら端末のニュースと話題をすべて全文検索の表 (newsResourcesFts、topicsFts) に書き足して (既存の行は消さない) 成功を返し、どちらかが失敗なら WorkManager にやり直しを頼む"
  evidence:
