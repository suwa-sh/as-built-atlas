notes: "(1) changeListSync (SyncUtilities.kt) は、話題とニュースの両方の同期が、違うラムダを渡して呼ぶ共通の補助の関数なので、フレームにしなかった。フレームにすると、同じ処理を 1 回だけ書く決まりで、ニュースの側の呼び先が話題の側の下に入ってしまう。そのルール (変更が無ければ成功、消すものと取り直すものに分ける、最後の版を保存、例外なら失敗) は、呼ぶ段の両方 (OfflineFirstTopicsRepository.syncWith と OfflineFirstNewsRepository.syncWith) に書いた。(2) changeListSync は、変更の一覧が空なら成功として早く返す (SyncUtilities.kt 89 行) ので、その後ろの、消す・取り直す・版を書く呼び出しを conditional にした。版を読む・変更の一覧を取る呼び出しは、その前なので always。(3) changeListSync にラムダや関数の参照で渡して、changeListSync が呼ぶもの (変更の一覧の取得、消す DAO、取り直しのラムダの中の呼び出し) は、call を interpretation にした (根拠は、渡す行と呼ぶ行)。(4) SyncWorker 自身が Synchronizer で、getChangeListVersions と updateChangeListVersions を NiaPreferencesDataSource にそのまま渡すだけなので、SyncWorker の method をフレームにせず、呼び出しの根拠に入れた。(5) Retrofit は、DI で決まる実装の method (RetrofitNiaNetwork.<method>) と、注釈が中身を決める private の service の method (RetrofitNiaNetworkApi.<method>) を別のフレームにし、I/O を service の側に書いた。応答の項目 (NetworkTopic、NetworkNewsResource、NetworkChangeList の項目) を read、query の引数を write で fields に書いた。(6) 話題とニュースの行を消すと、news_resources_topics の外部キーの ON DELETE CASCADE で対応の行も消えるので、消す DAO のフレームに news_resources_topics の delete を interpretation で足した。(7) 同じ処理: NiaPreferencesDataSource.getChangeListVersions と updateChangeListVersion は話題の同期の下に、NewsResourceDao.getNewsResources はニュースの同期の下 (オンボーディングを終えたときの枝) に 1 回だけ書き、ほかの呼び出し元 (ニュースの同期、全文検索の表の作り直し) の summary に書いた。FirebaseAnalyticsHelper.logEvent は、同期の開始の記録の下に 1 回だけ書いた。(8) 通知の行き先は、PendingIntent の component に書いた Activity の class 名 (TARGET_ACTIVITY_NAME の値) を target にし、deep link の URI は note に書いた。通知の許可 (POST_NOTIFICATIONS) は、満たさなければ通知を出さないので guards (permission) に書いた。(9) getForegroundInfo (古い API level で前面の service として動くときの通知) は、読み書きもつながりも無いのでフレームにせず、入口の summary に書いた。traceAsync (androidx.tracing) も辿らない。(10) BACKEND_URL は、どの入口でも同じように効く接続先の設定なので settings に書かず、host を (backend) にした。(11) この Worker を WorkManager に登録する側 (SyncInitializer、SyncNotificationsService、WorkManagerSyncManager) は、この入口の外なので辿らない。DelegatingWorker が class の名前で SyncWorker を作って doWork を呼ぶ。(12) レビューの指摘 4 件 (medium 1、low 3) はすべて直した。全文検索の表は「作り直す」ではなく「書き足す (既存の行は消さない)」にし、FTS の insertAll の REPLACE は rowid を渡さないので置き換えが起きないことを書いた。版の読み込みは「値が出なければ既定、例外は同期の失敗」に直した"
