format_version: 1
target:
  repo: as-built-atlas/examples/kotori-books
  clone_path: ../kotori-books
  scope: .
  commit: b598e2a801e07ffe101b050f19c485c2faa833ab
profile:
  id: batch-kestra
  version: 0.1.0
extractors:
- name: kestra-flows
  run: abatlas-extract structured-query
  layer: scheduler
  params:
    files:
    - flows/**/*.yaml
    - flows/**/*.yml
    format: yaml
    fields:
      id: join('.', [namespace, id])
      name: id
      namespace: namespace
      flow: id
      path: /{namespace}/{flow}
      attributes:
        description: description
        commands: tasks[].commands[]
        task_types: tasks[].type
        subflows: tasks[?contains(type, 'Subflow')].flowId
        finally_subflows: finally[?contains(type, 'Subflow')].flowId
        subflow_namespaces: tasks[?contains(type, 'Subflow')].namespace
        triggers: triggers[].type
        cron: triggers[].cron
        labels: labels
    post:
      namespace:
        split: .
        join: /
  rationale: Flow 定義は flows/<namespace の '.' を '/' に>/<id>.yaml に 1 ファイル 1 Flow。プロファイルの既定パラメータのまま使える
entries:
- id: daily.close_day
  path: /daily/close_day
  layer: scheduler
  source:
    file: flows/daily/close_day.yaml
    line: 1
  extractor: kestra-flows
  status: approved
  name: close_day
  attributes:
    description: '日次の締め。注文の決済確定 → 売上集計 → 在庫の突き合わせ を Subflow で順に呼ぶ。失敗時は lib.notify_failure に通知する

      '
    commands: []
    task_types:
    - io.kestra.plugin.core.flow.Subflow
    - io.kestra.plugin.core.flow.Subflow
    - io.kestra.plugin.core.flow.Subflow
    subflows:
    - settle_orders
    - sales_report
    - reconcile_stock
    subflow_namespaces:
    - daily.sales
    - daily.sales
    - daily.inventory
    triggers:
    - io.kestra.plugin.core.trigger.Schedule
    cron:
    - 0 1 * * *
    labels:
      owner: commerce-platform
      criticality: high
  note: 見本なので全件承認
