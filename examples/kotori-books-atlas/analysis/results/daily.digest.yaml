# 正解データ (examples/generator/kotori_books.py が生成)。手で直さず、生成スクリプトを直す
format_version: 1
entry:
  id: daily.digest
  path: /daily/digest
  name: digest
  layer: scheduler
  source:
    file: flows/daily/digest.yaml
    line: 1
target:
  repo: as-built-atlas/examples/kotori-books
  clone_path: ../kotori-books
  scope: .
  commit: caf558fcb98cfcb8afd9e8b4a3b9ea7dde626634
analyzer:
  profile:
    id: batch-kestra
    version: 0.1.0
  skill_version: 0.4.0
  analyzed_at: '2026-11-08T12:00:00+09:00'
  analyst: as-built-atlas examples/generator (対象と同じ仕様から生成した正解)
  tests: true
summary:
  status: interpretation
  value: config/digests.yaml に列挙された日次レポートの CSV を集めて 1 本のダイジェストにし、S3 に置いてチャットに要約を流す
  evidence:
  - file: flows/daily/digest.yaml
    line: 3
  - file: jobs/digest.py
    line: 1
callstack:
- id: flow
  layer: scheduler
  kind: flow
  name: daily.digest
  source:
    file: flows/daily/digest.yaml
    line: 1
  caller: null
  summary:
    status: interpretation
    value: config/digests.yaml に列挙された日次レポートの CSV を集めて 1 本のダイジェストにし、S3 に置いてチャットに要約を流す
    evidence:
    - file: flows/daily/digest.yaml
      line: 3
  parameters:
  - name: triggers.schedule.cron
    value: 0 9 * * * (Asia/Tokyo)
    status: fact
    evidence:
    - file: flows/daily/digest.yaml
      line: 28
  - name: inputs.date
    value: DATE。処理対象日 (省略時は実行日)
    status: fact
    evidence:
    - file: flows/daily/digest.yaml
      line: 8
  - name: concurrency
    value: limit 1, behavior CANCEL
    status: fact
    evidence:
    - file: flows/daily/digest.yaml
      line: 12
- id: run_job
  layer: shell
  kind: script
  name: scripts/run_job.sh
  source:
    file: scripts/run_job.sh
    line: 1
  caller: flow
  call:
    status: fact
    when: always
    evidence:
    - file: flows/daily/digest.yaml
      line: 24
  guards:
  - kind: other
    value: $(id -un) = $KOTORI_RUN_USER
    status: fact
    evidence:
    - file: scripts/run_job.sh
      line: 9
    note: 実行ユーザーの確認。KOTORI_RUN_USER が設定されているときだけ行い、違えば 77 で終わる
  settings:
  - name: KOTORI_ENV
    kind: env
    effect: 読む設定ファイル config/<env>.env を選ぶ (接続先とバケット名が変わる)
    status: fact
    evidence:
    - file: scripts/run_job.sh
      line: 13
  - name: KOTORI_RUN_USER
    kind: env
    effect: 設定されていれば、実行ユーザーを確かめる。未設定なら確かめない
    status: fact
    evidence:
    - file: scripts/run_job.sh
      line: 9
  summary:
    status: interpretation
    value: config/<env>.env を読み、python3 -m jobs.<job> を実行して標準出力をジョブごとのログに追記する共通ランナー
    evidence:
    - file: scripts/run_job.sh
      line: 2
    - file: scripts/run_job.sh
      line: 21
  parameters:
  - name: JOB
    value: digest (第 1 引数。実行するモジュール jobs.digest とログ名になる)
    status: fact
    evidence:
    - file: flows/daily/digest.yaml
      line: 24
    - file: scripts/run_job.sh
      line: 5
  - name: env.KOTORI_ENV
    value: 読む設定ファイル config/<env>.env を選ぶ。Flow の env で prod
    status: fact
    evidence:
    - file: flows/daily/digest.yaml
      line: 22
    - file: scripts/run_job.sh
      line: 13
  io:
  - op: read
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: config
        file: prod.env
    detail: source で読む (接続先・バケット名)
    evidence:
    - file: scripts/run_job.sh
      line: 15
  - op: append
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: var/log/jobs
        file: digest.log
    detail: 開始・終了の行と、ジョブの標準出力 (tee -a)
    evidence:
    - file: scripts/run_job.sh
      line: 19
    - file: scripts/run_job.sh
      line: 21
- id: job
  layer: program
  kind: module
  name: jobs.digest
  source:
    file: jobs/digest.py
    line: 1
  caller: run_job
  call:
    status: fact
    when: always
    evidence:
    - file: scripts/run_job.sh
      line: 21
    note: JOB=digest なので jobs.digest が動く
  summary:
    status: interpretation
    value: config/digests.yaml に列挙された日次レポートの CSV を集めて 1 本のダイジェストにし、S3 に置いてチャットに要約を流す
    evidence:
    - file: jobs/digest.py
      line: 1
    - file: jobs/digest.py
      line: 23
  parameters:
  - name: --dry-run
    value: 書き込みと外部呼び出しをせず件数だけ出す
    status: fact
    evidence:
    - file: jobs/digest.py
      line: 19
  - name: --date
    value: 処理対象日 (省略時は実行日) (Flow の inputs.date から)
    status: fact
    evidence:
    - file: jobs/digest.py
      line: 18
  io:
  - op: read
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: config
        file: digests.yaml
    detail: ダイジェストに含めるレポートの一覧 (ディレクトリ名と見出し)
    evidence:
    - file: jobs/digest.py
      line: 26
  - op: read
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: var/export/sales
        file: '*_{date}.csv'
    detail: 一覧 (config/digests.yaml) にあるディレクトリの当日 CSV を読む
    evidence:
    - file: config/digests.yaml
      line: 3
    - file: jobs/digest.py
      line: 29
    note: 読むディレクトリは config/digests.yaml に列挙されている (設定を変えれば変わる)
  - op: read
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: var/export/weekly
        file: '*_{date}.csv'
    detail: 一覧 (config/digests.yaml) にあるディレクトリの当日 CSV を読む
    evidence:
    - file: config/digests.yaml
      line: 5
    - file: jobs/digest.py
      line: 29
    note: 読むディレクトリは config/digests.yaml に列挙されている (設定を変えれば変わる)
  - op: read
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: var/export/monthly
        file: '*_{date}.csv'
    detail: 一覧 (config/digests.yaml) にあるディレクトリの当日 CSV を読む
    evidence:
    - file: config/digests.yaml
      line: 7
    - file: jobs/digest.py
      line: 29
    note: 読むディレクトリは config/digests.yaml に列挙されている (設定を変えれば変わる)
  - op: write
    status: fact
    resource:
      kind: filesystem
      levels:
        directory: var/export/digest
        file: digest_{date}.md
    detail: Markdown のダイジェスト
    evidence:
    - file: jobs/digest.py
      line: 36
  - op: put
    status: fact
    resource:
      kind: object_storage
      levels:
        bucket: kotori-reports
        prefix: daily/digest/
    detail: ダイジェストを置く
    evidence:
    - file: jobs/digest.py
      line: 39
