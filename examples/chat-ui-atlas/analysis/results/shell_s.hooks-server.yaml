summary:
  status: interpretation
  value: "すべての要求を包むフック。4 つの hook を export し、どれも静的なビルドの間は何もせずに通すだけで、動くときは $lib/server/hooks の関数に任せる。handle (要求ごと) は、DB の config の更新を確かめ、/slack/view/ の下は HuggingChat のセッションを作らずに安全の見出しだけを付けて通す。それ以外は、壊れた URL を 400 で拒み、/admin の下は管理の秘密の Bearer を確かめ、cookie のセッション・信頼するメールのヘッダー・API の Bearer の token のどれかで利用者を決める (sessions、users、tokens を読み、OAuth の token の期限が近ければ OIDC の提供者で更新する)。ログインが有効でログインしていなければ、決まった URL を除いて OIDC のログインへ移し、form の POST は origin を確かめ、POST とログインの URL ではセッションの期限を 2 週間に延ばし、ログインしていない書き込みを 401 で拒み、Slack が管理する会話の書き換えを 403 で拒む。通した後の応答に、iframe と API の CORS の見出しを付ける。handleFetch はサーバー側の fetch のたびに、localhost への要求に cookie を付け直す。handleError は予期しないエラーを、id を付けて記録する。init は要求ごとではなく、サーバーの起動のときに 1 回だけ動き、起動の設定を確かめてから、移行の確認、会話の統計の集計、中断した生成の一覧の読み込み、止まった生成の後始末などの定期の処理を始める"
