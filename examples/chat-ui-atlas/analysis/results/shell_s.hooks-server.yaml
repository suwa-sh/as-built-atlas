notes: "(1) src/hooks.server.ts の 4 つの export (init、handle、handleError、handleFetch) は、building でなければ $lib/server/hooks の関数に任せるだけなので、段にせず、任せる先の 4 つの関数を入口のフレームの子にした (層は、conventions の src/lib/server/** = query)。call の根拠は export の行と、任せる行。(2) building (静的なビルドの間) の分岐は、要求を受けて動くときはいつも false なので、handleRequest は always にした。init は context.md のとおり conditional (起動のとき 1 回)。(3) 同じ関数を 1 回だけ書く順は、コードに書いてある順 (src/hooks.server.ts の init、handle、handleError、handleFetch) の深さ優先にした (はじめは context.md の hook の並びで辿っていたが、レビューの指摘で直した)。そのため acquireLock、releaseLock、isDBLocked、refreshLock は checkAndRunMigrations の下に書き、findUser と refreshConversationStats では summary で触れるだけにした。(4) handleRequest の /slack/view/ の下は、成功として先に返す経路なので、その後ろの呼び出し (authenticateRequest、triggerOauthFlow、sessions の更新、isSlackConversationMutation) を conditional にした。init の、HuggingChat の配備で鍵が無ければ起動を止める確認は、止めるかどうかが設定で決まるので、その後ろの init の子をすべて conditional にした。(5) config.checkForUpdates は、conventions の「config.X を読むだけの小さな補助」ではなく、要求ごとに semaphores と config のコレクションを読むので、段にした。この 2 つの読み込みは ENABLE_CONFIG_MANAGER によらず起きる (値を使うのは ENABLE_CONFIG_MANAGER のときだけ) ので、ENABLE_CONFIG_MANAGER は settings に書いていない。(6) /admin の下の Bearer の確認は、利用者のログインや役割ではなく共有の秘密の確認なので guards の other にした。Slack が管理する会話の書き換えを 403 で止める確認は、権限の確認として guards の permission にし、判定している isSlackConversationMutation の段に書いた (止めるのは handleRequest)。(7) OIDC の提供者の host は、.env の OPENID_PROVIDER_URL の既定 (https://huggingface.co) から interpretation にした。discovery の path は OIDC の決まり (/.well-known/openid-configuration)。token の更新の path は discovery の文書で決まるので unknown (not_traceable_in_repo) にした。ログインへ移す先 (OIDC の提供者のログインの URL) は、ほかの入口ではないが、links の navigate に式 authorizationUrl のまま書き、値が discovery の文書で決まるので unknown (not_traceable_in_repo) にした (entry_id は無し)。(8) 移行の一覧 (src/lib/migrations/routines/index.ts:15) は、コードに直接書いた空の並びなので、繰り返しの中の migrationResults の更新と、各移行の up を、固定の値で閉じている呼び出しとして段にしなかった (checkAndRunMigrations の summary の note に書いた)。refreshLock は、時間で決まる (移行が 10 秒より早く終われば呼ばれない) ので、閉じているとはせず conditional で残した。(9) init の範囲: データに届くまで辿ったのは、checkAndRunMigrations、refreshConversationStats、AbortedGenerations、GenerationReaper (markGenerationInterrupted と interruptAgentRuns まで)。ParkedCallSweeper、AnsweredAskSweeper、QueuedInputSweeper、MlServicePoller、startSlackBot は、定期の処理を始める仕掛けまで読んで、summary を unknown (not_analyzed) にした (どれも起動のときに始める常駐の処理で、合わせて 3,000 行を超え、要求を包むフックの本筋ではないため。続きは、定期の処理を別の入口に分けて分析するのがよい)。GenerationReaper の、終了のときの finalizeActiveRunsOnExit は、レビューの指摘で段にし、終端にならないよう、その下に markGenerationInterrupted を I/O を持つ段までもう一度書いた。initExitHandler、MetricsServer、loadMcpServersOnStartup、getShareThumbnailPng、displayToken は、データの読み書きに至らない (MetricsServer は HTTP サーバーを開くだけ) ので、段にせず init の summary で触れた。(10) external のフレームは、conventions のとおり、メソッドを呼ぶ行ごとに 1 つにし、同じ関数の中で同じコレクションの同じメソッドを何度も呼ぶとき (authenticateRequest の sessions.findOne と users.findOne、findUser の sessions.findOne、handleFetchRequest の fetch) だけ、最初の行にまとめた。(11) 書いていない設定: COOKIE_NAME (cookie の名前を与えるだけ)、PUBLIC_GOOGLE_ANALYTICS_ID (HTML に埋める値を与えるだけ)、OPENAI_API_KEY と HF_TOKEN (環境変数に写すだけ)、MCP_SERVERS (メモリーに読むだけで、この入口では使わない)。(12) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(13) レビューの指摘 6 件 (medium 2、low 4) は、すべて直した: ログインへ移す先を unknown にし、getOIDCAuthorizationUrl と openid-client の authorizationUrl を段にし、lock の関数を移行の下に移し、finalizeActiveRunsOnExit を段にし、統計の aggregate の sessionId を filter にも入れ、設定だけで分かれる起動の確認を rules から消した (settings だけに残した)"
