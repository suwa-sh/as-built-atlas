summary:
  status: interpretation
  value: "HuggingChat のアカウントを Slack のアカウント (ML Intern の bot) につなぐ画面。開くと、サーバーの load がログインを確かめ (無ければ /login へ移す)、URL の ticket があれば slack.links から期限内の接続のリンクを読み、Slack でのログイン (cookie の署名付きの身元) が ticket の Slack 利用者と同じかを確かめる (違えば 403)。利用者の既存の接続を slack.connections から読み、MCP の同期が使える設定なら mcp.selections の有無を読む。ticket と既存の接続ごとに、Slack Web API の auth.test と users.info で workspace の名前と表示名を引く (workspace の bot の token は、本拠の workspace なら設定から、ほかは slack.installations から)。画面は、ticket があれば接続の確認と送信の form、接続済みなら MCP の切り替えと接続ごとの切断の form を出す。form はすべて同じ route の default の action に送られ、切断なら slack.connections を消し (残りが無ければ mcp.selections も消す)、MCP の切り替えなら mcp.selections を作るか消す。接続なら connectAccount が ticket と Slack の身元とセッションを確かめ、ticket を 1 回だけ使えるように slack.links から消して、slack.connections を作るか更新し、/slack/connect?connected=1 へ移す"
