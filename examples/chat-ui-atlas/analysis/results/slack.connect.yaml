notes: "(1) 枠 (layout_l) とフック (hooks_h) は辿っていない。locals.user と locals.sessionId はフックが用意する値として parameters に書いただけ。(2) +page.svelte は部品を import せず、3 つの form を自分で描くので、actions.default の呼び出し元は入口のフレーム。3 つの form は action 属性が無く、同じ route の default に送られる。分岐は form の action の値で、1 つの action のフレームの rules に書いた。(3) 同じ関数は、入口から深さ優先で最初に着いた呼び出し元の下に 1 回だけ書いた: readConnectionLink → slackInstalled → installedWorkspace は load の下。connectAccount もこれを呼ぶが summary で触れるだけ。workspaceClient も load の下で、connectAccount から呼ぶ分は summary で触れるだけ。(4) workspaceClient は、自分では読み書きせず、データに届くのは installedWorkspace だけ。token の選び方を rules に書いたので終端の決まりを満たし、installedWorkspace は書き直さず、summary で「経路はフレーム q_installed_workspace と同じ」と示すだけにした (はじめは書き直していたが、レビューの指摘で消した)。(5) identity (Slack の cookie の署名を確かめる) と viewerConfig と slackConfig と slackMcpSyncAvailable は、データを読み書きしない補助の関数なので段にせず、確認は guards に、設定はその結果で動きを変える段 (load、readConnectionLink など) に書いた。config は既定で環境変数を読む (ENABLE_CONFIG_MANAGER が true なら DB の config のコレクションの値が先だが、値はメモリーに読み込み済みで、この入口の処理では読まない) ので kind は env にした。(6) Slack Web API の host と path は、@slack/web-api の WebClient の既定の送り先 (slack.com/api/<メソッド>) で、リポジトリに書いていないので interpretation にした。ほかの分析リポジトリの書き方 (host と path) に合わせた。(7) guards の value は、コードが否定の形 (!==、||) で書いている確認を、肯定の形で写した (umami-atlas の結果と同じ扱い)。Slack でのログインの有無の確認は、HuggingChat のログインと同じ authentication にし、どちらのログインかは note で分けた。origin の確認は other にした。HuggingChat のセッションと Hugging Face の OAuth の token の期限の確認は、ログインの確認そのものではなく、接続に必要な状態の検証として rules (validation) にした。(8) Slack を呼ぶ external のフレームは、load の 2 つ (auth.test、users.info) はメソッドごとに分け、eligibleParticipant の 3 つは 1 つのフレームにまとめた。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘 3 件 (すべて low) は、すべて直した: installedWorkspace の書き直しのフレームを消し、connectAccount の後ろの 3 つの呼び出し (sessions の読み込み、slack.links の削除、slack.connections の更新) を、設定で打ち切られるので conditional にし、eligibleParticipant のルールに DM でないことと所属の team があることを足した"
