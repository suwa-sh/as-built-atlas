notes: "(1) 枠の外側 (layout_l、layout_l.settings) とフック (hooks_h) と、包まれる画面 (children) は辿っていない。data.models、data.mlAssistantModels、publicConfig、設定の store の中身は、祖先の枠 (src/routes/+layout.ts の load と +layout.svelte) が用意するものなので、parameters に書いただけで、出どころは辿っていない。(2) 同じフォルダの +layout.ts は ssr = false だけなので、プロファイルの決まりのとおりフレームにせず、入口の summary に書いた。+layout.server.ts は無い。(3) 同じフォルダに +server.ts (POST /settings。settings のコレクションを更新する) があり、設定の store (src/lib/stores/settings.ts) の set / update / instantSet / initValue が呼ぶ。この枠は useSettingsStore() で store を得て $settings を読むだけで、書き込みの関数を呼ばないので、POST /settings には届かない。store は getContext で得るだけなので段にしていない。mlAssistant (src/lib/stores/mlAssistant.svelte.ts) も、状態を持つだけで API を呼ばないので段にしていない。(4) データに届かない枠なので、プロファイルの決まりのとおり、最後に頼るライブラリ ($app/navigation の goto) を external のフレームにして閉じた。analysis-conventions.md の「external のフレームは、ライブラリのメソッドを呼ぶ行ごとに 1 つ (同じ関数の中で何度も呼ぶときだけまとめる)」に従い、goto を呼ぶ 5 行 (68、130、146、191、293) は、それぞれ別の関数 (checkDesktopRedirect とボタンの onclick) にあるので、5 つのフレームに分けた (umami-atlas の sso の結果も、router.push の行ごとに分けている)。行き先の入口は、goto を呼ぶ段 (入口のフレーム) の links に書いた。(5) img の読み込みは、umami-atlas の結果 (Favicon が icons.duckduckgo.com へ img で取りに行くのを external_api の call にした) に合わせて、I/O に書いた。provider の組織のアイコンは URL がコードに直接書いてあるので fact。モデルのアイコン (model.logoUrl) は、祖先の load が渡すモデルの値で決まり、この入口からは読めないので unknown (dynamic_dispatch)。(6) ML_ASSISTANT_MODE は、実行時の config ではなく、ビルドのときに vite.config.ts の define が埋め込む定数。analysis-conventions.md の「config を通す」の書き方は当たらないので、環境変数の名前で kind: env にし、note にビルドのときの値であることを書いた。分かれ道は、ビルドの設定と、利用者のスイッチ (mlAssistant.enabled) の状態の組み合わせで決まる。はじめは settings だけに書いたが、レビューの指摘 (low) で、設定だけで分かれる処理ではなく、コードのコメント (108-109 行) に業務の理由もあるので、rules (decision) にも書いた。PUBLIC_APP_ASSETS は、ブラウザが publicConfig (サーバーの config.getPublicConfig が PUBLIC_ で始まるキーを渡す) を通して読むので、analysis-conventions.md のとおり note に「config を通す」と書いた。(7) 閉じるのボタンの行き先 previousPage は、はじめは base || \"/\" (root_r に当たる) で、settings を含まない URL の画面から移ってきたときは、その URL (from.url.toString()) になる。読める前者は entry_id 付きで、読めない後者は式のまま unknown (dynamic_dispatch) にした。(8) 戻るのボタン (130 行) は md:hidden で、狭い画面でだけ見える (CSS の出し分け)。call の condition には、描く条件 (中身を出しているとき) と、押したときだけを書いた。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘は low の 1 件で、直した (ML Intern のモードでモデルを絞る決まりを rules に足した)。レビューが notes に残した、アバターの画像の応答を fields の * の read で書くか (slack.connect は Slack の応答を * の read で書いている) は、画像は列を持つデータではないので、書いていない"
