summary:
  status: interpretation
  value: "設定の画面 (/settings の下) を包む、モデルの一覧のメニューの枠。同じフォルダの +layout.ts は ssr = false を export するだけで、この枠より内側はブラウザだけで描かれる (load は無い)。自分ではデータを読み書きせず、祖先の枠の load から来る data.models と data.mlAssistantModels と、設定の store ($settings) の値を読むだけ。ML Intern のモードの機能が入っていてスイッチが入っていれば、モデルの一覧をそのモードのモデルだけに絞り、一覧に出さない印 (unlisted) のモデルと、検索欄の言葉に合わないモデルを除いて、モデルごとのボタンを出す。HuggingChat の配備なら、モデルの provider の印を出し、provider の組織のアイコンを huggingface.co から img で取りに行く。モデルのボタンは /settings/<モデルの id> へ、Application Settings のボタンは /settings/application へ、閉じるのボタンは設定に入る前の画面へ、戻るのボタンは /settings へ移る。画面の幅が広く、URL が /settings そのものなら、/settings/application へ移す。URL が /settings でなければ、包まれる画面 (children) を描く"
