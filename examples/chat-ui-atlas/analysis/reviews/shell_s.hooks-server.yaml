notes: "(1) 根拠の行は、src/hooks.server.ts、src/lib/server/hooks/ の 4 ファイル、auth.ts、config.ts、lock.ts、readOnly.ts、adminToken.ts、sessionOauth.ts、database.ts のコレクションの行、migrations.ts、routines/index.ts、refresh-conversation-stats.ts、abortedGenerations.ts、reaper.ts、finalize.ts、agentRuns.ts、.env:320、metrics.ts、vite.config.ts、mlAssistantFlag.ts、mlRegistry/enabled.ts、各 sweeper の定義の行で確かめ、主張を支えていないものは見つからなかった。(2) init の子を conditional にしたこと (HuggingChat の鍵が無ければ起動を止めるかが設定で決まる)、authenticateRequest の手前の /admin の 500 を条件に書いたこと、findUser の users.findOne を always にしたこと (手前はセッションが見つからない打ち切りだけ) は、分析の skill の when の決まりに合っているので指摘にしていない。(3) 移行の一覧が空の並び (routines/index.ts:15) で閉じているという判断は、3 つの条件 (コードに直接書いた値、その値だけで決まる、別の経路が無い) を満たし、checkAndRunMigrations の summary の note に値と行があるので妥当。refreshLock は移行の経路からは実際には呼ばれないが、refreshConversationStats の lock を保つ処理 (maintainLock、refresh-conversation-stats.ts:270) からは実際に呼ばれる。(4) init の summary の note にある、段にしないもの (initExitHandler、MetricsServer、loadMcpServersOnStartup、getShareThumbnailPng、displayToken) は、どれもデータの読み書きに至らないことを確かめた (metrics.ts と exitHandler.ts に collections も fetch も無い)。(5) ParkedCallSweeper など 5 つの not_analyzed は、note に読んだ所と止めた理由があり、conventions と context.md は打ち切りを禁じていないので指摘にしていない。(6) /admin の下の Bearer の確認を guards の other にしたことは、利用者のログインではなく共有の秘密の確認なので、妥当と見た。(7) AbortedGenerations の createdAt と conversations.stats の date.at を filter にしているのは並べ替えの条件で、分析の skill の use の決まり (並べ替えの条件も filter) に合う。(8) refreshConversationStats の summary は、lock を取れなかったとき 10 秒ごとに取り直すこと (refresh-conversation-stats.ts:275-277) に触れていないが、表現の範囲なので指摘にしていない。(9) checkAndRunMigrations の getClient().connect() (migrations.ts:25) は external のフレームが無いが、データの読み書きに至らず、summary で「DB に接続し」と触れているので指摘にしていない。(10) ほかの入口の結果 (layout_l.settings.nav_g、slack.connect) の ML_ASSISTANT_MODE、PUBLIC_APP_ASSETS、SLACK_ML_ENABLED は、同じ綴りと kind だった"
