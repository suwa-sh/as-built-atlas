notes: "(1) guards の value (load と connectAccount の ownership、action_default の origin) は、コードの否定の形の式を肯定の形に書き直しており、厳密にはコードに書いてある文字そのものではない。公開の実例 examples/umami-atlas の analysis/results/websites.yaml の guards の note にも「式を肯定の形で書いた」とあり、同じ扱いなので指摘にしなかった。ただし、この分析リポジトリの analysis-conventions.md には決まりが無いので、続ける書き方なら conventions に書いておくとよい。(2) +page.server.ts は connectAccount と readConnectionLink を $lib/server/slack/connections から import しているが、connections.ts は links.ts を再び export するだけなので、フレームの source を links.ts にしたのは正しい。(3) workspaceClient の本拠の workspace の bot の token (SLACK_ML_BOT_TOKEN) は settings に無いが、資格の値で動きの分かれ道ではないので指摘にしなかった。(4) database.ts のコレクションの行 (159 mcp.selections、160 slack.connections、161 slack.links、166 slack.installations、170 sessions)、external フレームの source の行、upsert の create と update の分け方は、すべてコードと合っていた"
