format_version: 1
target:
  repo: github.com/huggingface/chat-ui
  name: chat-ui
  clone_path: ../chat-ui
  scope: .
  commit: 62d3bfb703365915ee87862fbd8f459310b4cfc4
profile:
  id: ui-sveltekit
  version: 0.1.0
extractors:
- name: sveltekit-pages
  run: abatlas-extract glob
  layer: page
  rationale: routes は既定の src/routes (svelte.config に kit.files の設定は無い)。プロファイルの既定のまま。+page@
    の書き方と、matcher 付きの段は、このリポジトリには無い
  params:
    files:
    - src/routes/**/+page.svelte
    - src/routes/**/+page@*.svelte
    segments:
      strip_prefix: src/routes
      drop:
      - \([^)]+\)
      empty: (root)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: \[([xu])\+([0-9A-Fa-f]+)\]
        with: \1\2
      - pattern: \[\.\.\.([^=\]]+)(=[^\]]+)?\]
        with: \1_c
      - pattern: \[\[([^=\]]+)(=[^\]]+)?\]\]
        with: \1_o
      - pattern: \[([^=\]\[]+)(=[^\]]+)?\]
        with: \1_d
      - pattern: ^\(root\)$
        with: root_r
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: ^\s*<script
    contains:
      form: (?i)<form[^>]*method=["']?post
- name: sveltekit-layouts
  run: abatlas-extract glob
  layer: layout
  rationale: +layout.svelte は 3 つ (routes 直下、settings、settings/(nav))。+layout.ts は
    routes 直下 (load で 7 つの API を読む) と settings/(nav) (ssr = false だけ) にあり、どちらも同じフォルダに
    +layout.svelte があるので、+layout.svelte の無い枠の load は無い。+layout.server.ts は無い
  params:
    files:
    - src/routes/**/+layout.svelte
    - src/routes/**/+layout@*.svelte
    segments:
      strip_prefix: src/routes
      prefix:
      - (layout)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(layout\)$
        with: layout_l
      - pattern: \[([xu])\+([0-9A-Fa-f]+)\]
        with: \1\2
      - pattern: \[\.\.\.([^=\]]+)(=[^\]]+)?\]
        with: \1_c
      - pattern: \[\[([^=\]]+)(=[^\]]+)?\]\]
        with: \1_o
      - pattern: \[([^=\]\[]+)(=[^\]]+)?\]
        with: \1_d
      - pattern: ^\((.+)\)$
        with: \1_g
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: ^\s*<script
- name: sveltekit-hooks
  run: abatlas-extract glob
  layer: shell
  rationale: src/hooks.server.ts が init / handle / handleError / handleFetch を export
    する (handle はセッションの読み書きとログインの確認を行う)。src/hooks.ts は transport (PublicConfig の写し替え)
    だけで、データに触れないので入口にしない。hooks.client、src/params は無い。src/routes/+error.svelte は $app/state
    の page.status と page.error を出すだけで、データに触れないので入口にしない
  params:
    files:
    - src/hooks.server.ts
    - src/hooks.server.js
    segments:
      strip_prefix: src
      drop_last: false
      prefix:
      - (shell)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(shell\)$
        with: shell_s
      - pattern: \.
        with: '-'
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: export\s+(const|async\s+function|function)\s+handle\b
    contains:
      handle: export\s+(const|async\s+function|function)\s+handle\b
      handle_fetch: export\s+(const|async\s+function|function)\s+handleFetch\b
      init: export\s+(const|async\s+function|function)\s+init\b
