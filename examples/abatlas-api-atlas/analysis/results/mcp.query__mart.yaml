      evidence:
        - { file: mcp_server.py, line: 79 }
      note: "ツールの説明 (docstring) をそのまま写した。(1) 「limit は最大 10000」は、ツールの側では確かめていない (mcp_server.py 78 行は int の既定 200 だけ)。上限を確かめるのは、呼ばれる HTTP の操作の引数の宣言 (api.py 243 行の Query(200, ge=1, le=10000)) で、超えると API が誤りを返し、ツールは error と status の形で返す。(2) 説明は filters を「等値絞り込み」とするが、ツールは filters の項目をそのままクエリにして渡し (mcp_server.py 41-42 行)、呼ばれる操作は、列名の接尾辞 __prefix / __under / __contains / __min / __max を前方一致・配下・部分一致・数値の範囲として読み (api.py 59-61 行)、order の項目を絞り込みから外して並べ替えの列として読む (api.py 245 行)。コードを正とし、等値は接尾辞の無いときの既定とした。(3) 転送口 /mcp で MCP の SDK が行う Host / Origin の確認は、フレームにしない。許可の集合は、リポジトリのコードが _allowed_hosts() (api.py 142-145 行。ループバックの名前と、環境変数 ABATLAS_ALLOWED_HOSTS の名前) から、ポートの有る無しの両方で作る (api.py 388-394 行)。標準入出力で出す経路 (mcp_server.py 95-97 行の run) には、この確認は無い"
