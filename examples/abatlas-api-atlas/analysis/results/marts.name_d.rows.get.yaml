notes: "(1) 定義ファイル (OpenAPI) が無いので、入口のフレームの source は登録の行 (api.py 242 行の @app.get) にし、context.md の「入口の source がコードの登録の行のとき」に従って、handler へは登録の行が指す関数 query_mart へ辿るだけにした (call の根拠も登録の行)。(2) 全 route に掛かる middleware のうち、Host の確認 (LoopbackHostMiddleware) は、確認をする middleware なので handler 層のフレーム (kind middleware、caller は入口) にし、guards (kind other、value は _allowed_hosts()) と settings (ABATLAS_ALLOWED_HOSTS) を書いた。このフレームは誰も呼ばない終端になり、機械チェックは guards だけの終端を認めないので、同じ確認を rules (validation) にも書いた (重なりは承知の上)。保護ヘッダを付けるだけの SecurityHeadersMiddleware は、読み書きにも確認にも当たらないのでフレームにしない。(3) この route は、serve では MCP の Starlette アプリの下に Mount('/') で差し込まれる (api.py 396 行)。外側のアプリの DNS rebinding 対策 (TransportSecuritySettings) は /mcp の転送口に掛かるもので、この route には掛からないと読んだ (ライブラリの中なので辿らない)。(4) DuckDB は rdb (dbms duckdb) に当てはめた。宣言の表 meta.declarations と information_schema.columns は表の名前がコードにあるので fact。mart の実体の表は、DB に保存された宣言 (rel_schema / rel_alias) から決まるので、context.md の典型例に従って unknown + generated_at_runtime にし、dbms の段だけを書いた。DuckDB のファイルの場所 (ABATLAS_DUCKDB、既定は analysis/data/abatlas.duckdb) は、どの入口でも同じ接続先の設定なので、database の段にも settings にも書かない。(5) external は、接続を開く duckdb.connect の 1 フレームで閉じた。execute による読み取りは、SQL を実行している段 (read_declarations、columns、query_mart) の io に書いた。(6) MartCatalog.declarations は包む関数なのでフレームにせず、実体の read_declarations をフレームにした。_q / _rel / _escape_like は小さな補助なのでフレームにしない。"
