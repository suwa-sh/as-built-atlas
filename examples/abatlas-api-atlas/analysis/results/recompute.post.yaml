notes: "(1) analysis-conventions.md の「build_repo の先は、読み書きを持つ最初のフレームで止める」に従い、読み書きを持つ _profile と oss_copy_outdated もフレームにした。補助の profile_dir / _profile_id / _overlay / _scope_dir はフレームにせず、読み書きと業務のルールを呼ぶ段 (render_dbt_project、_profile、build_repo) に書いた。(2) run_etl の中の target_files は git ls-files を別のプロセスで動かすが、analysis-conventions.md が external に挙げる subprocess は dbt だけなので、フレームにせず、run_etl の io に filesystem の list として書いた。(3) duckdb.connect は、check_manifest (declarations.py 257 行、読み取り専用) と build_repo (build.py 194 行、読み書き) の 2 か所で呼ぶ。context.md の「同じ処理が何度も呼ばれるとき」に従い、深さ優先で最初に着く check_manifest の下に 1 回だけ external のフレームを書き、build_repo は summary の note で指した。(4) 固定の値で閉じている枝: build_repo(repo) が select を渡さないので --select と shutil.copy2 の枝 (build.py 174-177 行)、render_dbt_project(repo) が profile_id を渡さないので配布物のプロファイルを直接使う枝 (build.py 111-114 行) は辿らず、それぞれのフレームの summary の note に書いた。プロファイルの dbt-template の有無で分かれる所 (build.py 118 行) は、実行時のファイルの有無で決まるので、残した。(5) 配布物の schema/vocab と JSON Schema の読み取りは lru_cache で最初の 1 回だけなので、呼ぶ順で最初に読む段 (_profile の validate_profile と、run_etl) にだけ書き、後の段 (check_manifest、publish_declarations、publish_meta、build_repo の用語集と語彙) には書かなかった。段の値は、どちらも directory: schema にそろえた。ABATLAS_TARGET_ROOT は、_scope_dir の結果を受け取って動きが変わる run_etl に書いた (build_repo は値を渡すだけ)。dbt-template / profiles / schema は範囲 (abatlas) の外なので、根拠は、それを読む範囲の中の行 (build.py、schemas.py) にした。(6) _reject_cross_site は guards と settings だけの終端だが、機械チェックが通したので、analysis-conventions.md が LoopbackHostMiddleware にだけ求める rules (validation) の写しは書かなかった。(7) ABATLAS_DUCKDB は analysis-conventions.md に従い settings に書かない。build.py 178 行は、子のプロセスに作業用のファイルの場所を渡すコードで、設定を読む所ではない。(8) evidence は、根拠の近くに名前が無い主張を 0 件と出した。照合できなかった 7 件 (render_dbt_project の io の 1-5 番目、run_etl の io の 6-7 番目) は、ファイルやディレクトリの段の値が * で探せる語が無いためで、根拠の行は開いて確かめた (build.py 108 / 129 / 98 は配布物の dbt-template を写す行、117 / 119 / 130 / 96 はプロファイルの dbt-template、133 は analysis/dbt/models/repo、26 / 122-127 は RENDERED を消す行、129-134 は写して README を書く行、etl.py 67 / 74 は対象の範囲を歩く行、validate.py 267 / 292 / 342 は根拠のファイルを開いて行数を数える行)。(9) レビュー (abatlas-review-entry) は別の担当が行った。low の指摘 8 件は、コードで確かめてすべて直した (oss_copy_outdated に作業定義の読み取りを足す、manifest.json 2 件・entry-list.yaml・data-dictionary.yaml の読み取りに fields を足す、render_dbt_project の作業定義の決まりに止める経路 2 つを足す、build_repo と _profile のルールに根拠の行を足す)"
