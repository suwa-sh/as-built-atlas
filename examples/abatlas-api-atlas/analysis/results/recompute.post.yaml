notes: "(1) 対象の clone の作業ツリーは、分析の間も書き換わっていた (api.py と declarations.py に、コミットしていない変更がある。api.py は分析中にも 2 回変わった)。入口の一覧は /recompute を api.py 354 行としているが、いまのファイルでは 400 行なので、根拠の行はすべて分析した時点のファイルに合わせた (entry.source も 400)。target.commit は作業定義のまま書いたが、行番号はそのコミットのものではない。(2) 層の当てはめ: 再集計の手順 build_repo、ETL の run_etl、dbt のプロジェクトの合成 render_dbt_project、プロファイルの読み込み _profile、配布物との比較 oss_copy_outdated、宣言の検査 check_manifest は、どれも自分でファイルや DuckDB を読み書きする手順なので logic にした (analysis-conventions.md は check_manifest の層を決めていない。declarations.py の他の関数は adapter だが、check_manifest は検査が役割なので logic)。DuckDB の meta の表に書く publish_declarations / publish_meta は adapter (analysis-conventions.md のとおり)。dbt の起動 (subprocess.run) は external の dbt build、DuckDB は duckdb.connect の external で閉じた (check_manifest の読み取り専用の接続と、build_repo の書き込みの接続の 2 つ)。DuckDB のファイルの入れ替え (os.replace) と作業用のファイルの削除は filesystem にした。(3) Host / Origin: Host の確認は middleware (host_check) と _reject_cross_site の両方で行うので、両方に guards (value は _allowed_hosts()) と settings (ABATLAS_ALLOWED_HOSTS) を書いた。Origin の確認は _reject_cross_site の guards (value は origin == host)。どちらの確認も、終端の決まりと手本に合わせて rules (validation) にも書いた。(4) 同時実行の 409 は、recompute の rules (decision)。錠はプロセスの中だけで効くことを note に書いた。SystemExit を 500 にするのも recompute の rules (decision)。finally の錠の解放はフレームにせず summary に書いた。(5) 固定の値で閉じている呼び出し: recompute は build_repo に select を渡さない (api.py 406 行) ので、--select の枝と、今の DuckDB を写す枝 (build.py 174〜177 行) は辿らない。176 行の条件は select と db.exists() の組み合わせだが、select が None なら決して成り立たないので、閉じていると見た。フレームには notes の項目が無いので、閉じている呼び出しは build_repo の summary の note に書いた。render_dbt_project の profile_id の枝 (111〜114 行) も同じ。(6) 深さ: analysis-conventions.md の「読み書きを持つ最初のフレームで止める」に従い、render_dbt_project / run_etl / check_manifest の中の補助 (検査・変換の細部) は辿らず (ただし、run_etl の補助の CSV の書き出しと、対象の範囲のファイルの一覧の読み取りは、seed の中身になるので run_etl の io に写した)、各フレームの summary の note に止めた範囲を書いた。build_repo が直接呼ぶ関数のうち、読み書きか業務のルールを持つもの (_profile、oss_copy_outdated) はフレームにし、持たない小さな補助 (_scope_dir) は呼ぶ段に読み書きを書いた。配布物の語彙と用語集を読むだけの補助 (resource_kinds、term_labels、profile_term_problems) は、分析リポジトリのデータではないので読み書きに書かなかった。(7) ファイルの場所: 集計の DuckDB は ABATLAS_DUCKDB で変わるが、analysis-conventions.md に従い settings に書かず、既定の analysis/data/abatlas.duckdb を段に書き、note に ABATLAS_DUCKDB のことを書いた。プロファイルの場所 (作業定義の profile.dir で決まる) と、対象の範囲のフォルダ (作業定義の target で決まる) は、変わる部分を * にした (レビューの指摘で直した)。(8) seed の 16 の CSV は 1 つの書き込みにまとめ、fields は * にした (列は COLUMNS で決まるが、ファイルごとに違う)。(9) dbt が作業用の DuckDB に集計表を書くことは、dbt の中を辿らない決まりなので、io には書かず、dbt のフレームの call の note に書いた。"
