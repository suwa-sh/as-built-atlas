notes: "(1) 作業ツリーのずれ: 根拠の行は、いまのファイル (api.py の /recompute は 400 行、_reject_cross_site 195 行、LoopbackHostMiddleware 178 行、create_app の add_middleware 218 行。declarations.py の check_manifest 271 行、publish_declarations 207 行、publish_meta 233 行) と突き合わせ、すべて合った。レビューの間に api.py の行は変わらなかった (始めと終わりで /recompute は 400 行)。入口の一覧の 354 行と、target.commit は、いまのファイルの行と合わない (結果の notes(1) に書いてあるとおり)。(2) 指摘にしなかった判断: check_manifest を logic にしたこと (analysis-conventions.md は層を決めていない。検査が役割で、手本の adapter は読むだけの関数) は妥当と見た。build_repo の 174〜177 行と render_dbt_project の 111〜114 行を閉じた枝として辿らないことは、recompute が build_repo(repo) を select も profile_id も渡さずに呼ぶ (api.py 406 行、build.py 156 行) ので 3 つの条件を満たす。check_manifest と build_repo が manifest.json を別々に読むのは、コードのとおり (273 行と 195 行)。配布物の語彙と用語集の読み取り (resource_kinds、term_labels、profile_term_problems) を io に書かないことは、notes(6) の判断を受け入れた。(3) 綴り: _allowed_hosts()、ABATLAS_ALLOWED_HOSTS、LoopbackHostMiddleware のフレームの形、duckdb.connect、information_schema.columns の段は、手本 (marts.name_d.rows.get) と同じ。"
