notes: "根拠の行 (mcp_server.py の 3, 22, 26-32, 40-42, 53, 77-80, 97 行) をすべて開き、主張を支えていることを確かめた。木の形 (入口 → handler → ApiClient.query_mart → httpx.AsyncClient.get)、links の綴り (/marts/{name}/rows、entry_id marts.name_d.rows.get)、_json を rules (decision) に書くこと、転送の違いを adapter の note に書き settings に書かないことは、analysis-conventions.md の「MCP のツール」と合う。note の中の api.py と cli.py の主張 (in_process_client を create_server で使う、TransportSecuritySettings の Host と Origin の許可を _allowed_hosts() から作る、--api の既定 http://127.0.0.1:8765) は、作業ツリーの api.py 425-439 行 (コミットでは 44 行前) と cli.py 190 行で確かめた。指摘にしなかったこと: (a) 入口の summary の「ツールの名前は関数の名前」は、コードではなく MCP SDK の既定の振る舞いだが、広く知られた既定で、主張の中心でもないので fact のままでよいとした。(b) /mcp の DNS rebinding 対策をフレームにせず note に書いた判断は、確認の実体が SDK の中で、規約の木にも無いので妥当とした。"
