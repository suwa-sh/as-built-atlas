format_version: 1
target:
  repo: github.com/umami-software/umami
  clone_path: ../umami
  scope: .
  commit: 559e3c607c23d2c72d9bd4f6481bda428255323c
profile:
  id: ui-nextjs
  version: 0.4.0
extractors:
- name: next-pages
  run: abatlas-extract glob
  layer: page
  params:
    files:
    - src/app/**/page.tsx
    - src/app/**/page.jsx
    - src/app/**/page.ts
    - src/app/**/page.js
    exclude:
    - src/app/_*/**
    - src/app/**/_*/**
    segments:
      strip_prefix: src/app
      drop:
      - \([^)]+\)
      replace:
      - pattern: ^(\(\.+\))+
        with: ''
      empty: (root)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\[\[\.\.\.(.+)\]\]$
        with: \1_o
      - pattern: ^\[\.\.\.(.+)\]$
        with: \1_c
      - pattern: ^\[(.+)\]$
        with: \1_d
      - pattern: ^@(.+)$
        with: \1_s
      - pattern: ^\(root\)$
        with: root_r
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: export\s+default
    contains:
      client: ^['"]use client['"]
      metadata: export\s+(const\s+metadata|(async\s+)?function\s+generateMetadata)
  rationale: app ディレクトリは src/app にあり、画面は page.tsx だけ (page.ts / .jsx / .js は 0 件、private
    folder も 0 件)。next.config.ts は pageExtensions を変えていない。プロファイルの既定パラメータのまま使える
- name: next-layouts
  run: abatlas-extract glob
  layer: layout
  params:
    files:
    - src/app/**/layout.tsx
    - src/app/**/layout.jsx
    - src/app/**/layout.ts
    - src/app/**/layout.js
    exclude:
    - src/app/_*/**
    - src/app/**/_*/**
    segments:
      strip_prefix: src/app
      prefix:
      - (layout)
      replace:
      - pattern: ^(\(\.+\))+
        with: ''
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(layout\)$
        with: layout_l
      - pattern: ^\[\[\.\.\.(.+)\]\]$
        with: \1_o
      - pattern: ^\[\.\.\.(.+)\]$
        with: \1_c
      - pattern: ^\[(.+)\]$
        with: \1_d
      - pattern: ^@(.+)$
        with: \1_s
      - pattern: ^\((.+)\)$
        with: \1_g
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: export\s+default
    contains:
      client: ^['"]use client['"]
      metadata: export\s+(const\s+metadata|(async\s+)?function\s+generateMetadata)
  rationale: 画面を包む共通の枠 (layout.tsx) を、画面とは別の入口として拾う。app の場所は next-pages と同じ src/app。枠以外の特別なファイルは
    not-found.tsx (文言だけ) と (main)/websites/[websiteId]/@modal/default.tsx (null を返すだけ)
    の 2 つで、どちらもデータに届かないので入口にしない
- name: agent-listed-part
  run: abatlas-extract listed
  layer: part
  rationale: '保存されたボードの設定 (列の component.type) で、名前から部品を引く登録表 boardComponentRegistry
    がある。データを読む部品が 16 あるので、項目ごとに入口にする。入口にしなかったもの: TextBlock (受け取った文字を出すだけ)。SharePage
    の PAGE_COMPONENTS は、URL の段で引く対応表なので、登録表に当たらない (指す部品は、既にある画面の入口の本体と同じ)。共有の部品として、WebsiteControls
    を足した (多くの入口が自分で描く、大きな部品。ADR 0014 の決まり)'
