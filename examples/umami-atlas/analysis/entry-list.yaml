format_version: 1
target:
  repo: github.com/umami-software/umami
  clone_path: ../umami
  scope: .
  commit: 559e3c607c23d2c72d9bd4f6481bda428255323c
profile:
  id: ui-nextjs
  version: 0.3.0
extractors:
- name: next-pages
  run: abatlas-extract glob
  layer: page
  params:
    files:
    - src/app/**/page.tsx
    - src/app/**/page.jsx
    - src/app/**/page.ts
    - src/app/**/page.js
    exclude:
    - src/app/_*/**
    - src/app/**/_*/**
    segments:
      strip_prefix: src/app
      drop:
      - \([^)]+\)
      replace:
      - pattern: ^(\(\.+\))+
        with: ''
      empty: (root)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\[\[\.\.\.(.+)\]\]$
        with: \1_o
      - pattern: ^\[\.\.\.(.+)\]$
        with: \1_c
      - pattern: ^\[(.+)\]$
        with: \1_d
      - pattern: ^@(.+)$
        with: \1_s
      - pattern: ^\(root\)$
        with: root_r
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: export\s+default
    contains:
      client: ^['"]use client['"]
      metadata: export\s+(const\s+metadata|(async\s+)?function\s+generateMetadata)
  rationale: app ディレクトリは src/app にあり、画面は page.tsx だけ (page.ts / .jsx / .js は 0 件、private
    folder も 0 件)。next.config.ts は pageExtensions を変えていない。プロファイルの既定パラメータのまま使える
- name: next-layouts
  run: abatlas-extract glob
  layer: layout
  params:
    files:
    - src/app/**/layout.tsx
    - src/app/**/layout.jsx
    - src/app/**/layout.ts
    - src/app/**/layout.js
    exclude:
    - src/app/_*/**
    - src/app/**/_*/**
    segments:
      strip_prefix: src/app
      prefix:
      - (layout)
      replace:
      - pattern: ^(\(\.+\))+
        with: ''
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(layout\)$
        with: layout_l
      - pattern: ^\[\[\.\.\.(.+)\]\]$
        with: \1_o
      - pattern: ^\[\.\.\.(.+)\]$
        with: \1_c
      - pattern: ^\[(.+)\]$
        with: \1_d
      - pattern: ^@(.+)$
        with: \1_s
      - pattern: ^\((.+)\)$
        with: \1_g
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: export\s+default
    contains:
      client: ^['"]use client['"]
      metadata: export\s+(const\s+metadata|(async\s+)?function\s+generateMetadata)
  rationale: 画面を包む共通の枠 (layout.tsx) を、画面とは別の入口として拾う。app の場所は next-pages と同じ src/app。枠以外の特別なファイルは
    not-found.tsx (文言だけ) と (main)/websites/[websiteId]/@modal/default.tsx (null を返すだけ)
    の 2 つで、どちらもデータに届かないので入口にしない
