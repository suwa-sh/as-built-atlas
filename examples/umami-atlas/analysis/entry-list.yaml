        / LinkMetricsBar に替わる (componentByEntityType、:149))。登録表を引いて描くのは BoardComponentRenderer
        (src/app/(main)/boards/[boardId]/BoardComponentRenderer.tsx:17 で getComponentDefinition(config.type)、:28
        で部品を選ぶ)。保存されたボードの列の設定 (component.type) で選ばれる。描く画面は /boards/[boardId] と /dashboard
        (BoardViewColumn.tsx:53)、/boards/[boardId]/design と /dashboard/edit (BoardEditColumn.tsx:61、BoardComponentSelect.tsx:507
        の試し描き)、/share/[slug]/[[...path]] (SharePage.tsx:93 の BoardViewPage)'
