notes: "共有の部品 WebsiteControls は、ComparePage (compare_page) で止めて links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠 ComparePage.tsx:4 / :12) を書いており、決まりどおり (中を辿っていないことは指摘しない)。渡す値 (allowCompare={true}、ほかは既定) も compare_page の summary にあり、WebsiteControls.tsx:12-17 の既定値と合う。共通の段も決まりどおり: checkAuth に CLOUD_MODE の settings と API キーの枝の rules 1 行、その下に getUser。canViewWebsite に ownership (canViewWebsite) と role (user.isAdmin) の 2 件。API_URL / BASE_PATH は、入口から深さ優先で最初に API を呼ぶ use_stats に 1 回だけ。target は作業定義と同じ。同じ処理の置き場 (getWebsite は getEntity の下、fetchWebsite は「経路は q_get_website と同じ」) も、辿る順 (stats/route.ts:24 の canViewWebsiteSection が :28 の getQueryFilters より先) と合う。注釈の API を固定の値で閉じた扱い (WebsiteChart.tsx:38 の enabled が !!showAnnotations && !!websiteId、ComparePage.tsx:15 は showAnnotations を渡さない、この木で WebsiteChart を描くのは ComparePage だけ) は、指示書の 3 つの条件を満たし、website_chart の summary と先頭の notes に書いてある。CompareTables の一覧 20 種と、受け口の分かれ道 (SESSION_COLUMNS 9 種 / EVENT_COLUMNS のうち 9 種と event / channel) の対応も、constants.ts と合う。気づいたが指摘にしなかったもの: api_metrics の rules の「search があれば絞る」は、この画面の MetricsTable が search を送らないので通らない (受け口のコードとしては正しい)。MetricLabel の referrer の行の外部リンク (https://<ドメイン>) は、context.md の決まりどおり links に書いていない (summary にも無いが、概要の画面の結果も notes に書くだけ)。"
