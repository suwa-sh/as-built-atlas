notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読まれた)。high と medium の指摘は無い。この入口に固有の段 (ComparePage、CompareTables、WebsiteControls の allowCompare、WebsiteDateFilter の比較の期間の選択、WebsiteMetricsBar と stats の受け口の比較の期間、WebsiteChart と pageviews の受け口の compare、注釈のフックの enabled、MetricsTable の params による期間の上書き、metrics の受け口の 4 つの枝、getEventMetrics / getPageviewMetrics / getSessionMetrics / getChannelMetrics の SQL、Favicon と設定) は、根拠の行をコードと突き合わせ、主張が合っていることを確かめた。FilterBar からセグメントの保存まで (canUpdateWebsite、createSegment) と、checkAuth / canViewWebsiteSection / getQueryFilters / fetchWebsite も確かめた。getWebsiteStats / getPageviewStats / getSessionStats / getSessionDataProperties / getSessionDataValues / getWebsiteDateRange の SQL の列は、抜き取りでしか確かめていない。綴りは、ほかの入口の結果と比べて同じだった (設定の名前、canViewWebsiteSection などの関数の名前、PERMISSIONS.websiteUpdate)。指摘にしなかったが伝えること: (1) canViewWebsite と canUpdateWebsite の中の管理者の確認 (website.ts:9、:137) は note に書くだけで、kind: role の user.isAdmin の確認にしていない。概要の画面 (websites.websiteId_d) の結果と同じ扱いだが、breakdown / funnels / goals などの結果は role の確認として書いている。入口をまたいでそろえるかは人が決めてほしい。(2) DATABASE_REPLICA_URL の status は、この結果では 11 件すべて interpretation。生の SQL を使う多くの入口の結果も interpretation で、fact の結果も少しある。読み取りを複製に送るのはライブラリ ($replica) の動きでもあるので指摘にしていないが、そろえるかは人が決めてほしい。(3) 入口の summary に「ほかの画面への遷移は無い」とあるが、path と referrer の行の FilterLink は、計測している対象のサイトを新しいタブで開く外部リンク (MetricLabel.tsx:152、:188) を持つ。概要の画面の結果と同じく入口ではないので links に書かないのは妥当だが、notes (6) に一言あると親切。(4) useFilterParameters は URL の excludeBounce をそのまま送る (useFilterParameters.ts:37) ので、この画面に「直帰を除く」のチェックは無くても、URL に excludeBounce が残っていれば stats / pageviews / metrics はそれで絞る。結果は直帰を除くルールを q_stats に書いているので、矛盾はない。(5) getQueryFilters は、期間の開始を resetAt と CLOUD_MODE の制限で後ろにずらす。比較の期間 (左の表の startAt / endAt と、stats / pageviews の比較の期間) にも同じずらしが効くので、比較の期間がリセットの日時より前だと、左の表や比較の値が空になる。分析の誤りではないので、伝えるだけにする。"
