notes: "(1) 根拠の行は、すべての段で対象のコードを開いて確かめた。上の 2 件のほかに、主張を支えない根拠は無かった。層と種類、呼び出しの when、読み書きの種類と操作、確認の値 (user.isAdmin)、設定の名前 (CLOUD_MODE / API_URL / BASE_PATH / REDIS_URL)、キャッシュのキーの形 (auth:* / link:* / pixel:*) は、決まりと、ほかの入口の結果の綴りに合っている。つながりの行き先の入口 admin.users.userId_d は、入口の一覧にある。(2) checkAuth の段に CLOUD_MODE の設定が無いことは、指摘にしなかった。この入口の受け口 (/api/users、/api/admin) では、有無で結果が変わらず、分析の skill の「この入口では有無で結果が変わらない設定は書かない」に合う。ただし、admin.websites / admin.teams / layout_l.main_g.admin の結果は、同じ段に CLOUD_MODE を書いている。入口をまたいでどちらにそろえるかは、人が決めるとよい。(3) deleteUser の中のライブラリの呼び出しを、external の段 1 つ (ext_prisma_delete_user) にまとめていることは、結果の notes の (7) に理由があり、読み書きは 1 件ずつ書いてあるので、指摘にしなかった。(4) POST /api/users の id を作る uuid() は、環境変数 USE_UUIDV7 で UUID の版が変わる (crypto.ts の 65 行目)。値の形が変わるだけで、処理の流れも読み書きの相手も変わらないので、設定の書き漏れにはしなかった。(5) getUsers の並べ替えのルールの kind は、この結果では decision、admin.teams の結果では validation。綴りをそろえる決まりの対象ではないので、指摘にしなかった。(6) analyzer.tests が無いので、テストの書き漏れは見ていない。"
