notes: "101 フレームすべての source・call・summary・parameters・io (fields を含む)・links・guards・settings・rules の根拠の行を、対象のファイルと prisma/schema.prisma で開いて確かめた。根拠の行のずれ、fact と interpretation の取り違え、辿り漏れ、権限の確認そのものの書き漏れ、書き込む列の書き漏れは見つからなかった。指摘にしなかったこと: (1) GET /api/boards/[boardId] は、この画面からは呼ばれない (BoardEditForm.tsx:61 が空文字を渡し、useBoardQuery.ts:13 の enabled が偽になる) が、その下に認証の経路 (parseRequest → checkAuth → getUser) と getBoard / getTeamUser の最初の置き場がある。「入口から辿る順で最初に着いた呼び出し元の下に書く」と「成り立たないように見える呼び出しは conditional で残す」の 2 つの決まりに従った結果で、結果の notes の (3) にも書いてある。実際に動く経路の読み書きが、動かない受け口の下に見える木になるので、この置き方でよいかは人が決めるとよい。(2) links の target (/boards/${boardId}、/boards/${boardId}/design) は、コードの文字 (/boards/${id}、/boards/${board.id}/design) と違うが、ほかの入口の結果 (boards.boardId_d.edit) と同じ綴りにそろえたもので、note にコードの書き方がある。(3) GET /api/users/[userId]/websites の ownership の値 (auth.user.id === userId) は関数の名前ではないが、確認する関数が無く、admin.users.userId_d、admin.websites.websiteId_d、boards.boardId_d.edit の結果も同じ綴り。(4) GET /api/me/websites のフレームだけ parameters が無い (route.ts:8-12 に page / pageSize / orderBy / sortDescending / includeTeams のスキーマがある)。この画面からは呼ばれない受け口で、parameters は書き漏れの検査の対象ではないので、指摘にしていない。(5) checkAuth の API キーの経路 (checkApiKeyAuth → getApiKeyByHash) は辿っておらず、settings の CLOUD_MODE と note だけ。ほかの入口の結果と同じ扱い。(6) website.ts:304 の share.findFirst と :334 の share.findMany は、自分の external のフレームを持たず、ext_prisma_get_website / ext_prisma_paged_website の名前にまとめてある。ほかの入口の結果と同じ書き方。(7) 枠 ((main) の layout) の処理を辿っていないことは、決まりのとおり。テストとの対応は、analyzer.tests が無いので見ていない。"
