notes: "機械チェック (validate result) は OK。全フレームの call / summary / parameters / io の根拠行を開いて確かめ、行番号はすべて実在して主張を支えている。layout.tsx (cloudMode で null、AdminLayout を描く、metadata のタイトル書式)、AdminLayout.tsx ('use client'、useLoginQuery、isAdmin と cloudMode の判定、PageBody)、PageBody.tsx (幅 1320px、margin 0 auto)、useLoginQuery.ts (queryKey login、post /auth/verify、enabled !user)、api-url.ts (/auth は basePath + /api)、useApi.ts:28 と client.ts:4 (Bearer に localStorage のトークン)、verify/route.ts、request.ts (URL と本文の読み取り、checkAuth)、auth.ts (2FA 仮トークンの拒否、userId / Redis authKey の経路、パスワード指紋、isAdmin)、api-key.ts:15 (/api/auth は API キー拒否)、user.ts (findUnique、deletedAt null、includePassword)、team.ts (team.findMany、members.some)、redis.ts:37、next.config.ts:16 と :217、SideNav.tsx:117、MobileNav.tsx:64 をすべて確認した。テーブル名は schema.prisma の @@map (user:37、team:249、team_user:265) と dbms (postgresql:8) に一致。Redis の key_pattern auth:* は saveAuth (auth.ts:150) の組み立てと合い、context.md の kvs の当てはめどおり。team_user をリレーションの条件として interpretation にしているのは、(main) の枠の結果とレビューでも同じ扱いなので指摘にしない。辿り漏れは無い (parseShareToken はヘッダーのトークンを解くだけ、json はレスポンスを作るだけ、PageBody の useMessages は文言を引くだけで、どれもデータに届かない)。気になった点 (指摘にはしない): ext_prisma_team の call の evidence にある verify/route.ts:12 は getAllUserTeams を呼ぶ行で、Prisma を呼ぶ行ではない (team.ts:93 があるので主張は支えられている)"
