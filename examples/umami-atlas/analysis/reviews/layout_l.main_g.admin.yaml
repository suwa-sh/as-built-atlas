notes: "機械チェック (validate result) は OK で、プロファイルは作業定義の profile.dir から読めている。analysis-conventions.md には、このリポジトリだけの決まりは書かれていない (見出しと例のコメントだけ)。すべてのフレームの call / summary / parameters / io / guards / settings / rules の根拠の行を開いて確かめ、上の 2 件のほかは、行が実在して主張を支えていた。確かめた主なもの: layout.tsx (cloudMode で null、AdminLayout、metadata)、AdminLayout.tsx (use client、useLoginQuery、isAdmin と cloudMode の判定、PageBody)、useLoginQuery.ts (post /auth/verify、enabled は !user)、api-url.ts (/auth は API_URL を使わず basePath + /api)、verify/route.ts、request.ts、auth.ts、api-key.ts、redis.ts、user.ts、team.ts、schema.prisma の @map と @@map、next.config.ts の env。notes (2) の「setUser(null) は LogoutPage.tsx:20 にしか無い」も、検索して確かめた。指摘にしなかったこと: (1) POST /api/auth/verify の呼び出しを conditional のままにし、この枠からは呼ばれないと note に書く扱いは、指示書に「条件が成り立たないと読める呼び出し」の決まりが無いので、当てはめ違いにしていない。(2) Redis の読み取りの fields が * なのは、値をまるごと取り出す (redis.ts:37 / :40) ので、決まりのとおり。(3) フレームにしていない PageBody、useApi、getApiUrl、parseShareToken、parseSecureToken、json は、見た目の部品か、データに届かない小道具なので、辿り漏れにしていない。API キーの枝 (checkApiKeyAuth) は、/api/auth が受け付けないパス (api-key.ts:15) で getApiKeyByHash の手前で null を返すので、api_key の読み書きが無いことも漏れにしていない。(4) 1 件目の指摘は境目の判断。context.md は「キーの名前がコードから読めれば fact」としており、auth: の形は auth.ts:150 に書いてある。読む行のキーがトークンの値で、形が別の関数からの読み取りになる点を重く見て指摘にした。fact のままにするかは、分析の側で決めてよい"
