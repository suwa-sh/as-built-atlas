notes: '次は指摘にしなかった。(1) 根拠の行は、全 180 フレームの summary / call / parameters / io / links / guards / settings / rules について、対象のコードの行を開いて突き合わせ、ファイルや行の範囲の外れは無く、主張を支えない行も見つからなかった。(2) 同じ処理の置き場 (ReplaysPage の中の順 useSubscription → WebsiteControls → ReplaysDataTable → SavedReplaysDataTable → SessionModal → ReplayModal で、深さ優先で最初に着いた呼び出し元) と、終端の決まりのための書き直し (_rw の段。api_session_replays、ReplaySaveForm、ReplayModal、canViewAuthenticatedWebsite、canUpdateWebsite、canDeleteWebsite の下) は、プロファイルと analysis-conventions の決まりどおり。書き直した段に確認・設定・ルールの繰り返しも無い。ReplayPlayback の useWebsiteSessionQuery (38 行) の省略も、summary に経路が書いてある。(3) クラウドモードでの打ち切りの後ろの 5 つを conditional にしたこと、タブ (TabPanel) の選択を条件に含めないこと、イベントのプロパティのタブを conditional のフレームとして残したことは、heatmaps の結果や分析リポジトリの決まりと揃っている。(4) values の受け口の getQueryFilters / getValues は else の枝 (route.ts 52 行) だが、この画面の列には segment / cohort が無いことが note に書いてあるので always のままでよい。(5) ownership の確認の status が、canDeleteWebsite では fact、canUpdateWebsite と canViewWebsite では interpretation と揃っていない。値は関数の名前で、条件の中身は読み取りなので、どちらとも取れるため指摘にはしていない (replays.replayId_d のレビューと同じ扱い)。(6) canViewAuthenticatedWebsite の確認 (kind: other、value: auth?.user) の綴りは、replays.replayId_d と modal_s.replays.sessionId_d の結果と同じ。(7) 録画の再生 (ReplayPlayer の rrweb-player) は、記録したページの DOM を iframe に描き直す。記録側 (src/recorder/index.js 480 行) は inlineStylesheet: true だけで画像を埋め込まないので、再生のときにブラウザが記録したサイトの画像を取りに行くと考えられる。ただし、これはライブラリの動きで、リポジトリのコードからは読み切れず、同じ ReplayPlayback を描くほかの入口の結果も書いていないので、指摘にはしていない。書くなら、分析リポジトリの決まり (ブラウザから他社へ取りに行く処理は external_api) に当てはめるかを、人が決める。(8) analyzer.tests が無いので、tests の漏れは見ていない。'
