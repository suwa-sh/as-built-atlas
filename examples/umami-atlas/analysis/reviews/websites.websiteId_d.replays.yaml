notes: "2 回目のレビュー。機械チェック (validate result) は OK (作業定義の profile.dir から ui-nextjs のプロファイルを読んだ)。1 回目の指摘 (セッションの小窓の SessionActivity の下に EventData の段が無い) は直っている: event_data (conditional。hasData > 0 のイベントのプロパティのボタンを押したとき。SessionActivity.tsx 80・93・101・103 行) → use_event_data → api_event_data_by_id (parseRequest と canViewWebsiteSection の section events は既存のフレームと同じ経路と summary に書き、q_parse_request と q_can_view_website_section の summary にもこの受け口が足されている) → q_event_data_by_id (PostgreSQL の event_data と website_event の結合、ClickHouse の event_data。列は getEventDataById.ts 22-35・47-58 行と合う。CLICKHOUSE_URL は db.ts 27・32・38 行) → ext_event_data_by_id_pg (DATABASE_REPLICA_URL。prisma.ts 738・746 行) / ext_event_data_by_id_ch (clickhouse.ts 721 行)。websites.websiteId_d.sessions.sessionId_d の結果と同じ形で、session_activity の summary の参照先も実在する。共有の部品 WebsiteControls は、描くフレーム replays_page で止めて links に embed (entry_id: part_p.shared_a.WebsiteControls、根拠 ReplaysPage.tsx 5・55 行) を書いており、決まりどおり (中を辿っていないことは指摘にしない)。どの入口にも出る共通の段 (checkAuth の CLOUD_MODE と API キーの枝の rules、getUser、src/permissions/ の関数の ownership と role: user.isAdmin、BASE_PATH は最初に API を呼ぶ useSubscription、API_URL は /auth 以外を最初に呼ぶ useReplaysQuery、target の clone_path) は決まりのとおり。指摘にしなかったこと: canViewWebsiteSection の guards は kind other (関数の中に管理者の確認が無く canViewWebsite に任せるため。ほかの入口の結果 11 件も同じ綴り)。ownership の guards の status が canViewTeam・canDeleteWebsite は fact、canViewWebsite・canUpdateWebsite は interpretation と割れている点は、1 回目と同じく決まりが無いので指摘にしない。"
