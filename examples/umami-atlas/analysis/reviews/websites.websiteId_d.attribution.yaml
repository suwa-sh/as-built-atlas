notes: "確かめた範囲: この画面に固有のフレーム (page、attribution_page、website_value_combobox、use_values_rw1、api_values_rw1、q_parse_request_rw2、q_check_auth_rw2、attribution、use_attribution_query、api_attribution、q_get_attribution、ext_prisma_attribution、ext_clickhouse_attribution) は、根拠の行を対象のコードで開いて確かめ、上の指摘のほかは主張を支えていた。WebsiteControls の下の木は websites.websiteId_d の結果を写したもので、こちらは要所だけを確かめた (WebsiteControls と WebsiteFilterButton の条件、前のレビューで直した q_check_auth の io と api_segment_create / api_session_data_values の call の状態が interpretation になっていること)。share.ts、website.ts、entity.ts、load.ts などの行は、すべては開いていない。指摘にしなかったが伝えること: (1) ClickHouse 用の website_event の fields で、referrer_domain と utm_* を filter だけにしているが、外側の select (getAttribution.ts 252・324 行) で読んでもいる。select * の * read で覆われているので指摘にしていない (PostgreSQL 側は read と filter の両方を付けている)。(2) getAttribution の event_data と session_data の fields に data_type が無い (prisma.ts 565・691 行と clickhouse.ts 529・652 行の having で比べる)。同じファイルのほかのフレーム (session-data の 2 つ) は data_type を書いているので、そろえるなら足すとよい。(3) URL のイベントのプロパティの絞り込み (epf) は、この画面のフィルターのボタンでは付かない (WebsiteFilterButton.tsx 50 行。/events で終わるパスだけ)。event_data を読むのは、URL にすでに epf が付いているときだけ。(4) PostgreSQL の有料広告の問い合わせは、空の名前を除く前に limit 20 をかける (getAttribution.ts 151・154 行) ので、20 件より少なく返ることがある。ClickHouse は除いてから limit をかける。(5) 変換の段の入力欄は、打った文字ごとに onChange で step を変える (WebsiteValueComboBox.tsx 79 行) ので、集計の問い合わせは、文字を打つたびに走る (候補の検索だけが 300 ミリ秒待つ)。(6) last-click は、変換の段より前のイベントが期間の中に無いセッションを model に入れない (getAttribution.ts 100・298 行) ので、そのセッションは流入元の表に数えられない。ルールの文 (変換の段に至った時刻より前の、いちばん遅いイベント) とは矛盾しない。(7) リファラーまわりのお気に入りのアイコン (Favicon) は、この画面の表 (ListTable) では描かないので、外部への送信は無い。"
