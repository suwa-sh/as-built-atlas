notes: "確かめた範囲: すべてのフレームの source と、主な根拠の行 (page.tsx、AttributionPage.tsx、WebsiteValueComboBox.tsx、useWebsiteValuesQuery.ts、values と attribution の route.ts、request.ts、auth.ts、share.ts、website.ts、entity.ts、load.ts、getValues.ts、getAttribution.ts、useAnalyticsQuery.ts、analytics-query.ts、useDateRange.ts、db.ts、prisma.ts の parseFilters と rawQuery) を対象のコードで開いた。analysis-conventions.md の決まりとの突き合わせ: (a) AttributionPage で止めて、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は AttributionPage.tsx 4・25 行) を書いていて、WebsiteControls の中のフレームは 1 つも残っていない。渡す値 (websiteId だけ。allowFilter・allowDateFilter は既定の true、ほかは既定の false か未指定) は attribution_page の summary にあり、WebsiteControls.tsx 12 から 17 行と合う。(b) checkAuth に CLOUD_MODE (settings) と API キーの枝の 1 行 (rules) があり、getUser も書いてある。(c) canViewWebsite の guards に ownership と、別の 1 件の role (user.isAdmin) がある。canViewWebsiteSection の kind: other は、ほかの入口の結果すべてと同じ綴り。(d) API_URL と BASE_PATH は use_values にだけある。WebsiteControls を除くと、コードの順で最初に API を呼ぶのは WebsiteValueComboBox (AttributionPage.tsx 50 行) の useWebsiteValuesQuery で、その前の useDateRange は API を呼ばない (useDateRange.ts) ので、置き場所は合っている。(e) target は作業定義と同じ。(f) links の target の綴りは、part_p.shared_a.WebsiteControls を embed するほかの結果 (3 件) と同じ WebsiteControls。指摘にしなかったが伝えること: getAttribution は parseFilters の excludeBounceQuery を使わない (getAttribution.ts 44・242 行) ので、URL の excludeBounce は集計に効かない。この画面の WebsiteControls は直帰を除くの選択を出さないので、影響は無い。"
