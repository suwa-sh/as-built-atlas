notes: "WebsiteControls を描く BreakdownPage で止めて links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は BreakdownPage.tsx 5 行の import と 24 行の描く行) を書いている点は、analysis-conventions.md の「共有の部品」とプロファイルの決まりに合っている (part_p.shared_a.WebsiteControls は入口の一覧にある)。WebsiteControls の中の段は残っていない。共通の段 (checkAuth の CLOUD_MODE と API キーの枝の rules、canViewWebsite の role: user.isAdmin と ownership: canViewWebsite の 2 件、API_URL / BASE_PATH を最初に API を呼ぶ use_breakdown_query に 1 回だけ、target を作業定義と同じに) も決まりどおり。Breakdown の下の書き直し (use_breakdown_query_rw から q_check_auth_rw まで) は、同じ処理の決まり (読み書きを持つ最初の段まで、確認・設定・ルールを繰り返さない) に合う。redis.ts 37 行の external の段が 3 つあるが、届くキーの形 (auth:*、website:*、account:*) が違うので、同じ処理としてまとめなくてよい。指摘にしなかったこと: (a) canViewWebsiteSection の guards が kind: other なのは、ほかの 47 件の結果と同じ綴りで、関数の中に管理者や持ち主の確認は無い (共有トークンだけを見て、ほかは canViewWebsite に任せる)。(b) DATABASE_REPLICA_URL の status: interpretation は、ほかの結果の多く (277 件) と同じ。(c) フレームの名前 getQueryFilters / setWebsiteDate は、ほかの結果の多く (38 件) が getQueryFilters → setWebsiteDate と書いている。name は綴りをそろえる項目ではないので指摘にしないが、そろえると読みやすい。(d) fields の許す値 (20 個) と FILTER_COLUMNS の列の対応は、schema.ts と constants.ts のとおり。"
