notes: "指摘にしなかったこと。(1) POST /api/websites/[websiteId]/segments の呼び出し (api_segments_create の call) は、SegmentEditForm.tsx 44 行で segmentId の有無により URL が切り替わる書き方だが、この画面の FilterBar は segmentId を渡さないので、届く受け口は 1 つに決まる。fact のままでよいと判断した (websites.websiteId_d の結果は、同じ呼び出しを interpretation にしているので、入口をまたいでそろえるかは人が決める)。(2) segment_filter_fields の source は PropertyFilters.tsx 53 行 (フックを呼ぶ行) で、関数の定義は 32 行。名前が FieldFilters と PropertyFilters の 2 つをまとめているので、どちらにしても代表の行になる。(3) ext_prisma_website は website.findUnique (website.ts 77 行) と share.findFirst (website.ts 304 行) の 2 つのライブラリの呼び出しを 1 つのフレームにまとめている。I/O は両方 q_get_website に書いてあり、経路は切れていない。(4) website_filter_button と segment_filter_fields の unknown + not_analyzed は、note にどこまで読んだかと、止めた理由 (共通の絞り込みの部品で、websites.websiteId_d の結果が辿っている) があるので、指摘にしていない。(5) 根拠の行、呼び出しの条件 (when)、同じ処理を 1 回だけ書く木の形と、終端を満たすための書き直し (_rw のフレーム) は、コードと決まりのとおりだった。"
