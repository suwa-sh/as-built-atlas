notes: "機械チェックは OK (プロファイルも読めている)。主張の根拠の行は、全フレームについて対象のコードと schema.prisma を開いて確かめ、食い違いは見つからなかった (high / medium の指摘は無い)。同じ処理の置き場 (parseRequest、getTeamUser、canUpdateTeam、useLoginQuery、メンバーの DELETE、useTeamMembersQuery) は、入口から辿る順のとおりだった。書き直しのフレーム (id が _rw で終わるもの) も、分析の癖の決まり (読み書きを持つ最初の段まで。確認・設定・ルールを繰り返さない) のとおり。指摘にしなかったが、入口をまたいで食い違っている点: (1) checkAuth の Redis の読み取り (auth:*) は、ここでは status が interpretation で列が「*」。ほかの入口には、fact で userId / pwd を書いた結果と、fact で「*」の結果がある。(2) deleteTeam のクラウドモードの枝の読み書き (team / link / pixel の論理削除) は、ここには書いてあり、同じ部品を通る settings.teams.teamId_d には無い。分析の skill の決まり (成り立たないように見える枝も消さずに書く) には、こちらの書き方が合っている。(3) API キーの枝を辿らない扱いは、ほかの入口の結果にも共通している。3 件目の指摘は、この入口だけを直すのではなく、決まりにするかどうかを人が決めるのがよい。(4) 小窓の中の部品 (TeamLeaveForm、TeamMemberAddForm、TeamMemberEditForm、TeamDeleteForm) の call は fact で、条件は「小窓を開いたとき」。開くまで中身を描かないかどうかは UI ライブラリの中で決まるので、admin.users の結果は同じ形の呼び出しを interpretation にしている。"
