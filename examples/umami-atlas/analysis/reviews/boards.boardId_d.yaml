notes: "今回の分析し直しの要点は、どれも決まりのとおりだった。(1) BoardControls は、WebsiteControls を描く行 (BoardControls.tsx:26) で止まり、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、fact、根拠は 4 行目と 26 行目) がある。中 (絞り込み、期間、書き出し) のフレームは無く、渡す値 (websiteId だけで、ほかは WebsiteControls.tsx:12-17 の既定値) は board_controls の summary に書いてある。(2) 登録表の部品 16 件は、BoardComponentRenderer で embed (entry_id は part_p.boardComponentRegistry.<キー>) で止まっていて、16 件とも analysis/results/ に対応する部品の入口の結果がある。TextBlock を入口にしないのも、登録表 (boardComponentRegistry.tsx:389) と合う。(3) 共通の段: checkAuth に CLOUD_MODE の設定と API キーの枝の rules があり、getUser も書いてある。src/permissions/ の確認の関数 (canViewBoard、canViewWebsite、canViewPixel、canViewLink、canUpdateBoard、canCreateTeamWebsite、canViewTeam、canUpdateWebsite) は、ownership と別に role: user.isAdmin を持つ。API_URL と BASE_PATH は、最初に API を呼ぶ use_board_query にだけある。target は作業定義と同じ。(4) 根拠の file:line は、すべて対象のリポジトリに実在する (行の範囲外も無い)。(5) canViewWebsiteSection と canViewSharedWebsiteFilters を kind: other にしている点、GET /api/users/[userId]/websites の ownership の値を auth.user.id === userId と書いている点は、ほかの入口の結果と同じ綴りなので、指摘にしなかった。(6) 部品の中の木 (PixelControls / LinkControls の下の絞り込みや期間など 180 段) は、前の結果から置き場が動いていないと notes にあり、主な段 (認証、権限の確認、閉じた呼び出し) を確かめた範囲では食い違いは無かったが、すべての io の列までは見ていない。"
