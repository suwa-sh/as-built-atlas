notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。登録表の扱いは context.md の節「登録表から選ばれて描かれる部品」のとおり: BoardComponentRenderer で止め、links の embed 16 件の target は登録表のキー、entry_id は入口の一覧の part_p.boardComponentRegistry.<キー> 16 件と一致、status は interpretation、根拠は登録表を引く行 (BoardComponentRenderer.tsx:17)・部品を描く行 (:39)・各項目の始まりの行 (boardComponentRegistry.tsx:141〜377) で、どれも合っている。Metrics bar の componentByEntityType の判定は rules にある。TextBlock は summary に名前だけ。固定の値で閉じている呼び出し (0.4.1) の 2 件 (includeTeams の枝、POST /segments/[segmentId]) は、3 つの条件 (値がこの木の中のコードで決まる、条件がその値だけで決まる、この木の中に別の値で着く経路が無い。WebsiteSelect を描くのは BoardCloneForm だけ、SegmentEditForm を描くのは FilterBar だけ) を確かめ、妥当。根拠の file:line は全件、対象のファイルの範囲に入っている。API を呼ぶ受け口の getQueryFilters(query) (websiteId なし) は、データを読まない純粋な処理なので、同じ処理の置き場の指摘にはしなかった。複製の受け口 POST /api/boards/[boardId]/clone の確認・ルール・createBoard の列は、コードと合っている。部品の中 (集計の API など) は、この結果では辿らないのが正しいので、見ていない。"
