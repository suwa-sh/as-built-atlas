notes: '機械チェック (validate result) は OK。重点の確認で、次は問題が無かった: 複製の受け口 (POST /api/boards/[boardId]/clone) の検査の順と 401 / 400、canUpdateBoard / canCreateTeamWebsite / canViewBoardEntities / stripInvalidBoardReports / hasValidBoardReports / createBoard の読み書き。events/stats・goals/[goalId] と stats・utm/metrics・realtime・active・revenue/stats・chart・metrics・metrics (getEventMetrics を含む) の受け口の権限の区画 (events / goals / utm / realtime / overview・realtime / revenue)、SQL の表と列 (revenue と website_revenue、website_event_stats_hourly の使い分けを含む)。登録表の 17 種類と、TextBlock をフレームにしない扱い、ピクセル・リンクの対象で Metrics bar だけが種類ごとの部品に替わる扱い、BoardControls の対象の決め方、BoardViewColumn の 401 / 404 の扱い。根拠の行は、全件について、ファイルがあり行が範囲内にあることを機械的に確かめ、重点の段は前後の行を読んで確かめた。指摘にしなかったこと: (1) 一覧の API (teams/[teamId]/websites など) の call を interpretation にしているのは、ボードの teamId で URL が切り替わるので、許容した。(2) canViewBoardEntities の下の canViewPixel / canViewLink、getEntity の下の getBoard は、ほかの呼び出し元の下に書いてあるので漏れにしていない。(3) 複製のボタンは種類が dashboard のボードにも出るが、受け口が 400 を返すことは api_board_clone の rules に書いてある。'
