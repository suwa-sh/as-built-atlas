notes: "機械チェック (validate result) は OK。前回の版で指摘された点 (属性の副問い合わせの根拠、not_analyzed で閉じた小窓、external の call の根拠、URL が 1 つに決まる call の状態、summary の枠の記述) は、今の版では実ファイルと照らしてどれも直っていた。高・中の指摘は無い。今回確かめたこと: (a) 祖先の layout (src/app/(main)/layout.tsx、websites/[websiteId]/layout.tsx) のフレーム・I/O・summary の記述は無い。(b) 同じ処理の置き場を、呼び出し行のパスの文字コード順で確かめ直した。parseRequest は annotations/[annotationId]/route.ts:36 ([ が r より前)、canUpdateWebsite は同 :45、getWebsiteAnnotation は同 :49、canViewSharedWebsiteFilters は annotations/route.ts:29、canViewWebsiteSection と getQueryFilters は metrics/expanded/route.ts:34 / :39 (expanded が route.ts より前)、canViewWebsite は share.ts:59、getEntity は website.ts:24、getWebsite は entity.ts:6 (src/lib/entity.ts が load.ts と permissions より前)、getTeamUser は website.ts:35 (canUpdateWebsite の :152 より前)、getWebsiteSegment は segments/[segmentId]/route.ts:24 (src/app が src/lib より前)、FieldFilters と PropertyFilters は SegmentEditForm.tsx:89 / :101 (src/app が src/components より前)、useWebsiteAnnotationsQuery は WebsiteChart.tsx:35、useWebsiteMetricsQuery は MetricsTable.tsx:36、AnnotationsModal は WebsitePage.tsx:44 (W が a より前)。すべて合っていた。useWebsiteSegmentQuery は SegmentEditForm.tsx:35 のほうがパスでは早いが、FilterBar.tsx:195 は segmentId を渡さず enabled (useWebsiteSegmentQuery.ts:17) が false なので、動く FilterBar の下に置いた判断は妥当。SegmentFilters (SegmentFilters.tsx 全体) は一覧と選択だけで、セグメントの編集・削除の経路は無い。(c) _rw の書き直しは、呼び出し元が終端になるもの (canViewSharedWebsite、canViewSharedWebsiteFilters、canUpdateWebsite、WorldMap、AnnotationsButton) だけで、各段で最も早い呼び出しを I/O を持つフレームまで書いている。(d) 終端のフレームはすべて external か I/O を持つ。external の source は、Prisma のメソッド・$queryRawUnsafe (prisma.ts:746)・clickhouse.query (clickhouse.ts:721)・pagedQuery の findMany (prisma.ts:761)・Redis の client.get (redis.ts:37) と、どれもライブラリを実際に呼ぶ行。(e) 同じ行の external を問い合わせ関数ごとに書いている点 (prisma.ts:746 / clickhouse.ts:721 / redis.ts:37 / prisma.ts:761): Redis はキー (auth:* / website:* / account:*)、pagedQuery は表 (segment / annotation) が違うので決まりの例外に当たる。生の SQL の external は、stats・pageview_stats・session_stats・weekly・各 metrics のように届く表の組み合わせが同じものもあり、決まりの文言どおりなら 1 つにまとめる余地がある。ただし I/O は query フレームにあり件数は水増しされないので、notes (4) の理由 (関数ごとに渡す SQL が違う) で受け入れ、指摘にしない。(f) 表とモデルの対応 (schema.prisma の @@map、ClickHouse の CREATE TABLE)、Prisma のメソッドと op (findUnique / findFirst / findMany / count は read、create は create、update は update、delete は delete)、フックの URL と HTTP メソッド (useUpdateQuery は post、useDeleteQuery は del)、route のメソッドの関数と呼ぶ問い合わせ関数の行は、上の指摘以外は実ファイルと合っていた。metrics の route の getEventMetrics は、この画面の表が event を渡さないので届かないという判断も合っている。拡大表示のメニュー (WebsiteExpandedMenu.tsx:209) には event があり、excludedIds も渡されないので、getEventExpandedMetrics には届く。(g) checkAuth の API キーの経路 (auth.ts:75 の checkApiKeyAuth、api_key の読み書き) を書いていないのは、画面のフックがログインのトークンを付ける (useApi.ts:28) ことを理由として summary に書いてあり、受け入れた"
