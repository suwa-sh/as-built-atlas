notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読まれた)。161 フレームの根拠の行を対象のファイルで開いて確かめ、src/queries/sql/ の下の 15 の問い合わせの関数は、PostgreSQL 側と ClickHouse 側の両方の SQL を読んで、summary・rules・fields・表の組み合わせと突き合わせた。行のずれや、主張を支えない根拠は、上の 1 件 (q_pageview_metrics/rules/1) のほかには無かった。指摘にしなかったこと: (1) checkAuth の API キーの経路 (auth.ts:75) を辿っていない点。画面のフックが付けるのはログインのトークン (useApi.ts:28) なので届かない、という読み取りは妥当と見た。(2) Tabs / TabPanel の中の部品 (SegmentFilters、PropertyFilters、MetricsTable) の when が always である点。コードの条件だけで決めたことが note に書いてある。(3) 同じ処理を 1 回だけ書く置き場と、終端にならないように書き直したフレーム (_rw の付くもの) は、context.md の決まり (コードに書いてある順の深さ優先) のとおりだった。(4) 自分のアプリの静的なファイルの読み込み (国名・地域名の /intl/*.json、世界地図の /datamaps.world.json、ブラウザやデバイスのアイコンの画像) は、サーバーのデータの読み書きでも他社への送信でもないので、書き漏れに数えていない。(5) URL のフィルターで決まる列を fields に書かず note で説明している点は、列が実行時に決まるので妥当と見た。"
