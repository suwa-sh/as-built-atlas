notes: "(1) 指摘にしなかったもの: WebsiteControls を WebsitePage で止め、links に embed (entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は WebsitePage.tsx:12 / :21) を書き、渡す値 (allowBounceFilter={true}、ほかは既定) を website_page の summary に書いているのは、決まりどおり。checkAuth の settings の CLOUD_MODE と rules の API キーの枝、canViewWebsite / canUpdateWebsite の guards の role (user.isAdmin) と ownership の 2 件、API_URL / BASE_PATH を最初に API を呼ぶ use_stats にだけ書いていること、target が作業定義と同じことも、決まりどおり。canViewWebsiteSection / canViewSharedWebsiteFilters の guards が kind: other なのは、ほかの入口の結果 (websites.websiteId_d.* など) と同じ綴りで、そろっている。(2) 書き直し (q_can_view_website_rw1 から q_get_website_rw1、q_get_website_rw3、use_metrics_rw1 から q_check_auth_rw2) は、読み書きを持つ最初の段で止まり、確認・設定・ルールを繰り返していない。q_can_view_shared_website_filters と q_can_update_website は guards を持つので、終端の決まりだけなら書き直しは要らないが、確認の後に getEntity / getWebsite の読み取りが続くので、書き直したことで辿り漏れにならずに済んでいる。(3) WebsiteChart の注釈の読み取り (showAnnotations) を always にしたのは、WebsitePage が固定の値 true を渡すので妥当。Tabs / TabPanel の中の MetricsTable を always にした扱いは、UI ライブラリの動きがリポジトリから読めないことを note に書いてあるので、指摘にしなかった。(4) 列の書き方の揺れ: q_create_annotation の fields に created_at (@default(now())) と updated_at (@updatedAt。Prisma は作成のときも書く) が無い一方、q_update_annotation は @updatedAt を理由に updated_at を書いている。ほかの入口の結果も、作成で updated_at を書かないものが 77 件、書くものが 8 件と割れているので、この入口の指摘にはしなかった (決まりとしてそろえるかは、人が決める)。(5) getWebsiteAnnotations の note の絞り込み (検索語) は、この入口の木の中の呼び出し (WebsiteChart と AnnotationsModal) が search を送らないので通らないが、1 つの問い合わせの中の部分なので残してよい。io の note に、この入口からは送らないことを書くと、なお分かりやすい。(6) 確かめた範囲: 画面の部品 (page、WebsitePage、WebsiteMetricsBar、WebsiteChart、WebsitePanels、MetricsTable、MetricLabel、Favicon、WorldMap、WeeklyTraffic、ExpandedViewModal、WebsiteExpandedView、WebsiteExpandedMenu、MetricsExpandedTable、DownloadButton、Annotations の 4 部品) と、そのフック、受け口 (stats、pageviews、annotations の GET / POST、annotations/[annotationId] の POST / DELETE、metrics、metrics/expanded、sessions/weekly)、共通の段 (parseRequest、checkAuth、getQueryFilters / setWebsiteDate、fetchWebsite、fetchAccount、canViewWebsiteSection、canViewSharedWebsiteFilters、canViewWebsite、canUpdateWebsite、getEntity、getWebsite、getTeamUser、getUser、annotation の問い合わせ) は、根拠の行を開いて確かめた。フレームにしていないフック (useDateRange、useDateParameters、useTimezone、useNavigation、useModified、PageviewsChart) が API を呼ばないことも確かめた (useLocale / useCountryNames / WorldMap の地図は、同じサーバーの静的な JSON を読むだけ)。集計の問い合わせのうち、getWebsiteStats は全体を、getPageviewMetrics と getPageviewStats (:59 / :68 / :88) と getPageviewExpandedMetrics (直帰と滞在時間が固定の 0) は一部を確かめた。getSessionStats、getSessionMetrics、getChannelMetrics、getWeeklyTraffic、getSessionExpandedMetrics、getEventExpandedMetrics、getChannelExpandedMetrics の io の列と根拠の行は、1 行ずつは開いていない"
