notes: "指摘にしなかったこと。(1) 根拠の行は、全部を対象のコードで開いて確かめた。上の 1 件のほかは、主張を支えていた。(2) deleteWebsite の中のライブラリの呼び出し 15 か所を、external のフレーム 1 つ (ext_prisma_transaction。source は src/lib/prisma.ts:844) にまとめている。読み書きは 16 件とも io に書いてあるので、漏れにしなかった。ただし、ほかの入口の結果 (admin.teams、admin.users、layout_l.main_g、login.two-factor、settings.teams.teamId_d) は、トランザクションの中で最初に呼ぶ行を source にしていて、この結果だけ、包んでいる関数の行を source にしている。フレームの照合は、層と source のファイルで行うので、どちらにそろえるかを人が決めるとよい。(3) 管理者の確認を、判定する関数 canViewAllWebsites ではなく、それを呼ぶ受け口 (api_admin_websites_get) に書いている。関数がデータにもライブラリにも届かず、フレームにすると終端の決まりを満たせないためで、結果の notes に理由がある。妥当と見た。(4) getWebsite の「id が uuid の形でなければ読まない」は、rules に無い。layout_l.share.slug_d の結果だけが rules に書いていて、ほかの入口の結果は summary に書くだけなので、指摘にしなかった。(5) 画面を包む枠 (admin の layout) の処理は、枠の入口の結果にあるので、見ていない。(6) guards の値 (user.isAdmin、canDeleteWebsite、PERMISSIONS.websiteDelete)、settings の名前 (API_URL、BASE_PATH、CLOUD_MODE、REDIS_URL)、links の行き先は、ほかの入口の結果と同じ綴りだった。links の entry_id の 3 件は、入口の一覧にある"
