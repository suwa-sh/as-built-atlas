notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。根拠の行はすべて開いて確かめ、schema.prisma の @map / @@map の行も主張と合っていた。フレームの層と種類、呼び出しの when、読み書きの種類と列、権限の確認 (api_global_post の user.isAdmin、checkAuth の authentication)、設定の名前の綴り (API_URL / BASE_PATH / CLOUD_MODE / REDIS_URL / TWO_FACTOR_ENCRYPTION_KEY) は、コードと決まりに合っている。GET /api/2fa/status の読み書きの列と設定の綴りは、同じ受け口を書いた layout_l.main_g の結果と同じだった。辿り漏れは無い (parseShareToken、isTwoFactorConfigured、canEnforceTwoFactorAuthForEveryone、getApiUrl は、読み書きを持たない補助の関数。checkApiKeyAuth は、/api/2fa と /api/admin では getApiKeyByHash の前に null を返す)。指摘にしなかったこと: (1) admin_security_page の rules は「isConfigured が偽」と書いているが、コードは !isConfigured なので、状態を読めなかったとき (status が undefined) もスイッチは操作できない。(2) q_parse_request の summary の「POST /api/admin/2fa/global も同じ関数を呼ぶ」の根拠の行 (global/route.ts の 15 行目) は、そのフレームの evidence には無いが、api_global_post の summary の evidence にある。"
