notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読まれた)。high と medium の指摘は無い。入口に固有の段 (page、getLink、LinkPage、LinkProvider、useLinkQuery、GET /api/links/[linkId]、canViewLink、getTeamUser、LinkHeader、useConfig、GET /api/config、LinkControls、LinkMetricsBar、LinkPanels、WorldMap、Favicon、ExpandedViewModal から拡大表示の受け口まで、FilterBar からセグメントの保存まで) は、根拠の行をすべてコードと突き合わせ、呼び出しの関係・条件・列・権限の確認・設定が合っていることを確かめた。同じ処理の置き場 (getLink は page の下、parseRequest と checkAuth と getTeamUser は GET /api/links/[linkId] の下、canViewWebsite から getEntity までは GET values の下、useConfig は LinkHeader の下) は、コードの順の深さ優先と合う。書き直した段 (末尾が _rw) は、読み書きを持つ最初の段で止まっていて、確認・設定・ルールを繰り返していない。共通の段からは、checkAuth、getUser、getQueryFilters、fetchWebsite、getValues、getSessionMetrics、getPageviewMetrics (referrer の列だけに絞った扱い)、getPageviewExpandedMetrics、getEventExpandedMetrics、stats と pageviews の受け口を抜き出して確かめた。getSessionDataProperties / getSessionDataValues / getWebsiteStats / getPageviewStats / getSessionStats / getChannelMetrics / getChannelExpandedMetrics / getSessionExpandedMetrics / getWebsiteDateRange の SQL の列は、確かめていない。綴りは、ほかの入口の結果と比べた: 設定の名前 (API_URL、CLICKHOUSE_URL、CLOUD_MODE、DATABASE_REPLICA_URL、FAVICON_URL、LINKS_URL、PRIVATE_MODE、REDIS_URL) は同じ。guards の値は、多い側の綴り (user.isAdmin、canViewLink、canViewWebsite、canUpdateWebsite、PERMISSIONS.websiteUpdate、共有トークンの確認は関数の名前) と同じで、ほかの入口の少数に別の綴り (canViewWebsite を kind: other、shareTokenIncludesWebsite、shareToken?.websiteId === websiteId) が残っている。links の /links/${linkId}/edit に、別の綴りは無い。指摘にしなかったこと: (1) GET /api/config の下の Response.json を external にしていること。プロファイルの external の例 (ORM、DB クライアントなど) には当たらないが、終端の決まりを満たすための扱いで、理由が結果の notes (6) にある。(2) Tabs の中の MetricsTable を always にしていること (UI ライブラリの動きで、リポジトリからは読めない。note がある)。(3) getWebsite の下の share の読み取りは、website が見つかったときだけで、この入口では起きないと読める (io の note に「サイトが見つかったときだけ」とある)。"
