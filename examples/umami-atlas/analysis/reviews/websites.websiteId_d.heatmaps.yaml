notes: "機械チェック (validate result) は OK (プロファイルは作業定義の profile.dir から読めた)。WebsiteControls は、決まり (共有の部品) のとおり heatmaps_page で止めて embed (entry_id part_p.shared_a.WebsiteControls、status fact、根拠は 4 行の import と 57 行の描く行) を書いていて、中を辿っていないことは指摘していない。渡す値 (websiteId だけ) と、そこから決まる部品の既定 (WebsiteControls.tsx 12〜17 行、28 行) も summary に書いてあり、コードと合う。共通の段は決まりどおり: checkAuth に CLOUD_MODE と REDIS_URL の settings、API キーの枝の rules 1 行、その下の getUser。canViewWebsite と canViewTeam の guards は、role (user.isAdmin) と ownership (関数の名前) の 2 件ずつ。BASE_PATH は最初に API を呼ぶ useSubscription に、API_URL は /auth 以外を最初に呼ぶ useHeatmapQuery に 1 回ずつ (api-url.ts 6・39 行のとおり /auth には API_URL が効かないので、決まりの「木の書き方」の API_URL の行と合う)。useDateParameters / useDateRange は API を呼ばない (URL のクエリと localStorage だけ) ので、useHeatmapQuery の前に API の段が無いことも確かめた。根拠の行は、page.tsx、HeatmapsPage.tsx、Heatmap.tsx (68・77・84・104〜121・1012〜1050 行)、useSubscription.ts、subscription/route.ts、heatmaps/route.ts、share.ts、website.ts、entity.ts、request.ts、auth.ts、load.ts、redis.ts、getHeatmap.ts (PostgreSQL と ClickHouse の 3 つの問い合わせ、getIframeSnapshot、絞り込みの結合 869〜947 行)、prisma.ts と clickhouse.ts の絞り込みの部分、schema.prisma の @@map の行を開いて、主張を支えていることを確かめた。指摘にしなかったこと: (a) canViewAuthenticatedWebsite の guards (kind other、value auth?.user) は、ほかの入口の結果と同じ綴り。(b) DATABASE_REPLICA_URL の status は interpretation だが、prisma.ts 738 行と 55 行・861 行にまたがる読み取りなので、そのままでよい。(c) Heatmap の iframe の読み込みの unknown + dynamic_dispatch は、ホストが DB の website.domain から実行時に組み立てられるので、理由は合っている。(d) getQueryFilters からの fetchAccount と、getHeatmap からの getWebsite を、最初に着いた呼び出し元の下だけに書き、ほかは summary に「同じ経路」と書いているのは、決まりの重複の扱いに合う。"
