notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めた)。根拠の file:line は全件が対象のファイルの行の範囲に入っており、summary の「フレーム <id>」の参照先もすべて存在する。前回のレビューの high (canUpdateWebsite のフレームの抜け) は直っていて、q_can_update_website と q_get_website_rw3 が正しい場所にある。この画面に固有の経路 (page → RealtimePage → useRealtimeQuery → GET /api/realtime/[websiteId] → getRealtimeData → getRealtimeActivity / getPageviewStats / getSessionStats、RealtimeLog → SessionModal、WorldMap → useWebsiteMetricsQuery → GET metrics) は、根拠の行を開いて確かめ、主張と合っていた (30 分の期間と REALTIME_RANGE、10 秒ごとの読み直し、event_type = 5 の除外と 100 件の上限、国はセッションごとに 1 回だけ数えること、unit を付けずに呼ぶので getMinimumUnit で minute になり ClickHouse でも website_event から数えること、WorldMap に websiteId が渡らず metrics が呼ばれないように見えること)。入口から辿る順 (useRealtimeQuery → RealtimeLog → WorldMap、SessionProfile の中は useWebsiteSessionQuery → SessionDeleteButton → SessionActivity → SessionData → SessionReplaysDataTable) と、共有する処理の置き場も決まりと合っている。綴り (設定の名前、確認の値) はほかの入口の結果とそろっている。指摘にしなかったこと: q_parse_request と q_can_view_website_section の summary にある「この画面のほかの受け口」の一覧に、event-data/[eventId] の GET (route.ts:10 で parseRequest、:18 で canViewWebsiteSection の events) が入っていない (api_event_data_by_id の summary には書いてあるので、経路は欠けていない)。"
