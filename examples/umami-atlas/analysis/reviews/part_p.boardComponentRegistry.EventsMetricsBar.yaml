notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めた)。根拠の行 (登録表の 154-161 行、EventsMetricsBar.tsx、useEventStatsQuery.ts、useFilterParameters.ts、useDateRange.ts、events/stats の route.ts、request.ts、auth.ts、share.ts、website.ts、entity.ts、load.ts、redis.ts、prisma の user / website / segment / teamUser、getWebsiteEventStats.ts、prisma.ts の parseFilters / getCohortQuery / プロパティの絞り込み / executeRawQuery、clickhouse.ts の parseFilters / rawQuery、db.ts の runQuery、ClickHouse と Prisma の schema) は主張を支えていた。getCompareDate の比較の期間、ClickHouse の集計表 (website_event_stats_hourly) への切り替え、guards の綴り (canViewWebsiteSection は kind other、canViewWebsite は ownership、authentication は checkAuth だけ) は、ほかの入口の結果と analysis-conventions.md にそろっている。指摘にしなかったこと: (1) フックは excludeBounce を送り、getQueryFilters も excludeBounce を立てるが、getWebsiteEventStats は parseFilters が返す excludeBounceQuery を SQL に使わないので、この指標には効かない (parameters の記述は「送る」までで誤りではない。書くなら q_events_stats の rules か note)。(2) useDateParameters は期間を利用者のタイムゾーン (useTimezone) で UTC に直して送るが、parameters の date / unit / offset はこれに触れていない (表現の補足の程度)。"
