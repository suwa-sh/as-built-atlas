notes: "WebsiteControls は PerformancePage で止め、links に embed (entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は PerformancePage.tsx:3 と :14) が書かれていて、決まりのとおり。WebsiteControls に渡す値 (websiteId だけ、ほかは既定の値) は performance_page の summary にあり、WebsiteControls.tsx:12-17 の既定の値と合う。共通の段 (checkAuth の CLOUD_MODE と API キーの 1 行、canViewWebsite の ownership と role user.isAdmin、API_URL / BASE_PATH を最初に API を呼ぶ use_performance_stats に 1 回だけ、target の写し) も、analysis-conventions.md の「どの入口にも出る共通の段」に合う。入口から辿る順も確かめた: PerformancePage の useDateRange は URL とブラウザの保存だけで API を呼ばず、WebsiteControls は辿らないので、最初に API に着くのは Performance.tsx:73 の usePerformanceStatsQuery。同じ処理 (parseRequest、canViewWebsiteSection、getQueryFilters) を stats の受け口の下に 1 回だけ書き、chart と metrics の受け口の summary で指す書き方も、context.md の「同じ処理が何度も呼ばれるとき」に合う。getPerformanceMetrics を path/title と device/browser の 2 つに分けた扱いも、届く表が違う (SESSION_COLUMNS に入ると joinSession を付ける。getPerformanceMetrics.ts:42) ので、決まりに合う。指摘にしなかったこと: (1) getPerformanceStats / getPerformanceChart / getPerformanceMetrics の summary の「URL の絞り込みに cohort・プロパティがあれば、それぞれの読み取りが足される」の「プロパティ」には、この画面では届かないように見えるイベントのプロパティも入る。event_data の読み取りの note に理由があるので、指摘にしなかった (直すなら、summary をセッションのプロパティに絞る)。(2) 直帰を除く絞り込み (excludeBounce) は getQueryFilters が付けるが、performance の 3 つの問い合わせは excludeBounceQuery を使わないので、読み取りが無いのは正しい。(3) タブの中身の PerformanceMetricsTable は、各パネルの最初のタブ (path、device) が既定で描かれるので、2 つのタブをまとめたフレームの when が always なのは妥当。"
