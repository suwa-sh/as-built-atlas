notes: "確かめた範囲: この画面に固有のフレーム (page、performance_page、performance、use_performance_stats / chart / metrics、api_performance_stats / chart / metrics、q_get_performance_stats / chart / metrics、performance_metrics_table と、それぞれの ext_* フレーム) は、根拠の行を対象のコードで開いて確かめた。上の指摘のほかは、主張を支えていた (閾値 WEB_VITALS_THRESHOLDS と getRating、event_type 5、percentile_cont / quantile、metrics の列の対応表と limit の既定、SESSION_COLUMNS による session の結合、parseFilters の cohort / event_data / session_data の副問い合わせ、DATABASE_REPLICA_URL、runQuery の切り替え)。WebsiteControls の下の木は、レビュー済みで指摘が直された websites.websiteId_d.attribution の結果を写したもので、この画面に合わせて直した箇所 (呼び出し元の PerformancePage.tsx 14 行、FilterEditForm の /performance で選べない列、canViewWebsiteSection の note の performance) だけを確かめた。指摘にしなかったが伝えること: (1) タブの中身 (TabPanel) は、UI ライブラリ @umami/react-zen が node_modules に無いので、選ばれていないタブを描くかは確かめられない。最初に選ばれるタブ (path と device) は描かれるので、まとめたフレームの always は成り立つ。(2) 表は、受け口が p75 の大きい順に並べた行から、選んだ百分位の値が 0 より大きい行を上位 20 行出すので、p50 / p95 を選んでも並びは p75 の順のまま (表示の話なので rules に書かないのは妥当)。(3) 受け口の検査のルールは、timezone と unit の検査 (schema.ts の timezoneParam・unitParam) と startAt / endAt の上限に触れていないが、ほかの入口の結果も同じ書き方なので指摘にしていない。(4) event_data / session_data の fields に data_type が無いのは、attribution のレビューの notes と同じ (そろえるなら足すとよい)。(5) missing_frame の 3 件 (ExportButton、イベントのプロパティの PropertyFilters、getWebsiteSegments の枝) は、WebsiteControls の下の木を写した元の結果から受け継いだもので、websites.websiteId_d.compare のレビューも同じ 3 件を指摘している。WebsiteControls を使うほかの画面の結果にも、同じ扱いが残っているとみられる。(6) PerformanceMetricsTable をまとめる書き方をこのリポジトリで認めるかどうかは、人が決めること (認めるなら analysis-conventions.md に書く)。"
