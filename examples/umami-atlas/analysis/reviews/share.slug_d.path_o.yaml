notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。全 57 フレームの call / summary / parameters / io (fields を含む) / links / guards / settings / rules の根拠の行を、対象のコードと prisma/schema.prisma、db/clickhouse/schema.sql で開いて確かめ、上の 3 件のほかに行のずれや主張との食い違いは見つからなかった。層と種類、when、fact / interpretation の付け方、データの当てはめ (rdb の dbms と table、kvs の auth:*、external_api)、同じ処理の置き場 (入口から辿る順)、終端を満たすための書き直し (id が _rw で終わるフレーム) の範囲も、決まりのとおりだった。確認の値 (isAllowed、canViewSharedWebsite、canViewWebsite、canViewWebsiteSection、user.isAdmin) と設定の名前 (API_URL、CLOUD_MODE、REDIS_URL、CLICKHOUSE_URL、DATABASE_REPLICA_URL、PRIVATE_MODE、FAVICON_URL)、links の綴り (/share/${slug}/<節>) は、ほかの入口の結果と同じだった。指摘にしなかったこと: (1) 埋め込む 17 の画面の summary を unknown (not_analyzed) で止めているのは、note に読んだ範囲 (定義の行と描く行) と止めた理由があり、analysis-conventions.md と context.md も打ち切りを禁じていないので、指摘にしていない。続きを分析するかは人が決める。(2) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth → getApiKeyByHash / getUser / updateApiKeyLastUsed) を辿らず、CLOUD_MODE だけを settings に書いているのは、ほかの入口の結果と同じ扱いなので指摘にしていない (admin.teams.teamId_d と admin.websites.websiteId_d のレビューも、analysis-conventions.md で決めることを勧めている)。(3) Favicon の useConfig が呼ぶ GET /api/config をフレームにしていないのは layout_l.main_g.websites.websiteId_d と同じ扱い。websites.websiteId_d などはフレームにしており、入口をまたいでそろっていないが、データに届かない受け口なのでこの入口の漏れとはしなかった。(4) share.created_at の use が filter なのは、並べ替え (orderBy) も filter に含める語彙の定義どおり。(5) analyzer.tests が無いので、テストの書き漏れは見ていない"
