notes: "機械チェック (validate result) は OK。全フレームの call / summary / parameters / io の根拠行を開いて確かめ、行番号はすべて実在して主張を支えている (上の 2 件を除く)。テーブル名は schema.prisma の @@map (user:37、website:130、team:249、team_user:265、link:358、pixel:378、board:398、share:412、two_factor_auth:492、two_factor_backup_code:504、two_factor_otp_used:515、two_factor_rate_limit:526、app_setting:533) と一致。upsert を create と update の 2 件に分けているのも context.md どおり。同じ処理の置き場も決まりどおりと確かめた。parseRequest は 2fa/setup/confirm/route.ts:18 (2fa/setup/initiate、2fa/status、auth/verify より先)、getUser は initiate/route.ts:33 (src/lib/auth.ts:94 より先)、getTeamUser は permissions/board.ts:178 (link:34、pixel:34、team:15、website:35 より先)、canViewTeam は teams/[teamId]/boards/route.ts:21 (links、pixels、route.ts、websites より先)、getWebsite / getLink / getPixel / getBoard は各 route の 1 件の GET の下。終端になる getEntity / canViewLink / canViewPixel / canViewTeam の下の書き直し (q_*_rw) も、呼び出しの行が最も早い 1 本になっている。辿り漏れは無い。SideNav / MobileNav / WebsiteNav / SettingsNav / AdminNav / useWebsiteNavItems / MobileMenuButton はデータの API を呼ばない。TeamsButton と UserButton は useLoginQuery のストアのユーザーを使うだけ。useLocale は public/intl の静的な JSON を httpGet するだけ。TwoFactorSuccessModal は API を呼ばない。GET /api/config (skipAuth で環境変数を返すだけ。isRelationalOnly も環境変数を見るだけ) をフレームにしないのは、データに届かない経路なので許容した。気になった点 (指摘にはしない): 一覧の pagedQuery の external を、website ではチームの一覧、link / pixel / board では自分の一覧の下に書いている。分析は route のファイルのパスの順で決めたが、合流先の getWebsites を呼ぶ行で比べると getUserWebsites (website.ts:150) が getTeamWebsites (website.ts:169) より先になる。決まりが『同じ外部呼び出しを別の呼び出し元のフレームから呼ぶとき』の比べ方を明記していないので、どちらでも誤りではないが、分析者によって木が変わり得る"
