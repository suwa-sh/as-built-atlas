    claim: "CLOUD_MODE を checkAuth の設定に書いているが、この入口では有無で結果が変わらない。/api/auth は API キーを拒否するパスなので、umami_ のトークンは設定の有無に関わらず認証できず null になる (同じフレームの summary も「API キーの経路はここでは働かない」と書いている)。分析の指示書は、この入口で有無で結果が変わらない設定は書かないと決めている。"
