notes: "主張はおおむねコードと合っていた。根拠の行は、対象の 30 ほどのファイルで 1 つずつ開いて確かめ、食い違いは無かった。指摘にしなかったこと: (1) useConfig が呼ぶ GET /api/config を段にしていないのは、(main) の枠の結果と同じ扱いで、終端の決まりを満たせないという理由も notes に書いてあるので、漏れに数えていない。(2) LINKS_URL は表示する文字だけを変える設定だが、links.linkId_d の結果も同じように書いているので、そのままでよい。一方、SimpleShareEditForm の共有の URL (CLOUD_MODE / CLOUD_URL / BASE_PATH) は「表示だけ」として設定に書いていない。表示だけの設定を書くかどうかの扱いが、同じ結果の中で分かれている。どちらかにそろえるかは、人が決めるとよい。(3) ext_prisma_get_website と ext_prisma_paged_share は、ライブラリを呼ぶ 2 つの行を 1 つの段にまとめている (note に説明がある)。(4) src/lib/schema.ts の pagingParams (page / pageSize は正の整数) は、型の確認に近いので、ルールの漏れにしていない。(5) share/id/[shareId] の GET と DELETE に、共有が無いときの確認が無いことは、結果の notes と summary に書いてある (対象のコードの側の性質で、分析の誤りではない)。(6) 名前と値の綴り (user.isAdmin、PERMISSIONS.websiteUpdate、API_URL、CLOUD_MODE、BASE_PATH、${process.env.cloudUrl} で始まる行き先) は、analysis-conventions.md と、ほかの入口の結果に合っていた。"
