notes: "主な主張 (page → SessionProfileModal → SessionProfile の木、各受け口の parseRequest / 権限の確認 / 問い合わせ、PostgreSQL と ClickHouse の両方の I/O、deleteSession のトランザクション、録画の保存と取り消し、Redis の website:* / account:* / auth:*、external の source の行) は、対象のコードで確かめて合っていた。指摘にしなかった点: (1) getSessionReplays の I/O のうち、URL のフィルター・コホートで読む website_event の副問い合わせ、session_data / event_data の条件、search での session の絞り込み (getSessionReplays.ts:43) は、この画面のフック (useSessionReplaysQuery) がフィルターも search も送らず、受け口の schema (withDateRange + pagingParams + searchParams) でも segment / cohort が落ちるので、この画面からは届かないように見える。I/O の note にそう見える理由を書き足すと読み手に親切。(2) 録画の保存の印 (ReplaySaveForm と保存の取り消し) は、セッションを読めたとき (ReplayPlayback.tsx:73 の session && ...) だけ出るので、replay_save_form と api_replay_saved_post の condition に足してもよい。(3) 画面を包む枠 (layout) の処理を辿っていないのは、プロファイルの決まりどおり。"
