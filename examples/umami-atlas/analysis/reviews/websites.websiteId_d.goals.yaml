notes: "機械チェックは OK (作業定義の profile.dir からプロファイルを読めた)。決まり (analysis-conventions.md) の末尾 2 節に照らして確かめた: GoalsPage で止めて links に embed (target WebsiteControls、entry_id part_p.shared_a.WebsiteControls、status fact、根拠は GoalsPage.tsx 3・21 行) があり、渡す値 (websiteId だけ、ほかは既定) は goals_page の summary に書いてある。WebsiteControls の中を辿っていないのは決まりのとおり。checkAuth は settings に CLOUD_MODE (と REDIS_URL)、rules に API キーの枝の 1 行、その下に getUser がある。canViewWebsite・canUpdateWebsite・canDeleteWebsite は ownership と別に role (user.isAdmin) を 1 件ずつ持つ。API_URL と BASE_PATH は最初に API を呼ぶ use_goals_query に 1 回だけ。target は作業定義と同じ。canViewWebsite の共有トークンの確認を kind other で書く形と、canViewWebsiteSection を kind other で書く形は、ほかの入口 (funnels など) と同じ綴り。values の受け口の下の getQueryFilters の segment / cohort の分かれ道を閉じた呼び出しにし、stats の受け口の下 (q_get_query_filters_rw_stats) に書き直した扱いは、useWebsiteValuesQuery.ts 54〜59 行、values/route.ts 13〜16 行、request.ts 38〜45 行、useFilterParameters.ts 35・36 行、schema.ts 66・67 行で確かめ、妥当と判断した。GoalEditForm の追加のときの useGoalDefinitionQuery は id が無く enabled が false (useSavedDefinitionsQuery.ts 27 行) なので、フレームが無いのは漏れではない。ActionSelect は固定の選択肢だけ、国名・地域名の翻訳の JSON は同じサーバーの静的なファイルなので、書かないのは決まりのとおり。session (PostgreSQL) の join は、セッションの列のほか referrer の絞り込みでも起きる (prisma.ts 298〜301 行) が、note の例示の範囲として指摘にしなかった。"
