notes: "根拠の行は、対象のコードで開いて確かめた。上の 9 件のほかは、主張を支えていた。確認の値の綴り (user.isAdmin、PERMISSIONS.websiteUpdate / websiteDelete、canViewWebsite などの関数の名前) と設定の名前は、ほかの入口の結果と同じだった。指摘にしなかったが伝えること: (1) website_filter_button と segment_filter_fields は unknown + not_analyzed で、note に読んだ範囲と止めた理由があり、分析の決まりも打ち切りを禁じていないので指摘にしていない。ただし websites.websiteId_d.compare などは、同じ部品を GET values まで辿っている。入口ごとに扱いが違うので、そろえるかは人が決めてほしい。(2) getValues の PostgreSQL 用には、列がセッションの列のとき session を読む枝 (getValues.ts 53 行) がある。この画面の type は path か event (ActionSelect.tsx 14・15 行) なので通らない。summary で触れているが io には無い。決まりの「省かずに書く」を io にも当てるかは人が決めてほしい。(3) WebsiteControls の ExportButton と MonthFilter は、この画面が allowDownload / allowMonthFilter を渡さないので描かれない。summary で触れるだけでフレームにしていない (compare の結果も同じ扱い)。(4) report.create と segment.create でも、created_at (@default(now())) と updated_at (@updatedAt) が自動で書かれるが、ほかの入口の結果も create では書いていないので、指摘にしていない。(5) 削除の URL を `${type}s` で組み立てるので、call を interpretation にしたのは妥当。(6) q_get_query_filters の segment / cohort のルールは、values の受け口からは届かない (スキーマが segment / cohort を落とす) が、goals/[goalId]/stats の受け口 (filterParams に segment / cohort がある) からは届くので、ルールとしては正しい。(7) funnels の結果のレビューで指摘された「definitionListSchema は orderBy を持たない」は、この結果では正しく直っている (pagingParams に orderBy は無く、sortingParams にある)。"
