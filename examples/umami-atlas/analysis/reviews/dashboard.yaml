notes: '標本の選び方: フレームが 271 あるので、次の順に確かめた。(1) 入口の上のほう (page → DashboardViewPage → DashboardProvider → useDashboardQuery → GET / POST /api/dashboard → parseRequest / checkAuth / getUser / getBoard / hasValidBoardReports / getReport / updateBoard / createBoard)、BoardControls と PixelControls / LinkControls / WebsiteControls、DashboardContent → BoardViewBody → BoardViewRow → BoardViewColumn と、札・可用性のフック (useWebsiteQuery / usePixelQuery / useLinkQuery と各受け口、canViewPixel / canViewLink)、BoardEntityBadge / Favicon は、すべてのフレームを対象のコードと突き合わせた。(2) BoardComponentRenderer の子は、登録 (boardComponentRegistry.tsx) の並びとフレームの並び・条件がそろっているかを全部見たうえで、部品の系統ごとに 1、2 個を最後まで読んだ: 指標の帯 (WebsiteMetricsBar / PixelMetricsBar → stats の受け口 → getWebsiteStats)、ゴールとファネル (BoardGoal → goals/[goalId] → canViewReport、BoardFunnel → funnels/[funnelId])、リアルタイム (BoardRealtimeMetricsBar → realtime の受け口 → getRealtimeData → getRealtimeActivity、BoardRealtimeChart)、収益 (BoardRevenueMetricsBar → revenue/stats、BoardRevenueChart、BoardRevenueMetricsTable)、UTM
  (BoardUTM → utm/metrics → getUTM)、表 (MetricsTable → metrics の受け口の 4 つの枝)、EventsMetricsBar、WebsiteChart と注釈。(3) 権限と書き直しの段 (canViewWebsiteSection / canViewWebsite / getEntity / canUpdateWebsite / getTeamUser と _rw の段) は、元のコードの呼び出しの順と照らした。(4) 綴りは、設定の名前・確認の値をすべて抜き出し、analysis-conventions.md と dashboard.edit の結果と比べた。summary の中の「フレーム <id>」の参照は、すべての id が実在するかを機械的に確かめた。前のレビューの high 2 件 (q_update_board / q_create_board の列) は直っていることを確かめた。指摘にしなかったこと: 結果の notes の「登録にある有限の 18 種」は、登録の種類は 17 (TextBlock を含む) で、18 は対象ごとの部品 (WebsiteMetricsBar のピクセル用・リンク用) を足し TextBlock を除いたフレームの数 (dashboard.edit の結果は「部品 18、定義は 17 種類」と書いている)。DEFAULT_CURRENCY を収益の 3 つの部品それぞれに書いているのは、どれも useBoardRevenueCurrency を呼ぶ別の部品なので、繰り返しの禁止には当たらないと見た。'
