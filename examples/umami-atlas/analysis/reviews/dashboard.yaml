notes: "前の版へのレビューの 3 件 (ExportButton、イベントのプロパティの絞り込み、values の getWebsiteSegments の枝) は、それぞれ、property_filters_event から先のフレームを足したこと、残り 2 件は指示書 0.4.1 の固定の値で閉じている呼び出しとして summary に値と行を書いたことで、扱われている。閉じている呼び出しは次のとおり確かめ、指摘にしなかった。(a) ExportButton: PixelControls / LinkControls / WebsiteControls を描くのは、この木の中では BoardControls だけで (BoardControls.tsx:22、24、26)、allowDownload を渡さず既定値は false (3 つの部品の 15 / 15 / 16 行目) なので、3 つの条件を満たす。(b) セグメントの更新の POST: SegmentEditForm を描くのは FilterBar だけで、segmentId を渡さない (FilterBar.tsx:195-200) ので、3 つの条件を満たす。(c) values の受け口の getWebsiteSegments の枝 (values/route.ts:48): type は、useFields のコードの一覧の名前か、URL のクエリのうち FILTER_COLUMNS のキーにある名前だけで、どちらにも segment / cohort が無いので、URL がどうであっても枝は通らない。条件 1 は URL から来る値を除くが、type に入りうる値はすべてコードの定数なので、閉じていると読んだ (boards.boardId_d の扱いとも同じ)。なお、FieldFilters.tsx:162 の type={filter.name} は、URL から来た絞り込みでは直後の {...filter} の type (数字を除いた名前) で上書きされるが、結論は変わらない。登録表を引くフレーム board_component_renderer の embed 16 件は、entry_id がすべて入口の一覧の part の入口と一致し、根拠の行も登録表の項目の始まりの行と合っている。q_get_segment (URL に segment があるとき) は、values の受け口からは segment を送らない (useWebsiteValuesQuery.ts:54-59) が、同じ getQueryFilters を event-data / session-data の受け口がフィルター込みで呼ぶので、閉じていない。"
