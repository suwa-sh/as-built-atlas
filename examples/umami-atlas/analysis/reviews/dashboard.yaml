notes: "このリポジトリの決まり (analysis-conventions.md の末尾 2 節) に照らして確かめ、合っていた所: (1) 共有の部品 WebsiteControls は、描くフレーム board_controls で止まり、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は BoardControls.tsx:4 と :26) があり、WebsiteControls の中のフレームは無い。BoardControls が渡す値 (websiteId だけ) と、既定値で出る操作・出ない操作は board_controls の summary にあり、WebsiteControls.tsx:12-17 の既定値と合っている。同じ書き方は boards.boardId_d と dashboard.edit の結果とも同じ。(2) PixelControls / LinkControls は共有の部品の入口ではないので辿っている。決まりは WebsiteControls だけを止めると書いているので、指摘にしなかった (同じ中の部品を描く別のコンポーネントの扱いは、決まりの側で決めるとよい)。(3) checkAuth に settings CLOUD_MODE (env)、rules に API キーの枝の 1 行、その下に getUser がある。(4) canViewWebsite / canUpdateWebsite / canViewPixel / canViewLink の guards に、ownership と別の role: user.isAdmin がある。canViewWebsiteSection / canViewSharedWebsiteFilters / canViewSharedWebsite は、中に管理者の確認が無く canViewWebsite に任せるので kind: other のままで、part_p.shared_a.WebsiteControls などほかの結果と同じ綴り。(5) API_URL と BASE_PATH は、入口からコードの順で最初に API を呼ぶ use_dashboard_query にだけある。(6) target は作業定義と同じ。指摘にしなかった小さな点: api_segment_get の summary に、同じ趣旨の文 (parseRequest も呼ぶ。経路は、それぞれのフレームと同じ) が 2 回入っている。canUpdateWebsite の ownership の status が interpretation で、ほかの確認の関数 (fact) とそろっていない。DashboardProvider / BoardControls / DashboardContent の call は、この入口ではいつも成り立つ条件 (URL に /teams/<id> が無い) で conditional にしているが、note に理由があるので、そのままでよい。"
