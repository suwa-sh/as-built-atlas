notes: "根拠の行 (page / WebsitesPage / WebsitesDataTable / WebsitesTable / WebsiteAddButton / WebsiteAddForm / WebsiteTrackingCode / useLoginQuery / useTeamMembersQuery / useUserWebsitesQuery / useUpdateQuery / useWebsiteListChartsQuery / usePagedQuery / useNavigation / useApi / api-url / client / Favicon / DataGrid / DialogButton / next.config.ts / auth/verify・teams/[teamId]/users・websites・websites/request-schema・teams/[teamId]/websites・users/[userId]/websites・me/websites・websites/charts・config の route / request.ts / auth.ts / api-key.ts / redis.ts / load.ts / subscription.ts / permissions の team.ts・website.ts / queries の user.ts・team.ts・teamUser.ts・website.ts・share.ts / getWebsiteListCharts.ts / db.ts / prisma.ts / clickhouse.ts / constants.ts / schema.ts / schema.prisma / clickhouse の schema.sql) は、どれも主張を支えていた。同じ処理を 1 回だけ書く木の置き場 (parseRequest → checkAuth → getUser は POST /api/auth/verify の下、canViewTeam → getTeamUser は GET /api/teams/[teamId]/users の下)、書き直し (_rw の 2 か所。読み書きを持つ最初の段まで、確認・設定・ルールを繰り返さない)、この画面からは条件が成り立たないように見える呼び出し (POST /api/auth/verify、GET /api/me/websites、createShare) を conditional で残して note に理由を書く形は、analysis-conventions.md と context.md の決まりどおり。確認の値の綴り (user.isAdmin、PERMISSIONS.websiteCreate、canViewTeam、canCreateTeamWebsite、canViewBatchWebsites、auth.user.id === userId) と、つながりの綴り (/websites/${row.id}、/websites/${websiteId}/settings) は、ほかの入口の結果とそろっている。useUserWebsitesQuery の 3 つの行き先の call を interpretation にしているのも、context.md の決まりと settings.websites のレビューの結論に合う。指摘にしなかったこと: (1) API_URL を、この入口で最初に API を呼ぶ段 (useLoginQuery) ではなく、useTeamMembersQuery に書いている。/auth の URL には API_URL が効かない (api-url.ts:6、:39) という理由が note にあり、事実と合うので、決まりの趣旨には沿っている。決まりの文面 (最初に API を呼ぶフレーム) との差を解消したければ、analysis-conventions.md に「API_URL は、API_URL が効く API を最初に呼ぶフレーム」と書き足すとよい。(2) getWebsites と attachShareIdToWebsites は、getTeamWebsites と getUserWebsites の両方から呼ばれる同じ関数で、website と share の読み取りが 2 つのフレームに書かれている。ただし、外側の関数が違い (where が teamId か userId か)、まとめると片方が終端になって書き直しが要るので、ライブラリの呼び出しだけを 1 回にした扱いは妥当と見た。(3) useTeamMembersQuery の summary の、一覧の検索語やページが、メンバーの読み取りにも付いて、操作が出なくなりうるという読み取りは、usePagedQuery.ts:18、:24 と、teams/[teamId]/users の route のスキーマ (search と page を受け付ける) から、コードどおりと確かめた。(4) WebsiteTrackingCode は、設定 (TRACKER_SCRIPT_NAME、CLOUD_URL、BASE_PATH) から計測タグの文字列を組み立てるだけで、データにも外部にも届かないので、フレームにしないのは context.md の決まりどおり"
