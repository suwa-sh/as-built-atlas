notes: "機械チェック (validate result) は OK。根拠の行 1426 件は、すべて対象のファイルに実在し、空行や import の行を指すものは無い。主な段 (WebsiteControls から FilterEditForm、SegmentFilters、PropertyFilters、WebsiteDateFilter、ExportButton、FilterBar と SegmentEditForm、受け口 values / segments / segments/[segmentId] / event-data / session-data / daterange / export、checkAuth、canViewWebsite、canUpdateWebsite、getQueryFilters、fetchWebsite、getValues、getWebsiteDateRange、getSessionMetrics、segment の作成) は、コードを読んで主張と条件を確かめた。分析リポジトリの決まり (checkAuth の CLOUD_MODE と API キーの 1 行、canViewWebsite / canUpdateWebsite の user.isAdmin を別の 1 件、API_URL / BASE_PATH を最初に API を呼ぶ useWebsiteValuesQuery に 1 回、target を作業定義と同じに) は守られている。websiteId で止まるフックの API の呼び出しを conditional にしたこと、届かないように見える getWebsiteSegments の枝を conditional で残したことは、プロファイルの部品の入口の決まりどおりなので、指摘にしなかった。share の確認 (kind: other) の綴りは、ほかの入口の結果とそろっている。最後の指摘 (確認のフレームの下の書き直し) は、ほかの入口の結果 (boards.boardId_d、dashboard、links.linkId_d など) も同じ書き方をしているので、直すなら入口をまたいでそろえるか、決まりの側で「確認だけの段の下も書き直す」と明記するかを、人が決めるとよい。書き直しのフレームの id で、q_get_entity_rw3 の下が q_get_website_rw4 になっている (rw3 は canUpdateWebsite の下で使った) のは、見分けにくいが誤りではない"
