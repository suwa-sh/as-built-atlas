notes: "WebsiteControls で止める扱い (events_page の links の embed、根拠 EventsPage.tsx:5 / :28、渡す値は websiteId だけで summary に書いてある) は、決まりどおり。外した木の下にあった共通の段 (parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment) が、入口から辿る順で最初の受け口 (events/stats) の下に移っていること、API_URL / BASE_PATH が use_events_stats に 1 回だけあること、checkAuth の CLOUD_MODE と API キーの 1 行、canViewWebsite / canUpdateWebsite / canDeleteWebsite の管理者の確認が別の件で書いてあることを確かめた。残った部品のフック (EventsChart、EventsDataTable、EventsMetricsBar、EventProperties、EventDataPivotTable、Property*Chart、PropertyFilters / PropertyFilterRecord、Session* の部品、ReplayPlayback / ReplaySaveForm) が呼ぶ受け口は、すべてフレームになっている。GET metrics の getSessionMetrics / getPageviewMetrics / getChannelMetrics を閉じた扱いは、MetricsTable が params を渡されず type=\"event\" だけを送ること (MetricsTable.tsx:36) と route.ts:55 / :61 / :70 から、3 つの条件を満たす。録画のタブを always にした扱い (SessionModal.tsx:20 / :42 の /share/ の判定がこの入口のパスでいつも成り立つ) も妥当。canViewAuthenticatedWebsite の guards の綴り (kind: other、value: auth?.user) は、ほかの 16 件の結果とそろっている。"
