notes: "指摘にしなかったこと。(1) 画面を包む枠の処理が無いことは、プロファイルの決まりどおり。(2) 機械チェック (validate result) は OK、プロファイルも作業定義の profile.dir から読めている。全フレームの根拠の行が実在し、空行でないことを機械的に確かめた。(3) 前回のレビューの指摘 (GET metrics の parameters、source で URL が切り替わる呼び出しの状態、canViewWebsite / canUpdateWebsite の user.isAdmin、ほかの入口から写した文、auth?.user の綴り) は、どれも直っていることを確かめた。(4) 画面固有の部分 (EventsPage の 3 つのタブ、EventsMetricsBar、EventsDataTable → EventsTable → EventData、EventsChart、MetricsTable と GET metrics の分かれ道、EventProperties と PropertyChart / PropertyNumericChart / PropertyDateChart / EventDataPivotTable、SessionModal → SessionProfile と削除・活動・プロパティ・録画・録画の保存) は、コードと突き合わせて、呼び出しの条件、受け口の URL とメソッド、問い合わせの表と列、ルールが合っていることを確かめた。(5) 同じ処理の置き場 (入口から深さ優先で最初に着いた呼び出し元の下) と、書き直したフレーム (_rw) が読み書きを持つ最初の段で止まり、確認・設定・ルールを繰り返していないことを確かめた。(6) 設定の名前 (API_URL、BASE_PATH、CLICKHOUSE_URL、CLOUD_MODE、DATABASE_REPLICA_URL、FAVICON_URL、PRIVATE_MODE、REDIS_URL) は、ほかの入口の結果と同じ綴り。確認の値 (user.isAdmin、PERMISSIONS.websiteUpdate / websiteDelete、canViewWebsite などの関数の名前、auth?.user) は、分析リポジトリの決まりの表どおり。ほかの入口には kind: other で canViewWebsite と書いた結果もあるが、この結果の ownership の方が決まりに合うので、指摘にしていない。getValues / getSessionActivity / getWebsiteDateRange は URL の絞り込み (filterQuery) を使わないので、event_data / session_data の読み取りが無くてよい。(7) ClickHouse の副問い合わせの select * を fields の名前 * で書いたのは、コードの文字のままなので指摘にしていない。(8) MonthFilter (WebsiteControls.tsx:43) はデータを読まないので、フレームが無くてよい。"
