notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読まれた)。high と medium の指摘は無い。pixel に固有の段 (page、getPixel、PixelPage、PixelProvider、usePixelQuery、GET /api/pixels/[pixelId]、canViewPixel、getTeamUser、PixelHeader と useSlug、useConfig、GET /api/config、PixelControls、PixelMetricsBar、PixelPanels) は、対象のファイルを全部読み、根拠の行・呼び出しの関係と条件・列・権限の確認・設定・つながりが合っていることを確かめた。共通の段は、全部の根拠の行の本文を主張と並べて読み (行が無い・範囲の外の根拠は 0 件)、次のファイルは本文も読んで書き漏れを探した: auth.ts の checkAuth、request.ts、permissions の share.ts と website.ts の canUpdateWebsite、load.ts、redis.ts、getUser、getWebsite、FilterBar、SegmentEditForm、WebsiteChart、MetricsTable、MetricLabel、Favicon、WorldMap、WebsiteExpandedView、MetricsExpandedTable、useApi、api-url.ts、values / stats / pageviews / metrics / segments (POST) / config の受け口、getValues、getWebsiteStats、getPageviewMetrics (PostgreSQL 側)、getSessionDataProperties (PostgreSQL 側)、getWebsiteDateRange、prisma.ts の絞り込みの組み立て。API を呼ぶフックの漏れは、画面が描く部品のフックの呼び出しを一覧にして確かめた (annotations のほかに漏れは無い)。結果の notes の判断で、正しいと確かめたもの: (2) 同じ処理の置き場は、コードの順の深さ優先と合う。(3) 書き直した段 (末尾が _rw) は、読み書きを持つ最初の段で止まり、確認・設定・ルールを繰り返していない。(5)(a) pixel を作る処理は website の行を作らない (src/app/api/pixels/route.ts:60) ので、website が当たらないという読みは妥当。canUpdateWebsite が website だけを探す (website.ts:141) ので、管理者でなければセグメントの保存が通らないという読みも妥当。(5)(c) ピクセルの URL (/p/<slug>) は画面ではなく受け口で、入口の一覧に無いので、links に書かない扱いでよい。(5)(e)(f) guards の値と設定の名前は、ほかの入口の結果の多い側の綴りと同じ (設定の名前、guards の値、links の /pixels/${pixelId}/edit を、全部の結果と機械的に比べた)。指摘にしなかったこと: (1) GET /api/config の下の Response.json を external にしていること (終端の決まりを満たすための扱いで、理由が notes (5)(g) にある)。(2) Tabs の中の MetricsTable を always にしていること (note がある)。(3) API_URL と PIXELS_URL の設定は、写している行も根拠にあるので fact にもできるが、interpretation のままでも誤りではない。(4) PostgreSQL でイベントのプロパティで絞るとき、website_event の event_id も条件に使う (prisma.ts:574 の website_event.event_id in (...))。URL のフィルターで決まる列は fields に書かない、という結果の扱いの範囲とみなした。確かめていないもの: getSessionDataValues、getPageviewStats、getSessionStats、getSessionMetrics、getChannelMetrics、getChannelExpandedMetrics、getSessionExpandedMetrics、getEventExpandedMetrics、getPageviewExpandedMetrics の SQL は、根拠の行の本文と fields の対応だけを見て、SQL の全文とは突き合わせていない。ClickHouse 側の SQL も同じ。"
