notes: "確かめたこと: (1) 機械チェックは OK (作業定義の profile.dir からプロファイルを読んでいる)。根拠の file:line は、全 171 フレームのすべてが対象のファイルの行の範囲にあり、空の行を指すものも無い (機械的に確かめた)。(2) 共有の部品: BoardControls (board_controls) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は BoardControls.tsx:4 の import と :26 の描く行) がある。WebsiteControls の下の段は無い。BoardControls が渡す値 (websiteId だけ) と、既定値のままになる操作 (allowFilter / allowDateFilter は true、allowBounceFilter / allowCompare / allowDownload は false、allowMonthFilter 無し) は summary にあり、WebsiteControls.tsx:12-17 と合う。boards.boardId_d の同じフレームと書き方がそろっている。PixelControls (:22) は WebsiteControls (:26) より先なので、同じ処理の置き場は PixelControls の下のままでよく、外した段に、先に着いていた処理は無い。PixelControls / LinkControls は別の入口ではないので辿っているのは、決まりに合う。(3) どの入口にも出る共通の段: checkAuth は settings に CLOUD_MODE (kind: env)、rules に API キーの枝の 1 行、下に getUser がある。src/permissions/ の確認の関数 (canViewWebsite / canUpdateWebsite / canViewPixel / canViewLink / canViewTeam) は、ownership と、別の 1 件の role (user.isAdmin) を持つ。canViewWebsiteSection / canViewSharedWebsite / canViewSharedWebsiteFilters は中に管理者の確認が無いので kind: other で、ほかの入口の結果と同じ。API_URL と BASE_PATH は、入口から辿って最初に API を呼ぶ useDashboardQuery (DashboardEditPage → DashboardProvider:50) にだけあり、書き直しの段 (_rw) には確認・設定・ルールを繰り返していない。結果の target は作業定義と同じ。(4) dashboard 固有の段 (page / DashboardEditPage / DashboardProvider / useDashboardQuery / GET・POST /api/dashboard / hasValidBoardReports / getReport / DashboardEditHeader / BoardControls / PixelControls / LinkControls / BoardEditBody / BoardEditRow / BoardEditColumn / BoardComponentSelect と、その中の選択欄と funnels・goals) は、根拠の行を開いて主張と合うことを確かめた。getEntity が呼ぶ getBoard は、先に着く GET /api/dashboard の下 (q_get_board) に書いてあり、q_get_entity の summary にもそう書いてある。(5) 固定の値で閉じている呼び出し (includeTeams の枝、PixelControls / LinkControls の ExportButton、SegmentEditForm の更新、values の受け口の segment / cohort の枝) は、どれも木の中のコードに直接書いた値 (渡さない既定値、useFields の固定の一覧) で決まり、条件を持つフレームの summary に、値と行が書いてある。パスで決まるイベントのプロパティのタブと、teamId / ストアのユーザーで決まる受け口は、conditional で、成