notes: "確かめたこと: (1) 根拠の file:line は、全 179 フレームのすべてが対象のファイルの行の範囲にある (機械的に確かめた)。dashboard 固有のフレーム (page / DashboardEditPage / DashboardProvider / useDashboardQuery / GET・POST /api/dashboard / getBoard / hasValidBoardReports / getReport / updateBoard / createBoard / DashboardEditHeader / BoardControls / BoardEditBody / BoardEditRow / BoardEditColumn / useBoardEntityAvailability / BoardComponentRenderer / BoardComponentSelect / funnels・goals / WebsiteSelect・useLoginQuery・useUserWebsitesQuery と 3 つの受け口) は、根拠の行を開いて主張と合うことを確かめた。確認とルールの status は、全件を一覧にして見た。(2) 登録表の部品: BoardComponentRenderer で止め、embed 16 件の target と entry_id が登録表のキーと入口の一覧の part の id と一致し、status は interpretation、TextBlock は summary に名前だけ。試し描き (BoardComponentSelect.tsx:507) は同じ関数なので 1 回だけ書いたことも、context.md の決まりに合う。(3) 固定の値で閉じている呼び出し 3 種類 (includeTeams の枝、ExportButton、SegmentEditForm の更新) は、3 つの条件を満たす: 値は木の中で渡さない既定値 (PixelControls.tsx:15 / LinkControls.tsx:15 / WebsiteControls.tsx:16 の allowDownload = false、BoardComponentSelect.tsx:340-345 で includeTeams 無し、FilterBar.tsx:195 で segmentId 無し)、条件はその値だけで決まり、この木の中でほかに WebsiteSelect / SegmentEditForm / 3 つの操作の部品を描く呼び出し元は無い (SegmentSaveButton / SegmentAddButton / SegmentEditButton はこの木に無い)。usePagedQuery は URL から page / search / orderBy / sortDescending だけを足すので、includeTeams は URL からも入らない。(4) 同じ処理の置き場: PixelControls・WebsiteControls・LinkControls の下に useWebsiteQuery / usePixelQuery / useLinkQuery を呼ぶ部品は無いので、列の useBoardEntityAvailability の下に書いたのは入口から辿る順に合う。(5) 指摘にしなかったこと: ownership の value (board.userId === auth.user.id、existing.userId === userId、auth.user.id === userId) は、コードの式 (!==) を裏返した形だが、いまの dashboard と boards.* の結果も同じ書き方なので、リポジトリの書き方として指摘にしなかった。q_create_board の fields に created_at / updated_at が無く、q_update_board には updated_at があるのは、それぞれの note に理由 (スキーマの既定値と @updatedAt) があり、boards の結果の createBoard も同じ書き方。期間と絞り込みの部品の連鎖 (values / segments / event-data / session-data / daterange) は boards.boardId_d.design から写したもので、代表のフレームだけを読んだ。"
