notes: "指摘にしなかったこと。(1) WebsiteControls の子 4 つ (WebsiteFilterButton・WebsiteDateFilter・ExportButton・FilterBar) の unknown + not_analyzed は、note に読んだ範囲と止めた理由があり、作業の決まりも打ち切りを禁じていないので、指摘にしていない。(2) useWebsiteCohortQuery は、深さ優先の順では追加のフォーム (CohortEditForm.tsx 35 行) で先に呼ばれる (enabled が false で問い合わせはしない)。作業の決まりは「成り立たないように見える呼び出しもフレームにする」なので、追加のフォームの下に置く読み方もあるが、結果の notes (2) に理由が書いてあり、届く先のある編集のフォームの下に置いた判断は妥当と見た。(3) GET …/segments の getQueryFilters (route.ts 31 行) は websiteId なしで呼ばれ、データに届かないので、フレームにしない扱いを受け入れた。(4) ext_prisma_values と ext_prisma_values_rw_filter の DATABASE_REPLICA_URL の interpretation は、ほかの入口の大半と同じなので、指摘にしていない。(5) 画面が送る page と pageSize を受け口のスキーマが落とし、いつも最初の 20 件になる、という主張は、request.ts 30〜45 行・prisma.ts 758〜759 行・constants.ts 31 行で確かめた。(6) 根拠の行は、全フレームの call・summary・guards・settings・rules・io を対象のコードで開いて確かめ、主張を支えていない行は見つからなかった。設定・確認の値・つながりの綴りは、ほかの入口の結果とそろっている"
