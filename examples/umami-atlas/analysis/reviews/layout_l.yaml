notes: "機械チェック (validate result) は OK で、プロファイルは作業定義の profile.dir から読めている。analysis-conventions.md に、このリポジトリで合意済みの決まりは書かれていなかった。4 つのフレーム (layout / providers / ext_next_intl / ext_next_headers) の call、summary、parameters、settings、rules の根拠の行をすべて開いて確かめ、上の 3 件 (どれも根拠の行の一部不足) を除き、行は実在して主張を支えている。状態 (call と DISABLE_UI は fact、summary と、next.config.ts の写しを経る BASE_PATH / DEFAULT_LOCALE は interpretation) は妥当。providers の call の when: conditional (設定 DISABLE_UI による切り替えで、親が子を描くかどうかを決める) と、2 つの external の when: always は、分析の skill の基準に合う。external の source は、ライブラリを実際に呼ぶ・描く行 (layout.tsx:49、Providers.tsx:29) で、context.md の決まりどおり。I/O は無く、localStorage の読み書きを I/O に書かないのも context.md どおり。権限の確認、ほかの入口へのつながりは、layout.tsx と Providers.tsx に無いことを確かめた。analyzer.tests が無いので tests は見ていない。指摘にしなかったが伝えておくこと: (1) useLocale の httpGet (useLocale.ts:23) が読む <basePath>/intl/messages/<言語>.json は、public/intl/messages に実在する静的ファイルで、src/app の下に当たる route は無い。context.md のデータの当てはめは『サーバーから他社のサービスを呼ぶ HTTP』と『route ファイルが scope に無い (別のサービスの API)』しか決めておらず、ブラウザから同じサーバーの静的ファイルを読む場合の扱いが書かれていない。分析の側は I/O にもフレームにも書かない扱いにして notes に理由を書いている。この扱いでよいかは、人が決めて analysis-conventions.md に書くとよい。(2) context.md は、データに届かない枠を『入口のフレームから、最後に頼るライブラリを external フレームとして 1 つ書いて閉じる』としているが、この結果は Providers の段をはさみ、external を 2 つ (next-intl と next/headers) 書いている。経路の漏れではなく、主張もコードと合うので指摘にしなかった。(3) html の lang は、MessagesProvider が言語の全体 (Providers.tsx:25)、useLocale が先頭の部分だけ (useLocale.ts:49) を設定している。providers の summary は『html の dir と lang を設定し』とだけ書いており、誤りではない"
