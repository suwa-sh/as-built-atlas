notes: "(1) 根拠の行は、全部 (約 600 か所) が対象のコードに実在し空行でないことを機械的に確かめたうえで、入口の page から SettingsPage、WebsiteSettingsPage、WebsiteProvider、5 つの区画、各フック (useWebsiteQuery / useUpdateQuery / useDeleteQuery / useSubscription / useWebsiteSharesQuery / useLoginQuery / useUserTeamsQuery / usePagedQuery / useApi / getApiUrl)、受け口 (websites/[websiteId] の GET / POST / DELETE、shares の GET / POST、share/id/[shareId] の GET / POST / DELETE、transfer、reset、auth/subscription、auth/verify、users/[userId]/teams)、権限の関数 (website.ts / share.ts / entity.ts / team.ts)、query の関数、schema.prisma の列までを開いて、主張と突き合わせた。主張を支えていない根拠は見つからなかった。(2) 入口から深さ優先で辿る順による置き場 (getWebsite は getEntity の下、getTeamUser は canViewWebsite の下、canUpdateWebsite / updateWebsite / createShare は POST /api/websites/[websiteId] の下、ShareEditForm は追加ボタンの下、useLoginQuery / useUserTeamsQuery は WebsiteData の下) と、_rw フレームの書き直し (いちばん早い呼び先を、読み書きを持つ最初の段まで。確認・設定・ルールを繰り返さない) は、context.md と analysis-conventions.md に合っている。call の when も、analyze skill の決まり (相手が見つからない早い return だけなら always、管理者で先に許して返す経路の後ろは conditional、利用者の操作で最初に動く段は conditional) に合っている。(3) 綴り (canViewSharedWebsite / auth?.user の kind other、auth.user.id === userId、user.isAdmin、PERMISSIONS.*、CLOUD_MODE / API_URL / BASE_PATH / REDIS_URL、/websites/${websiteId}、${process.env.cloudUrl}/share/${slug} の not_traceable_in_repo、請求の画面の out_of_scope) は、ほかの入口の結果とそろっている。(4) 指摘にしなかったが、伝えておくこと: (a) WebsiteEditForm は Form に values={website} を渡し、送信の値から shareId だけを外して送る (WebsiteEditForm.tsx:11、:23)。UI ライブラリが values の全部 (replayConfig を含む) を送信の値に入れるなら、名前とドメインの保存でも replayConfig が送られ、replay_config / recorder_enabled も書き直される。ライブラリのソースが手元に無く確かめられないので指摘にしていない (結果の「本文に replayConfig があるときだけ書く」は、どちらでも正しい)。(b) usePagedQuery は URL のクエリの page / search / orderBy / sortDescending をいつも送る (usePagedQuery.ts:18-25)。shares と users/[userId]/teams の受け口は search をスキーマに持たないので、zod が捨てる (検査は通る)。api_shares_get の parameters の note の「スキーマの検査で落ちる」は、届かないという結論は正しく、言い回しだけの問題。(c) q_create_share の条件「shareId が文字列のとき」と q_get_share_by_entity の条件は、コードでは真偽で分けている (route.ts:85) ので、空の文字列は getShareByEntityId の側に行く。この画面は shareId を送らないので結果に影響しない。(d) 入口の一覧 (entry-list.yaml) の、この入口の within は layout_l と layout_l.main_g だけで、websites/[websiteId] の layout (layout_l.main_g.websites.websiteId_d。サーバー側で getWebsite を読む) が入っていない。within は列挙ツールが決めるもので、この結果の誤りではないが、集計で枠の読み書きがこの画面に足されない可能性がある。"
