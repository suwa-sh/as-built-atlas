notes: "根拠の行は、登録表 (boardComponentRegistry.tsx:280-298)、BoardRevenueChart / useBoardRevenueCurrency / useRevenueChartQuery、受け口 (route.ts)、parseRequest / checkAuth / canViewWebsiteSection / canViewWebsite / getEntity、getQueryFilters / setWebsiteDate / fetchWebsite / fetchAccount / getWebsiteSegment、getRevenueChart の 2 つの SQL、prisma.ts / clickhouse.ts / db.ts / redis.ts / load.ts の該当行、schema の表の定義の行まで開いて確かめ、どれも主張を支えていた。指摘にしなかったこと: (1) GET revenue/chart の call を always にした扱い。フックの enabled は websiteId と通貨の有無で、通貨はいつも値に落ち、websiteId は入力の欠けで打ち切る経路に当たる。ほかの部品の入口 (WebsiteChart の enabled: !!websiteId、RevenueMetricsBar) とも同じ扱い。(2) 受け口が canViewWebsiteSection に渡す固定の値 revenue と、フックが useFilterParameters に渡す includePagination: false は、呼び出しを閉じない (前者は共有トークンの設定との組み合わせ、後者は送る値だけを変える) ので、固定の値で閉じた呼び出しが 0 件という notes (3) は妥当。(3) getWebsite の経路を、DFS で先に着く getEntity の下に書き、fetchWebsite の summary で触れた置き場は、決まりどおり。(4) canViewWebsiteSection の guards の kind: other は、ほかの入口の結果 (20 件) と同じ綴り。(5) DEFAULT_CURRENCY・API_URL・BASE_PATH・REDIS_URL・CLOUD_MODE・CLICKHOUSE_URL・DATABASE_REPLICA_URL の綴りは、analysis-conventions.md と既にある結果に合っている。"
