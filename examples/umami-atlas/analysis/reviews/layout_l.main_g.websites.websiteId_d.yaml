notes: "機械チェック (validate result) は OK で、プロファイルは作業定義の profile.dir から読まれた。全フレームの call / summary / parameters / io / links / guards / settings / rules の根拠の行を開いて確かめ、上の 3 件のほかは、行が実在して主張を支えていた。前の版のレビューの 2 件 (canViewWebsite の summary の「作成者」、Favicon のフレーム) は、いまの結果では直っている。確かめて、指摘にしなかった点: (1) テーブル名と列名は schema.prisma の @@map / @map と合う (user:37、website:130、website_event:183、team:249、team_user:265、link:358、pixel:378、board:398、share:412)。ClickHouse の website_event は db/clickhouse/schema.sql:2。(2) 同じ処理の置き場は、コードの順の深さ優先で合っている (getWebsite は layout.tsx:15 の下、parseRequest と checkAuth は route.ts:22 の下、canViewWebsite は share.ts:82 の下)。canViewWebsiteSection の下の書き直し (q_*_rw) は、いちばん早い呼び出しの 1 本で、I/O を持つ段で終わっている。(3) when の当てはめは、分析の skill の基準と合う (早い return だけの手前は always、WebsiteProvider が子を描くかを決める WebsiteHeader と、/settings で描かない Favicon / ActiveUsers は conditional、runQuery の切り替えは conditional)。(4) リンクの行き先の entry_id (websites.websiteId_d、websites.websiteId_d.settings、websites.websiteId_d.realtime) は、入口の一覧にある。(5) API キーの経路 (auth.ts:74-76) を書かない判断は、ブラウザが付けるトークンが localStorage のログイントークン (useApi.ts:28、client.ts:4-5) であることから読める範囲で、結果の notes に理由がある。(6) GET /api/config をフレームにしない判断は、受け口が skipAuth で checkAuth を通らず (config/route.ts:8、request.ts:51)、環境変数を返すだけなので、データに至る経路の上に無いという context.md の基準に合う。(7) prisma.ts:743 の SET search_path ($executeRawUnsafe) は、ext_prisma_active (prisma.ts:746) とは別の行のライブラリの呼び出しだが、データの読み書きではなく、q_active の settings (DATABASE_URL) に書いてあるので、辿り漏れには数えなかった。(8) Favicon の external_api は、サーバーからではなくブラウザが img で読む呼び出し。context.md の当てはめ (サーバーから他社のサービスを呼ぶ HTTP) とは少し違うが、外部への送信として detail と note に経路が書いてあるので、指摘にしなかった"
