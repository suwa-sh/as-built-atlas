  - kind: missing_frame
    severity: low
    where: callstack/website_header/io/0
    claim: "icons.duckduckgo.com への画像の読み込みは Favicon コンポーネント (Favicon.tsx:9) が img を描いて起こすが、Favicon のフレームが無く、I/O が呼び出し元の WebsiteHeader に付いている。Favicon は useConfig の privateMode と faviconUrl で送信の有無と送り先を決めており、外部への送信に至る経路上のコンポーネントにあたる"
    evidence: { file: src/components/common/Favicon.tsx, line: 21 }
