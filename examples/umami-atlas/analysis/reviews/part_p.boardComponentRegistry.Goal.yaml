notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めた)。根拠の行 (登録表の 163-176 行、BoardGoal.tsx、Goal.tsx、useSavedDefinitionsQuery.ts、useGoalQuery.ts、useAnalyticsQuery.ts、useFilterParameters.ts、useDateRange.ts、3 つの route、request.ts、auth.ts、load.ts、redis.ts、report.ts / share.ts / website.ts / entity.ts、queries/prisma の各関数、getGoal.ts、prisma.ts と clickhouse.ts の該当行、schema.prisma の @@map) は、上の指摘を除き主張を支えていた。固定の値で閉じている呼び出し (Goal.tsx:59 の allowEdit && !isSharePage、BoardGoal.tsx:60 の allowEdit={false}) は 3 つの条件を満たすと判断した: 値は木の中のリテラル、条件は AND なので allowEdit=false だけで偽に決まる、この木で Goal を描くのは BoardGoal の 1 か所だけ。閉じた値と行は、条件を持つフレーム goal の summary と先頭の notes に書かれていて、analysis-conventions.md の部品の入口の決まりに合う。部品の決まり (useGoalDefinitionQuery の呼び出しは always、enabled で止まる API の段は conditional。id が渡らないときの goals/stats は保存データ由来の値なので閉じた呼び出しにせず conditional) と、同じ処理の置き場 (コードの順で定義の GET が先。canViewWebsiteSection は canViewReport の下、書き直しは I/O を持つ checkAuth まで) は context.md と analysis-conventions.md に合っている。guards の綴り (canViewReport は ownership、canViewWebsiteSection は other、canViewWebsite は ownership、管理者は user.isAdmin) は、ほかの入口の結果とそろっている。指摘にしなかったこと: (1) イベントのプロパティの絞り込み (epf<n>) は、useFilterParameters が URL の末尾が /events のときだけ送る (useFilterParameters.ts:25) ので、ボードの画面からは event_data の読み取りが起きないように見えるが、描く画面は部品の入口からは決められないので、conditional の io のままでよい。(2) website_event の fields に、プロパティの絞り込みで使う event_id が無いが、note で実行時に足す条件の列を書かない方針が明示されているので、指摘にしなかった。(3) api_goal_get の summary の「parseRequest で入力とログインを確かめ」は、GET は schema を渡さないので入力の検査は無い (ログインの確認だけ)。表現の差なので指摘にしなかった。"
