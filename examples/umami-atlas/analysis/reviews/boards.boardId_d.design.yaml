notes: "このリポジトリの決まり (analysis-conventions.md の「どの入口にも出る共通の段」「共有の部品」) に照らして確かめ、合っていたもの: BoardControls は WebsiteControls を描く所で止め、links に embed (target WebsiteControls、entry_id part_p.shared_a.WebsiteControls、status fact、根拠は BoardControls.tsx:4 の import と :26 の描く行) を書いている。渡す値 (websiteId だけで、ほかは WebsiteControls.tsx:12-17 の既定値) は summary に書いてあり、WebsiteControls の中は辿っていない。PixelControls / LinkControls は別の入口ではないので、データまで辿っているのも決まりどおり。登録表 (boardComponentRegistry) の部品 16 件は BoardComponentRenderer で止め、embed を 16 件 (entry_id は入口の一覧の part_p.boardComponentRegistry.* と一致) 書いている。TextBlock (requiresWebsite false、文字だけ) を入口にしていないのも合う。checkAuth の CLOUD_MODE と API キーの rules、API_URL / BASE_PATH を最初に API を呼ぶ useBoardQuery にだけ書いた点、書き直した段 (_rw) に確認や設定を繰り返さない点も、決まりどおり。指摘にしなかったもの: (1) share.ts の確認を kind other で書く点と、GET /api/users/[userId]/websites の ownership の値 auth.user.id === userId は、ほかの多くの結果と同じ書き方なので指摘にしない。(2) 登録表の embed の根拠の行が、各項目の type の行の 1 行前 ({ の行) を指しているが、前後 5 行の中で主張を支えている。(3) PixelControls / LinkControls の下の WebsiteFilterButton などが always なのは、共有画面の設定による出し分けが rules に書かれており、通常の画面では成り立つので、指摘にしない。(4) boards.boardId_d.edit と boards の結果にも、canViewSharedWebsite の guards が無い (同じ抜け) が、このレビューの対象外。"
