notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。全ての evidence の file:line が対象に実在し、範囲内であることを機械的に確かめた (登録表の項目の始まりの行 { を指すものは、プロファイルの決まりどおり)。この入口に固有のフレーム (page、BoardDesignPage、BoardProvider、BoardDesignHeader、BoardControls、3 つの操作の部品、BoardEditBody / Row / Column、useBoardEntityAvailability、BoardComponentRenderer、BoardComponentSelect、POST /api/boards/[boardId]・POST /api/boards とその下の権限の確認、funnels・goals の受け口、WebsiteSelect とその下) は、source・call・summary・rules・links・guards を対象のファイルで確かめた。確かめたこと: (1) BoardComponentRenderer の embed 16 件は、入口の一覧の part の入口 16 件 (TextBlock を除く登録表の項目) と 1 対 1 で、target は登録表のキー、状態は interpretation、根拠は登録表を引く行 (BoardComponentRenderer.tsx:17・39) と項目の行。Metrics bar の、対象の種類ごとの部品の判定は rules にある。試し描き (BoardComponentSelect.tsx:507) は同じ関数なので summary で触れるだけでよい。(2) 固定の値で閉じた呼び出しの 3 種類 6 か所は、3 つの条件を満たす: includeTeams は BoardComponentSelect.tsx:340-345 で渡さず、usePagedQuery も URL から includeTeams を足さない (usePagedQuery.ts:18)。allowDownload は BoardControls.tsx:22・24・26 で渡さず、既定値 false。segmentId は FilterBar.tsx:195-200 で渡さず、この木の中で SegmentEditForm を描くのは FilterBar だけ (SegmentFilters などは描かない)。閉じた値と行は、条件を持つフレームの summary と結果の notes に書いてあり、このリポジトリの決まりに合う。(3) 辿る順 (BoardProvider → BoardDesignHeader → BoardControls → BoardEditBody、BoardControls の中では PixelControls → LinkControls → WebsiteControls、列では useBoardEntityAvailability → BoardComponentRenderer → BoardComponentSelect) はコードの順と合い、同じ関数の置き場もその順で最初に着く所にある。(4) この画面のパス (/boards/<id>/design) では、FilterEditForm の isPixelLink が偽になるので、ピクセルやリンクの対象でもセグメントとセッションのプロパティのタブが出る。PixelControls の下に絞り込みの木を全部書いているのは、コードのとおり。指摘にしなかったこと: (a) 絞り込みの部品の下の受け口 (values / segments / event-data / session-data / daterange) と、その下の問い合わせのフレームは、同じコミットでレビュー済みの boards.boardId_d の結果から写したもので、根拠の行は主なものだけを見直し、問い合わせの列までは読み直していない。(b) GET /api/users/[userId]/websites の guards の value が式 (auth.user.id === userId) なのは、確かめる関数が無いためで、ほかの入口の結果とも同じ綴り。(c) テストとの対応は、analyzer.tests が無いので見ていない。"
