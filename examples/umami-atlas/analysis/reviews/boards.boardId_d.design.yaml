notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。boards.boardId_d.edit の結果と同じ処理 (ボードの読み込み・更新、権限の確認、対象の読み込み、選択欄) のフレームは、レビュー済みの中身と同じであることを確かめ、根拠の行は主なものだけを見直した。この入口に固有のフレーム (page、BoardDesignPage、BoardProvider、BoardDesignHeader、BoardControls、BoardEditBody、BoardEditRow、BoardEditColumn、useBoardEntityAvailability、BoardComponentRenderer、BoardComponentSelect、POST /api/boards とその下、GET /api/websites/[websiteId]/funnels・goals とその下、部品の 18 のフレーム) は、source・call・summary・rules・links・guards の根拠を対象のファイルで確かめた。辿る順 (BoardProvider → BoardDesignHeader → BoardControls → BoardEditBody、列では useBoardEntityAvailability → BoardComponentRenderer → BoardComponentSelect、小窓では報告の一覧 → PixelSelect → LinkSelect → WebsiteSelect) もコードの順と合っている。指摘にしなかったこと: (1) WebsiteControls / PixelControls / LinkControls と部品の 18 のフレームの not_analyzed は、note に読んだ所と止めた理由があり、作業の決まりも打ち切りを禁じていないので、指摘にしていない (続きを分析するかは人が決める)。ただし、部品の note の「同じ部品の経路は、サイトのイベントの画面 / ゴールの画面 / UTM の画面 / リアルタイムの画面 / 売上の画面 / セッションの画面 の結果にある」は、入口の一覧には当たる入口 (websites.websiteId_d.events / goals / utm / realtime / revenue / sessions) があるが、いまは analysis/results/ にまだ結果が無い。note を入口の id で書くと、辿りやすくなる。なお、「フレーム <id> と同じ」と書いた参照は、すべてこの結果の中にあるフレームを指している (確かめた)。(2) BoardProvider の、作成のあとの router.push (BoardProvider.tsx:138) は、自分の external のフレームを持たず、ext_router_push の note で触れているだけ。つながり (links) には書いてあり、終端の決まりも満たしているので、漏れに数えていない。(3) q_check_auth_rw_pixel などの書き直しは、checkAuth の段の Redis の読み書きを繰り返さず、getUser の段まで書いている。boards.boardId_d.edit の結果と同じ書き方で、そちらのレビューでも指摘されていないので、ここでも指摘にしていない。(4) canViewWebsiteSection から canViewWebsite へ入る枝の when は、入口の間でも分かれている (websites.websiteId_d.funnels は conditional、dashboard.edit は always)。どちらにそろえるかは人が決めるとよい。(5) テストとの対応は、analyzer.tests が無いので見ていない。"
