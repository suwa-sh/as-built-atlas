notes: "根拠の行は、すべて対象のコードで開いて確かめた。フレーム 9 つ・呼び出し・読み書き・確認・設定・ルールのどれも、根拠の行が主張を支えていた。指摘にしなかった点: (1) authorization ヘッダーが、localStorage のトークンを消す前の値で送られるという読み (summary) は、useApi.ts:28 が描画のときに defaultHeaders を作り、post の useCallback (依存は httpPost だけ) が最初の描画の値を持ち続けることから妥当と判断した (interpretation のままでよい)。(2) POST /api/auth/logout の call が always、checkAuth の call が always (schema も options も渡さないので request.ts:51 の条件はいつも成り立つ)、Redis の del と get、getUser が conditional であることは、コードのとおり。(3) API_URL を設定に書いていないのは正しい (/auth で始まる URL は api-url.ts:6、39 で apiUrl を使わない)。(4) KVS の削除の fields が \"*\" (write) なのは、分析の skill の決まり (キーをまるごと消す) のとおり。(5) checkAuth の authentication の確認は value を書かず、checkAuth の段だけに書いてあり、分析リポジトリの決まりのとおり。設定の名前 (DISABLE_LOGIN、CLOUD_MODE、BASE_PATH、REDIS_URL) も決まりの綴り。(6) checkAuth の guards・settings・rules・io と getUser の fields は、login の結果と同じ綴りであることを確かめた。(7) 共有トークンだけで認証が通ったとき (user は null) も、受け口は ok を返す (logout/route.ts:12 は authKey があるときだけ消す)。summary の「認証できなければ 401」と矛盾はしないが、利用者の特定が要らない経路があることは、guards の note に書いてあるとおり。(8) analyzer.tests が無いので、tests の漏れは見ていない"
