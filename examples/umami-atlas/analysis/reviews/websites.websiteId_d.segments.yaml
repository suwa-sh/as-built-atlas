notes: "指摘にしなかったこと。(1) WebsiteControls の子 3 つ (WebsiteDateFilter・ExportButton・FilterBar) の unknown + not_analyzed は、note に読んだ範囲 (WebsiteDateFilter.tsx:33、ExportButton.tsx:20、FilterBar.tsx:35 を開いて確かめた) と止めた理由があり、作業の決まりも、名指しされた WebsiteFilterButton 以外の打ち切りを禁じていないので、指摘にしていない。(2) q_get_query_filters と q_get_values の when が always なのは、values/route.ts:52 の else の枝の中だが、分析 skill の「if の中でも、この入口から辿る限り条件がいつも成り立つなら always、理由を note に書く」に当たり、note もあるので受け入れた (events・cohorts とも同じ扱い)。(3) useWebsiteSegmentQuery を、深さ優先で先に着く追加のフォームではなく、届く先のある編集のフォームの下に置いた判断は、結果の notes (5) に理由があり、cohorts と同じなので受け入れた。(4) 画面が送る page と pageSize を受け口のスキーマが落とし、いつも最初の 20 件になる、という主張自体は、request.ts 30〜45 行・prisma.ts 758〜759 行・constants.ts 31 行で確かめた (rules に無いことだけを low で指摘した)。(5) 書き直したフレーム (q_can_view_website_rw1 → q_get_entity_rw1 → q_get_website_rw1、q_parse_request_rw_segment_get → q_check_auth_rw_segment_get、q_get_website_rw_update、q_get_website_rw_delete) は、終端の決まりを満たす最初の段までで、確認・設定・ルールを繰り返していない。(6) canUpdateWebsite / canDeleteWebsite の先頭の if (!user) は、ほかの入口の結果も guards に書いておらず (role・ownership・permission の 3 つ)、そろっているので指摘にしていない。(7) team の読み取りを interpretation にしている入口は、ほかにも多数ある (この確かめでは 66 件) が、このレビューの対象はこの入口だけなので、ここだけを指摘した。(8) 根拠の行は、全フレームの call・summary・parameters・io・links・guards・settings・rules を対象のコードで開いて確かめ、上の指摘のほかに、主張を支えていない行は見つからなかった。設定の名前・確認の値・つながりの綴りは、ほかの入口の結果と分析リポジトリの決まりにそろっている。"
