notes: "(1) 結果の notes (c) の扱いは、指示書の「固定の値で閉じている呼び出し」の決まりに照らして正しい。session-data/properties と session-data/values の受け口は、スキーマに filterParams (schema.ts 66・67 行の segment / cohort) を含み、フック (usePropertyFieldsQuery 16 行、usePropertyValuesQuery 19 行) が useFilterParameters (35・36 行) で画面の URL の segment / cohort を送る。値が入口の外 (URL) から来るので 1 つ目の条件に当たらず、さらに同じ getQueryFilters に別の呼び出し元から別の値で着く経路があるので 3 つ目の条件にも当たらない。よって getQueryFilters の segment / cohort の分かれ道は閉じておらず、その経路 (session-data/properties) の下に getWebsiteSegment を conditional で書き、note に理由を書いた形は、決まりどおり。values の受け口からの呼び出しで segment / cohort が届かない読み (useWebsiteValuesQuery 54〜59 行、values/route.ts 13〜16 行のスキーマ、request.ts 38〜45 行は数字付き・pf_ などの鍵しか戻さない) も確かめた。ただし、q_get_query_filters の summary が、その枝を「固定の値で閉じている呼び出し」と呼んでいるのは、3 つ目の条件から見ると言い過ぎ (関数としては閉じていない。この呼び出し元から届かないだけ)。直すなら「この呼び出し元からは segment / cohort が届かないので、分かれ道は session-data の経路の下に書いた」とする程度で、集計には影響しないので指摘にしていない。(2) 同じ session-data の経路では excludeBounce も URL から届く (request.ts 172 行) が、getSessionDataProperties / getSessionDataValues の SQL は excludeBounceQuery を使わない (parseFilters から filterQuery・joinSessionQuery・cohortQuery・queryParams だけを取る) ので、ルールが無くても漏れではない。(3) 共通の段は決まりと合っている: checkAuth は settings に CLOUD_MODE、rules に API キーの枝の 1 行、その下に getUser。canViewWebsite・canUpdateWebsite・canDeleteWebsite は ownership と別に role (user.isAdmin) を 1 件ずつ持つ。API_URL / BASE_PATH は最初に API を呼ぶ use_segments に 1 回だけ。target は作業定義と同じ。(4) 共有の部品: segments_page で止め、links に embed (target WebsiteControls、entry_id part_p.shared_a.WebsiteControls、status fact、根拠 SegmentsPage.tsx 3・10 行) があり、渡す値 (allowFilter={false}・allowDateFilter={false}、ほかは既定) と、その結果どの操作も出ないこと (WebsiteControls.tsx 12〜17・34〜46 行) が summary に正しく書かれている。(5) values の受け口の SEGMENT_TYPES の分かれ道 (values/route.ts 48 行) が fieldsParam (schema.ts 127〜148 行) で決して着かない読みも正しい。"
