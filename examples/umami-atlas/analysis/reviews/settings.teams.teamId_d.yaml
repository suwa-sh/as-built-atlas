:775 / :844)、schema.prisma の @@map (37 / 249 / 265 / 358 / 378 / 398 / 412) と :8 (postgresql) を開き、主張を支えることを確かめた。(5) deleteTeam のクラウドモードの枝を I/O に書かない判断: settings の layout は process.env.cloudMode のとき null を返し (settings/layout.tsx:5)、next.config.ts:16 で cloudMode は CLOUD_MODE から作られるので、deleteTeam の process.env.CLOUD_MODE (team.ts:164) と同じ条件。この画面からその枝に届かないという根拠は成り立つ。(6) /teams の呼び出しを interpretation にしている点は、環境変数 apiUrl で向き先が変わる (api-url.ts:39) ことに根拠があり、/auth/verify を fact にしている点も api-url.ts:6 の APP_ROUTE_PATTERNS と合うので、状態の取り違えとはしない"
