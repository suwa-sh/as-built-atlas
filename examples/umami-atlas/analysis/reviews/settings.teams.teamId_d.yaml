notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。全フレームの source と根拠の行を対象のコードで開いて確かめ、上の 3 件のほかは主張を支えていた。指摘にしなかったこと: [1] deleteTeam のクラウドモードの枝 (team の update、link / pixel の updateMany。team.ts:193-211) は I/O に書かれていない。設定の枠 (src/app/(main)/settings/layout.tsx:5) が process.env.cloudMode で何も描かず、その値は next.config.ts:16 と 217 で CLOUD_MODE から作られるので、この画面からは届かないという判断は、コードで確かめられた。ただし、枠は別の入口で、画面の側はビルド時の値、サーバーの側は実行時の値を見る。この枝の I/O を「設定で切り替わる読み書き」として書くかどうかは、人が決めてよい。[2] 同じ関数を 1 回だけ書く置き場 (parseRequest は GET /api/teams/[teamId] の下、getTeamUser は canViewTeam の下、useLoginQuery は TeamSettings の下、メンバーの DELETE は TeamLeaveForm の下) と、終端を避けるための書き直し (id が _rw で終わるフレーム) は、context.md の決まりのとおりだった。[3] URL に /admin を含むときだけ描く TeamsMemberAddButton と TeamTwoFactorSettings (TeamSettings.tsx:45, 49) をフレームにしていないのは、この画面の URL では条件が成り立たないためで、辿り漏れに数えていない。[4] getApiUrl は BASE_PATH (next.config.ts:15) も読むが、URL の前置きを変えるだけなので、settings の書き漏れに数えていない。[5] 入口の一覧に settings.teams があり、links の entry_id は合っている"
