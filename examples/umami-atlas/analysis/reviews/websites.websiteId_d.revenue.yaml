notes: "Revenue.tsx に合わせた部分 (通貨の既定値と DEFAULT_CURRENCY、chart と stats の両方が読めたときだけ内訳と一覧を描く条件、RevenueMetricsTable を 4 回描くことと enabled の扱い、SessionModal を同じ画面で開く流れ) と、新しく書いた getRevenueSessions の経路 (受け口の schema に maxResults・search があり getQueryFilters が通すこと、PostgreSQL は session を join し ClickHouse は join しないこと、売上の副問い合わせの列と期間の条件、pagedRawQuery の 2 回の読み取り) は、コードと合っていた。写した部分も、WebsiteControls の props が attribution と同じこと、セッションの小窓の受け口ごとのセクションの一覧と getQueryFilters を呼ぶ受け口の一覧、設定と確認の綴りがほかの入口とそろっていることを確かめた。api_revenue_metrics の when: always は、最初に選ばれているタブ (referrer / country) で画面を開けば呼ぶので、そのままでよい。指摘ではないが、コードの事実として: values の受け口 (values/route.ts:27-35) は渡すセクションに revenue を含まず、event-data/[eventId] は events だけを許すので、revenue のセクションだけを許した共有リンクでは、絞り込みの値の候補とイベントのプロパティの小窓が 401 になる。"
