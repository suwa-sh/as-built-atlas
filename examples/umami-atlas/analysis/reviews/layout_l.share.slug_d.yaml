notes: "機械チェック (validate result) は OK で、プロファイルも作業定義の profile.dir から読めている。analysis-conventions.md に、このリポジトリだけの決まりは書かれていない。全フレームの call / summary / parameters / io / links / settings / rules の根拠の行を開いて確かめた。上の 3 件 (定数の値の定義の行が足りない) を除き、行は実在して主張を支えている。テーブル名と列名は schema.prisma の @@map と @map に一致する (user、website、team、team_user、link、pixel、board、share)。同じ処理の置き場 (getWebsite / getPixel / getLink / getBoard は GET の下、getTeamUser は canViewWebsite の下) と、終端を避ける書き直し (getEntity の下の getWebsite、canViewPixel の下の getPixel、canViewLink の下の getLink) は、context.md の「同じ処理が何度も呼ばれるとき」の決まりに合う。辿り漏れは無い (getBoardEntityIds は I/O を持たず、createToken はデータに触れない)。権限の確認 (guards) が 1 件も無いのは実態どおり (route.ts は依頼した人の認証も権限も確かめず、canView 系の結果は id を絞るだけで処理を止めない)。指摘にしなかった点: (1) フックから route への call (callstack/api_share_get/call) は interpretation。URL の文字列 (/share/${slug}) はそのまま読め、当たる route も 1 つだが、接頭辞 /api は環境変数 API_URL が無いときの既定で決まるので、読み取りとして扱うのは妥当と判断した。context.md の「URL がそのまま読め、route が 1 つに決まる → fact」を厳密に当てるなら fact にもできる。どちらに揃えるかは人が決めてよい。(2) links の 13 件は fact。行き先は式 (ShareProvider.tsx:79) と一覧 (ALL_SECTION_IDS) の組み合わせで読めるので、そのままにした。(3) ext_share_find_first の when は always (website が見つからないときの早い return を打ち切りとみなす)。io の note は「website が見つかったときだけ」と書いていて、conditional とも読めるが、違いは always と conditional の間だけなので指摘にしない。(4) api_share_get の summary は、board が見つからないときの 404 (route.ts:149) に触れていない。"
