notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めた)。この入口に固有の経路 (登録表 boardComponentRegistry.tsx:234-241 → BoardRealtimeMetricsBar → useRealtimeQuery → GET /api/realtime/[websiteId] → parseRequest / checkAuth、canViewWebsiteSection / canViewWebsite / getEntity、getQueryFilters / fetchWebsite / fetchAccount、getRealtimeData → getRealtimeActivity / getPageviewStats / getSessionStats) は、根拠の行を開いて確かめ、主張と合っていた (REALTIME_RANGE = 30 と REALTIME_INTERVAL = 10000、useApi の get の params の既定が空のオブジェクトであること、30 分の期間で getMinimumUnit が minute を返し ClickHouse でも website_event から数えること、event_type = 5 の除外と 100 件の上限、国はセッションごとに 1 回だけ数えること、合計の 4 つの作り方)。schema.prisma の @@map と ClickHouse の schema.sql の行、prisma.ts / clickhouse.ts / redis.ts / db.ts / load.ts の行も合っていた。固定の値で閉じている呼び出し getWebsiteSegment (request.ts:133 / :145) を辿らない扱いは、閉じている値 (クエリが空) と行が q_get_query_filters の summary と先頭の notes の両方に書いてあり、analysis-conventions.md の部品の決まり (HTTP のクエリを通る値も閉じた呼び出しにする) に合う。決して起きない読み取り (event_data / session_data / website_event_stats_hourly) を note 付きで残す扱いも、決まりに合う。綴り (API_URL / BASE_PATH は最初のフック use_realtime にだけ、checkAuth にだけ authentication、canViewWebsiteSection は kind other、user.isAdmin と canViewWebsite) は、ほかの入口の結果とそろっている。指摘にしなかったこと: (1) 合計の「イベント」と「国」は、最近の動き (新しい順に 100 件) の中だけで数えるので、30 分の間に 100 件を超えると本当の数より小さくなる。rules の「動きの中で」と q_realtime_activity の 100 件の記述から読み取れるので、表現の範囲とした。(2) ext_realtime_activity_pg の DATABASE_REPLICA_URL の根拠に、ほかの 2 つの同じ設定にある prisma.ts:861 が無いが、主張は :738 で支えられている。(3) share の created_at の use が filter だが、実際は並べ替え (orderBy) に使う。語彙が read / write / filter しか無く、ほかの入口の結果とも同じ扱いなので指摘にしなかった。"
