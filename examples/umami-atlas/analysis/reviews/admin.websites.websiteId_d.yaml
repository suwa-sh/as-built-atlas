notes: "112 フレームの call / summary / parameters / io / guards / settings / rules / links を、根拠の行と対象のファイルで確かめた。根拠の行は、どれも主張を支えていた (行のずれは無い)。層と種類、when、fact / interpretation の付け方、データの当てはめ、終端の決まりを満たすための書き直し (id が _rw で終わるフレーム) の範囲、同じ関数を最初に着いた呼び出し元の下に 1 回だけ書く置き場も、決まりのとおりだった。権限の確認の値と設定の名前の綴りは、analysis-conventions.md の表に合っている (本人の確認 auth.user.id === userId は、ほかの入口の結果にも同じ綴りがある)。指摘にしなかったこと: (1) API キーの経路 (checkApiKeyAuth → api_key の読み取りと最終利用時刻の更新) を書いていないのは、分析の skill の「成り立たないように見える呼び出しは、消さずに conditional で書く」に沿わないが、理由が結果の notes (9) に書いてあり、ほかの入口の結果も同じ扱いにそろっているので、missing_frame にはしていない。analysis-conventions.md に扱いを明記するとよい。(2) Prisma の読み取りを複製へ送る DATABASE_REPLICA_URL を settings に書いていないのは、ほかの入口と同じ扱い (どの読み取りにも同じように効く接続の設定)。(3) リレーション経由のテーブル (team、team_user、user、website) の読み取りを interpretation にしているのは、テーブル名がコードに直接は出ないという理由が note にあり、妥当と見た。(4) 戻るリンクの target は、コードの書き方 (/websites/${website.id}) ではなく /websites/${websiteId} だが、ほかの入口の結果の多い方の綴りに合わせてあり、理由が note にある。(5) deleteWebsiteDependentData は、スキーマがあるとき SET search_path を実行する (website.ts:43-47) が、データの読み書きではないので書かれていなくてよい。"
