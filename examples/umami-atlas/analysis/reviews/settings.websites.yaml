notes: "根拠の行 (page / WebsitesSettingsPage / WebsitesDataTable / WebsitesTable / useLoginQuery / useUserWebsitesQuery / usePagedQuery / useWebsiteListChartsQuery / useConfig / Favicon / useApi / useNavigation / api-url / DataGrid / App.tsx / next.config.ts / auth/verify・users/[userId]/websites・websites/charts・config の route / request.ts / auth.ts / api-key.ts / redis.ts / user.ts / team.ts / website.ts / permissions/website.ts / getWebsiteListCharts.ts / db.ts / prisma.ts / clickhouse.ts / constants.ts / response.ts / schema.prisma / clickhouse の schema.sql) は、どれも主張を支えていた。辿り漏れの元になる部品 (Link、DataGrid、useTimezone、useModified、WebsiteSparkline、SectionHeader) は API を呼ばないので、フレームにしないのは context.md の決まりどおり。権限の確認の値 (canViewBatchWebsites、auth.user.id === userId) と、ログイン済みの確認を checkAuth の段だけに value 無しで書く形は、analysis-conventions.md とほかの入口の結果 (admin.users.userId_d など) にそろっている。指摘にしなかったこと: (1) checkAuth の CLOUD_MODE は、この入口では API キーの経路を辿らないので有無で結果が変わらないとも言えるが、前のレビューで指摘され、全部の入口でそろえるために残す扱いになっている (admin.websites.websiteId_d の notes) ので、繰り返さない。(2) DATABASE_REPLICA_URL は ext_charts_pg にだけ書かれているが、prisma.ts は replica があるとき readReplicas の拡張で ORM の読み取り (user.findUnique、team.findMany、website.findMany など) も複製の DB へ送る (prisma.ts:900)。ほかの入口の結果も生の SQL の段にだけ書いているので、入口をまたいだ扱いとして analysis-conventions.md で決めるのがよい。(3) BASE_PATH を API を呼ぶフックごとに書くかは、入口の結果ごとに割れている (links / admin.websites はどのフックにも書き、admin.users.userId_d は /auth のフックにだけ書く。boards.boardId_d.edit の notes も人の判断に回している)。上の 2 件の指摘は、この結果の notes (7) の理由づけが事実と合わないことを主にしたもので、そろえ方は analysis-conventions.md で決めるのがよい。(4) 編集ボタンの行き先 (WebsitesTable.tsx:85) は renderUrl に false を渡さないので、いまの URL のクエリ (page / search / orderBy など) を引き継ぐ。links の note には書かれていないが、行き先の入口は変わらないので指摘にしなかった"
