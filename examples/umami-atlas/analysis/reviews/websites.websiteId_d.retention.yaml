notes: "共有の部品 WebsiteControls は、RetentionPage (retention_page) で止めて links に embed (entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠は RetentionPage.tsx 4・18 行) を書いており、analysis-conventions.md の「共有の部品」のとおり。渡す値 (allowDateFilter={false}・allowMonthFilter) と、部品の既定 (WebsiteControls.tsx 12〜17 行) による表示の違いも、retention_page の summary に正しく書かれている。「どの入口にも出る共通の段」も満たしている: checkAuth は settings に CLOUD_MODE (api-key.ts 41 行の isApiKeyEnabled)、rules に API キーの枝の 1 行、下に getUser を持つ。canViewWebsite は ownership (canViewWebsite) と別に role (user.isAdmin) を 1 件持つ。API_URL と BASE_PATH は、WebsiteControls を embed で止めた後の木で最初に API を呼ぶ use_retention_query に 1 回だけ。target は作業定義と同じ。同じ処理の置き場 (parseRequest → canViewWebsiteSection → getQueryFilters → getRetention の順に深さ優先で、getWebsite は getEntity の下、fetchWebsite は summary で経路を参照) も context.md の決まりに合う。getRetention の PostgreSQL / ClickHouse の両方の I/O、cohortQuery の session の結合 (PostgreSQL だけ)、プロパティの絞り込みの event_data / session_data の列と行番号は、対象のコードで確かめた。指摘にしなかったこと: (1) q_get_query_filters の unit を直す rules は getQueryFilters の動きとしては正しいが、getRetention は unit を 'day' に固定する (getRetention.ts 36・110 行) ので、この入口の結果には効かない。必要なら note に一言足すとよい。(2) excludeBounce は getQueryFilters が filters に足すが、getRetention は excludeBounceQuery を使わず、この画面は allowBounceFilter を渡さないので、書いていないのは妥当。(3) rules の一部 (2 段階認証の仮のトークン、削除済みのサイトなど) はコードにそのまま書いてあるが、目的の説明を含むので interpretation のままでよいと判断した。"
