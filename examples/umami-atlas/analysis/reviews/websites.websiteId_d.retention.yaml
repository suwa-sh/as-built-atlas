notes: "前回の 2 件は直っていることを確かめた: (1) property_filters_event は conditional のまま、PropertyFilters (source: event) → usePropertyFieldsQuery → GET event-data/fields → getEventDataFields → external と、PropertyFilterRecord → usePropertyValuesQuery → GET event-data/values → getEventDataValues → external まで、データの読み書きを辿っている (コードと突き合わせた。FilterEditForm.tsx 38・166 から 173 行、usePropertyFieldsQuery.ts 25 から 27 行、usePropertyValuesQuery.ts 39 から 41・54 行、2 つの route.ts、2 つの問い合わせの SQL)。(2) use_retention_query に、共有画面の設定で allowFilter が false のときは URL の絞り込みを送らないルールがある (useFilterParameters.ts 13・19・35 から 38 行)。確かめた範囲: 結果のファイルを最初から最後まで読み、フレームごとに source のコードを開いた。この画面だけのフレーム (page、retention_page、website_controls、website_date_filter、export_button、retention、use_retention_query、api_retention、q_get_retention と 2 つの external) は、根拠の行と、when・io の列・ルールを 1 つずつ確かめた。WebsiteControls の下の、写した木 (値の候補、セグメント、セッションのプロパティ、絞り込みの帯、セグメントの保存) は、コードの route.ts と問い合わせの関数を開いて、呼び出しの条件・io の列・確認を確かめた。全フレームの根拠の行が、対象のファイルの範囲に入っていることを機械的に確かめた。空の行は getRetention.ts 69 行 (q_get_retention の summary の根拠) だけで、前後の 67・68 行が「user_activities に絞り込みを足さない」ことを支えているので、指摘にしていない。router.push は FilterBar.tsx と WebsiteFilterButton.tsx でどれも同じ画面のクエリを書き換えるだけで、ほかの入口へのつながり (links) は無い。綴り (settings の名前、確認の値) は analysis-conventions.md とほかの入口にそろっている。指摘にしなかったが伝えること: (a) 管理者の確認 (user.isAdmin) を、canViewWebsite と canUpdateWebsite の ownership の note にだけ書いていて、role の確認を別に立てていない。写し元の journeys と、attribution・performance・utm も同じ書き方。goals・sessions・revenue は role の確認を別に立てているので、入口の間で書き方が分かれている (どちらにそろえるかは、analysis-conventions.md で決めるとよい)。(b) 月の初日と末日は、RetentionPage の useDateRange() (タイムゾーンを渡さない) から、ブラウザの時刻で求める。一方、getRetention はコホートの日を、利用者が設定したタイムゾーンで日に直す。利用者のタイムゾーンがブラウザと違うと、月の境目の日がずれることがある。(c) getQueryFilters は URL の excludeBounce を絞り込みに入れるが、getRetention は excludeBounceQuery を使わないので、この画面の集計には効かない。(d) setWebsiteDate (resetAt、CLOUD_MODE の 6 か月の制限) で開始日が後ろにずれると、集計する期間は月の途中から始まる (q_get_query_filters の rules に書かれている)。(e) values と session-data と event-data の受け口は、渡すセクションに retention を含まないので、retention だけを許す共有トークンでは、絞り込みの候補が 401 になる。この入口はログインした画面なので、影響は小さい。(f) WebsiteDateFilter と ExportButton は、この画面では描かれないので unknown + not_analyzed で閉じている。note に、どこまで読んだかと止めた理由があり、analysis-conventions.md が辿り切ると決めているのは WebsiteFilterButton とその中の部品なので、指摘にしていない。"
