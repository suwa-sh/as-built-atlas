notes: "共通の段の決まりはどれも満たしている: checkAuth の CLOUD_MODE の settings と API キーの枝の rules、canViewWebsite / canDeleteWebsite / canUpdateWebsite の ownership と role (user.isAdmin) の 2 件、API_URL と BASE_PATH を入口から辿って最初に API を呼ぶ use_website_session に 1 回だけ、target は作業定義と同じ。WebsiteControls は sessions_page で止めて links に embed (part_p.shared_a.WebsiteControls、SessionsPage.tsx:25) を書いている。書き直しの段 (_rw) は、読み書きを持つ最初の段で止まり、確認・設定・ルールを繰り返していない。固定の値で閉じた録画の保存の POST (isSaved: false / true) は、2 つの受け口の summary の note と先頭の notes に書いてあり、ReplayPlayback.tsx:60 と ReplaySaveForm.tsx:31 で確かめた。指摘にしなかったこと: getQueryFilters の excludeBounce (request.ts:172) を rules に書いていないが、この画面は WebsiteControls に allowBounceFilter を渡さないので、とくに足さなくてよい。q_get_entity の summary の「最初に見つかったもの」は、実際は website / link / pixel / board の順の優先 (entity.ts:12)。analyzer.tests が無いので、tests の漏れは見ていない (SessionProfile.test.tsx がある)。"
