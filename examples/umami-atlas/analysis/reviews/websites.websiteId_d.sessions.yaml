notes: "指摘にしなかったこと。(1) 機械チェック (validate result) は OK、プロファイルも作業定義の profile.dir から読めている。全フレームの根拠の行 (file:line) が実在し、空行でないことを機械的に確かめた。(2) 画面を包む枠の処理が無いことは、プロファイルの決まりどおり。(3) 画面固有の部分 (SessionsPage の順 :25 / :26 / :38 / :41、SessionsDataTable → GET sessions → getWebsiteSessions の表と列と ClickHouse の 2 つの表の切り替え、SessionProperties の usePropertyFieldsQuery と useSessionDataPropertiesQuery、PropertyFilterButton の小窓、型ごとのグラフの出し分け、SessionModal → SessionProfile と getWebsiteSession) は、コードと突き合わせて合っていることを確かめた。(4) 同じ処理の置き場 (入口から深さ優先で最初に着いた呼び出し元の下) と、書き直したフレーム (_rw) が読み書きを持つ最初の段 (checkAuth の auth:*) で止まり、確認・設定・ルールを繰り返していないことを確かめた。getSessionDataProperties を propertyName 付きでも同じ処理として扱ったのは、読む表が同じなので決まりに合う。(5) 設定の名前 (API_URL、BASE_PATH、CLICKHOUSE_URL、CLOUD_MODE、DATABASE_REPLICA_URL、REDIS_URL) と確認の値 (user.isAdmin、PERMISSIONS.websiteUpdate / websiteDelete、canViewWebsite などの関数の名前) は、分析リポジトリの決まりの表どおりで、events の結果と同じ綴り。events のレビューで直した canUpdateWebsite / canViewWebsite の status も、この結果では fact になっている。(6) この画面には Favicon が無いので、FAVICON_URL が無くてよい。SessionsMetricsBar を描かないこと、SessionsTable の既定の行き先を使わないこと (links が無いこと) も、コードと合う。(7) フレーム数が 222 と多いため、events の結果から写した共通の木 (checkAuth、canViewWebsite、getQueryFilters、FilterEditForm の下の event-data の木、SessionModal の下の録画の木) の列の一つ一つは、events のレビューで確かめた範囲を信じ、ここでは件数と表の名前の突き合わせにとどめた。"
