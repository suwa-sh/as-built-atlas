notes: "次は指摘にしなかった。(1) canDeleteWebsite の guards は、この GET では止めずに canDelete を返すだけだが、ほかの入口の結果 (sessions/[sessionId] の小窓、replays/[replayId]、events) も同じ綴り・同じ置き方で書いており、note にも止めないことが書いてあるので、そろっている。(2) checkAuth の CLOUD_MODE は、この入口では通らない API キーの枝にだけ効くが、replays/[replayId] の結果も同じ effect で書いており、そろっている。(3) restoreReplayEventFragments と getReplayViewport (src/lib/replay.ts) は import を持たない純粋な関数で、データに届かないので、フレームが無いのは漏れではない。(4) 書き直したフレーム (_rw1 / _rw2 / _rw3) は、入口から辿る順と終端の決まりに合っており、確認・設定・ルールを繰り返していない。(5) 根拠の file:line は、すべて対象のファイルで確かめ、主張を支えていた。q_can_delete_website の summary の根拠 route.ts 78 行は DELETE の受け口の行だが、「セッションを消してよいかの確認に使う」ことの根拠として読めるので、指摘にしなかった"
