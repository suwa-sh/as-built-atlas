notes: "117 フレームすべての source・call・summary・parameters・io (fields を含む)・links・guards・settings・rules の根拠を、対象のファイルと prisma/schema.prisma で確かめた。根拠の行のずれ、fact と interpretation の取り違え、辿り漏れ、権限の確認と書き込む列の書き漏れは見つからなかった。指摘にしなかったこと: (1) 結果の notes の (6) は、GET /api/config を「ほかの入口の結果でもフレームにしていない」と書くが、websites.websiteId_d の結果にはフレームがある (layout_l.main_g、links.linkId_d.edit、admin.websites.websiteId_d は、フレームにしていない)。この受け口は環境変数を返すだけでデータに届かないので、フレームにしない扱いそのものは妥当。(2) API の URL の前に付く BASE_PATH は、admin.users / admin.teams などの結果では API を呼ぶフックの settings に書いてあり、この結果と layout_l.main_g は書いていない。入口の間で扱いが分かれているので、どちらにそろえるかは人が決めるとよい。(3) checkAuth の API キーの経路 (checkApiKeyAuth → getApiKeyByHash) は辿っていないが、ほかの入口の結果も同じ扱い (settings の CLOUD_MODE と note だけ) なので、漏れに数えていない。(4) website.ts:334 の share.findMany と :304 の share.findFirst は、自分の external のフレームを持たず、ext_prisma_paged_website / ext_prisma_get_website の名前にまとめてある。layout_l.main_g の結果と同じ書き方なので、指摘にしていない。(5) board_shares_table は、BoardSharesTable.tsx と SharedSharesTable.tsx の 2 つのファイルを 1 つのフレームにまとめている (links の根拠は後者)。(6) テストとの対応は、analyzer.tests が無いので見ていない。枠 ((main) の layout) の処理を辿っていないことは、決まりのとおりなので漏れに数えていない。"
