notes: "機械チェックは OK (プロファイルは作業定義の profile.dir から読めた)。指摘にしなかった点: (1) UTMPage (utm_page) で WebsiteControls を辿らずに止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact、根拠 UTMPage.tsx:3 と :14) を書いているのは、analysis-conventions.md の「共有の部品」と context.md の決まりどおり。渡す値 (websiteId だけ。allowFilter / allowDateFilter は既定の true、allowBounceFilter / allowDownload / allowCompare は既定の false) も WebsiteControls.tsx:12-17 と合い、summary に書いてある。(2) 共通の段 (checkAuth・getUser・canViewWebsiteSection・canViewWebsite・getEntity・getTeamUser・getQueryFilters・fetchWebsite・fetchAccount・getWebsiteSegment と、その下の external) は、websites.websiteId_d.attribution の同じ段と、層・種類・guards・settings・rules・io の綴りが一致した。checkAuth の CLOUD_MODE と API キーの枝の 1 行、canViewWebsite の role (user.isAdmin) と ownership (canViewWebsite) の 2 件、API_URL / BASE_PATH を最初に API を呼ぶ use_utm_metrics に 1 回だけ書くことも、決まりのとおり。(3) WebsiteControls を外したので、木の中で最初に API を呼ぶのは useUTMMetricsQuery (UTM.tsx:31) になる。useDateRange はブラウザの保存と URL だけを読み、API を呼ばない。(4) getQueryFilters は URL の excludeBounce を絞り込みに足す (request.ts:172) が、getUTM は parseFilters の excludeBounceQuery を SQL に使わない (getUTM.ts:30・63) ので、この入口のデータには効かない。書いていないのは漏れではない。(5) event_data の読み取りは、この画面からは届かないように見える (useFilterParameters.ts:14・25) が、決まり (省かずに書き、理由を note に書く) のとおりに残してあり、note もある。(6) 受け口の validation の rule は、timezone と unit の検査 (analytics-schema.ts:20・21) には触れていないが、書いてある内容は正しいので指摘にしていない。"
