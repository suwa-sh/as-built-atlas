notes: "確かめた範囲: この画面に固有のフレーム (page、utm_page、utm、use_utm_metrics、api_utm_metrics、q_get_utm、ext_prisma_utm、ext_clickhouse_utm) は、根拠の行を対象のコードで開いて確かめ、主張を支えていた (page.tsx、UTMPage.tsx、UTM.tsx、useUTMMetricsQuery.ts、useAnalyticsQuery.ts、analytics-query.ts、utm/metrics/route.ts、analytics-schema.ts 18・19・41・96・97 行、getUTM.ts、db.ts、prisma.ts の parseFilters・getCohortQuery・プロパティの絞り込み・rawQuery と DATABASE_REPLICA_URL、clickhouse.ts の parseFilters・getCohortQuery・プロパティの絞り込み・query、constants.ts 96・293 行、schema.prisma と ClickHouse の schema.sql の表の行)。WebsiteControls の下の木 (website_controls から ext_prisma_segment_create まで) は、websites.websiteId_d.attribution の結果とフレームごとに機械的に突き合わせ、呼び出し元の行と、この画面のほかの受け口の一覧 (q_parse_request、q_can_view_website_section、q_get_query_filters の summary) だけが違い、ほかは同じであることを確かめた。attribution のレビューの指摘 (API_URL を use_values にだけ書く、BASE_PATH、DATABASE_REPLICA_URL、API キーの枝の rules、referrer の joinSessionQuery、入口の summary の website:* のキャッシュ) は、この結果でも直った形になっている。この木の中では、WebsiteControls の条件と、values の受け口が canViewWebsiteSection に渡すセクション (utm を含む) を開いて確かめた。share.ts、website.ts、entity.ts、load.ts などの行は、すべては開いていない。指摘にしなかったが伝えること: (1) q_get_utm の summary の「URL の絞り込みに referrer・セッションの列・cohort・プロパティがあれば、session / session_data / event_data も読む」は PostgreSQL 用の説明で、ClickHouse 用は session の表を結ばない (cohort も website_event から作る。clickhouse.ts 194〜201 行)。io は ClickHouse の session を書いておらず、こちらは正しい。(2) 表の割合 (UTM.tsx 59 行。読んだ 50 件までの合計に対する割合) は rules に書いていない (結果の notes (6) のとおり)。50 件を超える値があると、割合は全体に対するものではない。(3) analyzer.tests が無いので、tests の漏れは見ていない。"
