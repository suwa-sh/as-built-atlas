notes: "(1) 根拠の行は、入口の page から WebsiteSettingsPage、5 つの区画、各フックと受け口、権限の関数、query の関数、schema.prisma の列まで、ほぼ全部を開いて確かめた。主張を支えていない根拠は見つからなかった。(2) call の when (always / conditional) と条件、_rw フレームの書き直しの範囲 (読み書きを持つ最初の段まで、確認・設定・ルールを繰り返さない) は、analysis-conventions.md と context.md の決まりに合っている。(3) 指摘にしなかったが、伝えておくこと: api_shares_get の parameters の note に「search はスキーマの検査で落ちるので届かない」とあるが、zod の z.object は知らないキーを捨てるだけで、検査そのものは通る。届かないという結論は正しいので、言い回しだけの問題。(4) 共有トークンの確認の綴り (canViewSharedWebsite / shareTokenIncludesWebsite / canViewWebsite の中の比較) は入口ごとに揺れている (console.websiteId_d の notes (11) も同じことを書いている)。analysis-conventions.md の「名前と値の綴り」に、kind other の書き方を足して決めるのがよい。(5) checkAuth の CLOUD_MODE (API キーの経路を辿っていないのに設定だけ書く) は、admin.websites.websiteId_d の結果の notes (13) で直さない判断が書かれていて、ほかの入口とそろっているので、指摘にしなかった。"
