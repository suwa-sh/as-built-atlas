notes: "指摘にしなかったこと。(1) 入口のフレームの rules の calculation (変化 = いまの値 − 比較の期間の値) と、q_parse_request の validation は、コードにほぼそのまま書いてあるので fact でもよいが、5 つの値をまとめた要約として interpretation も許容した。(2) excludeBounce は URL から送られ getQueryFilters が絞り込みに足すが、getRevenueStats は excludeBounceQuery を使わないので、売上の集計には効かない (結果の記述と矛盾はしない)。(3) website_event の絞り込みの列 (url_path など) が fields に無いのは、URL で実行時に決まる列で、売上の画面と WebsiteMetricsBar の結果と同じ扱いなので指摘にしなかった。(4) 根拠の行、テーブル名 (@@map と ClickHouse の CREATE TABLE)、設定の綴り、canViewWebsiteSection の guard の kind (other) は、ほかの入口の結果とそろっていることを確かめた。"
