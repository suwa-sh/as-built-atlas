notes: "機械チェックは OK (プロファイルも自動で読めた)。全フレームの source と、call・summary・parameters・io・links・guards・settings・rules の根拠の行を対象のコードで開いて確かめ、上の 3 件のほかは主張と合っていた (深さ優先の置き場、終端の書き直し 2 か所、列の名前と schema.prisma の対応、ClickHouse の表の列も確認した)。指摘にしなかったこと: (1) useConfig → GET /api/config をフレームにしていないのは、ほかの入口の結果 (layout_l.main_g、pixels.pixelId_d.edit など) と同じ扱いで、受け口は skipAuth で環境変数を返すだけ (config/route.ts:8、:14) なので、漏れに数えなかった。(2) canViewTeam の role の確認は、ほかの入口の結果 (settings.teams.teamId_d、layout_l.main_g) にも無い。この入口だけ直すと入口の間で綴りがずれるので、そろえ方は人が決めてほしい。(3) Redis の auth:* の fields は、この結果を含む多くの入口が「*」で、admin.websites.websiteId_d だけが userId / pwd と書いている (auth.ts:104、:108 で値の項目は読める)。どちらにそろえるかは未決。(4) POST /api/pixels の call は、URL が pixelId の三項演算子 (PixelEditForm.tsx:35) だが、この入口では pixelId を渡さず行き先が 1 つに決まるので、fact のままで妥当とした。(5) checkAuth の設定 CLOUD_MODE は、この画面のブラウザがログイントークンを送る限り結果を変えないが、ほかの入口と同じ書き方なので指摘にしていない。(6) テストとの対応は、analyzer.tests が無いので見ていない。"
