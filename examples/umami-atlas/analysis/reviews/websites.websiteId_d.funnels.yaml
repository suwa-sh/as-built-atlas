notes: "analysis-conventions.md の「共有の部品」と「どの入口にも出る共通の段」に照らして確かめ、どれも合っていた: (1) funnels_page で止め、links に embed (target WebsiteControls、entry_id part_p.shared_a.WebsiteControls、status fact、根拠 FunnelsPage.tsx 3・21 行) があり、WebsiteControls の中 (WebsiteFilterButton・WebsiteDateFilter・FilterBar) の段は無い。渡す値 (websiteId だけ。allowFilter / allowDateFilter は既定の true、allowBounceFilter / allowDownload / allowCompare は既定の false、allowMonthFilter は undefined) は funnels_page の summary に書いてあり、WebsiteControls.tsx 10〜17 行と合う。(2) checkAuth に CLOUD_MODE (api-key.ts 41 行の isApiKeyEnabled) と API キーの枝の rules があり、getUser も書いてある。(3) canViewWebsite・canUpdateWebsite・canDeleteWebsite・canViewReport・canUpdateReport・canDeleteReport は、ownership と別に role (user.isAdmin) を 1 件ずつ持つ。canViewWebsiteSection は kind other で、ほかの入口と同じ。(4) API_URL と BASE_PATH は、最初に API を呼ぶ use_funnels_query (FunnelsPage.tsx 12 行) の 1 か所だけ。(5) target は作業定義と同じ。getQueryFilters を event-data/properties の下と stats の下に分け、segment / cohort の分かれ道 (request.ts 132〜170 行) を stats の下にだけ置いた扱いは、StepRow が startAt・endAt・event だけを送り (FunnelEditForm.tsx 52〜56 行)、useAnalyticsQuery が useFilterParameters の segment / cohort を付ける (useFilterParameters.ts 35・36 行) ことと合う。values の受け口の SEGMENT_TYPES の分かれ道を辿らない扱いも、fieldsParam (schema.ts 127 行) が segment と cohort を含まないので正しい。"
