notes: "根拠の行は、対象のコードで 1 件ずつ開いて確かめた。上の 6 件のほかは、主張を支えていた。指摘にしなかったが伝えること: (1) website_filter_button と segment_filter_fields は unknown + not_analyzed で、note に読んだ範囲と止めた理由があるので指摘にしていない。ただし、この 2 つの先には、この画面から届く読み取りがある (絞り込みのダイアログの値の候補とセグメントの一覧、セグメントのフォームが開いた時点で呼ぶ GET session-data/properties)。この入口の結果には、その読み取り (segment の一覧、session_data など) が現れない。context.md の「フレームにする」の基準と終端の決まりを、打ち切りの禁止と読むかどうかは、人が決めてほしい。(2) checkAuth の API キーの経路 (auth.ts 75 行の checkApiKeyAuth → getApiKeyByHash / updateApiKeyLastUsed) はフレームが無い。画面のトークンは getClientAuthToken のログインのトークンで、umami_ で始まらないので届かない、という結果の読みは、コード (useApi.ts 28 行、api-key.ts 33 行) と矛盾しないので、辿り漏れにはしていない。(3) segment_filter_fields の source (PropertyFilters.tsx 53 行) は、関数の定義の行ではなく、中のフックの呼び出しの行。FieldFilters と PropertyFilters の 2 つのファイルを 1 つのフレームにまとめている。(4) api_values も、期間の検証 (withDateRange) を rules に書いていない (type の検証だけ)。(5) もう一度書いたフレーム (…_rw_…) は、ライブラリのフレームまでではなく、読み書きを持つフレームで止めている。結果の notes に書いてあるとおりで、機械チェックの終端の決まりは満たしている。(6) lookup_field の call は always だが、段を全部消すと描かれない (フォームは段 1 つから始まるので、指摘にはしていない)。"
