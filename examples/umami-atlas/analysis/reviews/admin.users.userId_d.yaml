notes: "(1) 根拠の行は、全フレームの call / summary / parameters / io / links / guards / settings / rules を対象のコードと schema.prisma で開いて確かめ、上の 2 件のほかに食い違いは無かった。辿り漏れも見つからなかった (UserHeader、DataGrid、WebsiteSparkline、TypeConfirmationForm、getQueryFilters、parseShareToken、hashPassword、isTwoFactorConfigured は、データにもライブラリにも届かない)。(2) 指摘にしなかったこと: POST /api/users/[userId] の、役割とユーザー名を変えられるのは管理者だけという確認 (route.ts:61 と :65 の auth.user.isAdmin) は、rules の decision にだけ書いてあり、guards (kind: role、user.isAdmin) には無い。要求を断らず、送られた値を無視するだけの確認なので、ルールとして書くのも筋が通る。guards にも書くかどうかは、入口をまたいで決めること。(3) checkAuth の API キーの枝を辿っていないことは、ほかの入口の結果と同じ扱いなので、指摘にしていない。(4) 入口の summary の「どの API も最初にログインの確認を行う」は、/api/admin の 3 つの受け口では CLOUD_MODE の確認が先 (2fa/route.ts:10、:32、:61) で、厳密には順が違う。同じ summary の末尾に CLOUD_MODE で 404 を返すことが書いてあるので、指摘にしていない。(5) GET /api/users/[userId]/websites の parameters の 1 件目は、name に 5 つの名前 (page / pageSize / search / orderBy / sortDescending) をまとめて書いている。ほかの入口の結果 (boards.boardId_d.edit) も同じ行を根拠にまとめているので、指摘にしていない"
