notes: "(1) サイトの概要 (websites.websiteId_d) と同じ部品・受け口・問い合わせを通る段は、同じ対象のコミットで書かれてレビュー済みの、その入口の結果の段を出発点にした。この画面で違うところ (どの部品を描くか、渡す type、呼び出し元と根拠の行、同じ処理の置き場) は、対象のコードを読んで書き直した。問い合わせの段 (SQL の列) のうち getPageviewMetrics は、この画面の表が渡す type (referrer) に当たらない列を外した。拡大表示の問い合わせは、type が URL の view から来るので、列を外していない。(2) 同じ処理の置き場は、プロファイルの決まり (入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書く) で決めた。getLink は page (page.tsx:7) の下。parseRequest → checkAuth と getTeamUser は、最初に着く GET /api/links/[linkId] (LinkProvider → useLinkQuery) の下。useConfig → GET /api/config は LinkHeader (useSlug) の下。canViewWebsiteSection → canViewWebsite → getEntity → getWebsite / getPixel / getBoard と、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は GET values の下。canViewSharedWebsite は GET daterange の下、canViewSharedWebsiteFilters は GET segments/[segmentId] の下、canUpdateWebsite は POST segments の下。PropertyFilters は SegmentEditForm の下。(3) 呼び先がすべて他の呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、決まりどおり、いちばん早い呼び出しを I/O を持つ段まで書き直した (id の末尾が _rw<数字>)。canViewSharedWebsite / canViewSharedWebsiteFilters / canUpdateWebsite の下の getWebsite まで、WorldMap の下の parseRequest → checkAuth まで。書き直した段には、権限の確認・設定・ルールを繰り返していない。external の段までは書いていない。(4) この画面では動かないと読んで、辿らなかったもの。グラフの注釈 (WebsiteChart.tsx:38 の enabled。この画面は showAnnotations を渡さない)。フィルターの小窓のセグメント・コホート・プロパティのタブ (FilterEditForm.tsx:37。パスに /links を含む)。ExportButton と MonthFilter (LinkControls.tsx:31 / :32。allowDownload / allowMonthFilter を渡さない)。GET metrics の getEventMetrics (表が event を渡さない)。GET values の getWebsiteSegments の枝 (列に segment / cohort が無い)。checkAuth の API キーの経路 (画面のフックはログインのトークンを付ける)。LinkShareForm と LinkEditForm は、この画面からは描かれない。(5) 迷った点と選んだ扱い。(a) サイト用の API に link の id を渡すので、website を id で探す読み取り (fetchWebsite、getEntity の getWebsite、canUpdateWebsite の getWebsite) は、実際には行が当たらないと読める。読み取りそのものは行われるので、I/O は書いた。canUpdateWebsite が link を探さないので、管理者でなければセグメントの保存は通らないと読めるが、経路はコードにあるので conditional で書き、その読みは段の summary に書いた。(b) URL の segment / cohort は、この画面の小窓からは選べないが、URL に付いていれば FilterBar と getQueryFilters が読むので、conditional で書いた。(c) 短縮 URL を新しいタブで開くリンク (LinkHeader.tsx:28) は、入口の一覧に無い行き先 (LINKS_URL のホスト。既定は同じオリジンの /q/<slug>) なので、links に書かず、LinkHeader の summary と settings (LINKS_URL) に書いた。(d) Tabs / TabPanel の中の MetricsTable を、タブを選ぶまで描くかどうかは UI ライブラリの動きで、リポジトリからは読めない。コードの条件だけを見て always にし、note に書いた。(e) guards の値は、分析リポジトリの決まりにそろえた: 管理者は user.isAdmin、持ち主・所属は確認する関数の名前、権限は定数の名前。共有トークンだけの確認 (kind: other) も、確認する関数の名前。ログイン済みの確認は checkAuth の 1 か所だけ (canUpdateWebsite の「利用者がいなければ通さない」は、role の note と summary に書いた)。条件の説明は note に書いた。(f) 設定は、読んで使っている段に書いた: API_URL は API を呼ぶフックごと、CLICKHOUSE_URL は runQuery を呼ぶ問い合わせの関数ごと、DATABASE_REPLICA_URL は生の SQL を実行する external ごと、REDIS_URL は checkAuth と fetchWebsite、CLOUD_MODE は checkAuth と getQueryFilters、PRIVATE_MODE と FAVICON_URL は Favicon、LINKS_URL は LinkHeader。DATABASE_URL は、決まりどおり書いていない。(6) レビューへの対応。1 回目 (high 1 件、medium 1 件、low 7 件) のうち、8 件を直した: useConfig から API_URL を外した (/config は API_URL の対象外)。拡大表示の getEventExpandedMetrics を conditional で足し、拡大表示の問い合わせの列を外すのをやめた (type は URL の view から来る)。共有トークンの確認の綴りを、ほかの入口と同じ関数の名前にし、canViewLink / canViewWebsite の共有トークンの条件を ownership の note にまとめた。入口の概要の「どの API も」を直した。1 回目で直さなかった指摘 (low 1 件): useConfig → GET /api/config → Response.json を段にしていること。ほかの入口は段にしていないが、この画面では LinkHeader が links と settings を持つ段で、その呼び先はこの経路だけなので、段を外すと LinkHeader が終端になり、終端の決まり (external・I/O・unknown のどれか) を満たせない。データに届かない経路の閉じ方 (最後に頼るライブラリを external として 1 つ書く) に従って残した。2 回目 (high 0 件、medium 0 件、low 6 件) は、3 件を直した: フィルターのボタン (WebsiteFilterButton) と帯 (FilterBar) の呼び出しを always にし (この入口では showFilter がいつも真)、入口の概要の Redis の書き方を、link の id では website が当たらない読みに合わせた。直さなかった指摘 (low 3 件) と理由。(i) getValues の、type で決まる列を fields に書いていない: 出発点にしたサイトの概要の結果と同じ書き方 (取り出す列は FILTER_COLUMNS[type] で実行時に決まると note に書く) のままにした。列を並べるなら、サイトの概要の結果と一緒にそろえる方がよい。(ii) グラフの注釈 (useWebsiteAnnotationsQuery → GET annotations) を段にしていない: フックは、コードに固定で書かれた引数 (showAnnotations を渡さない) で無効になり、URL や設定や利用者の操作では有効にならないので、条件付きの呼び出しではなく、この入口では動かない呼び出しと読んだ。WebsiteChart の summary に書いた。(iii) getEventMetrics、GET values の getWebsiteSegments、ExportButton、フィルターの小窓の SegmentFilters / PropertyFilters を段にしていない: どれも、この画面の部品が渡す固定の値 (表の type、列の一覧、渡さない引数、パスに /links を含むこと) で届かず、URL からも届かない。サイトの概要の結果と同じ扱いにし、(4) と各段の summary に書いた。URL から届く getEventExpandedMetrics と segment / cohort は、conditional で書いている。"
