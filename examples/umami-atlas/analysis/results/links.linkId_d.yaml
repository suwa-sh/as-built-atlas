summary:
  status: "interpretation"
  value: "短縮リンク (link) 1 件の統計の画面。サーバー側の page が URL の linkId で link を直接読み、無いか削除済みなら何も描かない。あれば、ブラウザ側の LinkPage が、サイトの概要と同じ部品と API (/api/websites/<id>/...) を、websiteId に link の id を渡して使い回す。開いたときに読むもの: link (GET /api/links/[linkId])、アプリの設定 (config。まだ読んでいなければ)、データのある期間 (daterange)、指標の帯 (stats。比較の期間も集計する)、ページビューとセッションの時系列 (pageviews)、8 つの表と世界地図 (metrics)。URL に segment か cohort があれば、その定義 (segments/[segmentId]) も読む。利用者の操作で読むもの: フィルターの小窓の候補 (values)、表の拡大表示 (URL に view があるとき。metrics/expanded。view が event なら、カスタムイベントの集計)、セグメントの保存のフォームの候補 (session-data/properties、session-data/values)。書き込みは、いまの絞り込みをセグメントとして保存する操作 (segment の作成) だけ。サイトの概要と違い、グラフの注釈、曜日と時間帯の表、ページの表 (path / entry / exit) は無く、フィルターの小窓にセグメント・コホート・プロパティのタブも無い。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) で、URL の絞り込みに応じて session / event_data / session_data も読む。/api/config を除くどの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、見る権限の確認で link / website / share / pixel / board / team_user を読む。期間を決めるときにサイトの情報を website から読む (REDIS_URL があれば、先に Redis の website:* を読む)。渡す id が link の id なので、website の行は当たらないと読め、その先の website:* への書き込みと、CLOUD_MODE での account:* の読み取りは、コードにはあるが、この入口では起きないと読める。リファラーの表の行には、ドメインのアイコンを、ブラウザから他社のサービス (既定は icons.duckduckgo.com。FAVICON_URL で変わり、PRIVATE_MODE では出さない) へ取りに行って出す。ほかの画面への遷移は、編集の画面 (/links/[linkId]/edit) へのリンク。短縮 URL そのものを新しいタブで開くリンクもある (LINKS_URL でホストが変わる)"
