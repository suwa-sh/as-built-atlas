summary:
  status: interpretation
  value: "短縮リンク (link) の一覧の画面。サーバー側の page は LinksPage を描くだけで、本体はブラウザ側で動く。個人の URL (/links) では GET /api/links で自分のリンク (link。削除済みを除く) を、チームの URL (/teams/<teamId>/links) では GET /api/teams/[teamId]/links でそのチームのリンクを、検索 (name / url / slug)・並べ替え (name / slug / url / createdAt)・ページ送りを付けて読み、名前・短縮 URL・転送先の URL・直近 7 日の訪問者数の小さなグラフ・作成日時の表にする。グラフは、一覧にリンクがあれば GET /api/links/charts で読む (website_event。CLICKHOUSE_URL があれば ClickHouse の website_event_stats_hourly)。追加・編集・削除の操作を出すかどうかは画面が決める: 個人の URL では、ログイン中のユーザー (useLoginQuery。ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む) の役割が view-only でないとき。チームの URL では、GET /api/teams/[teamId]/users で読んだメンバー (team_user と user) に自分がいて、役割が team-view-only でないとき。追加ボタンは小窓を開き、名前・転送先の URL・slug (初期値は 9 文字のランダムな文字。CLOUD_MODE では隠し項目) を POST /api/links で送って link を作る (website:create の権限が要る。チームの URL では、そのチームでの権限も要る)。行の名前から /links/[linkId] へ、編集ボタンから /links/[linkId]/edit へ移る。削除ボタンは確認の小窓を開き、DELETE /api/links/[linkId] で link の行を消す (管理者・持ち主・チームで website:delete を持つメンバー)。各 API は、ログイントークンから user を読んで認証する (Redis のセッションを使うときは auth:* も読む)。表示する短縮 URL の前半は LINKS_URL で替わる"
