summary:
  status: interpretation
  value: ボードの一覧の画面。URL に /teams/<id> があればチームのボード (GET /api/teams/[teamId]/boards。チームのメンバーか管理者だけ)、無ければ本人のボード (GET /api/boards) を、検索とページ送り・並べ替え付きで board から読んで表にする (種類が dashboard のものは出さない)。行からは、ボードの表示・設計・編集の画面へ移れ、削除のボタンで DELETE /api/boards/[boardId] を呼んで board を消せる (持ち主か、website:delete を持つチームのメンバー。管理者は可)。追加のボタンは小窓を開き、名前・説明・種類・対象 (種類が website / pixel / link のとき) を入れて保存すると、POST /api/boards で board を作り、できたボードの設計の画面へ移る。作る前に、サーバーが、作る権限 (website:create。チームのボードなら、チームでの役割) と、対象のサイト・ピクセル・リンクを本人が見られるか (website / link / pixel / board / team_user を読む) を確かめる。対象の選択欄は、選ばれているもの 1 件 (GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId]) と、選べるものの一覧 (チームのもの、または本人のもの) を読む。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
