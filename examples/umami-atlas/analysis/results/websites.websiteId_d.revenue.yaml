notes: "[分析し直し (skill 0.4.1)] 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (skill 0.4.0、176 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。段は 176 から 122 になった。(a) RevenuePage (revenue_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は RevenuePage.tsx 3 行の import と 15 行の描く行) を書いた。WebsiteControls と、その下の絞り込みのボタン・期間の選択・絞り込みの帯 (と、その下の values / segments / session-data / daterange / segments/[segmentId] の受け口と問い合わせ、segment の作成) の 54 段を外した。渡す値 (websiteId だけ。ほかは部品の既定) と、それで部品が出すもの・出さないものは、revenue_page の summary に書いた。前の結果の WebsiteControls の rules (共有の設定で絞り込みを出さない) は、部品の入口のものなので、ここからは外した。(b) 共通の段の移し先: 前は WebsiteControls の下 (絞り込みのボタン → values の受け口) にあった parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment の 27 段を、入口から深さ優先で次に着く売上の推移の受け口 (api_revenue_chart) の下に移した。その受け口の summary から「経路はフレーム … と同じ」の文を外し、移した段の summary・note・根拠を、この受け口に合わせて直した (canViewWebsiteSection のセクションは revenue、呼ぶ行は chart/route.ts 17・25・30 行)。canUpdateWebsite (と、その下の getWebsite の書き直し) は、前はセグメントの作成の受け口の下にあったので、次に着く録画の保存の受け口 (api_replay_saved_post、route.ts 49 行) の下に移した。(c) 共通の段を、決まりに合わせた: API_URL と BASE_PATH は、この入口で最初に API を呼ぶ useRevenueChartQuery (use_revenue_chart) に 1 回だけ書いた (前は use_values)。canViewWebsite の guards を、管理者の確認 (role、user.isAdmin)、共有トークンで許す枝 (other)、持ち主の確認 (ownership、canViewWebsite) に分けた (websites.websiteId_d.retention にそろえた。前は ownership の note に書くだけだった)。canUpdateWebsite にも、管理者の確認 (role、user.isAdmin) を別の 1 件で足した。canDeleteWebsite は、前から分けてある。checkAuth は、前から settings に CLOUD_MODE と REDIS_URL、rules に API キーの枝の 1 行を持ち、getUser も書いてある (変えていない)。canViewWebsiteSection は、ほかの入口と同じく kind: other のまま。target は作業定義と同じ。共有の設定で絞り込みを API に送らないこと (useFilterParameters。段にしていない補助の関数) は、retention にそろえて、最初にそれを呼ぶ useRevenueChartQuery の rules に書いた。(d) 固定の値で閉じている呼び出し (指示書 0.4.1): 録画の保存の受け口は、ReplayPlayback の保存を外すボタンから isSaved: false (ReplayPlayback.tsx:60)、ReplaySaveForm から isSaved: true (ReplaySaveForm.tsx:31) で着く。websites.websiteId_d.events (0.4.1) と同じく、createReplaySaved を ReplaySaveForm の経路 (api_replay_saved_post_rw1) の下に、deleteReplaySaved を ReplayPlayback の経路 (api_replay_saved_post) の下に書き、閉じている枝を、それぞれの受け口の summary の note に書いた。この形にしたので、前に api_replay_saved_post_rw1 の下に置いていた parseRequest → checkAuth の書き直し (2 段) は要らなくなり、外した。SessionReplaysDataTable は、この入口のパスに /share/ が無いので、events にそろえて always にし、理由を note に書いた (前は conditional)。getWebsiteSegment は、URL の segment / cohort がクエリに付くので、閉じておらず、conditional のまま。[前の分析から引き継いだ扱い] (1) RevenueMetricsTable は、出所と場所のタブに 1 つずつ、type を referrer / channel / country / region にして 4 回描かれる。届く受け口と表は同じなので、1 つのフレームにし、4 回描くことは call の note に書いた。初めは referrer と country が選ばれていて、画面を開けば呼ぶので、受け口への call は always にし、channel と region はタブを切り替えたときに呼ぶことを note に書いた。(2) 内訳の表と訪問者の一覧は、推移と合計の両方が読めたときだけ描く (Revenue.tsx:88) ので、conditional にした。(3) 通貨の一覧 (CurrencySelect)、合計の帯 (RevenueMetricsBar)、推移のグラフ (RevenueChart)、SessionsTable は、受け取った値を描くだけで API を呼ばないので、フレームにせず summary に書いた。国・地域の旗は同じサーバーの画像なので、I/O に書いていない。(4) 通貨の既定値は、環境変数 DEFAULT_CURRENCY を next.config.ts が defaultCurrency に写しているので、その行も根拠にして Revenue の settings に書いた。選んだ通貨を localStorage に保存することは、決まりのとおり I/O に書かず summary に書いた。(5) 期間ごとか累計かの切り替え (URL の revenueChart) と、訪問者のアイコンで開く小窓 (URL の session) は、同じ画面のまま URL を書き換えるだけなので、links に書いていない。(6) getRevenueSessions は、PostgreSQL は session を join し、ClickHouse は website_event がセッションの列を持つので join しない。URL の絞り込みの列は実行時に組み立てるので、fields には SQL に固定で書いてある列だけを書いた。(7) プロパティの絞り込み (event_data / session_data) の fields には、data_type を足してある。(8) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[前のレビュー (0.4.0)] 指摘 3 件 (すべて low) は、前の結果で直してある。revenue のセクションだけを許した共有リンクでは、イベントのプロパティの小窓 (event-data/[eventId]) が 401 になる (コードの事実で、分析の誤りではない)。 [レビュー (0.4.1)] 1 回 (high 0、medium 0、low 2)。どちらも直した: (1) 売上の 4 つの問い合わせの event_data の読み取りは、useFilterParameters が /events の画面でだけ epf を付けるので、この画面からは届かないように見える。retention と同じく、interpretation にし、理由を note に書いた。(2) getSessionReplays は、useSessionReplaysQuery が URL の絞り込みを送らないので、絞り込みの部分を通らない。summary を直し、絞り込みの部分の読み取りの note に書いた (1 つの SQL の中の部分なので、消さずに残した)。high が無いので、もう一度のレビューはしていない。"
