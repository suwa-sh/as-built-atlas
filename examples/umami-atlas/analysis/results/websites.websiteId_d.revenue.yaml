summary:
  status: interpretation
  value: "1 つのサイトの売上の画面。利用者が通貨を選ぶ (初めはブラウザに保存した通貨、無ければ DEFAULT_CURRENCY、それも無ければ USD) と、Revenue が GET /api/websites/<id>/revenue/chart (推移) と …/revenue/stats (合計と、比較の期間の合計) を呼び、両方が読めたら、出所 (referrer / channel) と場所 (country / region) の内訳 (…/revenue/metrics。選んだタブの分だけ) と、売上のあった訪問者の一覧 (…/revenue/sessions) を読む。どれも、期間と絞り込みに当たるセッションを website_event から集め、そのセッションの、期間と通貨に当たる売上の行 (PostgreSQL は revenue、ClickHouse は website_revenue) を数える。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。リファラーの行のアイコンは、ブラウザが他社のサービス (既定は icons.duckduckgo.com) へ取りに行く。訪問者のアイコンを押すと、同じ画面でセッションの小窓 (SessionModal) が開き、セッション・活動・プロパティ・録画を読む (イベントのプロパティの小窓、録画の保存・保存の取り消し、セッションの削除も、ここから行える)。どの受け口も parseRequest → checkAuth で認証し (user を読む。Redis が有効なら auth:* も読む)、売上の受け口は canViewWebsiteSection → canViewWebsite で閲覧の権限を確かめる (website / link / pixel / board / team_user を読む)。getQueryFilters は、サイトの情報を読んで期間の開始を直し (Redis が有効なら website:* にキャッシュする)、URL に segment / cohort があれば保存した定義 (segment) を読んで絞り込みに足す。利用者の操作による書き込みは、録画の保存 (session_replay_saved の作成・削除) と、セッションの削除 (session と関連の行の削除) の 2 つ。上部の WebsiteControls は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。この画面は websiteId だけを渡すので、部品は絞り込みのボタン・絞り込みの帯・期間の選択を出す"
