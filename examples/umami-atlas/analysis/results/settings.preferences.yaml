summary:
  status: interpretation
  value: "設定メニューの中の、表示の好み (既定の期間、タイムゾーン、言語、テーマ) を選ぶ画面と、版の表示。好みはブラウザの中 (localStorage の umami.date-range / umami.timezone / umami.locale と、アプリのストア) に保存するだけで、サーバーのデータは書かない。サーバーに届くのは、ログイン中のユーザーを得る useLoginQuery だけで、ストアにユーザーが無いときだけ POST /api/auth/verify を呼んで user と所属の team を読む (認証はログイントークンから user を読み、Redis のセッションを使うときは auth:* も読む)。ユーザーが得られるまでは何も描かない"
  evidence:
    - { file: "src/app/(main)/settings/preferences/page.tsx", line: 5 }
    - { file: "src/app/(main)/settings/preferences/PreferenceSettings.tsx", line: 10 }
    - { file: "src/app/(main)/settings/preferences/PreferenceSettings.tsx", line: 13 }
    - { file: "src/app/(main)/settings/preferences/DateRangeSetting.tsx", line: 13 }
    - { file: src/components/hooks/useTimezone.ts, line: 16 }
    - { file: src/components/hooks/useLocale.ts, line: 33 }
    - { file: src/lib/storage.ts, line: 3 }
    - { file: src/app/api/auth/verify/route.ts, line: 12 }
notes: "[1] 好みの部品 (DateRangeSetting / TimezoneSetting / LanguageSetting / ThemeSetting / VersionSetting) は、データの読み書きに至らないので段にしていない。保存先は localStorage とアプリのストア (src/store/app) で、プロファイルの決まりにより I/O に書かない。ThemeSetting は @umami/react-zen の useTheme を使う。[2] LanguageSetting の useLocale は、まだ読んでいない言語の翻訳の JSON を ${basePath}/intl/messages/<locale>.json から取る (useLocale.ts:23) が、同じサーバーの静的なファイルなので、この分析リポジトリの決まりにより段にも I/O にも書いていない。[3] 版 (CURRENT_VERSION) は next.config が埋める固定の値を出すだけなので、settings に書いていない。DEFAULT_LOCALE はこの版では環境変数ではなく定数 'en-US' (constants.ts:25) なので、settings に書いていない。[4] 画面を包む枠 (settings / main / ルートの layout) の処理は、枠の入口の結果にあるので辿っていない。useLoginQuery は枠でも呼ばれるが、この画面の PreferenceSettings 自身も呼ぶので、画面の側にも書いた。[5] checkAuth の API キーの経路 (auth.ts:74) は、/api/auth の下が API_KEY_BLOCKED_PATHS (api-key.ts:15) に入っていて checkApiKeyAuth が読み書きの前に null を返す (auth.ts:35) ので、辿っていない。拒むことは rules に、経路の切り替えは設定 (CLOUD_MODE) に書いた。[6] DB の接続先の環境変数 (DATABASE_URL / DATABASE_REPLICA_URL) は、どの段にも同じように効くので settings に書いていない。[7] テストとの対応は、作業定義で選ばれていないので分析していない。[8] レビューの指摘は low が 4 件で、すべて直した (checkAuth の共有トークンのヘッダーの確認と、/api/auth で API キーを拒むことを rules に足した。user の列と team_user のリレーションの根拠の行を足した)"
