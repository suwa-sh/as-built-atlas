notes: "プロファイル 0.3.0 で再分析した。0.3.0 の context.md (画面を分析するときは祖先の layout と、そこから描かれる部品を辿らず、入口の summary にも書かない) に合わせて、入口の summary からルートの layout・Providers・翻訳 JSON・DISABLE_UI の記述と、その根拠 (layout.tsx / Providers.tsx / useLocale.ts) を外した。コールスタックと I/O は、同じコミットのソースを読み直して行番号と中身が変わっていないことを確かめ、そのまま残した。レビューの指摘 2 件 (どちらも low。値を支える根拠の行の不足) は直した: 仮トークンの 5 分に route.ts:46、Redis の既定の 3600 秒に redis.ts:7 を足した"
summary:
  status: interpretation
  value: "ユーザー名とパスワードでログインする画面。表示時に POST /api/auth/verify で既存のトークンを確かめ (ストアにユーザーが無いときだけ)、ログイン済みなら / へ転送する。フォーム送信で POST /api/auth/login を呼び、user をユーザー名で読んでパスワードを照合し、two_factor_auth を読んで 2 段階認証が有効なら仮トークンを返して /login/two-factor へ進む。無効なら Redis があれば auth:* キーにセッションを保存してトークンを返し (無ければ署名付きトークンだけ)、所属チームを team / team_user から読んで返す。環境変数 DISABLE_LOGIN か CLOUD_MODE があれば page は何も描かない。ログインのトークンは localStorage、2 段階認証の仮トークンは sessionStorage に保存する (ブラウザ内なので I/O には書かない)"
  evidence:
    - { file: src/app/login/page.tsx, line: 7 }
    - { file: src/app/login/LoginPage.tsx, line: 13 }
    - { file: src/app/login/LoginForm.tsx, line: 24 }
