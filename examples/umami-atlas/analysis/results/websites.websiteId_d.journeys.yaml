summary:
  status: interpretation
  value: 1 つのサイトの訪問者の行動の道筋 (ジャーニー) の画面。利用者が段の数 (2 から 7)、始めの段・終わりの段、表示の種類 (all / views / events) を選ぶと、Journey が GET /api/websites/<id>/journeys を呼び、getJourney が website_event から、訪問ごとのイベントの並び (イベントの名前、空ならページのパス)
    を段の数だけ取り、道筋ごとの訪問数を多い順に 100 件数える。表示の種類が views / events なら、イベントの種類 (event_type) で絞る。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。始めの段・終わりの段の入力欄は、GET …/values で url_path か event_name の値の候補を読む
    (表示の種類が all なら両方)。集計は、段を選ばなくても画面を開いたときに呼ぶ。上部の WebsiteControls は、絞り込みのボタン (列の値・セグメント・セッションのプロパティの候補を読む)、期間の選択 (daterange)、絞り込みの帯 (保存済みの segment の読み取りと、セグメントとして保存する書き込み) を描く。どの受け口も parseRequest → checkAuth
    で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。利用者の操作による書き込みは、セグメントとして保存 (segment の作成) だけ。ほかに、Redis が有効なら、サイトの情報を website:* にキャッシュする
  evidence:
  - file: src/app/(main)/websites/[websiteId]/(reports)/journeys/page.tsx
    line: 7
  - file: src/app/(main)/websites/[websiteId]/(reports)/journeys/JourneysPage.tsx
