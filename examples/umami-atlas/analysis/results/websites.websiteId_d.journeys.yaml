notes: 'プロファイル 0.4.0・skill 0.4.0 で分析した。[木の形] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。JourneysPage の中の順は、useMessages (15 行) → useDateRange (18 行。API を呼ばない) → WebsiteControls (43 行) → WebsiteValueComboBox
  (58 行と 70 行) → FilterButtons (83 行。見た目だけ) → Journey (86 行)。だから、parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount
  / getWebsiteSegment、values の受け口 (useWebsiteValuesQuery) は、WebsiteControls の絞り込みのボタン (WebsiteFilterButton → FilterEditForm → FieldFilters → FilterRecord) の下に書いた。WebsiteControls の下の木は、同じコミットの同じ部品を、同じ引数
  (websiteId だけ) で描く画面 (websites.websiteId_d.attribution) と同じになるので、その木を写し、呼び出し元の行と、この画面のほかの受け口の一覧 (attribution を journeys に) を直した。パスの条件 (/events などで終わらず、/pixels などを含まない) も、この画面で同じに成り立つ。[迷った点と選んだ扱い] (1)
  始めの段と終わりの段の入力欄は、同じ部品 (WebsiteValueComboBox) を 2 つ描くので、フレームは 1 つにし、call の根拠に 2 つの行を書いた。入力欄が呼ぶ useWebsiteValuesQuery は、絞り込みの行 (FilterRecord) が呼ぶものと同じ関数で、type が path / event でも読む表 (website_event) は同じなので、同じ処理として
  1 回だけ書き、入力欄が終端になるので、読み書きを持つ最初の段 (checkAuth) まで書き直した (use_values_rw1 から)。(2) 入力欄の 2 つ目の useWebsiteValuesQuery (additionalType) は、同じ呼び出し元からの同じ関数なので、1 つ目と同じフレーム (use_values_rw1) で表した。この画面では、表示の種類が all (既定)
  のとき additionalType が event になり、実際に API を呼ぶ。(3) 表示の種類による eventType (views は 1、events は 2、all は送らない) は、値を決めている Journey の rules に書き、受け取って条件にする getJourney では io の event_type の note に書いた。(4) Journey は startDate
  / endDate を受け取るが、useJourneyQuery に渡さない。API に送る期間は useAnalyticsQuery の useDateParameters が決める (入力欄の候補は JourneysPage の useDateRange の期間を、集計は useDateParameters がタイムゾーンで直した期間を送るので、利用者がタイムゾーンを設定していると、ずれることがある)。(5)
  集計の問い合わせの select * は CTE の sequences から読むので、website_event の fields に * を書いていない。(6) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。(7) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts
  721 行の query) は、呼び出し元ごとに読む表が違うので、呼び出し元ごとに書いた。(8) 道筋の節の選択・強調 (Journey の画面の中の計算) は表示の計算なので、rules に書いていない。(9) 期間の localStorage など、ブラウザの中の保存は I/O に書いていない。(10) 作業定義に analysis.tests が無いので、テストとの対応 (JourneysPage.test.tsx
  がある) は分析していない。 [レビュー] 指摘は 2 件 (すべて low) で、すべて直した: q_get_segment の call に、values の受け口からは条件が成り立たないように見える理由を note に足し、条件の文を直した。journeys_page の summary の、入力欄のフレームの書き方を、フレームと合うように直した。レビューの notes にあった期間のずれも、この
  notes の (4) に反映した。high が無いので、もう一度のレビューはしていない。'
