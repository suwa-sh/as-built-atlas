notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 RevenueMetricsBar (boardComponentRegistry.tsx:261) が指すコンポーネント BoardRevenueMetricsBar (BoardRevenueMetricsBar.tsx:7)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、currency) と、描く画面の URL のクエリ (期間、compare、絞り込み) を、入口のフレームの parameters に書いた。この項目には componentByEntityType が無いので、対象の種類で替わる部品は無い。(2) 同じ受け口の前処理・権限の確認・絞り込み (parseRequest から getWebsiteSegment まで) は、同じ処理を書いた部品の結果 (part_p.boardComponentRegistry.WebsiteMetricsBar) の綴りと木を、getRevenueStats とその先は、売上の画面の結果 (websites.websiteId_d.revenue) の綴りを出発点にし、受け口に依存する行 (route.ts:19 / :27 / :32 / :39 / :40) と文は、売上の受け口に合わせて書き直した。この入口では、どの処理も api_revenue_stats の下に最初に着くので、書き直し (_rw) のフレームは無い。API_URL と BASE_PATH は、最初に API を呼ぶフレーム (use_revenue_stats) に書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(3) 固定の値で閉じている呼び出しは無い (0 件)。確かめたこと: (a) 受け口が canViewWebsiteSection に固定の値 revenue を渡すが、その値が効くのは、ログインしていない共有トークンの経路で、共有の設定との組み合わせで決まるので、閉じていない (呼び先のフレームも無い)。(b) フックが useFilterParameters に固定の値 includePagination: false を渡すが、送る値 (page / pageSize) を変えるだけで、呼び出しを閉じない。parameters に書いた。(c) getQueryFilters には、受け口がいつも websiteId を渡すので、fetchWebsite は always にした。(4) 迷った点と選んだ扱い。(a) DEFAULT_CURRENCY は、部品を選ぶ画面が登録表の既定 (USD) を部品の設定に入れて保存するので、ふつうは効かない。ただ、保存された設定は部品の入口の外の値で、設定に通貨が無い経路を否定できないので、入口のフレームの settings に書いた (判定する補助の関数 useBoardRevenueCurrency は段にしていない)。(b) RevenueMetricsBar (表示の子) が持つ「比較の期間との差」の計算は、子をフレームにしないので、入口のフレームの rules に書いた (WebsiteMetricsBar の結果と同じ扱い)。(c) useDateRange と useBoardRevenueCurrency がブラウザに保存した期間・通貨 (localStorage) を読むが、サーバーのデータではないので I/O に書かず、parameters に書いた。(d) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。(5) レビューへの対応 (1 回。high 0 件、medium 1 件、low 2 件。すべて直した)。(a) canViewWebsite に、管理者の確認を role の guard (user.isAdmin) として足し、ownership の note から外した。(b) 受け口の呼び出しを conditional (websiteId と通貨があるとき) にした (enabled で止める作りの決まり)。(c) 入口のフレームの「絞り込みのクエリ」で、allowFilter の条件が search 以外のすべてに掛かるように文を直し、根拠に useFilterParameters.ts:19 を足した。"
