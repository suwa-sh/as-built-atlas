  status: interpretation
  value: "ボードに置く「売上の帯」の部品 (登録表の type: RevenueMetricsBar)。部品の設定の通貨 (無ければブラウザに保存した通貨、DEFAULT_CURRENCY、USD の順) と、描く画面の URL の期間・compare・絞り込みで、GET /api/websites/[websiteId]/revenue/stats から売上の合計・平均・ARPU・注文の数・顧客の数を読み、比較の期間との差と一緒に出す。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは revenue) でサイトを見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getRevenueStats で website_event と revenue (ClickHouse では website_revenue) を、いまの期間と比較の期間で 2 回集計する。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。書き込みは無い。ほかの入口へのつながりは無い"
