notes: "[1] 木の置き場: 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。parseRequest → checkAuth → getUser は POST /api/teams (AdminTeamsPage.tsx:17 の作成ボタンが、:20 の一覧より前) の下、getTeamUser は canViewTeam (UserSelect.tsx:15 の useTeamMembersQuery の先) の下。canDeleteTeam は、呼び先 (getTeamUser) がほかの下に書いてあり終端になるので、getTeamUser を読み書きを持つ段までもう一度書いた (id が _rw で終わる。確認・設定・ルールは繰り返していない)。[2] 段にしなかった権限の関数: canCreateTeam / canViewAllTeams / canViewUsers は、データを読まず、段にすると終端の決まりを満たせないので、確認 (guards) は、それを呼ぶ受け口の段に書いた。[3] この画面からは条件が成り立たないように見える呼び出しも、消さずに conditional で書いた。(a) UserSelect の useTeamMembersQuery は teamId を受け取らず (TeamAddForm.tsx:40)、enabled: !!teamId (useTeamMembersQuery.ts:14) が成り立たないので、GET /api/teams/[teamId]/users は呼ばれないように見える。(b) クラウドモードの枝 (POST /api/teams の fetchAccount / getUserOwnedTeamCount / team:* の set、deleteTeam の論理削除) は、管理の枠 (src/app/(main)/admin/layout.tsx:5) がクラウドモードでは何も描かないので、この画面からは届かないように見える。deleteTeam のクラウドモードの枝の読み書きは、別の入口の結果 (settings.teams.teamId_d) では書いていないが、ここでは指示書の「消さずに書く」に従って、note を付けて書いた。[4] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので、この画面からは使わないものとして辿っていない (設定 CLOUD_MODE にだけ書いた)。parseShareToken (auth.ts:88) は、ヘッダーのトークンを解くだけでデータを読まない。[5] 管理者かどうかの画面側の確認 (AdminLayout) は、枠の入口 (layout_l.main_g.admin) の結果にあり、ここでは辿っていない。[6] 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると、その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL は呼び出すフックの settings に書いた。[7] DataGrid の検索とページ送りは、同じ画面の URL のクエリを書き換えるだけ (router.push(updateParams(...)))。ほかの入口へのつながりではないので、links に書いていない。表示の切り替えの localStorage も I/O に書いていない。[8] 一覧の行の遷移は、Link (AdminTeamsTable.tsx:33) とメニューの編集 (:69。`/admin/teams/${id}`、id は row.id) が同じ行き先なので、links は 1 件にまとめ、target は先に出てくる :33 の書き方にした。[9] 確認の値は、決まりの綴りにした (役割は user.isAdmin、権限は定数の名前だけ、所属は関数の名前だけ)。[10] テストとの対応は、作業定義で選ばれていないので分析していない。[11] レビューの指摘は low が 1 件 (API を呼ぶ 5 つのフックの settings に BASE_PATH が無い) で、直した。レビューの notes にある、checkAuth の API キーの経路を辿るかどうかは、ほかの入口の結果と同じ扱い ([4]) のままにした"
