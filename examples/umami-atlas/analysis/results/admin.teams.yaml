summary:
  status: interpretation
  value: "管理者が、すべてのチームを一覧する画面。GET /api/admin/teams で team を、メンバー (team_user と、その user の id / username) と、サイトとメンバーの件数 (website / team_user) を付けて読み、名前・メンバー数・サイト数・オーナー・作成日時の表にする。検索とページ送りと並べ替え (name / createdAt) は、URL のクエリで行う。受け口は、管理者 (user.isAdmin) でなければ 401 を返す。行の名前とメニューの編集から /admin/teams/[teamId] へ、オーナーの名前から /admin/users/[userId] へ移る。行のメニューの削除は、DELETE と打ち込ませる小窓を開き、DELETE /api/teams/[teamId] でチームと、その team_user / share / link / pixel / board を消す (Redis が有効なら link:* / pixel:* のキャッシュも消す)。見出しの作成ボタンは小窓を開き、名前とオーナー (GET /api/admin/users で読む user の一覧から選ぶ) を入れて POST /api/teams を呼び、team と、オーナーの team_user を作る。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。クラウドモード (CLOUD_MODE) だけで動く処理 (契約の読み取り account:*、持てるチームの数の確認、team:* のキャッシュの書き込み、チームの論理削除) は、管理の枠がクラウドモードでは何も描かないので、この画面からは届かないように見える (経路はコードにあるので書いている)"
  evidence:
