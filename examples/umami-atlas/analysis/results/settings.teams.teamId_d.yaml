summary:
  status: interpretation
  value: "設定メニューの中で 1 つのチームを見て編集する画面。URL の teamId で GET /api/teams/[teamId] を呼び、team とメンバー (team_user) を読んでチーム名とチーム ID を出す (招待コードは編集できる人にだけ見せる)。オーナーかマネージャー (か管理者) なら、名前と招待コードを POST /api/teams/[teamId] で更新でき (team の update)、メンバー表 (GET /api/teams/[teamId]/users で team_user と user を読む) からオーナー以外のメンバーの役割の変更 (team_user の update) と削除 (team_user の delete) ができる。オーナーでないメンバーには退出ボタンがあり、自分の team_user を削除する。オーナーには削除ボタンがあり、DELETE /api/teams/[teamId] でチームと、そのチームの team_user / share / link / pixel / board を消し、Redis が有効なら link:* / pixel:* のキャッシュも消す。権限は各 API が team_user を読んで確かめ、各 API の認証はログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)。URL に /admin を含まないので、メンバー追加ボタンとチームの 2 段階認証の設定はこの画面には出ない"
  evidence:
    - { file: "src/app/(main)/settings/teams/[teamId]/page.tsx", line: 7 }
    - { file: "src/app/(main)/settings/teams/[teamId]/TeamSettingsPage.tsx", line: 7 }
    - { file: "src/app/(main)/teams/[teamId]/TeamSettings.tsx", line: 16 }
    - { file: "src/app/(main)/teams/[teamId]/TeamSettings.tsx", line: 20 }
    - { file: "src/app/(main)/teams/[teamId]/TeamSettings.tsx", line: 26 }
    - { file: "src/app/(main)/teams/[teamId]/TeamSettings.tsx", line: 40 }
    - { file: "src/app/api/teams/[teamId]/route.ts", line: 20 }
    - { file: src/queries/prisma/team.ts, line: 162 }
notes: "プロファイル 0.3.0 で再分析した (対象のコミットは 0.2.0 のときと同じ)。0.3.0 では祖先ディレクトリの layout は別の入口 (layout_l.main_g と layout_l.main_g.settings) として分析するので、この画面からは辿らない。0.2.0 の結果からの変更: [1] 枠を経由してだけ動くもの ((main) の layout ファイルと App、2 段階認証の状態と設定用の小窓、更新のお知らせ (api.umami.is)、利用状況の送信 (/telemetry.js → i.umami.is)) のフレームと I/O を外した。[2] 画面の側でも呼んでいる部品は残し、置き場を画面の側に付け替えた: useTeamQuery 以下は TeamProvider (TeamProvider.tsx:10。画面の側の呼び出しはここだけ) の下、useLoginQuery 以下は TeamLeaveButton (TeamLeaveButton.tsx:10。TeamSettings.tsx:16 とパスの文字コード順で比べると T が [ より前) の下、parseRequest → checkAuth は POST /api/auth/verify (auth/verify/route.ts:6。src/app/api/auth が src/app/api/teams より前) の下、getUser は checkAuth (auth.ts:94) の下。[3] TeamProvider の下に置いていた書き直しのフレーム 4 つ (useTeamQuery → GET /api/teams/[teamId] → parseRequest → checkAuth) は、本来の経路を TeamProvider の下に置いたので要らなくなり外した。[4] 画面の側の grep で、useLoginQuery / useTeamQuery を呼ぶのは TeamSettings・TeamLeaveButton・TeamProvider だけと確かめた (TeamTwoFactorSettings も useTeamQuery を呼ぶが、URL に /admin を含むときだけ描くのでこの画面では動かない)。[5] deleteTeam のクラウドモードの枝 (論理削除) は 0.2.0 と同じく I/O に書いていない。理由は settings の layout (src/app/(main)/settings/layout.tsx:5) がクラウドモードで null を返し、この画面そのものが描かれないため。これは枠の振る舞いなので入口の summary には書かず、ここに残す。0.2.0 以前から引き継ぐ判断: (a) external フレームの source はライブラリを実際に呼ぶ行にし、1 つのフレームが複数の行でライブラリを呼ぶとき (deleteTeam、pagedQuery など) は最初に呼ぶ行を source、残りを call の evidence に入れた。(b) 同じ関数は、呼び出し行のファイルのパスを文字コード順で比べていちばん早い呼び出し元の下に 1 回だけ書いた。置き場: getTeamUser は POST /api/teams/[teamId]/users/[userId] (route.ts:50。src/app/api が src/permissions より前) の下、canViewTeam は GET /api/teams/[teamId] (route.ts:16。teams/[teamId]/route.ts が teams/[teamId]/users/route.ts より前) の下、canUpdateTeam は POST /api/teams/[teamId] (route.ts:43) の下、メンバー削除の DELETE (useDeleteQuery 以下) は TeamLeaveForm (src/app/(main)/teams/TeamLeaveForm.tsx が src/app/(main)/teams/[teamId]/TeamMemberRemoveButton.tsx より前) の下。(c) 呼び出し元が終端になってしまう場合 (TeamMemberRemoveButton、canViewTeam / canUpdateTeam / canDeleteTeam / canDeleteTeamUser) は、各段で最も早い呼び出しを 1 本だけ書き直し、I/O を持つ最初のフレームで止めた (TeamMemberRemoveButton の下は parseRequest → checkAuth の Redis の読み取りで止まり、getTeamUser の書き直しには external を付けていない)。書き直したフレームの summary に、全体の経路が書いてあるフレームを示した。(d) ブラウザが付けるトークンは localStorage のログイントークン (src/lib/client.ts:4) なので、checkAuth の API キーの経路はこの画面からは使わないものとして書いていない。parseShareToken (auth.ts:88) はヘッダーのトークンを解くだけでデータを読まない。(e) URL の接頭辞: /auth で始まる URL は常に basePath + /api だが、/teams は環境変数 apiUrl が設定されているとその URL に向く (src/lib/api-url.ts:39)。既定 (apiUrl 無し) で同じリポジトリの route に当たるので、その呼び出しは interpretation にした。(f) GET /api/teams/[teamId]/users の引数は page / pageSize / maxResults / search。フックが付ける orderBy / sortDescending はスキーマに無いので捨てられる (0.2.0 のレビューの high の指摘で直したもの)。(g) 0.2.0 のレビューで直さなかった 1 件 (low): TeamMemberEditButton と TeamMemberEditForm を 1 つのフレームにまとめている点。ボタンは小窓を開いて保存後に更新印を付けるだけでデータに触れないので、そのまま残した (0.3.0 のレビューでも同じ指摘 (low) が出たが、同じ理由で直していない)。0.3.0 のレビューのもう 1 件 (low: 入口の summary が招待コードを全員に見せるように読める) は、編集できる人にだけ見せると直した"
