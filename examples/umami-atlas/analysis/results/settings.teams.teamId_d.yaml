    - { file: src/queries/prisma/team.ts, line: 162 }
notes: "指示書 0.4.0 とプロファイル 0.4.0 で分析し直した (対象のコミットは同じ)。根拠の行は対象のコードで確かめ直した。[1] 木の直し: 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は GET /api/teams/[teamId] (route.ts:8。TeamProvider の useTeamQuery が最初に着く) の下、getTeamUser は canViewTeam (permissions/team.ts:15) の下、useLoginQuery → POST /api/auth/verify は TeamSettings (TeamSettings.tsx:16) の下、メンバーの DELETE (useDeleteQuery 以下) は TeamLeaveForm (TeamSettings.tsx:37 が 47 より前) の下。[2] 呼び出し元が終端になる所は、いちばん早い呼び先を終端までもう一度書いた (id が _rw で終わるフレーム): canDeleteTeamUser / canUpdateTeam / canDeleteTeam の下の getTeamUser と Prisma の呼び出し、TeamMemberRemoveButton の下の useDeleteQuery → DELETE → parseRequest → checkAuth → getUser → Prisma の呼び出し。書き直したフレームには、いちばん早い呼び先の経路だけを書き、権限の確認・設定・ルールは繰り返していない (checkAuth の書き直しには Redis の読み取りを書いていない)。[3] TeamSettings の caller は、JSX に書いている TeamSettingsPage のままにし、描くかどうかを決める TeamProvider の条件は call の condition に書いた。[4] 0.3.0 では 1 つにまとめていた TeamMemberEditButton と TeamMemberEditForm は、ファイル単位で 2 つのフレームに分けた。[5] deleteTeam のクラウドモードの枝 (team / link / pixel の論理削除) は、設定 (CLOUD_MODE) には書いたが I/O には書いていない。設定の枠 (src/app/(main)/settings/layout.tsx:5) がクラウドモードで何も描かず、この画面からは届かないと判断したため (0.2.0 から引き継ぐ判断)。[6] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので、この画面からは使わないものとして辿っていない。設定 (CLOUD_MODE) にだけ書いた。parseShareToken (auth.ts:88) はヘッダーのトークンを解くだけでデータを読まない。[7] 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL は呼び出すフックの settings に書いた。[8] DB の接続先の環境変数 (DATABASE_URL / DATABASE_REPLICA_URL) は、どの段にも同じように効き、プロファイルが接続先を書かないと決めているので、settings に書いていない。[9] 行の削除の fields は、name が * で use は write とし、条件の列を filter で書いた。Redis のキーの削除も、値をまるごと消すので同じく * と write で書いた。[10] テストとの対応は、作業定義で選ばれていないので分析していない。[11] レビューの指摘は low が 3 件で、すべて直した (書き直した getUser の I/O の根拠の行、GET /api/teams/[teamId]/users の引数の根拠の行、Redis のキーの削除の fields)"
