summary:
  status: interpretation
  value: "設定メニューの中で 1 つのチームを見て編集する画面。URL の teamId で GET /api/teams/[teamId] を呼び、team とメンバー (team_user) を読んでチーム名とチーム ID を出す (招待コードは編集できる人にだけ見せる)。オーナーかマネージャー (か管理者) なら、名前と招待コードを POST /api/teams/[teamId] で更新でき (team の update)、メンバー表 (GET /api/teams/[teamId]/users で team_user と user を読む) からオーナー以外のメンバーの役割の変更 (team_user の update) と削除 (team_user の delete) ができる。オーナーでないメンバーには退出ボタンがあり、自分の team_user を削除して /settings/teams へ移る。オーナーには削除ボタンがあり、DELETE /api/teams/[teamId] でチームと、そのチームの team_user / share / link / pixel / board を消し、Redis が有効なら link:* / pixel:* のキャッシュも消して /settings/teams へ移る。権限は各 API が team_user を読んで確かめ (見るのはメンバー、更新は team:update、削除は team:delete、メンバーの変更と削除は役割の順位も見る)、各 API の認証はログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)。URL に /admin を含まないので、メンバー追加ボタンとチームの 2 段階認証の設定はこの画面には出ない"
  evidence:
    - { file: "src/app/(main)/settings/teams/[teamId]/page.tsx", line: 7 }
    - { file: "src/app/(main)/settings/teams/[teamId]/TeamSettingsPage.tsx", line: 7 }
