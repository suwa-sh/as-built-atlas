summary:
  status: interpretation
  value: "1 つのサイトの保存済みファネル (段ごとの到達と離脱) の一覧画面。FunnelsPage が GET /api/websites/<id>/funnels で type が funnel の report を読み、1 件ずつ GET …/funnels/<funnelId>/stats で集計する。集計は report の parameters (段と時間枠) を使い、website_event を読む (イベントの段の絞り込みでは event_data も読む)。URL に segment / cohort があれば、集計の前に保存済みの segment を読んで絞り込みに足す。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。追加と編集のフォームは report を作成 (POST …/funnels) または更新 (POST …/funnels/<funnelId>) し、メニューから削除 (DELETE …/funnels/<funnelId>) もできる。フォームの段の入力欄は、値の候補 (values) とイベントのプロパティ (event-data/properties と values) を読む。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。書き込み (作成・更新・削除) は、管理者・report の作成者・サイトの持ち主・チームで権限を持つ人だけができる。FunnelsPage は URL が /share/ を含むとき追加・編集・削除の部品を出さないが、この URL (/websites/<id>/funnels) では、いつも出る。上部の WebsiteControls は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。この画面は websiteId だけを渡すので、部品は、絞り込みと、比較なしの期間の選択を出す"
