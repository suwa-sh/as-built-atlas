    - { file: src/queries/sql/funnels/getFunnel.ts, line: 36 }
notes: "プロファイル 0.3.0 で再分析した。対象のコミットは 0.1.0 のときと同じ。0.1.0 の結果からの変更は 4 つ。[1] 祖先ディレクトリの layout は別の入口 (layout_l、layout_l.main_g、layout_l.main_g.websites.websiteId_d) として分析するので、この画面からは辿らない。(main) の App (ログインの確認、2 段階認証、TopNav、UpdateNotice、telemetry) と [websiteId] の layout (getWebsite、WebsiteProvider、ActiveUsers) のフレームと I/O を外した。WebsiteControls は page の側の FunnelsPage が自分で描くので残した。[2] 同じ関数は、呼び出しの行のファイルのパスを文字コード順で比べ、いちばん早い呼び出し元の下に 1 回だけ書いた。置き場は次のとおり。parseRequest → checkAuth → getUser は GET /api/websites/[websiteId]/daterange (daterange/route.ts:10。daterange が event-data・funnels・segments・values より前) の下。canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser は GET …/event-data/properties (route.ts:26) の下。getQueryFilters → fetchWebsite / fetchAccount も同じ受け口 (route.ts:30) の下。getWebsiteSegment は GET …/segments/[segmentId] (route.ts:24。src/app が src/lib/request.ts より前) の下。getReport と canViewReport は GET …/funnels/[funnelId] (route.ts:14・16。funnels/[funnelId]/route.ts が funnels/[funnelId]/stats/route.ts より前) の下。canUpdateWebsite は POST …/funnels (funnels/route.ts:28。segments/route.ts と permissions/report.ts より前) の下。GET …/event-data/properties の受け口は、画面の側では EventDataFilterRow (EventDataFilterRow.tsx:50) と FunnelEditForm の StepRow (FunnelEditForm.tsx:52) から呼ばれる。E が F より前なので EventDataFilterRow の下に置いた。canViewWebsite の呼び出し元から canViewReport (permissions/report.ts:46) は外して比べた。そこへは report の種類に区画が無いときだけ進むが、funnel は区画 funnels を持つのでこの画面では通らない。[3] 呼び出し元が終端になってしまうもの (canViewSharedWebsite、canViewSharedWebsiteFilters、canViewReport、canUpdateReport、canUpdateWebsite、canDeleteWebsite) は、いちばん早い呼び出しを 1 本だけ書き直し、I/O を持つ最初のフレーム (getWebsite) で止めた。書き直したフレームには external を付けていない。summary に、全体の経路があるフレームを書いた。FunnelEditForm は、編集 (id あり) と追加 (id なし) で書き込み先の URL が変わる (POST …/funnels/<id> と POST …/funnels) ので、届く先ごとに 2 つのフレームにした。追加のほうには、違いのある書き込みの経路だけを書いた。[4] external フレームの source は、ライブラリのメソッドを実際に呼ぶ行にした。生の SQL は prisma.ts:746 の $queryRawUnsafe と clickhouse.ts:721 の query、pagedQuery は prisma.ts:761、Redis は redis.ts:37 (get) と 51 (set)。生の SQL は呼び出し元ごとに読む表が違うので、同じ行でも呼び出し元ごとに書いた。0.1.0 から引き継ぐ判断は 4 つ。(a) ブラウザが付けるトークンはログインのトークンで、umami_ で始まる API キーではない。だから checkAuth の API キーの経路 (api_key の読み書き) は書いていない。(b) URL の接頭辞: /websites で始まる URL は、環境変数 apiUrl があるとその URL に向く (api-url.ts:39)。既定 (apiUrl 無し) で同じリポジトリの route に当たるので、受け口への呼び出しは interpretation にした。(c) 共通の絞り込みの部品 (WebsiteFilterButton のダイアログと、セグメントとして保存のフォームの中の入力欄) は unknown + not_analyzed で閉じた。どちらもサイトの多くの画面で同じものを使う共通の部品で、この画面に固有の処理ではないため (開くまで何も読まない点は FunnelEditForm も同じなので、閉じる理由にはしていない)。(d) ブラウザの中の保存 (localStorage の期間など) は I/O に書いていない。0.3.0 のレビューの指摘 7 件 (すべて low) は、すべて直した: 不明で閉じた理由を「共通の部品で、この画面に固有でない」に書き換えた。入口の summary の共有ページの分岐を「この URL では起きない」と直した。LookupField が描いた時点で値の候補を読むことを書いた。セグメントとして保存のボタンの条件に、イベントのプロパティの絞り込みが無いことを足した。FunnelsPage の期間の記述の根拠を足した。CLOUD_MODE の切り捨てを「6 か月前の月の初日」と直した。EventDataFilterRow を描く条件を補った"
