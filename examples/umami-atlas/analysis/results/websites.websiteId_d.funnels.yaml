- id: q_get_funnel
  layer: query
  kind: function
  name: "getFunnel (src/queries/sql/funnels/getFunnel.ts)"
  source: {file: src/queries/sql/funnels/getFunnel.ts, line: 33}
  caller: api_funnel_stats
  call:
    status: fact
    when: always
    evidence:
    - {file: 'src/app/api/websites/[websiteId]/funnels/[funnelId]/stats/route.ts', line: 23}
  settings:
  - name: CLICKHOUSE_URL
    kind: env
    effect: "設定されていると ClickHouse 用の問い合わせが動く。無ければ PostgreSQL 用 (Prisma の生 SQL) が動く"
    status: fact
    evidence:
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 36}
    - {file: src/lib/db.ts, line: 27}
  rules:
  - kind: calculation
    value: "次の段に進んだと数えるのは、同じセッションで、前の段の時刻から時間枠 (window 分) の内に、次の段の条件に当たるイベントがあるとき"
    status: fact
    evidence:
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 150}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 152}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 154}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 301}
  - kind: calculation
    value: "段ごとの訪問者数は、その段に着いたセッションの数 (distinct)。離脱数 = 前の段 − この段、離脱率 = 1 − この段 / 前の段、残存率 = この段 / 最初の段"
    status: fact
    evidence:
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 162}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 352}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 354}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 355}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 356}
  - kind: decision
    value: "段の値の先頭か末尾が * のときは、* を % に替えて like で比べる。そうでなければ、同じ値かで比べる"
    status: fact
    evidence:
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 116}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 117}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 118}
    - {file: src/queries/sql/funnels/getFunnel.ts, line: 270}
  - kind: decision
    value: "イベントの段の絞り込みは、演算子が neq なら不一致、c なら部分一致、dnc なら部分一致しない、それ以外は一致で比べる。数値型 (data_type = 2) の値は、末尾の .0000 を取ってから比べる"
    status: fact
