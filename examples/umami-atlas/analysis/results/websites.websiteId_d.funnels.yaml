summary:
  status: interpretation
  value: "1 つのサイトの保存済みファネル (段ごとの到達と離脱) の一覧画面。FunnelsPage が GET /api/websites/<id>/funnels で type が funnel の report を読み、1 件ずつ GET …/funnels/<funnelId>/stats で集計する。集計は report の parameters (段と時間枠) を使い、website_event を読む (イベントの段の絞り込みでは event_data も読む)。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。追加と編集のフォームは report を作成 (POST …/funnels) または更新 (POST …/funnels/<funnelId>) し、メニューから削除 (DELETE …/funnels/<funnelId>) もできる。フォームの段の入力欄は、値の候補 (values) とイベントのプロパティ (event-data/properties と values) を読む。上部の WebsiteControls は、期間の選択 (daterange)、絞り込みの表示 (保存済みの segment の読み取りと、セグメントとして保存する書き込み)、絞り込みのボタンを描く。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。書き込み (作成・更新・削除) は、管理者・report の作成者・サイトの持ち主・チームで権限を持つ人だけができる。FunnelsPage は URL が /share/ を含むとき追加・編集・削除の部品を出さないが、この URL (/websites/<id>/funnels) では、いつも出る"
  evidence:
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/page.tsx', line: 7}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx', line: 12}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx', line: 17}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx', line: 21}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/Funnel.tsx', line: 25}
  - {file: 'src/app/api/websites/[websiteId]/funnels/[funnelId]/stats/route.ts', line: 23}
  - {file: src/queries/sql/funnels/getFunnel.ts, line: 36}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelEditForm.tsx', line: 171}
  - {file: 'src/app/api/websites/[websiteId]/funnels/[funnelId]/route.ts', line: 49}
notes: "プロファイル 0.4.0・skill 0.4.0 で分析し直した。対象のコミットは前の結果 (0.3.0) と同じ。根拠の行は、対象のコードで確かめ直した。[木の直し] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。FunnelsPage の中の順は、useFunnelsQuery (12 行) → WebsiteControls (21 行) → FunnelAddButton (24 行) → Funnel (32 行)。その結果、parseRequest → checkAuth → getUser と canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser は GET …/funnels の下、getWebsiteSegment は GET …/segments/[segmentId] の下、canUpdateWebsite は POST …/segments の下、getQueryFilters → fetchWebsite / fetchAccount と event-data/properties の受け口は、追加のフォーム (FunnelAddButton → FunnelEditForm → StepRow 52 行) の下、getReport と canViewReport は GET …/funnels/[funnelId]/stats の下になった。段の入力欄 (LookupField・EventDataFilterRow) も、先に着く追加のフォームの下に移した。[迷った点と選んだ扱い] (1) FunnelEditForm は同じ関数だが、id の有無で呼ぶ URL が違うので、追加 (funnel_edit_form_create) と編集 (funnel_edit_form_edit) に分けた。StepRow は同じファイルの関数なので、FunnelEditForm のフレームに含めた。(2) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canViewSharedWebsite、canViewSharedWebsiteFilters、canViewReport、canUpdateReport、canDeleteWebsite、POST …/segments の下の canUpdateWebsite、GET …/funnels/[funnelId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。context.md は「終端までもう一度書く」と言うが、ライブラリのフレームまでは書いていない (機械チェックの終端の決まりは、読み書きを持つフレームで満たせる)。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(3) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(4) 画面から受け口への呼び出しは、URL の形がコードから読め、当たる route が 1 つに決まるので fact にした。API_URL を設定すると呼び出し先が変わることは、呼ぶ側のフレームの settings に書いた。削除の URL だけは、report の type から組み立てるので interpretation。(5) 共通の絞り込みの部品 (WebsiteFilterButton のダイアログと、セグメントとして保存のフォームの中の入力欄) は、unknown + not_analyzed で閉じた。サイトの多くの画面が同じものを使う部品で、この画面に固有の処理ではないため。WebsiteFilterButton (WebsiteControls.tsx 35 行) は、コードの順では WebsiteDateFilter より前にあるので、辿れば、values の受け口や getQueryFilters が、その下に移るかもしれない。(6) checkAuth の API キーの経路 (checkApiKeyAuth) は辿っていない。ブラウザが付けるのはログインのトークンで、umami_ で始まる API キーではないため。(7) 権限の確認は、判定をしている関数のフレーム (checkAuth、canView… / canUpdate… / canDelete…) に書き、401 を返す受け口には重ねて書いていない。(8) 期間の選択や絞り込みを消す操作は、同じ画面の URL のクエリを書き換えるだけなので、links に書いていない (ほかの入口へのつながりは無かった)。(9) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。(10) ブラウザの中の保存 (期間の localStorage など) は I/O に書いていない。(11) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[レビュー] 指摘は 6 件 (medium 2、low 4) で、すべて直した: getEventDataProperties の data_key を読むだけにした (propertyName は受け口のスキーマで落ちる)。getReports の並びを、いつも name と id の昇順と直した。500 件の並びに ClickHouse の違いを足した。集計の受け口にクエリの検証のルールを、getFunnel に段の絞り込みの比べ方のルールを足した。high が無いので、もう一度のレビューはしていない。"
