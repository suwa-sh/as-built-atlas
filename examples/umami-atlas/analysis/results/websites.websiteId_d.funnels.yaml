summary:
  status: interpretation
  value: "1 つのサイトの保存済みファネル (段ごとの到達と離脱) の一覧画面。FunnelsPage が GET /api/websites/<id>/funnels で type が funnel の report を読み、1 件ずつ GET …/funnels/<funnelId>/stats で集計する。集計は report の parameters (段と時間枠) を使い、website_event を読む (イベントの段の絞り込みでは event_data も読む)。PostgreSQL と ClickHouse のどちらで読むかは設定 (CLICKHOUSE_URL) で切り替わる。追加と編集のフォームは report を作成 (POST …/funnels) または更新 (POST …/funnels/<funnelId>) し、メニューから削除 (DELETE …/funnels/<funnelId>) もできる。フォームの段の入力欄は、値の候補 (values) とイベントのプロパティ (event-data/properties と values) を読む。上部の WebsiteControls は、期間の選択 (daterange)、絞り込みの表示 (保存済みの segment の読み取りと、セグメントとして保存する書き込み)、絞り込みのボタンを描く。どの API も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。FunnelsPage は URL が /share/ を含むとき追加・編集・削除の部品を出さないが、この URL (/websites/<id>/funnels) ではその分岐は起きず、常に出る (同じ FunnelsPage を描く共有ページは share/[slug] の入口)"
  evidence:
    - { file: "src/app/(main)/websites/[websiteId]/(reports)/funnels/page.tsx", line: 7 }
    - { file: "src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx", line: 17 }
    - { file: "src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx", line: 12 }
    - { file: "src/app/(main)/websites/[websiteId]/(reports)/funnels/FunnelsPage.tsx", line: 21 }
