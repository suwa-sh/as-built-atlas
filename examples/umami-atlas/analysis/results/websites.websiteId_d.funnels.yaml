notes: "[分析し直し (skill 0.4.1)] 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、112 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。段は 112 から 88 になった。(a) FunnelsPage (funnels_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は FunnelsPage.tsx 3 行の import と 21 行の描く行) を書いた。WebsiteControls と、その下の WebsiteFilterButton・WebsiteDateFilter (daterange の受け口と getWebsiteDateRange)・FilterBar (segments/[segmentId] の受け口、セグメントとして保存のフォームと POST …/segments、createSegment) の段を外した (前は、絞り込みの部品 2 つを not_analyzed で閉じていた。それも外れたので、unknown は 0 になった)。渡す値 (websiteId だけ。ほかは部品の既定) は funnels_page の summary に書いた。(b) 部品の下にあった共通の段は、深さ優先で次に着く呼び出し元の下へ移した: canUpdateWebsite (と、終端を避けるためにもう一度書いた getWebsite) は、追加のフォームの POST …/funnels の下 (funnels/route.ts 28 行)。getWebsiteSegment は、集計の受け口の getQueryFilters の下 (次の (c))。canViewSharedWebsite と canViewSharedWebsiteFilters は、部品の中だけで呼ぶので、この入口から消えた。(c) getQueryFilters の segment / cohort の分かれ道 (request.ts 132〜170 行): 深さ優先で最初に getQueryFilters に着くのは、追加のフォームの StepRow → event-data/properties の受け口で、そこからは segment と cohort を付けない (FunnelEditForm.tsx 52〜56 行。PropertySelect・ValueSelect・LookupField も付けない)。一方、集計の受け口 (stats/route.ts 21 行) には、useAnalyticsQuery が URL の segment / cohort を付ける (useFilterParameters.ts 35・36 行) ので、値は URL で決まり、閉じた呼び出しではない。指示書の「別の値で着く経路があれば、その経路の下に書く」と、context.md の「呼び出し元によって届く先が違うものは、届く先ごとに書く」に従い、集計の受け口の下に getQueryFilters をもう 1 つ (q_get_query_filters_rw_stats) 書き、getWebsiteSegment を conditional でその下に置き、segment / cohort の decision の rules もそちらへ移した。最初の q_get_query_filters の summary には、その経路では分かれ道を通らないことを書いた。CLOUD_MODE の settings と期間の rules は、最初のフレームにだけ書いた。(d) values の受け口の、type がセグメントの種類のときの分かれ道 (values/route.ts 48 行の getWebsiteSegments) は、受け口のスキーマの type が fieldsParam (schema.ts 127 行。segment と cohort を含まない) なので、parseRequest が 400 にし、決して着かない (websites.websiteId_d.cohorts と同じ扱い)。decision の rules を外し、400 の rules を fieldsParam の検査に直した。(e) 共通の段を決まりにそろえた: checkAuth の rules に、API キーの枝の 1 行 (decision) を足した (settings の CLOUD_MODE と REDIS_URL、getUser は前からある)。canViewWebsite・canUpdateWebsite・canDeleteWebsite・canViewReport・canUpdateReport・canDeleteReport の guards は、持ち主の確認 (ownership) と別に、管理者の確認 (role、user.isAdmin) を 1 件ずつ持つことを確かめた。canViewWebsiteSection は、ほかの入口と同じく kind: other のまま。API_URL は、前はフックや部品ごとに 9 か所に書いていたが、この入口で最初に API を呼ぶ use_funnels_query の 1 か所だけにし、そこに BASE_PATH を足した。target は作業定義と同じ。(f) 固定の値で閉じている呼び出しは、ほかに見つからなかった。Funnel の allowEdit は FunnelsPage が渡さず既定の true。追加のフォームの useFunnelDefinitionQuery は id が無いので問い合わせをしないが、編集のボタンから id 付きで着く経路があるので、閉じた呼び出しにはせず、編集のフォームの下に書いた (前と同じ)。[前の分析から引き継いだ扱い] (1) FunnelEditForm は同じ関数だが、id の有無で呼ぶ URL が違うので、追加 (funnel_edit_form_create) と編集 (funnel_edit_form_edit) に分けた。StepRow は同じファイルの関数なので、FunnelEditForm のフレームに含めた。(2) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canUpdateWebsite、canViewReport、canUpdateReport、canDeleteWebsite、GET …/funnels/[funnelId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(3) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(4) 画面から受け口への呼び出しは、URL の形がコードから読め、当たる route が 1 つに決まるので fact にした。削除の URL だけは、report の type から組み立てるので interpretation。(5) 権限の確認は、判定をしている関数のフレームに書き、401 を返す受け口には重ねて書いていない。(6) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。(7) ブラウザの中の保存 (期間の localStorage など) と、保存の後の touch は I/O に書いていない。(8) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[レビュー] 1 回 (high 0、medium 0、low 4)。すべて直した: 生の SQL を送る 4 つの external (ext_prisma_event_data_properties、ext_prisma_values、ext_prisma_event_data_values、ext_prisma_funnel) に、ほかの入口と同じ綴りで DATABASE_REPLICA_URL の settings を足した。high が無いので、もう一度のレビューはしていない。"
