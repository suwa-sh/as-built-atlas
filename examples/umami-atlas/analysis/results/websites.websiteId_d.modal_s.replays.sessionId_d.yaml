"summary":
  "status": "interpretation"
  "value": "サイトの画面 (/websites/[websiteId]) の上に、録画の再生を小窓で重ねて出す画面。割り込みルート (.)replays/[sessionId] なので、URL は /websites/[websiteId]/replays/[sessionId] (同じサイトの画面の中から、その URL へ移るときに重なる。直接開いたり読み込み直したりしたときは、同じ URL の通常の画面 replays/[replayId] が出る)。URL の [sessionId] は、録画の受け口では訪問の id (visit_id) として使われる。開いたときに読むもの: 録画の操作 (replays/[replayId]。session_replay)、保存済みかどうか (replays/saved/[replayId]。session_replay_saved)、録画の応答の sessionId で読むセッション 1 件 (sessions/[sessionId]。session と website_event、session_link。ClickHouse では website_event_stats_hourly)。書き込みは利用者の操作で起きるものだけ: 録画の保存 (名前を付けて session_replay_saved に作る) と保存の取り消し (消す)。どの受け口も最初にログインを確かめ (user。REDIS_URL があれば Redis の auth:*)、サイトを見てよいか (録画はログインした利用者だけ) または書き換えてよいかを確かめるために website / share / link / pixel / board / team_user を読む。録画とセッションの問い合わせは PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。小窓を閉じると、録画の一覧 (/websites/[websiteId]/replays) へ移る"
