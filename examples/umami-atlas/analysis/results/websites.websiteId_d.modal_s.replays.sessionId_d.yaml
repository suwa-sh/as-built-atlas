"notes": "(1) この入口の初めての分析。ReplayPlayback から先の部品の木は、websites.websiteId_d.events の結果 (セッションの小窓の録画のタブから ReplayPlayback を描く) を出発点にし、この入口から辿る順で置き場を決め直した。page・ReplayModal・ReplayPlayback・3 つの受け口・権限の関数は対象のコードを読んで書き直し、写したフレームの根拠の行は、すべて対象のファイルの行と突き合わせた (問い合わせの列の一覧などの中身は、写した結果のまま)。(2) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書いた。ReplayPlayback の中の順は useReplayQuery (:36)、useReplaySavedQuery (:37)、useWebsiteSessionQuery (:38)、useUpdateQuery (:42)、ReplaySaveForm (:106)。parseRequest → checkAuth と canViewAuthenticatedWebsite → canViewWebsite → getEntity / getTeamUser は、最初に着く GET replays/[replayId] の下。(3) 呼び先がすべてほかの呼び出し元の下に書いた処理で終端になる呼び出し元の下には、いちばん早い呼び出しを読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>): canDeleteWebsite の下の getWebsite (rw1)、canViewWebsiteSection の下の canViewWebsite → getEntity → getWebsite (rw1 / rw1 / rw2)、canUpdateWebsite の下の getWebsite (rw3)、ReplaySaveForm の下の useUpdateQuery → POST replays/saved/[replayId] → parseRequest → checkAuth (rw1)。書き直したフレームには、権限の確認・設定・ルールを繰り返して書いていない。(4) 迷った点と選んだ扱い。(a) ReplayModal は activeReplayId があるときだけ ReplayPlayback を描くが、この入口では URL の sessionId がいつも入るので always にし、call の note に書いた。(b) URL の段の名前は [sessionId] だが、page はそれを replayId として渡し、録画の受け口と問い合わせは visit_id として使う。名前の食い違いは、入口の summary と page の parameters に書いた。(c) useWebsiteSessionQuery の受け口は、録画の応答の sessionId が得られたときだけ動くので conditional。(d) POST replays/saved/[replayId] の createReplaySaved の枝は、ReplayPlayback の呼び出し (保存を外す) からは通らないように見えるが、決まりどおり消さずに conditional にし、note に書いた。(e) 見た目だけの部品 (ControlledDialog、SessionInfo、Avatar、LoadingPanel) と、録画を再生する ReplayPlayer (rrweb-player を使う。データを読まない) は、フレームにしていない。useNavigation は URL の操作だけなのでフレームにせず、遷移を ReplayModal の links に書いた。(f) API_URL と BASE_PATH は、入口から辿る順で最初に API を呼ぶ useReplayQuery に 1 回だけ書いた。"
