summary:
  status: "interpretation"
  value: "サイト 1 件の、2 つの期間を比べる画面。サーバー側の page は URL の websiteId を ComparePage に渡すだけで、画面の本体はブラウザ側で動く。上の操作の列 (WebsiteControls。絞り込み・期間・比較の期間の選択) は、別の入口の共有の部品 (part_p.shared_a.WebsiteControls) で、この画面には allowCompare を渡して描くだけ (ここでは辿らない)。比較の期間は URL の compare (prev = 同じ長さだけ前の期間 / yoy = 1 年前。無ければ prev) で決まる。開いたときに読むもの: 指標の帯 (stats。比較の期間の合計も返る)、ページビューとセッションの時系列 (pageviews。compare を送るので、比較の期間の時系列も返る)、URL の view (無ければ path) の列の表を 2 つ (metrics。左は比較の期間、右はいまの期間。右の行に差と変化率を出す)。表の列は 20 種類から選べ、セッションの列は getSessionMetrics、event はカスタムイベントの件数 (getEventMetrics)、channel は流入の種類 (getChannelMetrics)、そのほかのイベントの列は getPageviewMetrics で数える。URL に segment か cohort があれば、その定義も読む。この画面の木には書き込みが無い。グラフの注釈の API (annotations) は、この画面が showAnnotations を渡さないので呼ばれない。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) で、URL の絞り込みに応じて session / event_data / session_data も読む。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。リファラーの表の行には、ドメインのアイコンを、ブラウザから他社のサービス (既定は icons.duckduckgo.com。FAVICON_URL で変わり、PRIVATE_MODE では出さない) へ取りに行って出す。ほかの画面への遷移は無い (列の選択は、同じ画面の URL のクエリを書き換えるだけ)"
