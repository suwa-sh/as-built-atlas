notes: "(1) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、138 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。ComparePage (compare_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は ComparePage.tsx:4 の import と :12 の描く行) を書いた。WebsiteControls の中 (WebsiteFilterButton → FilterEditForm → FieldFilters / SegmentFilters / PropertyFilters、WebsiteDateFilter、ExportButton、FilterBar → SegmentEditForm) の段は外した。ComparePage が WebsiteControls に渡す値 (allowCompare={true}。allowBounceFilter / allowDownload / allowMonthFilter は渡さない) は compare_page の summary に書いた。(2) 外した木の下に書いていた共通の段は、入口から、コードに書いてある順に深さ優先で辿り直して、最初に着く呼び出し元の下に移した: parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は GET stats (ComparePage.tsx:13 の WebsiteMetricsBar → useWebsiteStatsQuery) の下。getSessionMetrics / getEventMetrics / getPageviewMetrics は、前は ExportButton の受け口 (GET export) の下にあったので、GET metrics (CompareTables → MetricsTable → useWebsiteMetricsQuery) の下に、受け口の分かれ道どおり conditional で移した。外した木にだけあった受け口 (values、segments の GET / POST、segments/[segmentId]、session-data/properties / values、event-data/fields / values、daterange、export) と、そこにだけあった確認 (canViewSharedWebsiteFilters、canViewSharedWebsite、canViewAuthenticatedWebsite、canUpdateWebsite) と、書き込み (segment の作成) を、残った部品が呼んでいないことは、対象のコードで確かめた。そのため書き直しの段 (_rw) は要らなくなった。共通の段の文は、概要の画面 (websites.websiteId_d) の、決まりにそろえ直した結果から写し、この画面のほかの受け口の一覧と、もう無い呼び出し元 (canViewSharedWebsiteFilters、canUpdateWebsite) の記述を直した。(3) 決まりにそろえた所: (a) checkAuth に、settings の CLOUD_MODE と、API キーの枝 (auth.ts:75 の checkApiKeyAuth) の 1 行の rules を書いた。(b) canViewWebsite の guards に、持ち主の確認 (ownership: canViewWebsite) と別に、関数の中の管理者の確認 (kind: role、value: user.isAdmin) を書いた。canViewWebsiteSection は、ほかの入口の結果と同じく kind: other のまま。(c) API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_stats) に 1 回だけ書いた (前の結果は、外した useWebsiteValuesQuery に書いていた)。(d) 結果の target は、作業定義と同じに書いた (clone_path も写した)。(4) 固定の値で閉じている呼び出し (指示書 0.4.1): WebsiteChart の注釈の API (GET annotations)。フックの enabled が !!showAnnotations && !!websiteId (WebsiteChart.tsx:38) で、ComparePage は showAnnotations を渡さない (ComparePage.tsx:15)。この木で WebsiteChart を描くのは ComparePage だけ。前の結果は use_annotations と api_annotations_get を conditional で書いていたが、外して website_chart の summary に書いた。フックの呼び出しそのもの (use_annotations) も、読み書きにも次の段にも届かないので段にしなかった。注釈のデータにだけ働く WebsiteChart の 2 つの rules (単位が時間・分のときは終日でない注釈だけ出す、注釈を押して期間を絞れる条件) も、閉じた呼び出しのデータにだけ働くので消し、summary に書いた。迷った点: 決まり (analysis-conventions.md の「木の書き方」) の「この画面からは条件が成り立たないように見える呼び出しも、省かずに conditional のフレームにする」は、指示書 0.4.1 の「固定の値で閉じている呼び出し」の例外を明記していない。指示書の 3 つの条件 (値が木の中に直接書いてある、条件がその値だけで決まる (A && B の A が固定で偽)、別の値で着く経路が無い) をすべて確かめたので、指示書の例外を当てはめた (概要の画面の結果が、pageviews の比較の枝を同じ扱いで閉じたのにそろえた)。(5) 段の数は 138 から 61 になった (WebsiteControls の木と、注釈の 2 段を外し、共通の段 27 段を移した)。(6) 辿らなかったもの: checkAuth の API キーの枝 (決まりどおり rules に 1 行)。GET /api/config (useConfig) は決まりどおり段にせず、そこから得る PRIVATE_MODE / FAVICON_URL は favicon の settings に書いた。MetricLabel は見た目の部品なので段にしていない。"
