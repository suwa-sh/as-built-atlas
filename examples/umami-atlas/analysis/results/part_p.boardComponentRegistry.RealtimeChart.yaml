notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 RealtimeChart (boardComponentRegistry.tsx:243) が指すコンポーネント BoardRealtimeChart (BoardRealtimeChart.tsx:5)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId だけ) を入口のフレームの parameters に書いた。この部品は、描く画面の URL のクエリ (期間、絞り込み) を読まない (フックがクエリを付けずに API を呼ぶ) ので、ほかの部品の入口と違い、parameters に URL の値は無い。登録表のこの項目は componentByEntityType も configFields も defaultProps も持たない (boardComponentRegistry.tsx:243-251) ので、替わる先のコンポーネントも、部品の設定の値も無い。(2) 同じフックから先の木 (useRealtimeQuery → GET /api/realtime/[websiteId] → parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount、getRealtimeData → getRealtimeActivity / getPageviewStats / getSessionStats) は、既にある結果 websites.websiteId_d.realtime から写し、根拠の行は対象のコードで確かめた。その画面にしか無い話 (同じ画面のほかの受け口、地図、セッションの小窓) は、文から外した。この木で API を呼ぶフックは useRealtimeQuery だけ。複数の呼び出し元から呼ばれる処理は getWebsite (getEntity と fetchWebsite) だけで、入口から辿って先に着く getEntity の下 (q_get_website) に書き、fetchWebsite の summary に「経路は同じ」と書いた (fetchWebsite 自身が Redis の I/O を持つので、書き直し (_rw) のフレームは要らない)。(3) 固定の値で閉じている呼び出しは 1 件 (getWebsiteSegment。呼び出しの箇所は segment の枝 request.ts:133 と cohort の枝 :145 の 2 つ)。前の結果 (websites.websiteId_d.realtime) にあったフレーム q_get_segment と ext_prisma_segment_find を書いていない。確かめた 3 つ: (a) 値は木の中のコードに直接書いてある。useRealtimeQuery.ts:10 は get に params を渡さず、既定は空 (useApi.ts:41)、空の params は URL に何も付けない (url.ts:15)。分析リポジトリの決まり (値が HTTP のクエリを通ってサーバー側の分かれ道に効く場合も、木の中に直接書いた値として扱う) に従った。(b) 条件は params.segment / params.cohort の有無だけで決まる。(c) この木で getQueryFilters を呼ぶのは GET realtime の受け口だけで、受け口は query をそのまま渡し (route.ts:34)、segment / cohort を足さない。閉じた呼び出しの名前・値・行は、条件を持つフレーム q_get_query_filters の summary に書いた (フレームに notes が無いため。分析リポジトリの決まりのとおり)。segment / cohort を絞り込みに足す判定 (前の結果では q_get_query_filters の rules) も、この入口では動かないので書いていない。(4) 迷った点と選んだ扱い。(a) 同じ理由 (クエリが付かない) で、getRealtimeActivity / getPageviewStats / getSessionStats の SQL の中で、絞り込みがあるときだけ結合する表 (event_data、session_data、getPageviewStats / getSessionStats の session) と、単位が minute でないときだけ使う ClickHouse の時間ごとの集計表 (website_event_stats_hourly) の読み取りも、この入口からは起きないように見える。ただし、これらは呼び出し (フレーム) ではなく、同じ SQL の文の組み立ての中の分かれ道で、0.4.1 の決まりの文は呼び出しについてだけ書いている。だから、前の結果と同じく I/O として残し、note に「この部品の useRealtimeQuery はクエリを付けずに呼ぶので、絞り込みの条件が付かないように見える」と書いた。(b) checkAuth の CLOUD_MODE (API キーを受け付けるかの切り替え) は、API キーの枝を辿らないこの入口では有無で結果が変わらないので、ほかの部品の入口 (WebsiteChart など) と同じく書いていない。API キーの枝は、フレームにせず rules に 1 行書いた。getQueryFilters の CLOUD_MODE (期間の開始の制限) は書いた。(c) GET realtime の呼び出しは、フックの enabled (websiteId があること) を、必須の props の websiteId で成り立つとして always にした。(d) 受け口は、最近の動きの一覧、国・URL・リファラーごとの数、合計も返すが、この部品が描くのは時系列 (series.views / series.visitors) だけ (RealtimeChart.tsx:27-28)。読み取りは受け口の中で同じように起きるので、getRealtimeActivity とその I/O は書いた。(e) RealtimeChart、PageviewsChart、LoadingPanel は見た目だけの部品なので、フレームにしていない。useTimezone はブラウザに保存した表示のタイムゾーンを読むだけで、サーバーのデータではないので I/O に書いていない (API には送らない)。(f) API_URL と BASE_PATH は、この入口で最初に (そしてただ 1 つ) API を呼ぶフレーム use_realtime に書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(5) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。(6) テストとの対応は、作業定義で選ばれていないので分析していない。 (7) レビューへの対応 (1 回。high 0 件、medium 0 件、low 3 件。すべて直した)。getPageviewStats と getSessionStats に、カスタムイベントと性能の計測を数えない判定を rules で足した。checkAuth の API キーの rules に、CLOUD_MODE が設定されていないときだけという条件と根拠 (api-key.ts:41) を足した。レビューの notes にあった、先頭の notes (2) の「同じ処理が複数の呼び出し元から呼ばれる所は無い」の誤りも直した。"
