summary:
  status: interpretation
  value: "ボードに置く「リアルタイムのグラフ」の部品 (登録表の type: RealtimeChart、コンポーネントは BoardRealtimeChart)。描く側から受け取ったサイトについて、useRealtimeQuery で GET /api/realtime/[websiteId] を 10 秒ごとに呼び、直近 30 分の分ごとの訪問者とページビューをグラフに描く。描く画面の URL の期間や絞り込みは使わない (フックはクエリを付けない)。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは realtime) でサイトを見てよいかを確かめる (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)。getQueryFilters で期間をまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む)、getRealtimeData が getRealtimeActivity (最近の 100 件の動き。website_event と session)、getPageviewStats と getSessionStats (website_event の分ごとの数) を呼んでまとめる。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。受け口は動きの一覧や国ごとの数も返すが、この部品が描くのは時系列だけ。書き込みは無い。ほかの入口へのつながりは無い"
