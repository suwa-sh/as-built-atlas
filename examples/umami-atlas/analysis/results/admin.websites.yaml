summary:
  status: interpretation
  value: "管理者が、すべてのサイトを一覧で見る画面。GET /api/admin/websites を呼び、管理者 (user.isAdmin) のときだけ、削除されていない website を、持ち主の user、チーム (team) とそのオーナー (team_user) 込みで、ページ単位で読む (検索語は name / domain に部分一致。並びは既定で作成日の新しい順、name / domain / createdAt に替えられる)。読んだサイトには share の slug を付ける。検索・並べ替え・ページ送りは、URL のクエリを書き換えて同じ API を呼び直す。行の名前と編集のメニューは /admin/websites/[websiteId] へ、持ち主の欄は /admin/teams/[teamId] か /admin/users/[userId] へ移る。行の削除のメニューは確認の小窓を開き、DELETE と入力して確定すると DELETE /api/websites/[websiteId] を呼ぶ。この API は、管理者か、持ち主か、website:delete の権限を持つチームのメンバーのときだけ、サイトに属する計測のデータ (session_replay_saved / session_replay / heatmap_event / revenue / event_data / session_data / session_link / website_event / session) と report / segment / annotation / share を消し、website を消す (CLOUD_MODE のときは、website を消さずに deleted_at を入れ、Redis の website:* を消す)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)"
  evidence:
    - { file: "src/app/(main)/admin/websites/page.tsx", line: 5 }
    - { file: "src/app/(main)/admin/websites/AdminWebsitesDataTable.tsx", line: 6 }
