summary:
  status: interpretation
  value: "1 つのサイトの保存済みコホート (ある期間にあるページを見た、またはあるイベントを起こしたセッションの集まりの定義) の一覧画面。CohortsDataTable が GET /api/websites/<id>/segments?type=cohort で、type が cohort の segment を読んで表にする (受け口のスキーマが page を落とすので、いつも最初の 20 件。search で名前を絞れる)。追加のフォームは segment を作成 (POST …/segments)、行の編集のフォームは segment を読んで (GET …/segments/<id>) 更新 (POST …/segments/<id>)、行の削除のボタンは segment を削除 (DELETE …/segments/<id>) する。どちらのフォームも type に cohort を付けて送る。フォームの動作の値の入力欄 (LookupField) と、絞り込みの行 (FieldFilters → FilterRecord) は、値の候補を GET …/values で読む (website_event、セッションの列なら PostgreSQL では session。PostgreSQL と ClickHouse のどちらで読むかは CLICKHOUSE_URL で切り替わる)。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。書き込み (作成・更新) は管理者・サイトの持ち主・チームで website:update を持つ人、削除は管理者・サイトの持ち主・チームで website:delete を持つ人だけができる。行の名前は、そのコホートで絞ったサイトの画面 (/websites/<id>?cohort=<id>) へのリンク。上部の WebsiteControls は、この画面が絞り込みと期間の選択を false で渡すので、何も描かない"
  evidence:
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/page.tsx', line: 7}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortsPage.tsx', line: 10}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortsPage.tsx', line: 12}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortsDataTable.tsx', line: 7}
  - {file: src/components/hooks/queries/useWebsiteCohortsQuery.ts, line: 19}
  - {file: 'src/app/api/websites/[websiteId]/segments/route.ts', line: 33}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortEditForm.tsx', line: 44}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortDeleteButton.tsx', line: 19}
  - {file: 'src/app/(main)/websites/[websiteId]/cohorts/CohortsTable.tsx', line: 17}
notes: "プロファイル 0.4.0・skill 0.4.0 での最初の分析。[作り方] 共通の部品と関数 (認証、権限、segment の読み書き、values の受け口、getQueryFilters、getValues) は、ほかの入口の結果 (websites.websiteId_d.funnels、websites.websiteId_d.goals、websites.websiteId_d) の書き方と綴りに合わせ、根拠の行は対象のコードで確かめ直した。[木の書き方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。CohortsPage の中の順は WebsiteControls (10 行) → CohortsDataTable (12 行)。CohortsDataTable の中の順は useWebsiteCohortsQuery (7 行) → CohortAddButton (10 行) → CohortsTable (21 行)。その結果、parseRequest → checkAuth → getUser と canViewSharedWebsiteFilters → canViewWebsite → getEntity / getTeamUser は GET …/segments の下、canUpdateWebsite は POST …/segments の下、canViewWebsiteSection と getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、追加のフォームの LookupField → values の受け口の下になった。[迷った点と選んだ扱い] (1) WebsiteControls の子 (WebsiteFilterButton・WebsiteDateFilter・ExportButton・FilterBar) は、この画面が allowFilter={false}・allowDateFilter={false} を渡し、allowDownload の既定が false なので、描かれない。作業の決まり (成り立たないように見える呼び出しも conditional のフレームにする) に従ってフレームにしたが、中身は辿らず unknown + not_analyzed で閉じた。辿ると、深さ優先の順で、認証や権限の共通の経路が、動かない枝の下に置かれてしまうため。中身は、ほかの入口 (websites.websiteId_d.funnels など) で分析されている。MonthFilter (WebsiteControls.tsx 43 行) は、データにも API にも届かないので、フレームにしていない。(2) CohortEditForm は同じ関数だが、cohortId の有無で呼ぶ URL が違うので、追加 (cohort_edit_form_create) と編集 (cohort_edit_form_edit) に分けた。追加のフォームでも useWebsiteCohortQuery を呼ぶが、cohortId が無いので問い合わせをしない (enabled が false) ため、届く先のある編集のフォームの下にフレームを書いた。(3) GET …/segments は getQueryFilters を websiteId なしで呼ぶ (route.ts 31 行) ので、期間と絞り込みをメモリの中で組み立てるだけで、データを読まない。この呼び出しはフレームにせず、受け口の summary に書いた。websiteId を渡す values の受け口からの呼び出し (サイトと Redis を読む) を、フレーム q_get_query_filters にした。(4) values の受け口と getValues は、LookupField (type が path か event で、website_event だけを読む) と FilterRecord (type が path と event 以外の項目で、PostgreSQL ではセッションの列なら session を読む) で、届く表が違うので、FilterRecord の側を _rw_filter の名前で別に書いた。(5) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (POST …/segments の下の canUpdateWebsite、values の受け口の下の canViewWebsiteSection、DELETE …/segments/[segmentId] の下の canDeleteWebsite、GET …/segments/[segmentId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(6) getWebsiteSegment は、深さ優先の順で最初に着く getQueryFilters の下に書いた (この画面の values の呼び出しは segment / cohort を送らないので、そこでは成り立たないように見える。理由はフレームの note に書いた)。編集・更新・削除の受け口は、同じ関数を呼ぶことを summary に書いた。(7) API_URL と BASE_PATH は、作業の決まりに従って、この入口で最初に API を呼ぶフレーム (use_website_cohorts_query) に 1 回だけ書いた。(8) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(9) checkAuth の API キーの経路 (checkApiKeyAuth) は、作業の決まりのとおり段にせず、checkAuth の rules に 1 行書いた。(10) フォームの入力が空でないことだけの確認 (名前・動作・期間は必須) は、rules に書いていない。(11) 削除の後や保存の後の touch('cohorts') は、ブラウザの中の更新印を書き換えて一覧を読み直させるだけなので、I/O に書いていない。ブラウザの中の保存 (表示の形の localStorage) も I/O に書いていない。(12) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[レビュー] 指摘は 4 件 (medium 2、low 2) で、すべて直した: segment の作成の fields に created_at と updated_at を足した。team の読み取り (関連の条件) を fact にした。絞り込みの行からの getValues の fields に、この欄で選べる項目の列を足した。FieldFilters に、候補を引く期間 (直近 6 か月) のルールを足した。high が無いので、もう一度のレビューはしていない。"
