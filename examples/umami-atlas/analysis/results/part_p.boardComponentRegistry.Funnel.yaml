summary:
  status: interpretation
  value: "ボードに置く「ファネル」の部品 (登録表の type: Funnel)。描く側から受け取ったサイトと、保存された部品の設定の reportId (保存済みのファネル) について、まずファネルの定義を GET /api/websites/[websiteId]/funnels/[funnelId] で読み (report)、種類が funnel で同じサイトのものなら、段ごとの集計を GET /api/websites/[websiteId]/funnels/[funnelId]/stats で読んで描く。集計の受け口は、定義 (report) を読み直して、保存された段と時間枠を検査し、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getFunnel で website_event (段に絞り込みがあれば event_data、URL の絞り込みに応じて session / session_data も) を数える。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。定義の id を渡さないときの GET /api/websites/[websiteId]/funnels/stats も書いたが、この部品からは通らないように見える。どの受け口も、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、ファネルやサイトを見てよいかを確かめる (canViewReport、canViewWebsiteSection。ログインした利用者なら canViewWebsite が website / link / pixel / board / team_user を読む)。DB への書き込みは無い (書くのは、REDIS_URL があるときの Redis の website:* のキャッシュだけ)。部品は Funnel を allowEdit={false} で描くので、編集と削除のメニュー (SavedDefinitionEditButton と、その中の編集フォーム、更新、削除) は辿らない。ほかの入口へのつながりは無い"
