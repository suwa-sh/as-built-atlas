notes: '指示書 0.4.0 とプロファイル 0.4.0 で分析した。(1) 画面を包む枠 ((main) の layout と、そこから描かれる App / TopNav など) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は GET /api/boards/[boardId] の下、getBoard と getTeamUser は canViewBoard の下、canViewWebsite / canViewPixel / canViewLink と getEntity (getWebsite / getLink / getPixel) は POST /api/boards/[boardId] の canViewBoardEntities の下 (BoardEditForm.tsx では、useUpdateQuery の 62 行目が、選択欄の 158 行目より前)、getShare は GET /api/share/id/[shareId] の下。(3) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。このリポジトリの決まりで、external の段までは書かず、確認・設定・ルールも繰り返していない): canUpdateBoard の下の getBoard、canViewPixel の下の getPixel、canViewLink の下の getLink、canViewTeam の下の getTeamUser、canViewSharedWebsite の下の canViewWebsite → getEntity → getWebsite、canViewEntity / canUpdateEntity / canDeleteEntity の下の getEntity → getWebsite、GET /api/pixels/[pixelId]・GET /api/links/[linkId]・GET /api/me/websites の下の parseRequest → checkAuth → getUser。(4) この画面からは条件が成り立たないように見える呼び出しも、指示書のとおり、消さずに conditional で書き、そう見える理由を note に書いた: WebsiteSelect の useLoginQuery からの POST /api/auth/verify (枠がユーザーを得てから画面を描く)、GET /api/me/websites (userId がいつもある)、getAllUserWebsitesIncludingTeamAccess (includeTeams を渡さない)。枠の結果 (layout_l.main_g) は、TopNav の WebsiteSelect で、あとの 2 つをフレームにしていない (届かないものとして省いている) ので、扱いが分かれている。(5) useUpdateQuery の path の分かれ道 (boardId が無ければ POST /boards) は、この画面が boardId を必ず渡すので、フレームにしていない (call の note に書いた)。(6) フレームにしなかったもの: GET /api/config (SharedSharesTable と SimpleShareEditForm の useConfig。ストアに設定値が無いときだけ呼ぶが、枠が読み込み済みで、認証を通らず環境変数を返すだけの受け口。枠の結果と同じ扱い)、useNavigation / useMessages / useModified (URL・翻訳・更新印の小道具)、PageBody / PageHeader / Panel / LoadingPanel / DialogButton / ConfirmationForm / ThemeModeSelector (見た目だけの部品)。(7) checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(8) 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth と /config 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL は API を呼ぶフックとコンポーネントの settings に書いた。引数で行き先が切り替わる一覧の API (teamId の有無) は、interpretation にした。(9) 共有の URL のリンクの行き先を変える設定 (CLOUD_MODE / CLOUD_URL / BASE_PATH) は、links.linkId_d.edit の結果と同じ綴りで、一覧の表のフレームに書いた。クラウドモードのときの行き先は、CLOUD_URL の値がリポジトリから読めないので unknown (not_traceable_in_repo) にした。SimpleShareEditForm が出す共有の URL は、読むだけの欄 (表示だけ) なので、設定にもリンクにも書いていない。DB の接続先の環境変数は、決まりのとおり書いていない。(10) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前だけ (canViewBoard など) と、権限の定数の名前だけ (PERMISSIONS.websiteUpdate など) を書き、条件の説明は note に書いた。GET /api/users/[userId]/websites の確認は、関数になっていないので、コードの式を肯定の形 (auth.user.id === userId) で書いた。管理者はどの確認も素通りするが、管理者であることを求める確認ではないので、role の確認としては書かず、note に書いた。(11) 行の削除の fields は、name が * で use は write とし、条件の列を filter で書いた。Prisma の update は、スキーマの @updatedAt の列 (updated_at) も書くので、fields に入れて note に理由を書いた。(12) テストとの対応は、作業定義で選ばれていないので分析していない。(13) レビューの指摘は low が 3 件で、すべて直した (クラウドモードのときの共有の URL の行き先を links に足した、その行き先を変える設定を足した、getUserWebsites の呼び出しを always にした)。レビューの notes にあった点: GET /api/config は、websites.websiteId_d の結果ではフレームになっている (枠の結果と links.linkId_d.edit ではフレームにしていない。ここは後者に合わせた)。API の URL の前に付く BASE_PATH は、admin の結果では API を呼ぶフックの settings に書かれているが、ここでは枠の結果に合わせて書いていない (どちらにそろえるかは、人が決める)。共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ。'
