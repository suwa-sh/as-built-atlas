summary:
  status: interpretation
  value: 1 つのボードの設定を編集する画面。URL の boardId で GET /api/boards/[boardId] を呼び、board を読んで名前と説明を出す。フォームで名前・説明・対象 (種類が website / pixel / link のボードだけ。種類そのものは変えられない) を直し、保存で POST /api/boards/[boardId] を呼んで board を更新する。更新の前に、サーバーが、ボードが参照するサイト・ピクセル・リンクを本人が見られるか (website / link / pixel / team_user を読む) と、Funnel / Goal の部品が指す保存済みのレポートが正しいか (report を読む) を確かめる。対象の選択欄は、選ばれているもの 1 件 (GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId]) と、選べるものの一覧 (URL に /teams/<id> があればチームのもの、無ければ本人のもの) を読む。画面の下半分は共有の管理で、GET /api/boards/[boardId]/shares でこのボードの share の一覧を読み、追加 (POST /api/boards/[boardId]/shares で share を作る)、編集 (GET / POST /api/share/id/[shareId] で share を読んで更新する)、削除 (DELETE /api/share/id/[shareId] で share を消す) ができる。権限は各 API が確かめる (ボードを見るのは持ち主かチームのメンバー、更新と共有の追加・編集は持ち主か website:update を持つチームのメンバー、共有の削除は website:delete。管理者はすべて可)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
