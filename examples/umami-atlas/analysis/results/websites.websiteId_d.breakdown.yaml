  - {file: src/queries/sql/breakdown/getBreakdown.ts, line: 25}
  - {file: src/queries/sql/breakdown/getBreakdown.ts, line: 98}
notes: "(1) 画面を包む枠 (ルート、(main)、websites/[websiteId] の layout) は別の入口なので辿っていない。(2) 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。BreakdownPage の中の順は、useBreakdownQuery (18 行) → WebsiteControls (24 行) → FieldsButton (26 行) → Breakdown (34 行)。その結果、parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、どれも GET …/breakdown の下にある。(3) Breakdown.tsx も同じ useBreakdownQuery を同じ引数で呼ぶ (問い合わせのキーが同じなので、TanStack Query が 1 回の呼び出しにまとめると読んだ)。Breakdown の呼び先はこれだけで、終端になるので、いちばん早い呼び先を、読み書きを持つ最初のフレーム (checkAuth) まで、もう一度書いた (use_breakdown_query_rw から q_check_auth_rw)。同じように、呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canViewSharedWebsite、canViewSharedWebsiteFilters、canUpdateWebsite) は、getWebsite まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(4) 設定 API_URL と BASE_PATH は、決まりのとおり、この入口で最初に API を呼ぶフレーム (use_breakdown_query) に 1 回だけ書いた。(5) 共通の絞り込みの部品 (WebsiteFilterButton のダイアログと、セグメントとして保存のフォームの中の入力欄) は、unknown + not_analyzed で閉じた。サイトの多くの画面が同じものを使う部品で、この画面に固有の処理ではないため (websites.websiteId_d の結果が辿っている)。(6) 集計の SQL の列のうち、選んだ項目の列は、項目の決まった一覧 (fieldsParam) と FILTER_COLUMNS の対応から読めるので、fields に全部書いた (実際に読むのは選んだ項目の列だけ)。URL の絞り込みで parseFilters が実行時に足す条件の列は、書かずに note に書いた。(7) URL のイベントのプロパティの絞り込み (epf) は、useFilterParameters が /events で終わる画面でだけ付けるので、この画面からは送られないと読んだ。event_data の読み取りは、消さずに interpretation で書き、note に理由を書いた。(8) 項目の選択、期間の選択、絞り込みを消す操作は、同じ画面の状態か URL のクエリを書き換えるだけなので、links に書いていない (ほかの入口へのつながりは無かった)。(9) ブラウザの中の保存 (期間の localStorage など) と、DownloadButton の CSV の作成は、I/O に書いていない。(10) checkAuth の API キーの枝は、決まりのとおりフレームにせず、rules に 1 行書いた。(11) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(12) レビューの指摘は 5 件 (medium 1、low 4) で、すべて直した: Redis の auth:* の読み取りを interpretation にした (キーの形は saveAuth から読み取ったもの)。生の SQL を実行する 2 つの external に DATABASE_REPLICA_URL を足した。プロパティの絞り込みの読み取り 4 件に data_type を足した。絞り込みのボタンの note の行番号を、この画面で描く欄 (FilterEditForm.tsx 178 行) に直した。high が無いので、もう一度のレビューはしていない。"
