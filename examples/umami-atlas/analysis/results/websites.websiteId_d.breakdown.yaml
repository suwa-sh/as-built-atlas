summary:
  status: interpretation
  value: "1 つのサイトのアクセスを、選んだ項目 (既定はパス) の値の組ごとに集計する画面 (タイトルは Insights)。BreakdownPage と、その中の表 Breakdown が、どちらも useBreakdownQuery で GET /api/websites/<id>/breakdown を呼ぶ (同じ問い合わせのキーなので、1 回の呼び出しにまとまる)。受け口は、ページビューのイベントを website_event から読み、項目の値ごとに views・visitors・visits・bounces・totaltime を集計して、上位 500 行を返す。選んだ項目がセッションの列 (ブラウザや国など) なら、PostgreSQL では session も読む。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。項目の選択 (FieldSelectForm) と CSV のダウンロード (DownloadButton) は、ブラウザの中だけで動く。上部の WebsiteControls は、期間の選択 (daterange)、絞り込みの表示 (保存済みの segment の読み取りと、セグメントとして保存する書き込み)、絞り込みのボタンを描く。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読む。集計の前に、getQueryFilters がサイト (Redis の website:* か website) を読んで期間の開始を切り詰め、URL に segment / cohort があれば segment も読む"
  evidence:
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/page.tsx', line: 7}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/page.tsx', line: 11}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 18}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 24}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 34}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/Breakdown.tsx', line: 17}
