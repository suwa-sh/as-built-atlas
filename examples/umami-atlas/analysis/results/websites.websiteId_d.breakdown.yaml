summary:
  status: interpretation
  value: "1 つのサイトのアクセスを、選んだ項目 (既定はパス) の値の組ごとに集計する画面 (タイトルは Insights)。BreakdownPage と、その中の表 Breakdown が、どちらも useBreakdownQuery で GET /api/websites/<id>/breakdown を呼ぶ (同じ問い合わせのキーなので、1 回の呼び出しにまとまる)。受け口は、ページビューのイベントを website_event から読み、項目の値ごとに views・visitors・visits・bounces・totaltime を集計して、上位 500 行を返す。選んだ項目がセッションの列 (ブラウザや国など) なら、PostgreSQL では session も読む。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。項目の選択 (FieldSelectForm) と CSV のダウンロード (DownloadButton) は、ブラウザの中だけで動く。上部の絞り込みと期間の操作 (WebsiteControls) は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。受け口は parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / share / link / pixel / board / team_user を読む。集計の前に、getQueryFilters がサイト (Redis の website:* か website) を読んで期間の開始を切り詰め、URL に segment / cohort があれば segment も読む"
  evidence:
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/page.tsx', line: 7}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/page.tsx', line: 11}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 18}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 24}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/BreakdownPage.tsx', line: 34}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/breakdown/Breakdown.tsx', line: 17}
  - {file: 'src/app/api/websites/[websiteId]/breakdown/route.ts', line: 17}
  - {file: src/queries/sql/breakdown/getBreakdown.ts, line: 25}
  - {file: src/queries/sql/breakdown/getBreakdown.ts, line: 98}
notes: "(0) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、64 段) を出発点にし、変えた所は対象のコードで確かめた。BreakdownPage (breakdown_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は BreakdownPage.tsx:5 の import と :24 の描く行) を書いた。WebsiteControls の中 (WebsiteFilterButton、WebsiteDateFilter → daterange、FilterBar → segments/[segmentId] と SegmentEditForm → POST segments、その下の権限の確認の書き直し) の 27 段を外し、段の数は 64 から 37 になった。BreakdownPage は websiteId だけを渡す (ほかは部品の既定のまま) ことを breakdown_page の summary に書いた。外した木の下にだけあった共通の段は無かった (共通の段は前から GET …/breakdown の下にあった) ので、移した段は無い。外した段を指していた文 (getWebsite・getTeamUser・canViewWebsite・getWebsiteSegment の summary の「… も同じ関数を呼ぶ」、ClickHouse の直帰の note) は直した。決まりにそろえた所: canViewWebsite の guards を、ほかの入口の結果 (part_p.shared_a.WebsiteControls、websites.websiteId_d) と同じ 2 件 (role: user.isAdmin と ownership: canViewWebsite) にし、共有トークンで許す分岐 (前は kind: other の 1 件) は ownership の note に入れた。checkAuth の settings (CLOUD_MODE、REDIS_URL) と、API キーの枝の rules は前から書いてある。結果の target は作業定義と同じ (clone_path も写した)。(1) 画面を包む枠 (ルート、(main)、websites/[websiteId] の layout) は別の入口なので辿っていない。(2) 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。BreakdownPage の中の順は、useBreakdownQuery (18 行) → WebsiteControls (24 行、embed で止める) → FieldsButton (26 行) → Breakdown (34 行)。その結果、parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、どれも GET …/breakdown の下にある。(3) Breakdown.tsx も同じ useBreakdownQuery を同じ引数で呼ぶ (問い合わせのキーが同じなので、TanStack Query が 1 回の呼び出しにまとめると読んだ)。Breakdown の呼び先はこれだけで、終端になるので、いちばん早い呼び先を、読み書きを持つ最初のフレーム (checkAuth) まで、もう一度書いた (use_breakdown_query_rw から q_check_auth_rw)。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(4) 設定 API_URL と BASE_PATH は、決まりのとおり、この入口で最初に API を呼ぶフレーム (use_breakdown_query) に 1 回だけ書いた。(5) 前の結果が unknown + not_analyzed で閉じていた共通の絞り込みの部品 (WebsiteFilterButton と SegmentEditForm の中の入力欄) は、WebsiteControls の中なので、この入口からは外れた (unknown は 0 件になった)。(6) 集計の SQL の列のうち、選んだ項目の列は、項目の決まった一覧 (fieldsParam) と FILTER_COLUMNS の対応から読めるので、fields に全部書いた (実際に読むのは選んだ項目の列だけ)。URL の絞り込みで parseFilters が実行時に足す条件の列は、書かずに note に書いた。(7) URL のイベントのプロパティの絞り込み (epf) は、useFilterParameters が /events で終わる画面でだけ付けるので、この画面からは送られないと読んだ。event_data の読み取りは、消さずに interpretation で書き、note に理由を書いた。(8) 項目の選択は、同じ画面の状態を書き換えるだけなので、links に書いていない。links は WebsiteControls への embed の 1 件だけ (ほかの入口へのつながりは無かった)。(9) ブラウザの中の保存 (期間の localStorage など) と、DownloadButton の CSV の作成は、I/O に書いていない。(10) checkAuth の API キーの枝は、決まりのとおりフレームにせず、rules に 1 行書いた。(11) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(12) レビューへの対応 (1 回。high 0 件、medium 0 件、low 2 件。どちらも直した): BreakdownPage の summary に、共有トークンが allowFilter を false にしたときは絞り込みのボタンと帯を出さない条件を足し、根拠に WebsiteControls.tsx の 15 行と 28 行を足した。useBreakdownQuery の summary に、同じ条件で URL の絞り込みを送らないことを足し、根拠に useFilterParameters.ts の 13・19・35 行を足した。レビューの notes の気づきに合わせ、フレームの名前を、ほかの結果の多くと同じ getQueryFilters → setWebsiteDate にした。high が無いので、もう一度のレビューはしていない。"
