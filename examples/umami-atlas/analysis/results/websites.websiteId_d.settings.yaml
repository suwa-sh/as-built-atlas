summary:
  status: interpretation
  value: "サイト 1 件の画面の下で、そのサイトの設定を見て編集する画面 (/websites/[websiteId]/settings)。page は同じフォルダの SettingsPage を描き、SettingsPage は設定メニューの画面と同じ部品 WebsiteSettingsPage を描く。URL の websiteId で GET /api/websites/[websiteId] を呼んで website と share を読み、5 つの区画を出す。(1) 名前とドメインの編集 (POST /api/websites/[websiteId] で website を update)。(2) 計測タグの表示 (データを読まない)。(3) リプレイとヒートマップの設定 (同じ POST で replay_config と recorder_enabled を update。クラウドモードでは GET /api/auth/subscription で Redis の team:* / account:* から契約を読み、機能が無ければ案内だけを出す)。(4) 共有 URL の一覧 (GET /api/websites/[websiteId]/shares で share を読む) と、追加 (POST 同 URL で share を create)、編集 (GET / POST /api/share/id/[shareId] で share を read / update)、削除 (DELETE 同 URL で share を delete)。(5) 譲渡・リセット・削除の操作。リセット (POST /api/websites/[websiteId]/reset。サイトの計測データ 9 テーブルを消し、website の reset_at を入れる) と削除 (DELETE /api/websites/[websiteId]。計測データに加えて report / segment / annotation / share を消し、website を消す。クラウドモードでは論理削除)。譲渡 (自分がオーナーかマネージャーのチームがあるときだけ押せる。POST /api/websites/[websiteId]/transfer。canTransferWebsiteToUser / canTransferWebsiteToTeam で確かめ、website の user_id と team_id を update して持ち主を付け替える)。削除と譲渡のあとは /websites へ移る。どの API も checkAuth でログインを確かめ (user を読む。Redis が有効なら auth:* も読む)、サイトの持ち主・チームの役割・管理者かで権限を確かめる (管理者でなければ website / share / link / pixel / board / team_user を読む)。ログイン中のユーザーは useLoginQuery から得て (ストアに無いときだけ POST /api/auth/verify)、所属チームを GET /api/users/[userId]/teams で読む"
