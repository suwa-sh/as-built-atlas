notes: "(1) page は同じフォルダの SettingsPage を描き (page.tsx:2、:7)、SettingsPage ('use client') は設定メニューの画面 (/settings/websites/[websiteId]) の部品 WebsiteSettingsPage を描く (SettingsPage.tsx:2、:5)。WebsiteSettingsPage から先の部品の木は、その入口の結果 (settings.websites.websiteId_d) を出発点にし、対象のコードで確かめて写した。この入口との違いは、入口のフレームと SettingsPage のフレームだけ。URL は /admin で始まらず /teams/ も含まないので、WebsiteData の譲渡の操作と、押せるかの条件は同じになる。祖先の layout (ルート、(main)、websites/[websiteId]) は別の入口なので辿っていない。websites/[websiteId] の layout もサーバー側で getWebsite でサイトを読む (layout.tsx:15) が、この page の側の WebsiteSettingsPage も自分で WebsiteProvider を描いて useWebsiteQuery を呼ぶので、プロファイルの決まり (枠と同じ部品を画面も自分で描くときは、画面の側にも書く) に従い、画面の側にも書いた。 (2) フレームにしなかったもの: WebsiteSettingsHeader / PageHeader / Panel / DialogButton / SharedSharesTable / TypeConfirmationForm / ActionForm (見た目だけ)、WebsiteTrackingCode (設定から計測タグの文字列を組み立てて表示するだけ)、useWebsite (WebsiteContext を読むだけ)、useNavigation、useMessages、useModified (ブラウザの中の更新印)、useApi (URL とヘッダーを組み立てるだけ)、useConfig (GET /api/config。分析リポジトリの決まりでフレームにせず、そこから得る cloudMode は使うフレームの settings に CLOUD_MODE として書いた)。WebsiteSettingsHeader の戻るリンクは、それを描く WebsiteSettingsPage の links に書いた。同じフォルダの constants.ts (共有の区画の一覧) は ShareEditForm が使う定数。SharesTable.test.tsx はテストで、テストとの対応は分析していない。 (3) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は GET /api/websites/[websiteId] (route.ts:22) の下。getWebsite は、canViewSharedWebsite → canViewWebsite → getEntity (entity.ts:6) の下 (route.ts:34 より先に着く)。getTeamUser は canViewWebsite (website.ts:35) の下。canUpdateWebsite と updateWebsite と createShare は POST /api/websites/[websiteId] の下。getShare は GET /api/share/id/[shareId] の下。ShareEditForm は WebsiteShareForm の追加ボタン (WebsiteShareForm.tsx:32) の下。useLoginQuery と useUserTeamsQuery は WebsiteData の下。deleteWebsiteDependentData は resetWebsite の下。 (4) 同じ関数でも、届く先が違うものは分けて書いた: useUpdateQuery (URL が /websites/<id>、/transfer、/reset の 3 つ)、useDeleteQuery (/share/id/<id> と /websites/<id>)、pagedQuery の中の findMany (share と team)、Redis の get (auth:*、team:*、account:*)。updateWebsite は届く先が同じ website なので 1 つにし、呼び出し元ごとに書く列が違うので、I/O を 2 件に分けた。 (5) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id が _rw で終わるフレーム。external の段までは書かず、確認・設定・ルールも繰り返していない): canUpdateWebsite / canDeleteWebsite / canTransferWebsiteToUser / canTransferWebsiteToTeam の下の getWebsite、canViewEntity / canUpdateEntity / canDeleteEntity の下の getEntity → getWebsite、canViewAuthenticatedWebsite の下の canViewWebsite → getEntity → getWebsite、canViewTeam の下の getTeamUser、POST /api/websites/[websiteId]/shares の下の parseRequest → checkAuth。 (6) この入口からは条件が成り立たないように見える呼び出しは、消さずに conditional で残して note に理由を書いた: POST /api/websites/[websiteId] の中の deleteSharesByEntityId と createShare (この画面は shareId を送らない)。 (7) 設定: API_URL と BASE_PATH は、分析リポジトリの決まりに従い、入口から辿る順で最初に API を呼ぶ useWebsiteQuery (GET /websites/<id>。/auth で始まらないので API_URL も効く) に 1 回だけ書いた。CLOUD_MODE は、ブラウザ側では GET /api/config の cloudMode として届く (config/route.ts:15)。動きが変わる段 (WebsiteReplaySettings、useSubscription、SharesTable、checkAuth、resetWebsite、deleteWebsite) に書いた。計測タグや共有 URL の表示だけを変える設定 (CLOUD_URL、TRACKER_SCRIPT_NAME) は、処理の流れも読み書きの相手も変えないので書いていない。GET /api/auth/subscription の fetchTeam / fetchAccount は、Redis が有効かを確かめずに読む (load.ts:43、:49) ので、REDIS_URL を設定として書いていない。 (8) checkAuth の API キーの枝 (auth.ts:74-75) は、分析リポジトリの決まりに従い、フレームにせず rules に 1 行書いた (ブラウザが付けるのはログインのトークン。useApi.ts:28)。 (9) 権限の確認の値は、分析の癖の決まりにそろえた (管理者は user.isAdmin、持ち主・所属は確認する関数の名前、権限は定数の名前)。GET /api/users/[userId]/teams の本人の確認は、関数が無く受け口に直接書いてあるので、式 (auth.user.id === userId) を書いた (設定メニューの画面の結果と同じ)。各権限の関数の先頭にある「ユーザーがいなければ許さない」は、ログイン済みの確認 (checkAuth) と同じなので書いていない。 (10) Redis の team:* と account:* は、読む側だけがこのリポジトリにある。項目の名前は、受け口が normalizeSubscription で読むものを書いた。website:* は、値 (website の行) をまるごと書く・消すので、項目は * にした。 (11) fields の列名は schema.prisma の @map で確かめた (@map が無い列は属性名と同じ)。行の削除は、name が * で use は write とし、条件の列を filter で書いた。website と share の update / create には、Prisma の @updatedAt が自動で書く updated_at を足した。 (12) テストとの対応は、作業定義で選ばれていないので分析していない。 (13) レビューの指摘は low 1 件 (POST /api/websites/[websiteId] の検査のルールに shareId の 50 文字までが無い) で、直した。レビューの notes (4)(d) の「within に layout_l.main_g.websites.websiteId_d が無い」は、entry-list.yaml のこの入口の within に含まれていることを確かめたので、対応していない。"
