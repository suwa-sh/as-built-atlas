notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (共有の画面 share/[slug]/[[...path]] の page) と、外側のルートの layout は別の入口なので辿らない。(2) GET /api/share/[slug] は認証の検査をしない。route.ts は parseRequest も checkAuth も import せず (route.ts:1-10)、GET は slug で share を読むところから始める (route.ts:130-133)。useApi はログイントークンを Bearer で付けて送るが、この受け口は見ない。だから canViewWebsite / canViewPixel / canViewLink は、board の持ち主の user から組み立てた auth (共有トークン無し) で呼ばれる。その user が管理者なら、データを読まずに見てよいとする。(3) 同じ処理の置き場 (呼び出し行のファイルのパスの辞書順、同じなら行番号順): getWebsite / getPixel / getLink / getBoard は src/app/api/share/[slug]/route.ts の呼び出し (src/lib/entity.ts と src/permissions/… より早い) の下に 1 回だけ書いた。getWebsite は route.ts:91 と :161、getPixel は :95 と :165、getLink は :99 と :169 から呼ばれ、いちばん早い行を call の根拠の先頭にした。getTeamUser は permissions/link.ts:34 (pixel.ts:34 と website.ts:35 より早い) の下に書いた。canViewPixel は呼び先がすべて他の下にあり終端になるので、最も早い呼び出し getPixel (permissions/pixel.ts:23) を書き直した。getEntity も同じ理由で、最も早い呼び出し getWebsite (entity.ts:6) を書き直した。(4) route.ts の中の補助の関数 (getAccountId、getWhiteLabel、filterEntityIds、getTeamUserIds、filterBoardEntityIdsForShare) は GET からだけ呼ばれる同じファイルの関数なので、GET のフレームにまとめた。それらが直接書く Prisma と Redis の呼び出しは GET の I/O にした。(5) フレームにしなかったもの: getBoardEntityIds (board の parameters から website・pixel・link の id を集める計算だけ。I/O 無し)、createToken (jsonwebtoken の jwt.sign で共有トークンを作る。jwt.ts:5。鍵は APP_SECRET か DATABASE_URL のハッシュ。crypto.ts:57。データに触れない)、Loading (UI ライブラリの部品)、router.replace (next/navigation。節への転送だけ)。(6) setShareData は zustand の store (ブラウザのメモリ) に書くだけで、サーバーのデータではないので I/O に書かない。(7) pixel と link の共有では、返すデータの websiteId にも対象の id を入れている (route.ts:167 / :172)。(8) URL の接頭辞: 環境変数 apiUrl があるとその URL に向く (src/lib/api-url.ts:39)。既定 (apiUrl 無し) で basePath + /api の同じリポジトリの route に当たるので、フックから route への call は interpretation にした。(9) レビューの指摘 3 件 (どれも low) を直した: board・pixel・link の読み取りの note に、board の持ち主が user のときの経路 (canViewWebsite の getEntity が entity.ts:7-9 で link・pixel・board も読む、canViewLink が link.ts:23 で link を読む) を書き足した"
