summary:
  status: interpretation
  value: "共有リンク (/share/<slug>) の画面を包む枠。URL の slug を ShareProvider に渡す。ShareProvider はブラウザ側で GET /api/share/<slug> を呼び、共有の定義を読む。受け口はログインの確認をせず、share を slug で 1 件読み、共有の種類 (website / pixel / link / board) ごとに対象を読む。board のときは board に載った website・pixel・link のうち、board の持ち主 (team なら team とその構成員の持ち物、user ならその user が見てよいもの) だけに絞る。そのうえで共有のトークン (JWT) を作り、持ち主の id が決まって Redis が有効 (REDIS_URL あり) なら white-label:<id> の設定を読んで返す。ブラウザは返った共有データとトークンを store に入れ、以後の API 呼び出しに共有トークンのヘッダーを付ける。枠の動きの条件: 共有データが揃い store のトークンと一致するまでは Loading を出し children を描かない。共有が見つからなければ何も描かない。website の共有で、許された節 (parameters で true のもの) が overview 以外の 1 つだけ、かつ今の URL の段が空か overview なら、/share/<slug>/<その節> へ router.replace で移る。枠を外す (slug が変わる) ときは store の共有データを消す"
