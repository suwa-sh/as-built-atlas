notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (共有の画面 share/[slug]/[[...path]] の page) と、外側のルートの layout は別の入口なので辿らない。(2) 権限の確認 (guards) は 1 件も書いていない。GET /api/share/[slug] は、依頼した人の認証も権限も確かめない (route.ts は parseRequest も checkAuth も import せず、GET は slug で share を読むところから始まる。route.ts:1-10、130-133)。canViewWebsite / canViewPixel / canViewLink は呼ばれるが、確かめる相手は依頼した人ではなく board の持ち主の user (route.ts:114-121 で組み立てた auth。共有トークン無し) で、結果は id を絞るのに使うだけで処理を止めない。そのため guards ではなく rules (decision) に書いた。(3) 同じ処理の置き場は、入口から辿る順 (コードに書いてある順、深さ優先) で最初に着いた呼び出し元にした。getBoard は route.ts:148、getWebsite / getPixel / getLink は route.ts:91 / :95 / :99 (GET が :156 で呼ぶ filterBoardEntityIdsForShare の中) が最初なので、GET のフレームの下に 1 回だけ書いた (route.ts:161 / :165 / :170 と getEntity からの呼び出しは足していない)。getTeamUser は canViewWebsite (permissions/website.ts:35。route.ts:124 から) が最初なので、その下に書いた。(4) 終端を満たすための書き直し: getEntity (呼び先 4 つがすべて GET の下にある) には最も早い呼び出し getWebsite (entity.ts:6) を、canViewPixel には getPixel (permissions/pixel.ts:23) を、canViewLink には getLink (permissions/link.ts:23) を、ライブラリの呼び出しまでもう一度書いた。この 3 か所の I/O は、GET の下の同じ関数の I/O と重なる。(5) route.ts の中の補助の関数 (getAccountId、getWhiteLabel、filterEntityIds、getTeamUserIds、isOwnedByTeam、filterBoardEntityIdsForShare) は GET からだけ呼ばれる同じファイルの関数なので、GET のフレームにまとめた。それらが直接書く Prisma と Redis の呼び出しは GET の I/O にし、ライブラリの呼び出しは行ごとに external のフレームにした。(6) フレームにしなかったもの: useApi (API クライアントのフック。URL の接頭辞とヘッダーを付けるだけ)、getBoardEntityIds (board の parameters から id を集める計算だけ。I/O 無し)、createToken (jsonwebtoken で共有トークンを作る。データに触れない)、Loading (UI ライブラリの部品)、router.replace (next/navigation。節への転送。links に書いた)、src/lib/redis.ts の包み UmamiRedisClient.get (route から external のフレームへ直接つないだ)。(7) setShareData は zustand の store (ブラウザのメモリ) に書くだけで、サーバーのデータではないので I/O に書かない。(8) pixel と link の共有では、返すデータの websiteId にも対象の id を入れている (route.ts:167 / :172)。(9) URL の接頭辞: 環境変数 API_URL (next.config.ts:14 で読み、:215 で process.env.apiUrl として埋める) があるとその URL に向く (src/lib/api-url.ts:38-44)。既定 (API_URL 無し) で basePath + /api の同じリポジトリの route に当たるので、フックから route への call は interpretation にした。BASE_PATH は URL の前に付くだけで相手を変えないので settings に書いていない。(10) links: router.replace の行き先は式 (`/share/${slug}/${allowedSections[0]}`) だが、節の名前は ALL_SECTION_IDS (ShareProvider.tsx:28-43) から読めるので、overview 以外の 13 件を 1 件ずつ書いた。どれも同じ入口 share.slug_d.path_o に当たる。(11) getTeamUser の where は team.deleted_at も条件にするので、team の読み取りを別の I/O として書いた (列は条件だけ)。(12) getWebsite の中の website が無いときの早い return (website.ts:91) は打ち切りとみなし、share.findFirst の呼び出しは always にした。canViewWebsite / canViewPixel / canViewLink の先頭の「管理者なら許す」は打ち切りではなく分かれ道とみなし、その後ろの呼び出しを conditional にした"
