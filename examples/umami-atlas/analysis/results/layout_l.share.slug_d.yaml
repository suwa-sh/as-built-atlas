    - { file: src/components/hooks/queries/useShareTokenQuery.ts, line: 19 }
    - { file: src/components/hooks/useApi.ts, line: 24 }
    - { file: "src/app/api/share/[slug]/route.ts", line: 133 }
    - { file: "src/app/api/share/[slug]/route.ts", line: 147 }
    - { file: "src/app/api/share/[slug]/route.ts", line: 156 }
