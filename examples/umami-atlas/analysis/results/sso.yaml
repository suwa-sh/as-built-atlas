notes: "(1) データに届かない画面なので、プロファイルの決まりのとおり、最後に頼るライブラリ (next/navigation のルーター) を external のフレームにして閉じた。I/O は無い。router.push は 2 か所 (SSOPage.tsx:22 と :27) あり、ライブラリを呼ぶ行が違うので、external のフレームを 2 つに分けた。(2) setClientAuthToken (src/lib/client.ts:8) は、トークンを localStorage の umami.auth に JSON で書くだけ (src/lib/storage.ts:3)。ブラウザの中の保存なので、I/O にもフレームにもせず、summary に書いた。(3) links: / への移動は root_r に当たる (fact)。router.push(url) の行き先はクエリの値で決まるので、式のまま target に url と書き、unknown (dynamic_dispatch) にした。範囲の中に /sso へ移る箇所は見つからなかった (src の下で sso を探して、この画面と /api/auth/sso の契約のファイルだけ)。だれが url と token を付けてこの画面を開くかは、リポジトリからは読めない。(4) rules: 戻り先の検査 (isSafeRedirectUrl) を validation として書いた。url と token の両方があるかの確認は、入力が空でないことだけの確認なので rules に書かず、external の call の note に書いた。(4b) レビューの low の指摘 1 件 (router.push(url) の when) を直した: 手前の経路は入力の誤りで打ち切るものだけなので always にした。/ へ移る router.push は、打ち切りの経路そのものなので conditional のまま。(5) 権限の確認・設定は、この画面には無い (page.tsx の 10 行と SSOPage.tsx の 32 行をすべて読んだ)。BASE_PATH は、ルーターが URL の前に付けるだけで、この画面の動きも行き先の入口も変えないので settings に書いていない (boards.create の結果と同じ扱い)。(6) 画面を包む枠 (src/app/layout.tsx) の処理は、枠の入口 (layout_l) の結果にあるので辿っていない。(7) 作業定義に analysis.tests が無いので、テストとの対応は分析していない"
