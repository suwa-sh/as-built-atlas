summary:
  status: interpretation
  value: "外から渡されたログインのトークンを受け取って、指定の画面へ移る画面 (/sso?url=<戻り先>&token=<トークン>)。ブラウザ側で動き、読み込み中の表示だけを出す。URL のクエリに url と token の両方があるときだけ、url が同じサイトの中の相対パス (/ で始まり、// で始まらず、: を含まない) かを確かめ、そうでなければ / へ移る。そうなら token をブラウザの localStorage (umami.auth) に保存してから url へ移る。url か token が無ければ何もしない (読み込み中の表示のまま)。サーバーのデータは読まない・書かない (トークンの保存はブラウザの中だけ)"
