"notes": "(1) この入口は、共有の部品 WebsiteControls を、別の入口に分けたときに新しく足したもの (前の結果は無い)。木は、同じ部品を描く画面の結果 (websites.websiteId_d.events。その画面で WebsiteControls の下に 108 段) を出発点にし、部品の入口の決まりに合わせて書き直した。根拠の行と内容は、対象のコードで確かめ直した。(2) 描く側から受け取る値で動きが変わる所は、候補をすべて辿って conditional にした (プロファイルの「共有の部品を分析するとき」)。期間の部品 (allowDateFilter)、絞り込みのボタンと帯 (allowFilter と共有の設定)、ダウンロードのボタン (allowDownload。描く側は、いまはどれも渡さないが、部品の入口からはそれを理由にしない)、イベントのプロパティのタブ (描く画面のパスが /events で終わるとき)、セグメント・コホート・セッションのプロパティのタブ (websiteId があり、パスに /pixels も /links も無いとき)。MonthFilter と、比べる期間の選択 (allowCompare) は、URL のクエリを書き換えるだけで、データを読まないので、フレームにせず、入口のフレームの summary と parameters に書いた。(3) 迷った点と選んだ扱い。(a) websiteId は型の上では省略でき、API を呼ぶフックは websiteId が無ければ呼ばない。描く側は、どれも websiteId を渡す (サイトの画面は URL の段、ボードの BoardControls は id が無ければ描かない。BoardControls.tsx:15) が、部品の入口の決まり (「どの画面も、その値を渡さない」を理由にしない) を、逆向き (どの画面も渡す) にも当てはめ、websiteId で止まるフックの API の呼び出し (values、daterange) を conditional にした。BoardControls の確かめは、描く側が描く前に確かめている条件として前提に使えるが、サイトの画面は確かめていない (URL の段なので、いつもある) ので、前提に使わなかった。(b) GET values の getWebsiteSegments の枝 (route.ts:48): 部品が送る type は、useFields の項目か、URL の絞り込みのキー (FILTER_COLUMNS に当たるもの) で、どちらにも segment / cohort は無い。ただし URL から来る値を固定の一覧で絞っている所なので、プロファイルの決まり (固定の一覧で絞る所は、閉じた扱いにしない) に従い、conditional で辿り、届かないように見えることを note に書いた。もう一方の枝 (getQueryFilters と getValues) も、同じ if の反対側なので conditional にした。(c) 受け口 export が集計の関数に渡す type は固定の値 (path / referrer、browser / os / device / country) なので、集計の関数の fields には、その type に当たる列だけを書き、届かない type の扱い (entry / exit / fullPath / language / region / city) のルールは書かなかった (1 つの SQL の中の部分なので、フレームは分けない)。(d) タブを選ぶまで中身を描くかどうかは UI ライブラリ (Tabs / TabPanel) の動きで、リポジトリからは読めないので、描く条件だけで conditional にした。(4) 共通の段は、分析リポジトリの決まりのとおりに書いた。checkAuth に CLOUD_MODE (と REDIS_URL) の設定と、API キーの枝のルールを 1 行。canViewWebsite と canUpdateWebsite に、持ち主の確認 (ownership) と別に、管理者の確認 (role: user.isAdmin)。API_URL と BASE_PATH は、入口から辿る順で最初に API を呼ぶ useWebsiteValuesQuery にだけ書いた。(5) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書いた。WebsiteControls の中では、絞り込みのボタン (WebsiteControls.tsx:35) が期間 (:40)、ダウンロード (:42)、帯 (:46) より先なので、parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite、getQueryFilters は、GET values の下にある。呼び先がすべてほかの呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、いちばん早い呼び出しを、読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>)。書き直したフレームには、権限の確認・設定・ルールを繰り返していない (6) レビューへの対応 (指摘は low 5 件)。直した: 入口のフレームの parameters に、アプリの状態から読むタイムゾーンと表示の言語を足した。FilterBar を描く条件に、描く側の allowFilter を足した。受け口 export の、CSV の数式の注入を防ぐ処理を rules に足した。直さなかった: (a) getValues の fields に、値を数える列を書いていない点。列は type から FILTER_COLUMNS で決まり、候補は読めるが、同じ受け口を書いたほかの入口の結果 (websites.websiteId_d.events など) も「実行時に決まる」として書いていないので、綴りと集計をそろえるため、そのままにした (直すなら入口をまたいで直す)。(b) 権限の確認だけのフレーム (canViewSharedWebsiteFilters / canViewSharedWebsite / canViewAuthenticatedWebsite / canUpdateWebsite) の下の書き直しの段 (_rw) は、確認を持つフレームが既に終端の決まりを満たすので、要らないという指摘。ほかの入口の結果も同じ書き方で、分析リポジトリの決まり (木の書き方の 1 つ目) もこの書き方を前提にしているので、この入口だけでは変えなかった (取りまとめ役に、決まりの側で決めることを報告する)"
