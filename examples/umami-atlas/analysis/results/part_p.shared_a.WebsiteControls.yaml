"summary":
  "status": "interpretation"
  "value": "サイトの画面の上に並ぶ操作の列 (共有の部品)。描く側から受け取る値 (websiteId と、allowFilter / allowBounceFilter / allowDateFilter / allowMonthFilter / allowDownload / allowCompare) と、描く画面のパスと URL のクエリで、出す操作と読むものが変わる。期間の部品は、データのある期間 (daterange) を読む。絞り込みの小窓は、利用者が開くと、列の値の候補 (values)、セグメントとコホートの一覧 (segments)、セッションのプロパティの名前と値 (session-data/properties・values)、描く画面のパスが /events で終わるときはイベントのプロパティの名前と値 (event-data/fields・values) を読む。いまの絞り込みの帯は、URL に segment / cohort があればその定義 (segments/[segmentId]) を読み、利用者が保存すると、いまの絞り込みをセグメントとして作る (segment の作成。この部品の唯一の書き込み)。allowDownload のときだけ出るダウンロードのボタンは、押すと 7 つの集計 (カスタムイベント、ページ、リファラー、ブラウザ、OS、デバイス、国) を読み、ZIP にして保存させる。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) で、絞り込みに応じて session / event_data / session_data も読む。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。ほかの入口へのつながりは無い (どの操作も、同じ画面の URL のクエリを書き換える)"
