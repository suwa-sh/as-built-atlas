"summary":
  "status": "interpretation"
  "value": "サイト 1 件のセッションの詳細を、1 枚の画面として出す (URL /websites/<id>/sessions/<sessionId> を直接開いたときや、再読み込みしたとき。アプリの中の移動では、同じ URL を @modal の割り込みの画面が小窓で出す)。サーバー側の page は URL の websiteId と sessionId を SessionProfile に渡すだけで、中身はブラウザ側で動く。開いたときに読むもの: セッション 1 件 (sessions/[sessionId]。PostgreSQL だけで動くときは、消してよいかも確かめる)、選んだタブの中身 (活動 sessions/[sessionId]/activity、プロパティ sessions/[sessionId]/properties、録画の一覧 sessions/[sessionId]/replays)。利用者の操作で読むもの: 活動の行のイベントのプロパティ (event-data/[eventId])、録画の再生 (replays/[replayId] と保存の状態 replays/saved/[replayId])。書き込みは利用者の操作で起きるものだけ: 録画の保存と保存の取り消し (session_replay_saved)。セッションの削除のボタン (SessionDeleteButton) は、閉じる処理 (onClose) を受け取ったときだけ描く部品の中にあり、この page は onClose を渡さないので、この画面からは出ないように見える (木には conditional で残した)。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は session、website_event、session_link、session_data、event_data、session_replay (ClickHouse では時間ごとの集計表 website_event_stats_hourly も)。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。活動と録画の一覧では、期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。ほかの画面へのつながりは無い"
