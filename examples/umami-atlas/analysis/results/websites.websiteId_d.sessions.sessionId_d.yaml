"notes": "(1) この入口の初めての分析。同じ SessionProfile を描く入口 websites.websiteId_d.modal_s.sessions.sessionId_d (割り込みの小窓) の結果を出発点にし、対象のコードで確かめて、この画面での違いを直した: page は小窓 (SessionProfileModal) を挟まず SessionProfile を直接描く、onClose を渡さない (閉じるボタンも削除のボタンも描かない)、showReplays を渡さないので録画のタブはいつも出る (既定の値 true)、この画面のパスは /share/ を含まない。SessionProfile から下の木 (フレームの並び、同じ処理の置き場、書き直したフレーム _rw<数字>) は、入口から辿る順が同じなので、元の結果のまま使った。(2) 同じ処理の置き場は、プロファイルの決まり (入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書く) に従う。parseRequest → checkAuth、canDeleteWebsite → getWebsite / getTeamUser、canViewWebsiteSection → canViewWebsite → getEntity は、最初に着く GET sessions/[sessionId] の下 (route.ts の 12 行・19 行・22 行の順)。getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、最初に呼ぶ GET sessions/[sessionId]/activity の下。canViewAuthenticatedWebsite は GET sessions/[sessionId]/replays の下、canUpdateWebsite は POST replays/saved/[replayId] の下。EventData は SessionActivity の下。(3) 呼び先がすべてほかの呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、決まりどおり、いちばん早い呼び出しを読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>)。書き直したフレームには、権限の確認・設定・ルールを繰り返して書いていない。(4) 迷った点と選んだ扱い。(a) SessionDeleteButton と、その先の DELETE sessions/[sessionId] → deleteSession は、SessionProfile が onClose を受け取ったときだけ描く部品の中にあり、この page は onClose を渡さないので、この画面からは動かないように見える。分析リポジトリの決まり (成り立たないように見える呼び出しも省かずに conditional のフレームにする) に従い、消さずに conditional で残し、フレームの note に理由を書いた。(b) 同じ理由で、SessionProfile の削除のボタンを出すかどうかにだけ効く CLICKHOUSE_URL (useConfig の sessionDeletionEnabled) は、この画面では有無で結果が変わらないので、SessionProfile の settings には書いていない (受け口の側の CLICKHOUSE_URL は、canDeleteWebsite を呼ぶかどうかを変えるので書いた)。(c) タブ (Tabs / TabPanel) の中の部品 (SessionActivity、SessionData、SessionReplaysDataTable) は、選んでいないタブの中身を描くかどうかが UI ライブラリの動きで、リポジトリからは読めないので、ほかの入口の結果と同じく always にし、note に書いた。(d) getWebsiteSegment は、この画面の受け口 (activity、replays) の schema が segment / cohort を持たないので届かないように見えるが、分析リポジトリの決まりに従い、消さずに conditional のフレームにして note に理由を書いた。(e) GET /api/config (useConfig) は、分析リポジトリの決まりでフレームにしていない。(f) API_URL と BASE_PATH は、分析リポジトリの決まりに従い、入口から辿る順で最初に API を呼ぶ useWebsiteSessionQuery に 1 回だけ書いた。checkAuth の API キーの枝は、フレームにせず rules に 1 行書いた。(g) 画面を包む枠 (layout_l、layout_l.main_g、layout_l.main_g.websites.websiteId_d) の処理は、プロファイルの決まりで辿っていない。(h) リンクは無い。小窓の入口にあった /websites/${websiteId}/sessions への移動は、小窓を閉じる部品 (SessionProfileModal) のもので、この画面には無い。SessionActivity のパスのリンクは、計測している対象のサイトの URL で、入口ではない。(i) 見た目だけの部品 (SessionStats、SessionInfo、Avatar、SessionReplaysTable、DataGrid) と、録画を再生する ReplayPlayer (rrweb-player を使う。データを読まない) は、フレームにしていない。(5) レビューの指摘 1 件 (low: SessionProfile の settings に CLICKHOUSE_URL が無い) は直していない。理由: その設定が変えるのは削除のボタンを出すかどうかだけで、この画面では onClose が無いためボタンは有無にかかわらず出ない。分析の手順の「この入口では有無で結果が変わらない設定は書かない」に従った ((4)(b))。条件の文に出てくる sessionDeletionEnabled の出どころは、受け口の側の CLICKHOUSE_URL と notes で辿れる。"
