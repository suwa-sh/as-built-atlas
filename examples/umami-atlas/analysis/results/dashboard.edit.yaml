summary:
  status: "interpretation"
  value: "ログイン中のユーザー個人のダッシュボード (種類が dashboard で、id がユーザーの id の board 1 件) を編集する画面。GET /api/dashboard で board を読み (無ければ空の行 1 つ・列 1 つで始める)、行と列を足す・消す・入れ替える・大きさを変える、列に部品を置く、といった編集を画面の中で行い、保存のボタンで POST /api/dashboard を呼んで board を更新する (無ければ作る)。保存の前に、サーバーが、Funnel / Goal の部品が指す保存済みのレポートが正しいかを確かめる (report を読む)。名前は「Dashboard」に固定で、説明は空。期間と絞り込みの操作は、最初に対象を持つ部品の対象の種類で分かれる。サイトなら、共有の部品 WebsiteControls (別の入口 part_p.shared_a.WebsiteControls) を描くので、この画面では描く所で止めて、つながり (embed) だけを書いた。ピクセル・リンクなら PixelControls / LinkControls を描き、その中の絞り込みと期間の部品 (values / segments / event-data / session-data / daterange の API、セグメントの保存) を辿った (サイトの読み取りと権限の確認で website / link / pixel / board / team_user を読む)。列ごとに、部品の対象 (サイト・ピクセル・リンク) がまだ読めるかを GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId] で確かめてから、部品の type で登録表 (boardComponentRegistry) から部品を引いて描く。部品 16 種類は、それぞれ別の入口として分析するので、この画面では登録表を引く所で止めて、部品へのつながり (embed) だけを書いた。部品を選ぶ小窓では、対象の選択欄の一覧 (本人のサイト・ピクセル・リンク) と、Goal / Funnel の部品の保存済みのゴール・ファネル (GET /api/websites/[websiteId]/goals・funnels) を読み、選んでいる最中の部品を同じ登録表から試しに描く。URL にチーム (/teams/<id>) があれば、編集させずに /dashboard/edit へ移す。保存か取り消しで /dashboard へ移る。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)"
