notes: "(0) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (180 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。(a) WebsiteControls を描くフレーム BoardControls (board_controls) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は BoardControls.tsx:4 の import と :26 の描く行) を書いた。BoardControls が渡す値 (websiteId だけ) と、そのため既定値のままになる操作は、board_controls の summary に書いた。WebsiteControls のフレームと、その下の 8 段 (WebsiteFilterButton から checkAuth まで、終端の決まりのために書き直した _rw2 / _rw4 の段) を外した (9 段)。外した段は、どれも書き直しの段で、最初に書いた段はすべて、コードの順で先に着く PixelControls (BoardControls.tsx:22) の下にあるので、移す段は無かった。対象のコードで WebsiteControls を描くのは、この入口の木では BoardControls だけ (部品を選ぶ小窓の試し描きは描かない) ことも確かめた。(b) PixelControls と LinkControls は、WebsiteControls とほぼ同じ形の部品だが、別の入口になっていないので、これまでどおり辿った (決まりが止めると書いているのは WebsiteControls だけ)。(c) 共通の段の書き方をそろえた: checkAuth の rules に、API キーの枝 (auth.ts:74-75 の checkApiKeyAuth) の 1 行を足した (settings の CLOUD_MODE と、その下の getUser は前から書いてある)。canViewWebsite / canUpdateWebsite / canViewPixel / canViewLink / canViewTeam の guards には、管理者の確認 (role、user.isAdmin) が前から別の 1 件として書いてある。canViewSharedWebsite の guards に、共有の部品の結果と同じ書き方 (kind: other、value: canViewSharedWebsite) を足した。API_URL と BASE_PATH は、前から、最初に API を呼ぶ useDashboardQuery にだけ書いてある。結果の target は作業定義と同じ。(d) 段の数は 180 から 171 になった。以下 (1)〜(12) は、前の分析 (登録表の部品 16 件を part の入口に分けたとき) の記録で、今回の変更に合わせて直した。(1) 画面を包む枠 ((main) の layout と、そこから描かれる部品) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) 登録表を引くフレーム BoardComponentRenderer で止め、部品 16 件を links の embed (target は登録表のキー、entry_id は part_p.boardComponentRegistry.<キー>、状態は interpretation) で書いた。BoardComponentRenderer は、列 (BoardEditColumn.tsx:61) と、部品を選ぶ小窓の試し描き (BoardComponentSelect.tsx:507) の 2 か所から呼ばれる同じ関数なので、先に着く列の下に 1 回だけ書いた。前の結果にあった、部品ごとの 18 のフレーム (not_analyzed) は消した。Metrics bar の、対象の種類ごとの部品を選ぶ判定は、BoardComponentRenderer の rules に書いた。TextBlock は文字を出すだけで入口ではないので、summary に名前を書いただけ。(3) 期間と絞り込みの操作のうち、PixelControls と LinkControls は、このリポジトリの決まり (共通の絞り込みの部品は、データに届くまで辿る) のとおり辿った。WebsiteControls は、(0) のとおり、別の入口への embed で止めた。フレームと綴りは、同じ部品を同じコミットで辿った boards.boardId_d.design の結果から写し、この入口の置き場に合わせて直した (パスは /dashboard/edit。/events で終わらないので、パスで決まる枝の結論は同じ)。(4) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。DashboardEditPage の中の順は DashboardProvider (useDashboardQuery 50 行 → 保存の post 73 行) → DashboardEditHeader → BoardControls → BoardEditBody。GET /api/dashboard と POST /api/dashboard は、boards の画面と違って canViewBoard / canViewBoardEntities を呼ばないので、canViewWebsite → getEntity → getWebsite / getLink / getPixel と getTeamUser は、期間と絞り込みの操作の GET /api/websites/[websiteId]/values (canViewWebsiteSection の下) に着いて、そこに書いた。canViewSharedWebsite は daterange の下、canViewPixel / canViewLink は列の GET /api/pixels/[pixelId]・/api/links/[linkId] の下、getReports は小窓の GET …/funnels の下、canViewTeam は GET /api/teams/[teamId]/pixels の下にある。保存の POST /api/dashboard は、URL を書いている DashboardProvider (DashboardProvider.tsx:73) の下に書いた (前の結果は、ボタンのある DashboardEditHeader の下に書いていた。レビューの指摘で直し、boards.boardId_d.design の BoardProvider の下と形をそろえた)。DashboardEditHeader は、画面の移動 (next/navigation) で閉じた。(5) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。external の段までは書かず、確認・設定・ルールも繰り返していない)。読み書きを持つ最初の段は checkAuth (Redis の auth:* の読み取り) なので、前の結果が checkAuth の下にもう一度書いていた getUser は消した。(6) 固定の値で閉じている呼び出し (指示書 0.4.1) は 3 種類、5 か所 (前の結果は 6 か所。WebsiteControls の ExportButton は、共有の部品の入口で扱うので、この入口から外れた)。(a) getAllUserWebsitesIncludingTeamAccess: この入口で WebsiteSelect を描くのは BoardComponentSelect だけで、includeTeams を渡さない (BoardComponentSelect.tsx:340-345)。値が undefined の引数は URL に付かない (src/lib/url.ts:5) ので、GET /api/users/[userId]/websites (route.ts:29) と GET /api/me/websites (route.ts:22) の includeTeams の枝は決して動かない。前の結果にあったフレーム q_get_all_user_websites を消した。(b) ExportButton の GET /api/websites/[websiteId]/export: BoardControls は PixelControls と LinkControls に allowDownload を渡さず (BoardControls.tsx:22、24)、既定値は false なので、ExportButton は描かれない (WebsiteControls にも渡さない (BoardControls.tsx:26) が、その中は辿らないので、board_controls の summary に書くだけにした)。(c) POST /api/websites/[websiteId]/segments/[segmentId] (セグメントの更新): SegmentEditForm を描くのは FilterBar だけで、segmentId を渡さない。閉じている呼び出しの名前・値・行は、条件を持つフレーム (2 つの受け口、SegmentEditForm、PixelControls と LinkControls) の summary に書いた (フレームの形式に notes が無いので、このリポジトリの決まりのとおり)。DashboardEditPage が BoardEditBody に渡す requiresBoardWebsite={false} (固定の値) は、canEdit をいつも true にする値で、呼び出しを閉じるのではなく開くので、数えていない (canEdit が false のときに 閉じる枝は無く、部品を選ぶボタンがいつも出る)。DashboardProvider に渡す editing (固定の true) も、Context に入るだけで、データに届く呼び出しを決めないので数えていない。(7) この画面ではチームの URL が転送されるので teamId がいつも無い (DashboardEditPage.tsx:15-21、next.config.ts:149-150)。URL で決まる値で、コードに書いた固定の値ではないので、チームの一覧の受け口 (teams/[teamId]/pixels・links・websites) は消さずに conditional で書き、成り立たないように見える理由を note に書いた。逆に、本人の一覧の受け口 (pixels・links・users/[userId]/websites) は、この入口から辿る限りいつも成り立つので always にした (boards.boardId_d.design は、teamId がありうるので conditional)。POST /api/auth/verify と GET /api/me/websites も、状態で決まるので、成り立たないように見える conditional として書いた。(8) フレームにしなかったもの: useNavigation / useMessages / useModified / useBoard (URL・翻訳・更新印・画面の中のボードの小道具)、PageBody / PageHeader / Panel / Empty / ControlledDialog / react-resizable-panels (見た目だけの部品)、TextBlock (設定の文字を出すだけ)、GET /api/config (useConfig。このリポジトリの決まり)。(9) checkAuth の API キーの経路は、ブラウザがログイントークンを付けるので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(10) API_URL と BASE_PATH は、このリポジトリの決まりのとおり、最初に API を呼ぶフレーム useDashboardQuery にだけ書いた (前の結果が DashboardProvider にも書いていた API_URL は消した)。(11) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前、権限の定数の名前、関数になっていない確認はコードの式を書いた。管理者の確認 (user.isAdmin) は、前の結果のレビューの指摘のとおり、canViewWebsite / canViewPixel / canViewLink / canViewTeam / GET /api/users/[userId]/websites に role として書いた (boards.boardId_d.design は role を書かず、ownership の note に書いている。そろっていない)。POST /api/dashboard は、POST /api/boards/[boardId] と違い、ボードが参照するサイト等を本人が見られるか (canViewBoardEntities) を確かめない (summary に書いた)。(12) テストとの対応は、作業定義で選ばれていないので分析していない。(13) 前の分析のレビューの指摘 3 件 (high 0、medium 2、low 1) は、前の分析で直した。(14) 今回のレビューの指摘は 1 件 (high 0、medium 0、low 1)。checkAuth の API キーの枝のルールの根拠に、接頭辞を決める行と判定する行 (src/lib/api-key.ts:4、:33) を足して直した。high が無いので、もう一度のレビューはしていない。"
