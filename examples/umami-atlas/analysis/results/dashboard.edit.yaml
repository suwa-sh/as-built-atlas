summary:
  status: interpretation
  value: ログイン中のユーザー個人のダッシュボード (種類が dashboard で、id がユーザーの id の board 1 件) を編集する画面。GET /api/dashboard で board を読み (無ければ空の行 1 つ・列 1 つで始める)、行と列を足す・消す・入れ替える・大きさを変える、列に部品を置く、といった編集を画面の中で行い、保存のボタンで POST /api/dashboard を呼んで board を更新する (無ければ作る)。保存の前に、サーバーが、Funnel / Goal の部品が指す保存済みのレポートが正しいかを確かめる (report を読む)。名前は「Dashboard」に固定で、説明は空。列の部品は、対象 (サイト / ピクセル / リンク) を 1 件読んで (GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId]) 読めるときだけ、登録簿の集計の部品 (定義は 16 種類、対象ごとの違いを含めて 18 の部品) のどれかを描く (部品の先の集計は辿っていない)。部品を選ぶ小窓では、対象の選択欄の一覧 (本人のサイト・ピクセル・リンク) と、Goal / Funnel の部品の保存済みのゴール・ファネル (GET /api/websites/[websiteId]/goals・funnels) を読む。最初の部品の対象の絞り込みと期間の部品 (WebsiteControls など) も描く (辿っていない)。URL にチーム (/teams/<id>) があれば、編集させずに /dashboard/edit へ移す。保存か取り消しで /dashboard へ移る。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
