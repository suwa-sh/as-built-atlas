summary:
  status: interpretation
  value: "設定メニューの中で、自分が所属するチームを一覧する画面。サーバー側の page は TeamsSettingsPage を描くだけで、本体はブラウザ側で動く。一覧は GET /api/users/[userId]/teams (userId はログイン中のユーザー) で、削除されていない team を、メンバー (team_user と、その user の id / username) と、サイトとメンバーの件数 (website / team_user) を付けてページ単位で読み、名前・オーナー・メンバー数・サイト数の表にする。並べ替えは、名前の列の見出しで URL のクエリ (orderBy) を書き換えて行う (受け口が許す列は name / createdAt)。受け口は、本人か管理者 (user.isAdmin) でなければ 401。行の名前から /settings/teams/[teamId] へ移る。見出しには 2 つのボタンがある。「チームに参加」は小窓で招待コードを入れさせ、POST /api/teams/join で、削除されていない team を招待コードで探し (無ければ 404)、既にメンバーなら 400、そうでなければ自分の team_user を team-member の役割で作る (役割や権限の確認は無く、ログイン済みなら誰でも参加できる)。「チームを作成」はログイン中のユーザーの役割が view-only でないときだけ出て、小窓で名前を入れさせ、POST /api/teams で team と、自分をオーナーにした team_user を作る (team:create の権限が要る。管理者は確認なしで通る)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。クラウドモード (CLOUD_MODE) だけで動く処理 (契約の読み取り account:*、持てるチームの数の確認、team:* のキャッシュの書き込み) は、設定の枠がクラウドモードでは何も描かないので、この画面からは届かないように見える (経路はコードにあるので書いている)"
  evidence:
    - { file: "src/app/(main)/settings/teams/page.tsx", line: 5 }
    - { file: "src/app/(main)/settings/teams/TeamsSettingsPage.tsx", line: 10 }
    - { file: "src/app/(main)/settings/teams/TeamsSettingsPage.tsx", line: 12 }
