    - { file: "src/app/(main)/teams/TeamsDataTable.tsx", line: 14 }
    - { file: "src/app/api/users/[userId]/teams/route.ts", line: 21 }
    - { file: src/app/api/teams/join/route.ts, line: 37 }
    - { file: src/app/api/teams/route.ts, line: 69 }
    - { file: src/queries/prisma/team.ts, line: 54 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 5 }
notes: "[1] 画面を包む枠 (ルート、(main)、settings の layout と、そこから描かれる部品) は別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。[2] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: useLoginQuery → POST /api/auth/verify → parseRequest → checkAuth → getUser は TeamsHeader (TeamsHeader.tsx:16。TeamsSettingsPage.tsx:10 の見出しが :12 の一覧より前) の下。getAllUserTeams は POST /api/auth/verify の下。TeamsDataTable も useLoginQuery を呼ぶが、summary に書くだけにした。POST /api/teams/join、POST /api/teams、GET /api/users/[userId]/teams も parseRequest を呼ぶが、それぞれの summary に書くだけにした。[3] 同じ関数でも、届く先が違うものは分けて書いた: useUpdateQuery (URL が /teams/join と /teams の 2 つ)、Redis の get (auth:* と account:*)、Prisma の team の呼び出し (findUnique、findMany (verify)、count、トランザクションの create、pagedQuery の findMany)。[4] この画面からは条件が成り立たないように見える呼び出しも、消さずに conditional で書いた: POST /api/teams のクラウドモードの枝 (fetchAccount / getUserOwnedTeamCount / team:* の set)。設定の枠 (src/app/(main)/settings/layout.tsx:5) がクラウドモードでは何も描かないので、この画面からは届かないように見える (admin.teams の結果と同じ扱い)。POST /api/auth/verify は、ストアにユーザーがあれば呼ばれない (枠の App.tsx も useLoginQuery を呼ぶので、ふつうは呼ばれないと読める) ので conditional にした。[5] 段にしなかったもの: canCreateTeam (src/permissions/team.ts:18。データを読まず、段にすると終端の決まりを満たせないので、確認は、それを呼ぶ POST /api/teams の段に書いた)、getCloudTeamLimit (計算だけの補助の関数。ルールは POST /api/teams に書いた)、TeamsTable (受け取った行を表にするだけ。オーナーの列は members から role が team-owner の人の username を、件数の列は _count を出す。名前の列の見出しは並べ替え (URL の orderBy を書き換える))、PageHeader / Panel / DataGrid (見た目と、URL のクエリの書き換えだけ。この画面では allowSearch を渡さないので検索の欄は出ない。表示の切り替えの localStorage は I/O に書いていない)、useMessages (翻訳)、useModified (ブラウザの中の更新印)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具。API_URL / BASE_PATH は、API を呼ぶフックの settings に書いた)、usePagedQuery (URL のクエリを足して useQuery を呼ぶ小道具)、useNavigation (pathname を読むだけ)。[6] TeamsAddButton の isAdmin は既定の false で、TeamsHeader は渡さない (TeamsHeader.tsx:22) ので、TeamAddForm のオーナーの選択 (UserSelect) はこの画面では描かれない。UserSelect とその先の読み取りは書いていない。POST /api/teams の ownerId も送られないので、オーナーはいつも自分になる。[7] 一覧の行のリンクの行き先は式 (`${isSettings ? '/settings' : ''}/teams/${row.id}`) で決まる。この入口の pathname (/settings/teams) は /settings を含むので、行き先は /settings/teams/${row.id} だけと読み、links はその 1 件にした (もう一方の /teams/${row.id} に当たる入口は、入口の一覧に無い)。[8] 「チームを作成」のボタンを出すかどうか (user.role !== ROLES.viewOnly) は画面の出し分けで、先へ進むのを止める確認ではないので、guards ではなく TeamsHeader の rules (decision) に書いた。サーバー側の確認は受け口の guards に書いた。[9] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。parseShareToken (auth.ts:88) はヘッダーのトークンを解くだけでデータを読まない。DATABASE_URL / DATABASE_REPLICA_URL は、どの段にも同じように効く接続先なので、settings に書いていない。[10] GET /api/users/[userId]/teams のスキーマは search を受けない (route.ts:8-11) ので、getTeams の name の部分一致の検索は、この経路では効かない。[11] 確認の値は、analysis-conventions.md の綴りにした (役割は user.isAdmin、権限は定数の名前、ログイン済みは checkAuth の 1 か所だけ)。GET /api/users/[userId]/teams の本人の確認は、関数が無く受け口に直接書いてあるので、ほかの入口の結果 (settings.websites.websiteId_d など) と同じ式 auth.user.id === userId を書いた。[12] テストとの対応は、作業定義の analysis.tests が無いので、分析していない。[13] レビューの指摘は medium が 1 件 (checkAuth の API キーの枝 checkApiKeyAuth → getApiKeyByHash / updateApiKeyLastUsed を辿っていない。/api/teams と /api/teams/join は API キーを断るパスに当たらない) で、直していない。理由: ほかの入口の結果 (admin.teams、pixels、settings.teams.teamId_d など) も同じ枝を辿っておらず、この入口だけ足すと入口をまたいで扱いがそろわなくなる。辿るか、辿らない決まりを analysis-conventions.md に書くかは、分析リポジトリ全体で人が決める。レビューの notes [7] (並べ替えの見出しは名前の列だけ) は、入口の summary に反映した。"
