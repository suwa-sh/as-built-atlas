summary:
  status: interpretation
  value: "ボードに置く「訪問者のグラフ」の部品 (登録表の type: WebsiteChart)。描く側から受け取ったサイトについて、描く画面の URL の期間と絞り込みで、ページビューとセッションの時系列を GET /api/websites/[websiteId]/pageviews で読み、棒グラフに描く。受け口は getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getPageviewStats と getSessionStats で website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) を数える。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。描く側が compareMode を渡したときは、比較の期間でも同じ 2 つを集計して重ねる。描く側が showAnnotations を渡したときだけ、注釈の一覧を GET /api/websites/[websiteId]/annotations で読み (annotation)、グラフに印を出す。どちらの受け口も、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見てよいかを確かめる (注釈は canViewSharedWebsiteFilters、時系列は canViewWebsiteSection。ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)。書き込みは無い。ほかの入口へのつながりは無い (注釈の印を押すと、描く画面の URL の期間を書き換えるだけ)"
