notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 WebsiteChart (boardComponentRegistry.tsx:199) が指すコンポーネント WebsiteChart (WebsiteChart.tsx:17)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、compareMode、showAnnotations、onAnnotationMoreClick、legendActions) と、描く画面の URL のクエリ (期間、絞り込み) を、入口のフレームの parameters に書いた。登録表のこの項目は componentByEntityType を持たないので、替わる先のコンポーネントは無い。(2) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。WebsiteChart は useWebsiteAnnotationsQuery (WebsiteChart.tsx:35) を useWebsitePageviewsQuery (:40) より先に呼ぶので、parseRequest → checkAuth と、canViewWebsite → getEntity / getTeamUser は、GET annotations の下 (canViewSharedWebsiteFilters の下) に書いた。GET pageviews の canViewWebsiteSection は、呼び先が canViewWebsite だけで終端になるので、決まりどおり、いちばん早い呼び出しを I/O を持つフレームまで書き直した (q_can_view_website_rw1 → q_get_entity_rw1 → q_get_website_rw1)。書き直したフレームには、権限の確認を繰り返していない。fetchWebsite が呼ぶ getWebsite は、q_get_website の下に書いた経路と同じなので、フレームにしていない (fetchWebsite 自身が Redis の I/O を持つ)。(3) 同じ部品を描く既にある結果 (websites.websiteId_d.compare、websites.websiteId_d) の綴りと木を出発点にし、根拠の行は対象のコードで確かめた。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_annotations) に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。ほかの入口の結果が checkAuth に書いている CLOUD_MODE (API キーを受け付けるかの切り替え) は、API キーの枝を辿らないこの入口では有無で結果が変わらないので、書いていない。結果の target には、手元の絶対パスを残さないため clone_path を書いていない (作業定義には書いてある)。直帰を除くフィルターの定義 (getExcludeBounceQuery) は、この入口で最初に使う getPageviewStats の rules に 1 回だけ書いた。(4) 固定の値で閉じている呼び出しは無い。この部品の木の中で、子に固定の値を直接書いて渡している所は無い。showAnnotations と compareMode は、描く側から受け取る値 (入口の外の値) なので当たらない。決まりどおり、showAnnotations で決まる GET annotations の呼び出しは conditional にし、compareMode で送る値だけが変わる compare は、値を使う WebsiteChart と、受け口 (GET pageviews) の rules に書いた。(5) 迷った点と選んだ扱い。(a) 登録表のこの項目は configFields も defaultProps も持たない (boardComponentRegistry.tsx:199) ので、ボードの部品の選び方の画面からは showAnnotations / compareMode を設定できないように見える。ただし、描く側は保存された部品の設定の props をそのまま渡す作り (BoardComponentRenderer.tsx:42) で、どの値が保存されるかは部品の入口からは決められない (context.md の部品の決まり) ので、GET annotations と比較の期間の集計を、消さずに conditional / rules で書いた。(b) GET annotations の API は conditional だが、フックの呼び出し (use_annotations) は描画のたびに動き、木の中で最初の API を呼ぶフレームなので、API_URL と BASE_PATH をここに書いた。(c) 注釈の印を押すと、描く画面の URL の date を書き換える (router.push(updateParams(...)))。同じ画面のクエリの書き換えで、ほかの入口への遷移ではないので、links に書いていない。onAnnotationMoreClick は描く側へ期間を返すだけで、この部品の中では読み書きしない。(d) useDateRange はブラウザに保存した期間 (localStorage) を読むが、サーバーのデータではないので I/O に書かず、parameters と summary に書いた。(e) PageviewsChart、LoadingPanel、ChartAnnotationMarkers は見た目だけの部品なので、フレームにしていない。(6) links は 1 件も無い。(7) レビューへの対応 (1 回、指摘は low 2 件。どちらも直した)。getPageviewStats と getSessionStats の PostgreSQL の website_event の読み取りに、結合の条件に使う session_id / visit_id を filter で足し、note に使う場面を書いた。入口のフレームの「絞り込みのクエリ」に、segment / cohort / excludeBounce / match / search / page / pageSize も送ることを足した。共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ。"
