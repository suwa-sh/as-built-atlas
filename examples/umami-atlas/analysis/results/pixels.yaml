notes: "[1] 画面を包む枠 ((main) の layout と、そこから描かれる部品) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。[2] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は POST /api/auth/verify (PixelsPage.tsx:12 の useLoginQuery が最初に着く) の下。canViewTeam → getTeamUser は GET /api/teams/[teamId]/users (PixelsPage.tsx:15) の下。canViewPixel → getPixel は GET /api/pixels/[pixelId] (PixelsPage.tsx:27 の追加ボタン → PixelEditForm.tsx:44 の usePixelQuery。:30 の一覧より前) の下。[3] この画面からは条件が成り立たないように見える呼び出しも、指示書のとおり、消さずに conditional で書いた: 追加の小窓の PixelEditForm は pixelId を受け取らない (PixelAddButton.tsx:11) ので、usePixelQuery の enabled: !!pixelId が成り立たず、GET /api/pixels/[pixelId] は呼ばれないように見える。深さ優先の順では、canViewPixel と getPixel が、この呼ばれないように見える受け口の下に置かれる (admin.teams の結果の、UserSelect の useTeamMembersQuery と同じ扱い)。canViewPixel は、GET /api/pixels/charts から実際に呼ばれる。[4] 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段まで書き直した (id が _rw で終わるフレーム。external の段は書いていない。確認・設定・ルールは繰り返していない): canCreateTeamWebsite の下の getTeamUser、canDeletePixel の下の getPixel。[5] 段にしなかったもの: canCreateWebsite (src/permissions/website.ts:120。データを読まず、段にすると終端の決まりを満たせないので、確認は、それを呼ぶ受け口 POST /api/pixels に書いた)、getQueryFilters (websiteId を渡さないので、データを読まない)、useConfig → GET /api/config (skipAuth で環境変数を返すだけで、データにもライブラリにも届かない。pixels.pixelId_d.edit の結果と同じ扱い。設定 PIXELS_URL は、それを使う PixelEditForm と PixelsTable に書いた)、PixelEditButton (リンクだけ。行き先は PixelsTable の links に書いた)、DataGrid (検索とページ送りは、同じ画面の URL のクエリを書き換えるだけ。表示の切り替えの localStorage は I/O に書いていない)、WebsiteSparkline (受け取った値を描くだけ)。[6] 操作を出すかどうか (showActions) は、画面の出し分けで、先へ進むのを止める確認ではないので、guards ではなく PixelsPage の rules (decision) に書いた。サーバー側の確認は、受け口と権限の関数の guards に書いた。[7] URL のクエリの page / search / orderBy / sortDescending は、usePagedQuery がどの一覧の読み取りにも付けるので、チームの URL では、ピクセルの一覧の検索語とページが、メンバーの読み取り (GET /api/teams/[teamId]/users) にも付く。検索語が自分の username に合わないときや、2 ページ目以降では、メンバーの結果に自分が入らず、操作が出なくなると読める (実行しての確認はしていない)。use_team_members_query の summary に書いた。[8] 表の URL の列は、ピクセルの計測用の URL (PIXELS_URL か origin + /p の下の slug) への外部リンクで、分析の対象の入口ではないので、links に書いていない。[9] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。DATABASE_URL は、どの段にも同じように効く接続先なので、settings に書いていない。[10] 画面から API を呼ぶ URL は、環境変数 API_URL があると (/auth と /config 以外は) その URL に向く。既定では同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL と BASE_PATH は、API を呼ぶフックの settings に書いた。[11] 確認の値は、analysis-conventions.md の綴りにした (役割は user.isAdmin、持ち主・所属は確認する関数の名前、権限は定数の名前、ログイン済みは checkAuth の 1 か所だけ)。[12] テストとの対応は、作業定義の analysis.tests が無いので、分析していない (src/app/api/pixels/route.test.ts があることだけ見た。中は読んでいない)。[13] src/lib/schema.ts は、searchParams・pagingParams・sortingParams (73〜100 行) だけを読んだ。timezoneParam は読んでいない。[14] レビューの指摘は medium 3 件で、すべて直した (GET /api/pixels と GET /api/teams/[teamId]/pixels の call を、URL が引数 teamId で切り替わるので interpretation にした。canViewTeam に管理者の確認 user.isAdmin を足した)。レビューが人の判断に回したこと: canViewTeam の管理者の確認は、ほかの入口の結果 (settings.teams.teamId_d、layout_l.main_g など) には無く、この結果だけが持つ。Redis の auth:* の項目の名前は、この結果を含む多くの入口が * で、admin.websites.websiteId_d だけが userId / pwd。共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ。"
