summary:
  status: interpretation
  value: "ピクセル (計測用の画像) の一覧の画面。サーバー側の page は PixelsPage を描くだけで、本体はブラウザ側で動く。個人の URL (/pixels) では GET /api/pixels で自分のピクセル (pixel) を、チームの URL (/teams/<teamId>/pixels) では GET /api/teams/[teamId]/pixels でそのチームのピクセルを、検索 (name / slug)・並べ替え (name / slug / createdAt)・ページ送りを付けて読み、名前・URL・直近 7 日の訪問者数の小さなグラフ・作成日時の表にする。グラフは、一覧にピクセルがあれば GET /api/pixels/charts で読む (website_event。CLICKHOUSE_URL があれば ClickHouse の website_event_stats_hourly)。追加・編集・削除の操作を出すかどうかは画面が決める: 個人の URL では、ログイン中のユーザー (useLoginQuery。ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む) の役割が view-only でないとき。チームの URL では、GET /api/teams/[teamId]/users で読んだメンバー (team_user と user) に自分がいて、役割が team-view-only でないとき。追加ボタンは小窓を開き、名前と slug (隠し項目。9 文字のランダムな文字) を POST /api/pixels で送って pixel を作る (website:create の権限が要る。チームの URL では、そのチームでの権限も要る)。行の名前から /pixels/[pixelId] へ、編集ボタンから /pixels/[pixelId]/edit へ移る。削除ボタンは確認の小窓を開き、DELETE /api/pixels/[pixelId] で pixel を消す (管理者・持ち主・チームで website:delete を持つメンバー)。各 API は、ログイントークンから user を読んで認証する (Redis のセッションを使うときは auth:* も読む)。表示するピクセルの URL の前半は PIXELS_URL で替わる"
