summary:
  status: interpretation
  value: "管理者向けのユーザーの一覧の画面 (/admin/users)。開くと GET /api/admin/users で、削除されていない user を、持っているサイトの数 (website の件数) 付きで、ページ単位で読む (URL の検索語・ページ・並べ替えを渡す)。「ユーザーを作成」のボタンの小窓から POST /api/users でユーザーを作る (同じユーザー名があれば作れない)。一覧の行のメニューの「削除」から DELETE /api/users/<userId> でユーザーを消す。削除は、環境変数 CLOUD_MODE があれば、ユーザーとサイト・リンク・ピクセルに削除の印を付け、共有とボードを消す。無ければ、ユーザーのサイトとその計測のデータ、持ち主になっているチーム、レポート、共有、リンク、ピクセル、ボードを行ごと消す。Redis が有効なら、消したリンクとピクセルのキャッシュも消す。3 つの受け口は、どれも管理者 (user.isAdmin) だけが使える。一覧のユーザー名と「編集」のメニューは、ユーザーの詳細の画面 (/admin/users/<userId>) へ移る"
  evidence:
    - { file: "src/app/(main)/admin/users/page.tsx", line: 5 }
    - { file: "src/app/(main)/admin/users/UsersPage.tsx", line: 17 }
    - { file: "src/app/(main)/admin/users/UsersPage.tsx", line: 20 }
    - { file: src/components/hooks/queries/useUsersQuery.ts, line: 12 }
    - { file: "src/app/(main)/admin/users/UserAddForm.tsx", line: 16 }
    - { file: "src/app/(main)/admin/users/UserDeleteForm.tsx", line: 16 }
    - { file: "src/app/(main)/admin/users/UsersTable.tsx", line: 34 }
    - { file: src/app/api/admin/users/route.ts, line: 25 }
    - { file: src/app/api/users/route.ts, line: 37 }
    - { file: "src/app/api/users/[userId]/route.ts", line: 103 }
    - { file: src/queries/prisma/user.ts, line: 175 }
    - { file: src/queries/prisma/user.ts, line: 209 }
    - { file: src/permissions/user.ts, line: 20 }
notes: "(1) 画面を包む枠 (ルート、(main)、admin の layout) は別の入口なので辿っていない。この画面を管理者にだけ描く確認 (AdminLayout) も、枠の側にある。(2) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。UsersPage.tsx では UserAddButton (17 行目) が UsersDataTable (20 行目) より先なので、parseRequest → checkAuth → getUser の経路は POST /api/users の下にある。GET /api/admin/users と DELETE /api/users/[userId] も parseRequest を呼ぶが、summary に書くだけにした。(3) 権限を確かめる関数 canCreateUser / canViewUsers / canDeleteUser (src/permissions/user.ts) は、データを読まず user.isAdmin を返すだけなので、段にしていない。確認 (guards) は、それを呼ぶ受け口の段に書き、値は決まりのとおり user.isAdmin にそろえた。(4) フレームにしなかったもの: PageHeader / Panel / DataGrid / LoadingPanel / Pager / MenuButton / ControlledDialog (見た目と、URL の検索語・ページの書き換えだけ)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)、useModified (ブラウザの中の更新印)、usePagedQuery (URL の検索語などを足して useQuery を呼ぶ小道具)、useNavigation、useMessages (翻訳)、sanitizeSortFilters と prisma.getSearchParameters (条件を組み立てるだけ)、hashPassword / uuid。UserDeleteButton.tsx は、同じフォルダにあるが、どこからも使われていないので辿っていない (useLoginQuery は、この画面からは呼ばれない)。(5) checkAuth の API キーの枝 (auth.ts:74 → checkApiKeyAuth) は、/api/users と /api/admin が API キーを受け付けないパス (api-key.ts:16 / :17) で、getApiKeyByHash より前の auth.ts:35 で null を返すので、api_key の読み書きは書いていない (rules に検証として書いた)。API キーの枝に入るかを決める CLOUD_MODE は、この入口ではどちらでも認証の失敗になり結果が変わらないので、checkAuth の settings に書いていない。(6) getUserByUsername は、getUser と同じ findUser の行 (user.ts:32) でライブラリを呼ぶ。external の段は ext_prisma_user の 1 つだけにし、getUserByUsername には読み取りだけを書いた。(7) deleteUser の中のライブラリの呼び出し (findMany 5 つと、$transaction に渡す更新・削除) は、external の段を 1 つにまとめた (行ごとに段を分けると 20 を超えるため)。同じテーブルの同じ操作が CLOUD_MODE の有無の両方の枝にあるとき (share / board の削除) は、読み書きを 1 件にまとめ、両方の行を根拠にした。(8) 設定の名前は、実行する環境で設定する名前 (CLOUD_MODE / API_URL / BASE_PATH / REDIS_URL) で書いた。DATABASE_REPLICA_URL (Prisma の読み取りを複製へ送る拡張。prisma.ts:861 / :901) は、どの読み取りにも同じように効く接続の設定なので書いていない。(9) UserAddForm と UserDeleteForm は、小窓 (Modal) の中に書かれている。小窓が閉じているときに中身が描かれるかは、UI ライブラリ (@umami/react-zen) の中で決まり、リポジトリからは読めないので、「小窓が開いたとき」の conditional にして、call を interpretation にした。(10) POST /api/users の role ?? ROLES.user (route.ts:41) は、スキーマが role を必須にしている (route.ts:16) ので効かないと読み、ルールに書いていない。(11) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(12) レビューの指摘 2 件 (どちらも low) は、どちらも直した: getUsers の user の読み取りの列を、password を除いた列の 1 つずつにし (admin.teams の結果と同じ綴り)、BASE_PATH の効果に「API_URL が絶対の URL のときは付かない」を足した。"
