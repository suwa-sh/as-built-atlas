notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 WeeklyTraffic (boardComponentRegistry.tsx:368) が指すコンポーネント WeeklyTraffic (src/components/metrics/WeeklyTraffic.tsx:8)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId) と、描く画面の URL のクエリ (期間、絞り込み)、ブラウザの側で選んでいるタイムゾーンを、入口のフレームの parameters に書いた。この項目には componentByEntityType も configFields も無いので、替わる先の部品も、設定で変わる動きも無い。(2) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた (受け口の route.ts の行の順: parseRequest :19、canViewWebsiteSection :27、getQueryFilters :31、getWeeklyTraffic :33)。同じ受け口の前処理・権限の確認・絞り込みのフレーム (q_parse_request から ext_prisma_segment_find まで) は、同じ関数を同じ順で呼ぶ部品の結果 (part_p.boardComponentRegistry.WebsiteMetricsBar) の綴りと木を出発点にし、受け口の行番号とセクションの値 (overview / sessions) を、この受け口に合わせて直した。getWeeklyTraffic と、その下の 2 つのライブラリのフレームは、同じ部品を描く既にある結果 (websites.websiteId_d の weekly_traffic / use_weekly / api_weekly / q_weekly / ext_weekly_pg / ext_weekly_ch) を出発点にし、業務のルール (数えないイベントの種類、ClickHouse で読む表の選び方、直帰を除くフィルター) を足した。根拠の行は、対象のコードで確かめた。(3) API_URL と BASE_PATH は、この入口で最初に (そして唯一) API を呼ぶフレーム use_weekly に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(4) 固定の値で閉じている呼び出しは無い (0 件)。確かめたこと: (a) WeeklyTraffic は useWeeklyTrafficQuery に params を渡さない (WeeklyTraffic.tsx:9) が、params は送る値を足すだけで、呼び先も呼ぶかどうかも変えない。(b) useWeeklyTrafficQuery は useFilterParameters を引数なしで呼ぶ (includePagination の既定値 true) が、送る値 (page / pageSize) が変わるだけで、呼び出しの条件にならない。(c) 受け口が canViewWebsiteSection に固定の値 ['overview', 'sessions'] を渡すが、その値が効くのは、ログインしていない共有トークンの経路で、共有の設定との組み合わせで決まるので、閉じていない (呼び先のフレームも無い)。(d) getQueryFilters には、受け口がいつも websiteId を渡すので、fetchWebsite は always にした。(5) 迷った点と選んだ扱い。(a) useWeeklyTrafficQuery には enabled が無く、websiteId が無くても呼ぶ作りだが、描く側は websiteId が無ければ部品を描かない (BoardComponentRenderer.tsx:30) ので、受け口の呼び出しは always にした。(b) タイムゾーンは、URL ではなくアプリの状態 (useApp の timezone。ブラウザに保存した値から始まる) から読むが、描く側から受け取る値と同じく、部品の外で決まる入力なので、parameters に書いた。ブラウザの中の保存は I/O に書いていない。(c) 丸の大きさ (最大の数との比) と曜日の並び (週の始まり) は、表示の整形なので rules に書かず、入口のフレームの summary に書いた。(d) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。 (6) レビューへの対応 (1 回。high 0 件、medium 0 件、low 1 件。直した)。getWeeklyTraffic の website_event (PostgreSQL / ClickHouse) と website_event_stats_hourly の fields に、直帰を除くフィルターの結合で使う visit_id (filter) を足し、根拠に prisma.ts:242 / :247 と clickhouse.ts:211 / :224 を足した。"
