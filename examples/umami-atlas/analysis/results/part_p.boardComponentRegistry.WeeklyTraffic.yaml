summary:
  status: interpretation
  value: "ボードに置く「週の訪問の表」の部品 (登録表の type: WeeklyTraffic)。描く側から受け取ったサイトについて、描く画面の URL の期間と絞り込み、選んでいるタイムゾーンで、曜日 × 時ごとの訪問者の数を GET /api/websites/[websiteId]/sessions/weekly で読み、丸の大きさで出す。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection でサイトを見てよいかを確かめ (セクションは overview / sessions。ログインした利用者なら canViewWebsite が website / link / pixel / board / team_user を読み、website と一緒に share も読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getWeeklyTraffic で website_event (ClickHouse では、イベントの列で絞らなければ時間ごとの集計表 website_event_stats_hourly) を、曜日と時ごとにまとめて、重複を除いたセッションを数える。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。書き込みは、Redis の website:* のキャッシュだけ。ほかの入口へのつながりは無い"
