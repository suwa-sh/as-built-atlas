"summary":
  "status": "interpretation"
  "value": "ボードに置く「イベントのグラフ」の部品 (登録表の type: EventsChart)。描く側から受け取ったサイトについて、描く画面の URL の期間と絞り込みで、カスタムイベントの名前・時刻の単位ごとの件数を GET /api/websites/[websiteId]/events/series で読み、名前ごとの積み上げ棒グラフに描く。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは events) でサイトを見てよいかを確かめる (ログインした利用者なら canViewWebsite が website / share / link / pixel / board / team_user を読む)。getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getEventStats で website_event (ClickHouse で絞り込みが無ければ時間ごとの集計表 website_event_stats_hourly) を数える。描く側が limit を渡せば、件数の多い名前の上位だけを数える。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。DB への書き込みは無い (Redis の website:* にキャッシュを書くことはある)。ほかの入口へのつながりは無い"
