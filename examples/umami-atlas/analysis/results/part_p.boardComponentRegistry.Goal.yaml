summary:
  status: interpretation
  value: 'ボードに置く「ゴール」の部品 (登録表の type: Goal)。描く側から受け取ったサイトと、保存した部品の設定の reportId で、ゴールの定義を GET /api/websites/[websiteId]/goals/[goalId] で読む (report。reportId が無ければ読まずに案内を出す)。定義の種類が goal で、サイトが同じなら、URL の期間と絞り込みで GET /api/websites/[websiteId]/goals/[goalId]/stats を呼び、ゴールに達したセッションの数と全体のセッションの数を website_event から数えて、達成率を描く。集計の受け口は、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。どちらの受け口も、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、report を読んで、見てよいかを確かめる (管理者か report の作成者でなければ canViewWebsiteSection の goals。ログインした利用者なら canViewWebsite が website / share / link / pixel / board / team_user を読む)。書き込みは無い。Goal の編集と削除のメニューは、BoardGoal が allowEdit={false} を固定で渡すので描かれず、辿っていない。ほかの入口へのつながりは無い'
