notes: '(1) 部品の入口として分析した。入口のフレームは、登録表の項目 Goal (boardComponentRegistry.tsx:163) が指すコンポーネント BoardGoal (BoardGoal.tsx:9)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、reportId、isPreview) と、描く画面の URL のクエリ (期間、絞り込み) を、入口のフレームの parameters に書いた。登録表のこの項目は componentByEntityType を持たないので、替わる先のコンポーネントは無い。(2) 固定の値で閉じている呼び出しは 1 件。Goal は allowEdit && !isSharePage のときだけ SavedDefinitionEditButton (と、その中の GoalEditForm、定義の更新 POST と削除 DELETE …/goals/[goalId]) を描く (Goal.tsx:59) が、BoardGoal が allowEdit={false} を直接書いて渡す (BoardGoal.tsx:60)。3 つの条件を確かめた: (a) 値は、この入口の木の中のコード (BoardGoal) に直接書いたリテラル。(b) 条件は allowEdit と isSharePage の AND だが、allowEdit が false なら isSharePage の値によらず成り立たないので、その値だけで決まると見た。(c) この木の中で Goal を描くのは BoardGoal の 1 か所だけ。だから、その先をフレームにせず、条件を持つフレーム goal の summary と、この notes に書いた (フレームに notes が無いため。このリポジトリの決まり)。既にある画面の結果 (websites.websiteId_d.goals) が Goal の rules に書いている「編集と削除のメニューを出す条件」は、この入口では決して動かない枝の話なので、rules にせず summary に書いた。(3) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。BoardGoal は useGoalDefinitionQuery (BoardGoal.tsx:21) を Goal (:52) より先に呼ぶので、parseRequest → checkAuth、getReport、canViewReport → canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser は、定義の GET (…/goals/[goalId]) の下に書いた。集計の GET (…/goals/[goalId]/stats) の下には、新しく着く getQueryFilters と getGoal だけを書いた。canViewReport が区画の無い種類のときに呼ぶ canViewWebsite (report.ts:46) は、canViewWebsiteSection の下に書いた処理と同じで、canViewReport は終端にならないので、フレームを足さず summary に書いた (既にある画面の結果は、別のフレームに書いている)。fetchWebsite が呼ぶ getWebsite は、q_get_website の下に書いた経路と同じなので、フレームにしていない (fetchWebsite 自身が Redis の I/O を持つ)。(4) id の無い goals/stats の受け口 (useGoalQuery.ts:12) は、Goal が読んだ定義の id をいつも渡すので、この入口からは呼ばれないように見える。ただし id は保存されたデータから来る値で、固定の値で閉じている呼び出しの条件 (a) に当たらないので、決まりどおり conditional のフレームにし、呼び先がすべて他の下に書いた処理なので、いちばん早い parseRequest → checkAuth を I/O まで書き直した。(5) 綴りと木は、同じ処理を書いている既にある結果 (part_p.boardComponentRegistry.WebsiteChart、websites.websiteId_d.goals) を出発点にし、根拠の行は対象のコードで確かめた。API_URL と BASE_PATH は、木の最初のフック (use_goal_definition_query) に 1 回だけ書いた (その下の API の呼び出しは conditional だが、このリポジトリの決まりどおり)。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。ほかの入口の結果が checkAuth に書いている CLOUD_MODE (API キーを受け付けるかの切り替え) は、API キーの枝を辿らないこの入口では有無で結果が変わらないので、書いていない。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(6) useDateRange はブラウザに保存した期間 (localStorage) を読むが、サーバーのデータではないので I/O に書かず、parameters と summary に書いた。getGoal は直帰を除くフィルター (excludeBounceQuery) を使わないので、excludeBounce は送られても集計に効かない。EmptyPlaceholder、LoadingPanel、ProgressBar などは見た目だけの部品なので、フレームにしていない。links は 1 件も無い。(7) レビューへの対応 (1 回。指摘は medium 2 件、low 3 件)。直した 4 件: 書き直した checkAuth (q_check_auth_rw_goals_stats_noid) の Redis の auth:* の読み取りを、最初の checkAuth と同じ interpretation にした。canViewWebsite に、管理者の確認を role の guards (user.isAdmin) として足した。getGoal の PostgreSQL の session の読み取りの note に、referrer の絞り込みでも結合することを足した (prisma.ts:297-300)。入口の summary の canViewWebsite が読む表に share を足した。直さなかった 1 件 (low): checkAuth の CLOUD_MODE。CLOUD_MODE が切り替えるのは API キーの枝 (auth.ts:74) だけで、部品のフックはログインのトークンを付ける (useApi.ts:28) ので、この入口では有無で結果が変わらない (分析の skill の「この入口では有無で結果が変わらない設定も書かない」)。同じ判断の WebsiteChart の部品の結果にそろえた。'
