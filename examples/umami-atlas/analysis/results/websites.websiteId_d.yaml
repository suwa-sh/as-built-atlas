notes: "(1) プロファイル 0.4.0 / 指示書 0.4.0 で分析し直した。前の版 (0.3.0) の結果を出発点にし、根拠の行と内容は対象のコードで確かめ直した。足した観点: 呼び出しの条件 (when)、読み書きの列 (fields)、権限の確認 (guards)、設定 (settings)、業務のルール (rules)。(2) 同じ処理の置き場を、プロファイルの決まり (入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書く) に合わせて直した。前の版は呼び出し行のファイルのパス順で決めていたので、木が変わった。parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、最初に着く GET values (WebsiteControls → WebsiteFilterButton → FilterEditForm → FieldFilters → FilterRecord → useWebsiteValuesQuery) の下。FieldFilters と PropertyFilters は FilterEditForm の下 (SegmentEditForm からも描く)。canViewSharedWebsiteFilters は GET segments の下。canUpdateWebsite は POST segments の下。useWebsiteAnnotationsQuery は WebsiteChart の下。AnnotationsModal は AnnotationsButton の下 (WebsitePage.tsx:31 が :44 より先)。useWebsiteMetricsQuery は MetricsTable の下。(3) 呼び先がすべて他の呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、決まりどおり、いちばん早い呼び出しを I/O を持つフレームまで書き直した (id の末尾が _rw<数字>)。canViewSharedWebsiteFilters / canViewSharedWebsite / canUpdateWebsite の下の getWebsite まで、GET segments/[segmentId] と WorldMap の下の parseRequest → checkAuth まで。書き直したフレームには、権限の確認・設定・ルールを繰り返して書いていない (元のフレームに 1 回だけ書いた)。I/O は、終端の決まりを満たすために書いた。(4) 同じ関数でも届く先が違うものは、まとめずに書いた。useUpdateQuery は SegmentEditForm (POST segments) と AnnotationEditForm (POST annotations / annotations/[annotationId])。生の SQL の external (src/lib/prisma.ts:746、src/lib/clickhouse.ts:721) は、問い合わせの関数ごとに渡す SQL (読む表の組み合わせ) が違うので関数ごと。Redis の get (src/lib/redis.ts:37) はキー (auth:* / website:* / account:*) ごと。pagedQuery の findMany / count (src/lib/prisma.ts:761 / :775) は表 (segment / annotation) ごと。(5) 辿らなかったもの。checkAuth の API キーの経路 (src/lib/auth.ts:75 の checkApiKeyAuth): 画面のフックはログインのトークンを付ける (src/components/hooks/useApi.ts:28) ので、umami_ で始まる API キーは届かないと読んだ。GET values の getWebsiteSegments の枝 (route.ts:48): FieldFilters の項目 (useFields) に segment / cohort が無い。GET metrics の getEventMetrics (route.ts:64): この画面の表は type に event を渡さない (拡大表示の getEventExpandedMetrics は、メニューに event があるので届く)。FilterEditForm のイベントのプロパティの欄 (PropertyFilters の source: event。FilterEditForm.tsx:166): パスが /events で終わるときだけ。ExportButton と MonthFilter (WebsiteControls.tsx:42 / :43): この画面は allowDownload / allowMonthFilter を渡さない。UnitFilter、DateFilter、PageviewsChart、MetricCard、WebsiteExpandedMenu、MetricLabel / FilterLink は、見た目か、同じ画面の URL のクエリを書き換えるだけなので、フレームにしていない。(6) links は 1 件も無い。この画面からの router.push と Link は、どれも updateParams / replaceParams で同じ画面の URL のクエリを書き換えるもの。FilterLink の外部リンクは、計測している対象のサイトの URL で、入口ではない。(7) 迷った点と選んだ扱い。(a) Tabs / TabPanel の中の部品 (SegmentFilters、PropertyFilters、MetricsTable) を、タブを選ぶまで描くかどうかは UI ライブラリの動きで、リポジトリからは読めない。コードの条件 (この画面ではいつも成り立つ) だけを見て always にし、note に書いた。(b) 早い return のうち、管理者なら確認を飛ばす (canViewWebsite / canUpdateWebsite) のような業務の分かれ道の後ろにある呼び出しは conditional、入力の誤り・見つからない・権限の不足で打ち切るだけのものの後ろは always にした。(c) 直帰を除くフィルターの定義 (src/lib/prisma.ts:236 / src/lib/clickhouse.ts:205 の getExcludeBounceQuery) は、段になっていない共通の関数にあり、ほとんどの問い合わせが使う。ルールとしては、入口から辿る順で最初に使う getWebsiteStats に 1 回だけ書いた。(d) 設定は、読んで使っている段に書いた: CLICKHOUSE_URL は runQuery を呼ぶ問い合わせの関数ごと、DATABASE_REPLICA_URL は生の SQL を実行する external ごと (DATABASE_URL は、分析リポジトリの決まりに従って settings に書いていない)、API_URL は API を呼ぶフックごと、REDIS_URL は checkAuth と fetchWebsite、CLOUD_MODE は checkAuth と getQueryFilters (setWebsiteDate)。Prisma のモデルのメソッドを呼ぶ external (user.findUnique など) の接続先も DATABASE_URL で決まるが、クライアントを作る共通の場所 (src/lib/prisma.ts:860) で読むので、段には書いていない。BASE_PATH (URL の前に付く置き場のパス) と LOG_QUERY (ログだけ) も書いていない。(e) 集計する列が type で決まる問い合わせ (metrics / metrics/expanded) の fields には、この画面が渡す type に当たる列を書いた。URL のフィルターで決まる列は書かず、note に書いた。(f) guards は、確認を実際に行う関数 (checkAuth、canViewWebsiteSection、canViewWebsite、canViewSharedWebsite、canViewSharedWebsiteFilters、canUpdateWebsite) の段に書き、それを呼んで 401 を返すだけの受け口には書いていない。(8) レビューへの対応。1 回目 (high 1 件、low 1 件) は両方直した: getPageviewExpandedMetrics が直帰と滞在時間を数えず 0 を返すこと、getEventExpandedMetrics 自身もカスタムイベントに絞る条件を足すこと。2 回目 (high 0 件、medium 3 件、low 3 件) も全部直した: リファラーの行のアイコン (Favicon) がブラウザから他社のサービスへ取りに行く経路を足した (favicon → use_config → api_config。GET /api/config はデータに届かないので、Response.json を external として閉じた)。URL が引数で切り替わる呼び出し (POST segments、session-data/properties、session-data/values) の状態を interpretation にした。Redis の auth:* の読み取りを interpretation にした (キーの形は saveAuth から読み取ったもの)。getPageviewMetrics のリファラーのルールに ClickHouse の集計表の例外を足し、getPageviewExpandedMetrics と getEventExpandedMetrics にルールを足した。直さなかった指摘は無い"
