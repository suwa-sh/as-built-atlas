"summary":
  "status": "interpretation"
  "value": "サイト 1 件の概要画面 (ダッシュボード)。サーバー側の page は URL の websiteId を WebsitePage に渡すだけで、画面の本体はブラウザ側で動く。読むもの: データのある期間 (daterange)、指標の帯 (stats)、ページビューとセッションの時系列 (pageviews)、グラフの注釈 (annotations)、12 種類の表と世界地図 (metrics)、曜日・時間帯の表 (sessions/weekly)、URL に segment / cohort があればその定義 (segments/[segmentId])。小窓を開いたときだけ読むもの: 表の拡大表示 (metrics/expanded)、フィルター編集とセグメント保存の候補 (values、segments の一覧、session-data/properties と session-data/values)。統計の API は PostgreSQL と ClickHouse の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event (ClickHouse では website_event_stats_hourly も) で、URL のフィルターに応じて session / event_data / session_data も読む。書き込みは利用者の操作で起きるものだけ: 注釈の作成・更新・削除 (annotation) と、フィルターをセグメントとして保存 (segment の作成)。Redis が有効なら、統計の API がサイトのキャッシュ (website:*) を読み書きし、CLOUD_MODE で個人のサイトなら account:* も読む。どの API も checkAuth で user (Redis が有効なら auth:* も) を読み、サイトの権限の検査で website / share / link / pixel / board / team_user を読む"
