summary:
  status: "interpretation"
  value: "サイト 1 件の概要の画面。サーバー側の page は URL の websiteId を WebsitePage に渡すだけで、画面の本体はブラウザ側で動く。上の絞り込みと期間の操作 (WebsiteControls) は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。開いたときに読むもの: 指標の帯 (stats。比較の期間も集計する)、グラフの注釈 (annotations)、ページビューとセッションの時系列 (pageviews)、12 の表と世界地図 (metrics)、曜日と時間帯の表 (sessions/weekly)。利用者の操作で読むもの: 表の拡大表示 (URL に view があるとき。metrics/expanded)。書き込みは利用者の操作で起きる注釈の作成・更新・削除 (annotation) だけ。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) で、URL の絞り込みに応じて session / event_data / session_data も読む。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。URL に segment か cohort があれば、保存した定義 (segment) を読んで絞り込みに足す。リファラーの表の行には、ドメインのアイコンを、ブラウザから他社のサービス (既定は icons.duckduckgo.com。FAVICON_URL で変わり、PRIVATE_MODE では出さない) へ取りに行って出す。ほかの画面への遷移は無い (期間の単位・拡大表示・注釈の日付は、同じ画面の URL のクエリを書き換えるだけ)"
