notes: "(1) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、165 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。WebsitePage (website_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は WebsitePage.tsx:12 の import と :21 の描く行) を書いた。WebsiteControls の中 (WebsiteFilterButton → FilterEditForm → FieldFilters / SegmentFilters / PropertyFilters、WebsiteDateFilter、FilterBar → SegmentEditForm) の段は外した (WebsiteControls のフレームを含めて 48 段。その下に書いていた共通の段 34 段は、次の (2) のとおり移した)。WebsitePage が WebsiteControls に渡す値 (allowBounceFilter={true}。allowDownload / allowMonthFilter / allowCompare は渡さない) は website_page の summary に書いた。(2) 外した木の下に書いていた共通の段は、入口から、コードに書いてある順に深さ優先で辿り直して、最初に着く呼び出し元の下に移した: parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は GET stats (WebsitePage.tsx:22 の WebsiteMetricsBar → useWebsiteStatsQuery) の下。canViewSharedWebsiteFilters (書き直しの q_can_view_website_rw1 から getWebsite まで) は GET annotations (WebsiteChart → useWebsiteAnnotationsQuery) の下。canUpdateWebsite (書き直しの q_get_website_rw3) は POST annotations (AnnotationsButton → AnnotationsModal → AnnotationEditForm → useUpdateQuery) の下。外した木にだけあったフック (values、segments、segments/[segmentId]、session-data/properties、session-data/values、daterange) を、残った部品が呼んでいないことは、対象のコードで確かめた。外した段を指していた文 (「経路はフレーム … と同じ」、ほかの受け口の一覧) は直した。(3) 決まりにそろえた所: (a) checkAuth に、API キーの枝 (auth.ts:75 の checkApiKeyAuth) の 1 行を rules に足した (settings の CLOUD_MODE と REDIS_URL は前から書いてある)。(b) canViewWebsite と canUpdateWebsite の guards に、関数の中の管理者の確認を、別の 1 件 (kind: role、value: user.isAdmin) として足した。canViewWebsiteSection と canViewSharedWebsiteFilters は、ほかの入口の結果と同じく kind: other のまま (管理者の確認は、呼ぶ canViewWebsite の側に書いた)。(c) API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_stats) に 1 回だけ書き、ほかのフック (useWebsiteAnnotationsQuery、useWebsitePageviewsQuery、useUpdateQuery、useDeleteQuery、useWebsiteMetricsQuery、useWeeklyTrafficQuery、拡大表示のフックなど) からは消した (前の結果はフックごとに書き、BASE_PATH は書いていなかった)。(d) GET /api/config (useConfig) はフレームにしない決まりなので、前の結果の favicon → use_config → api_config → Response.json の 3 段を消し、そこから得る設定 (PRIVATE_MODE / FAVICON_URL) は、使う favicon の settings に書いた (前から書いてある)。favicon は、ブラウザから他社のサービスへアイコンを取りに行く external_api の読み書きを持つので、終端の決まりを満たす。(e) 結果の target は、作業定義と同じに書いた (clone_path も写した)。(4) 段の数は 165 から 114 になった (WebsiteControls の木の 48 段と、useConfig の 3 段を外した)。(5) 固定の値で閉じている呼び出し (指示書 0.4.1): GET pageviews の、比較の期間でも集計する枝 (pageviews/route.ts:35) は、WebsitePage が WebsiteChart に compareMode を渡さない (WebsiteChart.tsx:42 で compare がいつも undefined) ので閉じている。前の結果は、この枝を受け口の rules に書いていたので、消して api_pageviews の summary に書いた (レビューの指摘)。前から辿っていなかったもの: GET metrics の getEventMetrics (metrics/route.ts:64。この画面の表は type に event を渡さない)。WebsiteChart の注釈の読み取り (showAnnotations) は、WebsitePage が固定の値 true で渡すので always のまま。(6) 辿らなかったもの: checkAuth の API キーの経路 (画面のフックはログインのトークンを付ける。useApi.ts:28)。UnitFilter、PageviewsChart、MetricCard、WebsiteExpandedMenu、MetricLabel / FilterLink は、見た目か、同じ画面の URL のクエリを書き換えるだけなので、フレームにしていない。(7) links は embed の 1 件だけ。この画面からの router.push と Link は、どれも同じ画面の URL のクエリを書き換えるもの。FilterLink の外部リンクは、計測している対象のサイトの URL で、入口ではない。(8) 迷った点と選んだ扱い: (a) Tabs / TabPanel の中の部品 (MetricsTable) を、タブを選ぶまで描くかどうかは UI ライブラリの動きで、リポジトリからは読めない。コードの条件 (この画面ではいつも成り立つ) だけを見て always にした。(b) 早い return のうち、管理者なら確認を飛ばす (canViewWebsite / canUpdateWebsite) のような業務の分かれ道の後ろにある呼び出しは conditional、入力の誤り・見つからない・権限の不足で打ち切るだけのものの後ろは always にした。(c) 直帰を除くフィルターの定義 (getExcludeBounceQuery) は、段になっていない共通の関数にあり、ほとんどの問い合わせが使う。ルールとしては、入口から辿る順で最初に使う getWebsiteStats に 1 回だけ書いた。(d) 設定は、読んで使っている段に書いた: CLICKHOUSE_URL は runQuery を呼ぶ問い合わせの関数ごと、DATABASE_REPLICA_URL は生の SQL を実行する external ごと、REDIS_URL は checkAuth と fetchWebsite、CLOUD_MODE は checkAuth と getQueryFilters (setWebsiteDate)。DATABASE_URL は決まりに従って書いていない。(e) 集計する列が type で決まる問い合わせ (metrics / metrics/expanded) の fields には、この画面が渡す type に当たる列を書いた。URL の絞り込みで決まる列は書かず、note に書いた。(9) レビューへの対応 (1 回。high 0 件、medium 0 件、low 2 件。どちらも直した): GET pageviews の閉じた比較の枝を rules から消して summary に書いた。GET metrics の getEventMetrics に届かない理由の根拠に、表が type を固定の値で渡す行 (WebsitePanels.tsx、WorldMap.tsx:32) を足した"
