"notes": "(1) プロファイル 0.3.0 で書き直した。0.1.0 の結果は祖先の layout (src/app/(main)/layout.tsx の App と、websites/[websiteId]/layout.tsx の getWebsite・WebsiteLayout・WebsiteProvider・WebsiteHeader・ActiveUsers) も辿っていたが、それらは別の入口 (layout_l、layout_l.main_g、layout_l.main_g.websites.websiteId_d) なので外した。また、認証・権限・フィルターの組み立てを API ごとに I/O 付きで繰り返していたのを、同じ処理は 1 回だけ書く形にし、external の source をライブラリを実際に呼ぶ行 (Prisma の $queryRawUnsafe は src/lib/prisma.ts:746、ClickHouse の query は src/lib/clickhouse.ts:721、Redis は src/lib/redis.ts:37) に直した。SQL 系の問い合わせの I/O と根拠の行は 0.1.0 の結果のものを、同じ commit の実ファイルで確かめ直して使った。(2) 同じ処理の置き場 (呼び出し行のファイルのパスの文字コード順、同じなら行番号順。[ は小文字より前): parseRequest → checkAuth と、canUpdateWebsite、getWebsiteAnnotation は POST /api/websites/[websiteId]/annotations/[annotationId] (route.ts:36 / :45 / :49) の下。canViewSharedWebsiteFilters は GET annotations (annotations/route.ts:29。segments/[segmentId] と segments より先) の下。canViewWebsiteSection と getQueryFilters は GET metrics/expanded (metrics/expanded/route.ts:34 / :39。metrics / pageviews / session-data / sessions/weekly / stats / values より先) の下。FieldFilters と PropertyFilters は SegmentEditForm (segments/SegmentEditForm.tsx:89 / :101。src/components/input/FilterEditForm.tsx より先) の下。SegmentFilters は FilterEditForm が segment と cohort の 2 回描くが、同じ URL・同じ表なので 1 つにした。canViewWebsite は canViewWebsiteSection (share.ts:59) の下。getWebsite は getEntity (src/lib/entity.ts:6。load.ts と permissions/website.ts より先) の下。getTeamUser は canViewWebsite (website.ts:35) の下。getWebsiteSegment は GET segments/[segmentId] (src/app/... が src/lib/request.ts より先) の下。useWebsiteAnnotationsQuery は WebsiteChart (WebsiteChart.tsx:35。annotations/AnnotationsModal.tsx より先) の下。useWebsiteMetricsQuery は MetricsTable (MetricsTable.tsx:36。WorldMap.tsx より先) の下。AnnotationsModal は WebsitePage (WebsitePage.tsx:44。annotations/AnnotationsButton.tsx より先) の下。(3) 呼び出し元が終端になってしまうもの (canViewSharedWebsite、canViewSharedWebsiteFilters、canUpdateWebsite、WorldMap、AnnotationsButton) の下には、決まりどおり最も早い呼び出しの 1 本を I/O を持つフレームまで書き直した (id の末尾が _rw / _rw<数字>)。WorldMap と AnnotationsButton の書き直しは、受け口の中で最も早い呼び出しが parseRequest なので checkAuth の Redis の読み取りで閉じている。(4) useUpdateQuery は同じフックだが、SegmentEditForm (segments への POST) と AnnotationEditForm (annotations / annotations/[annotationId] への POST) で届く URL が違うので、まとめずにそれぞれ書いた。SQL の問い合わせ関数は、どれも同じ rawQuery の行 (prisma.ts:746 / clickhouse.ts:721) に届くが、渡す SQL (読む表の組み合わせと集計) が関数ごとに違うので、external を関数ごとに書いた。Redis の get も、キー (auth:* / website:* / account:*) ごとに書いた。(5) SegmentEditForm の中の useWebsiteSegmentQuery は、FilterBar が segmentId を渡さないので動かない (enabled が false) ため、呼び出し行の順では FilterBar より早いが、動く FilterBar の呼び出しの下に書いた。(6) フレームにしなかったもの: UnitFilter (URL の unit を変えるだけ)、DateFilter と PageviewsChart と MetricCard (見た目だけ)、ExportButton と MonthFilter (この画面では出ない)、useShare (共有画面の設定を読むだけで I/O 無し)。metrics の route の getEventMetrics は type: event のときだけで、この画面の表は event を渡さないので届かない (拡大表示の route の getEventExpandedMetrics は、メニューに event があるので届く)。WebsiteExpandedMenu (URL の view を変えるリンクを並べるだけ)。FilterEditForm と PropertyFilters の、イベントのプロパティの欄 (source: event、GET event-data/fields と event-data/values) は、パスが /events で終わるときだけなのでこの画面では出ない (FilterEditForm.tsx:38 / :166)。values の route の getWebsiteSegments の枝 (type が segment / cohort) は、FieldFilters の項目 (useFields) に segment / cohort が無いので届かない。(7) レビューの指摘への対応: 0.3.0 での最初の版では、フィルター編集の小窓・セグメント保存フォームの項目の候補・拡大表示の小窓を not_analyzed で閉じていたが、どれも辿れる経路なので終端まで辿った。SQL の副問い合わせで読む event_data / session_data の根拠を、parseFilters が実際に呼ぶ getEventPropertyFilterQuery / getSessionPropertyFilterQuery の行 (prisma.ts:309 / :313 / :576 / :702、clickhouse.ts:278 / :280 / :540 / :663) に直した。SQL の external の呼び出しの根拠を、各問い合わせの rawQuery( の行に直した。URL が文字列で 1 つの route に決まる呼び出しの call を fact にした (apiUrl で向き先が変わることは note に残した)。入口と page の summary から、祖先の layout の処理の記述を外した。2 回目のレビュー (high 0 件) の low 4 件も直した: SQL の関数が session の join と直帰除外の副問い合わせを差し込む行を根拠に足し、parseRequest / canViewSharedWebsiteFilters / getQueryFilters の「同じ関数を呼ぶ」受け口の列挙の抜けを埋め、入口の summary に account:* の読み取りを足した。(8) 直さなかった指摘: external の source は 1 行しか書けないので、2 つのライブラリ呼び出しを持つフレーム (website.findUnique と share.findFirst、pagedQuery の findMany と count、Redis の get と set) は、最初の呼び出しの行を source にし、もう一方の行を call の evidence に入れている"
