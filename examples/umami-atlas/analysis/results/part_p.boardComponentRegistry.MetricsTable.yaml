summary:
  status: interpretation
  value: 'ボードに置く「指標の表」の部品 (登録表の type: MetricsTable)。描く側から受け取った対象と、保存された部品の設定の type (どの列で数えるか) と limit (行数) で、描く画面の URL の期間と絞り込みに当たる上位の値と訪問者の数を GET /api/websites/[websiteId]/metrics で読み、割合を付けて表にする。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection で見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、type に応じて、セッションの列なら getSessionMetrics、event なら getEventMetrics、そのほかのイベントの列なら getPageviewMetrics、channel なら getChannelMetrics で、website_event (と session、ClickHouse では時間ごとの集計表 website_event_stats_hourly) を数える。絞り込みに応じて event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。type が referrer の行には、ブラウザが他社のサービス (既定は icons.duckduckgo.com) からドメインのアイコンを読む。書き込みは無い。ほかの入口へのつながりは無い'
