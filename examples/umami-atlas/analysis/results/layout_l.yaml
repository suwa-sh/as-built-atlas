summary:
  status: interpretation
  value: "すべての画面を包むいちばん外側の枠 (app 直下の layout)。データの読み書きも外部への送信もしない。環境変数 DISABLE_UI があれば空の html と body だけを返し、画面を何も描かない。そうでなければ html の head にアイコンと manifest と meta (検索エンジンに載せない noindex,nofollow など) を置き、body の Suspense の中で Providers を描いて、包まれる画面 (children) をその中に置く。Providers はブラウザ側で動き、UI ライブラリの設定、ルーター、翻訳 (next-intl)、TanStack Query のクライアント (再試行なし、60 秒は新しいとみなす)、エラーの受け止め (画面にエラーを出し、ブラウザの console に書くだけ) を順に重ねる。翻訳の文言は en-US を同梱し、それ以外の言語は同じサーバーの静的ファイル <BASE_PATH>/intl/messages/<言語>.json をブラウザから読む。最初の言語は、ブラウザに保存した値、環境変数 DEFAULT_LOCALE、en-US の順で決まり、URL に ?locale= があればその言語に切り替える。generateMetadata は、要求のヘッダーからサイトの基準 URL を決め (host は x-forwarded-host か host、プロトコルは x-forwarded-proto か x-forwarded-protocol。どちらも無ければ、host が localhost / 127.0.0.1 / [::1] で始まるなら http、それ以外は https。host が無いか URL にできなければ https://umami.is)、タイトルの書式 (%s | Umami) を決める"
