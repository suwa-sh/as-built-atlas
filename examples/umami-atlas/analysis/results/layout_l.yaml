notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる画面) と、内側の layout ((main) など) は別の入口なので辿らない。(2) データに届かない枠なので、context.md の決まり (データに届かない画面・枠は、最後に頼るライブラリを external フレームにして閉じる) に従い、翻訳のライブラリ next-intl と、要求のヘッダーを読む next/headers を external にした。I/O は無し。(3) 翻訳の文言の読み込み: useLocale は、同梱していない言語 (en-US 以外) のとき httpGet (src/lib/fetch.ts:44 → :24 の fetch) で <basePath>/intl/messages/<言語>.json を読む。これは public/intl/messages にある同じリポジトリの静的ファイルで、当たる route ファイルは無く、他社のサービスでもない。context.md のデータの当てはめにどれも当たらないので、翻訳の小道具として扱い、フレームにも I/O にも書かなかった。(4) 言語・テーマ・時間帯・期間の選択は localStorage から読み (src/store/app.ts:15)、言語を変えると localStorage に書く (useLocale.ts:33)。ブラウザの中の保存なので I/O に書かない。(5) ErrorBoundary の onError は console.error に書くだけで、外へ送らない。(6) フレームにしなかったもの: ZenProvider / RouterProvider (UI ライブラリ @umami/react-zen の部品)、QueryClientProvider (TanStack Query のクライアントを配るだけで、ここでは問い合わせをしない)、ErrorBoundary と useMessages (翻訳の文言を引くだけ)、useLocale (翻訳の小道具)、getBaseUrl (ヘッダーから URL を組み立てるだけ)、フォント (next/font/google) と CSS の import。(7) 木の順: 入口から、コードに書いてある順に辿ると、Providers (layout.tsx:41) → next-intl (Providers.tsx:29) → next/headers (layout.tsx:49)。同じ処理が複数の呼び出し元から呼ばれる箇所は無い。(8) 設定: DISABLE_UI は layout が直接読む。BASE_PATH と DEFAULT_LOCALE は、next.config.ts が process.env.basePath / process.env.defaultLocale に写した値を、段にしていない useLocale と src/store/app.ts が読むので、その結果で動きが変わる Providers の段に、環境変数の名前で書いた。(9) 業務のルール: getBaseUrl の基準 URL の組み立て (ヘッダーの優先順、既定のプロトコル) と、TanStack Query の既定値は、業務の意味を持たない技術的な組み立てと見て rules に書かなかった (入口の summary には書いた)。言語の切り替え (?locale=) は、表示の言語を分ける判定として Providers の rules に書いた。(10) 権限の確認 (guards) と、ほかの入口へのつながり (links) は、この枠には無い。作業定義に analysis.tests が無いので、tests は書いていない。(11) レビューの指摘 3 件 (どれも low、根拠の行の不足) を直した: 入口の summary に、http になる host (127.0.0.1 と [::1]) を足し、根拠に get-base-url.ts:14、next.config.ts:15 / :21、constants.ts:25 を足した。言語の切り替えのルールの根拠に、constants.ts:3 と storage.ts:3 を足した"
