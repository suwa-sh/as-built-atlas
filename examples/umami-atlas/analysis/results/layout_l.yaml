    - { file: src/lib/get-base-url.ts, line: 32 }
    - { file: src/lib/get-base-url.ts, line: 33 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる画面) と、内側の layout ((main) など) は別の入口なので辿らない。(2) データに届かない枠なので、context.md の決まり (データに届かない画面・枠は、最後に頼るライブラリを external フレームにして閉じる) に従い、翻訳のライブラリ next-intl と、要求のヘッダーを読む next/headers を external にした。I/O は無し。(3) 翻訳の文言の読み込み: useLocale は、同梱していない言語 (en-US 以外) のとき httpGet (src/lib/fetch.ts の fetch) で basePath + /intl/messages/<言語>.json を読む。これは public/intl にある同じリポジトリの静的ファイルで、サーバーのデータでも他社のサービスでもないので、翻訳のライブラリの一部として扱い I/O に書かなかった ((main) の枠の分析と同じ扱い)。(4) 言語・テーマ・時間帯・期間の選択は localStorage から読み (src/store/app.ts:15)、言語を変えると localStorage に書く (useLocale.ts:33)。ブラウザの中の保存なので I/O に書かない。(5) ErrorBoundary の onError は console.error に書くだけで、外へ送らない。(6) generateMetadata が読むのは要求のヘッダーだけで、ヘッダーが無いか URL にできなければ HOMEPAGE_URL を基準にする。(7) フレームにしなかったもの: ZenProvider / RouterProvider (UI ライブラリ @umami/react-zen の部品)、QueryClientProvider (TanStack Query のクライアントを配るだけで、ここでは問い合わせをしない)、ErrorBoundary と useMessages (翻訳の文言を引くだけ)、getBaseUrl (ヘッダーから URL を組み立てるだけ)、フォント (next/font/google はビルド時に取り込む) と CSS の import。(8) レビューの指摘 2 件 (どちらも low) を直した: 入口の summary の根拠に、TanStack Query の設定 (Providers.tsx:13 / :15) と console への書き出し (ErrorBoundary.tsx:8) の行を足した。基準 URL を決めるヘッダーに x-forwarded-protocol と、ヘッダーが無いときの既定 (localhost なら http、それ以外は https) を書き足し、根拠に get-base-url.ts:23 / :32 / :33 を足した"
