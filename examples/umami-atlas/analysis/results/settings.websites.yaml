    - { file: "src/app/api/users/[userId]/websites/route.ts", line: 33 }
    - { file: src/app/api/websites/charts/route.ts, line: 37 }
notes: "(1) 枠 ((main) と settings の layout、そこから描かれる App など) の処理は辿っていない。ただし、(main) の枠の App が、ログイン中のユーザーとアプリの設定 (config) をストアに得てから children を描く (App.tsx:43、:54、:81) ことは、この画面のフックの条件を決めるのに使った: useLoginQuery の POST /api/auth/verify (enabled: !user) と、useConfig の GET /api/config (config が無いとき) は、この入口からは条件が成り立たないように見えるが、消さずに conditional で書き、note に理由を書いた。(2) 同じ関数は、入口からコードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に 1 回だけ書いた。WebsitesDataTable では useLoginQuery (17 行目) が最初なので、parseRequest → checkAuth → getUser は POST /api/auth/verify の下に書いた。ほかの受け口 (users/[userId]/websites の GET、config の GET、websites/charts の GET) の summary には、経路はフレーム q_parse_request と同じ、と書いた。(3) useUserWebsitesQuery の URL は引数で 3 通りに分かれる (teamId があれば /teams/<teamId>/websites、無くて userId があれば /users/<userId>/websites、どちらも無ければ /me/websites)。この画面では、teamId は URL に段が無いのでいつも undefined、userId はログイン中のユーザーの id (枠がユーザーを得てから描く) なので、いつも /users/<userId>/websites になる。context.md の決まり (候補が有限で全部読めるなら、それぞれフレームにする) と、成り立たないように見える呼び出しも conditional で書く決まりのとおり、ほかの 2 つ (GET /api/teams/[teamId]/websites と GET /api/me/websites) も conditional のフレームにし、成り立たないように見える理由を note に書いた (websites / boards.boardId_d.edit の結果の書き方)。コードの順で teams の候補が先なので、canViewTeam → getTeamUser と、pagedQuery のライブラリの呼び出し (ext_prisma_paged_website) は teams の下に書いた。GET /api/me/websites は、呼び先がすべてほかの呼び出し元の下に書いてあり終端になるので、parseRequest → checkAuth を、読み書きを持つ段まで書き直した (id に _rw が付くフレーム)。(4) Favicon は、WebsitesDataTable の renderLink の中に書いてあり、それを WebsitesTable の名前の列が行ごとに呼ぶ。JSX を書いてあるファイルの段 (WebsitesDataTable) を呼び出し元にし、行があるときだけの conditional にした。(5) 権限の確認の関数 canViewBatchWebsites は DB を読むので、段にして guards をそこに書いた。GET /api/users/[userId]/websites の本人の確認は関数になっていないので、ほかの入口の結果と同じく、value にコードの式を肯定の形 (auth.user.id === userId) で書いた。この画面では userId がログイン中のユーザーの id なので、いつも通る。(6) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は辿っていない。ブラウザはログインのトークンを付ける (useApi.ts:28)。(7) 設定: BASE_PATH は、API を呼ぶフックごとに書いた (どの API の URL にも前に付く。api-url.ts:43、:44)。API_URL は、/auth と /config 以外の API を呼ぶフックに書いた (/auth/verify と /config には効かない。api-url.ts:6、:39)。DATABASE_URL は書いていない。(8) WebsiteSparkline (グラフの絵)、DateDistance、LinkButton、SortableLabel、SectionHeader、DataGrid (一覧の枠。検索とページ送りは、同じ画面の URL のクエリを書き換えるだけ)、useNavigation (URL の組み立て)、useMessages (翻訳) は、見た目だけか、データに届かない部品なので、フレームにしていない。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘 5 件 (medium 1、low 4) は、すべて直した: GET /api/users/[userId]/websites の呼び出しを interpretation にした。BASE_PATH を useUserWebsitesQuery と useWebsiteListChartsQuery にも書いた。入口の summary の、ログインの確認の言い方を直した。useUserWebsitesQuery のほかの 2 つの行き先 (GET /api/teams/[teamId]/websites と GET /api/me/websites) を conditional のフレームにした ((3) を見よ)"
