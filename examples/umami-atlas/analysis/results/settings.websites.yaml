summary:
  status: interpretation
  value: "設定の画面で、ログイン中のユーザーが持つサイトの一覧を出す画面。サーバー側の page は、params の teamId (この URL には [teamId] の段が無いので、いつも undefined) を WebsitesSettingsPage に渡すだけで、本体はブラウザ側で動く。WebsitesDataTable が、ログイン中のユーザーを useLoginQuery から得て (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)、GET /api/users/[userId]/websites でそのユーザーのサイトの一覧 (website、持ち主の user、share) を、URL のクエリの検索語・並べ替え・ページで読む。一覧にサイトがあれば、GET /api/websites/charts で直近 7 日の訪問者数の小さなグラフを読む (website_event。CLICKHOUSE_URL があれば ClickHouse の website_event_stats_hourly)。各行の名前の横に、サイトのドメインのアイコンを、ブラウザが他社のサービス (既定は icons.duckduckgo.com) から読む (PRIVATE_MODE なら読まない)。名前は /websites/<id> へ、編集ボタンは /websites/<id>/settings へ移る。認証を飛ばす GET /api/config のほかは、どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行う。書き込みは無い"
  evidence:
