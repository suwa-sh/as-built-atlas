summary:
  status: interpretation
  value: "1 つのサイトの保存済みゴール (あるページの表示か、あるイベントに達したセッションの割合) の一覧画面。GoalsPage が GET /api/websites/<id>/goals で type が goal の report を読み、1 件ずつ GET …/goals/<goalId>/stats で集計する。集計は report の parameters (種類と値) を使い、website_event から、条件に当たるセッションの数と全体のセッションの数を数える (URL の絞り込みによっては session・session_data も読み (event_data の読み取りも書いたが、イベントのプロパティの絞り込みがこの画面では送られないので、読まれないように見える)、URL に segment / cohort があれば保存済みの segment も読む)。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。追加と編集のフォームは report を作成 (POST …/goals) または更新 (POST …/goals/<goalId>) し、メニューから削除 (DELETE …/goals/<goalId>) もできる。フォームの値の入力欄は、値の候補 (values) を読む。上部の絞り込みと期間の操作は、共有の部品 WebsiteControls (別の入口 part_p.shared_a.WebsiteControls) で、ここでは辿らない。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / share / link / pixel / board / team_user を読む。書き込み (作成・更新・削除) は、管理者・report の作成者・サイトの持ち主・チームで権限を持つ人だけができる。GoalsPage と Goal は URL が /share/ を含むとき追加・編集・削除の部品を出さないが、この URL (/websites/<id>/goals) では、いつも出る"
