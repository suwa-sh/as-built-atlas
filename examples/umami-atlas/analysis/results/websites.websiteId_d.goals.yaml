notes: "[分析し直し (skill 0.4.1)] 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、109 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。段は 109 から 85 になった。(a) GoalsPage (goals_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は GoalsPage.tsx 3 行の import と 21 行の描く行) を書いた。WebsiteControls と、その下の 28 段 (絞り込みのボタン、期間の選択と daterange の受け口、FilterBar とセグメントの読み取り・保存の受け口、その下の権限の確認と書き直した段) を外した。渡す値 (websiteId だけ。ほかは既定) は goals_page の summary に書いた。前の結果の WebsiteControls の rules (共有の設定で絞り込みを出さない) は、部品の入口のものなので外した。(b) 外した部分に、最初に着いていた共通の段を移した: canUpdateWebsite (前は POST …/segments の下) は、深さ優先で次に着く POST …/goals (追加のフォーム) の下に always で移し、権限の確認 (role の user.isAdmin、ownership の canUpdateWebsite、permission の PERMISSIONS.websiteUpdate) をそこに書いた。getWebsiteSegment (前は GET …/segments/[segmentId] の下) は、getQueryFilters の segment / cohort の分かれ道の下に移した (次の (c))。canViewSharedWebsite と canViewSharedWebsiteFilters は、外した受け口だけが呼んでいたので、この木から無くなった。(c) 固定の値で閉じている呼び出し (指示書 0.4.1) の確かめ: getQueryFilters は、最初に values の受け口の下で着く。この経路では、呼ぶ側の useWebsiteValuesQuery がクエリに segment と cohort を付けず (useWebsiteValuesQuery.ts 54〜59 行)、受け口のスキーマも落とすので、segment / cohort の分かれ道 (request.ts 132〜170 行) は着かない。ただし、この入口の木の中の別の呼び出し元 (goals/<goalId>/stats の受け口。stats/route.ts 21 行で getQueryFilters を呼ぶ) は、URL の絞り込みの segment / cohort を付けて着く (useAnalyticsQuery.ts 15・22 行、useFilterParameters.ts 35・36 行、schema.ts 66・67 行) ので、決まりの 3 つ目の条件に当たらず、閉じた呼び出しにはしなかった。決まりの「その経路の下に書く」のとおり、stats の受け口の下に getQueryFilters を書き直し (q_get_query_filters_rw_stats)、分かれ道の decision の rules と、conditional の getWebsiteSegment をそこに書いた。values の側の q_get_query_filters からは、その rules を外し、summary に着かない理由を書いた。values の受け口の、type がセグメントの種類のときの分かれ道 (values/route.ts 48 行) は、スキーマの type (fieldsParam) が segment と cohort を含まないので決して着かず、decision の rules を外して summary に書いた (websites.websiteId_d.cohorts の結果と同じ扱い)。(d) 閉じた呼び出しにしなかったもの: canViewReport の、区画の無い種類のときの canViewWebsite (report.ts 46 行) は、受け口が report.type !== 'goal' で 404 にする (goals/[goalId]/stats/route.ts 17 行、goals/[goalId]/route.ts 15 行) ので通らないように見えるが、条件を決めるのは保存された report の type で、木の中に直接書いた値ではないので、前の結果どおり conditional のフレーム (q_can_view_website_rw_report_nosection) にし、理由を note に書いた。id の無い goals/stats の受け口も、id が保存されたデータから来るので、conditional のまま。Goal の allowEdit は、GoalsPage が渡さず既定の true (固定の値で、開く側) なので、編集と削除のメニュー (SavedDefinitionEditButton) は、前の結果どおり always (残る条件の /share/ は、この URL では成り立たない)。(e) 共通の段は、決まりと合っていることを確かめた: checkAuth は settings に CLOUD_MODE と REDIS_URL、rules に API キーの枝の 1 行を持ち、getUser も書いてある。canViewWebsite・canUpdateWebsite・canDeleteWebsite の guards は、持ち主の確認 (ownership) と別に、管理者の確認 (role、user.isAdmin) を 1 件ずつ持つ。canViewReport・canUpdateReport・canDeleteReport も、role の user.isAdmin と ownership を持つ。canViewWebsiteSection は、ほかの入口の結果と同じく kind: other のまま。API_URL と BASE_PATH は、この入口で最初に API を呼ぶ use_goals_query に 1 回だけ書いてある。target は作業定義と同じ。[木の書き方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。GoalsPage の中の順は、useGoalsQuery (12 行) → WebsiteControls (21 行。embed で止める) → GoalAddButton (24 行) → Goal (32 行)。呼び先がすべてほかの呼び出し元の下にあって終端になるフレームは、いちばん早い呼び先を、読み書きを持つ最初のフレームまで、もう一度書いた (確認・設定・ルールは重ねない)。GoalEditForm は、id の有無で呼ぶ URL が違うので、追加 (goal_edit_form_create) と編集 (goal_edit_form_edit) に分けた。ライブラリを呼ぶ同じ行 (prisma.ts の $queryRawUnsafe、clickhouse.ts の query、redis.ts の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。削除の URL は、report の type から `${type}s` で組み立てるので interpretation にした。getGoal の生の SQL の、URL の絞り込みで足される条件の列は、実行時に組み立てるので書かず、note に書いた。ブラウザの中の保存 (期間の localStorage など) は I/O に書いていない。作業定義に analysis.tests が無いので、テストとの対応は分析していない。 [レビュー] 指摘は 2 件 (low 2)。どちらも直した: getGoal の event_data の読み取り (PostgreSQL と ClickHouse) に、この画面ではイベントのプロパティの絞り込みが送られず読まれないように見える理由を note に足し、入口と q_get_goal の summary の言い方を合わせた (読み取りは消さずに残した。条件を決めるのは URL のパスで、木の中に直接書いた値ではないため)。high が無いので、もう一度のレビューはしていない。"
