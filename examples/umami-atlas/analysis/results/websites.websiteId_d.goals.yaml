notes: "プロファイル 0.4.0・skill 0.4.0 での最初の分析。[作り方] この画面は、ファネルの画面 (websites.websiteId_d.funnels) と同じ形 (一覧のフック → 一覧の受け口、WebsiteControls、追加のボタンとフォーム、1 件ごとの集計と編集・削除のメニュー) で、受け口のファイル (goals/route.ts、goals/[goalId]/route.ts、goals/[goalId]/stats/route.ts) も、ファネルの受け口と行の位置まで同じ。共通の部品と関数 (認証、権限、getReports / getReport / createReport / updateReport / deleteReport、WebsiteControls の下、values の受け口) は、ファネルの結果の書き方と綴りに合わせ、根拠の行は対象のコードで確かめ直した。ゴールに固有のもの (GoalsPage・Goal・GoalAddButton・GoalEditForm・useGoalQuery・useGoalDefinitionQuery・getGoal) は、このコードを読んで書いた。[木の書き方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。GoalsPage の中の順は、useGoalsQuery (12 行) → WebsiteControls (21 行) → GoalAddButton (24 行) → Goal (32 行)。その結果、parseRequest → checkAuth → getUser と canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser は GET …/goals の下、getWebsiteSegment は GET …/segments/[segmentId] の下、canUpdateWebsite は POST …/segments の下、getQueryFilters → fetchWebsite / fetchAccount は、追加のフォーム (GoalAddButton → GoalEditForm → LookupField → values の受け口) の下、getReport と canViewReport は GET …/goals/[goalId]/stats の下になった。ファネルの画面と違い、ゴールのフォームには event-data/properties を呼ぶ段や、プロパティの絞り込みの行が無いので、getQueryFilters は values の受け口の下に移った。[迷った点と選んだ扱い] (1) GoalEditForm は同じ関数だが、id の有無で呼ぶ URL が違うので、追加 (goal_edit_form_create) と編集 (goal_edit_form_edit) に分けた。(2) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canViewSharedWebsite、canViewSharedWebsiteFilters、canViewReport の下の canViewWebsiteSection、canDeleteWebsite、canUpdateReport の下の canUpdateWebsite、POST …/segments の下の canUpdateWebsite、GET …/goals/[goalId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(3) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(4) 削除の URL は、report の type から `${type}s` で組み立てるので interpretation にした。ほかの画面から受け口への呼び出しは、URL の形がコードから読め、当たる route が 1 つに決まるので fact。(5) 共通の絞り込みの部品 (WebsiteFilterButton のダイアログと、セグメントとして保存のフォームの中の入力欄) は、ファネルの結果と同じく unknown + not_analyzed で閉じた。サイトの多くの画面が同じものを使う部品で、この画面に固有の処理ではないため。(6) checkAuth の API キーの経路 (checkApiKeyAuth) は、作業の決まりのとおり段にせず、checkAuth の rules に 1 行書いた。(7) getGoal の生の SQL のうち、期間 (created_at) とイベントの種類 (event_type) の条件は parseFilters が作るが、どの列かはコードから読めるので fields に書いた。URL の絞り込みで足される条件の列は、実行時に組み立てるので書かず、note に書いた。(8) 期間の選択や絞り込みを消す操作は、同じ画面の URL のクエリを書き換えるだけなので、links に書いていない (ほかの入口へのつながりは無かった)。(9) ブラウザの中の保存 (期間の localStorage など) は I/O に書いていない。(10) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(11) useGoalQuery は id が無いとき goals/stats を呼ぶが、この画面の Goal は、いつも id を渡すので、GET …/goals/stats の受け口はフレームにしていない。 [レビュー] 指摘は 9 件 (medium 2、low 7) で、すべて直した: report の update に updated_at を足した。id の無い GET …/goals/stats と、canViewReport の区画が無いときの canViewWebsite を、conditional のフレームにした。API_URL を最初に API を呼ぶ use_goals_query だけに残し、BASE_PATH を同じフレームに足した。生の SQL の external に DATABASE_REPLICA_URL を足した。values の受け口に、期間と type のクエリの検証を足し、segment / cohort の分かれ道に届かないことを note に書いた。プロパティの絞り込みの fields に data_type を足した。high が無いので、もう一度のレビューはしていない。"
