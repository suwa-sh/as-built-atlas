summary:
  status: "interpretation"
  value: "ボードに置く「売上の内訳の表」の部品 (登録表の type: RevenueMetricsTable)。描く側から受け取ったサイト・軸 (type。既定 referrer)・通貨 (無ければブラウザに保存した通貨、DEFAULT_CURRENCY、USD の順) について、描く画面の URL の期間と比較の種類と絞り込みで、まず GET /api/websites/[websiteId]/revenue/stats で売上の合計を読み、読めたら GET /api/websites/[websiteId]/revenue/metrics で軸ごとの売上を読む。上位 10 件を、売上と、合計に対する割合の表で出す。軸が referrer のときは、行ごとにドメインのアイコンを、ブラウザが他社のサービス (既定は icons.duckduckgo.com) へ取りに行く。2 つの受け口は、どちらも最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは revenue) でサイトを見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめる (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)。合計は getRevenueStats を、いまの期間と比較の期間で 2 回呼び、内訳は getRevenueMetrics が数える。どちらも、絞り込みに当たるセッションを website_event から集め、その売上の行 (PostgreSQL は revenue、ClickHouse は website_revenue) を、通貨を合わせて数える。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。DB への書き込みは無い (Redis の website:* のキャッシュを書くことはある)。ほかの入口へのつながりは無い"
