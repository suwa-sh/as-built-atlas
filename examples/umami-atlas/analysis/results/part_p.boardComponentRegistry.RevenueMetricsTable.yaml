notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 RevenueMetricsTable (boardComponentRegistry.tsx:299) が指すコンポーネント BoardRevenueMetricsTable (BoardRevenueMetricsTable.tsx:21)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、type、currency) と、描く画面の URL のクエリ (期間、比較の種類、絞り込み) を、入口のフレームの parameters に書いた。登録表のこの項目は componentByEntityType を持たないので、替わる先のコンポーネントは無い。描く側が渡す isPreview は、BoardRevenueMetricsTable が受け取らないので書いていない。(2) 固定の値で閉じている呼び出しは無い (0 件)。確かめたこと: (a) BoardRevenueMetricsTable は RevenueMetricsTable に enabled={true} を直接書いて渡し (BoardRevenueMetricsTable.tsx:48)、useRevenueMetricsQuery では options がフックの中の enabled を上書きする (useRevenueMetricsQuery.ts:42 / :44)。固定の値が呼び出しを開く側なので、閉じた呼び出しには当たらない。GET …/revenue/metrics への call は always にし、そのことを call の note に書いた。(b) type の既定値 referrer は、描く側が props を渡さないときに効く既定値で、値は保存された部品の設定 (入口の外の値) で決まるので、固定の値に当たらない。MetricLabel の type ごとの分かれ道 (browser / os / city / path など) は、受け口が type を 4 つに限るので通らないが、どれもデータに届かない見た目の部品なので、フレームにしていない。(c) useRevenueStatsQuery と useRevenueMetricsQuery が useFilterParameters に固定の includePagination: false を渡す (page / pageSize を送らない) のは、送る値が変わるだけで呼び出しの枝ではない。(3) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。BoardRevenueMetricsTable の中の順は、useBoardRevenueCurrency / useDateRange (30・31 行。API を呼ばない) → useRevenueStatsQuery (33 行) → RevenueMetricsTable (42 行)。だから、parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、GET …/revenue/stats の下に 1 回ずつ書き、GET …/revenue/metrics では summary で触れた。getRevenueStats は、いまの期間と比較の期間で 2 回呼ぶが、同じ関数で届く表も同じなので、1 つのフレームにした。fetchWebsite が呼ぶ getWebsite は、getEntity の下に書いた q_get_website と同じなので、フレームにしていない。書き直し (_rw) は要らなかった。(4) 綴りと木は、同じ前処理・権限の確認・絞り込みを書いた部品の結果 (part_p.boardComponentRegistry.UTM) と、同じ受け口・問い合わせ・Favicon を書いた画面の結果 (websites.websiteId_d.revenue の q_revenue_stats / q_revenue_metrics とライブラリのフレーム、layout_l.main_g.websites.websiteId_d の Favicon の設定と I/O の書き方) を出発点にし、呼び出し元の行と、受け口が渡すセクション (revenue) を、この入口に合わせて直した。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_revenue_stats) に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(5) 迷った点と選んだ扱い。(a) 通貨の決め方 (部品の設定 → ブラウザの保存 → DEFAULT_CURRENCY → USD) は、段になっていない補助の関数 useBoardRevenueCurrency にあるので、その結果で動きが変わる入口のフレームに、DEFAULT_CURRENCY の settings と、parameters の currency の説明として書いた (dashboard の結果の書き方にそろえた)。ブラウザに保存した通貨と期間 (localStorage) は、サーバーのデータではないので I/O に書いていない。(b) MetricLabel と ListTable は見た目だけの部品なのでフレームにせず、Favicon を RevenueMetricsTable の下に直接つないだ (websites.websiteId_d.revenue と同じ)。国・地域の旗は同じサーバーの画像なので、I/O に書いていない。(c) 行の名前のリンク (FilterLink) は、同じ画面の URL に絞り込みを足すだけで、referrer の外部リンクも、ほかの入口ではないので、links に書かず summary に書いた。(d) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(6) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。(7) レビューへの対応 (1 回。high 0 件、medium 0 件、low 1 件。直した)。getRevenueMetrics の流入の種類の rules を、種類ごとに見る値 (ドメインだけか、utm_medium もか) と、paid / organic を前に付ける種類 (Search / Social / Shopping / Video だけ) を分けて書き直し、PostgreSQL 用だけ hostname の先頭の www. を除いて比べることを足した。レビューの notes にあった細かい点 (I/O の note の略称 QRM:472 をファイルの名前に直す、Favicon が GROUPED_DOMAINS のまとめ先のドメインに置き換える) も直した。high が無いので、もう一度のレビューはしていない。共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ。"
