notes: "(1) データに届かない画面なので、プロファイルの決まりのとおり、入口のフレームから、最後に頼るライブラリ (next/navigation のルーター) を external のフレームとして 1 つ書いて閉じた。I/O は無い。(2) フレームにしなかったもの: useNavigation (URL の組み立てと、next/navigation の useRouter / usePathname / useSearchParams を呼ぶだけ。ほかの入口の結果でもフレームにしていない)、buildPath (クエリ文字列を付けるだけの小道具)。(3) 転送先の links は、/boards の 1 件だけを書いた。renderUrl は、いまの URL に /teams/<teamId> があると前に /teams/${teamId} を付ける (useNavigation.ts:9、:34)。next.config の rewrites が /teams/:teamId/:path* を /:path* へ回す (next.config.ts:253-254) ので、この画面は /teams/<teamId>/boards/create でも開き、そのときの転送先は /teams/<teamId>/boards (同じ入口 boards) になる。ほかの入口の結果 (枠の結果の renderUrl の行き先) が、付く前の形だけを target に書き、チームの接頭辞は note に書いているので、その綴りに合わせた。(4) 権限の確認・設定・業務のルールは、この画面には無い (page.tsx の 13 行すべてを読んだ)。BASE_PATH は、ルーターが URL の前に付けるだけで、この画面の動きも行き先の入口も変えないので settings に書いていない。(5) external の call は always にした。転送は useEffect の中にあり、描画のたびに条件なしで動く (依存する router と renderUrl が変わると、もう一度動く)"
