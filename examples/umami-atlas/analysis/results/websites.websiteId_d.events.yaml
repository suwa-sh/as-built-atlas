  "value": "サイト 1 件のイベントの画面。サーバー側の page は URL の websiteId を EventsPage に渡すだけで、画面の本体はブラウザ側で動く。絞り込みと期間の操作 (WebsiteControls) は、別の入口の共有の部品 (part_p.shared_a.WebsiteControls) として描き、ここでは辿らない。開いたときに読むもの: イベントの指標の帯 (events/stats。比較の期間も集計する)、選んだタブの中身 (chart: イベントの時系列 events/series と、イベントの名前ごとの件数 metrics の type: event / activity: イベントの一覧 events / properties: イベントとプロパティの一覧 event-data/properties)。URL に segment か cohort があれば、その定義も読む。利用者の操作で読むもの: イベント 1 件のプロパティ (event-data/[eventId])、プロパティのタブでイベントを選んだときの絞り込みの小窓の候補 (event-data/fields と event-data/values)、イベントとプロパティを選んだときの値の表とグラフ (event-data-pivot とその下の property-series / array-series / numeric-series / numeric-stats / date-series)、訪問者のアイコンを押して開くセッションの小窓 (sessions/[sessionId] とその activity / properties / replays、録画の再生 replays/[replayId] と保存の状態 replays/saved/[replayId])。書き込みは利用者の操作で起きるものだけ: セッションの削除 (PostgreSQL だけで動くときだけ。session と、それに付くイベント・プロパティ・録画などをまとめて消す)、録画の保存と保存の取り消し (session_replay_saved)。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。主な読み先は website_event と event_data (ClickHouse では event_data_pivot や時間ごとの集計表も) で、URL の絞り込みに応じて session / session_data も読む。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。ほかの画面への遷移は無い (セッションの小窓は、同じ画面の URL のクエリを書き換えるだけ)"
