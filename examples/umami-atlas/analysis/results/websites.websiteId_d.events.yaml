"notes": "(1) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、248 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。EventsPage (events_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は EventsPage.tsx:5 の import と :28 の描く行) を書いた。WebsiteControls の中 (WebsiteFilterButton → FilterEditForm → FieldFilters / SegmentFilters / PropertyFilters の event と session、WebsiteDateFilter、ExportButton、FilterBar → SegmentEditForm) の段は外した (WebsiteControls のフレームを含めて 108 段)。EventsPage が WebsiteControls に渡す値 (websiteId だけ) は events_page の summary に書いた。(2) 外した木の下に書いていた共通の段は、入口から、コードに書いてある順に深さ優先で辿り直して、最初に着く呼び出し元の下に移した: parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は GET events/stats (EventsPage.tsx:29 の EventsMetricsBar → useEventStatsQuery) の下。getEventMetrics は GET metrics (chart のタブの MetricsTable) の下。canViewAuthenticatedWebsite (書き直しの q_can_view_website_rw3 から getWebsite まで) は GET sessions/[sessionId]/replays の下。canUpdateWebsite (書き直しの q_get_website_rw3) は POST replays/saved/[replayId] (ReplayPlayback の useUpdateQuery) の下。PropertyFilters (source: event) は、EventProperties の絞り込みの小窓 (PropertyFilterEditForm) の下で初めて着くので、前の書き直しの段 (property_filters_rw1 から q_check_auth_rw2 まで) を消し、GET event-data/fields と GET event-data/values を終端まで書いた (eventName を渡す)。外した木にだけあった受け口 (values、segments、segments/[segmentId]、session-data/properties、session-data/values、daterange、export、segments の POST) を、残った部品が呼んでいないことは、対象のコードで確かめた。外した段を指していた文 (ほかの受け口の一覧、「経路はフレーム … と同じ」) は直した。(3) 決まりにそろえた所: checkAuth は settings に CLOUD_MODE と REDIS_URL、rules に API キーの枝の 1 行 (前から書いてある)。canViewWebsite・canUpdateWebsite・canDeleteWebsite の guards は、持ち主の確認と、関数の中の管理者の確認 (kind: role、value: user.isAdmin) を別の件で書いてある。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_events_stats) に 1 回だけ書いた。結果の target は作業定義と同じ (clone_path も写した)。(4) 固定の値で閉じている呼び出し (指示書 0.4.1): MetricsTable はいつも type=\"event\" を渡す (EventsPage.tsx:51) ので、GET metrics の getSessionMetrics / getPageviewMetrics / getChannelMetrics の枝と、MetricLabel が referrer の行に描く Favicon は、辿らない (前の結果は conditional のフレームで書いていた。api_metrics と metrics_table の summary の note に書いた)。getEventMetrics は、同じ固定の値でいつも成り立つので always。EventProperties はいつも source=\"event\" を渡すので、プロパティの 7 つのフックの session-data の URL も閉じている (各フックの summary の note)。ReplayPlayback (isSaved: false) と ReplaySaveForm (isSaved: true) が送る固定の値で、POST replays/saved の createReplaySaved / deleteReplaySaved は、経路ごとに片方が閉じている (api_replay_saved_post と api_replay_saved_post_rw1 の summary の note)。(5) 前の結果から引き継いだ扱い: (a) タブ (Tabs / TabPanel) の中の部品は、選んでいないタブの中身を描くかどうかが UI ライブラリの動きで読めないので always (note に書いた)。録画のタブ (SessionReplaysDataTable) は、共有画面でないときだけ出す条件 (パスに /share/ を含まない) が、この入口のパスではいつも成り立つので、前の結果の conditional を always に直した。(b) GET /api/config (useConfig) はフレームにせず、sessionDeletionEnabled は SessionProfile の settings に書いた。(c) 見た目だけの部品 (MetricCard、SessionStats、SessionInfo、SessionReplaysTable、PropertyFilterBar、ListTable、BarChart / PieChart) と ReplayPlayer はフレームにしていない。(d) links は embed の 1 件だけ (router.push と Link は、同じ画面の URL のクエリを書き換えるもの、または計測している対象のサイトの URL)。(6) レビューへの対応 (1 回目、high 0 件、medium 1 件、low 3 件。すべて直した): 録画の保存 (createReplaySaved) は、isSaved: true を送る ReplaySaveForm の経路の下に移し、ReplayPlayback の保存を外すボタンの経路 (固定の値 isSaved: false) では閉じた呼び出しとして summary の note に書いた (前の書き直しの parseRequest / checkAuth の 2 段は、要らなくなったので消した)。その受け口の condition から、保存の小窓の話を外した。プロパティの 7 つのフックの summary の note に、source: session のときの session-data の URL が、固定の値 source=\"event\" で閉じていることを書いた。MetricsTable の note に、domain の行の Favicon も足した。(7) 前の結果のレビューで直さなかった指摘 (canViewSharedWebsite の確認の値の綴り) は、そのフレームが WebsiteControls の木にあり、この結果からは外れたので、引き継いでいない。(8) 段の数は 248 から 177 になった。"
