  value: 'ボードに置く「世界地図」の部品 (登録表の type: WorldMap)。描く側から受け取った対象について、描く画面の URL の期間と絞り込みに当たる国ごとの訪問者の数を、type: country を固定で渡して GET /api/websites/[websiteId]/metrics で読み、割合に直して国を塗り分ける。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection で見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、type が country (セッションの列) なので getSessionMetrics で website_event と session (ClickHouse では時間ごとの集計表 website_event_stats_hourly) を数える。絞り込みに応じて event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。受け口のほかの集計 (getEventMetrics / getPageviewMetrics / getChannelMetrics) は、固定の type で閉じているので辿らない。書き込みは無い。ほかの入口へのつながりは無い'
