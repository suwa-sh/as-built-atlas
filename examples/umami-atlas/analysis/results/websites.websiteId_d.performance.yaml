notes: 'プロファイル 0.4.0・skill 0.4.0 で分析した。[木の形] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。PerformancePage の中の順は、useDateRange (10 行。API を呼ばない) → WebsiteControls (14 行) → Performance (15 行)。だから、parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment は、WebsiteControls の絞り込みのボタン (WebsiteFilterButton → FilterEditForm → FieldFilters → FilterRecord → useWebsiteValuesQuery → GET values) の下に書き、性能の 3 つの受け口では、呼ぶことと経路が同じことを summary に書いた。WebsiteControls の下の木は、同じコミットの同じ部品を、同じ props (websiteId だけ) で描く画面 (websites.websiteId_d.attribution) の木と同じになるので、それを写した。この画面に合わせて直したのは、呼び出し元 (PerformancePage.tsx 14 行)、FilterEditForm の選べない列のルール (パスに /performance を含むので、referrer・query・event・tag・distinctId・UTM の 5 つを除く)、FieldFilters の列の例、parseRequest / canViewWebsiteSection / getQueryFilters の summary にある、この画面のほかの受け口の一覧 (attribution を performance/stats・chart・metrics に替えた)、canViewWebsiteSection の確認の note (性能の受け口はセクション performance を渡す)。[迷った点と選んだ扱い] (1) PerformanceMetricsTable は、Performance.tsx の中の別の関数の部品で、4 か所 (path / title / device / browser) から type だけを変えて描く。同じ関数・同じフック・同じ受け口・同じ問い合わせの関数なので、1 つのフレームにまとめた。届く列と表は type で変わる (device / browser のときは、PostgreSQL で session を結合する) ので、問い合わせの I/O に、4 つの type で届く列と表をすべて書き、note に type ごとの違いを書いた。(2) タブの中身 (TabPanel) を、タブを選ぶまで描くかどうかは UI ライブラリの動きで、リポジトリからは読めない。コードには描く条件が無いので always にし、note に書いた。(3) 指標 (metric) と項目の列 (column) は SQL に文字列で埋め込まれるが、受け口が metric を 5 つの値に、type を 4 つの値に限って検査し、列の名前は受け口の固定の対応表から決まるので、読める列として fields に書いた (unknown にしていない)。(4) 指標の評価 (良い・要改善・悪い) は、段にしていない部品 (PerformanceCard) の中の関数なので、それを描く Performance の rules に書いた。表で、選んだ百分位の値が 0 の行を除き、上位 20 行だけ出すこと、値の書式 (ms / s) は、画面での表示なので rules に書かず、summary に書いた。(5) 百分位の選択は、読んだ値のどれを出すかを変えるだけで、問い合わせのクエリに入らない (stats の問い合わせのキーにも入らない) ので、受け口の呼び出しの条件にしていない。(6) MetricLabel / FilterLink / TypeIcon (表の行のラベルとアイコン) は、同じ画面の URL のクエリを書き換えるか、同じサーバーの静的な画像を出すだけなので、フレームにも links にもしていない。BarChart、PerformanceCard、ListTable、LoadingPanel も見た目だけなので、フレームにしていない。(7) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query) は、呼び出し元ごとに読む表と列が違うので、問い合わせの関数ごとに書いた。(8) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。イベントのプロパティの絞り込み (epf) は、useFilterParameters がパスが /events で終わる画面でだけ付けるので、この画面からは届かないように見えるが、受け口と問い合わせの関数は扱えるので、event_data の読み取りを interpretation で書き、note に理由を書いた。(9) 期間の localStorage など、ブラウザの中の保存は I/O に書いていない。(10) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 [レビュー] 指摘は 4 件で、すべて low。high が無いので、もう一度のレビューはしていない。4 件とも直していない。理由: (a) PerformanceMetricsTable を 1 つのフレームにまとめたこと (type が device / browser のときは PostgreSQL で session に届くので、届く先ごとに分けるべきという指摘): 届く表と列は、q_get_performance_metrics の I/O と note にすべて書いてあり、読み書きの抜けは無い。4 つに分けると、同じ受け口と問い合わせの関数の木を 4 回書くことになる。まとめる書き方を認めるかは人が決めることなので、分けずに残した (認めないなら、path・title と device・browser の 2 つに分ける)。 (b) この画面からは条件が成り立たない呼び出しを conditional のフレームにしていない 3 件 (WebsiteControls の ExportButton、FilterEditForm のイベントのプロパティの欄、GET values の getWebsiteSegments の枝): WebsiteControls の下の木を写した元の結果 (websites.websiteId_d.attribution) から受け継いだもので、compare の画面のレビューも同じ 3 件を挙げている。WebsiteControls を使う画面の結果をそろえて直すのがよいので、この画面だけでは直さなかった (summary と note には、届かない理由を書いてある)。'
