summary:
  status: interpretation
  value: 1 つのサイトの表示性能 (Web Vitals) の画面。Performance が、GET /api/websites/<id>/performance/stats で 5 つの指標 (LCP / INP / CLS / FCP / TTFB) の 50・75・95 パーセンタイルとサンプル数を、performance/chart で選んだ指標の時系列を、performance/metrics でページの path・タイトル・端末・ブラウザごとの百分位を読む。3 つの受け口とも、website_event のうち性能の計測のイベント (event_type 5) だけを集計し、PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる (PostgreSQL で端末・ブラウザごとに読むときは session を結合する)。指標のカードを押すと時系列と表を読み直す。上部の WebsiteControls は、絞り込みのボタン (列の値・セグメント・セッションのプロパティの候補を読む。この画面では referrer・UTM などの列を選べない)、期間の選択 (daterange)、絞り込みの帯 (保存済みの segment の読み取りと、セグメントとして保存する書き込み) を描く。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / link / pixel / board / team_user を読み、共有トークンだけのときは performance のセクションを見てよいかを確かめる。利用者の操作による書き込みは、セグメントとして保存 (segment の作成) だけ。ほかに、Redis が有効なら、サイトの情報を website:* にキャッシュする
  evidence:
