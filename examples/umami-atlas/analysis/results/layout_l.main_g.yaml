    status: "fact"
    evidence:
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 19}
    - {file: "src/app/api/config/route.ts", line: 19}
  - name: "CLOUD_MODE"
    kind: "env"
    effect: "設定すると、更新を確かめない"
    status: "fact"
    evidence:
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 21}
    - {file: "next.config.ts", line: 16}
    - {file: "next.config.ts", line: 217}
  rules:
  - kind: "decision"
    value: "最新版が、確認済みとして記録した版と違い、いまの版より新しい (semver.gt) とき、更新ありとする"
    status: "fact"
    evidence:
