    evidence:
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 15}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 25}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 31}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 40}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 41}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 45}
    - {file: "src/store/version.ts", line: 17}
    - {file: "src/store/version.ts", line: 20}
    - {file: "src/store/version.ts", line: 42}
  io:
  - op: "call"
    status: "fact"
    resource:
      kind: "external_api"
      levels:
        host: "api.umami.is"
        path: "/v1/updates"
    detail: "fetch(`${UPDATES_URL}?v=${current}`) を GET。UPDATES_URL は https://api.umami.is/v1/updates"
    fields:
    - name: "v"
      use:
      - "write"
    - name: "latest"
      use:
      - "read"
    - name: "url"
      use:
      - "read"
    evidence:
    - {file: "src/store/version.ts", line: 20}
    - {file: "src/store/version.ts", line: 21}
    - {file: "src/store/version.ts", line: 39}
    - {file: "src/lib/constants.ts", line: 19}
    note: "v は、いまの版 (CURRENT_VERSION)。allowUpdate が真のときだけ呼ぶ"
  guards:
  - kind: "role"
    value: "user.isAdmin"
    status: "fact"
    evidence:
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 17}
    - {file: "src/app/(main)/UpdateNotice.tsx", line: 40}
