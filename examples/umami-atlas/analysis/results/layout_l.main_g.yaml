summary:
  status: "interpretation"
  value: "ログイン後の画面すべて ((main) の下) を包む枠。Suspense の中で App を描き、包まれる画面 (children) は、その中に置く。App はブラウザ側で動き、POST /api/auth/verify でログインを確かめ (ユーザーと所属チームを読む。失敗なら /login へ移る)、GET /api/config で設定値 (環境変数だけ) を読み、URL に /teams/<id> があれば GET /api/teams/[teamId] でチーム (team と team_user) を読む (読めなければ / へ戻す)。ログイン済みでクラウドモードでなければ、GET /api/2fa/status で 2 段階認証が必須かを読み (two_factor_auth / app_setting / user / team_user / team)、必須なのに未設定なら、閉じられない設定用の小窓から POST /api/2fa/setup/initiate と confirm を呼ぶ (two_factor_auth / two_factor_backup_code / two_factor_rate_limit / two_factor_otp_used を書く)。設定を終えるまで、包まれる画面は操作できない。管理者には、本番で更新の確認 (ブラウザから api.umami.is) を行い、本番では利用状況の送信 (/telemetry.js が返すスクリプトで、ブラウザから i.umami.is) を行う。上部のナビ (TopNav) は、URL に含まれる id で選択欄を出し分ける: /websites/<id> ならサイト、/links/<id> ならリンク、/pixels/<id> ならピクセル、/boards/<id> ならボードの選択欄 (それぞれ、1 件の GET と、一覧の GET。一覧は、URL に /teams/<id> があればチームの API、無ければ自分の API)。どれも読むだけで、website / share / user / link / pixel / board / team_user / team を読む。/boards/create では、URL の id の正規表現が先頭の c だけに当たるので、ボードの選択欄が出て GET /api/boards/c を呼ぶ。サイドとモバイルのナビ (メニュー、ユーザーのメニュー) と、チームの切り替えは、ログインで得たユーザーと設定値を使うだけで、新たにデータを読まない (ほかの画面へのリンクを並べる)。読み込み中 (ログインの確認、設定値、チーム) は Loading を出し、ログインの確認の失敗・ユーザー無し・チームの読み込みの失敗のときは、何も描かない"
