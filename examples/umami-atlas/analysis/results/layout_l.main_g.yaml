summary:
  status: interpretation
  value: "ログイン後の画面すべて ((main) の下) を包む枠。Suspense の中で App を描き、包まれる画面 (children) はその中に置く。App はブラウザ側で動き、POST /api/auth/verify でログインを確かめ (ユーザーと所属チーム。失敗なら /login へ移る)、GET /api/config で設定値 (環境変数だけ) を読み、URL に /teams/<id> があれば GET /api/teams/[teamId] でチーム (team と team_user) を読む (読めなければ / へ戻す)。ログイン済みでクラウドモードでなければ GET /api/2fa/status で 2 段階認証が必須かを読み (two_factor_auth / app_setting / user / team_user / team)、必須なのに未設定なら閉じられない設定用の小窓から POST /api/2fa/setup/initiate と confirm を呼ぶ (two_factor_auth / two_factor_backup_code / two_factor_rate_limit / two_factor_otp_used を書く)。管理者には本番で更新の確認 (ブラウザから api.umami.is)、本番では利用状況の送信 (/telemetry.js が返すスクリプトでブラウザから i.umami.is) を行う。上部のナビ (TopNav) は URL に含まれる id で選択欄を出し分ける: /websites/<id> ならサイトの選択欄 (GET /api/websites/[websiteId] と、サイトの一覧 GET /api/teams/[teamId]/websites か /api/users/[userId]/websites)、/links/<id> ならリンク、/pixels/<id> ならピクセル、/boards/<id> ならボードの選択欄 (それぞれ 1 件の GET と、一覧の GET。一覧は URL に /teams/<id> があればチームの API、無ければ自分の API)。どれも読むだけで、website / share / user / link / pixel / board / team_user を読む。/boards/create では URL の id の正規表現が先頭の c だけに当たるので、ボードの選択欄が出て GET /api/boards/c を呼ぶ。サイドとモバイルのナビ (メニュー、ユーザーのメニュー、チームの切り替え) は、ログインで得たユーザーと設定値を使うだけで新たにデータを読まない。ユーザーと設定値が無い・チームが読めないあいだは何も描かない"
  evidence:
    - { file: "src/app/(main)/layout.tsx", line: 8 }
    - { file: "src/app/(main)/App.tsx", line: 21 }
    - { file: "src/app/(main)/App.tsx", line: 24 }
    - { file: "src/app/(main)/App.tsx", line: 25 }
    - { file: "src/app/(main)/App.tsx", line: 54 }
    - { file: "src/app/(main)/App.tsx", line: 75 }
    - { file: "src/app/(main)/TopNav.tsx", line: 53 }
    - { file: src/components/hooks/useNavigation.ts, line: 13 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる画面) と、外側のルートの layout (src/app/layout.tsx)、内側の admin / settings / websites/[websiteId] の layout は別の入口なので辿らない。(2) フレームにしなかったもの: GET /api/config (useConfig。skipAuth で環境変数を返すだけでデータを読まない)、SideNav / MobileNav / WebsiteNav / SettingsNav / AdminNav / useWebsiteNavItems (リンクを並べるだけ)、TeamsButton (ログインで得た user.teams を出すだけ)、UserButton (ログインのユーザーと設定値、言語の切り替え。言語の JSON は public/intl の静的ファイルで、翻訳のライブラリと同じ扱い)、TwoFactorSetupModal の取り消し (App は required={true} で描くので cancel のボタンが出ない)。(3) 環境変数 selfTrack / selfRecord があるとき App は /script.js と /recorder.js を読み込み、この画面自身を計測させるが、計測の受信はこのプロファイルの対象外 (context.md の「画面を通らない受け口 (外部向け API、計測の受信) は分析の対象にならない」) なので辿っていない。(4) URL の接頭辞: /auth と /config は常に basePath + /api。それ以外は環境変数 apiUrl があるとその URL に向く (src/lib/api-url.ts:39)。既定 (apiUrl 無し) で同じリポジトリの route に当たるので、/auth 以外の呼び出しは interpretation にした。(5) 同じ処理の置き場 (呼び出し行のファイルのパスの文字コード順、同じなら行番号順): parseRequest → checkAuth は POST /api/2fa/setup/confirm (confirm/route.ts:18) の下、getUser は POST /api/2fa/setup/initiate (initiate/route.ts:33。src/lib/auth.ts より先) の下、getTeamUser は canViewBoard (src/permissions/board.ts:178。link / pixel / team / website より先) の下、canViewTeam は GET /api/teams/[teamId]/boards (boards/route.ts:21。teams/[teamId]/route.ts より先) の下、getWebsite は GET /api/websites/[websiteId] (route.ts:34。src/lib/entity.ts より先) の下、getLink / getPixel / getBoard はそれぞれの 1 件の GET の route の下。呼び出し元が終端になってしまう getEntity / canViewLink / canViewPixel / canViewTeam の下には、決まりどおり最も早い呼び出しの 1 本 (getWebsite / getLink / getPixel / getTeamUser) を、I/O を持つフレームまで書き直した。(6) 一覧の問い合わせ: getUserXxx / getTeamXxx は条件を組み立てて共通の getXxxs (website / link / pixel / board) を呼ぶだけなので、1 つのフレーム (name に両方) にまとめ、それぞれに I/O を書いた。共通の prisma.pagedQuery (src/lib/prisma.ts:761 の client[model].findMany と :775 の count) は、引数のモデル名で届くテーブルが変わるので、テーブルごとに external を 1 つ書いた。同じテーブルに届く 2 つの呼び出し元 (自分の一覧とチームの一覧) は、共通の getXxxs を呼ぶ行の順 (website.ts:150 が :169 より先、link.ts:41 が :53 より先、pixel.ts:36 が :47 より先、board.ts:38 が :52 より先) で早いほう、つまりどれも自分の一覧の下にだけ external を書いた。(7) /me/websites (useUserWebsitesQuery の第 3 の枝) には届かない。TopNav は App がユーザーを得てから描くので userId が常にある (App.tsx:54)。getAllUserWebsitesIncludingTeamAccess も、TopNav が includeTeams を渡さないので届かない。(8) ブラウザが付けるトークンは localStorage のログイントークン (src/lib/client.ts:4) なので、checkAuth の API キーの経路と、各権限の検査の共有トークンの枝は、この枠からは使わないものとして書いていない。(9) useNavigation の正規表現は末尾を固定していない ([a-f0-9-]+) ので、/boards/create では boardId が c になり、BoardSelect が描かれて GET /api/boards/c を呼ぶ。board.id は uuid の列 (prisma/schema.prisma:382) で、canViewBoard から呼ぶ getBoard は id の形を確かめずに findUnique するので、c で探すと uuid の形の誤りで失敗し、ボードの選択欄は名前を出せないと読める (interpretation。実行しての確認はしていない)。データの読み書きの先 (board の read) は変わらない。(10) レビューの指摘 2 件 (どちらも low) を直した: parseRequest の summary の根拠に URL と本文を読む行 (request.ts:21 / :23) を足した。/boards/create の応答を「確かめていない」から、uuid の列と getBoard の書き方からの読み取り (上の 9) に直した。あわせて、レビューの所見 (同じテーブルに届く一覧の external の置き場が website だけ違った) を受け、website の external もチームの一覧から自分の一覧の下へ移し、4 種類とも同じ決め方 (上の 6) にそろえた"
