summary:
  status: interpretation
  value: "管理者が、2 段階認証を全員に必須にするかどうかを切り替える画面。表示時に GET /api/2fa/status を呼ぶ。受け口は、ログイン中のユーザーを確かめ (user。Redis が有効でトークンが authKey を持つときは auth:* のセッションも読む)、自分の two_factor_auth と、app_setting の twoFactorRequiredGlobal を読む。暗号鍵 (TWO_FACTOR_ENCRYPTION_KEY) が正しく設定されていて、全員への必須が無効のときは、user の必須の印、所属チーム (team_user)、必須の印を持つチーム (team) も順に読む。画面が使うのは、返った isConfigured と globalRequired だけ。スイッチを切り替えると POST /api/admin/2fa/global を呼ぶ。受け口は、管理者 (user.isAdmin) であることを確かめ、app_setting の twoFactorRequiredGlobal を true か false で作成または更新する。そのあと状態を読み直す。暗号鍵が未設定のときは、説明の代わりにエラーの文言を出し、必須が無効ならスイッチを操作できない。ほかの入口へのつながり (遷移や小窓) は無い"
  evidence:
    - { file: "src/app/(main)/admin/security/page.tsx", line: 5 }
    - { file: "src/app/(main)/admin/security/AdminSecurityPage.tsx", line: 10 }
    - { file: "src/app/(main)/admin/security/AdminSecurityPage.tsx", line: 11 }
