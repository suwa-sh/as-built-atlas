    - { file: src/app/api/2fa/status/route.ts, line: 25 }
    - { file: src/app/api/2fa/status/route.ts, line: 28 }
    - { file: src/app/api/2fa/status/route.ts, line: 34 }
    - { file: src/app/api/admin/2fa/global/route.ts, line: 21 }
    - { file: src/app/api/admin/2fa/global/route.ts, line: 31 }
notes: "(1) 祖先の枠 (ルート、(main)、admin の layout) は別の入口なので辿っていない。(2) 同じ処理の置き場は、入口から辿る順で決めた。parseRequest とその先 (checkAuth、getUser、Redis の読み取り) は、先に着く GET /api/2fa/status の下に 1 回だけ書き、POST /api/admin/2fa/global の側は summary で触れるだけにした。(3) canEnforceTwoFactorAuthForEveryone (permissions/user.ts:39) は、user.isAdmin を返すだけで、読み書きもライブラリの呼び出しも無い。段にすると終端の決まりを満たせないので段にせず、権限の確認は、それを呼ぶ受け口 (api_global_post) に書いた。値は、決まりのとおり user.isAdmin。(4) isTwoFactorConfigured (two-factor/crypto.ts:11) も段にしていない補助の関数。設定 TWO_FACTOR_ENCRYPTION_KEY は、その結果で動きを変える 2 つの受け口に書いた。POST の「必須にするには暗号鍵が要る」は、設定で分かれる処理なので settings だけに書き、rules に重ねていない。(5) CLOUD_MODE は、2 つの受け口と checkAuth に書いた。ただし admin の枠 (別の入口) は、CLOUD_MODE があると包まれる画面を描かない (admin/layout.tsx:5) ので、この画面からは CLOUD_MODE ありの枝には届かないと読める。枠は辿らない決まりなので、経路と設定は消さずに書き、note に添えた。(6) checkAuth の API キーの枝 (auth.ts:74 → checkApiKeyAuth) は、同じファイルの関数なので q_check_auth の段に含めた。/api/2fa と /api/admin は API キーを受け付けないパス (api-key.ts:14 / :17) で、getApiKeyByHash より前に null を返すので、api_key の読み書きは書いていない。(7) 受け口が Prisma を直接呼ぶので、読み書きは受け口の段に書き、呼んでいる行ごとに external の段を置いた。upsert は create と update の 2 件にした。(8) フレームにしなかったもの: PageHeader / Panel / Switch (見た目だけの部品)、useMessages (翻訳)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)、useModified と useToast (useUpdateQuery が返すが、この画面は使わない)、parseShareToken (ヘッダーのトークンを解くだけ)。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘 2 件 (どちらも low) は、どちらも直した: upsert の呼び出しの条件に暗号鍵の設定による打ち切りを足し、入口の概要の根拠に isConfigured と globalRequired を取り出す行を足した。指摘にならなかった注意 (スイッチのルールの言い回し) も直した"
