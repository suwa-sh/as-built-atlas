summary:
  status: interpretation
  value: "サイト 1 件の画面 (/websites/<websiteId> の下すべて) を包む枠。サーバー側で動く layout が、API を通さず getWebsite で website と share を読み、サイトが無いか削除済みなら何も描かない (包まれる画面も出ない)。あればブラウザ側の WebsiteLayout で包む。WebsiteProvider が GET /api/websites/[websiteId] でサイトを読み直して context に入れ (読めなければ何も描かない)、見出し (WebsiteHeader) がサイトの名前と favicon (既定ではブラウザが icons.duckduckgo.com の画像を読む。private mode なら読まない) と編集ボタンを出し、ActiveUsers が GET /api/websites/[websiteId]/active で直近 5 分の訪問者数を 60 秒ごとに読む (website_event。PostgreSQL か ClickHouse のどちらか)。URL が /settings で終わる画面では見出しを描かないので、訪問者数も favicon も読まない。どの API も checkAuth で user (Redis が有効なら auth:* も) を読み、canViewWebsite で website / share / link / pixel / board / team_user を読む。データの書き込みは無い。children と並行ルート @modal の中身は包まれる側の入口なので辿らない"
  evidence:
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 15 }
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 17 }
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 22 }
    - { file: "src/app/(main)/websites/[websiteId]/WebsiteLayout.tsx", line: 10 }
    - { file: "src/app/(main)/websites/[websiteId]/WebsiteHeader.tsx", line: 23 }
    - { file: src/components/metrics/ActiveUsers.tsx, line: 18 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children と並行ルートの modal (@modal) の中身、外側の (main) とルートの layout は別の入口なので辿らない。(2) フレームにしなかったもの: PageBody / PageHeader / LinkButton / IconLabel (見た目だけ)、useNavigation (URL の組み立てだけ)、useMessages (翻訳)、useWebsite (WebsiteContext を読むだけ)、Favicon の useConfig (設定値が store に無いときだけ GET /api/config を呼ぶ。外側の App が先に読むのでふつうは呼ばない。呼んでも環境変数を返すだけでデータを読まない)。(3) URL の接頭辞: 環境変数 apiUrl があるとその URL に向く (src/lib/api-url.ts:39)。既定 (apiUrl 無し) で basePath + /api の同じリポジトリの route に当たるので、フックから route への call は interpretation にした。(4) 同じ処理の置き場 (呼び出し行のファイルのパスの文字コード順、同じなら行番号順): getWebsite は layout.tsx:15 (src/app/(main)/… は src/app/api/… と src/lib/entity.ts より先) の下、parseRequest → checkAuth は active/route.ts:10 (websites/[websiteId]/route.ts より先) の下、getUser は auth.ts:94 の下、canViewWebsite は share.ts:59 (canViewWebsiteSection。:82 の canViewSharedWebsite より先) の下。canViewSharedWebsite は呼び先が canViewWebsite だけで終端になるので、決まりどおり最も早い呼び出しの 1 本 (canViewWebsite → getEntity → getWebsite) を I/O を持つフレームまで書き直した。(5) ブラウザが付けるトークンは localStorage のログイントークンなので、checkAuth の API キーの経路と、権限の検査の共有トークンの枝は、この枠からは使わないものとして書いていない。(6) 権限の検査は管理者ならデータを読まずに通す。I/O はそうでないときのもの。(7) レビューの指摘 2 件を直した: canViewWebsite の summary の「作成者が本人なら許す」を、実際に比べる持ち主の列 (userId) に直した (medium)。favicon の外部読み込みを、呼び出し元の WebsiteHeader から、img を描く Favicon のフレームへ移した (low)"
