summary:
  status: interpretation
  value: "サイト 1 件の画面 (/websites/<websiteId> の下すべて) を包む枠。サーバー側で動く layout が、API を通さず getWebsite で website と share を読み、サイトが無いか削除済みなら何も描かない (包まれる画面も出ない)。あればブラウザ側の WebsiteLayout で包む。WebsiteProvider が GET /api/websites/[websiteId] でサイトを読み直して context に入れ (読み込み中と、読めないときは、見出しも包まれる画面も描かない)、見出し (WebsiteHeader) がサイトの名前と favicon (既定ではブラウザが icons.duckduckgo.com の画像を読む。PRIVATE_MODE なら読まない) と、設定の画面への編集ボタンを出し、ActiveUsers が GET /api/websites/[websiteId]/active で直近 5 分の訪問者数を 60 秒ごとに読む (website_event。PostgreSQL か ClickHouse のどちらか)。URL が /settings で終わる画面では見出しを描かないので、訪問者数も favicon も読まない。どの API も checkAuth でログインを確かめ (user を読む。Redis が有効なら auth:* も読む)、canViewWebsite で見てよいかを確かめる (管理者でなければ website / share / link / pixel / board を読み、チームのものなら team_user も読む)。データの書き込みは無い。children と並行ルート @modal の中身は包まれる側の入口なので辿らない"
  evidence:
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 15 }
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 17 }
    - { file: "src/app/(main)/websites/[websiteId]/layout.tsx", line: 22 }
    - { file: "src/app/(main)/websites/[websiteId]/WebsiteLayout.tsx", line: 10 }
    - { file: "src/app/(main)/websites/[websiteId]/WebsiteHeader.tsx", line: 23 }
    - { file: src/components/metrics/ActiveUsers.tsx, line: 18 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children と並行ルートの modal (@modal) の中身、外側の (main) とルートの layout は別の入口なので辿らない。(2) フレームにしなかったもの: PageBody / PageHeader / LinkButton / IconLabel (見た目だけ)、useNavigation (URL の組み立てだけ)、useMessages (翻訳)、useWebsite (WebsiteContext を読むだけ)、useApi (URL とヘッダーを組み立てるだけ。API_URL と BASE_PATH の設定は、これを使う 2 つのフックに書いた)、Favicon の useConfig (設定値が store に無いときだけ GET /api/config を呼ぶ。この受け口は skipAuth で認証を通らず、環境変数を返すだけでデータを読まないので、経路の上に無いものとして Favicon の summary で触れるだけにした)。(3) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた: getWebsite は layout.tsx:15 の下 (q_get_website)。parseRequest → checkAuth → getUser は、先に着く GET /api/websites/[websiteId] (route.ts:22) の下。canViewWebsite → getEntity → getLink / getPixel / getBoard と getTeamUser は、canViewSharedWebsite (share.ts:82) の下。後から着く GET /api/websites/[websiteId]/active の canViewWebsiteSection は、呼び先が canViewWebsite だけで終端になるので、いちばん早い呼び出しの 1 本 (canViewWebsite → getEntity → getWebsite) を、I/O を持つフレームまでもう一度書いた (q_*_rw。確認と設定とルールは、最初に書いたフレームだけに書いた)。(4) getWebsite のフレームはファイル単位 (getWebsite / findWebsite / attachShareIdToWebsite)。external は、ライブラリを呼ぶ行ごとに分けた (website.ts:77 と :304)。(5) checkAuth の API キーの経路 (auth.ts:74-76 → checkApiKeyAuth) は書いていない。ブラウザが付けるのは localStorage のログイントークン (useApi.ts:28、client.ts:4) で、umami_ で始まる API キー (api-key.ts:4、:33) ではないと読んだため。CLOUD_MODE の設定だけ q_check_auth に書いた。(6) 共有トークンのヘッダーは、ブラウザの store に share があるときだけ付く (useApi.ts:22-25)。この枠でそれが起きないとは言い切れないので、canViewWebsite の呼び出しは conditional (auth.user があるとき) にし、共有トークンだけのときの確認は guards (other) に書いた。(7) 呼び出しの条件で迷った点: layout → WebsiteLayout は、手前の早い return (サイトが無い・削除済み) を入力の誤りの打ち切りと読んで always にし、打ち切りは rules に書いた。WebsiteLayout → WebsiteHeader は、WebsiteProvider が読み込みの状態で子を描くかを決めるので conditional にした。getWebsite の中の share の読み取りは、手前がサイトが無いときの早い return だけなので always にした。フックから API の受け口への呼び出しは、enabled: !!websiteId の条件がこの入口ではいつも成り立つので always にした。(8) フックから route への call は、URL の形が文字列で読め、当たる route ファイルが 1 つに決まるので fact (レビューの指摘で interpretation から直した)。API_URL が設定されていると別の URL に向く (api-url.ts:38-44) ことは、フックの settings と call の note に書いた。(9) DATABASE_REPLICA_URL は、生の SQL の読み取り (prisma.ts:738) のほか、Prisma のモデルの読み取りも複製へ向ける (prisma.ts:882-904 の readReplicas) が、クライアントを作る共通の場所の設定なので、段ごとには書かず q_active だけに書いた。(10) Favicon.tsx:18 の GROUPED_DOMAINS の引き当ては、ルールとして書いていない (GROUPED_DOMAINS は配列 (constants.ts:416) で、ホスト名で引いた結果をコードから確かめられないため)。getWebsite の uuid の形の確認 (website.ts:81) も、業務の意味を持たない入力の形の確認と読んで rules に書かず、summary に書いた。(11) fields の列名は schema.prisma の @map で確かめた (@map が無い列は属性名と同じ)。Redis の auth:* の項目名は、コードが読む名前 (userId、pwd)。(12) レビューの指摘 3 件 (medium 2、low 1) は、すべて直した: 2 つの受け口への call を fact にし、共有トークンの type の検証を q_check_auth の rules に足した"
