"notes": "(0) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、65 段) を出発点にし、変えた所は対象のコードで確かめた。HeatmapsPage (heatmaps_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は HeatmapsPage.tsx 4 行の import と 57 行の描く行) を書いた。WebsiteControls の中 (WebsiteFilterButton、WebsiteDateFilter → GET …/daterange → canViewSharedWebsite・getWebsiteDateRange、FilterBar → GET …/segments/[segmentId] → canViewSharedWebsiteFilters、SegmentEditForm → POST …/segments → canUpdateWebsite・createSegment、その下の書き直しの段) の 27 段を外し、段の数は 65 から 38 になった。HeatmapsPage は websiteId だけを渡す (ほかは部品の既定のまま) ことを heatmaps_page の summary に書いた。外した木の下にあった共通の段のうち、canViewWebsite → getEntity → getWebsite / getLink / getPixel / getBoard は、canViewAuthenticatedWebsite (GET …/heatmaps) の下に移した (前はそこに書き直しの段 _rw_heatmaps があったので、それを本来の段にした)。getWebsiteSegment は getQueryFilters の下に移した (segment / cohort があるときの conditional)。外した段を指していた文 (getTeamUser・getWebsite・canViewWebsite・getQueryFilters の summary の「… も同じ関数を呼ぶ」「経路はフレーム … と同じ」) は直した。決まりにそろえた所: canViewWebsite の guards を、ほかの入口の結果 (part_p.shared_a.WebsiteControls、websites.websiteId_d.breakdown) と同じ 2 件 (role: user.isAdmin と ownership: canViewWebsite) にし、共有トークンで許す分岐 (前は kind: other の 1 件) は ownership の note に入れた。canViewTeam は前から 2 件 (role と ownership)。checkAuth の settings (CLOUD_MODE、REDIS_URL) と、API キーの枝の rules は前から書いてある。結果の target は作業定義と同じ (clone_path も写した)。(1) 画面を包む枠 (ルート、(main)、websites/[websiteId] の layout) は別の入口なので辿っていない。(2) 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。HeatmapsPage の中の順は、useSubscription (23 行) → WebsiteControls (57 行、embed で止める) → Heatmap (102 行)。その結果、parseRequest → checkAuth → getUser と、canViewTeam → getTeamUser、fetchAccount は GET /api/auth/subscription の下、canViewWebsite → getEntity → getWebsite ほかは GET …/heatmaps の canViewAuthenticatedWebsite の下、fetchWebsite と getWebsiteSegment は getQueryFilters の下になった。GET /api/auth/subscription はクラウドモードのときだけ呼ばれるが、コードの順でいちばん先に着くので、その下に書いた。(3) 設定の置き場で迷った点: 決まりの「どの入口にも出る共通の段」の表は、API_URL と BASE_PATH を「最初に API を呼ぶフレームに 1 回だけ」と書き、「木の書き方」は、API_URL を書くのは API_URL が効く API (/auth/... 以外) を最初に呼ぶフレーム、と書く。この入口で最初に API を呼ぶのは useSubscription (GET /auth/subscription) で、この URL には API_URL が効かない (api-url.ts 6・39 行)。両方を満たすよう、BASE_PATH は useSubscription に、API_URL は /auth 以外を最初に呼ぶ useHeatmapQuery に書いた (前は、API_URL を外した useDateRangeQuery に書いていた)。(4) Heatmap.tsx の中の ClickHeatmapView・ScrollHeatmapView・PageList・SnapshotPreview・IframeSnapshot は、同じファイルの関数なので、フレームを分けず Heatmap のフレームに含めた。(5) Heatmap は useHeatmapQuery を 2 回呼ぶ (68 行はページの一覧、77 行は選んだページの詳細で urlPath があるときだけ)。同じフック・同じ URL・同じ受け口なので、フレームは 1 つにし、詳細の呼び出しの条件は、フックの summary と getHeatmap の読み書きの note に書いた。(6) 画面が iframe でサイトのページを読み込むのは、ブラウザから他社 (計測しているサイト) へ取りに行く処理なので、Heatmap のフレームに external_api の読み書きとして書いた。ホストは website.domain (DB の値) で決まるので unknown + dynamic_dispatch。(7) HeatmapsPage は、クラウドモードで replays の機能が無いとき、WebsiteControls と Heatmap を描く前に返す。設定で打ち切るかが決まるので、Heatmap を conditional にし、CLOUD_MODE を settings に書いた。links の embed には when が無いので、描かない条件は note に書いた。(8) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(9) checkAuth の API キーの経路 (checkApiKeyAuth) は、決まりのとおりフレームにせず、rules に 1 行書いた (ブラウザが付けるのはログインのトークン)。(10) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。(11) ブラウザの中の保存 (期間の localStorage など) は I/O に書いていない。画面の中の検索 (ページの一覧を urlPath の部分一致で絞る) と、画面の幅の区分けは、表示の整形なので rules に書いていない。(12) 前の結果が unknown + not_analyzed で閉じていた共通の絞り込みの部品 (WebsiteFilterButton と SegmentEditForm の中の入力欄) は、WebsiteControls の中なので、この入口からは外れた。(13) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 (14) レビューへの対応 (1 回。high 0 件、medium 1 件、low 1 件。どちらも直した): クラウドの請求の画面へのリンクの理由を out_of_scope から not_traceable_in_repo にした (ホストが環境変数 CLOUD_URL で決まり、リポジトリの中に無い。layout_l.main_g の結果と同じ。ほかの 4 つの入口の結果は out_of_scope のままで、入口の間で割れている)。HeatmapsPage の settings に CLOUD_URL を足した。high が無いので、もう一度のレビューはしていない。"
