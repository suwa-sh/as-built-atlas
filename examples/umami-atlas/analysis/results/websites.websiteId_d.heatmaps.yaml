  "value": "1 つのサイトの、クリックとスクロールのヒートマップの画面。HeatmapsPage がまず useSubscription で契約を確かめる (クラウドモードのときだけ GET /api/auth/subscription で Redis の team:* / account:* を読む)。クラウドモードで replays の機能 (Business の契約) が無ければ、アップグレードの案内だけを出して、ヒートマップを読まない。それ以外では、上部に共有の部品 WebsiteControls (絞り込みと期間の操作) を描き、Heatmap が GET /api/websites/<id>/heatmaps を呼ぶ。WebsiteControls は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。受け口は getHeatmap で heatmap_event を読み、選んだ種類 (click / scroll) のページの一覧 (訪問の多い順に 100 件) を返す。利用者が一覧からページを選ぶと、同じ受け口を urlPath 付きで呼び、クリックの点 (5000 件まで) かスクロールの深さ (10% 刻み) と、サイトのドメインと urlPath から作ったページの URL を返す。画面はその URL を iframe でブラウザに読み込み、上に点や深さを重ねて描く。URL に絞り込みがあれば、website_event (と session / session_data / event_data) から条件に合う訪問を選んで heatmap_event に結合する。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。ヒートマップの受け口は、共有トークンだけでは見せず、ログインしたユーザーがサイトの持ち主・チームのメンバー・管理者のときだけ返す。権限の確認では website / share / link / pixel / board / team_user を読む。集計の前に、getQueryFilters がサイト (Redis の website:* か website) を読んで期間の開始を切り詰め、URL に segment / cohort があれば segment も読む"
