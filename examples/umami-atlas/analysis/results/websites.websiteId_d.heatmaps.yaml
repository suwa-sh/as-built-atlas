summary:
  status: interpretation
  value: "1 つのサイトの、クリックとスクロールのヒートマップの画面。HeatmapsPage がまず useSubscription で契約を確かめる (クラウドモードのときだけ GET /api/auth/subscription で Redis の team:* / account:* を読む)。クラウドモードで replays の機能 (Business の契約) が無ければ、アップグレードの案内だけを出して、ほかは何も読まない。それ以外では、上部に WebsiteControls (期間の選択の daterange、絞り込みの表示の保存済み segment の読み取りと、セグメントとして保存する書き込み、絞り込みのボタン) を描き、Heatmap が GET /api/websites/<id>/heatmaps を呼ぶ。受け口は getHeatmap で heatmap_event を読み、選んだ種類 (click / scroll) のページの一覧 (セッション数の多い順に 100 件) を返す。利用者が一覧からページを選ぶと、同じ受け口を urlPath 付きで呼び、クリックの点 (5000 件まで) かスクロールの深さ (10% 刻み) と、サイトのドメインと urlPath から作ったページの URL を返す。画面はその URL を iframe でブラウザに読み込み、上に点や深さを重ねて描く。URL に絞り込みがあれば、website_event (と session / session_data / event_data) から条件に合う訪問を選んで heatmap_event に結合する。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。ヒートマップの受け口は、共有トークンだけでは見せず、ログインしたユーザーがサイトの持ち主・チームのメンバー・管理者のときだけ返す。権限の確認では website / link / pixel / board / team_user を読む"
  evidence:
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/page.tsx', line: 7}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/HeatmapsPage.tsx', line: 23}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/HeatmapsPage.tsx', line: 34}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/HeatmapsPage.tsx', line: 57}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/HeatmapsPage.tsx', line: 102}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/Heatmap.tsx', line: 68}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/Heatmap.tsx', line: 77}
  - {file: 'src/app/(main)/websites/[websiteId]/(reports)/heatmaps/Heatmap.tsx', line: 1044}
  - {file: 'src/app/api/websites/[websiteId]/heatmaps/route.ts', line: 14}
  - {file: 'src/app/api/websites/[websiteId]/heatmaps/route.ts', line: 17}
  - {file: src/queries/sql/heatmap/getHeatmap.ts, line: 126}
  - {file: src/queries/sql/heatmap/getHeatmap.ts, line: 568}
notes: "[木の作り方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。HeatmapsPage の中の順は、useSubscription (23 行) → WebsiteControls (57 行) → Heatmap (102 行)。その結果、parseRequest → checkAuth → getUser と、canViewTeam → getTeamUser、fetchAccount は GET /api/auth/subscription の下、canViewWebsite → getEntity → getWebsite / getLink / getPixel / getBoard は GET …/daterange の canViewSharedWebsite の下、getWebsiteSegment は GET …/segments/[segmentId] の下、getQueryFilters → fetchWebsite は GET …/heatmaps の下になった。GET /api/auth/subscription はクラウドモードのときだけ呼ばれるが、コードの順でいちばん先に着くので、その下に書いた。[迷った点と選んだ扱い] (1) Heatmap.tsx の中の ClickHeatmapView・ScrollHeatmapView・PageList・SnapshotPreview・IframeSnapshot は、同じファイルの関数なので、フレームを分けず Heatmap のフレームに含めた (フレームはファイル単位)。(2) Heatmap は useHeatmapQuery を 2 回呼ぶ (68 行はページの一覧、77 行は選んだページの詳細で urlPath があるときだけ)。同じフック・同じ URL・同じ受け口なので、フレームは 1 つにし、詳細の呼び出しの条件は、フックの summary と getHeatmap の読み書きの note に書いた。urlPath は空で始まり、効果 (104〜121 行) は空のときに自動で選ばないので、詳細は利用者がページを選んだときだけ読む。(3) 画面が iframe でサイトのページを読み込むのは、ブラウザから他社 (計測しているサイト) へ取りに行く処理なので、Heatmap のフレームに external_api の読み書きとして書いた。ホストは website.domain (DB の値) で決まるので unknown + dynamic_dispatch。(4) HeatmapsPage は、クラウドモードで replays の機能が無いとき、WebsiteControls と Heatmap を描く前に返す。設定で打ち切るかが決まるので、その後ろの 2 つを conditional にし、CLOUD_MODE を settings に書いた。(5) BASE_PATH は、最初に API を呼ぶ段 (useSubscription) に 1 回だけ書いた。API_URL は、/auth で始まる URL には効かない (api-url.ts 6・39 行) ので useSubscription には書かず、API_URL が効く最初の段 (useDateRangeQuery) に 1 回だけ書いた。(6) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canViewSharedWebsiteFilters、canUpdateWebsite、canViewAuthenticatedWebsite) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite) まで、もう一度書いた (id が _rw で終わる)。もう一度書いたフレームには、権限の確認・設定・ルールを重ねていない。(7) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(8) 共通の絞り込みの部品 (WebsiteFilterButton のダイアログと、セグメントとして保存のフォームの中の入力欄) は、websites.websiteId_d.funnels の結果と同じく unknown + not_analyzed で閉じた。サイトの多くの画面が同じものを使う部品で、この画面に固有の処理ではないため。(9) checkAuth の API キーの経路 (checkApiKeyAuth) はフレームにしていない。ブラウザが付けるのはログインのトークンのため (分析の癖の決まり)。(10) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。(11) ブラウザの中の保存 (期間の localStorage など) は I/O に書いていない。(12) 画面の中の検索 (ページの一覧を urlPath の部分一致で絞る) と、画面の幅の区分けは、表示の整形なので rules に書いていない。(13) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[レビュー] 指摘は 5 件 (medium 2、low 3) で、すべて直した: Redis の auth:* の読み取りを interpretation にした (キーの形は saveAuth から読み取ったため)。POST …/segments の呼び出しを interpretation にした (URL が segmentId の有無で切り替わるため)。PostgreSQL の website_event に event_type と event_id、ClickHouse の website_event に event_id を足した。getWebsiteDateRange に DATABASE_REPLICA_URL を足した。high が無いので、もう一度のレビューはしていない。"
