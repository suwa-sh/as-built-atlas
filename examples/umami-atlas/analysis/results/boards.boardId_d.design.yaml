summary:
  status: interpretation
  value: 1 つのボードの中身 (行・列・部品) を組み立てる画面。URL の boardId で GET /api/boards/[boardId] を呼び、board を読んで編集中のボードにする (読めなければ、空の既定のボードになる)。行と列の追加・削除・並べ替え・大きさの変更と、列に置く部品の選択は、画面の中だけで行い、保存のボタンで POST /api/boards/[boardId] を呼んで board をまるごと更新する (ボードに id が無いときは POST /api/boards で board を作り、新しいボードの画面へ移る)。更新と作成の前に、サーバーが、ボードが参照するサイト・ピクセル・リンクを本人が見られるか (website / link / pixel / board / team_user を読む) と、Funnel / Goal の部品が指す保存済みのレポートが正しいか (report を読む) を確かめる。列ごとに、部品の対象 (サイト・ピクセル・リンク) がまだ読めるかを GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId] で確かめてから、部品を描く。部品は、保存されたボードの parameters で決まる 16 種類 (統計の帯、グラフ、表、地図、リアルタイム、売上、UTM、ファネル、ゴールなど) と文字で、それぞれがサイトの集計の API を呼ぶ (部品の先は辿っていない)。部品を選ぶ小窓は、Funnel / Goal の部品のとき保存済みのファネル / ゴールの一覧 (report) を読み、mixed のボードでは対象の選択欄のためにサイト・ピクセル・リンクの一覧を読む (URL に /teams/<id> があればチームのもの、無ければ本人のもの)。上部の操作 (期間の選択と絞り込み) は、ボードの対象に合わせてサイト・ピクセル・リンクの共通の部品を描く (先は辿っていない)。権限は各 API が確かめる (ボードを見るのは持ち主かチームのメンバー、更新は持ち主か website:update を持つチームのメンバー、作成は website:create。管理者はすべて可)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
