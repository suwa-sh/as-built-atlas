notes: '指示書 0.4.1 とプロファイル 0.4.0 で分析し直した (入口の一覧に、登録表 boardComponentRegistry の部品 16 件と、共有の部品 WebsiteControls (part_p.shared_a.WebsiteControls) が part の入口として入ったため。前の結果は 194 フレーム)。(1) 画面を包む枠 ((main) の layout と、そこから描かれる部品) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) 登録表を引くフレーム BoardComponentRenderer で止め、部品 16 件を links の embed (target は登録表のキー、entry_id は part_p.boardComponentRegistry.<キー>、状態は interpretation、根拠は登録表を引く行と部品を描く行と登録表の項目の行) で書いた。BoardComponentRenderer は、列 (BoardEditColumn.tsx:61) と、部品を選ぶ小窓の試し描き (BoardComponentSelect.tsx:507、isPreview 付き) の 2 か所から呼ばれる同じ関数なので、入口から辿る順で先に着く列の下に 1 回だけ書き、小窓の側は summary で触れた。部品の中 (集計の API、問い合わせ、注釈など。試し描きのときの isPreview の効き方も) は、部品の入口で分析する。前の結果にあった、部品ごとの 18 のフレーム (not_analyzed) は消した。Metrics bar の、対象の種類ごとの部品を選ぶ判定は、BoardComponentRenderer の rules に書いた。TextBlock は文字を出すだけで入口ではないので、summary に名前を書いただけ。(3) 期間と絞り込みの操作のうち、WebsiteControls は別の入口 (共有の部品) になったので、このリポジトリの決まり (共有の部品) のとおり、描く BoardControls で止め、links に embed (target WebsiteControls、entry_id part_p.shared_a.WebsiteControls、状態は fact、根拠は import の行と描く行) を書いた。前の結果の WebsiteControls の下の 9 フレーム (WebsiteFilterButton から checkAuth までの、もう一度書いた段) は消した。どれも、ほかの呼び出し元の下に先に書いた処理の書き直しだったので、ほかのフレームの置き場は動かない。WebsiteControls に渡す値 (websiteId だけで、操作の切り替えは既定値のまま) は BoardControls の summary に書いた。PixelControls / LinkControls は別の入口ではないので、前の結果では not_analyzed で止めていたものを、このリポジトリの決まり (共通の絞り込みの部品は、データに届くまで辿る) のとおり、辿った。フレームと綴りは、同じ部品を同じコミットで辿った boards.boardId_d の結果から写し、この入口の置き場に合わせて直した (パスは /boards/<boardId>/design。/events などで終わらないので、パスで決まる枝の結論は同じ)。(4) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。BoardDesignPage の中の順は BoardProvider (useBoardQuery 65 行 → 保存の post 96・98 行) → BoardDesignHeader → BoardControls → BoardEditBody。そのため、parseRequest → checkAuth → getUser、canViewBoard → getBoard / getTeamUser は GET /api/boards/[boardId] の下、canViewWebsite → getEntity → getWebsite / getLink / getPixel、canViewPixel、canViewLink、hasValidBoardReports → getReport は POST /api/boards/[boardId] の下にある。操作を辿ったことで、置き場が 2 つ動いた: canViewWebsiteSection は、前は小窓の GET /api/websites/[websiteId]/funnels の下にあったが、操作の GET /api/websites/[websiteId]/values の下に移った。canViewSharedWebsite は、前は列の GET /api/websites/[websiteId] の下にあったが、操作の GET /api/websites/[websiteId]/daterange の下に移った (列の GET /api/websites/[websiteId] は、呼び先がすべてほかの下に書いてあるので、parseRequest から書き直した)。(5) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。external の段までは書かず、確認・設定・ルールも繰り返していない)。このリポジトリの決まりのとおり、読み書きを持つ最初の段は checkAuth (Redis の auth:* の読み取り) なので、前の結果が checkAuth の下にもう一度書いていた getUser (4 か所) は消し、checkAuth の段に読み書きを書いた。(6) 固定の値で閉じている呼び出し (指示書 0.4.1) は 3 種類、6 か所。(a) getAllUserWebsitesIncludingTeamAccess: この入口で WebsiteSelect を描くのは BoardComponentSelect だけで、includeTeams を渡さない (BoardComponentSelect.tsx:340-345)。値が undefined の引数は URL に付かない (src/lib/url.ts:5) ので、GET /api/users/[userId]/websites (route.ts:29) と GET /api/me/websites (route.ts:22) の includeTeams の枝は、この入口では決して動かない。前の結果にあったフレーム q_get_all_user_websites を消した。(b) ExportButton の GET /api/websites/[websiteId]/export: BoardControls は PixelControls / LinkControls に allowDownload を渡さず (BoardControls.tsx:22、24)、既定値は false なので、ExportButton は描かれない (WebsiteControls の中は、部品の入口で分析する)。(c) POST /api/websites/[websiteId]/segments/[segmentId] (セグメントの更新): SegmentEditForm を描くのは FilterBar だけで、segmentId を渡さない。閉じている呼び出しの名前・値・行は、条件を持つフレーム (2 つの受け口、SegmentEditForm、2 つの操作の部品 PixelControls / LinkControls) の summary に書いた (指示書は「条件を持つフレームの notes」と言うが、フレームの形式に notes が無いので、このリポジトリの決まりのとおり summary に書いた)。BoardDesignPage が BoardProvider に渡す editing (固定の true) は、Context に入るだけで、データに届く呼び出しを決めないので、数えていない。状態・保存されたデータ・URL で決まる条件 (POST /api/auth/verify の enabled: !user、GET /api/me/websites の userId の有無、イベントのプロパティのタブのパスの条件) は、固定の値ではないので、conditional で書き、成り立たないように見える理由を note に書いた。(7) 保存の作成の経路 (POST /api/boards) は、URL に boardId があっても、ボードを読めなかったとき (エラーか、ボードが無いとき) に、既定の id の無いボードを保存すると入るので、conditional で書いた。この画面の保存は、読み込んだボードをまるごと送るので、type がいつもあり、POST /api/boards/[boardId] の canViewBoardEntities と hasValidBoardReports は always にした。(8) フレームにしなかったもの: useNavigation / useMessages / useModified / useBoard (URL・翻訳・更新印・画面の中のボードの小道具)、PageBody / PageHeader / Panel / Empty / ControlledDialog / react-resizable-panels (見た目だけの部品)、TextBlock (設定の文字を出すだけ)、GET /api/config (useConfig。このリポジトリの決まり)。(9) checkAuth の API キーの経路は、ブラウザがログイントークンを付けるので辿っていない。このリポジトリの決まり (どの入口にも出る共通の段) のとおり、設定 (CLOUD_MODE) と、rules の 1 行 (umami_ で始まるトークンは API キーとして調べる) に書いた。(10) API_URL と BASE_PATH は、このリポジトリの決まりのとおり、最初に API を呼ぶフレーム useBoardQuery にだけ書いた (前の結果は、API を呼ぶフックごとに書いていた)。(11) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前だけと、権限の定数の名前だけを書き、条件の説明は note に書いた。src/permissions/ の確認の関数 (canViewBoard、canUpdateBoard、canViewWebsite、canViewPixel、canViewLink、canCreateTeamWebsite、canUpdateWebsite、canViewTeam、受け口の確認として書いた canCreateWebsite) には、関数の中の管理者の確認を、別の 1 件 (role、user.isAdmin) として書いた。GET /api/users/[userId]/websites の受け口が自分で行う管理者の確認も、同じく role の 1 件にした (boards の結果と同じ書き方)。canViewWebsiteSection / canViewSharedWebsiteFilters / canViewSharedWebsite は、利用者がいれば canViewWebsite に任せるだけで、自分では管理者を確かめないので、role を書いていない。(12) テストとの対応は、作業定義で選ばれていないので分析していない。(13) この分析のレビューの指摘は medium が 4 件で、すべて直した (canCreateWebsite の管理者の確認を role の 1 件に、canViewSharedWebsite に other の確認を足し、canUpdateWebsite の 2 つの確認を fact に)。前の分析のレビューの指摘 (low 2 件) は、前の分析で直してある (canViewWebsiteSection と canViewSharedWebsiteFilters から canViewWebsite への枝を always に、useBoardQuery の API_URL / BASE_PATH の note の例から useWebsiteStatsQuery を外した)。'
