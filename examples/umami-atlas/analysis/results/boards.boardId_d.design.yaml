summary:
  status: interpretation
  value: 1 つのボードの中身 (行・列・部品) を組み立てる画面。URL の boardId で GET /api/boards/[boardId] を呼び、board を読んで編集中のボードにする (読めなければ、空の既定のボードになる)。行と列の追加・削除・並べ替え・大きさの変更と、列に置く部品の選択は、画面の中だけで行い、保存のボタンで POST /api/boards/[boardId] を呼んで board をまるごと更新する (ボードに id が無いときは POST /api/boards で board を作り、新しいボードの画面へ移る)。更新と作成の前に、サーバーが、ボードが参照するサイト・ピクセル・リンクを本人が見られるか (website / link / pixel / board / team_user を読む) と、Funnel / Goal の部品が指す保存済みのレポートが正しいか (report を読む) を確かめる。期間と絞り込みの操作は、ボードの対象 (無ければ最初の部品の対象) について描く。対象がピクセルかリンクなら、PixelControls / LinkControls が、サイトの画面と同じ部品 (values / segments / event-data / session-data / daterange の API、セグメントの保存) を描く。対象がサイトなら、共有の部品 WebsiteControls を描く (別の入口として分析するので、この画面では描く所で止めて、つながり (embed) だけを書いた)。列ごとに、部品の対象 (サイト・ピクセル・リンク) がまだ読めるかを GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId] で確かめてから、部品の type で登録表 (boardComponentRegistry) から部品を引いて描く。部品 16 種類は、それぞれ別の入口として分析するので、この画面では登録表を引く所で止めて、部品へのつながり (embed) だけを書いた。部品を選ぶ小窓は、Funnel / Goal の部品のとき保存済みのファネル / ゴールの一覧 (report) を読み、mixed のボードでは対象の選択欄のためにサイト・ピクセル・リンクの一覧を読み (URL に /teams/<id> があればチームのもの、無ければ本人のもの)、選んでいる最中の部品を同じ登録表から試しに描く。権限は各 API が確かめる (ボードを見るのは canViewBoard、更新は canUpdateBoard、作成は PERMISSIONS.websiteCreate)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
