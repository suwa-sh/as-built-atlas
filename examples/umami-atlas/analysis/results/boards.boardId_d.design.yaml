notes: '指示書 0.4.0 とプロファイル 0.4.0 で分析した。(1) 画面を包む枠 ((main) の layout と、そこから描かれる部品) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) ボードの編集の画面 (boards.boardId_d.edit) と、ボードの一覧 (boards) の結果と同じ処理 (ボードの読み込みと更新・作成、権限の確認、対象の読み込み、サイト・ピクセル・リンクの選択欄) は、同じコミットの、レビュー済みの結果のフレームを出発点にし、この入口の呼び出し元と条件に合わせて書き直した。根拠の主な行は、対象のコードで確かめた。(3) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。BoardDesignPage の中の順は BoardProvider (useBoardQuery 65 行 → 保存の post 96・98 行) → BoardDesignHeader → BoardControls → BoardEditBody。そのため、parseRequest → checkAuth → getUser、canViewBoard → getBoard / getTeamUser は GET /api/boards/[boardId] の下、canViewWebsite → getEntity → getWebsite / getLink / getPixel、canViewPixel、canViewLink、hasValidBoardReports は POST /api/boards/[boardId] の下にある。BoardEditColumn の中の順は useBoardEntityAvailability (49 行) → BoardComponentRenderer (61 行) → BoardComponentSelect (148 行) で、useWebsiteQuery / usePixelQuery / useLinkQuery は useBoardEntityAvailability の下にある。小窓の選択欄は、コードの順 (PixelSelect 326 行 → LinkSelect 333 行 → WebsiteSelect 340 行) に辿ったので、canViewTeam は GET /api/teams/[teamId]/pixels の下にある (編集の画面の結果では、サイトの選択欄の下にある)。(4) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。external の段までは書かず、確認・設定・ルールも繰り返していない)。(5) 辿るのを止めた所 (unknown + not_analyzed)。(a) BoardControls が描く WebsiteControls / PixelControls / LinkControls: 期間の選択と絞り込みの、サイト・ピクセル・リンクの画面と共通の部品。websites.websiteId_d.funnels の結果も、同じ部品の絞り込みのボタンを not_analyzed で閉じている。コードの順では BoardEditBody より前にあるので、辿れば、GET /api/websites/[websiteId] などが、その下に移るかもしれない。(b) BoardComponentRenderer が描く 18 のフレーム (部品の一覧の 17 種類のうち文字以外の 16 種類と、Metrics bar のピクセル・リンク向けの 2 つの差し替え。WebsiteMetricsBar は対象の種類で 3 つに分けた): 各部品が呼ぶフックと API の URL までを読み、受け口から先は辿っていない。各部品は、サイト・ピクセル・リンクの画面の部品をそのまま使っており、受け口から先は、それらの画面の結果にある。どの部品が描かれるかは、保存されたボードの parameters で決まるので、call は interpretation の conditional にした。(6) 保存の作成の経路 (POST /api/boards) は、URL に boardId があっても、ボードを読めなかったとき (エラーか、ボードが無いとき) に、既定の id の無いボードを保存すると入るので、conditional で書いた。(7) この画面の保存は、読み込んだボードをまるごと送るので、type がいつもあり、POST /api/boards/[boardId] の canViewBoardEntities と hasValidBoardReports は always にした。(8) この画面からは条件が成り立たないように見える呼び出しも、消さずに conditional で書き、そう見える理由を note に書いた: WebsiteSelect の useLoginQuery からの POST /api/auth/verify、GET /api/me/websites、getAllUserWebsitesIncludingTeamAccess。(9) フレームにしなかったもの: useNavigation / useMessages / useModified / useBoard (URL・翻訳・更新印・画面の中のボードの小道具)、PageBody / PageHeader / Panel / Empty / ControlledDialog / react-resizable-panels (見た目だけの部品)、TextBlock (設定の文字を出すだけ)。(10) checkAuth の API キーの経路は、ブラウザがログイントークンを付けるので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(11) 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth と /config 以外は) その URL に向く。編集の画面の結果に合わせて、API を呼ぶフックとコンポーネントの settings に書いた。(12) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前だけと、権限の定数の名前だけを書き、条件の説明は note に書いた。canViewWebsiteSection は、websites.websiteId_d.funnels の結果と同じ書き方 (kind: other) にした。(13) テストとの対応は、作業定義で選ばれていないので分析していない。(14) レビューの指摘は low が 2 件で、どちらも直した (canViewWebsiteSection から canViewWebsite への枝を、同じ結果の canViewSharedWebsite の枝と同じく always にした。部品の種類の数を、一覧の 17 種類 (文字以外の 16 種類と文字) にそろえた)。レビューの notes にあった点: 部品の note が「サイトのイベントの画面」などと書く入口 (websites.websiteId_d.events / goals / utm / realtime / revenue / sessions) は、まだ結果が無い。canViewWebsiteSection から canViewWebsite への枝の when は、入口の間で分かれている (websites.websiteId_d.funnels は conditional)。どちらも、そろえ方は人が決める。'
