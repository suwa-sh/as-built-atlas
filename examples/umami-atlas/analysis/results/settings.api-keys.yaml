    - { file: "src/app/api/me/api-keys/[keyId]/route.ts", line: 19 }
    - { file: src/lib/api-key.ts, line: 41 }
notes: "[1] 画面を包む枠 (ルート、(main)、settings の layout と、そこから描かれる部品) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。settings の枠は、ビルド時の cloudMode があると何も描かない (layout_l.main_g.settings の結果) ので、この画面の ApiKeysPage の cloudMode の分かれ道 (実行時の GET /api/config の値) と、受け口の CLOUD_MODE による 404 は、この画面からは成り立たない側に見える。指示書のとおり、消さずに、設定で決まる打ち切りとして、その後ろの呼び出しを conditional にした。[2] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。ApiKeysPage は作成ボタン (ApiKeysPage.tsx:22) を一覧 (:25) より前に描くので、parseRequest → checkAuth → getUser と Redis の読み取りは、POST /api/me/api-keys の下に置いた。GET と DELETE の受け口は、summary で触れるだけにした (それぞれ、ほかに query の段を持つので、終端にならない)。[3] 段にしなかったもの: useConfig → GET /api/config (skipAuth で環境変数を返すだけで、データにもライブラリにも届かない。ほかの入口の結果と同じ扱い。設定 CLOUD_MODE は、それで描き分ける ApiKeysPage に書いた)、isApiKeyEnabled / generateApiKey / hashApiKey / getApiKeyPrefix / uuid (src/lib/api-key.ts と src/lib/crypto.ts の、データを読まない補助の関数。設定とルールは、それを呼ぶ受け口に書いた)、useModified (ブラウザの中の更新印。touch('api-keys') で一覧を読み直させる)、useMessages (翻訳)、LoadingPanel / DataTable / DateDistance / EmptyPlaceholder / CopyButton / DialogButton / ConfirmationForm (見た目と小窓の部品)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)。[4] checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない (ほかの入口の結果と同じ扱い)。なお、/api/me/api-keys は API キーでは使えないパス (src/lib/api-key.ts:13) なので、API キーで呼ばれても checkApiKeyAuth は api_key を読む前に null を返す。設定 (CLOUD_MODE) にだけ書いた。[5] DELETE の、自分のキーだけを消す確認は、deleteApiKey の where に userId を入れ (apiKey.ts:43)、消えた件数が 0 なら受け口が 404 を返す (route.ts:21) 形。判定している受け口の段に、所属の確認 (ownership) として、決まりのとおり関数の名前 deleteApiKey で書いた。[6] 画面から API を呼ぶ URL は、環境変数 API_URL があると (/auth と /config 以外は) その URL に向く。既定では同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL と BASE_PATH は、API を呼ぶフックの settings に書いた。[7] 確認の値は analysis-conventions.md の綴りにした (ログイン済みは checkAuth の 1 か所だけ)。DATABASE_URL と APP_SECRET は settings に書いていない。[8] links は無い (この画面のコードに、ほかの画面への遷移・起動・小窓は無い。作成と削除の小窓は、この画面の中の部品)。[9] テストとの対応は、作業定義の analysis.tests が無いので、分析していない (src/app/api/me/api-keys/route.test.ts などがあることだけ見た。中は読んでいない)。[10] レビューの指摘は low が 1 件で、直した (キーの文字の集まりの根拠に src/lib/generate.ts:10 を足した)。レビューが人の判断に回したこと: 確認の関数が無い所属の確認の綴りは、この結果は関数の名前 deleteApiKey、ほかの入口には auth.user.id === userId と書いたものがある。"
