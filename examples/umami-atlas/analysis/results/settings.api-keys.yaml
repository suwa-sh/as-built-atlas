summary:
  status: interpretation
  value: "自分の API キーを一覧し、作り、消す画面。サーバー側の page は ApiKeysPage を描くだけで、本体はブラウザ側で動く。設定値 (GET /api/config の cloudMode。環境変数 CLOUD_MODE) がクラウドモードなら何も描かない。そうでなければ、GET /api/me/api-keys で自分の api_key を新しい順に読み (名前・キーの先頭・作成日時・最後に使った日時)、表にする。作成ボタンは小窓を開き、名前を POST /api/me/api-keys で送る。受け口は umami_ で始まるランダムなキーを作り、そのハッシュと先頭の 14 文字を api_key に書き、平文のキーを、この 1 回だけ返す。小窓は平文のキーとコピーのボタンを出す。行の削除ボタンは確認の小窓を開き、DELETE /api/me/api-keys/[keyId] で、自分のキーだけを消す (自分のものでなければ 404)。各 API は、ログイントークンから user を読んで認証する (Redis のセッションを使うときは auth:* も読む)。受け口も、CLOUD_MODE があれば 404 を返す。ほかの画面へのつながりは無い"
  evidence:
    - { file: "src/app/(main)/settings/api-keys/page.tsx", line: 5 }
