summary:
  status: interpretation
  value: 'ボードに置く「リアルタイムの指標の帯」の部品 (登録表の type: RealtimeHeader、コンポーネントは BoardRealtimeMetricsBar)。描く側から受け取ったサイトについて、useRealtimeQuery で GET /api/realtime/[websiteId] をクエリを付けずに呼び、10 秒ごとに読み直して、ページビュー・訪問者・イベント・国の 4 つの合計を出す。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは realtime) で見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、期間を直近 30 分 (単位は minute) にして getQueryFilters で条件をまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む)、getRealtimeData で、最近の動き (性能の計測を除くイベントを新しい順に 100 件。website_event と session) と、ページビュー・訪問者の分ごとの時系列 (website_event) を読み、合計を作って返す。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。部品が出すのは合計だけだが、受け口は国・ページ・リファラーごとの数や最近の動きも一緒に返す。書き込みは無い。ほかの入口へのつながりは無い'
