notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 RealtimeActiveUsers (boardComponentRegistry.tsx:252) が指すコンポーネント BoardRealtimeActiveUsers (BoardRealtimeActiveUsers.tsx:6)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId) を入口のフレームの parameters に書いた。この部品は、描く画面の URL のクエリ (期間や絞り込み) を読まない。登録表のこの項目は componentByEntityType も configFields も defaultProps も持たないので、替わる先のコンポーネントは無い。(2) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。この部品が呼ぶ API は active の GET 1 つだけなので、parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser を、すべてこの受け口の下に 1 回ずつ書いた。書き直し (rw) のフレームは無い。(3) 同じ処理を書く既にある結果 (layout_l.main_g.websites.websiteId_d の ActiveUsers → active の経路、part_p.boardComponentRegistry.EventsMetricsBar の受け口の共通の経路) の綴りと木を出発点にし、根拠の行は対象のコードで確かめた。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_active_users) に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(4) 固定の値で閉じている呼び出しは無い。この部品の木の中で固定の値を直接書いて渡している所は、useActiveUsersQuery(websiteId, { refetchInterval: REALTIME_INTERVAL }) (BoardRealtimeActiveUsers.tsx:8-9) と canViewWebsiteSection(auth, websiteId, ['overview', 'realtime']) (active/route.ts:18) だが、どちらも読み直しの間隔や判定に使う値を変えるだけで、呼び出しの有無は決めない。parseRequest(request) (active/route.ts:10) が schema も skipAuth も渡さないことは、checkAuth の呼び出しを、いつも成り立つ条件にする向き (閉じる向きではない) なので、call を always にして note に書いた。schema を渡さないので、parseRequest の入力の検査 (400 を返す) はこの受け口では動かず、q_parse_request の rules に書いていない。(5) 迷った点と選んだ扱い。(a) フックの enabled は websiteId があること (useActiveUsersQuery.ts:9) だが、websiteId は部品の必須の props なので、ほかの部品の結果にそろえて、受け口への call を always にした。(b) LoadingPanel・Column・Text は見た目だけの部品なので、フレームにしていない。数が取れないときは 0 を出すこと (BoardRealtimeActiveUsers.tsx:11) は表示の整形なので、rules にせず summary に書いた。(6) links は 1 件も無い (ほかの画面の ActiveUsers はリアルタイムの画面へのリンクを持つが、この部品は持たない)。(7) レビューへの対応 (1 回、指摘は low 1 件。直した)。checkAuth の Redis の auth:* の読み取りの fields を、* から、コードが名前で読む userId と pwd にした (auth.ts:104、:108)。レビューが人の判断に回した点: CLOUD_MODE は checkAuth の API キーの枝の有無にも効く (api-key.ts:40) が、その枝はフレームにしないので、part_p.boardComponentRegistry.EventsMetricsBar にそろえて checkAuth の settings に書いていない (layout_l.main_g.websites.websiteId_d は書いていて、入口の間で扱いが分かれている)。"
