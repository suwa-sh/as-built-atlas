summary:
  status: interpretation
  value: "ボードに置く「今いる訪問者の数」の部品 (登録表の type: RealtimeActiveUsers)。描く側から受け取ったサイトについて、GET /api/websites/[websiteId]/active を 10 秒ごとに呼んで、直近 5 分の訪問者の数を大きな数字 1 つで出す。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは overview か realtime) でサイトを見てよいかを確かめる (ログインした利用者なら canViewWebsite が website / share / link / pixel / board / team_user を読む)。getActiveVisitors が website_event の異なる session_id を数える。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。書き込みは無い。ほかの入口へのつながりは無い"
