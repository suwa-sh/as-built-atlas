notes: "[1] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は GET /api/teams/[teamId] (route.ts:8。TeamProvider の useTeamQuery が最初に着く) の下。getTeamUser は canViewTeam (permissions/team.ts:15) の下。useLoginQuery → POST /api/auth/verify は TeamSettings (TeamSettings.tsx:16) の下。メンバーの DELETE (useDeleteQuery 以下) は TeamLeaveForm (TeamSettings.tsx:37 が 47 より前) の下。useTeamMembersQuery → GET /api/teams/[teamId]/users は、メンバー追加の小窓の UserSelect (TeamSettings.tsx:45 が 47 より前) の下。canUpdateTeam は POST /api/teams/[teamId] の下。[2] 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id が _rw で終わるフレーム。分析リポジトリの決まりどおり external の段までは書かず、権限の確認・設定・ルールは繰り返していない): canDeleteTeamUser / canUpdateTeam / canDeleteTeam の下の getTeamUser、TeamMemberRemoveButton の下の useDeleteQuery → DELETE → parseRequest → checkAuth (Redis のセッションの読み取りを持つ段)。[3] この入口からは条件が成り立たないように見える呼び出しは、消さずに conditional で書き、理由を note に書いた: (a) TeamLeaveButton 以下 (URL に /admin を含むので描かれない)、(b) 権限の関数の中の getTeamUser (管理者でないときだけ。この画面は、管理の枠が管理者にだけ描く。src/app/(main)/admin/AdminLayout.tsx:9)、(c) deleteTeam のクラウドモードの枝 (管理の枠がクラウドモードでは何も描かない。src/app/(main)/admin/layout.tsx:5)。(c) の読み書き (team / link / pixel の論理削除) も、同じ考え方で消さずに書き、note を付けた。設定メニューの同じ部品の結果 (settings.teams.teamId_d) は、この枝の読み書きを書いていないので、扱いが違う。[4] 逆に、if の中にあるが、この入口ではいつも成り立つ呼び出しは always にし、note に理由を書いた: TeamsMemberAddButton と TeamTwoFactorSettings (pathname が /admin を含む)、GET /api/2fa/status (enabled に true を渡す)。[5] TeamSettings の caller は、JSX に書いている AdminTeamPage のままにし、描くかどうかを決める TeamProvider の条件は call の condition に書いた。[6] 権限の関数のうち、データに届かないもの (canViewUsers と canEnforceTwoFactorAuthForTeam。どちらも user.isAdmin を返すだけ) は段にできないので、確認は、それを呼ぶ受け口の段に書いた。[7] ログイン済みの確認は、分析リポジトリの決まりどおり checkAuth の段に 1 か所だけ書いた。権限の確認の値も決まりの綴りにした (user.isAdmin、定数の名前、関数の名前)。[8] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので、この画面からは使わないものとして辿っていない。設定 (CLOUD_MODE) にだけ書いた。parseShareToken (auth.ts:88) はヘッダーのトークンを解くだけでデータを読まない。[9] 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL は呼び出すフックの settings に書いた。[10] pagedQuery (src/lib/prisma.ts:761) は、引数のモデルで読むテーブルが変わるので、user の一覧と team_user の一覧で external の段を分けた。[11] GET /api/admin/users の並びの列は、URL のクエリの orderBy で username / role / createdAt に変わる。並びに使える 3 つの列に filter を付け、note に書いた。[12] POST /api/admin/teams/[teamId]/2fa の手前の打ち切りは設定 (CLOUD_MODE と暗号鍵) で決まるので、その後ろのライブラリの呼び出しを conditional にした。[13] DB の接続先の環境変数 (DATABASE_URL) は、分析リポジトリの決まりどおり settings に書いていない。[14] テストとの対応は、作業定義で選ばれていないので分析していない。[15] レビューの指摘は low が 3 件。2 件は直した (API を呼ぶフックの settings に BASE_PATH を足した。GET /api/admin/users の user の読み取りの列を、password を除いて 1 つずつ書いた)。残る 1 件 (checkAuth の API キーの枝を辿っていない。[8]) は直していない。ほかの入口の結果も同じ扱いで、この入口だけにフレームを足すと入口の間で食い違うため。辿らないことを分析リポジトリの決まりにするか、全部の入口で辿るかは、人が決める必要がある"
