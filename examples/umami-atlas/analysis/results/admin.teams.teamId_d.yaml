summary:
  status: interpretation
  value: "管理のメニューの中で、管理者が 1 つのチームを見て編集する画面。URL の teamId で GET /api/teams/[teamId] を呼び、team とメンバー (team_user) を読んで、チーム名・チーム ID・招待コードを出す。名前と招待コードは POST /api/teams/[teamId] で更新できる (team の update)。メンバー表 (GET /api/teams/[teamId]/users で team_user と user を読む) から、オーナー以外のメンバーの役割の変更 (team_user の update) と削除 (team_user の delete) ができる。URL に /admin を含むので、設定メニューの同じ部品には無い 2 つが出る: (1) メンバー追加ボタン。小窓で、全ユーザー (GET /api/admin/users で user と website の件数を読む) からメンバーでない人を選び、POST /api/teams/[teamId]/users で team_user を作る。(2) チームの 2 段階認証の設定。GET /api/2fa/status で全体の状態 (two_factor_auth / app_setting / user / team_user / team) を読み、スイッチで POST /api/admin/teams/[teamId]/2fa を呼んで team.two_factor_required を更新する。逆に、退出ボタンは URL に /admin を含むと出ないので、この画面には出ない (コードにある経路として書いている)。見ている管理者がそのチームのオーナーでもあれば削除ボタンが出て、DELETE /api/teams/[teamId] でチームと、そのチームの team_user / share / link / pixel / board を消し、Redis が有効なら link:* / pixel:* のキャッシュも消して /settings/teams へ移る。権限は各 API が確かめる (見るのはメンバーか管理者、更新は team:update、削除は team:delete、メンバーの変更と削除は役割の順位、全ユーザーの一覧とチームの 2 段階認証は管理者だけ)。各 API の認証はログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)"
  evidence:
    - { file: "src/app/(main)/admin/teams/[teamId]/page.tsx", line: 7 }
