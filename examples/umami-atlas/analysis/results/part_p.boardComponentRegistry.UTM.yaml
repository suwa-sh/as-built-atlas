notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 UTM (boardComponentRegistry.tsx:208) が指すコンポーネント BoardUTM (BoardUTM.tsx:11)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、param、limit) と、描く画面の URL のクエリ (期間、絞り込み) を、入口のフレームの parameters に書いた。登録表のこの項目は componentByEntityType を持たないので、替わる先のコンポーネントは無い。描く側が渡す isPreview は、BoardUTM が受け取らないので書いていない。(2) 固定の値で閉じている呼び出しは無い (0 件)。確かめたこと: (a) BoardUTM が子に直接書く固定の値は、PieChart の type=\"doughnut\" と、ListTable に渡す値だけで、どちらも見た目だけの部品の中の話 (呼び出しの条件ではない)。(b) useAnalyticsQuery が useFilterParameters に固定の includePagination: false を渡す (useAnalyticsQuery.ts:15) ので、page / pageSize は送られないが、これは送る値が変わるだけで呼び出しの枝ではない。(c) param と limit は、保存された部品の設定から描く側が渡す値 (入口の外の値) なので、固定の値に当たらない。(3) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。この入口の受け口は 1 つ (GET …/utm/metrics) だけなので、parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment、getUTM をすべて、その下に 1 回ずつ書いた。fetchWebsite が呼ぶ getWebsite は、getEntity の下に書いた q_get_website と同じなので、フレームにしていない (fetchWebsite 自身が Redis の I/O を持つ)。書き直し (_rw) は要らなかった。(4) 綴りと木は、同じ受け口と getUTM を書いた既にある画面の結果 (websites.websiteId_d.utm の use_utm_metrics / api_utm_metrics / q_get_utm / ext_prisma_utm / ext_clickhouse_utm) と、同じ前処理・権限の確認・絞り込みを書いた部品の結果 (part_p.boardComponentRegistry.WebsiteMetricsBar、canViewWebsite の役割の確認は part_p.boardComponentRegistry.Goal) を出発点にし、根拠の行は対象のコードで確かめた。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_utm_metrics) に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。checkAuth の CLOUD_MODE (API キーの枝だけを切り替える) は、この入口では有無で結果が変わらないので書いていない (WebsiteChart / Goal の部品の結果と同じ)。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(5) 迷った点と選んだ扱い。(a) getUTM の読む列のうち UTM の列は、クエリの type (5 つのどれか) を SQL に埋め込むので、1 回の問い合わせで読むのは 1 つだが、どれになるかは保存された設定で決まるので、5 つとも fields に書いた (画面の結果と同じ)。(b) BoardUTM は useDateRange をタイムゾーンを渡さずに呼び、その期間を startDate / endDate として渡すので、URL から作る startAt / endAt (タイムゾーンで直したもの) を上書きして送る。読み書きの相手は変わらないので、フック use_utm_metrics の summary に書くだけにした。(c) useDateRange はブラウザに保存した期間 (localStorage) を読むが、サーバーのデータではないので I/O に書かず、parameters に書いた。(d) 表の行数 (limit) と割合の計算は、画面の上の計算だが、割合の分母が「出した limit 件の合計」で全体の合計ではないことが読み手に効くので、入口のフレームの rules (calculation) に書いた。(e) 描く側が、ボードの対象の種類が pixel / link のときに websiteId に何を渡すかは、部品の入口からは読めない (この項目は componentByEntityType を持たない)。受け口と問い合わせは、受け取った id をサイトの id として使う。(6) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。(7) レビューへの対応 (1 回。high 0 件、medium 0 件、low 1 件。直した)。入口のフレームの「絞り込みのクエリ」で、allowFilter の条件が segment / cohort / excludeBounce / match にだけ掛かるように読めたので、search 以外のすべてに掛かる書き方に直した (useFilterParameters.ts:19)。"
