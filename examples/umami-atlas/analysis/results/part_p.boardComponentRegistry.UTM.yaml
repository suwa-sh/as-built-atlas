summary:
  status: "interpretation"
  value: "ボードに置く「UTM」の部品 (登録表の type: UTM)。描く側から受け取ったサイトと UTM のパラメータ (param。既定 utm_source) について、描く画面の URL の期間 (無ければブラウザに保存した期間) と絞り込みで、GET /api/websites/[websiteId]/utm/metrics を呼び、ページビューをパラメータの値ごとに数えた結果を読む。先頭 limit 件 (既定 10) を、値の表とドーナツのグラフで出し、割合はその limit 件の合計から画面で計算する。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは utm) でサイトを見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getUTM で website_event を数える (多い順に 50 件)。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。DB への書き込みは無い (Redis の website:* のキャッシュを書くことはある)。ほかの入口へのつながりは無い"
