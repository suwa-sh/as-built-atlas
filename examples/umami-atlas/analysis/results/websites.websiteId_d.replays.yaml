  "value": "サイト 1 件のセッションの録画の画面。サーバー側の page は URL の websiteId を ReplaysPage に渡すだけで、画面の本体はブラウザ側で動く。最初に契約 (GET /api/auth/subscription。CLOUD_MODE のときだけ。Redis の team:* / account:* を読む) を読み、クラウドモードで replays の機能 (Business の契約) が無ければ、アップグレードの案内だけを出して何も読まない。それ以外で開いたときに読むもの: データのある期間 (daterange)、選んだタブの中身 (録画の一覧 replays: session_replay を訪問ごとにまとめ、端末と場所を付ける。既定で長さ 5 秒以上だけ / 保存した録画の一覧 replays/saved: session_replay_saved)。URL に segment か cohort があれば、その定義 (segments/[segmentId]) も読む。利用者の操作で読むもの: フィルターの小窓の候補 (values、segments の一覧、セッションのプロパティ session-data/properties と session-data/values)、録画の再生の小窓 (URL のクエリ replay。録画のかたまり replays/[replayId]、保存の状態 replays/saved/[replayId]、セッション sessions/[sessionId])、訪問者のアイコンを押して開くセッションの小窓 (sessions/[sessionId] とその activity / properties / replays)。書き込みは利用者の操作で起きるものだけ: いまの絞り込みをセグメントとして保存 (segment の作成)、録画の保存と保存の取り消し (session_replay_saved)、セッションの削除 (PostgreSQL だけで動くときだけ。session と、それに付くイベント・プロパティ・録画などをまとめて消す)。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。ほかの画面への遷移は無い (絞り込み・最短の長さ・再生とセッションの小窓は、同じ画面の URL のクエリを書き換えるだけ。アップグレードのボタンはクラウドの請求の画面を別タブで開く)"
