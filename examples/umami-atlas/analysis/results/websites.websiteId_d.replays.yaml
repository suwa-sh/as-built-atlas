  "value": "サイト 1 件のセッションの録画の画面。サーバー側の page は URL の websiteId を ReplaysPage に渡すだけで、画面の本体はブラウザ側で動く。最初に契約 (GET /api/auth/subscription。CLOUD_MODE のときだけ。Redis の team:* / account:* を読む) を読み、クラウドモードで replays の機能 (Business の契約) が無ければ、アップグレードの案内だけを出して何も読まない。それ以外では、上部に共有の部品 WebsiteControls (絞り込みと期間の操作) を描く。これは多くの画面が描く部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。開いたときに読むもの: 選んだタブの中身 (録画の一覧 replays: session_replay を訪問ごとにまとめ、端末と場所を付ける。既定で長さ 5 秒以上だけ / 保存した録画の一覧 replays/saved: session_replay_saved)。録画の一覧の受け口は、条件をまとめるときにサイトの情報 (REDIS_URL があれば Redis の website:*、無ければ website) を読み、URL に segment か cohort があれば、その定義 (segment) も読む。利用者の操作で読むもの: 録画の再生の小窓 (URL のクエリ replay。録画のかたまり replays/[replayId]、保存の状態 replays/saved/[replayId]、セッション sessions/[sessionId])、訪問者のアイコンを押して開くセッションの小窓 (sessions/[sessionId] とその activity / properties / replays。活動の行のプロパティのボタンを押せば event-data/[eventId] で event_data も読む)。書き込みは利用者の操作で起きるものだけ: 録画の保存と保存の取り消し (session_replay_saved)、セッションの削除 (PostgreSQL だけで動くときだけ。session と、それに付くイベント・プロパティ・録画などをまとめて消す)。統計の API は PostgreSQL 用と ClickHouse 用の SQL を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、サイトを見る権限の確認で website / share / link / pixel / board / team_user を読む。ほかの画面への遷移は無い (最短の長さ・再生とセッションの小窓は、同じ画面の URL のクエリを書き換えるだけ。アップグレードのボタンはクラウドの請求の画面を別タブで開く)"
