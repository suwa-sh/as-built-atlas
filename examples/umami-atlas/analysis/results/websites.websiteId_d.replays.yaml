"notes": "(1) この入口の初めての分析。同じ部品の木は、ほかの入口の結果 (websites.websiteId_d.heatmaps の useSubscription の木、websites.websiteId_d.events の WebsiteControls と SessionModal の木) を出発点にし、この画面での違いを対象のコードで確かめて直した (パスが /replays で終わるので、イベントのプロパティのタブは出ないが、列 event は選べる。WebsiteControls と SessionModal には websiteId だけを渡す)。(2) 同じ処理の置き場は、プロファイルの決まり (入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書く) に従った。ReplaysPage の中の順は、useSubscription (:21)、WebsiteControls (:55)、ReplaysDataTable (:63)、SavedReplaysDataTable (:66)、SessionModal (:70)、ReplayModal (:71)。その結果、parseRequest → checkAuth → getUser、canViewTeam → getTeamUser、fetchAccount は GET /api/auth/subscription の下。canViewWebsiteSection → canViewWebsite → getEntity、getQueryFilters → fetchWebsite / getWebsiteSegment は、最初に着く GET values (WebsiteControls → WebsiteFilterButton → FilterEditForm → FieldFilters → FilterRecord → useWebsiteValuesQuery) の下。canViewAuthenticatedWebsite と getSessionReplays は GET replays の下 (セッションの小窓の sessions/[sessionId]/replays からも呼ぶ)。ReplayPlayback は SessionModal → SessionProfile → SessionReplaysDataTable の下 (ReplayModal からも描く)。(3) 呼び先がすべてほかの呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、決まりどおり、いちばん早い呼び出しを読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>)。写した木の分 (rw1 / rw3 / rw5) に加えて、sessions/[sessionId]/replays の GET の下の parseRequest → checkAuth (rw2)、ReplayModal の下の ReplayPlayback → useReplayQuery → GET replays/[replayId] → parseRequest → checkAuth (rw1 / rw4)。書き直したフレームには、権限の確認・設定・ルールを繰り返して書いていない。(4) 迷った点と選んだ扱い。(a) ReplaysPage は、クラウドモードで replays の機能が無いとき、WebsiteControls・タブ・小窓を描く前に返す。設定で打ち切るかが決まるので、その後ろの 5 つを conditional にし、CLOUD_MODE を settings に書いた (heatmaps の結果と同じ扱い)。(b) タブ (Tabs / TabPanel) の中の ReplaysDataTable と SavedReplaysDataTable は、選んでいないタブの中身を描くかどうかが UI ライブラリの動きで、リポジトリからは読めないので、タブを条件に含めず note に書いた (タブは state と localStorage の umami.replays.tab で選ぶ)。(c) フィルターの小窓の、イベントのプロパティのタブ (PropertyFilters の source: event) は、この画面のパスが /events で終わらないので成り立たないように見えるが、分析リポジトリの決まりに従い、消さずに conditional のフレームにして note に理由を書いた。(d) BASE_PATH は、最初に API を呼ぶ useSubscription に 1 回だけ書いた。API_URL は /auth で始まる URL には効かないので、API_URL が効く最初のフック (useWebsiteValuesQuery) に 1 回だけ書いた。checkAuth の API キーの枝は、フレームにせず rules に 1 行書いた。GET /api/config (useConfig) はフレームにしていない。(e) getSessionReplays は、セッションの小窓からの呼び出しと同じ関数で読む表も同じなので、1 回だけ書いた。この画面からは sessionId を渡さず、minDuration (既定 5 秒) と検索語が効くので、その条件の列 (started_at / ended_at の having、distinct_id ほかの部分一致) を fields に足した。(f) リンク (links) は、アップグレードのボタンの別タブ (クラウドの請求の画面。out_of_scope) だけ。録画の行の再生のボタン、訪問者のアイコン、ReplayFilterButton の適用、小窓を閉じる操作は、どれも同じ画面の URL のクエリ (replay、session、minDuration、page) を書き換えるもので、ほかの入口への遷移ではない。(g) 見た目だけの部品 (ReplaysTable、SavedReplaysTable、ReplayFilterButton、SessionStats、SessionInfo、SessionReplaysTable、ReplayPlayer) はフレームにしていない。ReplayFilterButton は URL のクエリを書き換えるだけでデータを読まないので、ReplaysDataTable の summary とルールに書いた。(h) ブラウザの中の保存 (タブの localStorage など) は I/O に書いていない。(i) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 [レビュー] 指摘は 6 件 (medium 1、low 5) で、すべて直した: canUpdateWebsite の PERMISSIONS.websiteUpdate の確認を fact にした。getLinkedDistinctIds の呼び出し (セッションが見つかったとき) と share.findFirst の呼び出し (サイトが見つかったとき) を conditional にした。getSessionReplays に、PostgreSQL の event_data の読み取り、website_event の event_id (filter)、PostgreSQL の session_replay の visit_id の filter を足した。high が無いので、もう一度のレビューはしていない。録画の再生でブラウザが記録したサイトの画像を取りに行くか (レビューの notes の (7)) は、ライブラリの動きでリポジトリから読み切れず、ほかの入口の結果も書いていないので、書いていない。"
