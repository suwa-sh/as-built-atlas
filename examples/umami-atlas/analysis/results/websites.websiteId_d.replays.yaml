Table (66 行) → SessionModal (70 行) → ReplayModal (71 行)。その結果、parseRequest → checkAuth → getUser、canViewTeam → getTeamUser、fetchAccount は GET /api/auth/subscription の下。GET /api/auth/subscription はクラウドモードのときだけ呼ばれるが、コードの順でいちばん先に着くので、その下に書いた。呼び先がすべてほかの呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、いちばん早い呼び出しを、読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>)。書き直したフレームには、権限の確認・設定・ルールを繰り返していない。(3) 設定の置き場で迷った点: 決まりの「どの入口にも出る共通の段」の表は、API_URL と BASE_PATH を「最初に API を呼ぶフレームに 1 回だけ」と書き、「木の書き方」は、API_URL を書くのは API_URL が効く API (/auth/... 以外) を最初に呼ぶフレーム、と書く。この入口で最初に API を呼ぶのは useSubscription (GET /auth/subscription) で、この URL には API_URL が効かない (api-url.ts 6・39 行)。両方を満たすよう、BASE_PATH は useSubscription に、API_URL は /auth 以外を最初に呼ぶ useReplaysQuery に書いた (heatmaps の結果と同じ扱い)。(4) ReplaysPage は、クラウドモードで replays の機能が無いとき、WebsiteControls・タブ・小窓を描く前に返す。設定で打ち切るかが決まるので、その後ろの 4 つ (ReplaysDataTable、SavedReplaysDataTable、SessionModal、ReplayModal) を conditional にし、CLOUD_MODE を settings に書いた。links の embed には when が無いので、描かない条件は note に書いた。(5) タブ (Tabs / TabPanel) の中の ReplaysDataTable と SavedReplaysDataTable は、選んでいないタブの中身を描くかどうかが UI ライブラリの動きで、リポジトリからは読めないので、タブを条件に含めず note に書いた (タブは state と localStorage の umami.replays.tab で選ぶ)。(6) getSessionReplays は、セッションの小窓からの呼び出しと同じ関数で読む表も同じなので、1 回だけ書いた。この画面からは sessionId を渡さず、minDuration (既定 5 秒) と検索語が効くので、その条件の列を fields に足してある。(7) リンク (links) は、アップグレードのボタンの別タブ (クラウドの請求の画面) と、WebsiteControls の embed だけ。録画の行の再生のボタン、訪問者のアイコン、ReplayFilterButton の適用、小窓を閉じる操作は、どれも同じ画面の URL のクエリ (replay、session、minDuration、page) を書き換えるもので、ほかの入口への遷移ではない。(8) 見た目だけの部品 (ReplaysTable、SavedReplaysTable、ReplayFilterButton、SessionStats、SessionInfo、SessionReplaysTable、ReplayPlayer) はフレームにしていない。ReplayFilterButton は URL のクエリを書き換えるだけでデータを読まないので、ReplaysDataTable の summary とルールに書いた。(9) ブラウザの中の保存 (タブの localStorage など) は I/O に書いていない。録画の再生でブラウザが記録したサイトの画像を取りに行くかは、ライブラリの動きでリポジトリから読み切れず、ほかの入口の結果も書いていないので、書いていない。(10) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 (11) レビューへの対応 (1 回目。high 1 件): セッションの小窓の活動の行から開く EventData → useEventDataQuery