summary:
  status: interpretation
  value: "ボードに置く「売上のグラフ」の部品 (登録表の type: RevenueChart、コンポーネントは BoardRevenueChart)。描く側から受け取ったサイトと通貨 (渡されなければ、ブラウザに保存した通貨、設定 DEFAULT_CURRENCY、USD の順) について、描く画面の URL の期間と絞り込みで、売上の推移を GET /api/websites/[websiteId]/revenue/chart で読み、棒グラフ (RevenueChart) に描く。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection (セクションは revenue) でサイトを見てよいかを確かめる (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)。getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getRevenueChart で、絞り込みに当たるセッションを website_event から集め、そのセッションの、期間と通貨に当たる売上の行 (PostgreSQL は revenue、ClickHouse は website_revenue) を、イベント名と時間の単位ごとに足し合わせる。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。書き込みは無い。ほかの入口へのつながりは無い"
