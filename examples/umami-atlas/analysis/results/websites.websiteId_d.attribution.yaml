notes: '(1) 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、94 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。AttributionPage (attribution_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は AttributionPage.tsx:4 の import と :25 の描く行) を書いた。WebsiteControls のフレームと、その下の木 (WebsiteFilterButton → FilterEditForm → FieldFilters / SegmentFilters / PropertyFilters、WebsiteDateFilter、FilterBar → SegmentEditForm と、その先の受け口・問い合わせ) は外した。AttributionPage が WebsiteControls に渡す値 (websiteId だけ) は attribution_page の summary に書いた。(2) 外した木の下に書いていた共通の段 (parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment、GET values → getValues) は、入口からコードの順に深さ優先で辿り直すと、変換の段の入力欄 (AttributionPage.tsx:50 の WebsiteValueComboBox → useWebsiteValuesQuery) が最初に着くので、その下に移した。前の結果がこの入力欄の下に書いていた書き直しの段 (use_values_rw1 から q_check_auth_rw2) は、要らなくなったので消した。外した段を指していた文 (ほかの受け口の一覧、canUpdateWebsite・canViewSharedWebsite などの呼び出し元の一覧) は直した。段の数は 94 から 44 になった。(3) 決まりにそろえた所: (a) checkAuth の CLOUD_MODE (settings) と API キーの枝の 1 行 (rules) は、前から書いてあるので、そのまま。(b) canViewWebsite の guards に、関数の中の管理者の確認を、別の 1 件 (kind: role、value: user.isAdmin) として足した。canViewWebsiteSection は、ほかの入口の結果と同じく kind: other のまま。(c) API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_values) に 1 回だけ書いた (前の結果も use_values にだけ書いていたが、use_values の位置が WebsiteControls の下から入力欄の下に移った)。(d) 結果の target は、作業定義と同じに書いた (clone_path も写した)。(4) 固定の値で閉じている呼び出し (指示書 0.4.1): WebsiteValueComboBox の 2 つ目の useWebsiteValuesQuery (additionalQuery) は、AttributionPage が additionalType を渡さないので既定の空文字になり (WebsiteValueComboBox.tsx:26)、enabled (useWebsiteValuesQuery.ts:60) が偽で API を呼ばない。呼ぶ関数は 1 つ目と同じなので、もとからフレームは 1 つで、閉じていることを website_value_combobox の summary に書いた。(5) 状態で決まるので閉じた扱いにしなかったもの: GET values の segment / cohort の枝 (getWebsiteSegments。route.ts:48) は、この画面の type が AttributionPage の状態 (path か event) なので届かないように見えるが、状態で決まる値なので、決まり (analysis-conventions.md の「この画面からは条件が成り立たないように見える呼び出しも、省かずに conditional のフレームにする」) に従い、conditional のフレームとして足した (前の結果は、受け口の summary に書くだけで、フレームにしていなかった)。段と読み書きの綴りは、part_p.shared_a.WebsiteControls の同じ段に合わせた。同じ理由で、getQueryFilters と getValues は always のまま (この画面からは、いつもその枝を通る。理由は call の note)。useWebsiteValuesQuery の国・地域の名前の置き換えのルールも、この画面では入らないように見えるが、状態で決まるので消さずに残し、note に書いた。(6) 迷った点と選んだ扱い (前の結果から引き継いだもの): (a) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query) は、呼び出し元ごとに読む表が違うので、呼び出し元ごとに書いた。(b) 画面から受け口への呼び出しは、URL の形がコードから読め、当たる route が 1 つに決まるので fact にした。(c) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。ClickHouse の model と集計の問い合わせは select * で website_event を読むので、fields に * を書いた。(d) 表の割合 (percentFilter) は画面での表示の計算なので、rules に書いていない。(e) 期間の localStorage など、ブラウザの中の保存は I/O に書いていない。(f) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(7) links は embed の 1 件だけ。この画面に、ほかの画面への遷移は無い。(8) レビューへの対応 (1 回。high 0 件、medium 0 件、low 4 件。すべて直した): getAttribution の event_data の読み取り (PostgreSQL・ClickHouse) に、この画面からは届かないように見える理由 (useFilterParameters が /events で終わらないパスでは epf を送らない) を note に書き、summary の「プロパティ」をセッションのプロパティに絞った。getValues の website_event の fields に url_path と event_name を足した (この画面の type は path か event)。getValues の session の読み取りと、リファラーの条件・ルールに、この画面では使わないように見える理由を note に書いた。getWebsiteSegment の call に、GET values からは届かず、GET attribution からの getQueryFilters で届く理由を note に書いた。high が無いので、もう一度のレビューはしていない'
