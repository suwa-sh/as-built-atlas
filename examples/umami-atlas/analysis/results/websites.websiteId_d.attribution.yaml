summary:
  status: interpretation
  value: 1 つのサイトの流入元の分析 (アトリビューション) の画面。上の絞り込みと期間の操作 (WebsiteControls) は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。利用者がモデル (first-click / last-click)、種類 (表示したページ path / 起きたイベント event)、変換の段 (step) を選ぶと、Attribution が GET /api/websites/<id>/attribution を呼び、getAttribution が website_event から、変換の段に至ったセッションの流入元 (リファラー、有料広告のクリック ID、UTM の 5 つ) ごとのセッション数と、変換の段の合計 (件数・訪問者・訪問) を数える。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。変換の段の入力欄は、GET …/values で url_path か event_name の値の候補を読む。変換の段を選ぶまでは集計を呼ばない。どの受け口も parseRequest → checkAuth で認証する (user を読む。Redis が有効なら auth:* も読む)。権限の確認では website / share / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、Redis が有効なら website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。URL に segment か cohort があれば、保存した定義 (segment) を読む。利用者の操作による書き込みは無い。ほかの画面への遷移も無い
