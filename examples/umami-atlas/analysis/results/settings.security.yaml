summary:
  status: interpretation
  value: "ログイン中のユーザーが、自分の 2 段階認証を有効にする・無効にする画面。表示時に GET /api/2fa/status を呼ぶ。受け口は、ログイン中のユーザーを確かめ (user。Redis が有効でトークンが authKey を持つときは auth:* のセッションも読む)、自分の two_factor_auth と、app_setting の twoFactorRequiredGlobal を読み、暗号鍵 (TWO_FACTOR_ENCRYPTION_KEY) が設定済みで全員への必須が無効なら、user の必須の印、所属チーム (team_user)、必須の印を持つチーム (team) も順に読む。画面は、返った isEnabled / isRequired / isConfigured を使う。暗号鍵が未設定なら、説明の代わりにエラーの文言を出し、スイッチを出さない。設定済みなら、スイッチを出す (有効で必須のときは、スイッチを操作できない)。スイッチを入れると、設定の小窓を開く。小窓は開いた時点で POST /api/2fa/setup/initiate を呼び (two_factor_auth を無効のまま作成または更新)、6 桁のコードで POST /api/2fa/setup/confirm を呼ぶ (試行回数の制限 two_factor_rate_limit、使い回しの確認 two_factor_otp_used を経て、two_factor_auth を有効にし、two_factor_backup_code を作り直す)。取り消すと POST /api/2fa/setup/cancel で、設定待ちの two_factor_auth を消す。スイッチを切ると、無効にする小窓を開き、パスワードと 6 桁のコードで POST /api/2fa/disable を呼ぶ (必須かどうかを app_setting / user / team_user / team で確かめ、必須なら断る。パスワード、試行回数の制限、使い回し、コードを確かめて、two_factor_auth と two_factor_backup_code を消す)。終わると状態を読み直す。ほかの入口へのつながり (遷移) は無い"
  evidence:
    - { file: "src/app/(main)/settings/security/page.tsx", line: 5 }
    - { file: "src/app/(main)/settings/security/UserSecurityPage.tsx", line: 15 }
    - { file: "src/app/(main)/settings/security/UserSecurityPage.tsx", line: 23 }
