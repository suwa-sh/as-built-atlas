    - { file: src/components/modals/TwoFactorDisableModal.tsx, line: 27 }
    - { file: src/app/api/2fa/status/route.ts, line: 25 }
    - { file: src/app/api/2fa/disable/route.ts, line: 59 }
notes: "(1) 祖先の枠 (ルート、(main)、settings の layout) は別の入口なので辿っていない。(main) の枠も、2 段階認証が必須で未設定のときに同じ TwoFactorSetupModal を required={true} で描くが、この画面は自分でも required={false} で描くので、context.md の決まり (画面も同じ部品を描くなら、画面の側にも書く) に従って、この画面の側にも書いた。required={false} なので、取り消しのボタンが出て、POST /api/2fa/setup/cancel にも届く (枠の結果は、cancel に届かないとしている)。(2) 同じ処理の置き場は、入口から辿る順 (コードに書いてある順の深さ優先) で決めた。parseRequest → checkAuth → getUser と Redis の読み取りは、最初に着く GET /api/2fa/status の下に 1 回だけ書いた。checkRateLimit / isOtpReplayed / recordFailedAttempt / markOtpUsed / resetRateLimit は、POST /api/2fa/setup/confirm の下に 1 回だけ書いた。ほかの受け口 (initiate / cancel / disable) の側は、summary で触れるだけにした。どの受け口も、自分で Prisma を呼ぶ行を持つので、終端の決まりは、それぞれの external の段で満たす。(3) POST /api/2fa/disable の、app_setting / user / team_user / team の読み取りは、GET /api/2fa/status と同じテーブルだが、別のファイルの別の行の呼び出しなので、同じ処理としてまとめずに、disable の受け口の読み書きとして書いた。(4) CLOUD_MODE と暗号鍵 (TWO_FACTOR_ENCRYPTION_KEY) で打ち切る経路の後ろの呼び出しは、決まりのとおり conditional にした。ただし、この画面から呼ぶときは、条件はいつも成り立つと読める。settings の枠 (別の入口) は CLOUD_MODE があると包まれる画面を描かない (settings/layout.tsx:5) し、スイッチは GET /api/2fa/status が isConfigured: true を返したとき (CLOUD_MODE が無く、暗号鍵が設定済みのとき) だけ出るため。そのことを、各呼び出しの note に書いた。(main) の枠の結果は、同じ受け口の呼び出しを always (note で理由) にしているので、書き方が違う。(5) 受け口の CLOUD_MODE (404) と暗号鍵 (503) の settings は、この画面からは届かない枝だが、admin.security の書き方にそろえて、受け口ごとに書き、note に添えた。(6) フレームにしなかったもの: PageHeader / Panel / Badge / Switch / Tooltip / OtpInput / ControlledDialog (見た目と入力の部品)、TwoFactorSuccessModal (バックアップコードを出すだけで API を呼ばない)、useMessages (翻訳)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)、parseShareToken (ヘッダーのトークンを解くだけ)、checkPassword (bcrypt の照合)、verifyTotp (otplib)、generateTotpSecret / generateOtpAuthUri / generateQrCodeDataUrl (otplib と qrcode)、encryptSecret / decryptSecret (node の crypto)、generateBackupCodes (乱数と bcrypt)。どれもデータの読み書きに至らない。(7) checkAuth の API キーの枝 (auth.ts:74) は、同じファイルの関数なので q_check_auth に含めた。/api/2fa は API キーを受け付けないパス (api-key.ts:14) で、getApiKeyByHash より前に null を返すので、api_key の読み書きは書いていない。(8) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(9) レビューの指摘 1 件 (low。状態の問い合わせのフックの summary の根拠に refetchOnReconnect の行が無い) は、根拠の行を足して直した"
