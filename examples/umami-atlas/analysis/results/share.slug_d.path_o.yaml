notes: "(1) 入口は page のフレーム 1 つ。包む枠 (ルートの layout と、共有の layout の ShareProvider。共有のデータを GET /api/share/[slug] で読み、共有トークンを store に入れる処理) は、枠の入口 layout_l と layout_l.share.slug_d の結果にあるので、辿っていない。この画面は、枠が入れた ShareContext を useShare で読むだけ。(2) いちばん大きな選択: SharePage が描く 17 の画面 (BoardViewPage、PixelPage、LinkPage と、PAGE_COMPONENTS のサイトの節の画面 WebsitePage / EventsPage / SessionsPage / RealtimePage / PerformancePage / ComparePage / BreakdownPage / GoalsPage / FunnelsPage / JourneysPage / RetentionPage / UTMPage / RevenuePage / AttributionPage) は、どれも既にある画面の入口の page ファイルがそのまま描く本体と同じなので、context.md の「既にある入口と同じ部品」に従い、フレームにせず、選ぶフレーム share_page の links に embed で書いた (前の結果は、17 のフレームを unknown / not_analyzed で止めていた)。行き先の id は analysis/entry-list.yaml で確かめた (17 件とも approved)。PAGE_COMPONENTS は URL の段で引く表で、登録表には当たらないが、この決まりは URL の段で引く表にも当てはまる。(3) embed の target: PAGE_COMPONENTS の画面は表のキー。キー '' と overview と、当たらないときの既定 (|| WebsitePage) は、どれも WebsitePage なので、部品のキーの決まり (空のキーは、同じ部品を指す別のキーがあれば足さない) にならって overview の 1 件にし、note に書いた。board / pixel / link の画面は表のキーが無いので、選ぶ値をコードのとおり ENTITY_TYPE.board / ENTITY_TYPE.pixel / ENTITY_TYPE.link と書いた (迷った点。コンポーネントの名前で書く案もある)。(4) 描く側で前提が違うこと (share_page の summary にも書いた): (a) BoardViewPage に showActions={false} を渡すので、boards.boardId_d にある design / edit へのリンクと BoardCloneButton (複製の書き込み) が出ない。(b) PixelPage / LinkPage に showHeaderActions={false} を渡すので、見出しの操作 (PixelHeaderActions / LinkHeaderActions) が出ない。(c) pixels.pixelId_d / links.linkId_d の page ファイルは、サーバー側で getPixel / getLink を呼んで削除済みを確かめてから描くが、共有の画面はそれを通らずにコンポーネントを直接描く。(d) API は共有トークンで呼び、受け口の確認は共有の経路 (canViewSharedWebsite / canViewWebsiteSection など) を通る。これらの違いは、行き先の入口の結果には出ないので、集計で embed の先を足し合わせると、共有の画面では出ない書き込みも含まれる。(5) 固定の値で閉じている呼び出し (skill 0.4.1。この木の中で 3 件、辿らなかった): (a) WebsiteHeader の編集の LinkButton (/websites/${website.id}/settings へ移す) は showActions が true のときだけ描くが、SharePage.tsx:136 が showActions={false} を渡す。(b) WebsiteHeader の見出しのリンク (titleHref の /websites/${website.id}) は allowLink が true のときだけだが、同じ行で allowLink={false} を渡す。(c) ActiveUsers の訪問者数のリンク (/websites/${websiteId}/realtime) は allowLink が true のときだけだが、WebsiteHeader.tsx:34 が、SharePage.tsx:136 で受けた allowLink={false} をそのまま渡す。どちらのフレームも、この木の中の呼び出し元は 1 つだけ。フレームに notes が無いので、analysis-conventions.md の決まりどおり、条件を持つフレーム (website_header、active_users) の summary とここに書いた。BoardViewPage などの中の閉じた呼び出し (4 の a と b) は、この木の中にフレームが無いので、数えていない。(6) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。board / pixel / link の画面 (SharePage.tsx:93-97) はフレームにしないので、parseRequest → checkAuth → getUser、canViewSharedWebsite → canViewWebsite → getEntity → getWebsite / getLink / getPixel / getBoard、getTeamUser は、WebsiteProvider → GET /api/websites/[websiteId] の下に書いた。getWebsite は、route.ts:34 より先に canViewWebsite の getEntity (entity.ts:6) で着くので、その下に書いた。ShareBranding は ShareFooter (SharePage.tsx:110) の下が先。ShareNav は SharePage.tsx:126 (メニューのボタンの中) と :131 で描くが、先の 126 の下に 1 回だけ書いた。(7) 終端を満たすための書き直し: canViewWebsiteSection の下に canViewWebsite → getEntity → getWebsite (q_*_rw)。読み書きを持つ最初の段まで書き、確認・設定・ルールは繰り返していない。前の結果が ShareNav の下にもう一度書いていた ShareBranding は、ShareNav が業務のルールを持ち、終端の決まりを満たすので、レビューの指摘 (low) に従って外した。(8) フレームにしなかったもの: useShare (context を読むだけ)、useTheme / getShareTheme (色の設定だけ)、MobileMenuButton / PageBody / Grid / Column / Row (見た目だけ)、LanguageButton (翻訳の JSON は同じサーバーの静的なファイルなので、決まりどおり書かない) と PreferencesButton (TimezoneSetting / DateRangeSetting。ブラウザの中の保存だけ)、ThemeButton、useApi (URL とヘッダーを組み立てるだけ)、useConfig と GET /api/config (決まりどおりフレームにしない。Favicon の summary で触れ、得る設定は Favicon の settings に書いた)、useMessages、useNavigation、buildPath。(9) ブラウザの中の保存 (localStorage の share:navCollapsed、言語・タイムゾーン・既定の期間) は、決まりどおり I/O に書いていない。(10) ShareBranding のロゴの画像 (white label の logoUrl) は、ブラウザが他社のサービスから画像を読む処理として external_api の読み書きにしたが、URL が Redis に保存された値で決まるので unknown (dynamic_dispatch) にした。ロゴ全体の外部リンク (white label の domainName、既定は https://umami.is) は、利用者が押したときの外部サイトへの移動で、入口でも読み書きでもないので書いていない。(11) 権限の確認: SharePage の isAllowed (URL の節が空か、parameters で true) は、満たさなければ描かずに先頭へ移すので、guards (other) に書いた。ShareNav の節の絞り込みは、メニューに出す項目を決めるだけなので rules に書いた。canViewWebsite の中の getEntity は、この入口では websiteId が共有トークンに含まれるので届かないように見えるが、条件が固定の値ではなく共有のデータで決まるので、決まりどおり消さずに conditional で書いた。(12) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は、analysis-conventions.md の決まりどおりフレームにしていない。CLOUD_MODE の設定だけ q_check_auth に書いた。(13) API_URL と BASE_PATH は、analysis-conventions.md の決まりどおり、この入口で最初に /api/... を呼ぶフレーム use_website_query に 1 回だけ書いた (前の結果は use_active_users にも書いていたので外した)。DATABASE_URL は、決まりどおり書いていない。(14) 名前と値の綴りは、layout_l.main_g.websites.websiteId_d、layout_l.share.slug_d、boards.boardId_d の結果に合わせた (guards の canViewSharedWebsite / canViewWebsite / canViewWebsiteSection / user.isAdmin、settings の API_URL / BASE_PATH / CLOUD_MODE / REDIS_URL / CLICKHOUSE_URL / DATABASE_REPLICA_URL / PRIVATE_MODE / FAVICON_URL、links の /share/${slug}/<節>、embed の書き方)。"
