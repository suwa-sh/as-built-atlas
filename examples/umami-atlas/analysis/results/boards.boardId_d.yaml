summary:
  status: interpretation
  value: 1 つのボードを表示する画面。URL の boardId で GET /api/boards/[boardId] を呼んで board を読み (boardId が create なら /boards へ転送)、見出し・期間と絞り込みの操作・行と列に並んだ部品を描く。見出しは、ボードの対象 (サイト・ピクセル・リンク) の名前を GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId] で読み、組み立ての画面と設定の画面へのリンクと、複製のボタンを出す。複製は POST /api/boards/[boardId]/clone で、権限 (canUpdateBoard、canCreateTeamWebsite、PERMISSIONS.websiteCreate) と、参照するサイト・ピクセル・リンク・保存済みのレポートを確かめてから board を作る。期間と絞り込みの操作は、ボードの対象 (無ければ最初の部品の対象) について、サイトの画面と同じ部品 (values / segments / session-data / daterange の API、セグメントの保存) を描く。列ごとに、部品の対象がまだ読めるかを確かめてから、データベースに保存されたボードの parameters の部品の type で、登録表 (boardComponentRegistry) から部品を引いて描く。部品 16 種類は、それぞれ別の入口として分析するので、この画面では登録表を引く所で止めて、部品へのつながり (embed) だけを書いた。ボードを見る権限は canViewBoard。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
