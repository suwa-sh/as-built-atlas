summary:
  status: interpretation
  value: 1 つのボードを表示する画面。URL の boardId で GET /api/boards/[boardId] を呼んで board を読み (boardId が create なら /boards へ転送)、見出し・期間と絞り込みの操作・行と列に並んだ部品を描く。見出しは、ボードの対象 (サイト・ピクセル・リンク) の名前を GET /api/websites/[websiteId]・/api/pixels/[pixelId]・/api/links/[linkId] で読み、組み立ての画面と設定の画面へのリンクと、複製のボタンを出す。複製は POST /api/boards/[boardId]/clone で、権限 (canUpdateBoard、canCreateTeamWebsite、PERMISSIONS.websiteCreate) と、参照するサイト・ピクセル・リンク・保存済みのレポートを確かめてから board を作る。期間と絞り込みの操作は、ボードの対象 (無ければ最初の部品の対象) について、サイトの画面と同じ部品 (values / segments / session-data / daterange の API、セグメントの保存) を描く。部品は、データベースに保存されたボードの parameters の type で決まり、登録表の 17 種類 (指標の帯、イベントの帯、ゴール、ファネル、訪問者のグラフ、UTM、リアルタイムの帯・グラフ・オンライン数、売上の帯・グラフ・内訳、指標の表、世界地図、曜日と時間帯、イベントのグラフ、文字) のどれか。文字以外は、対象の id で集計の API (stats、events/stats、goals/[goalId]・stats、funnels/[funnelId]・stats、pageviews、utm/metrics、realtime、active、revenue/stats・chart・metrics、metrics、sessions/weekly、events/series) を呼び、website_event (ClickHouse では集計表も)・session・revenue (ClickHouse では website_revenue)・report などを読む。権限は各 API が確かめる (ボードを見るのは canViewBoard、部品のデータは canViewWebsiteSection → canViewWebsite)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)
