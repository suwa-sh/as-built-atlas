notes: '指示書 0.4.1 とプロファイル 0.4.0 で分析した (入口の一覧に、登録表 boardComponentRegistry の部品 16 件が part の入口として入ったため、分析し直した)。(1) 画面を包む枠 ((main) の layout と、そこから描かれる App / TopNav など) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) どの部品を描くかは、データベースに保存されたボードの parameters (行と列と部品の type) で決まる。プロファイルの「登録表から選ばれて描かれる部品」のとおり、登録表を引くフレーム BoardComponentRenderer で止め、部品 16 件を links の embed (target は登録表のキー、entry_id は part_p.boardComponentRegistry.<キー>、状態は interpretation、根拠は登録表を引く行と、部品を描く行と、登録表の項目の行) で書いた。部品の中 (集計の API、問い合わせ、注釈、ゴールやファネルの定義の編集のボタン) は、部品の入口で分析する。Metrics bar の、対象の種類ごとの部品 (PixelMetricsBar / LinkMetricsBar) を選ぶ判定は、プロファイルのとおり BoardComponentRenderer の rules に書いた。TextBlock は文字を出すだけで入口ではないので、summary に名前を書いただけ。前の結果では部品の中だけで使っていた設定 (DEFAULT_CURRENCY など) とルールは、部品の入口の側に移るので、この結果からは消えた。(3) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。BoardViewPage.tsx では BoardProvider (21 行目) が見出し (24 行目)・操作 (25 行目)・本体 (26 行目) より前なので、認証の経路 (parseRequest → checkAuth → getUser) と getBoard / getTeamUser は GET /api/boards/[boardId] の下、canViewWebsite → getEntity は見出しの useWebsiteQuery から GET /api/websites/[websiteId] の下、canViewWebsiteSection と getQueryFilters は操作 (PixelControls) の GET /api/websites/[websiteId]/values の下、getReport は複製の stripInvalidBoardReports の下になった。BoardControls は、コードの順で PixelControls (22 行目)、LinkControls (24 行目)、WebsiteControls (26 行目)。部品を外しても、部品は本体の最後 (BoardViewColumn の最後の呼び出し) にあったので、ほかのフレームの置き場は動かなかった (部品の木から先に着いていた処理は無かった)。(4) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。このリポジトリの決まりで、external の段までは書かず、確認・設定・ルールも繰り返していない)。(5) 固定の値で閉じている呼び出し (指示書 0.4.1) は 3 種類、6 か所。(a) getAllUserWebsitesIncludingTeamAccess: この入口で WebsiteSelect を描くのは BoardCloneForm だけで、includeTeams を渡さない (BoardCloneForm.tsx:130-134)。値が undefined の引数は URL に付かない (src/lib/url.ts:5) ので、GET /api/users/[userId]/websites (route.ts:29) と GET /api/me/websites (route.ts:22) の includeTeams の枝は、この入口では決して動かない。前の結果にあったフレーム q_get_all_user_websites を消した。(b) POST /api/websites/[websiteId]/segments/[segmentId] (セグメントの更新): SegmentEditForm を描くのは FilterBar だけで、segmentId を渡さない (FilterBar.tsx:195-200)。前の結果もフレームにしていなかった。(c) ExportButton の GET /api/websites/[websiteId]/export (データの書き出し): BoardControls は PixelControls / LinkControls / WebsiteControls に allowDownload を渡さず (BoardControls.tsx:22、24、26)、既定値は false なので、3 つとも ExportButton を描かない。前の結果もフレームにしていなかった。閉じている呼び出しの名前・値・行は、条件を持つフレーム (2 つの受け口、SegmentEditForm、3 つの操作の部品) の summary に書いた (指示書は「条件を持つフレームの notes に書く」と言うが、フレームの形式に notes が無いので、summary に書いた)。状態・保存されたデータ・URL で決まる条件 (POST /api/auth/verify の enabled: !user、GET /api/me/websites の userId の有無、イベントのプロパティのタブのパスの条件) は、固定の値ではないので、conditional で書き、成り立たないように見える理由を note に書いた。イベントのプロパティの絞り込み (PropertyFilters の source: event と、その先の event-data/fields・event-data/values) は、前の結果ではフレームにしていなかったが、このリポジトリの決まり (成り立たないように見える呼び出しも省かずに conditional で書く) に合わせて足した (フレームと綴りは websites.websiteId_d.events の結果から写した)。PixelControls が WebsiteDateFilter に渡す showAllTime={false}、WebsiteFilterButton の allowBounceFilter の既定値 false は、見た目の切り替えだけで、データに届く呼び出しを決めないので、数えていない。(11) レビューの指摘は low 2 件で、どちらも直した (ExportButton の閉じている呼び出しを (5) と操作の部品の summary に書いた。フィルターのボタンの summary の「直帰を除く」のチェックを、この画面では出ないように見える、に直した)。BoardProvider の保存の mutation (POST /boards/<id>) と saveBoard は、この画面からはどこからも呼ばれない (呼ぶのはボードを組み立てる画面の BoardEditHeader だけ) ので、フレームにせず summary に書いた。(6) 同じコードを通るほかの入口の結果 (boards.boardId_d.edit、boards、websites.websiteId_d、pixels.pixelId_d、links.linkId_d、console.websiteId_d、layout_l.main_g.websites.websiteId_d) のフレームと同じ綴りと書き方にした。(7) checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(8) 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth と /config 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にした。API_URL と BASE_PATH は、このリポジトリの決まり (analysis-conventions.md) のとおり、最初に API を呼ぶフレーム use_board_query にだけ書いた。GET /api/config (useConfig) は、決まりのとおりフレームにしていない。(9) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前だけ (canViewBoard など) と、権限の定数の名前だけ (PERMISSIONS.websiteCreate など) を書いた。複製の canCreateWebsite は、データを読まないので段にせず、権限の確認を POST /api/boards/[boardId]/clone の段に書いた (boards の結果と同じ扱い)。(10) テストとの対応は、作業定義で選ばれていないので分析していない。'
