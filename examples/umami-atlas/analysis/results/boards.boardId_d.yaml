notes: '指示書 0.4.0 とプロファイル 0.4.0 で分析した。(1) 画面を包む枠 ((main) の layout と、そこから描かれる App / TopNav など) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) どの部品を描くかは、データベースに保存されたボードの parameters (行と列と部品の type) で決まる。候補は登録表 (boardComponentRegistry.tsx) の 17 種類に限られ、全部読めるので、プロファイルの決まりのとおり、それぞれをフレームにし、BoardComponentRenderer からの call を interpretation + conditional にした (並びは登録表の順)。TextBlock は文字を出すだけでデータを読まないので、フレームにせず、BoardComponentRenderer の summary に書いた。(3) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。BoardViewPage.tsx では BoardProvider (21 行目) が見出し (24 行目)・操作 (25 行目)・本体 (26 行目) より前なので、認証の経路 (parseRequest → checkAuth → getUser) と getBoard / getTeamUser は GET /api/boards/[boardId] の下、canViewWebsite → getEntity は見出しの useWebsiteQuery から GET /api/websites/[websiteId] の下、canViewWebsiteSection と getQueryFilters は操作 (PixelControls) の GET /api/websites/[websiteId]/values の下、getReport は複製の stripInvalidBoardReports の下になった。BoardControls は、コードの順で PixelControls (22 行目)、LinkControls (24 行目)、WebsiteControls (26 行目)。(4) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。このリポジトリの決まりで、external の段までは書かず、確認・設定・ルールも繰り返していない)。(5) この画面からは条件が成り立たないように見える呼び出しも、指示書のとおり、消さずに conditional で書き、そう見える理由を note に書いた: WebsiteChart の注釈の GET /api/websites/[websiteId]/annotations (ボードの部品は showAnnotations を渡さない)、Goal / Funnel の SavedDefinitionEditButton (allowEdit={false})、WebsiteSelect の POST /api/auth/verify と GET /api/me/websites と getAllUserWebsitesIncludingTeamAccess。SavedDefinitionEditButton の先 (削除の API と編集のフォーム) は、描かれないように見えるので辿らず、unknown (not_analyzed) で止めた (ファネルの経路は websites.websiteId_d.funnels の結果にある)。BoardProvider の保存の mutation (POST /boards/<id>) と saveBoard は、この画面からはどこからも呼ばれない (呼ぶのはボードを組み立てる画面の BoardEditHeader だけ) ので、フレームにせず summary に書いた。(6) 同じコードを通るほかの入口の結果 (boards.boardId_d.edit、boards、websites.websiteId_d、websites.websiteId_d.funnels、pixels.pixelId_d、links.linkId_d、console.websiteId_d、layout_l.main_g.websites.websiteId_d) のフレームを、同じ綴りと同じ書き方になるように写し、この入口に合わせて呼び出し元・条件・説明を直した。直した主なもの: 選択欄の一覧の API の条件 (BoardCloneForm は、URL ではなく元のボードの teamId を渡す)、絞り込みの部品の websiteId (BoardControls が渡す対象の id)、WebsiteChart (注釈と比較を読まない)、MetricsTable (showMore を出さない。部品の設定で type を選べるので、getEventMetrics を足し、getSessionMetrics と getPageviewMetrics の fields に screen / language / page_title / utm_* などを足した)、ファネルの定義の GET (reportId があるときだけ)。(7) 新しく読んだもの: 複製 (POST /api/boards/[boardId]/clone と stripInvalidBoardReports)、イベントの帯 (events/stats と getWebsiteEventStats)、ゴール (goals/[goalId] と goals/[goalId]/stats と getGoal)、UTM (utm/metrics と getUTM)、リアルタイム (realtime と getRealtimeData / getRealtimeActivity)、売上 (revenue/stats・chart・metrics と getRevenueStats / getRevenueChart / getRevenueMetrics)、getEventMetrics。URL の絞り込みのプロパティで足される event_data / session_data の読み取りは、ほかの結果と同じく、共通の parseFilters の行を根拠にして各問い合わせに書いた。(8) 部品の対象がピクセルやリンクのときも、指標の帯以外の部品は、対象の id を websiteId としてサイトの API に渡す (BoardComponentRenderer.tsx:40)。サイトの API の権限の確認は canViewWebsite → getEntity が pixel / link も引くので通る。この扱いは summary に書いただけで、別の経路としては書いていない。(9) checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(10) 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth と /config 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にした。API_URL と BASE_PATH は、このリポジトリの決まり (analysis-conventions.md) のとおり、最初に API を呼ぶフレーム use_board_query にだけ書いた。GET /api/config (useConfig) は、枠が読み込み済みで、認証を通らず環境変数を返すだけの受け口なので、boards.boardId_d.edit と同じくフレームにしていない。売上の部品の通貨を決める DEFAULT_CURRENCY は、next.config.ts が defaultCurrency に写しているので、その行も根拠にした。ブラウザに保存した通貨 (localStorage) は、決まりのとおり I/O に書かず summary に書いた。(11) 権限の確認の value は、このリポジトリの決まりのとおり、確認する関数の名前だけ (canViewBoard など) と、権限の定数の名前だけ (PERMISSIONS.websiteCreate など) を書いた。複製の canCreateWebsite は、データを読まないので段にせず、権限の確認を POST /api/boards/[boardId]/clone の段に書いた (boards の結果と同じ扱い)。(12) テストとの対応は、作業定義で選ばれていないので分析していない。(13) レビューの指摘は medium 2 件と low 14 件で、すべて直した (複製の board の作成の根拠と note、権限の確認の 401 の根拠、canViewReport の区画の補足、リアルタイムの絞り込みの note、WebsiteControls からの呼び出しを always に、WebsiteChart の注釈のルールの note、API_URL と BASE_PATH を 1 か所に、DATABASE_REPLICA_URL の置き場、getGoal / getUTM / getEventMetrics の fields の条件の列、getWebsiteEventStats の集計表の数え方、売上の website_event の created_at、指標の表の hostname を集計の列に、metrics の振り分けのルールを fact に)。'
