summary:
  status: interpretation
  value: "1 つのサイトのリテンション (再訪) の画面。選んだ期間の開始日を含む月 (初日から末日) について、Retention が GET /api/websites/<id>/retention を呼び、getRetention が website_event から、セッションごとの最初の日 (コホート) と、その後にイベントを持つ日の差を求め、コホートの日ごとの訪問者数と、1 から 7・14・21・28 日目の再訪の割合を表に出す。PostgreSQL と ClickHouse のどちらで読むかは、設定 (CLICKHOUSE_URL) で切り替わる。受け口は parseRequest → checkAuth で認証し (user を読む。Redis が有効なら auth:* も読む)、canViewWebsiteSection → canViewWebsite で閲覧の権限を確かめる (website / link / pixel / board / team_user を読む)。getQueryFilters は、サイトの情報を読んで期間の開始を直し (Redis が有効なら website:* にキャッシュする)、URL に segment / cohort があれば保存した定義 (segment) を読んで絞り込みに足す。この画面は書き込みをしない。上部の WebsiteControls は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。この画面は、期間の選択を出さず、月の選択を出すように渡す"
