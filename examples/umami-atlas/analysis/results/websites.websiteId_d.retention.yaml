notes: "[分析し直し (skill 0.4.1)] 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (skill 0.4.0、93 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。段は 93 から 35 になった。(a) RetentionPage (retention_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は RetentionPage.tsx 4 行の import と 18 行の描く行) を書いた。WebsiteControls と、その下の絞り込みのボタン・絞り込みの帯・期間の選択・書き出し (と、その下の values / segments / session-data / event-data の受け口と問い合わせ、segment の作成) の 58 段を外した。渡す値 (allowDateFilter={false}・allowMonthFilter。ほかは渡さない) と、それで部品が出すもの・出さないものは、retention_page の summary に書いた。前の結果の WebsiteControls の rules (共有の設定で絞り込みを出さない) は、部品の入口のものなので、ここからは外した。(b) 共通の段の移し先: 前は WebsiteControls の下 (絞り込みのボタン → values の受け口) にあった parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment を、入口から深さ優先で次に着く retention の受け口 (api_retention) の下に移した。retention の受け口の summary から「経路はフレーム … と同じ」の文を外し、移した段の summary・note・根拠を、この受け口に合わせて直した (canViewWebsiteSection のセクションは retention、getQueryFilters の呼び出しは route.ts 15 行)。(c) 共通の段を、決まりに合わせた: API_URL と BASE_PATH は、この入口で最初に API を呼ぶ use_retention_query に 1 回だけ書いた (前は use_values)。canViewWebsite の guards を、持ち主の確認 (ownership、canViewWebsite) と、管理者の確認 (role、user.isAdmin) の別の 1 件に分けた (前は ownership の note に書くだけだった)。共有トークンで許す枝は、websites.websiteId_d.cohorts と同じく kind: other で書いた。checkAuth は、前から settings に CLOUD_MODE と REDIS_URL、rules に API キーの枝の 1 行を持ち、getUser も書いてある (変えていない)。canViewWebsiteSection は、ほかの入口と同じく kind: other のまま。target は作業定義と同じ。(d) 固定の値で閉じている呼び出し (指示書 0.4.1) は、この木には無い。getWebsiteSegment は、retention の受け口では、URL の segment / cohort が useFilterParameters (35・36 行) でクエリに付き、受け口のスキーマ (filterParams の segment / cohort、schema.ts 66・67 行) も残すので、閉じておらず、conditional のまま (前は values の受け口の下で、届かないように見えると note に書いていた)。[前の分析から引き継いだ扱い] (1) Retention は startDate / endDate (月の初日と末日) を useRetentionQuery に渡し、useAnalyticsQuery の serializeAnalyticsQuery がそれを startAt / endAt に直して、useDateParameters の期間を上書きする。だから API に送る期間は月単位で、この計算を RetentionPage の rules に書いた。(2) 表の列 (1 から 7・14・21・28 日目) と、月の末日より先の列を空にすることは、表示の計算なので rules に書かず、Retention の summary に書いた。コホートの決め方・再訪の割合・31 日までに限ることは、問い合わせの中の計算なので getRetention の rules に書いた。(3) イベントのプロパティの絞り込み (epf) は、useFilterParameters がパスが /events で終わる画面でだけ付けるので、この画面からは届かないように見えるが、条件が画面のパス (URL) で決まり、木の中の固定の値ではないので、閉じた呼び出しにはしない。受け口と問い合わせの関数は扱えるので、event_data の読み取りを interpretation で書き、note に理由を書いた。(4) 生の SQL のうち、parseFilters が実行時に組み立てる条件の列は fields に書かず、note に書いた。URL の絞り込みは cohort_items だけに効き、user_activities には効かない (summary に書いた)。(5) ライブラリを呼ぶ同じ行 (redis.ts 37 行の get) は、呼び出し元ごとに読むキーが違うので、呼び出し元ごとに書いた。(6) 期間の localStorage など、ブラウザの中の保存は I/O に書いていない。(7) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。[レビュー] 1 回 (high 0、medium 0、low 1)。直した: retention の受け口の rules に、segment / cohort が UUID の形でない、match が all / any でないときも 400 を返す検査を足した (low)。high が無いので、もう一度のレビューはしていない。"
