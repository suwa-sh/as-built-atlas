summary:
  status: "interpretation"
  value: "計測を試すための画面 (Test console)。環境変数 ENABLE_TEST_CONSOLE が無ければ、何も描かない。あれば、ブラウザ側の TestConsolePage が、サイト 1 件を GET /api/websites/[websiteId] で読み (ログインの確認で user、REDIS_URL があれば Redis の auth:*。見る権限の確認で website / share / link / pixel / board / team_user)、読めたら、このサイトの id を付けて、計測のスクリプト (/script.js) と記録のスクリプト (/recorder.js) を読み込む。計測のスクリプトは、読み込まれた時点と、画面のリンク・ボタン・div の操作で、POST /api/send へページビュー・イベント・利用者のデータ・表示速度の指標を送る。この受け口は認証をせず、送られたものを保存する: PostgreSQL を使うときは session / website_event / event_data / revenue / session_data (条件によって session_link) に書き、CLICKHOUSE_URL があるときは ClickHouse の website_event / event_data / session_data に書く (KAFKA_URL と KAFKA_BROKER があれば、Kafka のトピック event / event_data / session_data へ送る)。保存の前に、サイトの有無 (REDIS_URL があれば Redis の website:* に読み書き) と、送信元の場所 (サーバーの GeoLite2 のファイル) を調べる。記録のスクリプトは、サイトの記録の設定を GET /api/websites/[websiteId]/recorder で読み、有効で抽選に当たれば、操作の記録とヒートマップを POST /api/record へ送る (session_replay / heatmap_event に書く。ClickHouse と Kafka でも同じ名前。CLOUD_MODE なら、契約を Redis の team:* / account:* から読む)。画面の下には、同じサイトのページビューとセッションの時系列 (GET pageviews) と、イベントの時系列 (GET events/series) のグラフを出す。どちらも website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) を読み、URL の絞り込みに応じて session / event_data / session_data / segment も読む。注釈 (GET annotations) は、この画面からは読まないように見える。ほかの画面への遷移は無い (リンクは、同じ画面の ?page=1 / ?page=2 と、外部の https://www.google.com だけ)"
