notes: "(1) 入口は page のフレーム 1 つ。画面を包む枠 (ルートと (main) の layout) の処理は、枠の入口の結果にあるので、辿っていない。(2) 計測と記録のスクリプトの扱い: TestConsolePage は、2 つのスクリプトを import ではなく <Script src> で読み込む。プロファイルは「画面を通らない計測の受信は対象にしない」と決めているが、この画面は、計測を試すために、自分でスクリプトを読み込んで window.umami を呼ぶ画面なので、スクリプトのソース (src/tracker/index.ts、src/recorder/index.js。rollup の設定で public/script.js / public/recorder.js になる) を component の層のフレーム (kind: script) にして、送信先の受け口 (POST /api/send、GET recorder、POST /api/record) から、保存の終端まで辿った。スクリプトの読み込みそのもの (同じサーバーの静的なファイル) は、段にも読み書きにも書いていない。スクリプトと受け口のつながりは、作るときの置き換え (__COLLECT_API_HOST__ / __COLLECT_API_ENDPOINT__) と、読み込んだ URL のホストで決まるので、tracker と api_send の call は interpretation にした。/script.js が別の URL へ転送される設定 (TRACKER_SCRIPT_URL、本番の CLOUD_MODE) のときは、動くスクリプトが変わりうる。TRACKER_SCRIPT_URL の転送先は、値がリポジトリに無いので unknown (not_traceable_in_repo) にした。(3) フレームにしなかったもの: PageBody / PageHeader / Panel / Link / Button など (見た目だけ)、useApi (URL とヘッダーを組み立てるだけ。API_URL の設定は、これを使う 4 つのフックに書いた)、useDateRange / useDateParameters / useFilterParameters / useTimezone / useNavigation / useLocale (URL と画面の状態から期間や絞り込みを作るだけ)、PageviewsChart / BarChart / LoadingPanel (描くだけ)、受け口の中の補助の関数 (parseToken / createToken、isbot、hasBlockedIp、getRecorderConfig、getReplayEventCount、withCorsHeaders)。hasBlockedIp の設定 (IGNORE_IP) は、呼ぶ受け口に書いた。(4) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた: parseRequest → checkAuth → getUser と、canViewWebsite → getEntity → getWebsite / getLink / getPixel / getBoard、getTeamUser は、最初に着く GET /api/websites/[websiteId] の下。fetchWebsite と getClientInfo は POST /api/send の下、fetchAccount は POST /api/record の下 (getQueryFilters からは、summary で指した)。呼び先がすべて他の下にあって終端になる 3 か所 (GET recorder、canViewSharedWebsiteFilters、canViewWebsiteSection) は、読み書きを持つ最初の段 (getWebsite) までを、もう一度書いた (id が _rw1 / _rw2 / _rw3 で終わるフレーム。確認・設定・ルールは繰り返していない)。(5) external のフレームは、既にある結果に合わせて、呼ぶ問い合わせの関数ごとに書いた (同じ行 prisma.ts:746、clickhouse.ts:737、kafka.ts:128 を、関数ごとに違うテーブルやトピックで呼ぶため)。(6) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は書いていない。ブラウザのフックが付けるのはログイントークン (useApi.ts:28) と読んだため。共有トークンのヘッダーは、ブラウザの store に share があるときだけ付く (useApi.ts:22-25)。この画面でそれが起きないとは言い切れないので、共有トークンの確認も書いた。(7) この入口からは条件が成り立たないように見えるが、消さずに conditional で書いたもの: GET annotations (WebsiteChart に showAnnotations を渡さない)、saveSessionLink / updateSession (この画面は、利用者の id を付けずに identify を呼ぶ)。(8) 接続先の段 (host、database、broker) は、プロファイルの決まりどおり書いていない。Kafka のトピックの名前と、GeoLite2 のファイルの既定のパスは、コードから読めるので書いた。DATABASE_URL は、決まりどおり設定に書いていない。(9) ClickHouse を使うとき、売上 (revenue) を別に保存する処理は、アプリのコードには無い (saveRevenue は PostgreSQL だけ)。ClickHouse の側で website_event から作る表があるかは、db/clickhouse/schema.sql の表の定義の行しか読んでいないので、書いていない。(11) 直さなかったレビューの指摘 (low、2 件): canViewWebsite の中の共有トークンの確認の値 (canViewWebsite) と、share.ts の 3 つの関数の確認の値 (関数の名前) は、websites.websiteId_d や funnels の結果と同じ綴りなので、そのままにした。links.linkId_d の結果は別の綴り (shareToken / shareTokenIncludesWebsite) で、どちらにそろえるかは analysis-conventions.md で決める必要がある。(10) ブラウザの中の保存 (localStorage の umami.disabled、ログイントークン) は、決まりどおり I/O に書いていない。"
