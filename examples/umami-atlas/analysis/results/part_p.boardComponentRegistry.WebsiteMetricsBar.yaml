summary:
  status: interpretation
  value: "ボードに置く「指標の帯」の部品 (登録表の type: WebsiteMetricsBar)。描く側から受け取ったサイトについて、描く画面の URL の期間と絞り込みで、訪問者・訪問・ページビュー・直帰・合計の滞在時間を GET /api/websites/[websiteId]/stats で読み、比較の期間 (描く側が compareMode を渡せば URL の compare、そうでなければ前の期間) との差と一緒に出す。受け口は、最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、canViewWebsiteSection でサイトを見てよいかを確かめ (ログインした利用者なら canViewWebsite が website / link / pixel / board / share / team_user を読む)、getQueryFilters で期間と絞り込みをまとめ (サイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする。CLOUD_MODE で個人のサイトなら account:* も読む。URL に segment / cohort があれば segment も読む)、getWebsiteStats で website_event (ClickHouse では時間ごとの集計表 website_event_stats_hourly も) を、いまの期間と比較の期間で 2 回数える。絞り込みに応じて session / event_data / session_data も読む。CLICKHOUSE_URL の有無で PostgreSQL 用か ClickHouse 用の SQL のどちらかが動く。描く側が対象の種類を pixel / link として渡したときは、代わりに PixelMetricsBar / LinkMetricsBar が、同じ受け口で訪問者・訪問・ページビューだけを出す。書き込みは無い。ほかの入口へのつながりは無い"
