notes: "(1) 部品の入口として分析した。入口のフレームは、登録表の項目 WebsiteMetricsBar (boardComponentRegistry.tsx:141) が指すコンポーネント WebsiteMetricsBar (WebsiteMetricsBar.tsx:8)。描く側 (BoardComponentRenderer と、ボードの画面) は辿らず、描く側から受け取る props (websiteId、compareMode) と、描く画面の URL のクエリ (期間、絞り込み) を、入口のフレームの parameters に書いた。props の showChange は型に書いてあるが使われていないので、parameters に書いていない。(2) 登録表のこの項目は componentByEntityType (boardComponentRegistry.tsx:149) で、対象の種類が pixel / link のとき PixelMetricsBarAdapter / LinkMetricsBarAdapter (:133 / :136) に替わる。context.md の部品の決まりどおり、替わる先のコンポーネント (PixelMetricsBar / LinkMetricsBar) を、入口のフレームの下に conditional で足した。Adapter は websiteId を pixelId / linkId に名前を替えて渡すだけなので、フレームにせず、call の note に書いた。どれを選ぶかの判定は、描く側 (BoardComponentRenderer.tsx:28) の rules に書くもので、この結果には書いていない。(3) 同じ処理の置き場は、入口から、コードに書いてある順に深さ優先で辿って決めた。WebsiteMetricsBar 自身の呼び出し (useWebsiteStatsQuery) を先に辿り、替わる先の部品は登録表の順 (pixel、link) で後に置いた。PixelMetricsBar / LinkMetricsBar は、WebsiteMetricsBar と同じフック (useWebsiteStatsQuery。定義の行が同じで、届く URL と表も同じ) を呼ぶだけなので、フレームを足さず、summary に「経路はフレーム use_stats と同じ」と書いた。2 つは自分のコードに業務のルール (前の期間との差の計算) を持つので、書き直し (_rw) をしなくても終端の決まりを満たす。受け口の getWebsiteStats は、いまの期間と比較の期間で 2 回呼ぶが、同じ関数で読む表も同じなので、フレームは 1 つ。(4) 同じ部品を描く既にある結果 (websites.websiteId_d の metrics_bar / use_stats / api_stats / q_stats / ext_stats_pg / ext_stats_ch) と、同じ受け口の前処理・権限の確認・絞り込みを書いた部品の結果 (part_p.boardComponentRegistry.WebsiteChart) の綴りと木を出発点にし、根拠の行は対象のコードで確かめた。canViewWebsite は、この入口では canViewWebsiteSection の下に最初に着くので、書き直しのフレームは要らない。API_URL と BASE_PATH は、この入口で最初に API を呼ぶフレーム (use_stats) に 1 回だけ書いた。checkAuth の API キーの枝はフレームにせず、rules に 1 行書いた。直帰を除くフィルターの定義 (getExcludeBounceQuery) は、この入口で使う getWebsiteStats の rules に書いた。結果の target には、手元の絶対パスを残さないため clone_path を書いていない。(5) 固定の値で閉じている呼び出しは無い (0 件)。確かめたこと: (a) compareMode は描く側から受け取る値 (入口の外の値) で、しかも呼び先を変えず、送る compare の値だけを変える (受け口は compare が無くても prev で比較の集計を行う。route.ts:33) ので、入口のフレームの rules に書いた。(b) Adapter は PixelMetricsBar / LinkMetricsBar に compareMode を渡さないが、2 つの部品は compareMode を使わないので、閉じる呼び出しが無い。(c) 受け口が canViewWebsiteSection に固定の値 ['overview', 'compare'] を渡すが、その値が効くのは、ログインしていない共有トークンの経路で、共有の設定との組み合わせで決まるので、閉じていない (呼び先のフレームも無い)。(d) getQueryFilters には、受け口がいつも websiteId を渡すので、fetchWebsite は always にした (閉じた呼び出しの逆)。(6) 迷った点と選んだ扱い。(a) PixelMetricsBar / LinkMetricsBar を描くかは、描く側が渡す entityType (ボードの対象の種類) で決まり、部品の入口からは値が読めないので、call を interpretation の conditional にした。(b) pixel / link の id をサイト用の受け口に渡すので、website を id で探す読み取り (fetchWebsite、getEntity の getWebsite) は行が当たらないと読める。読み取りそのものは行われるので、I/O は書いた (pixels.pixelId_d と同じ扱い)。PixelMetricsBar / LinkMetricsBar の summary に書いた。(c) useDateRange はブラウザに保存した期間 (localStorage) を読むが、サーバーのデータではないので I/O に書かず、parameters に書いた。(d) links は 1 件も無い。この部品は、ほかの入口への遷移もつながりも持たない。(7) レビューへの対応 (1 回。high 0 件、medium 0 件、low 1 件。直した)。入口のフレームの「絞り込みのクエリ」に、描く画面のパスが /events で終わるときだけ送るイベントのプロパティの絞り込み (epf<n>) を足し、根拠に useFilterParameters.ts:14 / :25 を足した。共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ。"
