"summary":
  "status": "interpretation"
  "value": "サイト 1 件のリアルタイムの画面。サーバー側の page は URL の websiteId を RealtimePage に渡すだけで、画面の本体はブラウザ側で動く。開いたときに GET /api/realtime/[websiteId] を 1 回呼び、10 秒ごとに読み直す。受け口は期間を直近 30 分 (単位は minute) にして、最近の動き (性能の計測を除くイベントを新しい順に 100 件。website_event と session) と、ページビュー・訪問者の分ごとの時系列 (website_event) を読み、国・ページ・リファラーごとの数と合計を作って返す。画面は、それを合計の帯・分ごとのグラフ・最近の動きの一覧・ページとリファラーの上位・国の一覧と世界地図に出す (地図は受け取った国ごとの数で塗るので、自分では API を呼ばないように見える)。統計の SQL は PostgreSQL 用と ClickHouse 用を両方持ち、CLICKHOUSE_URL の有無でどちらかが動く。受け口は最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行い、セクション realtime を見る権限の確認で website / link / pixel / board / team_user を読む。期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。利用者の操作で動くもの: 最近の動きの一覧で訪問者のアイコンを押すと、URL に session を足してセッションの小窓が開き、セッション (sessions/[sessionId]) とその活動・プロパティ・録画 (replays/[replayId] と保存の状態) を読む。小窓から、セッションの削除 (PostgreSQL だけで動くときだけ) と、録画の保存・保存の取り消し (session_replay_saved) ができる。ほかの画面への遷移は無い"
