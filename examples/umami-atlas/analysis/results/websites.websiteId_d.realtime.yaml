"notes": "(1) この入口の初めての分析。画面を包む枠 ((main) の layout と websites/[websiteId] の layout。WebsiteProvider がサイトの情報を読む) は別の入口なので辿っていない。RealtimeLog の useWebsite は、その枠が渡す context を読むだけなので、フレームにしていない。(2) 同じ部品の木は、ほかの入口の結果を出発点にし、この画面での違いを対象のコードで確かめて直した。useRealtimeQuery → GET realtime → getRealtimeData → getRealtimeActivity は boards.boardId_d から、getPageviewStats / getSessionStats も boards.boardId_d から (そちらでは pageviews の受け口の下にあるが、この画面では getRealtimeData の下に着くので、呼び出し元を getRealtimeData にした)。認証・権限・期間の組み立ての木 (parseRequest → checkAuth、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment) と、セッションの小窓の木 (SessionModal 以下) と、metrics の受け口の集計の 4 つは websites.websiteId_d.events から写した。(3) 同じ処理の置き場は、プロファイルの決まり (入口から、コードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に書く) に従った。RealtimePage の中の順は、useRealtimeQuery (:18)、RealtimeLog (:38) → SessionModal、WorldMap (:53)。最初に着く受け口が GET realtime なので、parseRequest・canViewWebsiteSection・getQueryFilters とその先は、すべてその下にある。セッションの小窓の木の中で、呼び先がすべてほかの呼び出し元の下に書いた処理で、そのままでは終端になる呼び出し元の下には、events の結果と同じく、いちばん早い呼び出しを読み書きを持つフレームまで書き直した (id の末尾が _rw<数字>。canDeleteWebsite の下の getWebsite、canViewAuthenticatedWebsite の下の canViewWebsite → getEntity → getWebsite、ReplaySaveForm の下の useUpdateQuery → POST replays/saved/[replayId] → parseRequest → checkAuth)。書き直したフレームには、権限の確認・設定・ルールを繰り返して書いていない。(4) この画面からは条件が成り立たないように見える呼び出しも、分析リポジトリの決まりに従い、消さずに conditional で書き、note に理由を書いた。(a) WorldMap は useWebsiteMetricsQuery を type: country で呼ぶが、RealtimePage は websiteId を渡さない (RealtimePage.tsx:53) ので、フックの enabled (!!websiteId) が成り立たず、GET metrics は呼ばれないように見える。地図は RealtimePage が渡す国ごとの数で塗る。(b) その受け口の分かれ道のうち、地図からは getSessionMetrics だけに着く (type: country は SESSION_COLUMNS にある) ので、getSessionMetrics は always にし、getEventMetrics / getPageviewMetrics / getChannelMetrics は conditional にした。getSessionMetrics の fields は、集計する列を country だけにした。(c) useRealtimeQuery はクエリを付けずに GET /realtime/<websiteId> を呼ぶ (useRealtimeQuery.ts:10) ので、getWebsiteSegment (URL に segment / cohort があるとき) は成り立たないように見え、統計の問い合わせの event_data / session_data / session の絞り込みのための読み取りも起きないように見える。I/O は消さずに note に書いた。(d) 受け口は期間を 30 分にするので、単位は minute になる (getMinimumUnit)。getPageviewStats / getSessionStats の ClickHouse の時間ごとの集計表 (website_event_stats_hourly) の読み取りは、この入口からは使わないように見えるが、コードにあるので消さずに note に書いた。(5) RealtimePage は、読み込み中か失敗のときは PageBody だけを返す (:21)。子の部品は、データが読めた後にだけ描かれるが、読み込みが終われば必ず描かれるので always にした。(6) 見た目だけの部品 (RealtimeHeader と MetricCard、RealtimeChart と PageviewsChart、RealtimePaths / RealtimeReferrers / RealtimeCountries と ListTable、Avatar) はフレームにしていない。国の名前の翻訳の JSON (useCountryNames)、地図の形のファイル (MAP_FILE)、国旗の画像 (TypeIcon) は、同じサーバーの静的なファイルなので、分析リポジトリの決まりで段にも読み書きにも書いていない。訪問者のアイコン (Avatar) は @dicebear でブラウザの中で作るので、外への送信は無い。(7) API_URL と BASE_PATH は、分析リポジトリの決まりに従い、入口から辿る順で最初に API を呼ぶ useRealtimeQuery に 1 回だけ書いた。checkAuth の API キーの枝は、フレームにせず rules に 1 行書いた。GET /api/config (useConfig) は、決まりでフレームにしていない。そこから得る sessionDeletionEnabled は、使う SessionProfile の settings に書いた (events の結果と同じ)。(8) リンク (links) は 1 件も無い。最近の動きの一覧の訪問者のアイコンは、同じ画面の URL のクエリ (session) を書き換えるもの。ページの URL は、計測している対象のサイトの URL で、入口ではない。(9) テストとの対応は、作業定義で選ばれていないので分析していない。 (10) レビューの指摘: 1 回目の high 1 件 (録画の保存の POST の下の canUpdateWebsite のフレームの抜け。events の結果では POST segments の下にあったので、写すときに落ちていた) を直し、q_can_update_website → q_get_website_rw3 を足した。2 回目の medium 1 件と low 3 件 (canUpdateWebsite の確認の status を fact に、getRealtimeActivity の event_data / session_data に data_type を足す、getSessionReplays に PostgreSQL の event_data の読み取りを足す) もすべて直した。"
