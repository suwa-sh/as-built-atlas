summary:
  status: interpretation
  value: "サイト (website) の一覧の画面。サーバー側の page は WebsitesPage を描くだけで、本体はブラウザ側で動く。個人の URL (/websites) では GET /api/users/[userId]/websites で自分が持つサイトを、チームの URL (/teams/<teamId>/websites。next.config.ts の書き換えでこの画面に届く) では GET /api/teams/[teamId]/websites でそのチームのサイトを、検索 (name / domain)・並べ替え (name / domain / createdAt)・ページ送りを付けて読み (website、持ち主か作成者の user、share)、名前・ドメイン・直近 7 日の訪問者数の小さなグラフ・作成日の表にする。グラフは、一覧にサイトがあれば GET /api/websites/charts で読む (website_event。CLICKHOUSE_URL があれば ClickHouse の website_event_stats_hourly)。各行のドメインのアイコンは、ブラウザが他社のサービス (既定は icons.duckduckgo.com) から読む (PRIVATE_MODE なら読まない)。追加と編集の操作を出すかどうかは画面が決める: 個人の URL では、ログイン中のユーザー (useLoginQuery。ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む) の役割が view-only でないとき。チームの URL では、GET /api/teams/[teamId]/users で読んだメンバー (team_user と user) に自分がいて、役割が team-view-only でないとき。追加ボタンは小窓を開き、名前とドメインを POST /api/websites で送って website を作る (website:create の権限が要る。チームの URL では、そのチームでの権限も要る。CLOUD_MODE では、契約 (Redis の account:* か team:*) で決まる数の上限を、website を数えて確かめる)。CLOUD_MODE では、作った後に小窓が計測タグの表示に替わる。行の名前から /websites/[websiteId] へ、編集ボタンから /websites/[websiteId]/settings へ移る。各 API は、ログイントークンから user を読んで認証する (Redis のセッションを使うときは auth:* も読む)"
  evidence:
    - { file: "src/app/(main)/websites/page.tsx", line: 5 }
