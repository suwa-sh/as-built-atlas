notes: "[1] 画面を包む枠 ((main) の layout と、そこから描かれる App など) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。ただし、(main) の枠の App が、ログイン中のユーザーとアプリの設定をストアに得てから children を描く (App.tsx:43、:54) ことは、この画面のフックの条件を決めるのに使った。[2] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: parseRequest → checkAuth → getUser は POST /api/auth/verify (WebsitesPage.tsx:12 の useLoginQuery が最初に着く) の下。canViewTeam → getTeamUser は GET /api/teams/[teamId]/users (WebsitesPage.tsx:15) の下。サイトの一覧の pagedQuery と share.findMany (ライブラリの呼び出し) は、useUserWebsitesQuery の URL の式で最初に書いてある GET /api/teams/[teamId]/websites → getTeamWebsites の下。WebsitesDataTable の useLoginQuery (WebsitesDataTable.tsx:17) は summary で触れるだけにした。[3] この画面からは条件が成り立たないように見える呼び出しも、消さずに conditional で書き、note に理由を書いた: POST /api/auth/verify (枠がユーザーを得てから描く)、GET /api/me/websites (同じ理由で userId がいつもある)、POST /api/websites の createShare (追加のフォームは shareId を送らない)。[4] 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段まで書き直した (id が _rw で終わるフレーム。external の段は書いていない。確認・設定・ルールは繰り返していない): canCreateTeamWebsite の下の getTeamUser、GET /api/me/websites の下の parseRequest → checkAuth。[5] 段にしなかったもの: canCreateWebsite (src/permissions/website.ts:120。データを読まないので、確認は、それを呼ぶ受け口 POST /api/websites に書いた)、getCloudWebsiteLimit (src/lib/subscription.ts:41。計算だけの補助の関数なので、ルールを POST /api/websites に書いた)、getQueryFilters (websiteId を渡さないので、データを読まない)、useConfig → GET /api/config (analysis-conventions.md のとおり。設定 CLOUD_MODE / PRIVATE_MODE / FAVICON_URL は、それを使う WebsiteAddButton と Favicon に書いた)、TrackingCodeStep と WebsiteTrackingCode (設定から計測タグの文字列を組み立てて表示するだけ。settings.websites.websiteId_d の結果と同じ扱い)、DataGrid (検索とページ送りは、同じ画面の URL のクエリを書き換えるだけ)、WebsiteSparkline / DateDistance / SortableLabel / LinkButton / PageHeader / Panel / DialogButton (見た目だけ)、useNavigation (URL を読むだけ)、useMessages、useModified (ブラウザの中の更新印)、useApi。WebsitesHeader は、このフォルダにあるが、この画面からは描かれない。[6] 操作を出すかどうか (showActions) は、画面の出し分けで、先へ進むのを止める確認ではないので、guards ではなく WebsitesPage の rules (decision) に書いた (links、pixels の結果と同じ)。[7] 設定 BASE_PATH は、analysis-conventions.md のとおり、この入口で最初に API を呼ぶ段 (useLoginQuery) に 1 回だけ書いた。API_URL は /auth と /config で始まる URL には効かない (api-url.ts:6、:39) ので、useLoginQuery には書かず、API_URL が効く API を最初に呼ぶ段 (useTeamMembersQuery) に 1 回だけ書いた。DATABASE_URL は書いていない。POST /api/websites の fetchTeam / fetchAccount は、Redis が有効かを確かめずに読む (load.ts:43、:49) ので、REDIS_URL を設定として書いていない (settings.websites.websiteId_d の結果と同じ)。[8] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。[9] 確認の値は、analysis-conventions.md の綴りにした (役割は user.isAdmin、持ち主・所属は確認する関数の名前、権限は定数の名前、ログイン済みは checkAuth の 1 か所だけ)。GET /api/users/[userId]/websites の本人の確認は、関数が無く受け口に直接書いてあるので、ほかの入口の結果と同じ式 (auth.user.id === userId) にした。[10] website と share の書き込みの fields には、Prisma の @updatedAt が自動で書く updated_at を入れた (settings.websites.websiteId_d の結果と同じ)。[11] テストとの対応は、作業定義の analysis.tests が無いので、分析していない。[12] レビューの指摘は medium 2 件と low 1 件で、すべて直した (GET /api/users/[userId]/websites と canViewBatchWebsites の guards に、管理者の素通し user.isAdmin を role として足した。追加のフォームの rules に、名前とドメインが必須であることを足した)。レビューが人の判断に回したこと: 同じ管理者の素通しを guards に書いていない、ほかの入口の結果 (settings.websites、layout_l.main_g、admin.users.userId_d) がある。API_URL を書く段 (API_URL が効く API を最初に呼ぶ段) を analysis-conventions.md に書き足すとよい。"
