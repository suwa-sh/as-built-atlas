summary:
  status: interpretation
  value: "設定の画面 (/settings の下) を包む枠。データの読み書きも外部への送信もしない。ビルド時の環境変数 cloudMode (next.config の env に CLOUD_MODE を入れたもの) があれば null を返し、包まれる画面を含めて何も描かない。そうでなければ SettingsLayout で、包まれる画面 (children) を余白付きの列 (UI ライブラリ @umami/react-zen の Column) と、幅を 1320px までに抑える PageBody の中に置くだけ。metadata でタイトルの書式 (%s | Settings | Umami、既定は Settings | Umami) を決める。設定のメニュー (SettingsNav) はこの枠ではなく、外側の (main) の枠の SideNav / MobileNav が描く"
  evidence:
    - { file: "src/app/(main)/settings/layout.tsx", line: 5 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 6 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 9 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 14 }
    - { file: "src/app/(main)/settings/SettingsLayout.tsx", line: 8 }
    - { file: "src/app/(main)/settings/SettingsLayout.tsx", line: 9 }
    - { file: src/components/common/PageBody.tsx, line: 6 }
    - { file: next.config.ts, line: 16 }
    - { file: next.config.ts, line: 217 }
    - { file: "src/app/(main)/SideNav.tsx", line: 115 }
    - { file: "src/app/(main)/MobileNav.tsx", line: 65 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる設定の画面) と、外側の layout ((main) とルート) は別の入口なので辿らない。(2) データに届かない枠なので、context.md の決まり (データに届かない画面・枠は、最後に頼るライブラリを external フレームにして閉じる) に従い、見た目の部品を出す UI ライブラリ @umami/react-zen の Column を external にした。I/O は無し。(3) フレームにしなかったもの: PageBody (見た目だけの部品。error / isLoading を受けると警告や読み込み中を出すが、この枠は渡さないので children を列に入れるだけ。中で useMessages を呼ぶが、翻訳の文言を引くだけ)。(4) 設定のメニュー SettingsNav は src/app/(main)/settings/ に置かれているが、この layout からは描かれない。描くのは (main) の枠の SideNav (SideNav.tsx:115) と MobileNav (MobileNav.tsx:65)。(5) cloudMode は next.config の env (next.config.ts:16 / :217) でビルド時に埋め込まれる値で、実行時の /api/config の cloudMode (CLOUD_MODE を読む) とは別の経路。この枠は API を呼ばない。設定の名前は、実行する環境で設定する名前 CLOUD_MODE で書いた。(6) cloudMode による分かれ道は、権限の確認 (guards) ではなく設定 (settings) に書いた。利用者の権限ではなく、環境の設定で決まるため。設定で分かれる処理なので rules には重ねていない。(7) 同じ処理が複数の呼び出し元から呼ばれる箇所は無い (Column は SettingsLayout.tsx:8 と PageBody.tsx:35 で使われるが、ライブラリを呼ぶ行が違い、PageBody はフレームにしていない)。(8) links (ほかの入口へのつながり)、guards、rules、I/O の列は、この枠には無い。tests は作業定義で選ばれていないので見ていない"
