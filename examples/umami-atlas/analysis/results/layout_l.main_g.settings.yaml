    - { file: next.config.ts, line: 16 }
    - { file: next.config.ts, line: 217 }
    - { file: "src/app/(main)/SideNav.tsx", line: 115 }
    - { file: "src/app/(main)/MobileNav.tsx", line: 65 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる設定の画面) と、外側の layout ((main) とルート) は別の入口なので辿らない。(2) データに届かない枠なので、context.md の決まり (データに届かない画面・枠は、最後に頼るライブラリを external フレームにして閉じる) に従い、見た目の部品を出す UI ライブラリ @umami/react-zen の Column を external にした。I/O は無し。(3) フレームにしなかったもの: PageBody (見た目だけの部品。error / isLoading を受けると警告や読み込み中を出すが、この枠は渡さないので children を列に入れるだけ。中で useMessages を呼ぶが、翻訳の文言を引くだけ)。(4) 設定のメニュー SettingsNav は src/app/(main)/settings/ に置かれているが、この layout からは描かれない。描くのは (main) の枠の SideNav (SideNav.tsx:115) と MobileNav (MobileNav.tsx:65) で、どちらもリンクを並べるだけなので (main) の枠の分析で扱っている。(5) cloudMode は next.config の env (next.config.ts:16 / :217) でビルド時に埋め込まれる値で、実行時の /api/config の cloudMode (CLOUD_MODE を読む) とは別の経路。この枠は API を呼ばない。(6) レビューの指摘 1 件 (low) を直した: SettingsLayout の summary の「中央に寄せる」の根拠に PageBody.tsx:42 (margin: 0 auto) を足した"
