summary:
  status: interpretation
  value: "設定の画面 (/settings の下) を包む枠。データの読み書きも外部への送信もしない。ビルド時の環境変数 cloudMode (next.config の env に CLOUD_MODE を入れたもの) があれば null を返し、包まれる画面を含めて何も描かない。そうでなければ SettingsLayout で、包まれる画面 (children) を余白付きの列 (UI ライブラリ @umami/react-zen の Column) と、幅を 1320px までに抑える PageBody の中に置くだけ。metadata でタイトルの書式 (%s | Settings | Umami、既定は Settings | Umami) を決める。設定のメニュー (SettingsNav) はこの枠ではなく、外側の (main) の枠の SideNav / MobileNav が描く"
  evidence:
    - { file: "src/app/(main)/settings/layout.tsx", line: 5 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 6 }
    - { file: "src/app/(main)/settings/layout.tsx", line: 9 }
