    - { file: "src/app/api/users/[userId]/websites/route.ts", line: 33 }
    - { file: src/app/api/websites/charts/route.ts, line: 37 }
    - { file: "src/app/api/admin/users/[userId]/2fa/route.ts", line: 26 }
    - { file: "src/app/api/admin/users/[userId]/2fa/route.ts", line: 55 }
    - { file: "src/app/api/admin/users/[userId]/2fa/route.ts", line: 77 }
notes: "(1) 枠 (admin と (main) の layout) の処理は辿っていない。この画面は admin の枠の中で動き、枠は CLOUD_MODE のときと管理者でないときに何も描かないが、それは枠の入口の結果に書いてある。(2) 同じ関数は、入口からコードに書いてある順に深さ優先で辿り、最初に着いた呼び出し元の下に 1 回だけ書いた。parseRequest → checkAuth → getUser は GET /api/users/[userId] (UserProvider の useUserQuery が最初に着く) の下。updateUser は POST /api/users/[userId] の下 (POST /api/admin/users/[userId]/2fa も呼ぶ。書く列 two_factor_required は、同じ I/O の fields に足した)。useUserQuery は UserProvider の下 (UserTwoFactorSettings も呼ぶ)。(3) POST /api/admin/users/[userId]/2fa は、呼び先 (parseRequest と updateUser) がどちらもほかの呼び出し元の下に書いてあり、そのままでは終端になるので、いちばん早い呼び先の parseRequest を、読み書きを持つ最初の段 (checkAuth) までもう一度書いた (id が _rw で終わるフレーム)。書き直したフレームには、確認・設定・ルールを繰り返していない。(4) 同じ関数でも URL が違うものは別のフレームにした: useUpdateQuery は /users/<userId> と /admin/users/<userId>/2fa。(5) 権限の確認の関数 canViewUser / canUpdateUser / canEnforceTwoFactorAuthForUser (src/permissions/user.ts) は、データを読まず、ログイン中のユーザーの値を比べるだけなので、フレームにすると終端の決まりを満たせない。段にせず、確認はそれを呼ぶ受け口の guards に書いた。canEnforceTwoFactorAuthForUser の中身は user?.isAdmin だけなので、kind: role の user.isAdmin と書いた。GET /api/users/[userId]/websites の確認は関数になっていないので、ほかの入口の結果に合わせて、value にコードの式を肯定の形 (auth.user.id === userId) で書いた。(6) getUserByUsername は getUser と同じ補助の関数 findUser を通り、ライブラリを呼ぶ行 (user.ts:32) が同じなので、external のフレームは足していない (ext_prisma_user と同じ)。(7) Tabs / TabPanel の中の部品 (UserEditForm、UserWebsites、UserTwoFactorSettings) を、タブを選ぶまで描くかどうかは UI ライブラリ (@umami/react-zen) の動きで、リポジトリからは読めない。ほかの入口の結果と同じく、コードの条件だけを見て always にし、note に書いた。(8) /api/admin の 3 つの受け口は、先頭で CLOUD_MODE なら 404 を返す。設定で打ち切るので、その後ろの呼び出しを conditional にし、設定を settings に書いた (admin の枠が CLOUD_MODE で何も描かないので、この画面からは、ふつう成り立つ条件)。(9) canViewBatchWebsites は管理者なら DB を読まずに返す。この画面は管理者にだけ描かれるので、その後ろの読み取りはこの入口からは届かないように見えるが、消さずに conditional で書いて note に理由を書いた。(10) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は辿っていない。ブラウザはログインのトークンを付ける (useApi.ts:28) うえ、/api/users・/api/admin・/api/2fa・/api/auth は API キーを受け付けないパス (api-key.ts:11)。(11) 設定: API_URL は API を呼ぶフックごとに書いた。/auth で始まる URL には効かないので、useLoginQuery には書かず、ほかの入口の結果に合わせて BASE_PATH を書いた。DATABASE_URL は書いていない。(12) UserHeader (ユーザー名の見出し)、DataGrid (一覧の枠。ページ送りと検索は、同じ画面の URL のクエリを書き換えるだけ)、WebsiteSparkline、TypeConfirmationForm、ControlledDialog は、見た目だけか、データに届かない部品なので、フレームにしていない。(13) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(14) レビューの指摘 2 件 (medium 1、low 1) は、どちらも直した: DATABASE_REPLICA_URL の設定を fact にし、GET /api/users/[userId]/websites の本人の確認の value を、ほかの入口と同じ綴りにそろえた。(15) 共通の段の書き方を、分析リポジトリの決まりにそろえた (ログインの確認の設定と規則、持ち主の確認の中の管理者の確認、API_URL / BASE_PATH の置き場)。直したのは、その項目だけ"
