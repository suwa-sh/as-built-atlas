summary:
  status: interpretation
  value: "管理の画面で、ユーザー 1 人を見て編集する画面。サーバー側の page は URL の userId を UserPage に渡すだけで、本体はブラウザ側で動く。開くと GET /api/users/[userId] で user を読み、見出しにユーザー名を出す。その下に 3 つのタブがある。(1) 詳細: ユーザー名・パスワード・役割 (自分自身のときは役割の欄を出さない) のフォーム。保存で POST /api/users/[userId] を呼び、user を更新する (パスワードはハッシュにし、ユーザー名と役割は管理者だけが変えられ、ユーザー名の重複は 400)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む)。(2) サイト: GET /api/users/[userId]/websites でそのユーザーのサイトの一覧 (website、持ち主の user、share) を読み、一覧にサイトがあれば GET /api/websites/charts で直近 7 日の訪問者数の小さなグラフを読む (website_event。CLICKHOUSE_URL があれば ClickHouse の website_event_stats_hourly)。各行の編集ボタンは /websites/<id>/settings へ移る。(3) セキュリティ: GET /api/2fa/status (ログイン中の管理者自身の 2 段階認証の状態と、全体で必須かどうか) と GET /api/admin/users/[userId]/2fa (このユーザーが 2 段階認証を有効にしているか) を読む。スイッチで、このユーザーに 2 段階認証を必須にするかを POST /api/admin/users/[userId]/2fa で書き (user の two_factor_required)、リセットで DELETE /api/admin/users/[userId]/2fa を呼んで two_factor_auth / two_factor_backup_code / two_factor_otp_used / two_factor_rate_limit の行を消す。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行う。/api/admin の 3 つの API は管理者だけが使え、CLOUD_MODE では 404 を返す"
  evidence:
    - { file: "src/app/(main)/admin/users/[userId]/page.tsx", line: 7 }
    - { file: "src/app/(main)/admin/users/[userId]/UserPage.tsx", line: 10 }
    - { file: "src/app/(main)/admin/users/[userId]/UserSettings.tsx", line: 19 }
    - { file: "src/app/(main)/admin/users/[userId]/UserSettings.tsx", line: 22 }
    - { file: "src/app/(main)/admin/users/[userId]/UserSettings.tsx", line: 25 }
