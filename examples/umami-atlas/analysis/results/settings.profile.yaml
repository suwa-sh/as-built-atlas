summary:
  status: interpretation
  value: "設定メニューの中の、ログイン中のユーザー自身のプロフィールの画面。ログイン中のユーザー (useLoginQuery。ストアに無いときだけ POST /api/auth/verify で user と所属の team を読む) のユーザー名と役割を出す。設定値 cloudMode (GET /api/config が返す CLOUD_MODE の有無) が偽なら、「パスワードを変更」のボタンを出す。押すと開く小窓のフォームで、今のパスワードと新しいパスワード (8 文字以上、確認用と一致) を入れて保存すると、POST /api/me/password が、ログイン中のユーザーの user を読んで今のパスワードを照合し、合えば新しいパスワードのハッシュで user の password を更新する。どの API も最初にログインの確認 (user。REDIS_URL があれば Redis の auth:*) を行う。パスワードを変えると、パスワードの指紋を持つそれまでのログイントークンは、ログインの確認で無効になる"
  evidence:
    - { file: "src/app/(main)/settings/profile/page.tsx", line: 5 }
    - { file: "src/app/(main)/settings/profile/ProfilePage.tsx", line: 17 }
    - { file: "src/app/(main)/settings/profile/ProfileSettings.tsx", line: 7 }
    - { file: "src/app/(main)/settings/profile/ProfileSettings.tsx", line: 9 }
    - { file: "src/app/(main)/settings/profile/ProfileSettings.tsx", line: 41 }
    - { file: "src/app/(main)/settings/profile/PasswordEditForm.tsx", line: 13 }
    - { file: src/app/api/me/password/route.ts, line: 22 }
    - { file: src/app/api/me/password/route.ts, line: 24 }
    - { file: src/app/api/me/password/route.ts, line: 30 }
    - { file: src/lib/auth.ts, line: 98 }
notes: "(1) 画面を包む枠 (ルート、(main)、settings の layout) は別の入口なので辿っていない。settings の枠は、ビルド時の CLOUD_MODE があれば何も描かない (枠の入口の結果にある)。(2) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。ProfileSettings.tsx では useLoginQuery (7 行目) が最初なので、parseRequest → checkAuth → getUser の経路は POST /api/auth/verify の下にある。POST /api/me/password も parseRequest と getUser を呼ぶが、summary に書くだけにした (呼び先の updateUser が読み書きを持つので、POST /api/me/password は終端にならない)。(3) フレームにしなかったもの: GET /api/config (useConfig。ストアに設定値が無いときだけ呼ぶが、枠が読み込み済みで、認証を通らず環境変数を返すだけの受け口。ほかの入口の結果と同じ扱い)、ProfileHeader.tsx (同じフォルダにあるが、この画面からは使われていない)、PageBody / PageHeader / Panel / Dialog / Modal (見た目だけの部品)、useMessages (翻訳)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)、hashPassword / checkPassword (bcryptjs を包む小道具。ルールとして受け口の段に書いた)。(4) 「パスワードを変更」のボタンを出す条件 !cloudMode は、実行時の GET /api/config の値 (CLOUD_MODE の有無) で決まる。settings の枠がビルド時の CLOUD_MODE で何も描かないので、この画面からはふつう成り立つ条件だが、ビルド時と実行時で別の経路なので、消さずに conditional にし、設定 CLOUD_MODE を ProfileSettings の段に書いた。(5) useLoginQuery の POST /api/auth/verify は、ストアにユーザーが無いときだけ呼ぶ。(main) の枠がユーザーを得てから画面を描くので、この画面からはふつう呼ばれないが、消さずに conditional で書いた (ほかの入口の結果と同じ扱い)。(6) checkAuth の API キーの経路 (auth.ts:74 → checkApiKeyAuth) は辿っていない。ブラウザはログインのトークンを付ける (useApi.ts:28) うえ、/api/auth と /api/me/password は API キーを受け付けないパス (api-key.ts:12 / :15)。そのため、API キーの経路に入るかを決める CLOUD_MODE は、checkAuth の settings に書いていない。(7) POST /api/me/password の受け口のスキーマは currentPassword と newPassword だけを持ち、フォームが送る confirmPassword は検証に使わない (確認用との一致は、ブラウザ側のフォームの検証だけ)。(8) updateUser の更新で Prisma が自動で書く updated_at (@updatedAt) は、コードに列の名前が出ないので、ほかの入口の結果に合わせて fields に書いていない。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘 1 件 (low。useConfig と GET /api/config をフレームにしていない) は直していない。GET /api/config は skipAuth で環境変数を返すだけで、データにも外部のライブラリにも届かず、フレームにすると終端の決まりを満たせない (枠 layout_l.main_g の結果と同じ判断)。ほかの入口の結果でも扱いが分かれているので、そろえる決まりを analysis-conventions.md に足すかは、人が決める (この作業では、その入口の結果とレビューのファイル以外を書けない)。"
