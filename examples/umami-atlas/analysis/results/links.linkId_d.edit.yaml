summary:
  status: interpretation
  value: '短縮リンク 1 件を編集する画面。サーバー側の page が、URL の linkId で link を直接読み、無いか削除済みなら何も描かない。あれば、ブラウザ側で GET /api/links/[linkId] でリンクを読み直し、見出し (名前と転送先の URL、リンクの画面へ戻るリンク)、編集フォーム、共有の欄を描く。編集フォームは、名前・転送先の URL・slug を POST /api/links/[linkId] で更新する (link の update。slug が重なれば 400)。共有の欄は、GET /api/links/[linkId]/shares でこのリンクの共有 (share) を読み、追加 (POST /api/links/[linkId]/shares で share の create)、編集 (小窓。GET と POST /api/share/id/[shareId] で share の read と update)、削除 (確認の小窓。DELETE /api/share/id/[shareId] で share の delete) ができる。各 API は、ログイントークンから user を読んで認証し (Redis のセッションを使うときは auth:* も読む)、権限を確かめる: リンクの API は、管理者・リンクの持ち主・リンクのチームのメンバー (更新と共有の追加は website:update の権限)。共有の API は、共有の対象を website / link / pixel / board から探し、同じ考え方で確かめる (更新は website:update、削除は website:delete)。クラウドモードでは、slug の欄を出さず、共有の URL が CLOUD_URL で始まる'
