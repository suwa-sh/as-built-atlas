notes: '[1] 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に 1 回だけ書いた。置き場: getLink は page (page.tsx:7)、parseRequest → checkAuth → getUser は GET /api/links/[linkId] (route.ts:8。LinkProvider の useLinkQuery が最初に着く)、getTeamUser は canViewLink (permissions/link.ts:34)、getShare と getEntity (getWebsite / getPixel / getBoard) は GET /api/share/id/[shareId]。[2] 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段まで書き直した (id が _rw で終わるフレーム。analysis-conventions.md の決まりどおり、external の段は書いていない): canUpdateLink の下の getLink、canUpdateEntity / canDeleteEntity の下の getEntity → getWebsite。書き直した段に、確認・設定・ルールは繰り返していない。[3] フレームにしなかったもの: useConfig → GET /api/config (skipAuth で環境変数を返すだけで、データにもライブラリにも届かず、終端の決まりを満たすフレームにできない。(main) の枠の結果と同じ扱い)、SharedSharesTable (行を並べるだけ)、LinkEditHeader (LinkEditPage と同じファイル)。これらが持つ設定とリンクは、それを描くフレームに書いた (CLOUD_MODE / LINKS_URL は link_edit_form、CLOUD_MODE / CLOUD_URL / BASE_PATH と共有の画面へのリンクは simple_shares_table)。SimpleShareEditForm が出す共有の URL は、読むだけの欄 (表示だけ) なので、設定にもリンクにも書かず、概要に書いた。[4] page はサーバー側で getLink を直接呼び、ログインと権限の確認をしない (page.tsx:7)。読んだリンクは、有無と deletedAt の判定にだけ使い、ブラウザへは渡さない。ブラウザ側の読み直し (GET /api/links/[linkId]) は、canViewLink で確かめる。[5] LinkEditForm と LinkShareForm の caller は、JSX に書いている LinkEditPage にし、描くかどうかを決める LinkProvider の条件は call の condition に書いた (settings.teams.teamId_d と同じ書き方)。[6] 権限の確認の value は、analysis-conventions.md の綴りに合わせた (役割は user.isAdmin、持ち主・所属は確認する関数の名前、権限は定数の名前、ログイン済みは checkAuth の 1 か所だけ)。条件の説明は note に書いた。[7] getEntity の下の getWebsite は、website が見つかったときだけ share も読む (attachShareIdToWebsite)。この画面の共有の対象はリンクなので、ふつうは見つからないが、コードの上では届くので I/O に残し、note に書いた。[8] share/id/[shareId] の GET と DELETE は、共有が無いときの確認をせずに share.entityId を読む (route.ts:19、75)。POST だけが 404 を返す (route.ts:44)。[9] 画面から API を呼ぶ URL は、環境変数 API_URL があると (/auth と /config 以外は) その URL に向く。既定では同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にし、API_URL は、API を呼ぶフック・フォームの settings に書いた。[10] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。DATABASE_URL / DATABASE_REPLICA_URL は、どの段にも同じように効く接続先なので、settings に書いていない。[11] src/lib/schema.ts の filterParams / pagingParams / anyObjectParam は読んでいない。受け口が取り出す項目 (route の分割代入の行) だけを parameters に書いた。[12] テストとの対応は、作業定義の analysis.tests が無いので、分析していない。[13] レビューの指摘は medium 1 件と low 2 件で、すべて直した (share の作成で書く列に updated_at を足した、checkAuth に共有トークンのルールを足した、共有の編集フォームの call の根拠に DialogButton の行を足した)。'
