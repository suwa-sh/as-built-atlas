summary:
  status: interpretation
  value: "ログイン中のユーザーが所属するチームを一覧する画面。GET /api/users/[userId]/teams (userId は自分) で、自分がメンバーになっている削除されていない team を、メンバー (team_user と、その user の id / username) と、サイトとメンバーの件数 (website / team_user) を付けて読み、名前・オーナー・メンバー数・サイト数の表にする。ページ送りと並べ替え (name) は URL のクエリで行う。受け口は、本人か管理者 (user.isAdmin) でなければ 401。行の名前から /teams/[teamId] へ移る (next.config の転送と書き換えで、チームの文脈のサイトの一覧 /websites が出る)。見出しの参加ボタンは小窓を開き、招待コード (accessCode) を入れて POST /api/teams/join を呼ぶ。コードで削除されていない team を探し、既にメンバーでなければ、自分の team_user (role は team-member) を作る。見出しの作成ボタンは、自分の役割が view-only でないときだけ出る。小窓で名前を入れて POST /api/teams を呼び、team と、オーナー (自分) の team_user を作る。クラウドモード (CLOUD_MODE) では、作る前に Redis の account:* から契約を読み、持てるチームの数の上限に達していれば 401 にし、作ったあとに Redis が有効なら team:* に契約の情報を書く。オーナーを選ぶ欄 (UserSelect。GET /api/admin/users と GET /api/teams/[teamId]/users) は、管理者用に isAdmin を渡されたときだけ出るので、この画面からは描かれないように見える (経路はコードにあるので書いている)。各 API の認証は、ログイントークンから user を読む (Redis のセッションを使うときは auth:* も読む)。ログイン中のユーザーは useLoginQuery から得る (ストアに無いときだけ POST /api/auth/verify で user と所属チームを読む)"
  evidence:
    - { file: "src/app/(main)/teams/page.tsx", line: 5 }
