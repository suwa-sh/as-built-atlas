    - { file: src/app/api/teams/join/route.ts, line: 37 }
    - { file: src/app/api/teams/route.ts, line: 69 }
notes: "[1] 木の置き場: 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。TeamsPage は TeamsHeader (TeamsPage.tsx:12) を TeamsDataTable (:14) より先に描き、TeamsHeader は useLoginQuery (TeamsHeader.tsx:16) を、参加ボタン (:21) を、作成ボタン (:22) の順に呼ぶ。そのため useLoginQuery → POST /api/auth/verify → parseRequest → checkAuth → getUser は TeamsHeader の下、getTeamUser は POST /api/teams/join (join/route.ts:31) の下に書いた。TeamsDataTable の useLoginQuery は summary で触れるだけにした。[2] 終端の決まりを満たすための書き直し: canViewTeam (GET /api/teams/[teamId]/users の確認) は、呼び先の getTeamUser がほかの下に書いてあり終端になるので、getTeamUser を読み書きを持つ段までもう一度書いた (q_get_team_user_rw。確認・設定・ルールは繰り返していない)。[3] 段にしなかった権限の関数: canCreateTeam はデータを読まないので、確認 (guards) を POST /api/teams の段に書いた (admin.teams の結果と同じ)。[4] この入口からは条件が成り立たないように見える呼び出しも、消さずに conditional で書いた。(a) TeamsHeader は TeamsAddButton に isAdmin を渡さず、既定が false (TeamsAddButton.tsx:8) なので、TeamAddForm の isAdmin && (TeamAddForm.tsx:38) が成り立たず、オーナーを選ぶ欄 (UserSelect) と、その先の GET /api/admin/users と GET /api/teams/[teamId]/users は、この画面からは呼ばれないように見える。(b) さらに UserSelect の useTeamMembersQuery は teamId を受け取らず、enabled: !!teamId (useTeamMembersQuery.ts:14) が成り立たない。(c) 行のリンクの /settings/teams/${row.id} は、この画面のパス (/teams) に /settings が無いので出ない。[5] クラウドモードの枝 (POST /api/teams の fetchAccount / getUserOwnedTeamCount / team:* の set) は、この画面を包む枠 (src/app/(main)/layout.tsx) がクラウドモードでも描くので、届く枝として書いた (admin.teams の結果の「届かないように見える」は、管理の枠に固有の事情)。[6] checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので、この画面からは使わないものとして辿っていない (設定 CLOUD_MODE にだけ書いた。ほかの入口の結果と同じ扱い)。[7] 画面を包む枠 (layout_l、layout_l.main_g) の処理は、枠の入口の結果にあり、ここでは辿っていない。[8] 行の名前のリンクの行き先は、コードの式が ${isSettings ? '/settings' : ''}/teams/${row.id} なので、値が読める行き先を 1 件ずつ書いた。/teams/${row.id} は、next.config.ts の転送 (/teams/:id → /teams/:id/websites、:164) と書き換え (/teams/:teamId/:path* → /:path*、:253) で、page src/app/(main)/websites/page.tsx (入口 websites) が出ると読んだので、entry_id は interpretation で書いた。[9] DataGrid のページ送りと検索は、同じ画面の URL のクエリを書き換えるだけで、ほかの入口へのつながりではないので links に書いていない。表示の切り替えの localStorage も I/O に書いていない。この画面の GET /api/users/[userId]/teams はスキーマに search を持たないので、検索の語は届かない。[10] フレームにしなかったもの: PageBody / Panel / PageHeader / DataGrid / TeamsTable / SortableLabel / Link (見た目だけ、または一覧の枠)、useMessages、useNavigation (URL を読むだけ)、useModified (ブラウザの中の更新印)、useApi (URL とヘッダーを組み立てるだけ。API_URL と BASE_PATH は、これを使うフックに書いた)、getQueryFilters (websiteId が無いのでデータを読まない)。[11] 確認の値は、決まりの綴りにした (役割は user.isAdmin、権限は定数の名前だけ、所属は関数の名前だけ)。GET /api/users/[userId]/teams の本人の確認は、関数が無く受け口に直接書いてあるので、admin.websites.websiteId_d の結果と同じ式 (auth.user.id === userId) にした。[12] テストとの対応は、作業定義で選ばれていないので分析していない。[13] レビューの指摘は low が 1 件 (GET /api/users/[userId]/teams の引数に maxResults が無い) で、直した"
