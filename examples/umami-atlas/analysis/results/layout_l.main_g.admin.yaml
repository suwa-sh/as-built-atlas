summary:
  status: interpretation
  value: "管理の画面 (/admin の下) を包む枠。環境変数 CLOUD_MODE (next.config の env が process.env.cloudMode として埋め込む) が設定されていれば null を返し、包まれる画面を含めて何も描かない。設定されていなければ AdminLayout がブラウザ側で useLoginQuery からログイン中のユーザーを取り、管理者 (user.isAdmin。サーバーが role が admin のときに付ける) でなければ何も描かない。管理者なら、包まれる画面 (children) を、幅を 1320px までに抑える PageBody の中に置くだけ。useLoginQuery は、ストアにユーザーが無いときだけ POST /api/auth/verify を呼ぶ。その先では、トークンを検査して user (Redis が有効でトークンが authKey を持つときは auth:* のセッションも) を読み、所属チーム (team と team_user) を読む。ただし、外側の (main) の枠の App はストアにユーザーがあるときだけ children を描くので、この枠が描かれる時点ではストアにユーザーがあり、この枠からこのリクエストは出ないと読める (経路はコードにあるので書いている)。metadata でタイトルの書式 (%s | Admin | Umami、既定は Admin | Umami) を決める。ほかの入口へのつながり (遷移や小窓) は無い"
