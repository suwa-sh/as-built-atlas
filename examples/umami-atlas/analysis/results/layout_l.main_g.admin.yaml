notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる管理の画面) と、外側の layout ((main) とルート) は別の入口なので辿らない。(2) POST /api/auth/verify の呼び出しは conditional (ストアにユーザーが無いとき。useLoginQuery.ts:19) にした。外側の App はストアにユーザーがあるときだけ children を描き (App.tsx:54 / :81)、ストアのユーザーを消す setUser(null) は (main) の外のログアウト画面 (LogoutPage.tsx:20) にしか無いので、この枠からはリクエストは出ないと読める (実行しての確認はしていない)。指示書には「条件がいつも成り立つ呼び出しは always」の決まりはあるが、「条件が成り立たないと読める呼び出し」の決まりは無いので、経路を消さずに conditional のまま書き、call と I/O の note に添えた。(3) フレームにしなかったもの: PageBody (見た目だけの部品。error / isLoading を受けると警告や読み込み中を出すが、この枠は渡さない。中で useMessages を呼ぶが、翻訳の文言を引くだけ)、useApi と getApiUrl (URL とヘッダーを組み立てる小道具)、parseShareToken (ヘッダーの署名付きトークンを解くだけで、データを読まない)。(4) checkAuth の API キーの枝 (auth.ts:74 → checkApiKeyAuth) は、同じファイルの関数なので q_check_auth の段に含めた。/api/auth は API キーを受け付けないパス (api-key.ts:15) で、getApiKeyByHash より前の auth.ts:35 で null を返すので、api_key の読み書きは書いていない (rules に検証として書いた)。(5) getUser は checkAuth の中で 2 か所 (auth.ts:94 と :105) から呼ばれるが、同じ関数で届く先も同じなので、フレームは 1 つ。call の条件に両方を書いた。(6) 設定の名前は、実行する環境で設定する名前 (CLOUD_MODE / BASE_PATH / REDIS_URL) で書いた。ブラウザ側のコードが読むのは、next.config の env が埋め込んだ process.env.cloudMode / basePath。API_URL は、/auth で始まる URL には使われない (api-url.ts:6 / :39) ので、書いていない。(7) 権限の確認は 2 つ。管理者かどうか (AdminLayout.tsx:9) はブラウザ側で行う表示の確認。ログイン済みかどうかは checkAuth が決め (auth.ts:122)、parseRequest が 401 にする (request.ts:54)。確認を決めている段 (q_check_auth) に 1 回だけ書いた。(8) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(9) レビューの指摘 2 件 (medium 1、low 1) は、どちらも直した: Redis の読み取りを interpretation にし (キーの形 auth:* は、読む行ではなく saveAuth から読み取ったもの)、トークンの出どころの根拠に localStorage を読む行 (storage.ts:9) を足した"
