summary:
  status: interpretation
  value: "管理の画面 (/admin の下) を包む枠。ビルド時の環境変数 cloudMode (next.config の env に CLOUD_MODE を入れたもの) があれば null を返し、包まれる画面を含めて何も描かない。そうでなければ AdminLayout がブラウザ側で useLoginQuery からログイン中のユーザーを取り、管理者 (isAdmin。サーバーが role が admin のときに付ける) でなければ何も描かない。管理者なら包まれる画面 (children) を、幅を 1320px までに抑える PageBody の中に置くだけ。useLoginQuery はストアにユーザーが無いときだけ POST /api/auth/verify を呼び、トークンを検査して user (と Redis があれば auth:* のセッション) を読み、所属チーム (team と team_user) を読む。ただし外側の (main) の枠の App はストアにユーザーがあるときだけ children を描き、ストアのユーザーを消すのは (main) の外のログアウト画面だけなので、この枠が描かれる時点ではストアに必ずユーザーがある。だからこの入口からはこのリクエストは出ず、ストアのユーザーを使うだけと読める (経路はコードにあるので書いておく)。metadata でタイトルの書式 (%s | Admin | Umami、既定は Admin | Umami) を決める。管理のメニュー (AdminNav) はこの枠ではなく、外側の (main) の枠の SideNav / MobileNav が描く"
