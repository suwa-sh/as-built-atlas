    - { file: "src/app/(main)/MobileNav.tsx", line: 64 }
notes: "(1) 入口は layout (layer: layout) のフレーム 1 つ。children (包まれる管理の画面) と、外側の layout ((main) とルート) は別の入口なので辿らない。(2) useLoginQuery は AdminLayout 自身が呼ぶフックなので、context.md の決まり (同じフックを内側の部品も自分で呼ぶときは内側にも書く。省くのは枠を経由してだけ動くもの) に従って POST /api/auth/verify の先まで書いた。下の (6) で API キーの経路を省いたのは、共有の関数 (checkAuth) の中の、この入口からは通らない枝だからで、部品が自分で呼ぶフックとは扱いが違う。(main) の枠の結果にも同じ経路があるが、それは別の入口なので、この入口の中では重複にならない。リクエストが出るのは enabled: !user (ストアにユーザーが無い) のときだけ (fact)。外側の App はストアにユーザーがあるときだけ children を描き (App.tsx:54 / :81)、ストアのユーザーを消す setUser(null) は (main) の外のログアウト画面 (LogoutPage.tsx:20) にしか無い (他の setUser はログインの画面と useLoginQuery 自身で、どれもユーザーを入れる側) ので、この入口からはリクエストは出ないとコードから読める (実行しての確認はしていない)。react-query のキャッシュの鍵 ['login'] も App と同じ。(3) フレームにしなかったもの: PageBody (見た目だけの部品。error / isLoading を受けると警告や読み込み中を出すが、この枠は渡さないので children を列に入れるだけ。中で useMessages を呼ぶが、翻訳の文言を引くだけ)。(4) 管理のメニュー AdminNav は src/app/(main)/admin/ に置かれているが、この layout からは描かれない。描くのは (main) の枠の SideNav (SideNav.tsx:117) と MobileNav (MobileNav.tsx:64) で、リンクを並べるだけなので (main) の枠の分析で扱っている。(5) cloudMode は next.config の env (next.config.ts:16 / :217) でビルド時に埋め込まれる値。layout.tsx (サーバー側) と AdminLayout (ブラウザ側) の両方で確かめている。(6) ブラウザが付けるトークンは localStorage のログイントークン (src/lib/client.ts:4) で、しかも /api/auth は API キーを拒否するパス (api-key.ts:15) なので、checkAuth の API キーの経路 (api_key の読み書き) は書いていない。共有トークン (parseShareToken) はヘッダーの署名付きトークンを解くだけでデータを読まないので、フレームにしていない。(7) レビューの指摘 1 件 (low) を直した: 「ふつうはリクエストは出ない」を、ストアのユーザーを消すのが (main) の外のログアウト画面だけであることを根拠に「この入口からは出ない」と言い切る書き方に直し、POST /api/auth/verify の call の note にも添えた。あわせて、レビューの所見を受けて ext_prisma_team の根拠から Prisma を呼ばない行 (verify/route.ts:12) を外した"
