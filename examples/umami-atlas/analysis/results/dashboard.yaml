summary:
  status: interpretation
  value: 本人のダッシュボード (利用者 1 人に 1 つの、種類 dashboard のボード) を見る画面。GET /api/dashboard で、id が本人の user の id のボードを読み (持ち主が本人でなければ 401)、保存された行と列に置かれた部品を並べる。部品が 1 つも無ければ「空」の案内だけを出す。上に、最初の部品が指すもの (サイト・ピクセル・リンク) の絞り込みと期間の操作 (WebsiteControls / PixelControls / LinkControls) を出す。各部品は、指すものの名前を GET /api/websites|pixels|links/<id> で読み (401 / 404 なら「もう無い」と出す)、保存された種類 (config.type) に応じて、指標の帯 (stats)、時系列 (pageviews)、表と地図 (metrics)、曜日と時間の表 (sessions/weekly)、イベントの帯と時系列 (events/stats・events/series)、リアルタイム (realtime・active)、収益 (revenue/stats・chart・metrics)、UTM、保存済みのゴールとファネル、自由な文章を描く。どの部品になるかは保存された設定で決まるので、登録にある部品をすべて conditional で書いた。集計の SQL は、CLICKHOUSE_URL の有無で PostgreSQL か ClickHouse のどちらかが動く。各 API はログイン (checkAuth) とサイトを見る権限 (canViewWebsite など) を確かめる。保存 (POST /api/dashboard) の呼び出しも書いてあるが、保存するのは編集の画面 (/dashboard/edit) だけ。編集の画面へのリンクを持つ
