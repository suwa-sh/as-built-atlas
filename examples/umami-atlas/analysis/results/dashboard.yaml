notes: '指示書 0.4.1 とプロファイル 0.4.0 で分析した (入口の一覧に、登録表 boardComponentRegistry の部品 16 件が part の入口として入ったため、分析し直した)。(1) 画面を包む枠 ((main) の layout と、そこから描かれる App / TopNav など) は、別の入口なので辿っていない。書いたのは、page.tsx から描く側だけ。(2) どの部品を描くかは、データベースに保存されたダッシュボードの parameters (行と列と部品の type) で決まる。プロファイルの「登録表から選ばれて描かれる部品」のとおり、登録表を引くフレーム BoardComponentRenderer で止め、部品 16 件を links の embed (target は登録表のキー、entry_id は part_p.boardComponentRegistry.<キー>、状態は interpretation) で書いた。部品の中 (集計の API、問い合わせ、注釈、ゴールやファネルの定義) は、部品の入口で分析する。Metrics bar の、対象の種類ごとの部品 (PixelMetricsBar / LinkMetricsBar) を選ぶ判定は、BoardComponentRenderer の rules に書いた。TextBlock は文字を出すだけで入口ではないので、summary に名前を書いただけ。DashboardProvider と BoardViewColumn も getComponentDefinition で登録表を引くが、定義があるかを確かめるだけで部品を描かないので、embed は書いていない。前の結果では部品の中だけで使っていた設定 (DEFAULT_CURRENCY など)・ルール・権限の確認 (canViewReport など) は、部品の入口の側に移るので、この結果からは消えた。(3) 保存の POST /api/dashboard (と、その先の hasValidBoardReports / getReport / updateBoard / createBoard) を消した。DashboardProvider は保存の関数 saveBoard を文脈で渡すが、呼ぶのは編集の画面の DashboardEditHeader だけで、この入口の木の中には呼ぶ所が無い (boards.boardId_d の結果で、BoardProvider の保存をフレームにしていないのと同じ扱い)。固定の値で閉じている呼び出しとは別の理由 (呼ぶ所が無い) なので、閉じている呼び出しの数には入れていない。(4) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に 1 回だけ書いた。DashboardViewPage.tsx では DashboardProvider (39 行目) が操作 (43 行目) と部品の並び (44 行目) より前なので、認証の経路 (parseRequest → checkAuth → getUser) と getBoard は GET /api/dashboard の下、canViewWebsite → getEntity (getWebsite / getLink / getPixel) と getTeamUser は、操作 (PixelControls) の GET /api/websites/[websiteId]/values の canViewWebsiteSection の下、canViewSharedWebsite は同じ操作の GET /api/websites/[websiteId]/daterange の下になった。この画面には見出しの対象のバッジが無いので、useBoardEntityBadgeProps と BoardEntityBadge / Favicon は、列 (BoardViewColumn) の下が最初の置き場になった。(5) 呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段までもう一度書いた (id に _rw が付くフレーム。このリポジトリの決まりで、external の段までは書かず、確認・設定・ルールも繰り返していない)。GET /api/websites/[websiteId] (バッジと、対象が読めるかの確かめの 2 か所) は、呼び先がすべてほかの置き場にあるので、いちばん早い parseRequest (route.ts:22) から書き直した。canViewPixel / canViewLink の下は、いちばん早い getPixel / getLink を書き直した (前の結果は getTeamUser を書き直していて、レビューで指摘されていた)。(6) 固定の値で閉じている呼び出し (指示書 0.4.1) は 2 種類、4 か所。(a) ExportButton の GET /api/websites/[websiteId]/export (データの書き出し): BoardControls は PixelControls / LinkControls / WebsiteControls に allowDownload を渡さず (BoardControls.tsx:22、24、26)、既定値は false なので、3 つとも ExportButton を描かない。(b) POST /api/websites/[websiteId]/segments/[segmentId] (セグメントの更新): SegmentEditForm を描くのは FilterBar だけで、segmentId を渡さない (FilterBar.tsx:195-200)。GET /api/websites/[websiteId]/values の getWebsiteSegments の枝 (route.ts:48) は迷った: type は、コードに書いた列の一覧 (useFields) か、URL のクエリのうち FILTER_COLUMNS にある名前だけで、どちらにも segment / cohort が無いが、値の一部が URL から来るので、指示書の 3 つの条件の 1 つ目を確かめきれない。そのため閉じている呼び出しとは扱わず、getWebsiteSegments を values の受け口の下に conditional で書き (入口から辿る順で、segments の受け口より先に着く)、成り立たないように見える理由を note に書いた (boards.boardId_d の結果は、この枝をフレームにしていない)。閉じている呼び出しの名前・値・行は、条件を持つフレーム (3 つの操作の部品と SegmentEditForm) の summary に書いた (指示書は「条件を持つフレームの notes に書く」と言うが、フレームの形式に notes が無いので、このリポジトリの決まりのとおり summary に書いた)。状態・保存されたデータ・URL で決まる条件 (URL の /teams/<id>、ボードの種類、イベントのプロパティのタブのパスの条件) は、固定の値ではないので、conditional で書き、成り立たないように見えるものは理由を note に書いた。イベントのプロパティの絞り込み (PropertyFilters の source: event と、その先の event-data/fields・event-data/values) は、前の結果ではフレームにしていなかった (レビューの medium の指摘) が、このリポジトリの決まりに合わせて足した。DashboardProvider の editing の既定値 false、BoardViewBody の showEntityBadges の既定値 true、PixelControls が WebsiteDateFilter に渡す showAllTime={false} は、データに届く呼び出しを閉じないので、数えていない。(7) 操作の部品 (BoardControls から下) と、列の部品 (BoardViewColumn から下) のフレームは、同じコードを通る boards.boardId_d の結果 (指示書 0.4.1、レビュー済み) から、綴りと書き方を写し、置き場だけをこの入口の順に合わせた。GET /api/dashboard の持ち主の確認の値は、dashboard.edit の結果と同じく、肯定の形 (board.userId === auth.user.id) にそろえた (前のレビューの low の指摘)。(8) checkAuth の API キーの経路 (auth.ts:74) は、ブラウザが localStorage のログイントークンを付ける (src/lib/client.ts:4) ので辿っていない。設定 (CLOUD_MODE) にだけ書いた。(9) 画面から API を呼ぶ URL は、環境変数 API_URL が設定されていると (/auth と /config 以外は) その URL に向く。既定で同じリポジトリの route に当たり、URL の形は文字列で読めるので call は fact にした。API_URL と BASE_PATH は、このリポジトリの決まりのとおり、最初に API を呼ぶフレーム useDashboardQuery にだけ書いた。GET /api/config (useConfig) は、決まりのとおりフレームにしていない。(10) テストとの対応は、作業定義で選ばれていないので分析していない。(11) レビューの指摘は 4 件 (medium 1、low 3) で、すべて直した: canViewSharedWebsite の確認 (kind: other) を q_can_view_shared_website に足した。checkAuth の API キーの枝を rules に 1 行足した。canViewWebsite の呼び出しの when を、3 か所とも always (この画面ではいつもログイン済み) にそろえた。Favicon の io の note の「リファラーのドメイン」を「バッジの対象のサイトのドメイン」に直した。high が無いので、もう一度のレビューはしていない。レビューの後に、自分の見直しで 1 点直した: 上の (6) の getWebsiteSegments の枝を、閉じている呼び出しとして辿らない扱いから、conditional のフレームに替えた (フレームの数と読み書きの数は変わらない。q_get_website_segments を segments の受け口の下から values の受け口の下へ移した)。'
