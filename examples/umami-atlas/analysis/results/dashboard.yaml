  - file: src/app/(main)/dashboard/DashboardViewHeader.tsx
    line: 13
notes: '指示書 0.4.0 とプロファイル 0.4.0 で分析した。(1) 画面を包む枠 ((main) の layout と、そこから描かれる部品) は、別の入口なので辿っていない。(2) この画面は、保存されたボードの設定 (部品の種類 config.type) で描く部品が決まる。候補は部品の登録 (boardComponentRegistry.tsx) にある有限の 18 種なので、すべてを BoardComponentRenderer の下に conditional (call は interpretation) で書いた。Text の部品 (TextBlock) はデータを読まないので、フレームにしていない。(3) 部品の下の経路は、同じ関数を分析した、ほかの入口の結果 (websites.websiteId_d、pixels.pixelId_d、links.linkId_d、console.websiteId_d、boards.boardId_d.edit、boards、websites.websiteId_d.funnels、layout_l.main_g.websites.websiteId_d) のフレームを元にし、ボードの文脈に合わない書き方 (ウェブサイトの画面が渡す props や URL の前提) を直した。直した主な点: MetricsTable の type はボードで選んだ値 (METRIC_TYPES のどれでも) なので、metrics の受け口の event の枝 (getEventMetrics) を足し、列を広げた。WebsiteChart はボードから showAnnotations を渡されないので、注釈の API の呼び出しを、成り立たないように見える conditional にした。札と可用性のフック (useWebsiteQuery / usePixelQuery / useLinkQuery) は、部品が指すものの種類が合うときだけ API を呼ぶので conditional にした。リアルタイム・収益・イベントの帯・UTM・ゴール・ファネルの部品は、ほかの結果に無かったので新しく読んで書いた。ゴールとファネルは allowEdit={false} で描かれるので、編集の経路は辿っていない。(4) 同じ関数は、入口から、コードに書いてある順に深さ優先で辿って最初に着いた呼び出し元の下に
  1 回だけ書いた (parseRequest → checkAuth → getUser と getBoard は GET /api/dashboard の下、絞り込みの部品と canViewWebsite / getEntity などは、BoardControls が最初に書く PixelControls の下)。呼び出し元が終端になる所は、いちばん早い呼び先を、読み書きを持つ最初の段まで書き直した (id に _rw が付くフレーム。確認・設定・ルールは繰り返していない)。そのため、LinkControls と WebsiteControls の下の書き直しは長い (絞り込みのボタンから getValues の受け口の parseRequest → checkAuth まで)。(5) この入口からは成り立たないように見える呼び出しも、消さずに conditional で書き、note に理由を書いた: POST /api/dashboard (保存を呼ぶのは編集の画面の見出しだけ)、URL に /teams/<id> があるときの /dashboard への置き換え (next.config.ts のリダイレクトが先に効く)、注釈の GET。(6) 見出し (DashboardViewHeader) は編集の画面へのリンクだけを持ち、データを読まないので、フレームにせず、リンクを DashboardViewPage に書いた。(7) GET /api/dashboard と POST /api/dashboard の持ち主の確認は、確認する関数が無いので、受け口の式をそのまま value に書いた。(8) テストとの対応は、作業定義で選ばれていないので分析していない。(9) 1 回目のレビューの指摘は 16 件 (high 2、medium 2、low 12)。high 2 件 (POST /api/dashboard から書く board の列) を直したので、もう一度レビューした。2 回目の指摘は 15 件 (high 0、medium 2、low 13) で、low 5 件 (説明の文の id と言葉の誤り 4 件、createBoard の updated_at) を直した。直していないもの: (a) medium 2 件 (PixelControls
  などの ExportButton → GET /export、FilterEditForm の PropertyFilters (source: event) → GET event-data/fields)。どちらもこの入口からは成り立たないように見える呼び出し (BoardControls は allowDownload を渡さず、パスは /events で終わらない) で、決まりではフレームにするが、元にした websites.websiteId_d などの結果がこの 2 つをフレームにしておらず、同じ部品の別の引数の経路を足すには組み立てを作り直す必要があるため、今回は summary と note で触れるだけにした。続けて直すかは人が決める。(b) low 1 件 (values の受け口の segment / cohort の枝の getWebsiteSegments) も同じ理由。(c) low 5 件 (stats・metrics の受け口と canViewPixel / canViewLink の下の書き直しが、コードでいちばん早い呼び出しから始まっていない) は、元にした結果の木で、その段の子として書かれていた最初の呼び先を書き直したため。どれも読み書きを持つ段で終わり、終端の決まりは満たす。(d) low 2 件 (GET / POST /api/dashboard の持ち主の確認の綴りが、dashboard.edit の結果は === 、この結果は !==) は、コードの字面 (route.ts:16 / :39) のとおりにしたので、そろえ方は人が決める (analysis-conventions.md に、関数になっていない確認の書き方の決まりが無い)'
