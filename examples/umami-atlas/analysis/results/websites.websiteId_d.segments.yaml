"notes": "[分析し直し (skill 0.4.1)] 入口の一覧に、共有の部品 WebsiteControls が別の入口 part_p.shared_a.WebsiteControls として入ったので、指示書 0.4.1 とこの分析リポジトリの決まり (analysis-conventions.md の「共有の部品」「どの入口にも出る共通の段」) で分析し直した。前の結果 (0.4.0、103 段) を出発点にし、変えた所の根拠の行は対象のコードで確かめた。段は 103 から 85 になった。(a) SegmentsPage (segments_page) で止め、links に embed (target: WebsiteControls、entry_id: part_p.shared_a.WebsiteControls、status: fact。根拠は SegmentsPage.tsx 3 行の import と 10 行の描く行) を書いた。WebsiteControls と、その下の 18 段 (絞り込みの小窓の WebsiteFilterButton → FilterEditForm → SegmentFilters、イベントのプロパティの欄と event-data/fields・event-data/values、not_analyzed で閉じていた WebsiteDateFilter・ExportButton・FilterBar) を外した。小窓の下にあった共通の段 (parseRequest → checkAuth → getUser、canViewWebsite → getEntity / getTeamUser、GET …/segments と getWebsiteSegments、FieldFilters → FilterRecord → values の受け口、PropertyFilters (source: session) と session-data の受け口) は、入口から深さ優先で辿って次に着く呼び出し元の下に移した。event-data の 2 つの受け口は、この画面の残りの木 (フォームの PropertyFilters は source: session だけ) からは着かないので、外した。渡す値 (allowFilter={false}・allowDateFilter={false}。ほかは渡さない) は segments_page の summary に書いた。前の結果の WebsiteControls の rules (共有の設定で絞り込みを出さない) は、部品の入口のものなので、ここからは外した。(b) 固定の値で閉じている呼び出し (指示書 0.4.1): values の受け口から呼ぶ getQueryFilters の、segment / cohort の分かれ道 (request.ts 132〜170 行)。呼ぶ側の useWebsiteValuesQuery がクエリに segment と cohort を付けず、受け口のスキーマもそれを落とすので、この呼び出し元からは閉じている (websites.websiteId_d.cohorts と同じ扱い。ただし関数としては、次の (c) の経路から届くので、summary では「この呼び出し元からは届かない」と書いた)。q_get_query_filters の summary に書き、その分かれ道の業務のルールも q_get_query_filters から外した。(c) 迷った点: 同じ getQueryFilters を、session-data/properties と session-data/values の受け口も呼び、こちらは受け口のスキーマが filterParams (schema.ts 66・67 行で segment と cohort を含む) で、フックが useFilterParameters で画面の URL の segment / cohort を送る (useFilterParameters.ts 35・36 行)。値は入口の外 (URL) から来るので、指示書の 3 つ目の条件 (別の呼び出し元から別の値で着く経路があれば、閉じていない。その経路の下に書く) に当たると読み、session-data/properties の下に getQueryFilters をもう一度フレームにし (q_get_query_filters_rw_session)、その下に getWebsiteSegment を conditional で書いた。segment / cohort の 2 つの decision の rules も、こちらに移した。cohorts の結果は、この画面に session-data の経路が無いので、閉じたとだけ書いている。この形にしたため、getWebsiteSegment は、編集のフォームの GET …/segments/[segmentId] より先に着き、GET …/segments/[segmentId] は終端になるので、前の結果と同じく parseRequest → checkAuth を、もう一度書いた (q_parse_request_rw_segment_get、q_check_auth_rw_segment_get)。(d) values の受け口の、type がセグメントの種類のときの分かれ道 (values/route.ts 48 行の getWebsiteSegments) は、受け口のスキーマの type が fieldsParam (schema.ts 127 行。segment と cohort を含まない) なので、parseRequest が 400 にし、決して着かない (cohorts の結果のレビューで確かめた読み)。前の結果は、ここに getWebsiteSegments を conditional で書き、segment.ts 21 行で例外になると書いていたが、それを外し、受け口の rules を fieldsParam の検査に直した。getWebsiteSegments は、GET …/segments の下に always で書いた。(e) 共通の段は、決まりと合っていることを確かめた: checkAuth は settings に CLOUD_MODE と REDIS_URL、rules に API キーの枝の 1 行を持ち、getUser も書いてある。canViewWebsite・canUpdateWebsite・canDeleteWebsite の guards は、持ち主の確認 (ownership) と別に、管理者の確認 (role、user.isAdmin) を 1 件ずつ持つ。canViewWebsiteSection と canViewSharedWebsiteFilters は、ほかの入口の結果と同じく kind: other。API_URL と BASE_PATH は、前の結果では小窓の下の useWebsiteValuesQuery に書いていたが、この入口で最初に API を呼ぶ use_segments (useWebsiteSegmentsQuery) に移し、1 回だけ書いた。target は作業定義と同じ。[木の書き方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。SegmentsPage の中の順は WebsiteControls (10 行。embed で止める) → SegmentsDataTable (12 行)。SegmentsDataTable の中の順は useWebsiteSegmentsQuery (7 行) → SegmentAddButton (10 行) → SegmentsTable (21 行)。追加のフォームの中の順は useWebsiteSegmentQuery (35 行) → useUpdateQuery (43 行) → FieldFilters (89 行) → PropertyFilters (101 行)。その結果、parseRequest → checkAuth と canViewSharedWebsiteFilters → canViewWebsite → getEntity / getTeamUser は GET …/segments の下、canUpdateWebsite は POST …/segments の下、canViewWebsiteSection と getQueryFilters → fetchWebsite / fetchAccount と getValues は、追加のフォームの FieldFilters → FilterRecord → values の受け口の下、getWebsiteSegment は session-data/properties の下の getQueryFilters の下になった。[前の分析から引き継いだ扱い] (1) SegmentEditForm は同じ関数だが、segmentId の有無で呼ぶ URL が違うので、追加 (segment_edit_form_create) と編集 (segment_edit_form_edit) に分けた。追加のフォームの useWebsiteSegmentQuery は、segmentId が無いので問い合わせをしないが、同じフォームに編集のボタンから segmentId 付きで着く経路があるので、閉じた呼び出しにはせず、編集のフォームの下に書いた (cohorts と同じ)。(2) GET …/segments は getQueryFilters を websiteId なしで呼ぶ (route.ts 31 行) ので、データを読まない。この呼び出しはフレームにせず、受け口の summary に書いた。(3) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (values の受け口の下の canViewWebsiteSection、POST …/segments の下の canUpdateWebsite、DELETE の下の canDeleteWebsite、GET …/segments/[segmentId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(4) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(5) checkAuth の API キーの経路 (checkApiKeyAuth) は、決まりのとおり段にせず、checkAuth の rules に 1 行書いた。GET /api/config (useConfig) はフレームにしていない。(6) 名前が必須であることだけの確認は、rules に書いていない。削除や保存の後の touch('segments') は、ブラウザの中の更新印を書き換えて一覧を読み直させるだけなので、I/O に書いていない。(7) フォームの FieldFilters と PropertyFilters は、showFilters の既定 (true) がいつも効くので always にした。(8) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 [レビュー] 1 回 (high 0、medium 0、low 2)。すべて直した: FilterRecord と PropertyFilterRecord の呼び出しの条件に残っていた「URL に絞り込みがある」(前の小窓での書き方) を、フォームの値 (追加では空、編集では保存済みの定義) に直した。レビューの notes の助言に従い、q_get_query_filters の summary の「固定の値で閉じている呼び出し」を「この呼び出し元からは届かない」に直した。high が無いので、もう一度のレビューはしていない。"
