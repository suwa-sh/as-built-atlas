"notes": "プロファイル 0.4.0・skill 0.4.0 での最初の分析。[作り方] 画面の構成は websites.websiteId_d.cohorts とほぼ同じ (ファイルの差分で確かめた) なので、共通の部品と関数 (認証、権限、segment の読み書き、values・session-data・event-data の受け口と問い合わせ) は、ほかの入口の結果 (websites.websiteId_d.events、websites.websiteId_d.cohorts) の書き方と綴りに合わせ、この画面に固有の文 (どの受け口が同じ関数を呼ぶか、条件が成り立つか) を書き直した。segments の下のファイルの根拠の行は、対象のコードで読み直して付けた。[木の書き方] 同じ処理は、入口から、コードに書いてある順に深さ優先で辿って、最初に着いた呼び出し元の下に書いた。SegmentsPage の中の順は WebsiteControls (10 行) → SegmentsDataTable (12 行)。分析リポジトリの決まり (成り立たないように見える呼び出しもフレームにする。共通の絞り込みの部品 WebsiteFilterButton と、その中のダイアログや入力欄は、打ち切らずにデータまで辿る) に従い、この画面では描かれない WebsiteFilterButton (allowFilter={false}) の中身を辿った。そのため、深さ優先の順で、parseRequest → checkAuth → getUser、canViewWebsiteSection → canViewWebsite → getEntity / getTeamUser、getWebsiteSegments、getQueryFilters → fetchWebsite / fetchAccount / getWebsiteSegment、getValues は、絞り込みの小窓の FieldFilters → FilterRecord → values の受け口の下になった。一覧のフック useWebsiteSegmentsQuery と GET …/segments も、小窓の SegmentFilters の下 (フレーム use_segments) になり、SegmentsDataTable の summary から指した。セグメントのフォームの FieldFilters と PropertyFilters (source: session) も、小窓の下のフレーム (field_filters、property_filters) を指した。API_URL と BASE_PATH は、決まりのとおり、この入口で最初に API を呼ぶフレーム (use_values) に 1 回だけ書いた。[迷った点と選んだ扱い] (1) 描かれない WebsiteControls の子のうち、WebsiteDateFilter・ExportButton・FilterBar は、決まりが「打ち切らずに辿る」と名指す部品 (WebsiteFilterButton と、その中) に当たらないので、cohorts と同じく conditional のフレームにして unknown + not_analyzed で閉じた (note に、どこまで読んだかと止めた理由を書いた)。FilterBar を辿ると、その中の SegmentEditForm と GET …/segments/[segmentId] が、追加・編集のボタンより先に着いて、木の形が変わる。MonthFilter はデータにも API にも届かないので、フレームにしていない。(2) values の受け口の、type がセグメントの種類のときの枝 (getWebsiteSegments、values/route.ts:48) は、この画面の絞り込みの行からは成り立たないように見えるが、決まりに従い conditional のフレームにした。深さ優先の順では GET …/segments より先に着くので、q_get_website_segments はこの枝の下にある。(3) FilterEditForm のイベントのプロパティの欄 (PropertyFilters の source: event) は、パスが /events で終わるときだけで、この画面では成り立たないように見えるが、conditional のフレームにして、event-data/fields と event-data/values まで辿った。(4) Tabs / TabPanel の中の部品 (SegmentFilters、PropertyFilters) を、タブを選ぶまで描くかどうかは UI ライブラリの動きで、リポジトリからは読めない。コードの条件だけを見て always にし、note に書いた。(5) SegmentEditForm は同じ関数だが、segmentId の有無で呼ぶ URL が違うので、追加 (segment_edit_form_create) と編集 (segment_edit_form_edit) に分けた。追加のフォームでも useWebsiteSegmentQuery を呼ぶが、segmentId が無いので問い合わせをしない (enabled が false) ため、届く先のある編集のフォームの下にフレームを書いた (cohorts と同じ扱い)。(6) 絞り込みの行からの getValues は、小窓 (event を除く) とセグメントのフォーム (exclude なし) の両方から届くが、読む表は同じなので 1 つのフレームにし、fields に両方で選べる列を並べた (event_name はフォームからだけ)。(7) 呼び先がすべてほかの呼び出し元の下にあって終端になるフレーム (canViewSharedWebsiteFilters、canUpdateWebsite、canDeleteWebsite、GET …/segments/[segmentId]) は、いちばん早い呼び先を、読み書きを持つ最初のフレーム (getWebsite か checkAuth) まで、もう一度書いた。もう一度書いたフレームには、権限の確認・設定・ルールを重ねて書いていない。(8) ライブラリを呼ぶ同じ行 (prisma.ts 746 行の $queryRawUnsafe、clickhouse.ts 721 行の query、redis.ts 37 行の get) は、呼び出し元ごとに読む表やキーが違うので、呼び出し元ごとに書いた。(9) checkAuth の API キーの経路 (checkApiKeyAuth) は、決まりのとおり段にせず、checkAuth の rules に 1 行書いた。GET /api/config (useConfig) はフレームにしていない。(10) 名前が必須であることだけの確認は、rules に書いていない。削除や保存の後の touch('segments') は、ブラウザの中の更新印を書き換えて一覧を読み直させるだけなので、I/O に書いていない。(11) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。 [レビュー] 指摘は 4 件 (medium 2、low 2) で、すべて直した: team の読み取りを fact にした。values の受け口のセグメントの種類の枝が、filters を渡さないため segment.ts:21 で例外になることを、受け口の summary・ルール・getWebsiteSegments の呼び出しの note に書いた。getWebsiteSegments の並べ替えの note を、この入口では orderBy が渡らない、に直した。GET …/segments に、いつも 1 ページ目の 20 件を返すルールを足した。high が無いので、もう一度のレビューはしていない。"
