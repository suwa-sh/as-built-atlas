"summary":
  "status": "interpretation"
  "value": "1 つのサイトの保存済みセグメント (絞り込みの条件に名前を付けたもの) の一覧画面。サーバー側の page は URL の websiteId を SegmentsPage に渡すだけで、画面の本体はブラウザ側で動く。SegmentsDataTable が GET /api/websites/<id>/segments?type=segment で、type が segment の segment を読んで表にする (受け口のスキーマが page を落とすので、いつも最初の 20 件。search で名前を絞れる)。追加のフォームは segment を作成 (POST …/segments)、行の編集のフォームは segment を読んで (GET …/segments/<id>) 更新 (POST …/segments/<id>)、行の削除のボタンは segment を削除 (DELETE …/segments/<id>) する。フォームの絞り込みの欄は、値の候補を GET …/values (website_event、PostgreSQL ではセッションの列なら session) から、セッションのプロパティの名前と値を GET …/session-data/properties と …/session-data/values (website_event と session_data) から読む。session-data の受け口は、画面の URL に segment / cohort があれば、保存済みの定義 (segment) も読む。統計の問い合わせは、CLICKHOUSE_URL の有無で PostgreSQL 用と ClickHouse 用のどちらかが動く。どの受け口も parseRequest → checkAuth で認証し (user。REDIS_URL があれば Redis の auth:*)、権限の確認で website / share / link / pixel / board / team_user を読む。values などの受け口は期間を決めるときにサイトの情報を読み、REDIS_URL があれば Redis の website:* に読み書きする (CLOUD_MODE で個人のサイトなら account:* も読む)。書き込みは、管理者・サイトの持ち主・チームで website:update を持つ人 (作成・更新)、website:delete を持つ人 (削除) だけができる。行の名前は、そのセグメントで絞ったサイトの画面 (/websites/<id>?segment=<id>) へのリンク。上部の WebsiteControls は、多くの画面が描く共有の部品で、別の入口 (part_p.shared_a.WebsiteControls) にしたので、この入口では辿らない (embed のつながりだけを書く)。この画面は、絞り込みと期間の選択を false で渡し、ほかの操作も渡さないので、部品は何も出さない"
