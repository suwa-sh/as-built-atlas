notes: "(1) 2 回目のレビュー。レビューした版は analyzed_at 2026-11-19T06:05:32Z (フレーム 76)。1 回目の指摘 3 件 (high 1、medium 1、low 1) は、どれも正しく直っていた。引き継ぐ指摘は無い。(2) high と medium の直し: sdk_plugin_documentation のフレームは消えており、ほかの場所に、消したフレームの id や GET /api/v1/plugins/{cls} の参照は残っていない。yaml_language_configurator の note の (d) の行番号は、どれも対象のコードと合っていた (yamlLanguageConfigurator.ts 627 行の loadOutputProperties、628・629 行の登録、pebbleDefinitionProvider.ts 214 行の flow- の条件、249 行と pebbleHoverProvider.ts 131 行の flowSymbolsAtPosition、useKsEditor.ts 165 行の接頭辞と 300 行の URI、InputsForm.vue 299〜306 行の YAML のエディタが schemaType を渡さないこと)。loadOutputProperties を使うのは、定義と吹き出しの 2 つの仕組みだけ (symbolsDeclaring を通る) で、ほかの呼び出し元は無いことを grep で確かめた。この入口の中のほかのエディタ (Curl は shell、WebhookCurl と InputsForm の JSON は json) も yaml の言語ではない。summary の「plugins.load は 349 行の経路だけ」と、store_plugins_load の condition と根拠 (343、345、349 行) と、note の「版を指定しない呼び出しは手前で弾かれる」(plugins.ts 391〜393 行、yamlLanguageConfigurator.ts 344〜345・351 行) も、コードと合っていた。範囲の中で版を渡さずに plugins.load を呼ぶほかの場所 (flowAutoCompletionProvider.ts 219 行など) は、configure_language の note のとおり、schemaType で閉じたフローの補完の側か、この入口から着かない部品だった。(3) low の直し: まとめての無効化・有効化・削除の 6 フレームの call の根拠に、toast.confirm の行 (useFlowsBulkActions.ts 65、83、94 行) と、承けたときに関数を呼ぶ行 (toast.ts 51、55 行)、runBulkAction の行 (useBulkAction.ts 22、23 行) が入っており、行の中身も合っていた。(4) 指摘にしなかった細かい点: 結果の notes の (2) の「実行の小窓 FlowRun 以下の 38」は、フレームを 1 つ外した後の数え直しが漏れているように見える (flow_run から最後までのフレームは 37)。数の目安だけなので、指摘にしなかった。補完の 349 行の経路は、monaco-yaml の既定の補完 (スキーマの無いモデル) が null を返さないことを前提にしている。monaco-yaml の中は範囲の外なので、call を interpretation にしている今の書き方でよいと判断した (1 回目のレビューでも、この経路は認めている)。"
