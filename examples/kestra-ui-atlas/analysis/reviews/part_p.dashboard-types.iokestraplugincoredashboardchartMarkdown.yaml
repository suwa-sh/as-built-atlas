notes: "(1) 根拠の行は、すべて開いて主張を支えることを確かめた (Markdown.vue 全体、useDashboards.ts 18-119、chartLoadQueue.ts 1-32、stores/dashboard.ts 66 / 280-298、override/utils/route.ts 15-19、types.ts 18、SDK の Dashboards.gen.ts:28 と sdk.gen.ts:851、dashboard-types.ts:13)。(2) 前のレビューの 2 件 (応答の fields に description が無い) は、どちらも description が足されて直っている。total を残しているのは analysis-conventions.md の『チャートの応答の fields』の決まり (応答の型 ChartResults の項目を書く) どおりなので、指摘にしない。(3) includeHooks に固定の値 false を渡して onMounted の generate を閉じた扱いは、値が木の中のコード (Markdown.vue:38) に直接書いてあり、条件 (useDashboards.ts:116) がその値だけで決まり、この木で useChartGenerator を呼ぶのは 38 行だけなので、条件を満たす。use_chart_generator の summary の note に、閉じている値と行が書いてある。generate 自体は getData (Markdown.vue:43) からも呼ばれ、store の 2 フレームは落ちていない。(4) showDefault と CHART_RESULTS_KEY の provide は描く側の値なので、両方の API を conditional で辿っているのは、context.md と analysis-conventions.md の部品の決まりどおり。条件に source.type の分岐も書いてある。(5) ダッシュボードの id が無い・チャートの定義が無いときに投げる確認 (useDashboards.ts:90、96) は、入力の誤りで打ち切る経路なので、条件に入れていなくても、when の当てはめとして問題ない。(6) store の呼び出しの call.status が interpretation なのは、待ち行列を通した複数の実行時の値の組み合わせの条件なので妥当とし、Table の結果とも同じ。(7) 名前と URL の綴り (dashboard.generate、dashboard.chartPreview、@kestra-io/kestra-sdk useClient().post、@kestra-io/kestra-sdk/dashboards previewChart、2 つの API の path、CHART_RESULTS_KEY、IGNORED_FILTERS_INJECTION_KEY、route.query、route.fullPath、globalFilter、chartId) は、Table の結果、dashboards.dashboard_o.yaml、flows.yaml と一致している。"
