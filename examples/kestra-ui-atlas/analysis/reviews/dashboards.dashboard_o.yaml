    claim: "context.md の「値の変化を見張って動く処理」は caller を「見張っている値を変える側のフレーム」と決めているが、watch_route の caller は、見張りを登録したファイルのフレーム dashboard になっている。見張る値 route.params.dashboard / route.params.tenant を変えるのは URL (フレーム route が渡す段) と load の router.push / router.replace で、Dashboard.vue のフレーム自身ではない。"
