  name: Kestra UI             # 画面の見出しに出す表示名 (任意。省略すると repo の最後の区切りより後ろ)
  clone_path: ../kestra
  scope: ui                          # 分析範囲 (clone_path からの相対)
  commit: 28867c6f0ef22f14610c8230406c24bcb35ec13a             # 固定する対象コミット
profile:
  id: ui-vue-router
  dir: .abatlas/profiles/ui-vue-router   # build / validate / enumerate が読むプロファイル。layer などを自分用に直すなら analysis/profiles/ui-vue-router に写して、ここを書き換える (.abatlas/ は upgrade で置き換わる)
analysis:
  models:
    analyze: opus
    review: opus
