format_version: 1
target:
  repo: github.com/kestra-io/kestra
  name: Kestra UI
  clone_path: ../kestra
  scope: ui
  commit: 28867c6f0ef22f14610c8230406c24bcb35ec13a
profile:
  id: ui-vue-router
  version: 0.4.0
extractors:
- name: vue-routes
  run: abatlas-extract ast
  layer: screen
  rationale: 画面の定義は src/routes/routes.ts の `const routes = [...]` だけにある (main.ts が
    initApp に渡し、utils/init.ts が createRouter に渡す)。 同じフォルダの *.spec.ts はテストなので、files
    をこの 1 ファイルに絞った。 全部の画面の先頭に付く、省ける段 `:tenant?` は segments.drop で落とした (`/` だけの root
    は (root) になる)。
  params:
    files:
    - src/routes/routes.ts
    language: typescript
    rule:
      kind: object
      inside:
        kind: array
        inside:
          kind: variable_declarator
      all:
      - has:
          kind: pair
          all:
          - has:
              field: key
              regex: ^name$
          - has:
              field: value
              kind: string
              pattern: $NAME
      - has:
          kind: pair
          all:
          - has:
              field: key
              regex: ^path$
          - has:
              field: value
              kind: string
              pattern: $PATH
    fields:
      path: '{PATH}'
      name: '{NAME}'
      attributes:
        route_name: '{NAME}'
        route_path: '{PATH}'
    segments:
      drop:
      - ^:tenant\?$
      empty: (root)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^:([A-Za-z0-9_]+)(\(.*\))?[?*]$
        with: \1_o
      - pattern: ^:([A-Za-z0-9_]+)(\(.*\))?\+?$
        with: \1_d
      - pattern: ^\(root\)$
        with: root_r
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    unresolved:
      any:
      - kind: identifier
        inside:
          kind: array
          inside:
            kind: variable_declarator
      - kind: spread_element
        inside:
          kind: array
          inside:
            kind: variable_declarator
      - kind: call_expression
        inside:
          kind: array
          inside:
            kind: variable_declarator
      - kind: pair
        all:
        - has:
            field: key
            regex: ^(name|path|children)$
        - not:
            has:
              field: value
              kind: string
- name: agent-listed-screen
  run: abatlas-extract listed
  layer: screen
  rationale: routes の配列に、別のファイルで定義した画面が 2 つ (FLOW_ROUTE、EXECUTION_ROUTE) と、name を定数で書いた画面が
    1 つある。 構文を読む抽出器は、文字で書いた name と path しか取れない。path は、vue-routes と同じく先頭の `:tenant?`
    を落として書いた。
  params:
    entries:
    - id: flows.edit.namespace_d.id_d
      path: /flows/edit/:namespace/:id
      source:
        file: src/components/flows/flowTabs.ts
        line: 149
      reason: src/routes/routes.ts:36 の routes の配列に FLOW_ROUTE として入っている。定義はこのファイルにあり、
        path は "/:tenant?/flows/edit/:namespace/:id" (文字)、name は定数 FLOW_PARENT_ROUTE
        = "flows/update"。 別のファイルの定義を名前で並べているので、抽出器では取れない。children (タブ) は、この画面に含める
    - id: executions.namespace_d.flowId_d.id_d
      path: /executions/:namespace/:flowId/:id
      source:
        file: src/components/executions/executionTabs.ts
        line: 107
      reason: src/routes/routes.ts:44 の routes の配列に EXECUTION_ROUTE として入っている。定義はこのファイルにあり、
        path は "/:tenant?/executions/:namespace/:flowId/:id" (文字)、name は定数 EXECUTION_PARENT_ROUTE
        = "executions/update"。 別のファイルの定義を名前で並べているので、抽出器では取れない。children (タブ) は、この画面に含める
    - id: namespaces.edit.id_d
      path: /namespaces/edit/:id
      source:
        file: src/routes/routes.ts
        line: 70
      reason: routes の配列の直下の route。path は "/:tenant?/namespaces/edit/:id" (文字) で、component
        は Namespace.vue。 name を定数 NAMESPACE_PARENT_ROUTE (= "namespaces/update"、src/utils/namespaceTabRoutes.ts:3)
        で書いているので、抽出器の規則に当たらない。 children (createNamespaceTabRoutes() が作る 16 個のタブ) は、この画面に含める
- name: agent-listed-shell
  run: abatlas-extract listed
  layer: shell
  rationale: 'アプリ全体の枠は、抽出器が拾わない (プロファイルの決まり)。根のコンポーネント、レイアウト 2 つ、枠が描く共通の部品 8 つ、ルーターの共通の
    guard を足した。 共通の部品は、プロファイルの版 0.2.0 の決まりで、部品ごとに別の入口にした (App.vue が描く 5 つ、DefaultLayout
    が描く 3 つ。LeftMenu は OnlyLeftMenuLayout も描く)。 枠が描く部品のうち、API にも外部への送信にも至らないことを確かめて、入口にしていないもの:
    DocIdDisplay (App.vue:2。doc の store の状態を出すだけ)、ServerUnreachableBanner (App.vue:4。画面の中の状態を出すだけ)、SdkDriftBanner
    (App.vue:5。開発のビルドだけで描かれ、window のイベントを聞くだけ)、VersionUpgradeNotice (App.vue:6。misc
    の store に読み込み済みの設定と localStorage を見るだけ)、UnsavedChangesDialog (App.vue:17。画面の中の状態だけ)、PwaInstallPrompt
    (App.vue:20。ブラウザのインストールの確認だけ)、RouteTabsSidebar (DefaultLayout.vue:3。routeTabs
    の store に入ったタブへのリンクと、ツアーへのリンクを出すだけ)、Errors (DefaultLayout.vue:5 と OnlyLeftMenuLayout.vue:4。固定の文言と画像だけ)。
    FullScreenLayout (src/components/layout/FullScreenLayout.vue。setup と login の meta.layout)
    は、<router-view> を div で包むだけで、 store も API も呼ばないことを確かめたので、入口にしていない。root の meta.layout
    ({template: "<div />"}) も、同じ理由で入口にしていない。'
  params:
    entries:
    - id: shell_s.part.ErrorToast
      path: /(shell)/part/ErrorToast
      source:
        file: src/components/ErrorToast.vue
        line: 1
      reason: src/App.vue:3 が、テンプレートに直接書いて描く共通の部品 (エラーの通知)。エラーを出すたびに apiStore.events
        (ErrorToast.vue:89) を呼び、利用状況を外へ送る。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.AppTopNavBar
      path: /(shell)/part/AppTopNavBar
      source:
        file: src/components/layout/AppTopNavBar.vue
        line: 1
      reason: src/App.vue:8 が、テンプレートに直接書いて描く共通の部品 (上のバー)。GlobalSearch、AiMenuIcon、NotificationBell
        (AppTopNavBar.vue:33、50、52) を描き、NotificationBell が notifications の store から通知の
        API を呼ぶ。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.TourOverlay
      path: /(shell)/part/TourOverlay
      source:
        file: src/components/onboarding/tour/TourOverlay.vue
        line: 1
      reason: src/App.vue:16 が、テンプレートに直接書いて描く共通の部品 (製品のツアー。App.vue:60 の defineAsyncComponent
        で読み込む)。useOnboardingAnalytics (TourOverlay.vue:164) が計測を外へ送り、ツアーの操作が flow
        や実行の API を呼ぶ。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.ReauthDialog
      path: /(shell)/part/ReauthDialog
      source:
        file: src/components/ReauthDialog.vue
        line: 1
      reason: src/App.vue:18 が、テンプレートに直接書いて描く共通の部品 (再ログインの小窓)。submitReauth (ReauthDialog.vue:65
        で import) が、ログインの API を呼ぶ。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.DrillDownDrawer
      path: /(shell)/part/DrillDownDrawer
      source:
        file: src/components/dashboard/DrillDownDrawer.vue
        line: 1
      reason: src/App.vue:19 が、テンプレートに直接書いて描く共通の部品 (ダッシュボードの掘り下げの引き出し)。開いたときに、掘り下げ先の検索
        (DrillDownDrawer.vue:90) と LogsWrapper (同 9) が、実行・flow・ログの API を呼ぶ。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.LeftMenu
      path: /(shell)/part/LeftMenu
      source:
        file: src/override/components/LeftMenu.vue
        line: 1
      reason: src/override/components/layout/DefaultLayout.vue:2 と src/components/layout/OnlyLeftMenuLayout.vue:2
        が、テンプレートに直接書いて描く共通の部品 (左のメニュー)。2 つの枠が描くが、入口は 1 件にした。Auth (LeftMenu.vue:14)
        のログアウトが BasicAuth.logout を、パスワード変更の小窓が miscStore.changeBasicAuth (ChangePasswordDialog.vue:122)
        を呼び、ProductTourItem (LeftMenu.vue:11) が描かれたときに flow の検索 (tourVariant.ts:35
