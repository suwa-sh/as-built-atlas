        line: 1
      reason: src/override/components/layout/DefaultLayout.vue:10 が、テンプレートに直接書いて描く共通の部品
        (ログインの後のアンケート)。答えを apiStore.posthogEvents (SurveyDialog.vue:161) で外へ送る。route
        の定義ではないので、抽出器では取れない
    - id: shell_s.app
      path: /(shell)/app
      source:
        file: src/App.vue
        line: 1
      reason: src/main.ts:33 の createApp(App) に渡している根のコンポーネント。miscStore.loadConfigs()、docStore.initResourceUrlTemplate()、
        apiStore.loadFeeds() を呼び、AppTopNavBar などの共通の部品を描く。route の定義ではないので、抽出器では取れない
    - id: shell_s.layout.DefaultLayout
      path: /(shell)/layout/DefaultLayout
      source:
        file: src/override/components/layout/DefaultLayout.vue
        line: 1
      reason: src/App.vue:10 が、route の meta.layout が無いときに描く既定のレイアウト。LeftMenu (Auth
        の中のパスワード変更が miscStore.changeBasicAuth を呼ぶ) と、 ContextDrawer (通知の一覧が notifications
        の store から SDK を呼ぶ) を描くので、データを読み書きする。route の定義ではないので、抽出器では取れない。 迷った点 (版 0.2.0)。描いている部品
        (LeftMenu、ContextDrawer、SurveyDialog) を別の入口 (shell_s.part.*) にしたので、このファイル自身は
        layout の store と localStorage を使うだけで、API を呼ばない。部品を分けた後も入口に残すかが、プロファイルから決められないので、入口のままにした
        (承認のときに、人が外せる)
    - id: shell_s.layout.OnlyLeftMenuLayout
      path: /(shell)/layout/OnlyLeftMenuLayout
      source:
        file: src/components/layout/OnlyLeftMenuLayout.vue
        line: 1
      reason: src/routes/routes.ts:92 の docs/view が meta.layout に指定しているレイアウト。LeftMenu
        を描き、その中の Auth のパスワード変更が miscStore.changeBasicAuth を呼ぶので、データの書き込みに至る。route
        の定義ではないので、抽出器では取れない。 迷った点 (版 0.2.0)。描いている部品 (LeftMenu) を別の入口 (shell_s.part.LeftMenu)
        にしたので、このファイル自身は layout の store を使うだけで、API を呼ばない。部品を分けた後も入口に残すかが、プロファイルから決められないので、入口のままにした
        (承認のときに、人が外せる)
    - id: shell_s.guard
      path: /(shell)/guard
      source:
        file: src/utils/eventsRouter.ts
        line: 35
      reason: 'ルーターの共通の guard を 1 件にまとめた入口。データを読む・外へ送る guard は 3 つ。登録の場所は: src/utils/eventsRouter.ts:35
        の afterEach (apiStore.events が利用状況を外へ送る)、 src/utils/init.ts:58 の beforeResolve
        (src/main.ts:106 の関数を、main.ts:171 で initApp に渡している。miscStore.loadLoginConfig
        / loadBasicAuthValidationErrors / loadConfigs)、 src/utils/init.ts:63 の entityNotFoundGuard
        (定義は src/utils/routeEntityGuard.ts:55。route の meta.entity が store の読み込みを呼ぶ)。
        source は、プロファイルの決まり (登録している行のうち、ファイルのパスの辞書順でいちばん早いファイルの、いちばん小さい行) で、eventsRouter.ts:35
        にした。データを読まない guard の登録 (init.ts:48、49、52、55、69、src/utils/kestraHttp.ts:300
        と 305、src/utils/unsavedChange.ts:23、src/composables/useRestoreUrl.ts:78) は、数えていない。route
        の定義ではないので、抽出器では取れない'
