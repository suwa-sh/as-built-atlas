        (右の引き出し)。useContextButtons (ContextDrawer.vue:58) が並べるタブ (src/override/composables/contextButtons.ts:24-27
        の ContextNews、ContextDocs、ContextNotifications、CopilotChat) を描き、文書の読み込み (doc
        の store の fetchResource) や通知の API を呼ぶ。route の定義ではないので、抽出器では取れない
    - id: shell_s.part.SurveyDialog
      path: /(shell)/part/SurveyDialog
