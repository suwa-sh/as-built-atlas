    6 項目すべてが useChartGenerator (src/components/dashboard/composables/useDashboards.ts:93
    の dashboardStore.generate) でチャートのデータの API を呼ぶ (Markdown は、source.type が FlowDescription
    のときだけ)。データに届く部品が 3 つ以上なので、プロファイルの決まりで、項目 1 つ = 入口 1 件にした。 どの項目も、route の component
    ではない。 登録表に当てはめなかった、近い対応表: src/components/no-code/components/tasks/getTaskComponent.ts:12
    の import.meta.glob("./Task*.vue") (flow の編集の入力欄。キーは、保存された値ではなく、サーバーが返すプラグインの schema
