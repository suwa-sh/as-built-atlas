    の cellComponents と executionTabsExtension.ts:14 の secondaryActionComponents (OSS
    では中身が空)、src/components/dashboard/sections/Table.vue:40 の resolvedComponent (表の列の名前で引くセルの見た目だけ)。
    id は、キー (クラスの完全な名前) から記号 (.) を除いたもの。登録表の名前の - は、画面の id と同じく残した'
