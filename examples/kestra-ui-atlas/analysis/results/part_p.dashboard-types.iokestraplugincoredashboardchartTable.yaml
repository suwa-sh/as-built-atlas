summary:
  status: interpretation
  value: "ダッシュボードの登録表 TYPES で、チャートの種類 io.kestra.plugin.core.dashboard.chart.Table に割り当てた部品 (sections/Table.vue)。useChartGenerator の generate でチャートのデータを取り、表示するチャートの定義の列 (data.columns) ごとに表の列を作って行を出す。列の field で、セルを描く小さい部品 (Link、Namespace、KsExecutionStatus、Duration、Date) を選び、フローの画面・実行の画面・名前空間の画面・状態で絞った実行の一覧へのリンクを出す。データの元が Executions で STATE の列を持つチャートでは、状態のタブ (すべて、実行中、一時停止、成功、警告、失敗) を出し、選んだタブの状態の絞り込みを足して取り直す。描く側が showDefault を真で渡したときは、有効なトリガーを次の実行の日時の順に並べる固定のチャートの定義に替える「予定」のタブも出す。チャートの設定でページ分けが有効なら、ページ番号と件数を送り、ページを替えると取り直す。データの取り方は描く側が渡す値で分かれる: データを先に持つ親 (CHART_RESULTS_KEY) が provide していればそれを使い API を呼ばない。そうでなく showDefault が偽なら、保存されたダッシュボードのチャートのデータ (POST /api/v1/main/dashboards/{id}/charts/{chartId}) を、真なら、チャートの定義を送るプレビュー (POST /api/v1/{tenant}/dashboards/charts/preview) を呼ぶ。描かれたとき、画面の URL が変わったとき、描く側が refresh を呼んだとき、タブやページを替えたときに読み直す。"
  evidence:
    - { file: src/components/dashboard/dashboard-types.ts, line: 15 }
    - { file: src/components/dashboard/sections/Table.vue, line: 187 }
