notes: "(1) 部品の入口なので、描く側 (Sections.vue が TYPES[chart.type] で引いて描く) は辿らず、描く側から受け取る props (dashboardId、chart、filters、showDefault)、inject される値 (CHART_RESULTS_KEY、IGNORED_FILTERS_INJECTION_KEY)、URL の値 (route.query、route.fullPath、route.params.tenant) を、入口のフレームの parameters に書いた (analysis-conventions.md と Markdown の結果と同じ扱い。route.params.tenant は、状態で絞った実行の一覧へ移るときに useStateFilter が読む)。(2) Table.vue:40 の <component :is=resolvedComponent(...)> で描くセルの部品 (Link、Namespace、KsExecutionStatus、Duration、Date) は、どれも API を呼ばない (Date.vue と Duration.vue は書式と経過の計算だけ) ので、フレームにせず、入口の summary に名前を書いた。部品の中の画面の移動 (Link.vue の flows/update と executions/update、Namespace.vue の namespaces/update、KsExecutionStatus の onClick で呼ぶ useStateFilter の executions/list) は、context.md の「フレームにしない子の部品や composable の中の、画面の遷移」に従い、入口のフレームの links に、部品の中の行を根拠にして書いた。どの列が描かれるかは保存されたチャートの定義の列で決まるので、links は interpretation にした。(3) 状態のタブの部品 TableQuickFilter と、表の部品 KsDataTable は、利用者の操作を emit で親へ返すだけ (TableQuickFilter.vue:56、Table.vue:3、Table.vue:25) で、API を呼ぶのは Table.vue の同じファイルの補助の関数 (onQuickFilterChange、handlePageChange → getData) なので、context.md の「子が emit で知らせ、同じファイルの補助の関数が受けるとき」に従い、どちらもフレームにせず、知らせる行と受ける関数の行を store の呼び出しの根拠に入れた。(4) 届かない呼び出しの扱い (skill 0.4.2 の表): Table.vue:187 が useChartGenerator の includeHooks に固定の値 false を直接書いて渡すので、描かれたときに generate を呼ぶ処理 (useDashboards.ts:116) は、表の 1 (固定の値で閉じている) に当たる。この部品の木の中で useChartGenerator を呼ぶのは Table.vue:187 だけなので、ほかに開いている経路は無い。フレームは減らない (描かれたときの読み込みは route.fullPath の immediate の watch から同じ generate を通る) が、useChartGenerator の summary の note に書いた。(5) 2 つの store の呼び出しは、showDefault と CHART_RESULTS_KEY がどちらも描く側の値 (表の 3) なので、両方を conditional にした。「予定」のタブは showDefault が真のときだけ出る (Table.vue:96) ので、予定のチャートの定義 (quickFilters.ts:65) はプレビューにだけ送られる。showDefault は描く側から来る値なので、閉じた扱いにせず、プレビューの I/O の note と generate の呼び出しの note に書いた。Table.vue:199 が generate の customFilters に固定の undefined を渡すので、絞り込みはいつも props の filters と URL のクエリから作る (呼び出しの分かれ道ではないので、useChartGenerator の summary に書いた)。(6) route.fullPath の watch (immediate) は、入口のファイルの中の見張りで、呼ぶ先が同じファイルの補助の関数 (refresh → getData) なので、別のフレームにせず、store の呼び出しの根拠に watch の行を入れた (analysis-conventions.md のとおり)。(7) ページの件数は sessionStorage に覚える (Table.vue:164-172) が、ブラウザの中の保存なので I/O に書かず、入口のフレームの summary に書いた。遅れて返った古い応答を捨てる処理 (Table.vue:191-200) も summary に書いた。(8) 応答の fields には、応答の型 ChartResults の項目 (results、total、ignoredFilters) と、部品のコードが固定の名前で読む行の項目 (行の鍵の id、Duration に渡す start_date) を書いた。プレビューには、予定のチャートの定義が固定の名前で決める列 (namespace、flowId、triggerId、next_execution_date) も書いた。保存されたダッシュボードの API の id は、URL のダッシュボードの id (filter) と、行の id (read) が同じ綴りなので、1 つの項目に filter と read を並べた。(9) ダッシュボードの id が無い・チャートの定義の本文が無いときに例外にする確認 (useDashboards.ts:90、96) は、値の有無の確認なので rules に書かなかった。(10) 接続先の設定 (VITE_APP_API_URL、KESTRA_BASE_PATH) は、どの入口でも同じに効く接続の設定なので settings に書かなかった。権限の確認 (guards) は、この部品の経路の上に無い。"
