summary:
  status: interpretation
  value: "フローの一覧の画面。route flows/list (/:tenant?/flows) が Flows.vue を描く。一覧の表は、フローの検索 (GET /api/v1/{tenant}/flows/search) で行を取り、続けて、行のフローごとの最後の実行 (POST /api/v1/{tenant}/executions/latest) を読む。行ごとに、実行の統計のグラフ (別の入口にした部品 TimeSeries。Flows.vue がグラフの定義と期間を作って渡す) と、トリガーのアイコン (GET /api/v1/plugins/icons/{cls}、無ければ api.kestra.io) を出す。上のバーから、CSV の書き出し (GET .../flows/export/by-query/csv) と、ZIP / YAML の取り込み (POST .../flows/import) ができる。行を選ぶと、まとめての書き出し (ZIP)・削除・有効化・無効化を、選んだ行 (by-ids) か、絞り込みに合う全部 (by-query) に対して行う。行の実行のボタンで、PostHog へ計測を送り、実行するフローを読み (GET .../executions/flows/{namespace}/{flowId})、実行の小窓を開く。小窓では、入力の検証 (POST /api/v1/main/executions/{namespace}/{id}/validate)、下書きの公開 (GET / PUT .../flows/{namespace}/{id})、実行の作成 (POST .../executions/{namespace}/{id}) を行い、playground が有効なら、下書きの保存・実行の流れの読み込み・前の実行のやり直し (POST .../executions/{executionId}/actions/replay) も行う。名前空間の絞り込みの候補は POST .../namespaces/autocomplete で読む。行から、フローの詳細 (flows/update)、名前空間の詳細 (namespaces/update)、最後の実行の詳細 (executions/update) へ、上のバーから、ソースの検索 (flows/search) と作成 (flows/create) へ移れる。入れ子の route (children) は無い。"
