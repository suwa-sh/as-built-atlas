notes: "迷った点と、そのとき選んだ扱い。(1) プロファイル 0.4.0 と分析の skill 0.4.2 で分析し直した。前の結果からの主な違いは 3 つ。(a) 実行の統計のグラフ TimeSeries.vue は、入口の一覧で部品の入口 (part_p.dashboard-types.iokestraplugincoredashboardchartTimeSeries) になっているので、プロファイルの決まり (部品の入口にしたコンポーネントを、登録表を通さずに直接描く画面) に従い、中を辿らず、Flows.vue の links に embed (status: fact。根拠は描いている 221 行) で書いた。前の結果の TimeSeries 以下 4 フレーム (useChartGenerator、dashboard.chartPreview、POST .../dashboards/charts/preview) と、棒を押したときの引き出し (DrillDownDrawer) へのつながりは、部品の結果に移るものとして消した。target は、直接描くときに登録表のキーが無いので、Flows.vue が渡すグラフの定義の type (578 行。登録表のキーと同じ文字) にし、dashboards.dashboard_o の結果と綴りをそろえた。グラフの定義・期間の設定 (chartDefaultDuration)・ダッシュボードの閲覧の権限は、Flows.vue のコードにあるので、Flows.vue のフレームに残した。(b) 固定の値で閉じている呼び出しと、手前のコードが弾く呼び出しは、フレームにせず、条件を持つフレームの summary の note に、名前・値・行を書いた (Flows.vue、TriggerAvatar、FlowRun、flow.loadFlow、InputsForm、configureLanguage、YamlLanguageConfigurator、flow.saveAsDraft、executeTask)。(c) flow.validateFlow は、前の結果では下書きの公開から呼ぶ loadFlow の下にあったが、その経路は store: false (flow.ts 263 行) で閉じている (559 行で手前に返る)。開いている呼び出し元は、playground の下書きの保存 (saveAll → onEdit、flow.ts 216・319 行) と、WebhookCurl からの loadFlow (store を指定しない) の 2 つ。入口から辿る順では、FlowRun のテンプレートの 34 行 (InputsForm の confirm → 同じファイルの onSubmit → playground.runUntilTask → flow.saveAsDraft) が、83 行の WebhookCurl より先に着くので、validateFlow とその先を flow.saveAsDraft の下に書き、WebhookCurl の下の loadFlow (store_load_flow_2) の summary に、経路が同じことを書いた。(d) playground の前の実行のやり直し (executions.replayExecution) は、前の結果では「taskId を渡さないので通らない」としていたが、taskId は playground store の actionOptions (store の状態) から渡るので、skill の表の 3 (入口の外から来る値) に当たる。conditional で辿り、やり直しの後のログの読み込み (executions.loadLogs) も足した。(e) YAML の入力のエディタの中のサブフローのリンクを開くと、フローの編集の画面を新しいタブで開くので、YamlLanguageConfigurator の links に navigate を足した。(2) フレームは 76 で、プロファイルの目安 (60) を超えた。分ける候補は、行の実行のボタンから先 (計測の 12、実行するフローの読み込みの 2、実行の小窓 FlowRun 以下の 37)。小窓の中では、YAML の入力のエディタの言語の設定 (configure_language 以下の 8) と、playground の経路 (runUntilTask 以下の 14) が大きい。まとめての操作 (useFlowsBulkActions 以下の 11) も候補。分けるかは、人が決める。(3) 生成された SDK (@kestra-io/kestra-sdk) のソースは範囲 (ui) の中の packages/kestra-sdk/src/openapi にあるので、SDK の関数は external のフレームにして呼び出しの行で閉じ、I/O の path には SDK のソースで読んだ URL を書いた。{tenant} は SDK が入れる段。SDK のクライアントを直接使う validateExecution は、apiUrl() のとおり /api/v1/main を付けて書いた。(4) 表の部品 (KsDataTable) に props で渡す loadData は、プロファイルの決まり (関数を渡して、別の部品が呼ぶとき) に従い、同じファイルの関数だがフレームにした (dashboards.dashboard_o の load・titleSiblings と同じ扱い)。権限の確認 (resource.EXECUTION, action.LIST) は、確認を行っている loadData のフレームに書いた。まとめての削除・有効化・無効化の API は、useBulkAction の runBulkAction に関数として渡して呼ばれるので、プロファイルの決まり (関数を渡して、別の部品が呼ぶとき) に従い、call を interpretation にし、渡す行と呼ぶ行 (useBulkAction.ts 22〜23 行) を根拠にした。caller は、関数を作っている useFlowsBulkActions。(5) 同じ処理が何度も呼ばれるもの: api.posthogEvents は、入口から辿る順で最初の、行の実行のボタン (Flows.vue 634 行) の下に書き、FlowRun の onSubmit と triggerExecution・createFlow からの呼び出しは、summary に書いた。plugins.loadIcon は、TriggerAvatar (Flows.vue 240 行) の下に書き、実行の小窓のエディタ (useEditorBindings) から渡す分は summary に書いた。executions.loadFlowForExecution は、行の実行のボタンの下に書き、下書きの公開の後の読み直しは summary に書いた。executions.triggerExecution は、onSubmit の中で先に書いてある playground の経路 (449 行) の下に書き、executeTask (457 行) の下には、終端にならないように _2 の付くフレームでもう一度書いた。flow.saveFlow と flow.loadFlow は、下書きの公開 (テンプレートの 11 行) の下に書き、playground の経路からの呼び出し (saveAll の 434 行、checkCanReplay の 149 行) は summary に書いた。WebhookCurl (テンプレートの 83 行) の loadFlow は、終端にならないように _2 の付くフレームでもう一度書いた。plugins.load は、補完の 349 行の下に書いた。式の中の outputs の定義・吹き出しから呼ぶ、版を指定しない plugins.load (627 行) と、その先の GET /api/v1/plugins/{cls} は、レビューの指摘 (high) を確かめ、入力のエディタの URI に flow- を含まないので閉じているとして外した。(6) 権限の確認の関数 (src/override/stores/auth.ts の Me) は、この範囲 (OSS 版) ではいつも true を返す。それでも、確認の関数は製品の版ごとに差し替える作りなので、確認で分かれる呼び出し (最後の実行の読み込み) は conditional のままにし、確認は guards に、確認を呼んでボタンや列を出し分ける段 (Flows.vue、FlowRun.vue、namespaceValueProvider、flow.validateFlow) に書いた。value は、isAllowed などに渡している引数を「resource.FLOW, action.VIEW」の形で書いた。hasAny(resource.EXECUTION) は「resource.EXECUTION」と書いた。(7) 絞り込みの設定 (flowFilter.ts 19 行) の、route の名前が namespaces/update でないという条件は、この入口の route の名前 (routes.ts 30 行) で決まるので、いつも成り立つとして always にした (dashboards.dashboard_o の結果と同じ扱い)。(8) 外部 API の fields は、送る項目 (クエリ・パス・本文の名前) と、応答からコードが取り出している項目を書いた。応答をまるごと受け取る呼び出しは * にした。importFlows の failOnError は、取り込みの動きを決める値なので、write と set_to で書いた。(9) PostHog の送り先は、api.kestra.io の応答で決まるので not_traceable_in_repo にした。capturePosthogEvent の設定 isUiAnonymousUsageEnabled は、ここへ着く唯一の経路の sendPosthogEvent (posthogEvents.ts 15 行) が先に弾くので、skill の表の 2 (手前のコードが弾く) として書かず、note に書いた (shell_s.app の結果と同じ書き方)。設定は sendPosthogEvent のフレームに書いた。画面の中の保存 (localStorage、sessionStorage) は I/O に書いていない。(10) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(11) レビュー (別の担当が書いた 1 回目) の指摘 3 件 (high 1、medium 1、low 1) は、対象のコードで確かめ、どれも正しかったので直した (high と medium: 627 行の版を指定しない plugins.load の経路を閉じた枝にした。low: まとめての操作の 6 フレームの根拠に、確かめの小窓の行を足した)。"
