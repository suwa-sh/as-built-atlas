summary:
  status: interpretation
  value: "ダッシュボードの登録表 TYPES で、チャートの種類 io.kestra.plugin.core.dashboard.chart.Markdown に割り当てた部品 (sections/Markdown.vue)。保存されたチャートの定義のデータの元 (chart.source.type) が FlowDescription でなければ、定義に保存された文 (chart.source.content) をそのまま Markdown として出し、API を呼ばない。FlowDescription なら、useChartGenerator の generate でチャートのデータを取り、1 行目の description を Markdown として出す (無ければ「説明が無い」の表示)。データの取り方は描く側が渡す値で分かれる: データを先に持つ親 (CHART_RESULTS_KEY) が provide していればそれを使い API を呼ばない。そうでなく showDefault が偽なら、保存されたダッシュボードのチャートのデータ (POST /api/v1/main/dashboards/{id}/charts/{chartId}) を、真なら、チャートの定義を送るプレビュー (POST /api/v1/{tenant}/dashboards/charts/preview) を呼ぶ。描かれたとき、画面の URL が変わったとき、描く側が refresh を呼んだときに読み直す。"
  evidence:
    - { file: src/components/dashboard/dashboard-types.ts, line: 13 }
