notes: "(1) 部品の入口なので、描く側 (Sections.vue が TYPES[chart.type] で引いて描く) は辿らず、描く側から受け取る props (dashboardId、chart、filters、showDefault)、inject される値 (CHART_RESULTS_KEY、IGNORED_FILTERS_INJECTION_KEY)、URL の値 (route.query、route.fullPath) を、入口のフレームの parameters に書いた。inject と route.query を読むのは useChartGenerator の中だが、analysis-conventions.md と context.md の部品の決まりに従い、入口のフレームに置き、根拠は読んでいる行にした。(2) 2 つの store の呼び出しの条件 (source.type、CHART_RESULTS_KEY の provide、showDefault) は、どれも保存された定義か描く側から来る値なので、skill の『届かないように見える呼び出し』の表の 3 に当たる。両方を conditional にし、条件に 3 つを書いた。(3) Markdown.vue:38 が useChartGenerator の includeHooks に固定の値 false を渡し、描かれたときに generate を呼ぶ処理 (useDashboards.ts:116) は includeHooks だけで決まるので、表の 1 (固定の値で閉じている) に当たる。この部品の木の中で useChartGenerator を呼ぶのは Markdown.vue:38 だけなので、閉じている経路しかない。辿らず、useChartGenerator の summary の note に書いた。(4) generate を引数なしで呼ぶ (Markdown.vue:43) ので、customFilters と pagination は渡らず、絞り込みはいつも props.filters と URL のクエリから作る。(5) route.fullPath の watch (immediate) は、入口のファイルの中の見張りで、中身が同じファイルの補助の関数 (refresh → getData) だけなので、フレームにせず、store の呼び出しの根拠に watch の行を入れた (analysis-conventions.md の決まり)。(6) 404 の応答 (dashboard.generate が handledIf で印を付けて undefined を返す) は、失敗の経路のフレームを持たず、「説明が無い」の表示になるだけなので、summary に書いた。(7) ダッシュボードの id が無い・チャートの定義 (chart.content) が無いときに例外にする確認 (useDashboards.ts:90、96) は、値の有無の確認なので rules に書かなかった。部品が外されたとき (isMounted が偽) に何もしないで返す確認も、業務のルールではないので書かなかった。(8) 接続先の設定 (VITE_APP_API_URL、KESTRA_BASE_PATH) は、どの入口でも同じに効く接続の設定なので settings に書かなかった。(9) 応答の fields は、analysis-conventions.md の決まりどおり、この部品が固定の名前で読む項目 (description) と、応答の型 ChartResults の項目 (results、total、ignoredFilters) を書いた。"
