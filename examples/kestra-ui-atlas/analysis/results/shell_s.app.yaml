notes: "迷った点と、選んだ扱い。(1) 別の入口にした共通の部品 (ErrorToast、AppTopNavBar、TourOverlay、ReauthDialog、DrillDownDrawer) は辿らず、summary に並べた。links には書いていない (embed は、登録表の部品と共有の部品のためのつながりで、枠がいつも描く部品は、プロファイルが「部品の一覧を入口の summary に書く」と決めている)。(2) 同じ処理の書き場所は、入口から、コードに書いてある行の順に、深さ優先で辿って決めた。App.vue の呼び出しは、行の順に、provide で配る trackSavedFilter (76 行)、misc.loadConfigs (88 行)、api.loadFeeds (103 行)、initPosthogIfEnabled (111 行)。88 行から先は、同じファイルの中の補助の関数 loadGeneralResources (87 行。watch の 128 行から呼ぶ) の中にあり、フレームにせず、App.vue のフレームの中の処理として扱った。その結果、PostHog の経路 (api.posthogEvents から先) は、最初に着く trackSavedFilter の下に書いた。(3) api の store は、misc の store の configs を watch で見張り、変わると flushQueuedEvents を動かす (src/stores/api.ts 89 行)。context.md の「値の変化を見張って動く処理」の決まりに従い、configs を変える misc.loadConfigs の下にフレームを書いた。ためるのは、設定が入る前に呼ばれた api.events (ほかの入口の処理) なので、送るイベントの中身は、この入口からは決まらない。(4) この入口からは届かないように見える呼び出しの扱い (skill 0.4.2)。計測を止める分かれ道 (isUiAnonymousUsageEnabled が false、または開発モード) は、同じ configs で、手前のコードが先に弾いている所がある。trackSavedFilter (savedFilterTracking.ts 9 行) が弾いた後の sendPosthogEvent の 15 行、sendPosthogEvent の 15 行が弾いた後の capturePosthogEvent の 138 行の isUiAnonymousUsageEnabled の部分、capturePosthogEvent の 138 行と initPosthogIfEnabled の 192 行が弾いた後の ensurePosthogClient の 91 行。閉じた枝は disablePosthog や待ち行列を捨てる処理だけで、もともとフレームにしないので、木の形は変わらない。閉じた枝の設定を、capturePosthogEvent (isUiAnonymousUsageEnabled) と ensurePosthogClient (2 つとも) から外し、それぞれの summary の note に、弾く行と条件の行を書いた。(5) sendPosthogEvent の 15 行の分かれ道は、最初に着く経路 (trackSavedFilter から) では閉じているが、api.sendEventNow の 162 行から着く経路 (ためたイベントの送信) では開いている。skill の「呼び出し元によって、閉じたり開いたりするとき」に従い、開いている呼び出し元 (api.sendEventNow) の下に、api.posthogEvents と sendPosthogEvent をもう一度書き (id の末尾が _queued のフレーム)、設定 isUiAnonymousUsageEnabled はそちらに移した (最初のフレーム send_posthog_event からは外し、閉じていることを note に書いた)。開いている枝 (disablePosthog) はフレームにならないので、終端の決まりを満たすために、context.md の決まり (コードに書いてある順でいちばん早い呼び先を、読み書きのある external のフレームまで) で、capturePosthogEvent → ensurePosthogClient (146 行。162 行の capture より早い) → initPostHogForSetup → api.loadConfig → publicFetchJson → publicFetch → fetch を書いた。もう一度書いたフレームには、設定を繰り返していない。(6) 同じファイルの中の、外に出していない補助の関数 (src/utils/posthog.ts の flushQueue、loadPosthogClient、isPosthogDisabled、pruneQueue、src/stores/api.ts の buildEventPayload、analyticsDisabled) は、フレームにせず、呼び出し元の summary と call の根拠に書いた。(7) fetch を呼ぶ行 (src/utils/publicApi.ts 22 行) は、URL ごとに external のフレームを分けた。URL が違う呼び出し元 (api.sendEventNow、api.loadFeeds) の下には、external のフレームを持たせるために、publicFetch (と publicFetchJson) をもう一度書いた。initPosthogIfEnabled は、呼び先 (ensurePosthogClient) を先に書いてあり、設定しか持たないので、終端の決まりを満たすために、いちばん早い呼び先を、読み書きのある external のフレームまで、もう一度書いた (id の末尾が _again のフレーム)。もう一度書いたフレームには、設定を繰り返していない。(8) PostHog の送り先は、api.kestra.io の応答で決まるので、not_traceable_in_repo にした (3 件)。(9) 生成された SDK (@kestra-io/kestra-sdk) のソースは packages/kestra-sdk にあり、scope の中なので、URL を sdk.gen.ts から読んで書いた。(10) ログイン済みかの確認 (BasicAuth.isLoggedIn。cookie を見る) は、満たさなければ読み込みを行わないので、guards (authentication) に書いた。確認の関数はフレームにしていないので、呼んでいる App.vue のフレームに書いた。route.meta.anonymous は、確認ではなく分かれ道なので、呼び出しの condition に書いた。(11) 設定の名前は、ほかの入口の結果と同じ綴り (isAnonymousUsageEnabled、isUiAnonymousUsageEnabled、isBasicAuthInitialized、import.meta.env.MODE) にした。バックエンドの応答 (GET /api/v1/configs) の項目は kind を remote、import.meta.env.MODE はビルドのモードなので other にした。開発のときだけ SdkDriftBanner を描く切り替え (import.meta.env.DEV。App.vue 62 行) は、API の呼び出しを変えないので、書いていない。(12) 外部 API の fields は、送る項目 (問い合わせの引数は filter、本文は write) と、応答の型の項目 (read) を書いた。応答をまるごと store に入れる呼び出しは * にした。PostHog の初期化 (posthog.init、register_for_session、alias) は、送る中身が posthog-js の中で決まるので fields を書かず、note に、コードが渡す値を書いた。(13) 業務のルール (rules) は、書いていない。ためるイベントの上限 (50 件・2 分、PostHog は 100 件・5 分) は、業務の意味を持たない技術の上限なので、summary に書いた。(14) API を呼ばないので、フレームにしていない処理: useThemeCycle (App.vue 74 行)、doc.initResourceUrlTemplate (App.vue 100 行。URL の型の文字を store に入れるだけ。src/stores/doc.ts 140 行)、Utils.switchTheme、applyFontScale、revealApp、setDocumentTitle。別の入口にしていない部品 (DocIdDisplay、ServerUnreachableBanner、SdkDriftBanner、VersionUpgradeNotice、UnsavedChangesDialog、PwaInstallPrompt) は、部品とその composable の import と呼び出しを読み、API を呼ぶ行が無いことを確かめた。(15) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(16) レビューの指摘 1 件 (low。sendPosthogEvent の設定を、閉じた経路のフレームに残していた) は、(5) のとおり直した。レビューの提案は、終端を posthog-js の capture (162 行) までとしていたが、context.md の「コードに書いてある順でいちばん早い呼び先」に合わせ、146 行の ensurePosthogClient から先を書いた。"
