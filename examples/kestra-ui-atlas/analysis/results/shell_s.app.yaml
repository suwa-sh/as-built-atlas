summary:
  status: interpretation
  value: "アプリ全体の枠 (App.vue)。src/main.ts の createApp に渡す根のコンポーネントで、どの画面を開いても動く。このファイル自身が呼ぶ処理は 4 つ。(1) 保存したフィルターの計測の関数 (trackSavedFilter) を provide で配る。デザインシステムの KsFilter が、利用者の操作 (保存・適用・更新・削除) で呼び、PostHog へ送る。(2) anonymous でない route に入り、ログイン済みなら、バックエンドの設定を読む (GET /api/v1/configs)。設定が store に入ると、api の store が、ためていた計測のイベントを api.kestra.io (POST /v1/reports/events) と PostHog へ送る。(3) 設定に版と uuid があれば、kestra.io のお知らせを読む (api.kestra.io の GET /v1/feeds)。(4) 計測が有効なら PostHog を初期化する (接続の情報は api.kestra.io の GET /v1/config)。anonymous の route (ログインなど) と、ログインしていないときは、(2) から (4) を行わない。Basic 認証が初期設定されていないときは、(3) と (4) を行わない。枠が描く共通の部品のうち、別の入口にしたものは 5 つで、ここでは辿っていない: ErrorToast (shell_s.part.ErrorToast)、AppTopNavBar (shell_s.part.AppTopNavBar)、TourOverlay (shell_s.part.TourOverlay)、ReauthDialog (shell_s.part.ReauthDialog)、DrillDownDrawer (shell_s.part.DrillDownDrawer)。レイアウト (route.meta.layout か DefaultLayout) と <router-view> の中身も、別の入口なので含めない。"
