summary:
  status: interpretation
  value: "ログイン画面 (Basic 認証)。route login (/:tenant?/login) が BasicAuthLogin.vue を描く。描いた時点では API を呼ばない。メールアドレスとパスワードを入力して送信すると、(1) GET /api/v1/configs/login で Basic 認証が初期設定済みかを確かめ (未設定なら setup の画面へ移る)、(2) POST /api/v1/login で認証し (失敗したら POST /api/v1/logout を送って後始末する)、(3) GET /api/v1/configs で設定を読み、(4) 計測 (PostHog) に利用者を結び付け、(5) GET /api/v1/{tenant}/flows/search で tutorial 以外のフローの有無を調べて、移る先 (元の画面 / ai / home) を決める。認証が 401 で失敗したときは GET /api/v1/basicAuthValidationErrors で設定の誤りを読んで表示する。設定を読み込むと、ためてあった計測のイベントを api.kestra.io と PostHog へ送る処理も動く。「troubleshooting」のボタンは、計測のイベントを送ってから kestra.io の説明のページを別のタブで開く。入れ子の route (children) と、route ごとの guard (beforeEnter) は無い。meta は layout: FullScreenLayout と anonymous: true (枠の側の処理なので、ここでは辿らない)。"
  evidence:
    - { file: src/routes/routes.ts, line: 109 }
    - { file: src/components/basicauth/BasicAuthLogin.vue, line: 12 }
    - { file: src/components/basicauth/BasicAuthLogin.vue, line: 152 }
