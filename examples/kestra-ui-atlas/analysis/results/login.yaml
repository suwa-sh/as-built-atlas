        note: "Basic 認証の設定の誤りの一覧を読む。応答 (文字の並び) を、まるごと受け取る。"
notes: "迷った点と、そのとき選んだ扱い。(1) 生成された SDK (@kestra-io/kestra-sdk) のソースは、範囲 (ui) の中の packages/kestra-sdk にあるので、SDK の関数と useClient() は external のフレームにして呼び出しの行で閉じ、I/O の path には、SDK のソースや URL を組み立てる行で読んだ URL を書いた。{tenant} は SDK が入れる段。(2) 同じファイルの中の、外に出していない補助の関数 (BasicAuthLogin.vue の handleSubmit / checkServerInitialization / loadAuthConfigErrors、basicAuth.ts の validateCredentials、posthog.ts の flushQueue) は、フレームにせず、呼び出し元のフレームの中の処理として書いた。(3) 利用者の操作 (フォームの送信、troubleshooting のボタン) で動く呼び出しは、login_view から conditional (失敗したときだけの呼び出しは on_failure) にした。condition には、操作と業務の分かれ道 (初期設定済みか、戻る先の形) だけを書き、手前の入力の検査や、前の呼び出しの失敗で打ち切る経路は、rules と note に書いた。(4) api.flushQueuedEvents は、呼び出しではなく値の見張り (watch) で動く。見張っている値 (misc の configs) を変える misc.loadConfigs を caller にし、call は interpretation にした。(5) 同じ処理の書き場所は、入口から、コードに書いてある順 (template を先、その後に script) に深さ優先で辿って決めた。template の送信 (12 行) がボタン (51 行) より先なので、送信の経路を先に辿った。見張りで動く api.flushQueuedEvents は、misc.loadConfigs (BasicAuthLogin.vue 196 行) の下として辿った。その結果、api.posthogEvents は、troubleshooting のボタン (232 行) より先に着く api.sendEventNow (stores/api.ts 162 行) の下に書き、ensurePosthogClient は、identifyPosthogUser (posthog.ts 181 行) より先に着く capturePosthogEvent (146 行) の下に書いた。login_view と identify_posthog_user の summary に、同じ経路のフレームを書いた。(6) この入口からは届かないように見える枝を、届かない理由の表で確かめた。固定の値で閉じているのは 2 つ (flow.findFlows の、結果を store に入れる枝。呼び出し元が onlyTotal: true を固定で渡す。identifyPosthogUser の、properties が空なら返す枝。呼び出し元が {email: ...} を固定で渡す)。どちらも、呼び出しも読み書きも無い枝なので、フレームは変わらず、それぞれのフレームの summary の note に書いた。api.posthogEvents は、2 つの呼び出し元 (sendEventNow とボタン) で、ページの表示 (type が PAGE) の枝が開くかが違い得るが、その枝は属性を組み立てるだけなので、もう一度書いていない。ためてあるイベントの有無、設定 (configs) の値、PostHog の初期化の状態は、入口の外から来る値なので、conditional のまま辿った。(7) publicFetch は、api.loadConfig の経路 (GET /v1/config) で先に着くが、api.sendEventNow からは違う URL (POST /v1/reports/events) で呼ぶ。プロファイルの「URL ごとに external のフレームを分ける」に従い、external のフレームを持たせるために、publicFetch をもう一度書いた (public_fetch_events)。(8) PostHog の送り先は、api.kestra.io の応答で決まるので not_traceable_in_repo にした。disablePosthog (opt_out_capturing / reset) は、送信を止める処理なので、フレームにしていない。(9) 権限の確認の value は、hasAnyAction に渡している引数を、ほかの入口の結果と同じ「resource.FLOW, action.LIST」の形で書いた。確認の関数 (Me.hasAnyAction) はフレームにしていないので、確認を呼ぶ段 (should_show_welcome) に書いた。この範囲の実装は、いつも true を返す。これは、呼び出し元が固定の値を渡して閉じているのではなく、呼ばれる側の実装がいつも true を返すもの (EE 版で置き換わる override) なので、届かない枝の表の 1 には当てず、確認を残した。route の meta.anonymous (ログインしていなくても開ける印) を読むのは枠の側なので、ここには書いていない。(10) 設定の名前は、ほかの入口の結果と同じ綴り (isUiAnonymousUsageEnabled、import.meta.env.MODE) にした。import.meta.env.MODE は、環境変数ではなくビルドのモードなので kind を other にした。接続先を決める VITE_APP_API_URL は、どの入口でも同じように効く接続の設定なので、書いていない。(11) 外部 API の fields は、送る項目 (クエリ・本文・ヘッダーの名前) と、応答からコードが取り出している項目を書いた。応答をまるごと受け取る呼び出しは * にした。(12) window.open で開く kestra.io の説明のページは、ほかの入口でも API の呼び出しでもないので、links にも I/O にも書かず、login_view の summary に書いた。ブラウザの中の保存 (localStorage、sessionStorage) は I/O に書いていない。(13) 枠 (App.vue、FullScreenLayout、共通の guard、HTTP の共通の設定 utils/kestraHttp.ts) は辿っていない。(14) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(15) 戻る先へ移るつながりは、行き先が読める 2 件 (実行の画面、フローの編集の画面) と、読めない 1 件に分けた。行き先を決めているのは正規表現なので、target は route の URL の形で書き、interpretation にした。(16) レビューの指摘のうち、パスワードが空なら送信しない検査 (BasicAuthLogin.vue 136 行の validatePassword) を rules に足す指摘 (low) は、直していない。この検査は、入力が空でないことだけを確かめるもので、分析の skill が「入力が空でないことだけの確認は書かない」と決めているため。メールアドレスの検査は、形 (EMAIL_REGEX) も確かめるので、rules に残した。"
