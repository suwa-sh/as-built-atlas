  - id: sdk_misc_basic_auth_config_errors
    layer: external
    kind: sdk
    name: "@kestra-io/kestra-sdk/misc basicAuthConfigErrors"
    source: { file: src/composables/useBaseMisc.ts, line: 49 }
    caller: misc_load_basic_auth_errors
    call:
