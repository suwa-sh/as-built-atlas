        resource: { kind: external_api, levels: { host: "(backend)", path: "GET /api/v1/basicAuthValidationErrors" } }
        fields:
          - { name: "*", use: [read] }
        evidence:
          - { file: src/composables/useBaseMisc.ts, line: 49 }
          - { file: packages/kestra-sdk/src/openapi/sdk/Misc.gen.ts, line: 7 }
