notes: "(1) 登録表を引くフレームは Sections.vue のフレームにした (analysis-conventions の「Sections.vue の <component :is=\"TYPES[chart.type]\"> のフレームで止め」と、context.md の「登録表を引くフレームは、<component :is> を書いたコンポーネントのフレーム」に従う)。TYPES の 6 項目は辿らず、入口の一覧の状態 (approved 2 件、candidate 4 件) によらず、6 件を kind: embed、status: interpretation で links に書いた。根拠は、登録表を引く行 (Sections.vue:60) と、登録表の項目の行 (dashboard-types.ts:11〜16)。(2) Sections.vue 自身の、チャートの書き出しのボタン (dashboard.export) は辿った。書き出しの前に、描いた部品の exportParameters / exportChart を呼ぶ所 (Sections.vue:210, 212) と、KsFilter の再読み込みのボタンから部品の refresh を呼ぶ所 (Sections.vue:128) は、部品の中なので辿らず、summary に書いた。(3) 関数を props で渡して、別の部品が呼ぶ形 (context.md の「関数を渡して、別の部品が呼ぶとき」) を 2 つ、フレームにした。Dashboard.vue の load (Header.vue に :load で渡し、Header がパンくずの切り替えと削除の後に呼ぶ) と、Header.vue の titleSiblings (TopNavBar に渡し、パンくずの部品 KsBreadcrumbMenu が呼ぶ)。どちらも同じファイルの関数だが、context.md の「同じファイルの補助の関数は、フレームにしない」より、渡して呼ぶ形の決まりを先に当てた。(4) URL の段を見張る watch (Dashboard.vue:218) は、store の getDashboardId を直接呼ぶので、analysis-conventions の「中身が同じファイルの補助の関数だけの watch はフレームにしない」に当たらず、context.md の決まりどおりフレームにした。watch が呼ぶ load は、フレーム load と同じ経路なので、watch の summary に書いた。watch の caller は、context.md の「見張っている値を変える側のフレーム」に従い、URL の段を渡す route にした (レビューの指摘で直した)。(5) route が props を渡さないので、Dashboard.vue の isFlow・isNamespace は既定の値 false、header は既定の値 true (引数を渡さないことで効く既定値)。isFlow・isNamespace で開く枝 (スマホの時の選択の部品、名前空間・フローの絞り込みの設定、フローと名前空間の既定の定義) は、固定の値で閉じている呼び出しとして辿らず、Dashboard.vue と load の summary の note に書いた。スマホの時の選択の部品の条件 isMobile && isFlow && canSelectDashboard は、isFlow が閉じていて、skill の「A && B は、どちらか 1 つが閉じていれば、閉じている」に当たる。(6) Sections.vue の、route の名前が flows/update・namespaces/update のときの絞り込み (Sections.vue:194, 201) と、選べるチャート (selectableChartId。Dashboard.vue が渡さない) は、計算の中の分かれ道で、その先に呼び出しが無いので、Sections.vue の summary に書いた。(7) dashboard.loadDefaults は、入口から辿る順 (テンプレートの 2 行の Header が先) で、最初にパンくずの読み込み (dashboard.list の中) で着くので、そこに書いた。load (184 行) と saveDefaults (125 行) から呼ぶ所は、summary に書いた。getDashboardId は判定のルールを持つが、テナントの既定を探すときに loadDefaults で外へ呼ぶので、loadDefaults とその先の HTTP の呼び出しを、その下にもう一度書いた (権限の確認・設定・ルールは繰り返していない)。(8) URL のテナントの段が無いときは、watch の中で何も読まない (Dashboard.vue:219) が、アプリ全体の guard (tenantGuard、useTenant.ts:11) がテナントの無い URL を main 付きに書き換え、watch はテナントの段が変わると動き直すので、watch の下の呼び出しは always とした。(9) Dashboard.vue が同じ route へ移る router.push / router.replace (URL にダッシュボードの id を入れる) は、ほかの入口へのつながりではないので、links に書かず summary に書いた。(10) 既定にする操作と、既定の読み込み・削除の URL のテナントの段は、basePath() の固定の値 /api/v1/main から取る (override/utils/route.ts:15) ので、main として書いた。"
