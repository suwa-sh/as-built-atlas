summary:
  status: interpretation
  value: "ダッシュボードの画面 (ホーム)。route home (/:tenant?/dashboards/:dashboard?) が Dashboard.vue を描く。URL のテナントとダッシュボードの段を見張る watch が、描かれたときと段が変わるたびに、描くダッシュボードの id を決め (URL の段、利用者が前に選んだもの、テナントの既定 (GET /api/v1/main/dashboards/settings/default-dashboards)、UI に同梱の既定の順)、同じファイルの load で、保存されたダッシュボード (GET /api/v1/{tenant}/dashboards/{id}) か、UI に同梱の既定の定義 (GET /api/v1/{tenant}/dashboards/defaults/definitions) を読む。読んだ定義のチャートの並びを Sections.vue に渡し、Sections.vue が、各チャートの定義の type で登録表 TYPES からチャートの部品を引いて描く (部品は別の入口。embed で指す)。上のヘッダー (Header.vue) は、ダッシュボードを管理できるとき (OSS 版でなく、作成の権限がある) に、パンくずの切り替えにダッシュボードの一覧 (GET /api/v1/{tenant}/dashboards) を出し、既定にする (POST /api/v1/tenants/main/settings/default-dashboards) と削除 (DELETE /api/v1/main/dashboards/{id}) の操作と、編集・作成の画面への移動を出す。絞り込みの部品の名前空間の候補は POST /api/v1/{tenant}/namespaces/autocomplete で読む。チャートごとの CSV の書き出し (POST .../dashboards/charts/export か .../dashboards/{id}/charts/{chartId}/export) ができる。入れ子の route (children) は無い。"
