notes: "迷った点と、そのとき選んだ扱い。(1) 生成された SDK (@kestra-io/kestra-sdk) のソースは、範囲 (ui) の中の packages/kestra-sdk/src/openapi にあるので、SDK の関数は external のフレームにして呼び出しの行で閉じ、I/O の path には SDK のソースで読んだ URL を書いた。{tenant} は SDK が入れる段。(2) 同じ処理 namespaces.loadAutocomplete は、2 つの呼び出し元から呼ばれる。入口から、コードに書いてある行の順 (KVTable.vue では、テンプレートの 166 行の NamespaceSelect が、スクリプトの 352 行の useKvFilter より先) に辿り、NamespaceSelect の下に書いた。namespaceValueProvider は権限の確認 (guards) を持つので、機械チェックの終端の決まりは満たすが、分析の skill の「権限の確認だけを書いてフレームを閉じてよいのは、読み書きも外への呼び出しもしないときだけ」に当たらないので、その下にもう一度書いた (_2 の付くフレーム。権限の確認・設定・ルールは繰り返していない)。(3) 固定の値で閉じている呼び出しは辿らず、条件を持つフレームの summary の note に書いた: KVTable.vue 382 行の 2 つめの listAllKeys (KVs.vue が props を渡さず、既定の値 includeInherited: false が効く。load_data) と、configureLanguage の先 (KVTable.vue 228 行の lang=\"json\"。use_editor_bindings)。InheritedKVs は、条件が store の値 (画面をまたいで残る) で決まり、入口の外から来る値なので、conditional で書いた。kvFilter.ts 16 行の route の名前の条件は、この入口の route の定義 (routes.ts 47 行) に書いた名前でいつも成り立つので、always にした。(4) 権限の確認の value は、isAllowed / hasAnyActionOnAnyNamespace に渡している引数を、コードのとおり「resource.KVSTORE, action.UPDATE」の形で書いた。確認の関数 (Me.isAllowed、src/override/stores/auth.ts) はフレームにしていないので、確認を呼ぶ段 (kv_table、namespace_value_provider) に書いた。この範囲の実装は、いつも true を返す。(5) 外部 API の fields は、送る項目 (クエリ・パス・本文・ヘッダーの名前) と、応答からコードが取り出している項目を書いた。応答をまるごと受け取る呼び出しは * にした。パスやクエリの項目は filter にした。(6) PostHog の送り先は、api.kestra.io の応答で決まるので not_traceable_in_repo にした。待ち行列の分を送る capture (posthog.ts 81 行) は、162 行とは別の行なので、別の external のフレームにした。disablePosthog (opt_out_capturing / reset) は、送信を止める処理なので、フレームにしていない。(7) import.meta.env.MODE は、環境変数ではなくビルドのモードなので、settings の kind を other にした。接続先を決める VITE_APP_API_URL は、どの入口でも同じように効く接続の設定なので、書いていない。(8) 画面の中の保存 (localStorage、sessionStorage) は I/O に書いていない。useRestoreUrl、usePageSize、useTableColumns、TimeSelect は API を呼ばないので、フレームにしていない。KsDataTable、KsFilter などの packages/design-system の部品は、見た目の部品としてフレームにしていない (design-system の中に HTTP の呼び出しが無いことを、fetch / axios / kestra-sdk の検索で確かめた)。(9) 作業定義に analysis.tests が無いので、テストとの対応は分析していない。(10) レビューの指摘 2 件 (どちらも low) を直した: capturePosthogEvent の isUiAnonymousUsageEnabled は、sendPosthogEvent の 15 行が先に弾くので settings から外し、summary の note に書いた (shell_s.app の結果とそろえた)。一覧の応答の行の列 (namespace、key、description、updateDate、expirationDate) を fields に足した。"
