format_version: 1
target:
  repo: github.com/Dimillian/IceCubesApp
  name: Ice Cubes
  clone_path: ../IceCubesApp
  scope: .
  commit: 98098b9c4b5928f89f338203193c2bf40ab7f38c
profile:
  id: ui-ios
  version: 0.1.0
extractors:
- name: swiftui-destinations
  run: abatlas-extract ast
  layer: screen
  rationale: 行き先の enum は RouterDestination (navigationDestination(for:) に渡す。AppRegistry.swift:66)、SheetDestination
    (sheet(item:) に渡す。AppRegistry.swift:154)、AppTab (TabView のタブ。Tabs.swift の makeContentView)、SettingsStartingPoint
    (設定の画面の navigationDestination(item:) に渡す。SettingsTab.swift:78)。既定の正規表現に StartingPoint
    を足した。WindowDestinationEditor / WindowDestinationMedia は openWindow で開く macOS と
    visionOS の window で、sheet と同じ View を描くので、正規表現に入れない
  params:
    files:
    - '**/*.swift'
    exclude:
    - '*Tests/*'
    - '*.build/*'
    - Pods/*
    - '*/Pods/*'
    - Carthage/*
    - '*/Carthage/*'
    language: swift
    rule:
      kind: simple_identifier
      pattern: $CASE
      inside:
        kind: enum_entry
        inside:
          kind: enum_class_body
          inside:
            kind: class_declaration
            has:
              field: name
              regex: (Destination|Route|Screen|Tab|StartingPoint)$
              pattern: $ENUM
    fields:
      path: /{ENUM}/{CASE}
      name: '{ENUM}.{CASE}'
      attributes:
        destination_enum: '{ENUM}'
        destination_case: '{CASE}'
    id:
      replace:
      - pattern: _
        with: __
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    unresolved:
      any:
      - kind: call_suffix
        follows:
          any:
          - kind: navigation_expression
            has:
              kind: navigation_suffix
              regex: ^\.(navigationDestination|sheet|fullScreenCover)$
          - kind: simple_identifier
            regex: ^(navigationDestination|sheet|fullScreenCover)$
        has:
          kind: value_arguments
          has:
            kind: value_argument
            has:
              kind: value_argument_label
              regex: ^(for|item)$
      - kind: class_declaration
        has:
          kind: inheritance_specifier
          regex: ^UI(Table|Collection|Page|Navigation|TabBar|Split|Hosting)?ViewController$
- name: os-entry-points
  run: abatlas-extract ast
  layer: system
  rationale: ウィジェット 5、App Intents 5、通知の拡張 1、アクションの拡張 1 を、準拠するプロトコルで取る。既定のまま。設定の画面だけの
    intent (WidgetConfigurationIntent) は取らない
  params:
    files:
    - '**/*.swift'
    exclude:
    - '*Tests/*'
    - '*.build/*'
    - Pods/*
    - '*/Pods/*'
    - Carthage/*
    - '*/Carthage/*'
    language: swift
    allow_empty: true
    rule:
      kind: class_declaration
      all:
      - has:
          field: name
          pattern: $NAME
      - has:
          kind: inheritance_specifier
          regex: ^(Widget|ControlWidget|AppIntent|AudioPlaybackIntent|LiveActivityIntent|ForegroundContinuableIntent|UNNotificationServiceExtension|UNNotificationContentExtension|NSExtensionRequestHandling)$
          pattern: $BASE
    fields:
      path: /(system)/{BASE}/{NAME}
      name: '{NAME}'
      attributes:
        conforms_to: '{BASE}'
    segments:
      replace:
      - pattern: ^(Widget|ControlWidget)$
        with: widget
      - pattern: ^(AppIntent|AudioPlaybackIntent|LiveActivityIntent|ForegroundContinuableIntent)$
        with: intent
      - pattern: ^UNNotification(Service|Content)Extension$
        with: notification
      - pattern: ^NSExtensionRequestHandling$
        with: extension
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(([a-z])([a-z]*)\)$
        with: \1\2_\1
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
- name: agent-listed-screen
  run: abatlas-extract listed
  layer: screen
  rationale: 行き先の enum を通らずに、設定の画面とフィルターの一覧から push で開く View のうち、行き先の enum の入口が描く View
    と別のもので、保存や API を使うもの。push の先は、開く側に含めると、設定の画面 1 件が 12 画面ぶんになるため、別の入口にする。IconSelectorView
    (アプリのアイコンを OS の API で替えるだけ)、ThemePreviewView (見た目だけ)、SceneDelegate (window の大きさを見るだけ)
    は、保存も API も使わないので足さない。AboutView / SupportAppView / AddAccountView / PushNotificationsView
    は、SheetDestination の入口が同じ View を描くので足さない
  params:
    entries:
    - id: view_v.TabbarEntriesSettingsView
      path: /(view)/TabbarEntriesSettingsView
      name: TabbarEntriesSettingsView
      source:
        file: IceCubesApp/App/Tabs/Settings/TabbarEntriesSettingsView.swift
        line: 6
      reason: 設定の画面から NavigationLink(destination:) で開く (SettingsTab.swift:193)。タブの並びを
        iOSTabs に書き、@AppStorage (UserDefaults) に保存する。SettingsStartingPoint.tabAndSidebarEntries
        は EmptyView を描くので、この View の入口にはならない
    - id: view_v.WishlistView
      path: /(view)/WishlistView
      name: WishlistView
      source:
        file: IceCubesApp/App/Tabs/Settings/WishlistView.swift
        line: 6
      reason: 設定の画面から NavigationLink で開く (SettingsTab.swift:337)。WishKit の SDK の画面を描き、要望の一覧を他社のサービスから読む
    - id: view_v.EditFilterView
      path: /(view)/EditFilterView
      name: EditFilterView
      source:
        file: Packages/Account/Sources/Account/Filters/EditFilterView.swift
        line: 8
      reason: フィルターの一覧 (SheetDestination.accountFiltersList の FiltersListView) から
        NavigationLink(destination:) で開く (FiltersListView.swift:31、63)。フィルターを API
        で作る・直す・消す (EditFilterView.swift:288、292、319)
- name: agent-listed-shell
  run: abatlas-extract listed
  layer: shell
  rationale: アプリ全体の枠。@main の App、AppDelegate、タブを持つルートの View、app の scene が描く共通の sheet
    (メディアの表示)。SceneDelegate (DesignSystem/SceneDelegate.swift) は window の大きさを見るだけで、保存も
    API も使わないので足さない
  params:
    entries:
    - id: shell_s.app
      path: /(shell)/app
      name: IceCubesApp
      source:
        file: IceCubesApp/App/Main/IceCubesApp.swift
        line: 19
      reason: '@main の App。scene の onAppear で RevenueCat と通知の登録 (IceCubesApp+Scene.swift:12)、withAppDependencyGraph
        の task でインスタンスの取得とストリーミングの接続 (AppRegistry.swift:44)、scenePhase の変化でストリーミングと通知の件数とサーバーの設定の読み込み
        (IceCubesApp.swift:57)'
    - id: shell_s.delegate.AppDelegate
      path: /(shell)/delegate/AppDelegate
      name: AppDelegate
      source:
        file: IceCubesApp/App/Main/IceCubesApp.swift
        line: 89
      reason: '@UIApplicationDelegateAdaptor で渡す AppDelegate。起動のときに通知のアカウントを設定し、計測を送る
        (IceCubesApp.swift:96-98)。通知の token を受けて、購読をサーバーへ登録する (IceCubesApp.swift:105-113)'
    - id: shell_s.root.AppView
      path: /(shell)/root/AppView
      name: AppView
      source:
        file: IceCubesApp/App/Main/AppView.swift
        line: 17
      reason: app の scene が最初に描く View で、TabView を持つ (IceCubesApp+Scene.swift:10)。SwiftData
        の LocalTimeline と TagGroup を @Query で読み、@AppStorage のピン留めのフィルターを読む (AppView.swift:34-37)
    - id: shell_s.part.MediaUIView
      path: /(shell)/part/MediaUIView
      name: MediaUIView
      source:
        file: Packages/MediaUI/Sources/MediaUI/MediaUIView.swift
        line: 8
      reason: 'app の scene が sheet(item: $quickLook.selectedMediaAttachment) で描く (IceCubesApp+Scene.swift:29)。どの画面からでも、投稿の画像を開くと出る。画像を
        URLSession で読み込み、写真のライブラリへ保存する (MediaUIView.swift:181、197)'
- name: agent-listed-system
  run: abatlas-extract listed
  layer: system
  rationale: Info.plist だけで決まる、OS から起動される入口。共有の拡張は principal class が UIViewController
    なので抽出器で取れない。URL スキームの受け口は onOpenURL。BGTaskScheduler とバックグラウンドのタスクは使っていない (rg で確かめた)。ユニバーサルリンク
    (applinks) は entitlements に無い
  params:
    entries:
    - id: system_s.extension.ShareViewController
      path: /(system)/extension/ShareViewController
      name: ShareViewController
      source:
        file: IceCubesShareExtension/ShareViewController.swift
        line: 11
      reason: 共有の拡張の NSExtensionPrincipalClass (IceCubesShareExtension/Info.plist:26)。ほかのアプリから共有したものを、投稿の編集の画面で開く
    - id: system_s.link.icecubesapp
      path: /(system)/link/icecubesapp
      name: icecubesapp
      source:
        file: IceCubesApp/App/Router/SafariRouter.swift
        line: 38
      reason: Info.plist の CFBundleURLSchemes の icecubesapp (IceCubesApp/Info.plist:14)。onOpenURL
        で受けて、https に書き換えて handleDeepLink に渡す。投稿の画面へ移る前に、サーバーの peers を読むことがある (Router.swift:245)
