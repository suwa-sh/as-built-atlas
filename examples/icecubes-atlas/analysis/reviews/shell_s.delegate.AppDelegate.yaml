notes: "(1) 機械チェックは OK (プロファイルは作業定義の profile.dir から読めている)。(2) 根拠の行は、IceCubesApp.swift、PushNotificationsService.swift、AppAccountsManager.swift、AppAccount.swift、MastodonClient.swift、Push.swift、Notifications.swift、Telemetry.swift、UserPreferences.swift、App.swift、entitlements と xcconfig を開いて確かめ、上の指摘のほかは、すべて主張を支えていた。(3) 固定の値で閉じた枝 (updateSubscriptions の forceCreate: false) は、値を IceCubesApp.swift の 112 行目がコードに直接書いて渡し、木の中で呼ぶのはこの 1 か所で、forceCreate: true で呼ぶのは別の入口 (AddAccountsView.swift の 315 行目) であることを確かめた。辿らないのは妥当。(4) 綴り (latestCurrentAccountKey、Keychain の namespace と key_pattern、settings の DEBUG と targetEnvironment(simulator)) は、system_s.widget.LatestPostsWidget の結果とそろっている。ウィジェットの結果の latestCurrentAccountKey の get にも fields が無いので、直すなら両方そろえるとよい。(5) notes (6) は、TelemetryDeck の host を「ui-android の書き方に合わせて (telemetrydeck)」にしたとするが、ui-android の context.md には、計測の SDK の host の決まりは無い。ui-ios の context.md にも host の決まりが無いので、指摘にはしなかった。綴りを決めるなら analysis-conventions.md に書くとよい。"
