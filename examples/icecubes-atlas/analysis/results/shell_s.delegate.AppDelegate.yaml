notes: "(1) 枠の範囲: 入口は AppDelegate のクラス 1 つ。IceCubesApp (@main の App) の init、scene、scenePhase の処理、RevenueCat の設定 (setupRevenueCat) と通知の登録の求め (refreshPushSubs) は、同じファイルにあるが別の入口 shell_s.app なので辿らなかった。SceneDelegate は window の大きさを見るだけで、入口にしていない。(2) OS が呼ぶ callback: 読み書きに至る 4 つ (didFinishLaunchingWithOptions、didRegisterForRemoteNotificationsWithDeviceToken、通知の didReceive、willPresent) を入口のフレームの直下に並べた。読み書きの無い callback (didFailToRegister、didReceiveRemoteNotification、configurationForConnecting、buildMenu) はフレームにせず、入口の summary に書いた。didRegister が呼ぶ setAccounts と AppAccountsManager.shared は、didFinishLaunching の下に 1 回だけ書いた。(3) 通知の受け取り: UNUserNotificationCenterDelegate に準拠するのは AppDelegate ではなく PushNotificationsService (init で自分を delegate に入れる)。入口の一覧に PushNotificationsService の入口は無く、プロファイルが通知の受け取りを delegate の枠に含めると決めているので、この入口に含めた。(4) 通知の token: OS への登録 (registerForRemoteNotifications) は shell_s.app から求めるので、この入口には現れない。サーバーへの登録は Mastodon の POST /api/v1/push/subscription で、受け口は中継のサーバー (icecubesrelay.fly.dev) の URL。アプリは中継のサーバーへ直接は送らないので、I/O に書かなかった。(5) updateSubscriptions は forceCreate: false の固定の値で呼ばれるので、forceCreate のときだけ通る枝は辿らなかった (フレーム update_subscriptions の summary の note)。(6) 計測の SDK (TelemetryDeck): 送り先がリポジトリに無いので、path を sdk:TelemetryDeck.signal とし、host は ui-ios の context.md にも、この分析リポジトリが持つ ui-android の context.md にも決まりが無いので、SDK の名前をかっこで書いて (telemetrydeck) にした (backend や device と同じ、かっこの書き方)。initialize と WishKit.configure は、送るかどうかが SDK の中で読めないので、I/O を書かずに external のフレームで閉じた。(7) コードに直接書いた API キー (TelemetryDeck の app の ID、WishKit の API キー) は、環境ごとの設定ではなく、値を与えるだけなので settings に書かず、summary と note で触れた。(8) 層: PushNotificationsService、Telemetry、UserPreferences、AppAccountsManager は conventions のとおり repository。PushNotificationSubscriptionSettings (アカウントごとの購読の状態の object、singleton ではない) は、呼び出し元と同じ repository にした。PushKeys (Keychain を包む struct) は client にした。(9) AppAccountsManager.shared の init は conventions のとおり conditional。アプリのプロセスでは、IceCubesApp の @State の初期値が先に触れる見込みが高く、実際にはこの入口から動かないことが多い (note に書いた)。(10) DEBUG とシミュレーターの Keychain の access group と、DEBUG の ?sandbox=true は、ビルドの設定として settings に書いた。(11) レビューの指摘 4 件 (medium 1、low 3) はすべて直した: UserDefaults の値 1 つの読み書き (latestCurrentAccountKey、push_notifications_count_{token.createdAt}) に fields の name: \"*\" を足し、通知を押したときの condition を、通知を押してアプリが起動したときも含む書き方にした。ウィジェットの結果 (system_s.widget.LatestPostsWidget) の latestCurrentAccountKey の get には fields が無いままで、この入口の担当の外なので直していない。"
