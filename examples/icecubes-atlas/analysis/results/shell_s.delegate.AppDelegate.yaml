summary:
  status: interpretation
  value: "アプリの UIApplicationDelegate と、通知の受け取り (UNUserNotificationCenterDelegate)。起動のときに、Keychain のアカウントのうち token を持つものごとに通知の購読の設定を作り (通知の暗号の鍵を Keychain から読み、無ければ作って保存する)、計測 (TelemetryDeck) に起動を送り、要望の SDK (WishKit) を設定する。OS が通知の device token を渡すと、アカウントごとに Mastodon のサーバーの通知の購読を読み、既にある購読だけを消して、中継のサーバーを受け口にした購読を作り直す (無いアカウントには作らない)。通知を押して開くと、通知の中身の access token に合うアカウントで、その通知をサーバーから読む。アプリが前面のときに通知が届くと、アカウントごとの通知の件数を App Group の UserDefaults から読み直す。ほかの callback (登録の失敗、裏での通知の受け取り、scene の設定、メニュー) は、読み書きをしない"
  evidence:
