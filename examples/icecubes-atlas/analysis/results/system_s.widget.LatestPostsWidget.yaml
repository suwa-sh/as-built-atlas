notes: "(1) 入口の木の作り: OS が呼ぶ 3 つ (設定の値を作り直す DefaultAppAccountEntityQuery.entities(for:)、timeline provider の timeline(for:in:)、entry を描く PostsWidgetView) を、入口のフレームの直下に並べた。AppEntity と EntityQuery は入口にしない決まりなので、ウィジェットの中で辿った。(2) 同じ処理の重なり: snapshot(for:in:) は timeline(for:in:) と同じ private な関数を呼ぶので、フレームにせず provider_timeline の summary に書いた。suggestedEntities() と defaultResult() は設定の画面だけで呼ばれ、AppAccountsManager.shared を読む経路が entities(for:) と同じなので、account_query の summary に書いた。(3) タイムラインの case: TimelineFilter.endpoint には 4 つ以外の case もあるが、DefaultTimelineEntityQuery が home / trending / federated / local しか出さないので、ほかの case はフレームにしなかった。選ぶ値は保存された設定なので「固定の値で閉じている」決まりには当たらず、4 つ (path では 3 つ) を conditional で書いた。(4) AppAccountsManager.init が読む latestCurrentAccountKey (App Group の UserDefaults) は、timeline の経路では使わないが、設定の画面で OS が呼ぶ defaultResult() の既定のアカウントを決めるので、get で書いた (最初は書かずにいたが、レビューの指摘で足した)。(5) Keychain の access group は、conventions のとおりリリースのビルドの値。entitlements は $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).IceCubesApp で、BUNDLE_ID_PREFIX は IceCubesApp-release.xcconfig で com.thomasricouard だが、AppIdentifierPrefix の値はリポジトリに無い。(6) Keychain の allKeys (キーの列挙) は、kvs に list の操作が無いので get に含めた。"
