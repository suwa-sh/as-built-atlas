format_version: 1
target:
  repo: github.com/nocodb/nocodb
  name: NocoDB (nc-gui)
  clone_path: ../nocodb
  scope: packages/nc-gui
  commit: 657eb609d038355d4c489ba70b9fcf1d96295e07
profile:
  id: ui-nuxt
  version: 0.1.0
extractors:
- name: nuxt-pages
  run: abatlas-extract glob
  layer: page
  rationale: Nuxt 3 の作りで、pages は scope の直下にある。playground は nuxt.config の ignore で本番のビルドから外れる試しの画面なので、exclude に足した (nuxt.config.ts の 16 行目)
  params:
    files:
    - pages/**/*.vue
    - pages/**/*.tsx
    - pages/**/*.jsx
    exclude:
    - pages/-*
    - pages/*/-*
    - pages/playground.vue
    - pages/playground/*
    segments:
      strip_prefix: pages
      drop_last: false
      drop:
      - \([^)]+\)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\[\[\.\.\.(.+)\]\]$
        with: \1_o
      - pattern: ^\[\.\.\.(.+)\]$
        with: \1_c
      - pattern: \[\[([^\]]+)\]\]
        with: \1_o
      - pattern: \[([^\]]+)\]
        with: \1_d
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: ^<(script|template)
    contains:
      nested: <(NuxtPage|nuxt-page)\b
      page_meta: definePageMeta\(
      layout: \blayout:\s*['"]
      middleware: '\bmiddleware:'
- name: nuxt-layouts
  run: abatlas-extract glob
  layer: layout
  rationale: Nuxt 3 の作りで、layouts は scope の直下にある
  params:
    files:
    - layouts/**/*.vue
    exclude:
    - layouts/-*
    - layouts/*/-*
    segments:
      strip_prefix: layouts
      drop_last: false
      prefix:
      - (layout)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(layout\)$
        with: layout_l
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: ^<(script|template)
- name: nuxt-app-shell
  run: abatlas-extract glob
  layer: shell
  rationale: Nuxt 3 の作りで、app.vue と error.vue は scope の直下にある
  params:
    files:
    - app.vue
    - error.vue
    segments:
      drop_last: false
      prefix:
      - (shell)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(shell\)$
        with: shell_s
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: ^<(script|template)
- name: nuxt-global-middleware
  run: abatlas-extract glob
  layer: shell
  rationale: Nuxt 3 の作りで、middleware は scope の直下にある。4 つとも .global
  params:
    files:
    - middleware/*.global.ts
    - middleware/*.global.js
    segments:
      drop_last: false
      prefix:
      - (shell)
    id:
      replace:
      - pattern: _
        with: __
      - pattern: ^\(shell\)$
        with: shell_s
      - pattern: \.
        with: '-'
      - pattern: '[^A-Za-z0-9_-]'
        with: ''
    line_match: defineNuxtRouteMiddleware
- name: agent-listed-shell
  run: abatlas-extract listed
  layer: shell
  rationale: 'プラグイン 24 個のうち、起動のときにデータを読む・外へ送るものだけを足した。入口にしなかったもの: ライブラリの登録や指示子だけ (a.dayjs, a.i18n, animation, ant, clamp, domPurify, font, iosViewport.client, leaflet.client, pdf-object, resizeDirective)、 値や関数を provide するだけ (api, event-bus, import-worker, a.socket (CE では何もしない socket), poller (subscribe が呼ばれるまで API を呼ばない), error-reporting (report を provide し、呼ばれたときだけ送る))、ブラウザの中の保存と転送だけ (redirect, hashRedirect.client, buildIntent.client, error-handler)。 枠が描く共通の部品は、まだ分けない (app.vue の分析の大きさを見てから決める)'
  params:
    entries:
    - id: shell_s.plugin.state
      path: /(shell)/plugin/state
      name: plugins/state.ts
      source:
        file: plugins/state.ts
        line: 41
      reason: 起動のときに、アプリの情報 (api.utils.appInfo) を読む (33 行目)。ファイルの置き場からは、データを読むかを決められないので、読んで足した
    - id: shell_s.plugin.sentry
      path: /(shell)/plugin/sentry
      name: plugins/sentry.ts
      source:
        file: plugins/sentry.ts
        line: 7
      reason: アプリの情報で有効なら、Sentry を初期化して、画面の移動の計測を外へ送る (31 行目)
    - id: shell_s.plugin.tele
      path: /(shell)/plugin/tele
      name: plugins/tele.ts
      source:
        file: plugins/tele.ts
        line: 4
      reason: ログインしていれば、計測の socket を開き (15 行目)、画面の移動のたびに送る
