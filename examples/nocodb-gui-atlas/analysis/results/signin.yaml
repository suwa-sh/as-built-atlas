    - { file: pages/signin.vue, line: 66 }
    - { file: utils/teleUtils.ts, line: 7 }
    - { file: utils/teleUtils.ts, line: 87 }
notes: "(1) definePageMeta の requiresAuth: false (pages/signin.vue 5 行目) は、global の middleware 03.auth.global (別の入口) が読む印なので、この入口の guards に書かなかった。ログイン済みでこの画面に来た利用者は、その middleware がほかの画面へ移す (middleware/03.auth.global.ts 183 行目)。(2) appInfo (バックエンドの設定) は、この画面では読み込まず、枠 (plugins / middleware の別の入口) が読んだ状態を useGlobal から使う。appInfo の項目で画面の作りが変わるので、page のフレームの settings に kind: remote で書いた。バックエンドでこれらを決める環境変数の名前は、scope (packages/nc-gui) の外 (packages/nocodb) にあるので、名前はコードの識別子 (appInfo.googleAuthEnabled など) のまま書いた。(3) 計測の $e は、プラグイン plugins/tele.ts が provide する関数なので、provide した関数 ($e、73 行目) → SocketTele.emit → socket.emit (socket.io-client) の順にフレームにした。isEeUI は、この版では固定の false (utils/ncUtils.ts 1 行目) なので、$e はいつも provide される。$e は、この入口の中で 4 か所 (page の送信の結果、useAuthLastMethod.selectMethod、AuthLivePreview、GeneralLanguage) から呼ばれる。最初に着いた page の下に書き、ほかの 3 か所は、呼び出し元が終端の決まりを満たせなくなるので、socket.emit まで、もう一度書いた (同じ処理が何度も呼ばれるときの決まり)。業務のルール (ログインしていない間の計測のため置き) は、最初の SocketTele.emit のフレームにだけ書いた。(4) 計測の socket は、ログインしたときだけ開く (plugins/tele.ts 14 行目、63 行目)。この画面ではログインしていないので、socket.emit はほぼ通らない。サインインの成功の通知 (66 行目) も、トークンを置いた直後 (64 行目) に同じ流れで送るので、まだ socket が無く、ブラウザにためられ、トークンの変化を見張るプラグインの処理 (別の入口 shell_s.plugin.tele) が socket を開いたときに送る (utils/teleUtils.ts 73 行目)。状態で決まる条件で、固定の値で閉じていないので、消さずに conditional で書いた。socket.io の送り先の path の書き方は、ほかの入口にまだ例が無いので /socket.io と書いた (送り先は、appInfo.ncSiteUrl の path に /socket.io を足したもの)。(5) Google と OpenID Connect のボタンは、window.location.href で、バックエンドの認証の開始の URL (`${appInfo.ncSiteUrl}/auth/google` など) へ画面ごと移る。入口の一覧の画面ではなく、データの呼び出しでもないので、links の navigate に、式のまま target を書き、ncSiteUrl がバックエンドの応答で決まるので unknown (not_traceable_in_repo) にした。(6) signIn の 55 行目の if (!formValidator.value.validate()) return は、validate() が Promise を返すので、実際には打ち切らない。入力の検証を通ったときだけ送信が動くのは、a-form の @finish (132 行目) による。(7) useAuthLastMethod の commitAuthMethod / isLastUsed / stageAuthMethod、useGlobal の token と lang、計測のため置き (holdSignedOutTele) は、localStorage と sessionStorage の読み書きなので、I/O に書かなかった。useBranding はこの版では固定の値を返すだけ (composables/useBranding.ts 20 行目)、useSidebar は横のメニューを出さない印を置くだけなので、フレームにしなかった。言語の切り替えの setI18nLanguage は、言語のファイルを画面の部品として読み込む (plugins/a.i18n.ts 40 行目) だけで、データの読み書きではないので辿らなかった。(8) nuxt.config.ts は有償版の設定 (ee/) を extends する作りで、useGlobal、useAuthLastMethod、useBranding、tele のプラグインなどは、有償版では上書きされうる。(9) 全部の API の呼び出しに掛かる応答の差し込み (トークンの更新、composables/useApi/interceptors.ts) は、この入口に固有でないので辿らなかった。useApi が足す読み込み中と誤りの状態の差し込み (composables/useApi/index.ts 102 行目、125 行目) は、ボタンの読み込み中の表示と誤りの文に使われるだけなので、page の summary に書いた。(10) レビューの指摘のうち、入力の検証のルールに、メールとパスワードが必須 (pages/signin.vue 35 行目、50 行目) であることを足す指摘 (low) は、直さなかった。分析の skill が「入力が空でないことだけの確認は、rules に書かない」と決めているため。"
