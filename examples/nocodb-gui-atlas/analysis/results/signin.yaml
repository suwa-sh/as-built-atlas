summary:
  status: interpretation
  value: "メールとパスワードでサインインする画面。URL は /signin で、入れ子の親を持たない葉の page。名前の無い NuxtLayout (既定の default の layout) の中に描かれる (layout は辿らない)。フォームを送ると、入力の検証を通ったときだけバックエンドのサインインの API を呼び、成功すればトークンを保存して、URL のクエリを付けたままトップ (/) へ移る。失敗すれば、誤りの文をボタンの上に出す。バックエンドの設定 (appInfo) で、Google と OpenID Connect の続けるボタンを出し (押すとバックエンドの認証の開始の URL へ移る)、メールでのサインインを止めていればフォームを出さず、招待だけの登録なら登録の画面への案内を出さない。パスワードを忘れたときの画面への案内もある。サインインの成功と失敗、方式のボタン、見本の場面の切り替え、言語の切り替えで、計測の通知を送るが、ログインしていない間は、認証の通知はブラウザにためてログインの後に送り、それ以外は捨てる"
  evidence:
    - { file: pages/signin.vue, line: 61 }
    - { file: pages/signin.vue, line: 90 }
    - { file: pages/signin.vue, line: 132 }
    - { file: pages/signin.vue, line: 64 }
