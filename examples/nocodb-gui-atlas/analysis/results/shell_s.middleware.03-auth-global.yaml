summary:
  status: interpretation
  value: "画面を移るたびに動く global の route middleware (ファイル名の順で、01.redirect.global と 02.security.global の後、04.payment.global の前に動く 3 つ目)。ログインの状態を確かめ、必要なら画面を移す。まず URL の ui-redirect を見て移り先を作る。ログインしておらず Google などのログインが有効で、URL に認可の code があれば、code をバックエンドでトークンに換えてログインし、ページを読み直す。URL に short-token があれば、長く使えるトークンに換えてログインし、ページを読み直す (2 段階の認証が要るときは、どちらも /signin へ移す)。公開の page (meta の public) と共有の base (URL の typeOrId が base) は、ここで通す。ログインが要る page でログインしていなければ、最初の利用者なら /signup へ、そうでなければ refresh token でトークンを作り直し、それでもログインしていなければ、戻り先を付けて /signin へ移す。ログインが要らない page (signin など) にログイン済みで来たら、元の画面か / へ戻す。ログイン済みでログインが要る page では、meta の allowedRoles の役割が無ければ / へ戻し、別の base へ移るときは役割を読み直して、guest なら / へ戻す"
