notes: "(1) checkForRedirect、tryGoogleAuth、tryShortTokenAuth、toTwoFactorChallenge、isSafeContinuePath などは、同じファイルの中の外に出していない補助の関数なので、フレームにせず、入口のフレームの処理として扱った (その中の API の呼び出しは、入口のフレームの下の external フレームにした)。(2) トークンの交換 (genTokenByCode、long-lived-token) と作り直し (token/refresh) は、SDK の関数 (api.<モジュール>.<関数>) ではなく、SDK の Api が持つ axios の instance に URL の文字列を渡して呼んでいる。conventions の sdk:<モジュール>.<関数> の書き方が当たらないので、プロファイルのとおり path を <HTTP メソッド> <URL の形> で書いた。baseURL は実行時の設定 ncBackendUrl か、本番では / (lib/constants.ts 46 行目、composables/useApi/index.ts 11 行目) なので、接頭辞を足さず、コードの URL のまま書いた。kind は library にした。(3) useGlobal().signOut は、この入口の木の中のどの呼び出しも skipApiCall に固定の値 true を渡し (165 行目、281 行目、composables/useGlobal/actions.ts 127 行目)、redirectToSignin を渡さない。そのため auth.signout の API と、/signin への移動は閉じている。残りはブラウザの中の状態を消すだけで読み書きが無いので、conventions の決まりで、フレームにしなかった。stageTwoFactorChallenge は、この版では何もしない関数 (actions.ts 253 行目) なので、フレームにしなかった。(4) checkForRedirect の navigateTo(url) の戻り値は、107 行目で捨てられている。Nuxt の route middleware の中の navigateTo は、移動せずに行き先を返す作りと読めるので、ui-redirect の移動は、ここでは効かない疑いがある (Nuxt のソースは scope に無く、node_modules も入っていないので確かめていない)。links には書いたまま、note に書いた。(5) トークンの作り直しが成功すると、134 行目の分岐の中で終わり、else の中の allowedRoles と guest の確認は、その移動では行われない (197 行目、210 行目は else の中)。(6) /sso は、pages の下に当たる page が無い (有償版の page と見える) ので、entry_id を書かなかった。(7) nuxt.config.ts は有償版の設定 (ee/) を extends する作りで、useGlobal と useRoles は有償版では上書きされうる。(8) localStorage (continueAfterSignIn、nc-auth-last-method、複数のタブでの作り直しの錠)、sessionStorage、cookie (nc_token) の読み書きは、プロファイルの決まりで I/O に書かなかった。(9) 全部の API の呼び出しに掛かる応答の差し込み (トークンの更新) は、conventions の決まりで辿らなかった。(10) 綴りは、既にある結果 index.typeOrId_d.form.viewId_d に合わせた (host (backend)、sdk:<モジュール>.<関数>、useGlobal.signIn の形の name、/ の entry_id は index.index)。(11) レビューの指摘 4 件 (medium 1、low 3) はすべて直した。作り直しの失敗で状態を消すルールは、middleware の 162 行目の分岐がこの版では通らないため、refresh_token のフレームへ移した。(12) else の枝 (195 行目) は、ログインしていない利用者が requiresAuth が false の page に来たときも通るが、そうした page に baseId の段も allowedRoles も見当たらないので、load_roles の条件と guards は「ログイン済みで」のままにした。"
