summary:
  status: interpretation
  value: "公開された (共有した) フォームのビューを開く入れ子の親の page。URL は /:typeOrId/form/:viewId で、親の page pages/index.vue の共有フォーム用の分岐 (名前の無い NuxtLayout) と pages/index/[typeOrId].vue の中に描かれ、この page 自身も名前の無い NuxtLayout (既定の default の layout) で包む (layout と親の page は辿らない)。開くと、URL の viewId で共有ビューの定義 (表の定義、列、フォームの設定、関連する表の定義) をバックエンドから読み、合言葉が要るときは合言葉の入力の小窓を出して読み直し、見つからないときは「ページが無い」表示を出す。読めたときだけ、子の page を NuxtPage に描く。子の page は [viewId]/index (その中に [viewId]/index/index と [viewId]/index/survey を描く) で、フォームの送信は子の page の側にあり、ここでは辿らない。URL のクエリで、リンクの列に値を前もって入れる設定のときは、リンク先のレコードも読む"
  evidence:
    - { file: "pages/index/[typeOrId]/form/[viewId].vue", line: 18 }
    - { file: "pages/index.vue", line: 86 }
    - { file: "pages/index.vue", line: 153 }
