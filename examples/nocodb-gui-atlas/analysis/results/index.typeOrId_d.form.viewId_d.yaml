    - { file: "pages/index/[typeOrId]/form/[viewId].vue", line: 58 }
    - { file: "pages/index/[typeOrId]/form/[viewId]/index.vue", line: 46 }
    - { file: "composables/useSharedFormViewStore.ts", line: 946 }
notes: "(1) この page は useProvideSharedFormStore で共有フォームの状態の置き場を作るが、画面がその場で呼ぶのは loadSharedView だけ。送信 (submitForm、api.public.dataCreate) などは子の page が使うので辿らなかった。(2) useProvideSmartsheetStore は、この page が shared に固定の値 true を渡す (pages/index/[typeOrId]/form/[viewId].vue の 28 行目)。そのため isPublic が常に true になり (composables/useSmartsheetStore.ts 35 行目、150 行目)、閲覧者向けの保存済みフィルタの読み込み (loadSavedFiltersForViewer の internalGet、operation filterList、324 行目) は 312 行目で必ず返る。固定の値で閉じている呼び出しとして辿らず、その先に読み書きが無いので useProvideSmartsheetStore もフレームにしなかった (閉じた呼び出しは、入口のフレームの summary の note にも書いた)。(3) useEeConfig の showRecordPlanLimitExceededModal と useViewRowColorProvider は、この版では何もしない関数 (composables/useEeConfig.ts 232 行目、composables/viewRowColor/useViewRowColorProvider.ts 1 行目) なので、フレームにしなかった。nuxt.config.ts は ee の設定を extends する作り (190 行目の注記) で、有償版では上書きされうるが、ee のソースはこのリポジトリの範囲に無い。(4) definePageMeta の public: true は、global の middleware (別の入口) が読む印なので、この入口の guards に書かなかった。合言葉の照合はサーバー側で行われ、画面は誤りの応答を受けて小窓を出すだけなので、guards ではなく rules (decision) に書いた。表へのレコード追加の許可 (isAllowed) は、先へ進むのを止めず列を読み取り専用にするだけなので、rules (decision) に書いた。(5) api は useApi が作る nocodb-sdk の Api (composables/useApi/index.ts 61 行目、13 行目) で、SDK のソース (packages/nocodb-sdk) は範囲の外なので、path を sdk:<モジュール>.<関数> で書いた。全部の呼び出しに掛かる応答の差し込み (トークンの更新、composables/useApi/interceptors.ts) は、この入口に固有ではないので辿らなかった。(6) 合言葉の入力欄の送信 (@finish と、ボタンの @click) も loadSharedView を呼ぶが、同じ関数なのでフレームを分けず、loadSharedView のフレームの summary に書いた。(7) 「ページが無い」表示の部品 (GeneralPageDoesNotExist) は、データに届かないが、ほかの入口への遷移 (navigateTo('/')) を持つので、フレームにして navigateTo で閉じた。行き先の / は、入れ子の親 index と子 index.index の両方に当たるが、実際に描かれる葉の page の index.index を entry_id にした。(8) analysis/results に、ほかの入口の結果がまだ無いので、綴りは、コードの書き方をそのまま使った。"
