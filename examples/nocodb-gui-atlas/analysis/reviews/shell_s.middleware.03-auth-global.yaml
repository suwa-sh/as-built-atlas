notes: "(1) 機械チェックは OK (作業定義の profile.dir から ui-nuxt のプロファイルを読めている)。(2) else の枝 (195 行目) は、ログインしていない利用者が requiresAuth が false の page に来たときにも通るので、load_roles の call.condition と role の guards の「ログイン済みで」は、厳密には狭い。ただし requiresAuth が false の page (signin、signup、共有の view など) には baseId の段が無く、allowedRoles を持つ page も見当たらないので、動きは変わらず、指摘にしなかった。(3) refresh_token のフレームの source は内側の _refreshToken (actions.ts 96 行目) で、middleware が実際に呼ぶのは useSharedExecutionFn が返す包み (composables/useSharedExecutionFn.ts 99 行目)。包みはブラウザの中の保存の錠を扱うだけで、summary にも書いてあるので、辿り漏れにしなかった。(4) checkForRedirect の navigateTo の戻り値を 107 行目で捨てている件は、分析の note のとおり。Nuxt の route middleware の中の navigateTo は、移動せずに行き先を返す作りなので、ui-redirect の移動はここでは効かない疑いが強い。(5) URL の code と short-token を await の前に URL から消す処理 (224 行目、293 行目) は、二重の交換を防ぐ技術上の決まりで、業務のルールとしては数えなかった。(6) 綴りは、ほかの入口の結果 index.typeOrId_d.form.viewId_d と食い違いが無い (host (backend)、sdk:<モジュール>.<関数>、<composable>.<関数> の name)。"
