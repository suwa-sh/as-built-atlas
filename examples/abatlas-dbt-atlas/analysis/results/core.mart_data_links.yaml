notes: |
  - macro も package の macro も呼ばない (coalesce、string_agg、count は DuckDB の組み込み関数で、project や package の macro ではない) ので、入口のフレーム 1 つだけの結果にした
  - lv_host から lv_object までの 16 列は、1 つの式 (levels_key) に連結され、その levels_key が集計の区切りと結合の条件に使われる。式の中で読む列なので read、区切りと結合に効くので filter も付けた (context.md も skill も、導出した列を区切りに使うときの扱いを決めていない)
  - stg_io と stg_entries は join ... using (entry_id) で結ぶ。select するのは e.entry_id (stg_entries 側) で、後で a.entry_id <> b.entry_id に使うので、stg_entries の entry_id は read と filter、stg_io の entry_id は結合だけの filter にした (レビューの指摘で入れ替えた)
  - stg_entries の path は select して string_agg で連結し、その中の order by path で並べ替えにも使うので read と filter にした
  - schema は dbt_project.yml の +schema (staging / mart) を、project の generate_schema_name (custom_schema_name をそのまま使う) で作った名前にした。generate_schema_name はフレームにしなかった
  - dbms は profiles.yml の type: duckdb から書いた。database は env_var('ABATLAS_DUCKDB') で決まるので書かず、settings にも書かなかった
  - models/core/schema.yml の mart_data_links には列もテストも無く、範囲に tests/ も unit_tests も無いので、tests は書かなかった
