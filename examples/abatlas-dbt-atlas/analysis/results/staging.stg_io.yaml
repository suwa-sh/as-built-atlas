notes: |
  - seed の io は、範囲 (dbt-template) に CSV が無い (abatlas build が合成する)。dbt_project.yml の seeds の設定 (+schema: seed と io の column_types) を根拠に、seed の表 seed.io を読むと解釈した
  - schema は dbt_project.yml の +schema を、project の generate_schema_name (custom_schema_name をそのまま使う) で作った名前にした。generate_schema_name は model から呼ばれる macro ではなく dbt が暗黙に呼ぶので、フレームにしなかった
  - dbms は profiles.yml の type: duckdb から書いた。database は env_var('ABATLAS_DUCKDB') で決まるファイルの場所なので書かず、どの入口でも同じに効く接続の設定として settings にも書かなかった
  - schema.yml の stg_io にはテストが無く、範囲に tests/ も無いので、tests は書かなかった
