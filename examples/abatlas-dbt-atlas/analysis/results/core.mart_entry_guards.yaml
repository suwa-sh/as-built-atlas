notes: |
  - model は macro を呼ばない (ref だけ) ので、結果は入口のフレーム 1 つにした。CTE inner_count はフレームにせず summary に書いた
  - ref('stg_*') の相手は、analysis-conventions.md のとおり schema staging、table stg_* の view とした (dbt_project.yml の staging の +materialized / +schema と generate_schema_name を根拠に interpretation)
  - schema は dbt_project.yml の core の +schema: mart を generate_schema_name がそのまま使うので mart。dbms は profiles.yml の type: duckdb。database は env_var('ABATLAS_DUCKDB') で決まるので書かず、settings にも書かなかった
  - join (using / on) と group by と order by に使う列は filter にした。order by は表を作るときの並べ替えだが、skill の「並べ替えの条件に使う列は filter」に従った
  - inner join で、入口の一覧 (stg_entries) とフレーム (stg_frames) に対応が無い確認の行は落ちるが、業務の絞り込みではなく対応付けなので rules に書かなかった。guard_key の組み立ても行の識別子を作るだけなので rules に書かなかった
  - models/core/schema.yml の mart_entry_guards には列のテストが無く、範囲に tests/ も unit_tests も無いので、tests は書かなかった
