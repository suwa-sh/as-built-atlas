notes: "読み書き 5 件の段と列は、すべてコードと合っていた (stg_guards の entry_id / frame_id / idx は guard_key の式で読み、結合と並べ替えに使うので read と filter、stg_frames の seq は order by だけなので filter、作る表の 9 列は select の 8 から 12 行と一致)。ref('stg_*') を schema staging の view とし、dbt_project.yml の 218 / 219、generate_schema_name.sql の 6、profiles.yml の 6 を根拠に interpretation とした書き方、作る表を schema mart の table とし 221 / 222 を io とフレームの summary の両方の根拠に入れた書き方は analysis-conventions.md のとおり。staging の model に alias は無い。macro の呼び出しも hook も無いので、入口のフレーム 1 つで辿り漏れは無い。inner join で対応の無い行が落ちることと guard_key の組み立てを rules に書かなかった判断は、context.md の「業務の意味を持つ絞り込み」に当たらないとみて指摘にしなかった。schema.yml の mart_entry_guards に列のテストは無く、範囲に tests/ も unit_tests も無いので、tests の漏れは無い。ルールの status が fact なのは、count(distinct) と coalesce をそのまま言い換えたものなので妥当とみた。"
