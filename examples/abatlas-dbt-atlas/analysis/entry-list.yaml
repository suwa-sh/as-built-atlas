  path: /core/mart_call_conditions
  layer: model
  source:
    file: models/core/mart_call_conditions.sql
    line: 1
  extractor: dbt-models
  status: candidate
  name: mart_call_conditions
  attributes:
    file_segments:
    - core
    - mart_call_conditions
    incremental: false
    ephemeral: false
