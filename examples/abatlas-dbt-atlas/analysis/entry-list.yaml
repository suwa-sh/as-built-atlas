format_version: 1
target:
  repo: github.com/suwa-sh/as-built-atlas
  name: as-built-atlas の集計 (dbt)
  clone_path: ../as-built-atlas
  scope: dbt-template
  commit: 3bf40cb
profile:
  id: transform-dbt
  version: 0.1.0
extractors:
- name: dbt-models
  run: abatlas-extract glob
  layer: model
  rationale: dbt_project.yml の model-paths は既定の models のまま。Python の model と、無効にした
    model (enabled false) は無いので、既定の params をそのまま使う。snapshot-paths の指定も snapshots/
    のフォルダも無いので、dbt-snapshots は書かない
  params:
    files:
    - models/**/*.sql
    segments:
      strip_prefix: models
      drop_last: false
      replace:
      - pattern: \.sql$
        with: ''
    contains:
      incremental: materialized\s*=\s*['"]incremental['"]
      ephemeral: materialized\s*=\s*['"]ephemeral['"]
entries:
