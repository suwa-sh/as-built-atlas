id: tax_rate_refresh
namespace: weekly
description: |
  税率 API から最新の税率表を取り、shop.tax_rates を更新する
labels:
  owner: commerce-platform
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh tax_rate_refresh
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 0"
    timezone: Asia/Tokyo
