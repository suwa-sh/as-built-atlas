id: cohort_retention
namespace: weekly
description: |
  初回購入月ごとのコホートで週次の継続率を計算し、mart.cohort_retention と CSV (S3) に出す
labels:
  owner: data-platform
inputs:
  - id: week_start
    type: DATE
    required: false
    description: 週の初日 (月曜)
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh cohort_retention --week-start "{{ inputs.week_start }}"
