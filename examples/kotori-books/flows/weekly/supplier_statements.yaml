id: supplier_statements
namespace: weekly
description: |
  仕入先ごとの週次明細 (入荷と発注) を CSV にまとめ、メールで送る
labels:
  owner: warehouse
inputs:
  - id: week_start
    type: DATE
    required: false
    description: 週の初日 (月曜)
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh supplier_statements --week-start "{{ inputs.week_start }}"
