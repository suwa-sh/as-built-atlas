id: segment_customers
namespace: daily.customer
description: |
  購入回数と最終購入日から顧客をセグメント (new / active / dormant / churned) に分け、mart.customer_segments を入れ替える
labels:
  owner: crm
inputs:
  - id: date
    type: DATE
    required: false
    description: 処理対象日 (省略時は実行日)
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh segment_customers --date "{{ inputs.date }}"
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 3 * * *"
    timezone: Asia/Tokyo
