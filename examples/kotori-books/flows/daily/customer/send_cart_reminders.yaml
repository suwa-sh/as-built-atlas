id: send_cart_reminders
namespace: daily.customer
description: |
  24 時間以上放置されたカートの持ち主にリマインドメールを送る。1 顧客 1 日 1 通に制限する
labels:
  owner: crm
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh send_cart_reminders
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    timezone: Asia/Tokyo
