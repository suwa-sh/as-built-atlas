id: fx_rates
namespace: daily
description: |
  為替レートを外部 API から取り込み、shop.exchange_rates に追加して Redis に当日分を置く
labels:
  owner: commerce-platform
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh fx_rates
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 0 * * *"
    timezone: Asia/Tokyo
