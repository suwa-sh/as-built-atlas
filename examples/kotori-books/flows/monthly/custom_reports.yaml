id: custom_reports
namespace: monthly
description: |
  audit.report_definitions に登録された SQL (利用部門が管理画面から登録する) を月初に実行し、結果を定義ごとの CSV にして S3 に置く
labels:
  owner: data-platform
inputs:
  - id: month
    type: STRING
    required: false
    description: 対象月 (YYYY-MM)
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh custom_reports --month "{{ inputs.month }}"
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 1 * *"
    timezone: Asia/Tokyo
