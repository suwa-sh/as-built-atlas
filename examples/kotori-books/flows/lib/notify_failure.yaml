id: notify_failure
namespace: lib
description: |
  他の Flow の errors から呼ばれ、失敗した Flow の名前と実行 ID をチャットに通知する
labels:
  owner: sre
inputs:
  - id: flow_id
    type: STRING
    required: false
    description: 失敗した Flow
  - id: execution_id
    type: STRING
    required: false
    description: 失敗した実行の ID
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh notify_failure --flow-id "{{ inputs.flow_id }}" --execution-id "{{ inputs.execution_id }}"
