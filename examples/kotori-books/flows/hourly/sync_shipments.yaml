id: sync_shipments
namespace: hourly
description: |
  配送中の出荷の追跡情報を配送業者 API から取り、shop.shipments の状態を更新する
labels:
  owner: warehouse
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh sync_shipments
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 * * * *"
    timezone: Asia/Tokyo
