id: abandoned_carts_snapshot
namespace: hourly
description: |
  Redis のカートを毎時なめて、放置カートの件数と金額を audit.cart_snapshots に書く
labels:
  owner: crm
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh abandoned_carts_snapshot
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5 * * * *"
    timezone: Asia/Tokyo
