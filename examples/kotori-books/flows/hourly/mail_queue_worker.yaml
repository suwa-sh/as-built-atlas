id: mail_queue_worker
namespace: hourly
description: |
  キュー mail.requests を 10 分ごとに読み、メール API で送って audit.mail_log に記録する
labels:
  owner: crm
concurrency:
  limit: 1
  behavior: CANCEL
tasks:
  - id: run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    workingDirectory: /opt/kotori
    env:
      KOTORI_ENV: prod
    commands:
      - bash scripts/run_job.sh mail_queue_worker
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    timezone: Asia/Tokyo
