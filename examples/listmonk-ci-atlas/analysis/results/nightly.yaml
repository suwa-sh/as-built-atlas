summary:
  status: interpretation
  value: "毎日 UTC 2 時 (と手動) に動く nightly ビルドの workflow。check の job で、前の nightly のリリースが指すコミットがいまの HEAD と同じなら止める。変わっていれば、前の nightly のリリースとタグを消し、make dist の後に GoReleaser を --snapshot (公開しない) で動かしてバイナリの tar.gz とコンテナイメージを作り、run の docker push と docker buildx imagetools create で Docker Hub (listmonk/listmonk) と ghcr.io (knadh/listmonk) にイメージと manifest (nightly) を公開し、gh release create で GitHub に nightly のプレリリースを作って tar.gz を添付する"
  evidence:
    - { file: .github/workflows/nightly.yml, line: 4 }
    - { file: .github/workflows/nightly.yml, line: 31 }
    - { file: .github/workflows/nightly.yml, line: 41 }
    - { file: .github/workflows/nightly.yml, line: 86 }
