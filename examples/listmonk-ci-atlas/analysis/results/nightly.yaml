notes: "迷った点: (1) GoReleaser は --snapshot で公開しないので、公開の読み書きは goreleaser-action ではなく、run の中の docker push、docker buildx imagetools create、gh release create の external のフレームに書いた。.goreleaser-nightly.yml の docker_manifests と release の節は効かないと summary に書いた。(2) make の側のフレームは release と同じ id と綴りにし、根拠を .goreleaser-nightly.yml と nightly.yml に付け替えた。make-build-bin の rules の文は、入口をまたいで 1 つにまとまるよう release と同じにし、この入口で LISTMONK_VERSION が与えられることは note に書いた。(3) LISTMONK_VERSION は workflow が決まった形 (nightly-<日付>) で与える値で、処理の流れや読み書きの相手を変えないので settings に書かず、step と goreleaser-action の parameters と、Set nightly date の rules (calculation) に書いた。(4) nightly の job の condition は、context.md の「condition に、条件の式を書く」に従って式をそのまま書き、意味は note に書いた。(5) gh の 2>/dev/null || echo \"\" と || true は、continue-on-error と同じ扱い (always のまま、note に失敗しても進むことを書く) にした。(6) Verify Docker manifests (docker buildx imagetools inspect) は、表示するだけとも読めるが、レジストリの API を呼ぶので、外への呼び出しとしてフレームにした。(7) gh release delete --cleanup-tag のタグの削除は、決まりの表に無いので path を /repos/{owner}/{repo}/git/refs とし、別の読み書きにした。(8) links は無い。この workflow が作る nightly のタグは v で始まらないので release の workflow を起動せず、GITHUB_TOKEN による操作はほかの workflow を起動しない"
