format_version: 1
target:
  repo: github.com/knadh/listmonk
  name: listmonk の CI
  clone_path: ../listmonk
  scope: .
  commit: e735e0b23421192a4c1b18b6221f4708b872fcd5
profile:
  id: batch-github-actions
  version: 0.1.0
extractors:
- name: workflows
  run: abatlas-extract glob
  layer: workflow
  rationale: 範囲 (scope) がリポジトリの根なので、プロファイルの既定パラメータのまま使う。workflow は .github/workflows
    の直下に 6 件あり、すべて on を持つ。
  params:
    files:
    - .github/workflows/*.yml
    - .github/workflows/*.yaml
    segments:
      strip_prefix: .github/workflows
      drop_last: false
    line_match: '^(on|''on''|"on")\s*:'
    contains:
      schedule: '^\s*schedule\s*:'
      workflow_dispatch: ^\s*-?\s*workflow_dispatch\b|\[[^\]]*workflow_dispatch
      workflow_call: ^\s*-?\s*workflow_call\b|\[[^\]]*workflow_call
      push: ^\s*-?\s*push\b|\bon\s*:\s*\[?[^\]\n]*\bpush\b
      pull_request: ^\s*-?\s*pull_request(_target)?\b|\bon\s*:\s*\[?[^\]\n]*\bpull_request
entries:
