notes: "指摘にしなかったこと: (1) rules/0 の「最後の活動から 150 日」は、days-before-stale: 150 (13 行) とメッセージの文 after 5 months of inactivity (19・20 行) がそのまま支えるので fact のままでよいと判断した。(2) io/1 の /repos/{owner}/{repo}/pulls で PR を閉じる、という資源の分け方は action の中の実装次第 (PR も issue の API で閉じる可能性がある) だが、対象のファイルからは確かめられず、interpretation で note もあるので指摘にしない。(3) uses の版 (actions/stale@v9、11 行) がどの主張にも書かれていない。閉じるまでの 7 日などの既定の動きは版に依存するので、stale-action の call か summary の note に版を書いておくと、根拠が辿りやすい (指摘の種類に当たらないので notes に留める)。(4) 機械チェックは OK で、プロファイル batch-github-actions は作業定義の profile.dir から読めている。"
